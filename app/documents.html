<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents & communications · Morty's Auto Parts</title>
<link rel="stylesheet" href="/assets/books.css">
<style>
  header{background:#1f2937}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px}
  .grid label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px} .grid input,.grid select,.grid textarea{width:100%}
  .lib{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:start}
  @media(max-width:860px){.lib{grid-template-columns:1fr}}
  .tree a{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;border-radius:7px;color:inherit;text-decoration:none;font-size:13px;cursor:pointer}
  .tree a:hover{background:var(--chip)} .tree a.on{background:var(--navy);color:#fff}
  .tree h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 8px 4px}
  .tree small{opacity:.7}
  .search{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px} .search input[type=search]{flex:1 1 260px;font-size:15px;padding:9px 11px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px} .filters select,.filters input{font-size:12.5px}
  .doc-row{cursor:pointer} .doc-row:hover{background:var(--chip)}
  .snip{font-size:12px;color:var(--muted);margin-top:2px} .snip mark{background:#fde68a;color:inherit}
  .chip{display:inline-block;font-size:11px;background:var(--chip);border-radius:999px;padding:1px 7px;margin:2px 3px 0 0}
  .conf-public{} .conf-internal{} .conf-confidential{background:#f59e0b22;color:#b45309} .conf-restricted{background:#dc262622;color:#b91c1c}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .thumb{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);cursor:pointer}
  .thumb .im{aspect-ratio:1;background:#f3f4f6 center/contain no-repeat;display:grid;place-items:center;font-size:34px}
  .thumb .t{padding:6px 8px;font-size:12px;line-height:1.3}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:13px} .kv b{color:var(--muted);font-weight:600}
  .picker{position:relative} .picker .res{position:absolute;z-index:5;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .picker .res div{padding:6px 9px;cursor:pointer;font-size:13px} .picker .res div:hover{background:var(--chip)}
  .msg{border-left:3px solid var(--line);padding:6px 10px;margin:6px 0;background:var(--card);border-radius:0 8px 8px 0}
  .msg.in{border-left-color:#2563eb} .msg.out{border-left-color:#16a34a} .msg.failed{border-left-color:var(--red)}
  .msg .h{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
  .msg .b{white-space:pre-wrap;font-size:13px;margin-top:3px;max-height:7.5em;overflow:hidden}
  .msg.open .b{max-height:none}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)} .drop.over{border-color:var(--navy);background:var(--chip)}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;word-break:break-all}
  .modal .card{max-width:860px}
  .btn{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;background:var(--card);color:inherit;text-decoration:none;cursor:pointer;line-height:1.3}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
  button.danger{background:#fff;border-color:var(--red);color:var(--red)}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<header><h1>🗂 Documents & communications</h1><nav><a href="/system.html">System</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="out"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script src="/assets/books-common.js?v=20261019"></script>
<script>
(function () {
  'use strict';
  var B = window.Books, $ = B.$, all = B.all, esc = B.esc, api = B.api, toast = B.toast, modal = B.modal, close = B.close, dt = B.dt;
  var meta = null, tab = 'library', lib = { folder: '', category: '', q: '', conf: '', status: '', tag: '', from: '', to: '', etype: '', sort: '', view: 'list', offset: 0 };
  var CATL = {}, FOLDERS = [], ENT = {};
  var val = function (id) { var el = $('#' + id); return el ? (el.type === 'checkbox' ? el.checked : el.value) : undefined; };
  var fail = function (e) { toast(e.message || String(e)); };
  var size = function (b) { b = Number(b || 0); return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : b > 1024 ? Math.round(b / 1024) + ' KB' : b ? b + ' B' : ''; };
  var day = function (d) { return d ? new Date(d).toISOString().slice(0, 10) : ''; };
  var confPill = function (c) { return '<span class="pill conf-' + esc(c) + '">' + esc(c) + '</span>'; };
  var STATUS = { active: '', draft: 'warn', submitted: 'warn', approved: 'ok', rejected: 'bad', archived: '' };
  var statusPill = function (s) { return s && s !== 'active' ? '<span class="pill ' + (STATUS[s] || '') + '">' + esc(s) + '</span>' : ''; };
  var icon = function (m, f) { m = m || ''; f = String(f || '').toLowerCase();
    return /^image\//.test(m) ? '🖼' : /pdf/.test(m) ? '📕' : /word|odt|\.docx?$/.test(m + f) ? '📘' : /sheet|excel|csv|ods/.test(m) ? '📗' : /presentation|powerpoint/.test(m) ? '📙' : /html/.test(m) ? '📝' : /zip/.test(m) ? '🗜' : /rfc822|outlook/.test(m) ? '✉' : '📄'; };
  var expiryText = function (d) {
    if (!d) return ''; var days = Math.round((new Date(day(d)) - new Date(day(new Date()))) / 86400000);
    return days < 0 ? '<span class="bad">expired ' + day(d) + '</span>' : days <= 30 ? '<span class="pill warn">expires ' + day(d) + '</span>' : 'expires ' + day(d);
  };
  function field(id, label, value, type, extra) { return '<div><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(value == null ? '' : value) + '" ' + (extra || '') + '></div>'; }
  function sel(id, label, opts, value) { return '<div><label for="' + id + '">' + label + '</label><select id="' + id + '">' + opts.map(function (o) { o = Array.isArray(o) ? o : [o, o]; return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(value == null ? '' : value) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select></div>'; }
  function area(id, label, value, rows) { return '<div style="grid-column:1/-1"><label for="' + id + '">' + label + '</label><textarea id="' + id + '" rows="' + (rows || 3) + '">' + esc(value || '') + '</textarea></div>'; }
  var catOpts = function (blank) { return (blank ? [['', blank]] : []).concat(meta.categories.filter(function (c) { return c.key !== 'template'; }).map(function (c) { return [c.key, c.label]; })); };
  var folderOpts = function (blank) { return [['', blank || '— by category —']].concat(FOLDERS.map(function (f) { return [f.id, (f.parent_id ? '  └ ' : '') + f.name]; })); };
  var confOpts = function () { return meta.perms.levels.concat(meta.perms.manage ? meta.confidentiality.filter(function (c) { return meta.perms.levels.indexOf(c) < 0; }) : []).map(function (c) { return [c, c]; }); };

  // Upload with a progress-free multipart POST (api() only speaks JSON).
  function upload(url, fd) {
    return fetch(url, { method: 'POST', body: fd, credentials: 'same-origin' }).then(function (r) {
      if (r.status === 401) { location.href = '/admin.html'; throw new Error('Sign in required'); }
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || ('Error ' + r.status)); e.dup = j.duplicate; throw e; } return j; });
    });
  }

  // A search-as-you-type picker for any record type: calls back with {type,id,label}.
  function picker(host, onPick, type0) {
    host.innerHTML = '<div class="controls" style="margin:0"><div><label>Record type</label><select class="pt">' + meta.entities.map(function (e) { return '<option value="' + e.key + '"' + (e.key === type0 ? ' selected' : '') + '>' + esc(e.label) + '</option>'; }).join('') +
      '</select></div><div class="picker" style="flex:1 1 220px"><label>Find</label><input class="pq" placeholder="Type a name, number…" autocomplete="off" style="width:100%"><div class="res" hidden></div></div></div>';
    var t = host.querySelector('.pt'), q = host.querySelector('.pq'), r = host.querySelector('.res'), h = null;
    var go = function () {
      clearTimeout(h); h = setTimeout(function () {
        api('/api/docs/entities/' + t.value + '?q=' + encodeURIComponent(q.value)).then(function (d) {
          r.hidden = false;
          r.innerHTML = d.results.length ? d.results.map(function (x) { return '<div data-id="' + esc(x.id) + '">' + esc(x.label) + '</div>'; }).join('') : '<div style="color:var(--muted)">Nothing found</div>';
          all('[data-id]', r).forEach(function (el) { el.onclick = function () { r.hidden = true; q.value = ''; onPick({ type: t.value, id: el.dataset.id, label: el.textContent }); }; });
        }).catch(fail);
      }, 200);
    };
    q.oninput = go; q.onfocus = go; t.onchange = function () { q.value = ''; r.hidden = true; };
    document.addEventListener('click', function (e) { if (!host.contains(e.target)) r.hidden = true; });
  }

  // --------------------------------------------------------------- start --
  function start() {
    api('/api/docs/meta').then(function (m) {
      meta = m; FOLDERS = m.folders;
      m.categories.forEach(function (c) { CATL[c.key] = c.label; });
      m.entities.forEach(function (e) { ENT[e.key] = e.label; });
      var p = m.perms, s = m.stats, t = [['library', 'Library'], ['upload', '＋ File a document'], ['forms', 'Forms & templates'], ['mine', 'My documents']];
      if (p.approve) t.push(['approvals', 'Approvals' + (s.awaiting ? ' (' + s.awaiting + ')' : '')]);
      t.push(['expiring', 'Expiring' + (s.expired + s.expiring ? ' (' + (s.expired + s.expiring) + ')' : '')], ['records', 'By record'], ['images', 'Inventory images'], ['assets', 'Assets']);
      if (p.comms) t.push(['comms', 'Communications']);
      if (p.manage) t.push(['admin', 'Manage']);
      $('#tabs').innerHTML = t.map(function (x) { return '<button data-t="' + x[0] + '"' + (x[0] === tab ? ' class="on"' : '') + '>' + esc(x[1]) + '</button>'; }).join('');
      all('[data-t]').forEach(function (b) { b.onclick = function () { tab = b.dataset.t; all('[data-t]').forEach(function (x) { x.classList.toggle('on', x === b); }); show(); }; });
      var h = (location.hash || '').slice(1); if (h && t.some(function (x) { return x[0] === h; })) { tab = h; all('[data-t]').forEach(function (x) { x.classList.toggle('on', x.dataset.t === tab); }); }
      show();
    }).catch(function (e) { $('#out').innerHTML = '<div class="card"><p class="bad">' + esc(e.message) + '</p></div>'; });
  }
  function refreshMeta() { return api('/api/docs/meta').then(function (m) { meta = m; FOLDERS = m.folders; }); }
  function show() {
    history.replaceState(null, '', '#' + tab);
    ({ library: library, upload: uploadTab, forms: forms, mine: mine, approvals: approvals, expiring: expiring, records: records, images: images, assets: assets, comms: comms, admin: admin }[tab] || library)();
  }

  // ------------------------------------------------------------- library --
  function library() {
    var s = meta.stats;
    var tree = '<div class="card tree"><a data-f="" class="' + (!lib.folder && !lib.category ? 'on' : '') + '">📚 Everything <small>' + s.total + '</small></a>' +
      '<h3>Folders</h3>' + FOLDERS.filter(function (f) { return !f.parent_id; }).map(function (f) {
        var kids = FOLDERS.filter(function (k) { return k.parent_id === f.id; });
        return '<a data-f="' + f.id + '" class="' + (String(lib.folder) === String(f.id) ? 'on' : '') + '">📁 ' + esc(f.name) + ' <small>' + f.count + '</small></a>' +
          kids.map(function (k) { return '<a data-f="' + k.id + '" style="padding-left:22px" class="' + (String(lib.folder) === String(k.id) ? 'on' : '') + '">└ ' + esc(k.name) + ' <small>' + k.count + '</small></a>'; }).join('');
      }).join('') +
      (meta.tags.length ? '<h3>Tags</h3><div style="padding:0 6px">' + meta.tags.map(function (t) { return '<span class="chip" style="cursor:pointer" data-tag="' + esc(t.tag) + '">#' + esc(t.tag) + ' ' + t.count + '</span>'; }).join('') + '</div>' : '') + '</div>';
    $('#out').innerHTML = '<div class="tiles">' +
      '<div class="tile"><span>Documents</span><b>' + s.total + '</b></div><div class="tile"><span>Storage</span><b>' + size(s.bytes) + '</b></div>' +
      '<div class="tile click' + (s.expired ? ' bad' : '') + '" data-go="expiring"><span>Expired / expiring</span><b>' + s.expired + ' / ' + s.expiring + '</b></div>' +
      '<div class="tile click" data-go="approvals"><span>Waiting for approval</span><b>' + s.awaiting + '</b></div><div class="tile click" data-go="forms"><span>Templates</span><b>' + s.templates + '</b></div></div>' +
      '<div class="lib">' + tree + '<div><div class="card">' +
      '<div class="search"><input type="search" id="q" placeholder="Search titles, contents, numbers (DOC-12), tags, people, suppliers…" value="' + esc(lib.q) + '"><button class="primary" id="go">Search</button>' +
      '<button id="vw" title="List or pictures">' + (lib.view === 'grid' ? '☰ List' : '▦ Pictures') + '</button></div>' +
      '<div class="filters">' +
      '<select id="fc">' + catOpts('All categories').map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === lib.category ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>' +
      '<select id="fconf"><option value="">Any level</option>' + meta.perms.levels.map(function (c) { return '<option' + (c === lib.conf ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
      '<select id="fst"><option value="">Any status</option>' + ['active', 'draft', 'submitted', 'approved', 'rejected', 'archived'].map(function (c) { return '<option' + (c === lib.status ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
      '<select id="fe"><option value="">Linked to anything</option>' + meta.entities.map(function (e) { return '<option value="' + e.key + '"' + (e.key === lib.etype ? ' selected' : '') + '>Linked to a ' + esc(e.label.toLowerCase()) + '</option>'; }).join('') + '</select>' +
      '<input type="date" id="ffrom" value="' + esc(lib.from) + '" title="Filed from"><input type="date" id="fto" value="' + esc(lib.to) + '" title="Filed to">' +
      '<select id="fsort">' + [['', 'Best match / newest'], ['new', 'Newest'], ['old', 'Oldest'], ['title', 'Title A–Z'], ['number', 'Number'], ['expiry', 'Expiry date'], ['size', 'Largest']].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === lib.sort ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
      (lib.tag ? '<span class="chip">#' + esc(lib.tag) + ' <a href="#" id="untag">✕</a></span>' : '') + '</div></div>' +
      '<div id="res"><div class="empty">Searching…</div></div></div></div>';
    all('[data-go]').forEach(function (x) { x.onclick = function () { var b = $('[data-t="' + x.dataset.go + '"]'); if (b) b.click(); }; });
    all('[data-f]').forEach(function (a) { a.onclick = function () { lib.folder = a.dataset.f; lib.category = ''; lib.offset = 0; library(); }; });
    all('[data-tag]').forEach(function (a) { a.onclick = function () { lib.tag = a.dataset.tag; lib.offset = 0; library(); }; });
    if ($('#untag')) $('#untag').onclick = function (e) { e.preventDefault(); lib.tag = ''; library(); };
    var read = function () { lib.q = val('q'); lib.category = val('fc'); lib.conf = val('fconf'); lib.status = val('fst'); lib.etype = val('fe'); lib.from = val('ffrom'); lib.to = val('fto'); lib.sort = val('fsort'); lib.offset = 0; results(); };
    $('#go').onclick = read; $('#q').onkeydown = function (e) { if (e.key === 'Enter') read(); };
    ['fc', 'fconf', 'fst', 'fe', 'ffrom', 'fto', 'fsort'].forEach(function (id) { $('#' + id).onchange = read; });
    $('#vw').onclick = function () { lib.view = lib.view === 'grid' ? 'list' : 'grid'; library(); };
    results();
  }
  function qs(o) { return Object.keys(o).filter(function (k) { return o[k] !== '' && o[k] != null; }).map(function (k) { return k + '=' + encodeURIComponent(o[k]); }).join('&'); }
  function results(extra, host) {
    host = host || $('#res');
    var p = extra || { q: lib.q, folder: lib.folder, category: lib.category, conf: lib.conf, status: lib.status, tag: lib.tag, from: lib.from, to: lib.to, entity_type: lib.etype, sort: lib.sort, offset: lib.offset, limit: 50 };
    api('/api/docs/search?' + qs(p)).then(function (d) { host.innerHTML = docList(d.documents, d.total, p, !extra && lib.view === 'grid'); wireList(host, p, extra); }).catch(function (e) { host.innerHTML = '<div class="card bad">' + esc(e.message) + '</div>'; });
  }
  function docList(docs, total, p, grid) {
    if (!docs.length) return '<div class="card"><div class="empty">No documents' + (p.q ? ' match "' + esc(p.q) + '"' : ' here yet') + '.</div></div>';
    var pager = total > docs.length ? '<div class="controls" style="margin-top:8px"><span class="sub">' + (Number(p.offset || 0) + 1) + '–' + (Number(p.offset || 0) + docs.length) + ' of ' + total + '</span>' +
      (p.offset > 0 ? '<button data-pg="-1">‹ Previous</button>' : '') + (Number(p.offset || 0) + docs.length < total ? '<button data-pg="1">Next ›</button>' : '') + '</div>' : '<div class="sub" style="margin-top:6px">' + total + ' document' + (total === 1 ? '' : 's') + '</div>';
    if (grid) return '<div class="card"><div class="thumbs">' + docs.map(function (d) {
      var im = /^image\//.test(d.mime || '') ? 'style="background-image:url(/api/docs/' + d.id + '/thumb)"' : '';
      return '<div class="thumb" data-doc="' + d.id + '"><div class="im" ' + im + '>' + (im ? '' : icon(d.mime, d.file_name)) + '</div><div class="t"><b>' + esc(d.title) + '</b><br><span class="sub">' + esc(d.number) + ' · ' + esc(CATL[d.category] || d.category) + '</span></div></div>';
    }).join('') + '</div>' + pager + '</div>';
    return '<div class="card scroll"><table><thead><tr><th></th><th>Document</th><th>Category</th><th>Linked to</th><th>Level</th><th>Dates</th><th>Size</th></tr></thead><tbody>' + docs.map(function (d) {
      return '<tr class="doc-row" data-doc="' + d.id + '"><td style="font-size:20px">' + icon(d.mime, d.file_name) + '</td><td><b>' + esc(d.title) + '</b> ' + statusPill(d.status) + (d.legal_hold ? ' <span class="pill bad">hold</span>' : '') +
        '<div class="sub" style="margin:0">' + esc(d.number) + (d.reference ? ' · ref ' + esc(d.reference) : '') + (d.owner_name ? ' · about ' + esc(d.owner_name) : '') + (d.version > 1 ? ' · v' + d.version : '') + '</div>' +
        (d.snippet ? '<div class="snip">' + esc(d.snippet).replace(/\[\[/g, '<mark>').replace(/\]\]/g, '</mark>') + '</div>' : '') +
        ((d.tags || []).length ? '<div>' + d.tags.map(function (t) { return '<span class="chip">#' + esc(t) + '</span>'; }).join('') + '</div>' : '') + '</td>' +
        '<td>' + esc(CATL[d.category] || d.category) + '</td><td>' + (d.links || []).map(function (l) { return '<span class="chip">' + esc(ENT[l.type] || l.type) + ': ' + esc(l.label || l.id) + '</span>'; }).join('') + '</td>' +
        '<td>' + confPill(d.confidentiality) + '</td><td style="white-space:nowrap;font-size:12px">' + day(d.created_at) + (d.expiry_date ? '<br>' + expiryText(d.expiry_date) : '') + (d.deleted_at ? '<br><span class="bad">binned ' + day(d.deleted_at) + '</span>' : '') + '</td><td>' + size(d.size) + '</td></tr>';
    }).join('') + '</tbody></table>' + pager + '</div>';
  }
  function wireList(host, p, extra) {
    all('[data-doc]', host).forEach(function (r) { r.onclick = function () { openDoc(r.dataset.doc); }; });
    all('[data-pg]', host).forEach(function (b) { b.onclick = function () { var o = Number(p.offset || 0) + Number(b.dataset.pg) * (p.limit || 50); if (extra) { extra.offset = Math.max(0, o); results(extra, host); } else { lib.offset = Math.max(0, o); results(); } }; });
  }

  // -------------------------------------------------------- one document --
  function openDoc(id) {
    api('/api/docs/' + id).then(function (r) {
      var d = r.document, ed = r.can_edit, p = r.perms;
      var viewable = d.storage && (/^(application\/pdf|image\/)/.test(d.mime || '') || /html/.test(d.mime || ''));
      modal('<h2>' + icon(d.mime, d.file_name) + ' ' + esc(d.title) + ' ' + statusPill(d.status) + confPill(d.confidentiality) + (d.legal_hold ? ' <span class="pill bad">legal hold</span>' : '') + '</h2>' +
        '<div class="controls">' + (d.storage || d.template_body ? '<a class="btn primary" href="/api/docs/' + d.id + '/file" target="_blank" rel="noopener">' + (viewable || d.template_body ? 'Open' : 'Download') + '</a>' : '') +
        (d.storage && viewable && !/html/.test(d.mime || '') ? '<a class="btn" href="/api/docs/' + d.id + '/file?dl=1">Download</a>' : '') +
        (d.category === 'template' ? '<button id="usetpl" class="primary">Fill in this form</button>' : '') +
        (ed && d.storage && !/html/.test(d.mime || '') ? '<label class="btn">New version<input type="file" id="nv" hidden></label>' : '') +
        (p.manage ? '<button id="hold">' + (d.legal_hold ? 'Release legal hold' : 'Legal hold') + '</button>' : '') +
        (d.deleted_at ? (p.manage ? '<button id="restore">Restore</button><button id="purge" class="danger">Delete for good</button>' : '') : (ed ? '<button id="del">Move to recycle bin</button>' : '')) +
        '<button id="x">Close</button></div>' +

    var showRec = function (x) {
      $('#rres').innerHTML = '<div class="card"><h2>' + esc(ENT[x.type]) + ': ' + esc(x.label) + '</h2><div class="controls"><button class="primary" id="radd">＋ File a document for this</button></div><div id="rup"></div><div id="rlist"></div></div>';
      results({ entity_type: x.type, entity_id: x.id, limit: 100, offset: 0 }, $('#rlist'));
      $('#radd').onclick = function () { uploadTab({ host: $('#rup'), links: [x], done: function () { showRec(x); } }); };
    };
    picker($('#rp'), showRec, pre && pre.type);
    if (pre && pre.id) showRec(pre);
  }

  // ------------------------------------------------------- inventory images --
  function images() {
    $('#out').innerHTML = '<div class="card"><h2>Inventory images</h2><p class="sub">Every inventory item with a picture: its own catalogue photo, and any pictures filed for it (spec sheets, damage, packaging). Click an item to see or add its documents.</p>' +
      '<div class="search"><input type="search" id="iq" placeholder="Find an item by name, part no. or vehicle"><button class="primary" id="igo">Search</button>' + (meta.perms.manage ? '<button id="iimp" title="Add catalogue photos, CVs and inquiry photos to the library">Import existing files</button>' : '') + '</div></div><div id="ires"></div>';
    var go = function () {
      api('/api/docs/product-images?q=' + encodeURIComponent(val('iq'))).then(function (d) {
        $('#ires').innerHTML = d.products.length ? '<div class="card"><div class="thumbs">' + d.products.map(function (p) {
          var docImg = (p.docs || []).find(function (x) { return /^image\//.test(x.mime || ''); });
          var bg = p.own_photo ? '/' + encodeURI(p.img) : docImg ? '/api/docs/' + docImg.id + '/thumb' : '';
          return '<div class="thumb" data-img="' + esc(p.img) + '" data-name="' + esc(p.name) + '"><div class="im" ' + (bg ? 'style="background-image:url(\'' + bg.replace(/'/g, '%27') + '\')"' : '') + '>' + (bg ? '' : '🔩') + '</div><div class="t"><b>' + esc(p.name) + '</b><br><span class="sub">' + esc(p.make_model || '') + (p.sku ? ' · ' + esc(p.sku) : '') + '</span><br><span class="chip">' + ((p.docs || []).length) + ' filed</span>' + (p.stock_count > 0 ? '<span class="chip">' + p.stock_count + ' in stock</span>' : '') + '</div></div>';
        }).join('') + '</div></div>' : '<div class="card"><div class="empty">No items with pictures yet. Open “By record”, choose Inventory item, and file a photo for it.</div></div>';
        all('[data-img]').forEach(function (el) { el.onclick = function () { tab = 'records'; all('[data-t]').forEach(function (x) { x.classList.toggle('on', x.dataset.t === 'records'); }); records({ type: 'product', id: el.dataset.img, label: el.dataset.name }); }; });
      }).catch(fail);
    };
    $('#igo').onclick = go; $('#iq').onkeydown = function (e) { if (e.key === 'Enter') go(); };
    if ($('#iimp')) $('#iimp').onclick = function () { $('#iimp').disabled = true; api('/api/docs/index-existing', 'POST', {}).then(function (j) { toast('Imported ' + j.product_images + ' product photos, ' + j.resumes + ' CVs, ' + j.inquiry_photos + ' inquiry photos (' + j.skipped + ' already filed)'); refreshMeta().then(go); }).catch(fail).then(function () { $('#iimp').disabled = false; }); };
    go();
  }

  // ------------------------------------------------------------------ assets --
  function assets() {
    api('/api/docs/assets').then(function (d) {
      $('#out').innerHTML = '<div class="tiles"><div class="tile"><span>Assets in use</span><b>' + d.totals.count + '</b></div><div class="tile"><span>Cost on record</span><b>' + B.J(d.totals.cost) + '</b></div><div class="tile' + (d.totals.undocumented ? ' bad' : '') + '"><span>With no documents</span><b>' + d.totals.undocumented + '</b></div></div>' +
        '<div class="card"><h2>Asset listing and documents</h2><p class="sub">Computers, tills and printers (from System management) plus vehicles, tools, machinery, furniture and buildings. File each one\'s receipt, warranty, manual, registration and insurance against it.</p>' +
        (meta.perms.manage ? '<details><summary><b>＋ Add an asset</b></summary><div class="grid" style="margin-top:8px">' + field('a_name', 'Name', '') + sel('a_kind', 'Kind', ['vehicle', 'tool', 'machinery', 'equipment', 'furniture', 'building', 'pc', 'till', 'printer', 'phone', 'other']) +
          field('a_make', 'Make', '') + field('a_model', 'Model', '') + field('a_serial', 'Serial / VIN / plate', '') + field('a_loc', 'Location', '') + field('a_bought', 'Bought on', '', 'date') + field('a_cost', 'Cost (J$)', '', 'number') +
          field('a_sup', 'Bought from', '') + field('a_war', 'Warranty until', '', 'date') + '</div><div class="controls" style="margin-top:8px"><button class="primary" id="a_go">Add asset</button></div></details>' : '') +
        '<div class="scroll"><table><thead><tr><th>Tag</th><th>Asset</th><th>Kind</th><th>Where / who</th><th>Bought</th><th>Warranty</th><th>Documents</th><th>Status</th></tr></thead><tbody>' + d.assets.map(function (a) {
          return '<tr class="doc-row" data-asset="' + a.id + '" data-label="' + esc((a.tag ? a.tag + ' ' : '') + a.name) + '"><td>' + esc(a.tag || '') + '</td><td><b>' + esc(a.name) + '</b><div class="sub" style="margin:0">' + esc([a.make, a.model, a.serial].filter(Boolean).join(' · ')) + '</div></td><td>' + esc(a.kind) + '</td>' +
            '<td>' + esc([a.location, a.assigned_name].filter(Boolean).join(' · ')) + '</td><td>' + day(a.purchase_date) + (a.cost ? '<br>' + B.J(a.cost) : '') + '</td><td>' + (a.warranty_until ? expiryText(a.warranty_until) : '') + '</td>' +
            '<td>' + (a.docs ? '<span class="pill ok">' + a.docs + '</span>' : '<span class="pill warn">none</span>') + (a.next_expiry ? '<br><span class="sub">next expiry ' + day(a.next_expiry) + '</span>' : '') + '</td><td>' + esc(a.status) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
      all('[data-asset]').forEach(function (r) { r.onclick = function () { tab = 'records'; all('[data-t]').forEach(function (x) { x.classList.toggle('on', x.dataset.t === 'records'); }); records({ type: 'asset', id: r.dataset.asset, label: r.dataset.label }); }; });
      if ($('#a_go')) $('#a_go').onclick = function () {
        api('/api/docs/assets', 'POST', { name: val('a_name'), kind: val('a_kind'), make: val('a_make'), model: val('a_model'), serial: val('a_serial'), location: val('a_loc'), purchase_date: val('a_bought'), cost: val('a_cost'), supplier: val('a_sup'), warranty_until: val('a_war') })
          .then(function (j) { toast('Added ' + j.tag); assets(); }).catch(fail);
      };
    }).catch(fail);
  }

  // ---------------------------------------------------------- communications --
  var cq = { q: '', channel: '', direction: '', source: '', from: '', to: '', offset: 0 };
  function comms() {
    $('#out').innerHTML = '<div class="card"><h2>Communications journal</h2><p class="sub">Every email and SMS the system sends (captured as it leaves, including failures), customer portal messages, AI chat / WhatsApp / phone conversations and web inquiries, newest first. Calls, letters and visits can be added by hand. Business channels only.</p>' +
      '<div id="c30" class="tiles"></div><div class="search"><input type="search" id="cq" placeholder="Search names, numbers, emails, words…" value="' + esc(cq.q) + '"><button class="primary" id="cgo">Search</button><button id="clog">＋ Log a call / letter / visit</button></div>' +
      '<div class="filters"><select id="cch"><option value="">All channels</option>' + ['email', 'sms', 'whatsapp', 'phone', 'chat', 'portal', 'web form', 'call', 'letter', 'visit', 'other'].map(function (c) { return '<option' + (c === cq.channel ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
      '<select id="cdir"><option value="">In and out</option><option value="in"' + (cq.direction === 'in' ? ' selected' : '') + '>Received</option><option value="out"' + (cq.direction === 'out' ? ' selected' : '') + '>Sent</option></select>' +
      '<select id="csrc"><option value="">Any source</option></select><select id="cst"><option value="">Any status</option><option>sent</option><option>failed</option><option>stubbed</option><option>logged</option></select>' +
      '<input type="date" id="cfrom" value="' + esc(cq.from) + '"><input type="date" id="cto" value="' + esc(cq.to) + '"></div></div><div id="cres"></div>';
    var go = function () { cq.q = val('cq'); cq.channel = val('cch'); cq.direction = val('cdir'); cq.source = val('csrc'); cq.status = val('cst'); cq.from = val('cfrom'); cq.to = val('cto'); load(); };
    var load = function () {
      api('/api/comms?' + qs({ q: cq.q, channel: cq.channel, direction: cq.direction, source: cq.source, status: cq.status, from: cq.from, to: cq.to, offset: cq.offset, limit: 100 })).then(function (d) {
        $('#c30').innerHTML = d.last30.map(function (s) { return '<div class="tile' + (s.failed ? ' bad' : '') + '"><span>' + esc(s.channel) + ' sent, 30 days</span><b>' + s.n + (s.failed ? ' (' + s.failed + ' failed)' : '') + '</b></div>'; }).join('');
        var srcSel = $('#csrc'); if (srcSel.options.length === 1) d.sources.forEach(function (s) { var o = document.createElement('option'); o.textContent = s; if (s === cq.source) o.selected = true; srcSel.appendChild(o); });
        $('#cres').innerHTML = '<div class="card">' + (d.messages.length ? d.messages.map(function (m) {
          return '<div class="msg ' + esc(m.direction) + (m.status === 'failed' ? ' failed' : '') + '"><div class="h"><b>' + (m.direction === 'in' ? '⬅ from' : '➡ to') + ' ' + esc(m.party || m.customer || '—') + '</b>' + (m.customer && m.party !== m.customer ? '<span>' + esc(m.customer) + '</span>' : '') +
            '<span class="pill">' + esc(m.channel) + '</span>' + (m.status ? '<span class="pill ' + (m.status === 'failed' ? 'bad' : m.status === 'unread' ? 'warn' : '') + '">' + esc(m.status) + '</span>' : '') +
            '<span>' + dt(m.at) + '</span><span>via ' + esc(m.source || '') + '</span>' + (m.staff ? '<span>by ' + esc(m.staff) + '</span>' : '') + (m.document_id ? '<a href="#" data-doc="' + m.document_id + '">document</a>' : '') + '</div>' +
            (m.subject ? '<div><b>' + esc(m.subject) + '</b></div>' : '') + '<div class="b">' + esc(m.body || '') + '</div>' + (m.error ? '<div class="bad" style="font-size:12px">' + esc(m.error) + '</div>' : '') + '</div>';
        }).join('') : '<div class="empty">Nothing found.</div>') +
          '<div class="controls" style="margin-top:8px"><span class="sub">' + d.total + ' messages</span>' + (cq.offset > 0 ? '<button id="cprev">‹ Newer</button>' : '') + (cq.offset + d.messages.length < d.total ? '<button id="cnext">Older ›</button>' : '') + '</div></div>';
        all('.msg .b').forEach(function (b) { b.onclick = function () { b.parentNode.classList.toggle('open'); }; });
        all('[data-doc]', $('#cres')).forEach(function (a) { a.onclick = function (e) { e.preventDefault(); openDoc(a.dataset.doc); }; });
        if ($('#cprev')) $('#cprev').onclick = function () { cq.offset = Math.max(0, cq.offset - 100); load(); };
        if ($('#cnext')) $('#cnext').onclick = function () { cq.offset += 100; load(); };
      }).catch(function (e) { $('#cres').innerHTML = '<div class="card bad">' + esc(e.message) + '</div>'; });
    };
    $('#cgo').onclick = function () { cq.offset = 0; go(); }; $('#cq').onkeydown = function (e) { if (e.key === 'Enter') { cq.offset = 0; go(); } };
    ['cch', 'cdir', 'csrc', 'cst', 'cfrom', 'cto'].forEach(function (id) { $('#' + id).onchange = function () { cq.offset = 0; go(); }; });
    $('#clog').onclick = logComm;
    load();
  }
  function logComm() {
    var link = null;
    modal('<h2>Log a communication</h2><div class="grid">' + sel('l_ch', 'How', [['call', 'Phone call'], ['visit', 'Visit / meeting'], ['letter', 'Letter'], ['whatsapp', 'WhatsApp (own phone)'], ['email', 'Email (own mailbox)'], ['sms', 'SMS (own phone)'], ['other', 'Other']]) +
      sel('l_dir', 'Direction', [['in', 'They contacted us'], ['out', 'We contacted them']]) + field('l_party', 'Who (name, number or email)', '') + field('l_subj', 'Subject', '') + area('l_body', 'What was said / agreed', '', 4) + '</div>' +
      '<h3>About (optional)</h3><div id="l_pick"></div><div id="l_link"></div><div class="controls" style="margin-top:10px"><button class="primary" id="l_go">Save</button><button id="x">Cancel</button></div>');
    $('#x').onclick = close;
    picker($('#l_pick'), function (x) { link = x; $('#l_link').innerHTML = '<span class="chip">' + esc(ENT[x.type]) + ': ' + esc(x.label) + '</span>'; }, 'customer');
    $('#l_go').onclick = function () {
      api('/api/comms/log', 'POST', { channel: val('l_ch'), direction: val('l_dir'), party: val('l_party'), subject: val('l_subj'), body: val('l_body'), entity_type: link && link.type, entity_id: link && link.id, customer_id: link && link.type === 'customer' ? link.id : undefined })
        .then(function () { close(); toast('Logged'); if (tab === 'comms') comms(); }).catch(fail);
    };
  }

  // ------------------------------------------------------------------- manage --
  function admin() {
    $('#out').innerHTML = '<div class="card"><h2>Folders</h2><div class="controls">' + field('fo_name', 'New folder', '') + sel('fo_parent', 'Inside', folderOpts('(top level)')) + '<div><label>&nbsp;</label><button class="primary" id="fo_add">Add folder</button></div></div>' +
      '<table><tbody>' + FOLDERS.map(function (f) { return '<tr><td>' + (f.parent_id ? '└ ' : '') + esc(f.name) + '</td><td>' + f.count + ' docs</td><td><button data-ren="' + f.id + '">Rename</button> <button data-rmf="' + f.id + '">Delete</button></td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="card"><h2>Bring in existing files</h2><p class="sub">Adds catalogue photos, job applicants\' CVs and customers\' inquiry photos to the library (they stay where they are). Safe to run again.</p><button class="primary" id="imp">Import existing files</button> <span id="impr" class="sub"></span></div>' +
      '<div class="card"><h2>Clean-up</h2><div class="controls"><button id="bin">Recycle bin (' + meta.stats.binned + ')</button><button id="dupes">Duplicate files</button><button id="holds">On legal hold</button><button id="alog">Access log</button></div><div id="mres"></div></div>' +
      '<div class="card"><h2>Who can do what</h2><p class="sub">Set in Admin › Roles & permissions, group “Documents”: view, file, manage, see confidential, see restricted, approve forms, read the communications journal. Owners and managers have all of them; the last five are off for other staff until granted. Staff always see documents about themselves and what they filed.</p>' +
      '<div class="note warn">Tell staff in writing that business channels (company email, SMS, WhatsApp and phone lines, and the business system) are recorded. The Confidentiality agreement template says so.</div></div>';
    $('#fo_add').onclick = function () { api('/api/docs/folders', 'POST', { name: val('fo_name'), parent_id: val('fo_parent') }).then(function () { toast('Folder added'); refreshMeta().then(admin); }).catch(fail); };
    all('[data-ren]').forEach(function (b) { b.onclick = function () { var f = FOLDERS.find(function (x) { return String(x.id) === b.dataset.ren; });
      modal('<h2>Rename folder</h2><input id="rn" value="' + esc(f.name) + '" style="width:100%"><div class="controls" style="margin-top:8px"><button class="primary" id="y">Save</button><button id="x">Cancel</button></div>'); $('#x').onclick = close;
      $('#y').onclick = function () { api('/api/docs/folders/' + f.id, 'PUT', { name: val('rn') }).then(function () { close(); refreshMeta().then(admin); }).catch(fail); }; }; });
    all('[data-rmf]').forEach(function (b) { b.onclick = function () { api('/api/docs/folders/' + b.dataset.rmf, 'DELETE').then(function () { toast('Folder deleted'); refreshMeta().then(admin); }).catch(fail); }; });
    $('#imp').onclick = function () { $('#imp').disabled = true; api('/api/docs/index-existing', 'POST', {}).then(function (j) { $('#impr').textContent = j.product_images + ' product photos, ' + j.resumes + ' CVs, ' + j.inquiry_photos + ' inquiry photos added; ' + j.skipped + ' already filed.'; refreshMeta(); }).catch(fail).then(function () { $('#imp').disabled = false; }); };
    $('#bin').onclick = function () { results({ deleted: '1', limit: 100, offset: 0 }, $('#mres')); };
    $('#dupes').onclick = function () { results({ dupes: '1', sort: 'title', limit: 100, offset: 0 }, $('#mres')); };
    $('#holds').onclick = function () { results({ hold: '1', limit: 100, offset: 0 }, $('#mres')); };
    $('#alog').onclick = function () {
      api('/api/docs/access-log').then(function (d) {
        $('#mres').innerHTML = '<div class="scroll"><table><thead><tr><th>When</th><th>Who</th><th>Did</th><th>Document</th><th>Level</th><th>Address</th></tr></thead><tbody>' + d.entries.map(function (a) {
          return '<tr><td>' + dt(a.at) + '</td><td>' + esc(a.name || '—') + '</td><td>' + esc(a.action) + (a.detail ? ' <span class="sub">' + esc(a.detail) + '</span>' : '') + '</td><td>' + (a.doc_id ? '<a href="#" data-doc="' + a.doc_id + '">' + esc(a.number) + '</a> ' + esc(a.title || '') : esc(a.detail || '')) + '</td><td>' + (a.confidentiality ? confPill(a.confidentiality) : '') + '</td><td class="mono">' + esc(a.ip || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
        all('[data-doc]', $('#mres')).forEach(function (x) { x.onclick = function (e) { e.preventDefault(); openDoc(x.dataset.doc); }; });
      }).catch(fail);
    };
  }

  start();
})();
</script>
<script src="/assets/staff-assist.js?v=20261020" defer></script>
<script src="/assets/module-look.js?v=20261101" defer></script>
