<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixed assets · Vision Auto Solutions</title>
<link rel="stylesheet" href="/assets/books.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .grid2 label,.grid3 label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px} .grid2 input,.grid2 select,.grid3 input,.grid3 select,.grid2 textarea{width:100%}
  @media (max-width:700px){ .grid2,.grid3{grid-template-columns:1fr} }
  .hint{font-size:12px;color:var(--muted);margin-top:3px}
  fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px} legend{font-size:12.5px;font-weight:600;padding:0 4px}
</style>
</head>
<body>
<header><h1>Fixed assets</h1><nav><a href="/accounting.html">Ledger</a><a href="/payables.html">Payables</a><a href="/banking.html">Banking</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"><button data-t="reg" class="on">Register</button><button data-t="dep">Depreciation</button><button data-t="rpt">Asset schedule</button><button data-t="cls">Asset classes</button></div>
  <div id="out"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script src="/assets/books-common.js?v=20261019"></script>
<script>
(function () {
  'use strict';
  var B = window.Books, $ = B.$, all = B.all, esc = B.esc, J = B.J, api = B.api, toast = B.toast, modal = B.modal, close = B.close;
  var tab = 'reg', meta = null;
  var METHOD = { straight_line: 'Straight line', declining_balance: 'Declining balance', none: 'Not depreciated' };
  var FUNDING = { in_ledger: 'Already in the books (a bill or cheque coded to the asset account)', account: 'Paid from an account (post it now)', opening: 'Owned before the ledger started' };
  var KIND = { sold: 'Sold', scrapped: 'Scrapped', written_off: 'Written off', traded_in: 'Traded in', stolen: 'Stolen / lost' };
  var SRC = { fa_acquire: 'Cost', fa_acquire_void: 'Cost voided', fa_run: 'Depreciation', fa_run_void: 'Depreciation voided', fa_dispose: 'Disposal', fa_dispose_void: 'Disposal voided' };
  try { tab = localStorage.getItem('vision.faTab') || 'reg'; } catch (_) {}
  var thisMonth = function () { return B.today().slice(0, 7); };
  var life = function (m) { if (!m) return ''; var y = Math.floor(m / 12), r = m % 12; return (y ? y + ' yr' : '') + (y && r ? ' ' : '') + (r ? r + ' mo' : ''); };
  function opts(list, sel, label, blank) {
    return (blank ? '<option value="">' + esc(blank) + '</option>' : '') + list.map(function (x) { return '<option value="' + x.id + '"' + (String(sel) === String(x.id) ? ' selected' : '') + '>' + esc(label(x)) + '</option>'; }).join('');
  }
  var acctLabel = function (a) { return a.code + ' ' + a.name; };
  function loadMeta() { return api('/api/assets/meta').then(function (m) { meta = m; return m; }); }

  // ------------------------------------------------------------ register --
  var regFilter = 'active';
  function reg() {
    return Promise.all([loadMeta(), api('/api/assets')]).then(function (r) {
      var d = r[1], list = d.assets.filter(function (a) { return regFilter === 'all' || a.status === regFilter; });
      var warn = !meta.ledger_start ? '<div class="note warn">The ledger has not been started (Accounting). Assets can be entered now; their entries post once it starts.</div>'
        : d.due.assets ? '<div class="note warn">Depreciation is behind: a run through ' + esc(d.due.through) + ' would charge ' + J(d.due.amount) + ' on ' + d.due.assets + ' asset' + (d.due.assets > 1 ? 's' : '') + '. <a href="#" id="goDep">Run depreciation ›</a></div>' : '';
      $('#out').innerHTML = '<div class="tiles"><div class="tile"><span class="k">Assets in use</span><b>' + d.totals.count + '</b></div><div class="tile"><span class="k">Cost</span><b>' + J(d.totals.cost) + '</b></div>' +
        '<div class="tile"><span class="k">Depreciation to date</span><b>' + J(d.totals.accumulated) + '</b></div><div class="tile"><span class="k">Book value</span><b>' + J(d.totals.book_value) + '</b></div></div>' + warn +
        '<div class="card"><div class="controls"><button class="primary" id="add">+ Add an asset</button><div><label>Show</label><select id="flt"><option value="active">In use</option><option value="disposed">Disposed of</option><option value="void">Voided</option><option value="all">All</option></select></div>' +
        '<span style="margin-left:auto"></span><button id="csv">Download CSV</button></div><div class="scroll"><table><thead><tr><th>No.</th><th>Asset</th><th>Class</th><th>In use from</th><th>Method</th><th class="n">Cost</th><th class="n">Depreciation</th><th class="n">Book value</th><th>Charged to</th><th></th></tr></thead><tbody>' +
        (list.length ? list.map(function (a) {
          return '<tr class="click" data-a="' + a.id + '"><td><b>' + esc(a.number) + '</b></td><td>' + esc(a.name) + (a.serial_no ? '<br><small style="color:var(--muted)">S/N ' + esc(a.serial_no) + '</small>' : '') + (a.location ? '<br><small style="color:var(--muted)">' + esc(a.location) + '</small>' : '') + '</td><td>' + esc(a.class_name) + '</td><td>' + esc(a.in_service_on) + '</td><td>' + esc(METHOD[a.method]) + (a.life_months ? '<br><small style="color:var(--muted)">' + life(a.life_months) + '</small>' : a.rate_pct ? '<br><small style="color:var(--muted)">' + a.rate_pct + '% a year</small>' : '') + '</td>' +
            '<td class="n">' + J(a.cost) + '</td><td class="n">' + J(a.accumulated) + '</td><td class="n"><b>' + J(a.book_value) + '</b></td><td>' + esc(a.last_month || a.opening_through || '') + '</td><td>' +
            (a.status === 'disposed' ? '<span class="pill">disposed</span>' : a.status === 'void' ? '<span class="pill bad">void</span>' : a.funding !== 'in_ledger' && !a.posted ? '<span class="pill warn">not posted</span>' : '') + '</td></tr>';
        }).join('') : '<tr><td colspan="10" class="empty">' + (regFilter === 'active' ? 'No assets yet. Add the shop\'s furniture, workshop equipment, vehicles and computers.' : 'None.') + '</td></tr>') + '</tbody></table></div></div>';
      $('#flt').value = regFilter;
      $('#flt').onchange = function () { regFilter = this.value; reg(); };
      $('#add').onclick = function () { assetForm(null); };
      if ($('#goDep')) $('#goDep').onclick = function (e) { e.preventDefault(); tab = 'dep'; mark(); show(); };
      $('#csv').onclick = function () {
        B.csv('fixed-assets-' + B.today() + '.csv', [['Number', 'Name', 'Class', 'Serial', 'Location', 'Bought', 'In use from', 'Method', 'Life (months)', 'Rate %', 'Cost', 'Salvage', 'Depreciation to date', 'Book value', 'Charged to', 'Status']]
          .concat(list.map(function (a) { return [a.number, a.name, a.class_name, a.serial_no, a.location, a.acquired_on, a.in_service_on, METHOD[a.method], a.life_months, a.rate_pct, a.cost, a.salvage, a.accumulated, a.book_value, a.last_month || a.opening_through, a.status]; })));
      };
      all('[data-a]').forEach(function (tr) { tr.onclick = function () { detail(+tr.getAttribute('data-a')); }; });
    }).catch(function (e) { $('#out').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>'; });
  }

  function assetForm(a) {
    var x = a || { funding: 'in_ledger', acquired_on: B.today(), class_id: (meta.classes.find(function (k) { return k.is_active; }) || {}).id };
    var locked = a && (a.posted || a.last_month);
    var classes = meta.classes.filter(function (k) { return k.is_active || (a && k.id === a.class_id); });
    modal('<h2>' + (a ? 'Change ' + esc(a.number) : 'Add an asset') + '</h2>' +
      '<fieldset><legend>What it is</legend><div class="grid2">' +
        '<div><label>Name</label><input id="fName" value="' + esc(x.name || '') + '" placeholder="e.g. 2-post vehicle lift"></div>' +
        '<div><label>Class</label><select id="fClass"' + (locked ? ' disabled' : '') + '>' + opts(classes, x.class_id, function (k) { return k.name; }) + '</select></div>' +
        '<div><label>Serial number</label><input id="fSerial" value="' + esc(x.serial_no || '') + '"></div>' +
        '<div><label>Where it is</label><input id="fLoc" value="' + esc(x.location || '') + '" placeholder="Bay 2, front office…"></div>' +
        '<div><label>Who has it</label><input id="fCust" value="' + esc(x.custodian || '') + '"></div>' +
        '<div><label>Supplier</label><select id="fSup">' + opts(meta.suppliers, x.supplier_id, function (s) { return s.name; }, 'None') + '</select></div>' +
        '<div><label>Invoice / cheque that paid for it</label><input id="fRef" value="' + esc(x.reference || '') + '"></div>' +
        '<div><label>Class (QuickBooks)</label><select id="fGlc">' + opts(meta.gl_classes, x.gl_class_id, function (c) { return c.name; }, 'No class') + '</select></div>' +
        '<div style="grid-column:1/-1"><label>Description</label><textarea id="fDesc" rows="2">' + esc(x.description || '') + '</textarea></div></div></fieldset>' +
      '<fieldset><legend>Cost and how it reached the books</legend><div class="grid3">' +
        '<div><label>Date bought</label><input type="date" id="fBought" value="' + esc(x.acquired_on || '') + '"' + (locked ? ' disabled' : '') + '></div>' +
        '<div><label>Date it went into use</label><input type="date" id="fInUse" value="' + esc(x.in_service_on || x.acquired_on || '') + '"' + (a && a.last_month ? ' disabled' : '') + '></div>' +
        '<div><label>Cost (J$)</label><input type="number" step="0.01" id="fCost" value="' + (x.cost || '') + '"' + (locked ? ' disabled' : '') + '></div></div>' +
        '<div style="margin-top:8px"><label style="font-size:12px;color:var(--muted)">Paid for</label><select id="fFund" style="width:100%"' + (locked ? ' disabled' : '') + '>' + Object.keys(FUNDING).map(function (k) { return '<option value="' + k + '"' + (x.funding === k ? ' selected' : '') + '>' + esc(FUNDING[k]) + '</option>'; }).join('') + '</select>' +
        '<div class="hint" id="fFundHint"></div></div>' +
        '<div id="fAcctWrap" style="margin-top:8px"><label style="font-size:12px;color:var(--muted)">Paid from</label><select id="fAcct" style="width:100%"' + (locked ? ' disabled' : '') + '>' + opts(meta.accounts, x.funding_account_id, acctLabel, 'Choose…') + '</select></div>' +
        '<div class="grid2" style="margin-top:8px"><div><label>Depreciation already taken (J$)</label><input type="number" step="0.01" id="fOpen" value="' + (x.opening_accum || '') + '"' + (locked ? ' disabled' : '') + '><div class="hint">For something owned before: what has been written off up to now. Left blank for one owned before the ledger, it is worked out to the month before the ledger started.</div></div>' +
        '<div><label>…up to the end of (month)</label><input type="month" id="fThr" value="' + esc(x.opening_through || '') + '"' + (locked ? ' disabled' : '') + '></div></div></fieldset>' +
      '<fieldset><legend>Depreciation</legend><div class="grid3">' +
        '<div><label>Method</label><select id="fMethod">' + Object.keys(METHOD).map(function (k) { return '<option value="' + k + '"' + (x.method === k ? ' selected' : '') + '>' + METHOD[k] + '</option>'; }).join('') + '</select></div>' +
        '<div id="fLifeWrap"><label>Useful life (months)</label><input type="number" id="fLife" value="' + (x.life_months || '') + '"></div>' +
        '<div id="fRateWrap"><label>Rate (% a year)</label><input type="number" step="0.01" id="fRate" value="' + (x.rate_pct || '') + '"></div>' +
        '<div><label>Salvage value (J$)</label><input type="number" step="0.01" id="fSalv" value="' + (a ? x.salvage : '') + '" placeholder="the class\'s usual %"></div></div>' +
        (a && a.last_month ? '<div class="hint">A change of life or salvage spreads the book value left over the months that are left; months already charged stay as they are.</div>' : '') + '</fieldset>' +
      '<div><label style="font-size:12px;color:var(--muted)">Notes</label><textarea id="fNotes" rows="2" style="width:100%">' + esc(x.notes || '') + '</textarea></div>' +
      (locked ? '<div class="note info" style="margin-top:8px">This asset is in the books: its cost, class and how it was paid for are fixed.</div>' : '') +
      '<div class="controls" style="margin-top:10px"><button class="primary" id="fSave">' + (a ? 'Save' : 'Add the asset') + '</button><button id="fX">Cancel</button></div>');
    function sync(fromClass) {
      var k = meta.classes.find(function (c) { return String(c.id) === $('#fClass').value; }) || {};
      if (fromClass && !a) { $('#fMethod').value = k.method || 'straight_line'; $('#fLife').value = k.life_months || ''; $('#fRate').value = k.rate_pct || ''; }
      var m = $('#fMethod').value, f = $('#fFund').value;
      $('#fLifeWrap').style.display = m === 'straight_line' || m === 'declining_balance' ? '' : 'none';
      $('#fRateWrap').style.display = m === 'declining_balance' ? '' : 'none';
      $('#fAcctWrap').style.display = f === 'account' ? '' : 'none';
      $('#fFundHint').textContent = f === 'in_ledger' ? 'Nothing more posts for the cost: the bill or cheque already debited ' + (k.asset_account || 'the class\'s asset account') + '. Check the bill was coded there.'
        : f === 'account' ? 'Posts Dr ' + (k.asset_account || 'the asset account') + ', Cr the account it was paid from.'
        : 'Posts Dr ' + (k.asset_account || 'the asset account') + ', Cr ' + (k.accum_account || 'accumulated depreciation') + ' for the depreciation already taken, Cr Opening Balance Equity for the rest, on the ledger start.';
    }
    $('#fClass').onchange = function () { sync(true); };
    $('#fMethod').onchange = $('#fFund').onchange = function () { sync(false); };
    sync(!a);
    $('#fX').onclick = close;
    $('#fSave').onclick = function () {
      var btn = this; btn.disabled = true;
      var body = { name: $('#fName').value, class_id: $('#fClass').value, serial_no: $('#fSerial').value, location: $('#fLoc').value, custodian: $('#fCust').value, supplier_id: $('#fSup').value,
        reference: $('#fRef').value, gl_class_id: $('#fGlc').value, description: $('#fDesc').value, acquired_on: $('#fBought').value, in_service_on: $('#fInUse').value, cost: $('#fCost').value,
        funding: $('#fFund').value, funding_account_id: $('#fAcct').value, opening_accum: $('#fOpen').value, opening_through: $('#fThr').value,
        method: $('#fMethod').value, life_months: $('#fLife').value, rate_pct: $('#fRate').value, salvage: $('#fSalv').value, notes: $('#fNotes').value };
      api(a ? '/api/assets/' + a.id : '/api/assets', a ? 'PUT' : 'POST', body).then(function (r) { close(); toast(a ? 'Saved' : r.asset.number + ' added'); detail(r.asset.id); reg(); })
        .catch(function (e) { btn.disabled = false; toast(e.message); });
    };
  }

  function detail(id) {
    api('/api/assets/' + id).then(function (d) {
      var a = d.asset;
      var byYear = {};
      d.charged.forEach(function (c) { var y = c.month.slice(0, 4); (byYear[y] = byYear[y] || { done: 0, todo: 0 }).done += c.amount; });
      d.projected.forEach(function (c) { var y = c.month.slice(0, 4); (byYear[y] = byYear[y] || { done: 0, todo: 0 }).todo += c.amount; });
      var nbv = a.cost - a.opening_accum, years = Object.keys(byYear).sort();
      modal('<h2>' + esc(a.number) + ' · ' + esc(a.name) + ' ' + (a.status === 'disposed' ? '<span class="pill">disposed</span>' : a.status === 'void' ? '<span class="pill bad">void</span>' : '') + '</h2>' +
        '<p class="sub">' + esc(a.class_name) + ' · bought ' + esc(a.acquired_on) + ', in use from ' + esc(a.in_service_on) + (a.supplier ? ' · ' + esc(a.supplier) : '') + (a.serial_no ? ' · S/N ' + esc(a.serial_no) : '') + (a.location ? ' · ' + esc(a.location) : '') + '</p>' +
        '<div class="tiles"><div class="tile"><span class="k">Cost</span><b>' + J(a.cost) + '</b></div><div class="tile"><span class="k">Depreciation to date</span><b>' + J(a.accumulated) + '</b></div><div class="tile"><span class="k">Book value</span><b>' + J(a.book_value) + '</b></div><div class="tile"><span class="k">Salvage</span><b>' + J(a.salvage) + '</b></div></div>' +
        '<p class="sub">' + esc(METHOD[a.method]) + (a.life_months ? ' over ' + life(a.life_months) : '') + (a.rate_pct ? ' at ' + a.rate_pct + '% a year' : '') + ' · ' + esc(FUNDING[a.funding]) + (a.funding_account ? ': ' + esc(a.funding_account) : '') +
          (a.opening_accum ? ' · ' + J(a.opening_accum) + ' depreciation brought forward to ' + esc(a.opening_through) : '') + '</p>' +
        (d.disposal ? '<div class="note info">' + esc(KIND[d.disposal.kind]) + ' on ' + esc(d.disposal.disposed_on) + (Number(d.disposal.proceeds) ? ' for ' + J(d.disposal.proceeds) : '') + (d.disposal.note ? ' · ' + esc(d.disposal.note) : '') +
          ' · gain / loss ' + J(Number(d.disposal.proceeds) - (a.cost - Number(d.disposal.accum_at))) + ' <button class="sm" id="vDisp">Void the disposal</button></div>' : '') +
        (years.length ? '<h3 style="font-size:14px;margin:10px 0 4px">Schedule by year</h3><div class="scroll"><table><thead><tr><th>Year</th><th class="n">Charged</th><th class="n">Still to charge</th><th class="n">Book value at year end</th></tr></thead><tbody>' +
          years.map(function (y) { nbv -= byYear[y].done + byYear[y].todo; return '<tr><td>' + y + '</td><td class="n">' + (byYear[y].done ? J(byYear[y].done) : '') + '</td><td class="n">' + (byYear[y].todo ? J(byYear[y].todo) : '') + '</td><td class="n">' + J(nbv) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '') +
        '<h3 style="font-size:14px;margin:12px 0 4px">In the ledger</h3><div class="scroll"><table><tbody>' +
          (d.entries.length ? d.entries.map(function (e) { return '<tr><td><a href="/accounting.html#entry=' + e.id + '" target="_blank" rel="noopener">' + esc(e.number) + '</a></td><td>' + esc(e.entry_date) + '</td><td>' + esc(SRC[e.source_kind] || e.source_kind) + '</td><td>' + esc(e.memo || '') + '</td><td class="n">' + J(e.total) + '</td><td>' + (e.reversed_by ? '<span class="pill warn">reversed</span>' : '') + '</td></tr>'; }).join('')
            : '<tr><td class="empty">' + (a.funding === 'in_ledger' ? 'Its cost came in through a bill or cheque; depreciation shows here once it is run.' : 'Nothing yet: it posts once the ledger has started.') + '</td></tr>') + '</tbody></table></div>' +
        '<div class="controls" style="margin-top:12px">' + (a.status === 'active' ? '<button id="dEdit">Change</button><button id="dDisp">Sold / scrapped…</button>' + (!a.last_month ? '<button id="dVoid">Void (entered by mistake)</button>' : '') : '') + '<button id="dX">Close</button></div>');
      $('#dX').onclick = close;
      if ($('#dEdit')) $('#dEdit').onclick = function () { assetForm(a); };
      if ($('#dDisp')) $('#dDisp').onclick = function () { disposeForm(a); };
      if ($('#dVoid')) $('#dVoid').onclick = function () { var r = prompt('Why is this asset being voided?'); if (!r) return; api('/api/assets/' + a.id + '/void', 'POST', { reason: r }).then(function () { close(); toast('Voided'); reg(); }).catch(function (e) { toast(e.message); }); };
      if ($('#vDisp')) $('#vDisp').onclick = function () { var r = prompt('Why is the disposal being voided?'); if (!r) return; api('/api/assets/disposals/' + d.disposal.id + '/void', 'POST', { reason: r }).then(function () { toast('Disposal voided: the asset is back in use'); detail(a.id); reg(); }).catch(function (e) { toast(e.message); }); };
    }).catch(function (e) { toast(e.message); });
  }

  function disposeForm(a) {
    modal('<h2>' + esc(a.number) + ' · sold, scrapped or written off</h2><p class="sub">Book value now ' + J(a.book_value) + '. Depreciation must be run to the month before; the cost and depreciation come off and the difference to what was received is a gain or loss.</p>' +
      '<div class="grid2"><div><label>Date</label><input type="date" id="xDay" value="' + B.today() + '"></div><div><label>What happened</label><select id="xKind">' + Object.keys(KIND).map(function (k) { return '<option value="' + k + '">' + KIND[k] + '</option>'; }).join('') + '</select></div>' +
      '<div><label>Received for it (J$)</label><input type="number" step="0.01" id="xAmt" value="0"></div><div><label>Money went to</label><select id="xAcct">' + opts(meta.accounts, '', acctLabel, 'Choose… (if anything was received)') + '</select></div>' +
      '<div style="grid-column:1/-1"><label>Note</label><input id="xNote" placeholder="Buyer, reason…"></div></div><p class="sub" id="xGain"></p>' +
      '<div class="controls"><button class="primary" id="xGo">Record it</button><button id="xX">Cancel</button></div>');
    var gain = function () { var g = Number($('#xAmt').value || 0) - a.book_value; $('#xGain').innerHTML = (g >= 0 ? 'Gain on disposal ' : 'Loss on disposal ') + J(Math.abs(g)) + ' (at today\'s book value).'; };
    $('#xAmt').oninput = gain; gain();
    $('#xX').onclick = function () { detail(a.id); };
    $('#xGo').onclick = function () {
      var btn = this; btn.disabled = true;
      api('/api/assets/' + a.id + '/dispose', 'POST', { disposed_on: $('#xDay').value, kind: $('#xKind').value, proceeds: $('#xAmt').value, proceeds_account_id: $('#xAcct').value, note: $('#xNote').value })
        .then(function () { toast('Recorded'); detail(a.id); reg(); }).catch(function (e) { btn.disabled = false; toast(e.message); });
    };
  }

  // -------------------------------------------------------- depreciation --
  function dep() {
    return Promise.all([loadMeta(), api('/api/assets/runs')]).then(function (r) {
      var runs = r[1].runs, latest = runs.find(function (x) { return !x.voided_at; });
      $('#out').innerHTML = '<div class="card"><h2>Run depreciation</h2><p class="sub">Charges every asset in use through the month chosen, catching up any months missed, and posts one entry: Dr depreciation expense, Cr accumulated depreciation, per asset. Run it once a month, before closing the month.</p>' +
        (!meta.ledger_start ? '<div class="note warn">Start the ledger (Accounting) first.</div>' : '') +
        '<div class="controls"><div><label>Through the end of</label><input type="month" id="rM" value="' + thisMonth() + '" max="' + thisMonth() + '"' + (meta.ledger_start ? ' min="' + meta.ledger_start.slice(0, 7) + '"' : '') + '></div><button id="rPrev">Preview</button></div><div id="rPlan"></div></div>' +
        '<div class="card"><h2>Runs</h2><div class="scroll"><table><thead><tr><th>Through</th><th class="n">Assets</th><th class="n">Charged</th><th>Entry</th><th>Run by</th><th></th></tr></thead><tbody>' +
        (runs.length ? runs.map(function (x) {
          return '<tr style="' + (x.voided_at ? 'opacity:.55' : '') + '"><td><b>' + esc(x.month) + '</b></td><td class="n">' + x.assets + '</td><td class="n">' + J(x.total) + '</td><td>' + (x.entry_number ? '<a href="/accounting.html#entry=' + x.entry_id + '" target="_blank" rel="noopener">' + esc(x.entry_number) + '</a>' : '<span class="pill warn">not posted yet</span>') + '</td><td>' + esc(x.created_by_name || '') + ' <small style="color:var(--muted)">' + esc(B.dt(x.created_at)) + '</small></td><td>' +
            (x.voided_at ? '<span class="pill bad">void</span> <small>' + esc(x.void_reason || '') + '</small>' : latest && latest.id === x.id ? '<button class="sm" data-v="' + x.id + '">Void</button>' : '') + '</td></tr>';
        }).join('') : '<tr><td colspan="6" class="empty">No runs yet.</td></tr>') + '</tbody></table></div></div>';
      $('#rPrev').onclick = function () {
        var m = $('#rM').value;
        api('/api/assets/runs/preview?month=' + encodeURIComponent(m)).then(function (p) {
          $('#rPlan').innerHTML = p.plan.length ? '<div class="scroll"><table><thead><tr><th>Asset</th><th>Class</th><th>Months</th><th class="n">Charge</th></tr></thead><tbody>' +
            p.plan.map(function (x) { return '<tr><td>' + esc(x.number + ' ' + x.name) + '</td><td>' + esc(x.class_name) + '</td><td>' + esc(x.months[0].month + (x.months.length > 1 ? ' to ' + x.months[x.months.length - 1].month + ' (' + x.months.length + ')' : '')) + '</td><td class="n">' + J(x.amount) + '</td></tr>'; }).join('') +
            '<tr><td colspan="3"><b>Total</b></td><td class="n"><b>' + J(p.total) + '</b></td></tr></tbody></table></div><div class="controls" style="margin-top:8px"><button class="primary" id="rGo">Post depreciation through ' + esc(m) + '</button></div>'
            : '<div class="note info">Nothing to charge through ' + esc(m) + ': every asset is up to date.</div>';
          if ($('#rGo')) $('#rGo').onclick = function () {
            var btn = this; btn.disabled = true;
            api('/api/assets/runs', 'POST', { month: m }).then(function (x) { toast(J(x.total) + ' charged on ' + x.assets + ' assets'); dep(); }).catch(function (e) { btn.disabled = false; toast(e.message); });
          };
        }).catch(function (e) { $('#rPlan').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>'; });
      };
      all('[data-v]').forEach(function (b) { b.onclick = function () { var r = prompt('Why is this run being voided?'); if (!r) return; api('/api/assets/runs/' + b.getAttribute('data-v') + '/void', 'POST', { reason: r }).then(function () { toast('Run voided: the ledger reverses it'); dep(); }).catch(function (e) { toast(e.message); }); }; });
    }).catch(function (e) { $('#out').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>'; });
  }

  // -------------------------------------------------------------- report --
  var rp = null;
  function rpt() {
    if (!rp) { var y = B.today().slice(0, 4); rp = { from: y + '-01-01', to: B.today() }; }
    return api('/api/assets/report?from=' + rp.from + '&to=' + rp.to).then(function (d) {
      var cols = [['cost_open', 'Cost at start'], ['additions', 'Bought'], ['cost_disposed', 'Disposed of'], ['cost_close', 'Cost at end'], ['accum_open', 'Depreciation at start'], ['charge', 'Charged'], ['accum_disposed', 'Taken off'], ['accum_close', 'Depreciation at end'], ['book_value', 'Book value']];
      $('#out').innerHTML = '<div class="card"><h2>Fixed asset schedule</h2><p class="sub">For the accounts and the tax return: cost and depreciation by class over the period. The ledger\'s own balances are on the Accounting tie-out.</p>' +
        '<div class="controls"><div><label>From</label><input type="date" id="pF" value="' + rp.from + '"></div><div><label>To</label><input type="date" id="pT" value="' + rp.to + '"></div><button class="primary" id="pGo">Show</button><button id="pCsv">Download CSV</button><button onclick="window.print()">Print</button></div>' +
        '<div class="scroll"><table><thead><tr><th>Class</th>' + cols.map(function (c) { return '<th class="n">' + c[1] + '</th>'; }).join('') + '</tr></thead><tbody>' +
        (d.rows.length ? d.rows.map(function (r) { return '<tr><td>' + esc(r.class_name) + '</td>' + cols.map(function (c) { return '<td class="n">' + J(r[c[0]]) + '</td>'; }).join('') + '</tr>'; }).join('') +
          '<tr><td><b>Total</b></td>' + cols.map(function (c) { return '<td class="n"><b>' + J(d.totals[c[0]]) + '</b></td>'; }).join('') + '</tr>' : '<tr><td colspan="10" class="empty">No assets in this period.</td></tr>') + '</tbody></table></div></div>';
      $('#pGo').onclick = function () { rp = { from: $('#pF').value, to: $('#pT').value }; rpt(); };
      $('#pCsv').onclick = function () { B.csv('asset-schedule-' + rp.from + '-to-' + rp.to + '.csv', [['Class'].concat(cols.map(function (c) { return c[1]; }))].concat(d.rows.map(function (r) { return [r.class_name].concat(cols.map(function (c) { return r[c[0]]; })); }))); };
    }).catch(function (e) { $('#out').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>'; });
  }

  // ------------------------------------------------------------- classes --
  function cls() {
    return loadMeta().then(function () {
      $('#out').innerHTML = '<div class="card"><h2>Asset classes</h2><p class="sub">Each class says where an asset\'s cost, accumulated depreciation and depreciation expense go in the chart of accounts, and the usual method, life and salvage for new assets.</p>' +
        '<div class="controls"><button class="primary" id="cAdd">+ New class</button></div><div class="scroll"><table><thead><tr><th>Class</th><th>Cost account</th><th>Accumulated depreciation</th><th>Expense</th><th>Usual method</th><th class="n">In use</th><th></th></tr></thead><tbody>' +
        meta.classes.map(function (k) { return '<tr class="click" data-k="' + k.id + '" style="' + (k.is_active ? '' : 'opacity:.55') + '"><td><b>' + esc(k.name) + '</b></td><td>' + esc(k.asset_account) + '</td><td>' + esc(k.accum_account || '–') + '</td><td>' + esc(k.expense_account || '–') + '</td><td>' + esc(METHOD[k.method]) + (k.life_months ? ', ' + life(k.life_months) : '') + (k.rate_pct ? ', ' + k.rate_pct + '%' : '') + (Number(k.salvage_pct) ? ', salvage ' + k.salvage_pct + '%' : '') + '</td><td class="n">' + k.assets + '</td><td>' + (k.is_active ? '' : '<span class="pill">retired</span>') + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
      $('#cAdd').onclick = function () { classForm(null); };
      all('[data-k]').forEach(function (tr) { tr.onclick = function () { classForm(meta.classes.find(function (k) { return String(k.id) === tr.getAttribute('data-k'); })); }; });
    });
  }
  function classForm(k) {
    var x = k || { method: 'straight_line', life_months: 60, salvage_pct: 0, is_active: true };
    var assets = meta.accounts.filter(function (a) { return a.type === 'asset'; }), exp = meta.accounts.filter(function (a) { return ['expense', 'other_expense', 'cogs'].indexOf(a.type) >= 0; });
    modal('<h2>' + (k ? esc(k.name) : 'New asset class') + '</h2><div class="grid2">' +
      '<div><label>Name</label><input id="kName" value="' + esc(x.name || '') + '"></div><div><label>Usual method</label><select id="kMethod">' + Object.keys(METHOD).map(function (m) { return '<option value="' + m + '"' + (x.method === m ? ' selected' : '') + '>' + METHOD[m] + '</option>'; }).join('') + '</select></div>' +
      '<div><label>Cost account</label><select id="kA">' + opts(assets, x.asset_account_id, acctLabel, 'Choose…') + '</select></div>' +
      '<div><label>Accumulated depreciation account</label><select id="kAd">' + opts(assets, x.accum_account_id, acctLabel, 'None (not depreciated)') + '</select></div>' +
      '<div><label>Depreciation expense account</label><select id="kEx">' + opts(exp, x.expense_account_id, acctLabel, 'None (not depreciated)') + '</select></div>' +
      '<div><label>Usual life (months)</label><input type="number" id="kLife" value="' + (x.life_months || '') + '"></div>' +
      '<div><label>Declining balance rate (% a year)</label><input type="number" step="0.01" id="kRate" value="' + (x.rate_pct || '') + '"></div>' +
      '<div><label>Usual salvage (% of cost)</label><input type="number" step="0.01" id="kSalv" value="' + (x.salvage_pct || 0) + '"></div>' +
      '<div><label><input type="checkbox" id="kOn"' + (x.is_active ? ' checked' : '') + '> In use for new assets</label></div></div>' +
      (k && k.assets ? '<div class="note info" style="margin-top:8px">Assets in this class are in the books on these accounts, so the accounts cannot change: make a new class instead.</div>' : '') +
      '<div class="controls" style="margin-top:10px"><button class="primary" id="kSave">Save</button><button id="kX">Cancel</button></div>');
    $('#kX').onclick = close;
    $('#kSave').onclick = function () {
      api(k ? '/api/assets/classes/' + k.id : '/api/assets/classes', k ? 'PUT' : 'POST', { name: $('#kName').value, method: $('#kMethod').value, asset_account_id: $('#kA').value, accum_account_id: $('#kAd').value,
        expense_account_id: $('#kEx').value, life_months: $('#kLife').value, rate_pct: $('#kRate').value, salvage_pct: $('#kSalv').value, is_active: $('#kOn').checked })
        .then(function () { close(); toast('Saved'); cls(); }).catch(function (e) { toast(e.message); });
    };
  }

  // --------------------------------------------------------------- tabs --
  var VIEWS = { reg: reg, dep: dep, rpt: rpt, cls: cls };
  function mark() { all('#tabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tab); }); try { localStorage.setItem('vision.faTab', tab); } catch (_) {} }
  function show() { (VIEWS[tab] || reg)(); }
  all('#tabs button').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); mark(); show(); }; });
  if (!VIEWS[tab]) tab = 'reg';
  mark(); show();
})();
</script>
</body>
</html>
