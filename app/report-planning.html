<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning · Vision Auto Solutions</title>
<style>
  :root{ --red:#d62828; --navy:#0b1b2b; --ink:#0f1720; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ok:#16a34a; --warn:#b45309; --chip:#eef2f7; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; --chip:#1f2b38; --warn:#f59e0b; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0}
  header nav{margin-left:auto;display:flex;gap:14px;font-size:13px}
  header a{color:#fff;opacity:.85}
  main{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
  .controls label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  button{cursor:pointer;background:var(--card)}
  button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
  button.sm{padding:4px 9px;font-size:12.5px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 12px}
  .tabs button{border-radius:999px;padding:6px 13px;font-size:13px}
  .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  table{width:100%;border-collapse:collapse}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .kpi{background:var(--chip);border-radius:10px;padding:10px 12px;border-left:4px solid transparent}
  .kpi.good{border-left-color:var(--ok)} .kpi.bad{border-left-color:var(--red)} .kpi.warn{border-left-color:var(--warn)}
  .kpi span{display:block;font-size:12px;color:var(--muted)}
  .kpi b{font-size:20px;font-variant-numeric:tabular-nums;display:block}
  .kpi small{font-size:11.5px;color:var(--muted)}
  .up{color:var(--ok)} .down{color:var(--red)}
  .flag{padding:7px 10px;border-radius:8px;margin-bottom:6px;font-size:13px}
  .flag.bad{background:#d6282814;border-left:3px solid var(--red)}
  .flag.warn{background:#f59e0b18;border-left:3px solid var(--warn)}
  .flag.info{background:var(--chip);border-left:3px solid var(--muted)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:860px){ .grid{grid-template-columns:1fr} }
  .scroll{overflow-x:auto}
  .empty{color:var(--muted);text-align:center;padding:24px}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
  .pill.bad{background:#d6282822;color:var(--red)} .pill.ok{background:#16a34a22;color:var(--ok)}
  .bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;min-width:80px}
  .bar i{display:block;height:100%;background:var(--red)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:50}
  @media print{ header,.controls,.tabs,.noprint{display:none !important} body{background:#fff;color:#000;font-size:11px} .card{break-inside:avoid;border:1px solid #bbb} main{max-width:none;padding:0} }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<header><h1>Planning</h1><nav><a href="/report-balancing.html">Balancing report</a><a href="/messages.html">Customer messages</a><a href="/warehouse.html">Warehouse</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="card">
    <div class="controls">
      <div><label for="from">From</label><input type="date" id="from"></div>
      <div><label for="to">To</label><input type="date" id="to"></div>
      <button class="primary" id="run">Refresh</button>
      <button id="rec" class="noprint">+ Record a lost sale</button>
      <button id="print" class="noprint">Print</button>
    </div>
    <div class="noprint" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap" id="presets">
      <button class="sm" data-p="7">Last 7 days</button><button class="sm" data-p="30">Last 30 days</button><button class="sm" data-p="month">This month</button>
      <button class="sm" data-p="lastmonth">Last month</button><button class="sm" data-p="90">Last 90 days</button><button class="sm" data-p="year">This year</button>
    </div>
  </div>
  <div class="tabs noprint" role="tablist" id="tabs">
    <button data-t="dash" class="on">Dashboard</button><button data-t="lost">Lost sales</button><button data-t="calls">Call-backs</button>
    <button data-t="stock">Dead &amp; slow stock</button><button data-t="oos">Out of stock</button><button data-t="sup">Suppliers</button><button data-t="deliv">Delivery</button><button data-t="targets">Targets</button>
  </div>
  <div id="out"><div class="empty">Loading…</div></div>
</main>
<div class="toast" id="toast"></div>
<script src="/assets/lost-sale.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var J = function (v, dp) { if (v == null) return '–'; var x = Number(v); var s = Math.abs(x).toLocaleString('en-JM', { minimumFractionDigits: dp == null ? 0 : dp, maximumFractionDigits: dp == null ? 0 : dp }); return (x < 0 ? '-' : '') + 'J$' + s; };
  var N = function (v) { return v == null ? '–' : Number(v).toLocaleString('en-JM'); };
  var P = function (v) { return v == null ? '–' : v + '%'; };
  var REASON = { out_of_stock: 'Out of stock', not_stocked: 'Not carried', price: 'Price', lead_time: 'Wait too long', quality: 'Brand / quality', other: 'Other',
    short_not_found: 'Short pick: not found', short_damaged: 'Short pick: damaged', short_wrong_part: 'Short pick: wrong part', short_other: 'Short pick: other',
    order_expired: 'Order expired at cashier', order_cancelled: 'Order cancelled' };
  var SOURCE = { manual: 'Recorded', short_pick: 'Short pick', order_expired: 'Order expired', order_cancelled: 'Order cancelled' };
  var tab = 'dash', dash = null, cache = {};
  try { tab = localStorage.getItem('vision.planTab') || 'dash'; } catch (_) {}

  function toast(t) { var el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.style.display = 'none'; }, 2600); }
  function api(url, method, body) {
    return fetch(url, { method: method || 'GET', credentials: 'same-origin', headers: { Accept: 'application/json', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        if (r.status === 401) { location.href = '/admin.html'; throw new Error('Sign in required'); }
        return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; });
      });
  }
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function preset(p) {
    var t = new Date(), f = new Date(t);
    if (p === 'month') f = new Date(t.getFullYear(), t.getMonth(), 1);
    else if (p === 'lastmonth') { f = new Date(t.getFullYear(), t.getMonth() - 1, 1); t = new Date(t.getFullYear(), t.getMonth(), 0); }
    else if (p === 'year') f = new Date(t.getFullYear(), 0, 1);
    else f.setDate(t.getDate() - (Number(p) - 1));
    $('#from').value = ymd(f); $('#to').value = ymd(t);
  }
  function qs() { return 'from=' + $('#from').value + '&to=' + $('#to').value; }
  function change(cur, prev, higherIsBetter) {
    if (cur == null || prev == null || !Number(prev)) return '';
    var d = (cur - prev) / Math.abs(prev) * 100, good = higherIsBetter ? d >= 0 : d <= 0;
    return ' <small class="' + (good ? 'up' : 'down') + '">' + (d >= 0 ? '▲' : '▼') + Math.abs(d).toFixed(1) + '% vs previous</small>';
  }
  function kpi(label, value, sub, state) { return '<div class="kpi ' + (state || '') + '"><span>' + label + '</span><b>' + value + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div>'; }
  function vsTarget(v, target, higherIsBetter) { if (v == null) return ''; return (higherIsBetter ? v >= target : v <= target) ? 'good' : 'bad'; }
  function csv(name, head, rows) {
    var q = function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var blob = new Blob([[head].concat(rows).map(function (r) { return r.map(q).join(','); }).join('\n')], { type: 'text/csv' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  // ---------------------------------------------------------- dashboard --
  function renderDash(d) {
    var s = d.sales, pv = d.prev_sales, t = d.targets, inv = d.inventory, ag = d.ageing, f = d.fill;
    var h = '';
    h += '<div class="card"><h2>What needs attention</h2><p class="sub">' + esc(d.period.from) + ' to ' + esc(d.period.to) + ' (' + d.period.days + ' days), compared with the ' + d.period.days + ' days before.</p>' +
      (d.flags.length ? d.flags.map(function (x) { return '<div class="flag ' + x.level + '">' + esc(x.text) + '</div>'; }).join('') : '<div class="flag info">Everything is on target.</div>') + '</div>';
    h += '<div class="card"><h2>Sales and profit</h2><div class="kpis">' +
      kpi('Net sales (after returns, ex GCT)', J(s.net_sales), change(s.net_sales, pv.net_sales, true)) +
      kpi('Gross profit', J(s.gross_profit), change(s.gross_profit, pv.gross_profit, true)) +
      kpi('Gross margin', P(s.gp_pct), 'target ' + t.plan_target_gp_pct + '%', vsTarget(s.gp_pct, t.plan_target_gp_pct, true)) +
      kpi('Sales', N(s.transactions), change(s.transactions, pv.transactions, true)) +
      kpi('Average sale', J(s.avg_ticket), change(s.avg_ticket, pv.avg_ticket, true)) +
      kpi('Returns (credit notes)', J(s.returns), s.net_sales ? (Math.round(s.returns / (s.net_sales + s.returns) * 1000) / 10) + '% of sales' : '') +
      '</div></div>';
    h += '<div class="card"><h2>Service: did we have what customers asked for?</h2><div class="kpis">' +
      kpi('Fill rate', P(f.rate), 'target ' + t.plan_target_fill_rate + '%' + (f.prev_rate != null ? ' · before ' + f.prev_rate + '%' : ''), vsTarget(f.rate, t.plan_target_fill_rate, true)) +
      kpi('Lost sales', J(f.lost_value), N(f.lost) + ' units' + change(f.lost_value, f.prev_lost_value, false), f.lost_value > 0 ? 'warn' : 'good') +
      kpi('Sellers out of stock', N(d.out_of_stock.count), 'sold in last 90 days, none on hand', d.out_of_stock.count ? 'warn' : 'good') +
      kpi('Call-backs waiting', N(d.follow_ups.waiting), N(d.follow_ups.ready) + ' can be called now', d.follow_ups.ready ? 'warn' : '') +
      kpi('Pick accuracy', P(d.picking.accuracy), N(d.picking.short_lines) + ' of ' + N(d.picking.lines) + ' lines short', vsTarget(d.picking.accuracy, t.plan_target_pick_accuracy, true)) +
      kpi('Order to ready', d.picking.avg_order_to_ready_min == null ? '–' : d.picking.avg_order_to_ready_min + ' min', 'average, pick ' + (d.picking.avg_pick_min == null ? '–' : d.picking.avg_pick_min + ' min')) +
      '</div>' + (Object.keys(f.by_source).length ? '<p class="sub" style="margin-top:10px">Lost from: ' + Object.keys(f.by_source).map(function (k) { return esc(SOURCE[k] || k) + ' ' + J(f.by_source[k].value) + ' (' + N(f.by_source[k].units) + ' units)'; }).join(' · ') + '</p>' : '') + '</div>';
    var deadCost = ag.dead ? ag.dead.cost : 0, slowCost = ag.slow ? ag.slow.cost : 0;
    h += '<div class="card"><h2>Inventory: is cash working?</h2><div class="kpis">' +
      kpi('Stock at cost', J(inv.cost), N(inv.skus_in_stock) + ' parts · ' + N(inv.units) + ' units') +
      kpi('Stock at retail', J(inv.retail), inv.cost ? 'markup ' + Math.round((inv.retail / inv.cost - 1) * 100) + '%' : '') +
      kpi('Days of cover', inv.days_cover == null ? '–' : N(inv.days_cover), 'target ' + t.plan_target_days_cover + ' · turns ' + (inv.turns == null ? '–' : inv.turns) + '×/yr', vsTarget(inv.days_cover, t.plan_target_days_cover, false)) +
      kpi('Dead stock', J(deadCost), P(ag.dead_pct) + ' of stock · no sale in ' + t.plan_dead_days + ' days', vsTarget(ag.dead_pct, t.plan_target_dead_pct, false)) +
      kpi('Slow stock', J(slowCost), P(ag.slow_pct) + ' of stock · no sale in ' + t.plan_slow_days + ' days') +
      kpi('Parts without a bin', N(inv.unassigned.skus), N(inv.unassigned.units) + ' units', inv.unassigned.skus ? 'warn' : 'good') +
      kpi('Count accuracy', P(d.counting.accuracy), N(d.counting.lines) + ' lines counted · net ' + J(d.counting.net_value), vsTarget(d.counting.accuracy, t.plan_target_count_accuracy, true)) +
      kpi('Never counted', N(d.counting.in_stock_never_counted), 'parts in stock') +
      '</div>' + (ag.lines_reliable_from ? '<p class="sub" style="margin-top:10px">Sales up to ' + esc(ag.lines_reliable_from) + ' were imported without their part lines, so a part that last sold before then can be counted as dead or slow when it is not. Check before writing anything off.</p>' : '') + '</div>';
    h += '<div class="grid"><div class="card"><h2>Suppliers and payables</h2><div class="kpis">' +
      kpi('Owed to suppliers', J(d.payables.owed), J(d.payables.due_7d) + ' due in 7 days') +
      kpi('Past due', J(d.payables.overdue), '', d.payables.overdue > 0 ? 'bad' : 'good') +
      kpi('Bills to confirm', N(d.payables.bills_to_confirm), 'received, bill not confirmed', d.payables.bills_to_confirm ? 'warn' : '') +
      kpi('Backorders', N(d.backorders.units) + ' units', N(d.backorders.lines) + ' lines · ' + N(d.backorders.overdue_lines) + ' late', d.backorders.overdue_lines ? 'warn' : '') +
      '</div></div><div class="card"><h2>Cash drawers</h2><div class="kpis">' +
      kpi('Shifts closed', N(d.tills.shifts), '') +
      kpi('Over / short', J(d.tills.net, 2), N(d.tills.off) + ' shifts off · ' + J(d.tills.abs, 2) + ' total gap', d.tills.off ? 'warn' : 'good') +
      kpi('Not reviewed', N(d.tills.unreviewed), 'shifts off and not reviewed', d.tills.unreviewed ? 'bad' : 'good') +
      '</div></div></div>';
    return h;
  }

  // ---------------------------------------------------------- lost sales --
  function renderLost(r) {
    var h = '<div class="card"><h2>Lost sales <button class="sm noprint" id="lostCsv">CSV</button></h2><p class="sub">' + N(r.summary.lines) + ' lines · ' + N(r.summary.units) + ' units · ' + J(r.summary.value) +
      '. Recorded at the counter, short picks in the warehouse, and orders that expired or were cancelled at the cashier.</p>';
    var max = Math.max.apply(null, r.by_reason.map(function (x) { return Number(x.value) || 0; }).concat([1]));
    h += '<div class="grid"><div><table><thead><tr><th>Why</th><th class="n">Units</th><th class="n">Value</th><th></th></tr></thead><tbody>' +
      (r.by_reason.length ? r.by_reason.map(function (x) { return '<tr><td>' + esc(REASON[x.reason] || x.reason) + '</td><td class="n">' + N(x.units) + '</td><td class="n">' + J(x.value) + '</td><td style="width:30%"><div class="bar"><i style="width:' + Math.round(x.value / max * 100) + '%"></i></div></td></tr>'; }).join('') : '<tr><td colspan="4" class="empty">None in this period.</td></tr>') +
      '</tbody></table></div><div><table><thead><tr><th>Most asked for</th><th class="n">Times</th><th class="n">Units</th><th class="n">Value</th><th class="n">Stock now</th></tr></thead><tbody>' +
      (r.top.length ? r.top.slice(0, 15).map(function (x) { return '<tr><td>' + (x.sku ? '<b>' + esc(x.sku) + '</b> ' : '<span class="pill">not carried</span> ') + esc(x.name) + '</td><td class="n">' + N(x.times) + '</td><td class="n">' + N(x.units) + '</td><td class="n">' + J(x.value) + '</td><td class="n">' + (x.product_img ? N(x.stock_now) : '–') + '</td></tr>'; }).join('') : '<tr><td colspan="5" class="empty">None.</td></tr>') +
      '</tbody></table></div></div></div>';
    h += '<div class="card"><h2>Every lost line</h2><div class="scroll"><table><thead><tr><th>When</th><th>From</th><th>Part</th><th class="n">Qty</th><th class="n">Value</th><th>Why</th><th>Customer</th><th>By</th><th></th></tr></thead><tbody>' +
      (r.rows.length ? r.rows.map(function (x) {
        return '<tr><td>' + esc(new Date(x.created_at).toLocaleString('en-JM', { dateStyle: 'short', timeStyle: 'short' })) + '</td><td><span class="pill">' + esc(SOURCE[x.source] || x.source) + '</span>' + (x.source !== 'manual' ? '<br><small>' + esc(x.ref) + '</small>' : '') + '</td>' +
          '<td>' + (x.sku ? '<b>' + esc(x.sku) + '</b> ' : '') + esc(x.name) + (x.vehicle ? '<br><small>' + esc(x.vehicle) + '</small>' : '') + (x.competitor ? '<br><small>went to ' + esc(x.competitor) + '</small>' : '') + '</td>' +
          '<td class="n">' + N(x.qty) + '</td><td class="n">' + J(x.value) + '</td><td>' + esc(REASON[x.reason] || x.reason) + (x.note ? '<br><small>' + esc(x.note) + '</small>' : '') + '</td>' +
          '<td>' + esc(x.customer_name || '') + (x.customer_phone ? '<br><small>' + esc(x.customer_phone) + '</small>' : '') + '</td><td>' + esc(x.recorded_by || '') + '</td>' +
          '<td class="noprint">' + (x.lost_id ? '<button class="sm" data-del="' + x.lost_id + '" title="Remove a mistaken entry">✕</button>' : '') + '</td></tr>';
      }).join('') : '<tr><td colspan="9" class="empty">No lost sales in this period.</td></tr>') + '</tbody></table></div></div>';
    return h;
  }

  function renderCalls(r) {
    return '<div class="card"><h2>Customers to call back</h2><p class="sub">Lost sales from the last 120 days where the customer asked to be called. Parts now in stock come first.</p><div class="scroll"><table><thead><tr><th>Asked</th><th>Part</th><th class="n">Qty</th><th>Customer</th><th>Stock now</th><th></th></tr></thead><tbody>' +
      (r.follow_ups.length ? r.follow_ups.map(function (x) {
        return '<tr><td>' + esc(new Date(x.created_at).toLocaleDateString('en-JM')) + '</td><td>' + (x.sku ? '<b>' + esc(x.sku) + '</b> ' : '') + esc(x.name || x.description) + (x.vehicle ? '<br><small>' + esc(x.vehicle) + '</small>' : '') + '</td><td class="n">' + N(x.qty) + '</td>' +
          '<td>' + esc(x.customer_name || '') + '<br><a href="tel:' + esc(x.customer_phone) + '">' + esc(x.customer_phone) + '</a></td>' +
          '<td>' + (x.in_stock ? '<span class="pill ok">' + N(x.stock_count) + ' in stock · ' + J(x.price_usd, 2) + '</span>' : '<span class="pill">' + (x.stock_count == null ? 'not carried' : 'not yet') + '</span>') + '</td>' +
          '<td style="white-space:nowrap">' + (x.in_stock ? '<button class="sm" data-text="' + x.id + '" title="Send the part-in-stock message">Text</button> ' : '') +
            '<button class="sm" data-called="' + x.id + '">Called</button>' + (x.messaged_at ? '<br><small>texted ' + esc(new Date(x.messaged_at).toLocaleDateString('en-JM')) + '</small>' : '') + '</td></tr>';
      }).join('') : '<tr><td colspan="6" class="empty">Nobody is waiting for a call.</td></tr>') + '</tbody></table></div></div>';
  }

  function stockTable(list, cols) {
    return '<div class="scroll"><table><thead><tr><th>Part</th><th>Category</th><th class="n">On hand</th><th class="n">Cost each</th><th class="n">Value at cost</th><th>Last sold</th></tr></thead><tbody>' +
      (list && list.length ? list.map(function (x) { return '<tr><td><b>' + esc(x.sku || x.img) + '</b> ' + esc(x.name) + '</td><td>' + esc(x.category || '') + '</td><td class="n">' + N(x.stock_count) + '</td><td class="n">' + J(x.cost, 2) + '</td><td class="n">' + J(x.value) + '</td><td>' + esc(x.last_sold || 'never') + '</td></tr>'; }).join('') : '<tr><td colspan="6" class="empty">None.</td></tr>') + '</tbody></table></div>';
  }
  function renderStock(d) {
    var ag = d.ageing, t = d.targets;
    return '<div class="card"><h2>Dead stock <button class="sm noprint" id="deadCsv">CSV</button></h2><p class="sub">' + N(ag.dead && ag.dead.skus) + ' parts, ' + J(ag.dead && ag.dead.cost) + ' at cost, ' + J(ag.dead && ag.dead.retail) + ' at retail: no sale in ' + t.plan_dead_days +
      ' days. Options: promotion or bundle, return to supplier, sell to another shop, write down. Biggest 40 by value:</p>' + stockTable(ag.dead && ag.dead.top) + '</div>' +
      '<div class="card"><h2>Slow stock</h2><p class="sub">' + N(ag.slow && ag.slow.skus) + ' parts, ' + J(ag.slow && ag.slow.cost) + ' at cost: no sale in ' + t.plan_slow_days + ' days. Stop reordering these. Biggest 40:</p>' + stockTable(ag.slow && ag.slow.top) + '</div>';
  }
  function renderOos(d) {
    return '<div class="card"><h2>Out of stock, but they sell <button class="sm noprint" id="oosCsv">CSV</button></h2><p class="sub">' + N(d.out_of_stock.count) + ' parts sold in the last 90 days and have none on hand. Top 30 by 90-day sales; reorder from Warehouse → Office → Reorder.</p><div class="scroll"><table><thead><tr><th>Part</th><th class="n">Sold 90 days</th><th class="n">Sales 90 days</th><th class="n">On hand</th><th class="n">On order</th></tr></thead><tbody>' +
      (d.out_of_stock.top.length ? d.out_of_stock.top.map(function (x) { return '<tr><td><b>' + esc(x.sku || x.img) + '</b> ' + esc(x.name) + '</td><td class="n">' + N(x.sold_90d) + '</td><td class="n">' + J(x.sales_90d) + '</td><td class="n">' + N(x.stock_count) + '</td><td class="n">' + (x.on_order ? N(x.on_order) : '<span class="pill bad">none</span>') + '</td></tr>'; }).join('') : '<tr><td colspan="5" class="empty">None.</td></tr>') + '</tbody></table></div></div>';
  }
  function renderSup(d) {
    return '<div class="card"><h2>Supplier performance, last 12 months</h2><p class="sub">Days from order to receipt posted, against the lead time set on the supplier (what reorder points use). A supplier slower than set means reorder points for their parts are too low.</p><div class="scroll"><table><thead><tr><th>Supplier</th><th class="n">Receipts</th><th class="n">Set days</th><th class="n">Actual avg</th><th class="n">Worst</th><th class="n">On time</th><th class="n">Damaged</th></tr></thead><tbody>' +
      (d.suppliers.length ? d.suppliers.map(function (x) { return '<tr><td>' + esc(x.name) + '</td><td class="n">' + N(x.receipts) + '</td><td class="n">' + N(x.set_days) + '</td><td class="n">' + (x.actual_days == null ? '–' : x.actual_days) + (x.gap_days > 3 ? ' <span class="pill bad">+' + x.gap_days + '</span>' : '') + '</td><td class="n">' + N(x.worst_days) + '</td><td class="n">' + P(x.on_time_pct) + '</td><td class="n">' + P(x.damage_pct) + '</td></tr>'; }).join('') : '<tr><td colspan="7" class="empty">No receipts posted against purchase orders yet.</td></tr>') + '</tbody></table></div></div>';
  }
  function renderDeliv(d) {
    var s = d.summary, H = function (v) { return v == null ? '–' : v + ' h'; };
    return '<div class="card"><h2>Delivery and pickup</h2><p class="sub">Orders completed ' + esc(d.from) + ' to ' + esc(d.to) + '.</p><div class="kpis">' +
      kpi('Delivered', N(s.delivered), N(s.shipped) + ' by courier') +
      kpi('Delivered first time', P(s.first_time_pct), N(s.failed_attempts) + ' failed attempts on ' + N(s.failed_orders) + ' orders', s.first_time_pct == null ? '' : s.first_time_pct >= 95 ? 'good' : 'warn') +
      kpi('By next day', P(s.next_day_pct), 'ordered to delivered') +
      kpi('Ready to delivered', H(s.avg_ready_to_delivered_h), 'average; order to delivered ' + H(s.avg_order_to_delivered_h)) +
      kpi('Collected at counter', N(s.collected), N(s.collected_by_other) + ' by someone else') +
      kpi('Ready to collected', H(s.avg_ready_to_collected_h), 'average wait') +
      kpi('Uncollected', N(d.uncollected.orders.length), 'ready over ' + d.uncollected.days + ' days', d.uncollected.orders.length ? 'warn' : 'good') +
      kpi('Out over 24 h', N(d.out_too_long.length), 'dispatched, not marked delivered', d.out_too_long.length ? 'bad' : 'good') +
      '</div></div>' +
      '<div class="grid"><div class="card"><h2>Drivers and couriers</h2><table><thead><tr><th>Driver</th><th class="n">Runs</th><th class="n">Delivered</th><th class="n">Avg on road</th></tr></thead><tbody>' +
      (d.drivers.length ? d.drivers.map(function (x) { return '<tr><td>' + esc(x.driver) + (x.kind === 'carrier' ? ' <span class="pill">courier</span>' : '') + '</td><td class="n">' + N(x.runs) + '</td><td class="n">' + N(x.delivered) + '</td><td class="n">' + H(x.avg_on_road_h) + '</td></tr>'; }).join('') : '<tr><td colspan="4" class="empty">No runs.</td></tr>') +
      '</tbody></table></div><div class="card"><h2>Why deliveries failed</h2><table><tbody>' +
      (d.failed_reasons.length ? d.failed_reasons.map(function (x) { return '<tr><td>' + esc(x.note) + '</td><td class="n">' + N(x.n) + '</td></tr>'; }).join('') : '<tr><td class="empty">None.</td></tr>') +
      '</tbody></table></div></div>' +
      '<div class="card"><h2>Waiting to be collected over ' + d.uncollected.days + ' days</h2><p class="sub">Call these customers; stock on the shelf for them is not for sale.</p><table><thead><tr><th>Order</th><th>Customer</th><th class="n">Units</th><th class="n">Days</th></tr></thead><tbody>' +
      (d.uncollected.orders.length ? d.uncollected.orders.map(function (x) { return '<tr><td><b>' + esc(x.number) + '</b></td><td>' + esc(x.customer_name || '') + (x.customer_phone ? '<br><a href="tel:' + esc(x.customer_phone) + '">' + esc(x.customer_phone) + '</a>' : '') + '</td><td class="n">' + N(x.units) + '</td><td class="n">' + N(x.days_waiting) + '</td></tr>'; }).join('') : '<tr><td colspan="4" class="empty">None.</td></tr>') +
      '</tbody></table></div>' +
      (d.out_too_long.length ? '<div class="card"><h2>Out for delivery more than a day</h2><table><thead><tr><th>Order</th><th>Customer</th><th>Run</th><th class="n">Hours out</th></tr></thead><tbody>' +
        d.out_too_long.map(function (x) { return '<tr><td><b>' + esc(x.number) + '</b></td><td>' + esc(x.customer_name || '') + '</td><td>' + esc(x.manifest || '') + ' ' + esc(x.driver || '') + '</td><td class="n">' + N(x.hours_out) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '');
  }
  function renderTargets(r) {
    return '<div class="card"><h2>Targets</h2><p class="sub">The restructuring KPIs the dashboard is measured against. ' + (r.can_edit ? '' : 'Only someone with “Change planning targets” can edit these.') + '</p><table><tbody>' +
      r.targets.map(function (x) { return '<tr><td>' + esc(x.label) + '</td><td class="n"><input type="number" min="0" step="any" data-k="' + x.key + '" value="' + esc(x.value) + '" style="width:110px;text-align:right"' + (r.can_edit ? '' : ' disabled') + '></td></tr>'; }).join('') +
      '</tbody></table>' + (r.can_edit ? '<div style="margin-top:10px"><button class="primary" id="saveTargets">Save targets</button></div>' : '') + '</div>';
  }

  // ---------------------------------------------------------------- flow --
  function show() {
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tab); });
    try { localStorage.setItem('vision.planTab', tab); } catch (_) {}
    var out = $('#out');
    var needDash = ['dash', 'stock', 'oos', 'sup'].indexOf(tab) >= 0;
    var load = needDash ? (dash ? Promise.resolve(dash) : api('/api/plan/dashboard?' + qs()).then(function (d) { dash = d; return d; }))
      : tab === 'lost' ? (cache.lost ? Promise.resolve(cache.lost) : api('/api/plan/lost-sales?' + qs()).then(function (d) { cache.lost = d; return d; }))
      : tab === 'calls' ? api('/api/plan/follow-ups') : tab === 'deliv' ? api('/api/out/reports/delivery?' + qs()) : api('/api/plan/targets');
    if (!(needDash && dash) && !(tab === 'lost' && cache.lost)) out.innerHTML = '<div class="empty">Loading…</div>';
    load.then(function (d) {
      out.innerHTML = tab === 'dash' ? renderDash(d) : tab === 'stock' ? renderStock(d) : tab === 'oos' ? renderOos(d) : tab === 'sup' ? renderSup(d)
        : tab === 'lost' ? renderLost(d) : tab === 'calls' ? renderCalls(d) : tab === 'deliv' ? renderDeliv(d) : renderTargets(d);
      wire(d);
    }).catch(function (e) { out.innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; });
  }
  function wire(d) {
    var on = function (id, fn) { var el = document.getElementById(id); if (el) el.onclick = fn; };
    on('lostCsv', function () { csv('lost-sales.csv', ['when', 'source', 'ref', 'sku', 'part', 'asked_for', 'vehicle', 'qty', 'unit_price', 'value', 'reason', 'channel', 'competitor', 'customer', 'phone', 'recorded_by'],
      d.rows.map(function (x) { return [x.created_at, x.source, x.ref, x.sku, x.name, x.asked_for, x.vehicle, x.qty, x.unit_price, x.value, x.reason, x.channel, x.competitor, x.customer_name, x.customer_phone, x.recorded_by]; })); });
    on('deadCsv', function () { csv('dead-stock.csv', ['sku', 'part', 'category', 'on_hand', 'cost', 'value', 'last_sold'], (d.ageing.dead ? d.ageing.dead.top : []).map(function (x) { return [x.sku, x.name, x.category, x.stock_count, x.cost, x.value, x.last_sold]; })); });
    on('oosCsv', function () { csv('out-of-stock-sellers.csv', ['sku', 'part', 'sold_90d', 'sales_90d', 'on_hand', 'on_order'], d.out_of_stock.top.map(function (x) { return [x.sku, x.name, x.sold_90d, x.sales_90d, x.stock_count, x.on_order]; })); });
    on('saveTargets', function () {
      var body = {};
      Array.prototype.forEach.call(document.querySelectorAll('input[data-k]'), function (i) { body[i.getAttribute('data-k')] = i.value; });
      api('/api/plan/targets', 'PUT', body).then(function () { dash = null; toast('Targets saved'); }).catch(function (e) { toast(e.message); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (b) {
      b.onclick = function () {
        if (!confirm('Remove this lost-sale entry?')) return;
        api('/api/plan/lost-sales/' + b.getAttribute('data-del'), 'DELETE').then(function () { cache = {}; dash = null; toast('Removed'); show(); }).catch(function (e) { toast(e.message); });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-text]'), function (b) {
      b.onclick = function () {
        b.disabled = true;
        api('/api/plan/lost-sales/' + b.getAttribute('data-text') + '/notify', 'POST').then(function (r) {
          var sent = r.messages.filter(function (m) { return m.status === 'sent' || m.status === 'stubbed' || m.status === 'queued'; });
          var wa = r.messages.filter(function (m) { return m.wa_link; })[0];
          var skipped = r.messages.filter(function (m) { return m.status === 'skipped'; });
          toast(sent.length ? 'Texted' + (sent[0].status === 'stubbed' ? ' (SMS not set up: logged only)' : sent[0].status === 'queued' ? ' (held until morning)' : '') : skipped.length ? 'Not sent: ' + skipped[0].reason : wa ? 'Opening WhatsApp' : 'No message is switched on for this');
          if (wa) window.open(wa.wa_link, '_blank', 'noopener');
          show();
        }).catch(function (e) { b.disabled = false; toast(e.message); });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-called]'), function (b) {
      b.onclick = function () {
        var note = prompt('Outcome of the call (optional), e.g. "bought", "no answer", "went elsewhere"');
        if (note === null) return;
        api('/api/plan/lost-sales/' + b.getAttribute('data-called') + '/followed-up', 'POST', { note: note }).then(function () { toast('Marked as called'); show(); }).catch(function (e) { toast(e.message); });
      };
    });
  }
  function refresh() { dash = null; cache = {}; show(); }

  preset('30');
  $('#run').onclick = refresh;
  $('#print').onclick = function () { window.print(); };
  $('#rec').onclick = function () { VisionLostSale.open({ onSaved: function () { toast('Lost sale recorded'); refresh(); } }); };
  Array.prototype.forEach.call(document.querySelectorAll('#presets button'), function (b) { b.onclick = function () { preset(b.getAttribute('data-p')); refresh(); }; });
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); show(); }; });
  show();
})();
</script>
