<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d61f2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vision Auto">
<title>Vision Auto Mobile</title>
<link rel="manifest" href="/mobile.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{--red:#d61f2b}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0a0a0c;color:#fff;min-height:100vh}
  header{padding:max(18px,env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#d61f2b,#7a0f16)}
  header img{width:44px;height:44px} header b{font-size:20px;display:block} header small{opacity:.85}
  main{padding:16px;max-width:640px;margin:0 auto}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{display:flex;flex-direction:column;justify-content:space-between;min-height:118px;padding:14px;border-radius:18px;background:#16181c;border:1px solid #2a2d33;color:#fff;text-decoration:none}
  .tile:active{transform:scale(.98)} .tile .ic{font-size:34px} .tile b{font-size:16px} .tile small{color:#9ca3af;font-size:12px}
  .tile.hot{background:linear-gradient(135deg,#1e3a8a,#111827);border-color:#1e40af}
  .card{background:#16181c;border:1px solid #2a2d33;border-radius:16px;padding:14px;margin-top:14px;font-size:14px;color:#d1d5db}
  label{display:block;font-size:13px;color:#9ca3af;margin:10px 0 4px} input{width:100%;font-size:17px;padding:12px;border-radius:12px;border:1px solid #374151;background:#0f1115;color:#fff}
  button{width:100%;padding:14px;border-radius:12px;border:0;font-size:17px;font-weight:700;margin-top:12px;background:var(--red);color:#fff}
  button.ghost{background:#1f2937;color:#e5e7eb}
  .err{color:#fca5a5;margin-top:8px} details summary{color:#9ca3af;margin-top:12px}
  .who{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#9ca3af;font-size:14px} .who a{color:#fca5a5}
</style>
</head>
<body>
<header><img src="/favicon.svg" alt=""><div><b>Vision Auto Mobile</b><small>Stock · deliveries · time clock · cashier</small></div></header>
<main id="main">Loading…</main>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function api(url, method, body) {
    return fetch(url, { method: method || 'GET', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || ('Error ' + r.status)); e.status = r.status; throw e; } return j; }); });
  }
  // What each tile needs (permission keys; the page itself checks again).
  var TILES = [
    { href: '/warehouse.html#count', ic: '📋', name: 'Stock count', sub: 'Count bins, recount', need: 'warehouse.access' },
    { href: '/warehouse.html#orders', ic: '🛒', name: 'Pick orders', sub: 'Pick, pack, hand over', need: 'warehouse.access' },
    { href: '/warehouse.html#move', ic: '📦', name: 'Put away / move', sub: 'Scan part, scan bin', need: 'warehouse.access' },
    { href: '/warehouse.html#receive', ic: '🚛', name: 'Receive', sub: 'Goods in from suppliers', need: 'warehouse.access' },
    { href: '/driver.html', ic: '🚚', name: 'Driver', sub: 'My jobs, route, proof', need: 'fleet.drive', hot: true },
    { href: '/clock.html', ic: '⏱️', name: 'Clock in / out', sub: 'Start and end your day', need: null },
    { href: '/cashier.html', ic: '💵', name: 'Cashier', sub: 'Take payment', need: 'cashier.access' },
    { href: '/documents.html#forms', ic: '📝', name: 'Leave & forms', sub: 'Leave, requests', need: 'docs.view' },
    { href: '/dispatch.html', ic: '🗺️', name: 'Dispatch', sub: 'Assign jobs, live map', need: 'fleet.view' },
    { href: '/warehouse.html#scan', ic: '🔎', name: 'Find a part', sub: 'Where is it, how many', need: 'warehouse.access' },
  ];
  function signIn(msg) {
    $('#main').innerHTML = '<div class="card"><b style="color:#fff;font-size:17px">Sign in</b><label>PIN</label><input id="pin" type="password" inputmode="numeric"><button id="pinGo">Sign in with PIN</button>' +
      '<details><summary>Email and password instead</summary><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button class="ghost" id="pwGo">Sign in</button></details><div class="err" id="err">' + esc(msg || '') + '</div></div>' + installHelp();
    var done = function (r) { if (r && r.need_2fa) { var c = prompt('6-digit code from your authenticator app'); if (!c) return; return api('/api/auth/2fa', 'POST', { code: c.trim() }).then(done).catch(function (e) { $('#err').textContent = e.message; }); } start(); };
    $('#pinGo').onclick = function () { api('/api/auth/pin-signin', 'POST', { pin: $('#pin').value }).then(done).catch(function (e) { $('#err').textContent = e.message; }); };
    $('#pin').onkeydown = function (e) { if (e.key === 'Enter') $('#pinGo').click(); };
    $('#pwGo').onclick = function () { api('/api/auth/signin', 'POST', { email: $('#em').value, password: $('#pw').value }).then(done).catch(function (e) { $('#err').textContent = e.message; }); };
  }
  function installHelp() {
    return '<div class="card"><b style="color:#fff">Put it on your home screen</b><br>Android (Chrome): ⋮ menu › <i>Install app</i> or <i>Add to Home screen</i>.<br>iPhone (Safari): Share ⬆ › <i>Add to Home Screen</i>.<br>It then opens full screen like an app.</div>';
  }
  function start() {
    api('/api/me').then(function (d) {
      var u = d && (d.user || d);
      if (!u || !u.id) return signIn();
      if (!u.is_admin) return signIn('This is for staff accounts.');
      var can = function (k) { return !k || !!u.perms_full || !(u.perms && u.perms[k] === false); };
      var tiles = TILES.filter(function (t) { return can(t.need); });
      $('#main').innerHTML = '<div class="who"><span>👤 ' + esc(u.name || u.email) + '</span><a href="#" id="out">Sign out</a></div><div class="tiles">' + tiles.map(function (t) {
        return '<a class="tile' + (t.hot ? ' hot' : '') + '" href="' + t.href + '"><span class="ic">' + t.ic + '</span><span><b>' + esc(t.name) + '</b><br><small>' + esc(t.sub) + '</small></span></a>';
      }).join('') + '</div>' + (tiles.length < 3 ? '<div class="card">Ask a manager if you need more of the app (Roles & permissions).</div>' : '') + installHelp();
      $('#out').onclick = function (e) { e.preventDefault(); api('/api/auth/signout', 'POST', {}).catch(function () {}).then(function () { signIn(); }); };
    }).catch(function () { signIn(); });
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/mobile-sw.js', { scope: '/' }).catch(function () {});
  start();
})();
</script>
<script src="/assets/staff-assist.js?v=20261020" defer></script>
</body>
</html>
