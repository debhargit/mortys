<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customer Reviews · Meltha Honda Sales &amp; Servs</title>
<meta name="description" content="Read verified customer reviews of Meltha Honda Sales & Servs in Kingston. Parts, service & repair feedback from real customers." />
<style>
  :root{
    --red:#d62828; --red-dark:#a31f1f;
    --navy:#0b1b2b; --ink:#0f1720;
    --muted:#6b7280; --bg:#f6f7f9;
    --card:#fff; --line:#e5e7eb;
    --ok:#16a34a; --accent:#ffb703;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
  a{color:inherit;text-decoration:none}

  header.top{background:var(--navy);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
  header.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.3px}
  header.top a.home{color:#94a3b8;font-size:13px}
  header.top a.home:hover{color:#fff}

  .hero{background:linear-gradient(135deg,var(--navy),#13283f);color:#fff;padding:44px 24px;text-align:center}
  .hero h2{margin:0 0 10px;font-size:32px;letter-spacing:-.4px}
  .hero p{margin:0;color:#cbd5e1;font-size:15px}
  .hero .agg{margin-top:22px;display:inline-flex;align-items:baseline;gap:14px;background:rgba(255,255,255,.08);padding:14px 22px;border-radius:14px}
  .hero .agg .num{font-size:42px;font-weight:900;line-height:1}
  .hero .agg .stars{color:var(--accent);font-size:22px;letter-spacing:2px}
  .hero .agg small{color:#cbd5e1;font-size:13px;display:block;margin-top:4px}

  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px}

  .filters{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .filters .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:#fff;border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .chip:hover:not(.active){background:#f1f5f9}
  .sort{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
  .sort select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;background:#fff}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}

  .review{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
  .review .top{display:flex;align-items:center;gap:10px}
  .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
  .review b{font-size:13px;display:block}
  .review .meta{font-size:11px;color:var(--muted)}
  .review .rating{color:var(--accent);font-size:14px;letter-spacing:1px}
  .review p{margin:0;font-size:13.5px;line-height:1.5;flex:1}
  .review .veh{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:auto;font-weight:600}

  .leave-cta{text-align:center;margin:36px 0 8px}
  .leave-cta a{display:inline-block;background:var(--red);color:#fff;padding:13px 26px;border-radius:10px;font-weight:700;font-size:14px}
  .leave-cta a:hover{background:var(--red-dark)}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header class="top">
  <h1>Customer Reviews</h1>
  <a class="home" href="/">← Back to shop</a>
</header>

<section class="hero">
  <h2>What Kingston drivers say</h2>
  <p>Verified feedback from real Meltha Honda customers.</p>
  <div class="agg" id="aggBox">
    <div>
      <div class="num" id="aggNum">—</div>
      <small id="aggCount">Loading…</small>
    </div>
    <div class="stars" id="aggStars">★★★★★</div>
  </div>
</section>

<div class="wrap">

  <div class="filters">
    <div class="chips" id="ratingChips">
      <button class="chip active" data-r="0">All</button>
      <button class="chip" data-r="5">5 stars</button>
      <button class="chip" data-r="4">4+ stars</button>
      <button class="chip" data-r="3">3+ stars</button>
    </div>
    <div class="sort">
      Sort by:
      <select id="sortSel">
        <option value="recent">Most recent</option>
        <option value="rating">Highest rated</option>
        <option value="oldest">Oldest first</option>
      </select>
    </div>
  </div>

  <div class="grid" id="grid">
    <div class="empty">Loading reviews…</div>
  </div>

  <div class="leave-cta">
    <a href="/#reviews">✍️ Leave a review on the home page →</a>
  </div>
</div>

<script>
'use strict';
var allReviews = [];
var filterRating = 0;
var sortMode = 'recent';

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function fmtDate(s){
  return new Date(s).toLocaleDateString('en-US', { month:'short', year:'numeric' });
}

async function load(){
  try {
    var r = await fetch('/api/reviews').then(function(x){ return x.json(); });
    allReviews = r.reviews || [];
    document.getElementById('aggNum').textContent = (r.average || 0).toFixed(1);
    document.getElementById('aggCount').textContent = (r.count || 0) + ' verified reviews';
    render();
  } catch(e){
    document.getElementById('grid').innerHTML = '<div class="empty">Could not load reviews. The backend may be offline.</div>';
  }
}

function render(){
  var list = allReviews.filter(function(rv){ return filterRating === 0 || rv.rating >= filterRating; });
  if (sortMode === 'rating') list.sort(function(a,b){ return b.rating - a.rating || new Date(b.created_at) - new Date(a.created_at); });
  else if (sortMode === 'oldest') list.sort(function(a,b){ return new Date(a.created_at) - new Date(b.created_at); });
  else list.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });

  var grid = document.getElementById('grid');
  if (!list.length){
    grid.innerHTML = '<div class="empty">No reviews match this filter yet.</div>';
    return;
  }
  grid.innerHTML = list.map(function(rv){
    var initial = (rv.name || '?').charAt(0).toUpperCase();
    var stars = '★★★★★'.slice(0, rv.rating) + '☆☆☆☆☆'.slice(0, 5 - rv.rating);
    return '<article class="review">' +
      '<div class="top"><div class="av">' + esc(initial) + '</div><div><b>' + esc(rv.name) + '</b><div class="meta">' + esc(rv.city || '') + (rv.city ? ' · ' : '') + fmtDate(rv.created_at) + '</div></div></div>' +
      '<div class="rating">' + stars + '</div>' +
      '<p>' + esc(rv.body) + '</p>' +
      (rv.vehicle ? '<span class="veh">' + esc(rv.vehicle) + '</span>' : '') +
    '</article>';
  }).join('');
}

document.querySelectorAll('#ratingChips .chip').forEach(function(c){
  c.addEventListener('click', function(){
    document.querySelectorAll('#ratingChips .chip').forEach(function(x){ x.classList.remove('active'); });
    c.classList.add('active');
    filterRating = parseInt(c.dataset.r, 10);
    render();
  });
});
document.getElementById('sortSel').addEventListener('change', function(e){
  sortMode = e.target.value;
  render();
});

load();
</script>
</body>
</html>
