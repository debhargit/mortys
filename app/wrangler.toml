name = "meltahonda"
compatibility_date = "2026-07-01"
# nodejs_compat: bcryptjs (functions/_lib/password path) touches node:crypto for
# its RNG fallback. Everything else in functions/ is WebCrypto / Web-standard.
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "meltahonda-db"
migrations_dir = "migrations"
# This is the meltahonda-db that actually exists on the account the current
# API token authenticates to, and the one holding the live data. The previous
# id (822ad731-3860-4d81-8139-6e3e28083df8) returns "database could not be
# found" here -- if that one is real it lives on a different account.
database_id = "9ad3e1e3-2019-48d3-be10-55fd98872531"

# Where new-order alerts go, and the From line for outbound email. Override
# any of these without touching code.
[vars]
ORDER_NOTIFY_TO = "admin@melthahonda.com"
ORDER_NOTIFY_SMS = "876-758-8503"
EMAIL_FROM = "Meltha Honda <noreply@melthahonda.com>"

# Phase 8 scheduled jobs (functions/_routes/cron.js). Set the shared secret
# the companion cron-worker authenticates with — until it is set, every
# /api/cron/* call is refused (jobs never run open):
#   npx wrangler pages secret put CRON_SECRET --project-name meltahonda
# Use the same value for `npx wrangler secret put CRON_SECRET` in app/cron-worker.

# Transactional email (Phase 7). functions/_lib/mailer.js targets this
# binding's API (cloudflare:email EmailMessage) and falls back to a console
# stub while it is absent, so every email-sending route still succeeds --
# it just logs instead of delivering.
#
# To turn it on:
#   1. npx wrangler email sending enable melthahonda.com
#      (currently returns "Unauthorized [code: 2036]" -- Email Sending needs a
#       one-time opt-in in the dashboard, and the API token needs its scope)
#   2. uncomment the two lines below and redeploy
# [[send_email]]
# name = "EMAIL"

# Binary uploads (Phase 7). functions/_lib/uploads.js reads/writes this bucket;
# functions/_routes/media.js serves GET /uploads/*. While the binding is
# absent, upload endpoints return a clean 501 and nothing else is affected.
#
# To turn it on (R2 needs a one-time dashboard opt-in first):
#   npx wrangler r2 bucket create meltahonda-uploads
#   then uncomment below and redeploy
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "meltahonda-uploads"
