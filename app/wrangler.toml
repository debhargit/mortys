name = "mortysautoparts"
compatibility_date = "2026-07-01"
# nodejs_compat: bcryptjs (functions/_lib/password path) touches node:crypto for
# its RNG fallback. Everything else in functions/ is WebCrypto / Web-standard.
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "mortysautoparts-db"
migrations_dir = "migrations"
# mortysautoparts-db on the debhargithub@gmail.com account
# (ce557e06f410b0e79dbd1cbe3adeef8b). Created 2026-09-03.
database_id = "bf998f24-7329-467f-959e-898589aa5c17"

# Where new-order alerts go, and the From line for outbound email. Override
# any of these without touching code.
[vars]
ORDER_NOTIFY_TO = "admin@mortysautoparts.com"
ORDER_NOTIFY_SMS = "876-905-4111"
EMAIL_FROM = "Morty's Auto Parts <noreply@mortysautoparts.com>"
# The hosted site is HTTPS-only, so the session cookie must carry Secure.
# (_lib/session.js reads this; unset = no Secure flag.)
COOKIE_SECURE = "true"

# Settings -> "Local / offline server" download panel (functions/_routes/
# admin_misc.js GET /api/admin/local-server). Publish the portable-edition
# zip somewhere the shop can reach (a GitHub release asset, an R2 public
# bucket, a file share) and point this at it. Leave blank and the panel
# shows the build-it-yourself steps instead of a download button.
# LOCAL_SERVER_URL     = "https://github.com/debhargit/meltha/releases/download/portable-vX/MortysAutoParts-portable.zip"
# LOCAL_SERVER_VERSION = "X.Y.Z"
# LOCAL_SERVER_SIZE    = "~240 MB"
# LOCAL_SERVER_SHA256  = "<sha256 of the zip>"

# Phase 8 scheduled jobs (functions/_routes/cron.js). Set the shared secret
# the companion cron-worker authenticates with — until it is set, every
# /api/cron/* call is refused (jobs never run open):
#   npx wrangler pages secret put CRON_SECRET --project-name mortysautoparts
# Use the same value for `npx wrangler secret put CRON_SECRET` in app/cron-worker.

# Transactional email (Phase 7). functions/_lib/mailer.js targets this
# binding's API (cloudflare:email EmailMessage) and falls back to a console
# stub while it is absent, so every email-sending route still succeeds --
# it just logs instead of delivering.
#
# To turn it on:
#   1. npx wrangler email sending enable mortysautoparts.com
#      (currently returns "Unauthorized [code: 2036]" -- Email Sending needs a
#       one-time opt-in in the dashboard, and the API token needs its scope)
#   2. uncomment the two lines below and redeploy
# [[send_email]]
# name = "EMAIL"

# Binary uploads (Phase 7). functions/_lib/uploads.js reads/writes this bucket;
# functions/_routes/media.js serves GET /uploads/*. While the binding is
# absent, upload endpoints return a clean 501 and nothing else is affected.
#
# To turn it on (R2 needs a one-time dashboard opt-in first):
#   npx wrangler r2 bucket create mortysautoparts-uploads
#   then uncomment below and redeploy
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "mortysautoparts-uploads"
