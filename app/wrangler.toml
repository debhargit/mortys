name = "mortysautoparts"
compatibility_date = "2026-07-01"
# nodejs_compat: bcryptjs (functions/_lib/password path) touches node:crypto for
# its RNG fallback. Everything else in functions/ is WebCrypto / Web-standard.
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "mortysautoparts-db"
migrations_dir = "migrations"
# mortysautoparts-db on the debhargithub@gmail.com account
# (ce557e06f410b0e79dbd1cbe3adeef8b). Created 2026-09-03.
database_id = "bf998f24-7329-467f-959e-898589aa5c17"

# KV cache for the signed-out storefront catalogue. The catalogue-cache cron
# (functions/_lib/jobs.js) writes the whole packed catalogue here once a day and
# guests read it instead of scanning ~36k products in D1 per edge rebuild -- the
# fix for the free-tier 5M-reads/day limit. The code falls back to a live build
# when this binding is absent, so it is safe to deploy commented out.
#
# To turn it on:
#   1) npx wrangler kv namespace create CATALOG_KV
#   2) paste the printed id below and uncomment these three lines
#   3) redeploy:  npm run cf:deploy
#   4) prime it once:  POST /api/cron/catalogue-cache  (Bearer CRON_SECRET)
# [[kv_namespaces]]
# binding = "CATALOG_KV"
# id = "<id printed by step 1>"

# Where new-order alerts go, and the From line for outbound email. Override
# any of these without touching code.
[vars]
ORDER_NOTIFY_TO = "admin@mortsautoparts.com"
ORDER_NOTIFY_SMS = "876-905-4111"
EMAIL_FROM = "Morty's Auto Parts <noreply@mortsautoparts.com>"
# The hosted site is HTTPS-only, so the session cookie must carry Secure.
# (_lib/session.js reads this; unset = no Secure flag.)
COOKIE_SECURE = "true"

# Reports and sales history are read from the till's full database over the
# tunnel (functions/_lib/till_gateway.js) -- D1 only holds 2026. Needs the
# shared secret too; the same value goes in the till's app\server-config.json
# under "gateway": { "secret": ... }:
#   npx wrangler pages secret put TILL_GATEWAY_SECRET --project-name mortysautoparts
# Without the secret, or with this line removed, everything answers from D1.
# Off until a tunnel routes till.mortsautoparts.com to the shop PC
# (cloudflared-config.yml); then uncomment.
# TILL_ORIGIN = "https://till.mortsautoparts.com"

# Settings -> "Local / offline server" download panel (functions/_routes/
# admin_misc.js GET /api/admin/local-server). Publish the portable-edition
# zip somewhere the shop can reach (a GitHub release asset, an R2 public
# bucket, a file share) and point this at it. Leave blank and the panel
# shows the build-it-yourself steps instead of a download button.
# LOCAL_SERVER_URL     = "https://github.com/debhargit/mortys/releases/download/portable-vX/MortysAutoParts-portable.zip"
# LOCAL_SERVER_VERSION = "X.Y.Z"
# LOCAL_SERVER_SIZE    = "~240 MB"
# LOCAL_SERVER_SHA256  = "<sha256 of the zip>"

# Phase 8 scheduled jobs (functions/_routes/cron.js). Set the shared secret
# the companion cron-worker authenticates with — until it is set, every
# /api/cron/* call is refused (jobs never run open):
#   npx wrangler pages secret put CRON_SECRET --project-name mortysautoparts
# Use the same value for `npx wrangler secret put CRON_SECRET` in app/cron-worker.

# Transactional email (Phase 7). functions/_lib/mailer.js targets this
# binding's API (cloudflare:email EmailMessage) and falls back to a console
# stub while it is absent, so every email-sending route still succeeds --
# it just logs instead of delivering.
#
# To turn it on:
#   1. npx wrangler email sending enable mortsautoparts.com
#      (currently returns "Unauthorized [code: 2036]" -- Email Sending needs a
#       one-time opt-in in the dashboard, and the API token needs its scope)
#   2. uncomment the two lines below and redeploy
# [[send_email]]
# name = "EMAIL"

# Storefront carrier integration (functions/_lib/carriers/*). Non-secret bits
# — shipper origin address, per-carrier on/off + account numbers — live in the
# shop_settings row (Admin -> Settings). API credentials are secrets:
#   npx wrangler pages secret put DHL_API_KEY     --project-name mortysautoparts
#   npx wrangler pages secret put DHL_API_SECRET  --project-name mortysautoparts
#   npx wrangler pages secret put DHL_ACCOUNT     --project-name mortysautoparts
#   npx wrangler pages secret put FEDEX_CLIENT_ID     --project-name mortysautoparts
#   npx wrangler pages secret put FEDEX_CLIENT_SECRET --project-name mortysautoparts
#   npx wrangler pages secret put FEDEX_ACCOUNT       --project-name mortysautoparts
# Optional: DHL_TEST=1 / FEDEX_SANDBOX=1 (or DHL_BASE / FEDEX_BASE) to hit the
# carriers' test endpoints. Missing creds -> that carrier just returns no rates
# and refuses to book; Knutsford + "manual" keep working with a table rate and a
# local tracking string. Carrier labels are stored base64 on the order row
# (orders.label_data) until the R2 UPLOADS bucket below is enabled.

# Fygaro hosted card checkout (functions/_lib/fygaro.js). The Payment Button
# UUID, display currency and on/off live in shop_settings (Admin -> Settings).
# The JWT signing secret is a wrangler secret:
#   npx wrangler pages secret put FYGARO_JWT_SECRET --project-name mortysautoparts
# The webhook is verified with a second, different secret (the one Fygaro signs
# its callback with). The webhook rejects everything until this is set:
#   npx wrangler pages secret put FYGARO_WEBHOOK_SECRET --project-name mortysautoparts
# In the Fygaro dashboard, set the button's webhook URL to
#   https://<site>/api/webhooks/fygaro
# and its return URL to https://<site>/order-success.html (the checkout also
# passes redirect_url in the JWT). Optional: FYGARO_BASE to override the host.

# Binary uploads (Phase 7). functions/_lib/uploads.js reads/writes this bucket;
# functions/_routes/media.js serves GET /uploads/*. While the binding is
# absent, upload endpoints return a clean 501 and nothing else is affected.
#
# To turn it on (R2 needs a one-time dashboard opt-in first):
#   npx wrangler r2 bucket create mortysautoparts-uploads
#   then uncomment below and redeploy
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "mortysautoparts-uploads"
