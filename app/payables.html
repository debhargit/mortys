<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payables · Vision Auto Solutions</title>
<link rel="stylesheet" href="/assets/books.css">
<link rel="icon" href="/favicon.svg?v=vision2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=vision2" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico?v=vision2" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=vision2">
<style>.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px}.sgrid label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.sgrid input,.sgrid select,.sgrid textarea{width:100%}</style>
<script src="/assets/vas-ui.js?v=20261110b" data-chrome="page"></script>
</head>
<body>
<header><h1>Suppliers &amp; payables</h1><nav><a href="/receivables.html">Receivables</a><a href="/banking.html">Banking</a><a href="/accounting.html">Ledger</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"><button data-t="sup" class="on">Suppliers</button><button data-t="pay">Pay bills</button><button data-t="bill">Enter a bill</button><button data-t="credit">Enter a supplier credit</button><button data-t="aging">A/P aging</button><button data-t="loans">Loans</button><button data-t="rec">Recurring bills</button><button data-t="qb">Import from QuickBooks</button><button data-t="train">Portal training</button></div>
  <div id="out"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<datalist id="suppliers"></datalist>
<script src="/assets/books-common.js?v=20261109cc"></script>
<script src="/assets/list-tools.js?v=20261109"></script>
<script src="/assets/billing-ui.js?v=20261104"></script>
<script src="/assets/doc-attach.js"></script>
<script src="/assets/invoice-scan.js?v=20261028"></script>
<script>
(function () {
  'use strict';
  var B = window.Books, $ = B.$, all = B.all, esc = B.esc, J = B.J, api = B.api, toast = B.toast, modal = B.modal, close = B.close;
  var tab = 'sup', suppliers = [], KIND = { receipt: 'Goods received', po: 'Purchase order', bill: 'Bill', credit: 'Credit' };

  function supplierByName(v) { v = String(v || '').trim().toLowerCase(); return suppliers.find(function (s) { return s.name.toLowerCase() === v; }); }

  // ------------------------------------------------------------ suppliers --
  // One place for suppliers: what we owe them (the old supplier centre), their
  // record (company, addresses, terms, tax: the old Admin > Suppliers screen),
  // portal logins and credit (the old Supplier management page), items bought
  // and documents. supplier-hub.js serves the list, the record and merging.
  var SUPTAB = 'acct';
  function sup() {
    var inact = !!sup.inactive;
    return api('/api/ap/supplier-centre' + (inact ? '?inactive=1' : '')).then(function (d) {
      sup.list = d.suppliers;
      $('#out').innerHTML = '<div class="tiles"><div class="tile"><span class="k">Unpaid bills</span><b>' + J(d.totals.open) + '</b></div><div class="tile bad"><span class="k">Overdue</span><b>' + J(d.totals.overdue) + '</b></div><div class="tile"><span class="k">Supplier credits</span><b>' + J(d.totals.credits) + '</b></div>' +
        '<div class="tile click" id="tdup"' + (d.duplicates ? '' : ' style="opacity:.7"') + '><span class="k">Possible duplicates</span><b' + (d.duplicates ? ' class="bad"' : '') + '>' + d.duplicates + '</b></div></div>' +
        '<div class="card"><div class="controls"><div><label>Quick view</label><select id="sview"><option value="">Every supplier</option><option value="owe">We owe them</option><option value="overdue">Overdue</option><option value="credits">They gave us credits</option><option value="portal">Portal on</option><option value="nobills">No bills yet</option></select></div>' +
        '<label style="display:flex;gap:6px;align-items:center;margin:0 0 6px"><input type="checkbox" id="inact"' + (inact ? ' checked' : '') + '> Show inactive</label>' +
        '<span style="flex:1"></span><button id="nsup" class="primary">+ New supplier</button><button id="bdup">Find duplicates</button></div>' +
        '<div id="slist"></div></div>';
      var VIEW = { owe: function (s) { return s.open > 0.005; }, overdue: function (s) { return s.overdue > 0.005; }, credits: function (s) { return s.credits > 0.005; }, portal: function (s) { return !!s.portal_enabled; }, nobills: function (s) { return !s.bills; } };
      var status = function (s) { return s.merged_into_id ? 'Merged' : s.is_active ? 'Active' : 'Inactive'; };
      var rowsNow = function () { var f = VIEW[sup.view]; return f ? sup.list.filter(f) : sup.list; };
      var lt = window.ListTools.mount($('#slist'), {
        key: 'ap-suppliers', rows: rowsNow(), csv: 'suppliers', placeholder: 'Find a supplier: name, code, contact, phone, email, amount…',
        empty: 'No suppliers yet: add one.', emptyFiltered: 'No supplier matches.',
        search: function (s) { return [s.merged_into, String(s.phone || '').replace(/\D/g, '')].join(' '); },
        totals: ['open', 'overdue', 'credits'],
        rowAttr: function (s) { return 'data-s="' + s.id + '" class="click"' + (s.is_active ? '' : ' style="opacity:.6"'); },
        cols: [
          { k: 'name', label: 'Supplier', cell: function (s) { return '<b>' + esc(s.name) + '</b>' + (s.merged_into_id ? '<div class="sub" style="margin:0">merged into ' + esc(s.merged_into || '#' + s.merged_into_id) + '</div>' : ''); } },
          { k: 'code', label: 'Code' },
          { k: 'contact_name', label: 'Contact' },
          { k: 'phone', label: 'Phone', nowrap: true },
          { k: 'email', label: 'Email' },
          { k: 'terms', label: 'Terms', type: 'num', val: function (s) { return s.payment_terms_days; }, cell: function (s) { return s.payment_terms_days != null ? 'Net ' + s.payment_terms_days : esc(s.payment_terms || ''); } },
          { k: 'portal', label: 'Portal', type: 'list', val: function (s) { return s.portal_enabled ? 'On' : 'Off'; }, cell: function (s) { return (s.portal_enabled ? '<span class="pill ok">on</span>' : '') + (s.web_retail_enabled ? ' <span class="pill">retail</span>' : ''); } },
          { k: 'credit_limit', label: 'Their credit to us', type: 'money' },
          { k: 'bills', label: 'Bills', type: 'num', cell: function (s) { return s.bills || ''; } },
          { k: 'open', label: 'Unpaid', type: 'money', cell: function (s) { return s.open ? J(s.open) : ''; } },
          { k: 'overdue', label: 'Overdue', type: 'money', cell: function (s) { return s.overdue ? '<span class="pill bad">' + J(s.overdue) + '</span>' : ''; } },
          { k: 'credits', label: 'Credits', type: 'money', cell: function (s) { return s.credits ? J(s.credits) : ''; } },
          { k: 'next_due', label: 'Next due', type: 'date', nowrap: true },
          { k: 'status', label: 'Status', type: 'list', val: status, cell: function (s) { return s.merged_into_id ? '<span class="pill">merged</span>' : s.is_active ? '' : '<span class="pill">inactive</span>'; } }
        ],
        after: function (tb) { all('[data-s]', tb).forEach(function (r) { r.onclick = function () { detail(+r.getAttribute('data-s')); }; }); }
      });
      $('#sview').value = sup.view || '';
      $('#sview').onchange = function () { sup.view = this.value; lt.refresh(rowsNow()); };
      $('#inact').onchange = function () { sup.inactive = this.checked; sup(); };
      $('#nsup').onclick = newSupplier;
      $('#bdup').onclick = $('#tdup').onclick = function () { dupes(); };
    });
  }
  function docRows(list, withPay) {
    return list.map(function (b) { return '<tr><td>' + esc(KIND[b.kind]) + '</td><td>' + esc(b.number) + (b.kind === 'bill' || b.kind === 'credit' ? ' <a href="#" data-bv="' + b.id + '">view</a>' : '') + '</td><td>' + esc(b.day) + '</td><td>' + esc(b.due || '') + '</td><td class="n">' + J(b.amount) + '</td><td class="n">' + J(b.paid) + '</td><td class="n"><b>' + J(b.open) + '</b></td><td class="n">' + (b.days_overdue ? '<span class="pill bad">' + b.days_overdue + ' d</span>' : '') + '</td></tr>'; }).join('');
  }

  // The record's editable fields (were Admin > Suppliers' tabs).
  function recordForm(s) {
    s = s || {};
    var v = function (k) { return esc(s[k] == null ? '' : s[k]); };
    var f = function (label, id, k, attrs, help) { return '<div><label>' + esc(label) + '</label><input id="' + id + '" value="' + v(k) + '"' + (attrs ? ' ' + attrs : '') + (help ? ' title="' + esc(help) + '"' : '') + '></div>'; };
    return '<div class="sgrid">' +
      '<div style="grid-column:1/-1"><label>Company name (as on their invoices)</label><input id="r_name" value="' + v('name') + '"></div>' +
      f('Code', 'r_code', 'code', 'placeholder="e.g. NAPA"', 'A short code of your own. Must be unique.') + f('Contact name', 'r_contact', 'contact_name') + f('Phone', 'r_phone', 'phone') + f('Email', 'r_email', 'email', 'type="email"') +
      f('Website', 'r_web', 'website', 'placeholder="https://"') + f('Lead time (days)', 'r_lead', 'lead_time_days', 'type="number" min="0"', 'Days from ordering to delivery. Reorder suggestions use it.') +
      f('Payment terms (days)', 'r_tdays', 'payment_terms_days', 'type="number" min="0" max="365" placeholder="blank = due on receipt"', 'Bills fall due this many days after the bill date.') +
      f('Terms as printed', 'r_terms', 'payment_terms', 'placeholder="e.g. Net 30, 2% 10"') + f('Our account # with them', 'r_acct', 'account_number') + f('Tax ID (TRN)', 'r_tax', 'tax_id', 'placeholder="123-456-789"') +
      '<div><label>Usual expense account</label><select id="r_da">' + B.accountOptions('line', s.default_account_id) + '</select></div><div><label>Usual class</label><select id="r_dc">' + B.classOptions(s.default_class_id) + '</select></div>' +
      '<div style="grid-column:span 2"><label>Address</label><textarea id="r_addr" rows="3">' + v('address') + '</textarea></div>' +
      '<div style="grid-column:span 2"><label>Remit-to address (blank = the address)</label><textarea id="r_remit" rows="3">' + v('remit_address') + '</textarea></div>' +
      '<div style="grid-column:1/-1"><label>Notes</label><textarea id="r_notes" rows="3">' + v('notes') + '</textarea></div></div>';
  }
  function recordBody() {
    var g = function (id) { var e = $('#' + id); return e ? String(e.value).trim() : ''; };
    return { name: g('r_name'), code: g('r_code') || null, contact_name: g('r_contact') || null, phone: g('r_phone') || null, email: g('r_email') || null, website: g('r_web') || null,
      lead_time_days: g('r_lead') || 7, payment_terms_days: g('r_tdays'), payment_terms: g('r_terms') || null, account_number: g('r_acct') || null, tax_id: g('r_tax') || null,
      address: g('r_addr') || null, remit_address: g('r_remit') || null, notes: g('r_notes') || null, default_account_id: g('r_da'), default_class_id: g('r_dc') };
  }
  // Saves through the two endpoints that already own these fields.
  function saveRecord(id, body) {
    var core = Object.assign({}, body); delete core.default_account_id; delete core.default_class_id;
    return api('/api/admin/suppliers/' + id, 'PATCH', core).then(function () {
      return api('/api/ap/suppliers/' + id, 'PUT', { payment_terms_days: body.payment_terms_days, default_account_id: body.default_account_id, default_class_id: body.default_class_id });
    });
  }
  function newSupplier() {
    modal('<h2>New supplier</h2>' + recordForm({ lead_time_days: 7 }) + '<div class="controls" style="margin-top:10px"><button class="primary" id="ns_go">Save supplier</button><button id="ns_x">Cancel</button></div>');
    $('#ns_x').onclick = close;
    $('#ns_go').onclick = async function () {
      var b = recordBody(); if (!b.name) return toast('Enter the supplier\'s name');
      var same = (sup.list || []).filter(function (s) { return normName(s.name) && normName(s.name) === normName(b.name); });
      if (same.length && !(await vasConfirm('There is already a supplier called ' + same[0].name + '. Add another one anyway?'))) return;
      var btn = this; btn.disabled = true;
      api('/api/admin/suppliers', 'POST', b).then(function (r) {
        return api('/api/ap/suppliers/' + r.id, 'PUT', { payment_terms_days: b.payment_terms_days, default_account_id: b.default_account_id, default_class_id: b.default_class_id }).then(function () { return r; });
      }).then(function (r) { close(); toast('Supplier added'); return loadSuppliers().then(function () { detail(r.id, 'details'); }); })
        .catch(function (e) { btn.disabled = false; toast(e.message); });
    };
  }
  function normName(s) { return String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').replace(/\b(ltd|limited|co|company|inc|incorporated|llc|corp|corporation|the|ja|jamaica|plc)\b/g, ' ').replace(/\s+/g, ''); }

  function detail(id, which) {
    if (which) SUPTAB = which;
    return Promise.all([api('/api/ap/suppliers/' + id), api('/api/ap/suppliers/' + id + '/record')]).then(function (r) {
      var d = r[0], rec = r[1], s = rec.supplier;
      var tabs = [['acct', 'Account & bills'], ['details', 'Details'], ['portal', 'Portal & credit'], ['items', 'Items purchased'], ['docs', 'Documents']].filter(function (t) { return t[0] !== 'portal' || rec.can.portal; });
      if (!tabs.some(function (t) { return t[0] === SUPTAB; })) SUPTAB = 'acct';
      var owed = d.open.filter(function (b) { return b.kind !== 'credit'; }).reduce(function (t, b) { return t + b.open; }, 0);
      $('#out').innerHTML = '<div class="controls"><button id="bk">◀ All suppliers</button></div>' +
        '<div class="card"><h2>' + esc(s.name) + (s.code ? ' <small class="sub" style="margin:0">' + esc(s.code) + '</small>' : '') + (s.is_active ? '' : ' <span class="pill">inactive</span>') + (s.portal_enabled ? ' <span class="pill ok">portal on</span>' : '') + '</h2>' +
        (s.merged_into_id ? '<div class="note warn">This supplier was merged into <a href="#" id="mto">' + esc(s.merged_into || '#' + s.merged_into_id) + '</a>' + (s.merged_at ? ' on ' + esc(String(s.merged_at).slice(0, 10)) : '') + '. Its bills, orders and parts are there now.</div>' : '') +
        (rec.merged_from.length ? '<p class="sub">Also includes ' + rec.merged_from.map(function (m) { return '<a href="#" data-mf="' + m.id + '">' + esc(m.name) + '</a>'; }).join(', ') + ' (merged in).</p>' : '') +
        '<div class="sub" style="margin:0">' + esc([s.contact_name, s.phone, s.email].filter(Boolean).join(' · ')) + (s.payment_terms_days != null ? ' · Net ' + s.payment_terms_days : '') + ' · We owe them <b>' + J(owed) + '</b></div>' +
        '<div class="tabs" style="margin:10px 0 0">' + tabs.map(function (t) { return '<button data-st="' + t[0] + '"' + (t[0] === SUPTAB ? ' class="on"' : '') + '>' + esc(t[1]) + '</button>'; }).join('') + '</div></div><div id="spane"></div>';
      $('#bk').onclick = function () { history.replaceState(null, '', location.pathname); show(); };
      if ($('#mto')) $('#mto').onclick = function (e) { e.preventDefault(); detail(s.merged_into_id); };
      all('[data-mf]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); detail(+a.getAttribute('data-mf')); }; });
      all('[data-st]').forEach(function (b) { b.onclick = function () { SUPTAB = b.getAttribute('data-st'); all('[data-st]').forEach(function (x) { x.classList.toggle('on', x === b); }); pane(); }; });
      try { history.replaceState(null, '', '#s=' + id); } catch (_) {}
      var pane = function () { ({ acct: paneAccount, details: paneDetails, portal: panePortal, items: paneItems, docs: paneDocs })[SUPTAB](id, d, rec); };
      pane();
    }).catch(function (e) { toast(e.message); });
  }
  function paneAccount(id, d, rec) {
    var s = rec.supplier;
    $('#spane').innerHTML = '<div class="card"><div class="controls"><button class="primary" id="pb">Pay bills</button><button id="eb">Enter a bill</button><button id="ec">Enter a credit</button></div></div>' +
      '<div class="card"><h2>Unpaid</h2><div class="scroll"><table><thead><tr><th>Type</th><th>Number</th><th>Date</th><th>Due</th><th class="n">Amount</th><th class="n">Paid</th><th class="n">Open</th><th class="n">Overdue</th></tr></thead><tbody>' + (d.open.length ? docRows(d.open) : '<tr><td colspan="8" class="empty">Nothing unpaid.</td></tr>') + '</tbody></table></div></div>' +
      '<div class="card"><h2>Payments</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Method</th><th>Cheque / ref</th><th>Paid from</th><th class="n">Amount</th><th></th></tr></thead><tbody>' +
      (d.payments.length ? d.payments.map(function (p) { return '<tr style="' + (p.voided_at ? 'opacity:.5' : '') + '"><td>' + esc(p.day) + '</td><td>' + esc(p.method) + '</td><td>' + esc(p.cheque_number || p.reference || '') + '</td><td>' + esc(p.paid_from) + '</td><td class="n">' + J(p.amount) + '</td><td style="white-space:nowrap"><button class="sm" data-pp="' + p.id + '">Print</button> ' + (p.voided_at ? '<span class="pill bad">void</span> <small>' + esc(p.void_reason || '') + '</small>' : '<button class="sm" data-vp="' + p.id + '">Void</button>') + '</td></tr>'; }).join('') : '<tr><td colspan="6" class="empty">No payments.</td></tr>') + '</tbody></table></div></div>' +
      (d.history.length ? '<div class="card"><h2>Paid bills</h2><div class="scroll"><table><tbody>' + docRows(d.history) + '</tbody></table></div></div>' : '');
    $('#pb').onclick = function () { tab = 'pay'; mark(); pay(id); };
    $('#eb').onclick = function () { tab = 'bill'; mark(); billForm('bill', s); };
    $('#ec').onclick = function () { tab = 'credit'; mark(); billForm('credit', s); };
    all('[data-vp]').forEach(function (b) { b.onclick = async function () { var r = await vasPrompt('Why is this payment voided? (e.g. cheque lost, wrong amount)'); if (!r) return; api('/api/ap/payments/' + b.getAttribute('data-vp') + '/void', 'POST', { reason: r }).then(function () { toast('Voided: the bills are unpaid again'); detail(id); }).catch(function (e) { toast(e.message); }); }; });
    all('[data-pp]').forEach(function (b) { b.onclick = function () { printPayment(+b.getAttribute('data-pp')); }; });
    all('[data-bv]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); viewBill(+a.getAttribute('data-bv'), function () { detail(id); }); }; });
  }
  function paneDetails(id, d, rec) {
    var s = rec.supplier;
    $('#spane').innerHTML = '<div class="card"><h2>Supplier record</h2>' + recordForm(s) +
      '<div class="controls" style="margin-top:10px"><button class="primary" id="r_save">Save supplier</button>' +
      (s.merged_into_id ? '' : '<button id="r_act">' + (s.is_active ? 'Make inactive' : 'Make active again') + '</button><button id="r_merge">Merge another supplier into this one…</button>') + '</div></div>';
    $('#r_save').onclick = function () {
      var b = recordBody(); if (!b.name) return toast('The supplier needs a name');
      var btn = this; btn.disabled = true;
      saveRecord(id, b).then(function () { toast('Saved'); return loadSuppliers(); }).then(function () { detail(id); }).catch(function (e) { btn.disabled = false; toast(e.message); });
    };
    if ($('#r_act')) $('#r_act').onclick = function () {
      api('/api/admin/suppliers/' + id, 'PATCH', { is_active: !s.is_active }).then(function () { toast(s.is_active ? 'Now inactive' : 'Active again'); detail(id); }).catch(function (e) { toast(e.message); });
    };
    if ($('#r_merge')) $('#r_merge').onclick = function () { pickToMerge(s); };
  }
  function panePortal(id) {
    $('#spane').innerHTML = '<div class="card empty">Loading…</div>';
    api('/api/admin/suppliers/' + id + '/portal').then(function (d) {
      var s = d.supplier, a = d.account;
      $('#spane').innerHTML = '<div class="card"><h2>Supplier portal and credit</h2><p class="sub">A portal login lets them manage their items, consignment, orders and account. The credit limit is what they extend to us. <a href="/supplier.html" target="_blank">Open the supplier portal ↗</a></p>' +
        '<div class="tiles"><div class="tile"><span class="k">We owe them</span><b>' + J(a.balance) + '</b></div><div class="tile' + (a.overdue ? ' bad' : '') + '"><span class="k">Overdue</span><b>' + J(a.overdue) + '</b></div><div class="tile"><span class="k">Their credit to us</span><b>' + (a.credit_limit != null ? J(a.credit_limit) : '—') + '</b></div><div class="tile"><span class="k">Items / orders</span><b>' + d.counts.items + ' / ' + d.counts.orders + '</b></div></div>' +
        '<div class="controls"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="m_portal"' + (s.portal_enabled ? ' checked' : '') + '> Portal enabled</label>' +
        '<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="m_retail"' + (s.web_retail_enabled ? ' checked' : '') + '> Allow retail through the portal</label>' +
        '<div><label>Credit limit (J$)' + (s.credit_set_by ? ' · set by ' + esc(s.credit_set_by) : '') + '</label><input id="m_credit" type="number" step="0.01" value="' + (s.credit_limit != null ? s.credit_limit : '') + '"></div><button class="primary" id="m_save">Save</button></div></div>' +
        '<div class="card"><h2>Portal logins</h2><table><tbody>' + (d.users.length ? d.users.map(function (u) { return '<tr><td>' + esc(u.name || '') + '<div class="sub" style="margin:0">' + esc(u.email) + '</div></td><td>' + esc(u.role) + '</td><td>' + (u.is_active ? '✓' : '✕') + '</td><td>' + (u.last_login_at ? B.dt(u.last_login_at) : 'never signed in') + '</td><td><button class="sm" data-reset="' + u.id + '">Reset password</button></td></tr>'; }).join('') : '<tr><td class="empty">No logins yet.</td></tr>') + '</tbody></table>' +
        '<div class="controls" style="margin-top:8px"><input id="iv_email" placeholder="Email to invite"><input id="iv_name" placeholder="Name"><select id="iv_role"><option value="owner">Owner</option><option value="manager">Manager</option><option value="staff">Staff</option></select><button class="primary" id="iv_go">Invite login</button></div><div id="iv_out" class="sub"></div></div>';
      $('#m_save').onclick = function () { api('/api/admin/suppliers/' + id + '/portal', 'PUT', { portal_enabled: $('#m_portal').checked, web_retail_enabled: $('#m_retail').checked, credit_limit: $('#m_credit').value }).then(function () { toast('Saved'); panePortal(id); }).catch(function (e) { toast(e.message); }); };
      $('#iv_go').onclick = function () {
        if (!$('#iv_email').value) return toast('Enter an email');
        api('/api/admin/suppliers/' + id + '/users', 'POST', { email: $('#iv_email').value, name: $('#iv_name').value, role: $('#iv_role').value })
          .then(function (r) { panePortal(id); setTimeout(function () { $('#iv_out').innerHTML = 'Invited. ' + (r.temp_password ? 'Temporary password: <b>' + esc(r.temp_password) + '</b> (shown once; they should change it).' : 'An email was sent.'); }, 300); }).catch(function (e) { toast(e.message); });
      };

  // ------------------------------------------------------------ pay bills --
  function pay(supplierId) {
    var dueBy = pay.due || '';
    return api('/api/ap/bills?due_by=' + dueBy + (supplierId ? '&supplier=' + supplierId : '')).then(function (d) {
      // What to pay is kept on each bill (b.pay), so ticks and amounts stay put
      // while you page, search and filter.
      d.bills.forEach(function (b, i) { b.i = i; b.pay = 0; });
      d.credits.forEach(function (c, i) { c.i = i; c.pay = 0; });
      $('#out').innerHTML = '<div class="card"><h2>Pay bills</h2><p class="sub">Tick the bills to pay; change an amount to pay part of a bill. One payment (cheque or transfer) is made per supplier, using any credits you tick for that supplier. Ticks stay when you change page or filter.</p>' +
        '<div class="controls"><div><label>Show bills due by</label><input type="date" id="db" value="' + esc(dueBy) + '"></div>' + (supplierId ? '<button id="allsup">All suppliers</button>' : '') +
        '<span style="flex:1"></span><button class="sm" id="tkall" title="Tick every bill the search and filters are showing, on every page">Tick all showing</button><button class="sm" id="tkpage" title="Tick the bills on this page">Tick this page</button><button class="sm" id="tknone">Untick all</button></div>' +
        '<div id="blist"></div>' +
        (d.credits.length ? '<h2 style="margin-top:12px">Supplier credits to use</h2><div id="clist"></div>' : '') +
        '<div class="controls" style="margin-top:12px"><div><label>Pay from</label><select id="pf">' + B.accountOptions('paybill') + '</select></div><div><label>Method</label><select id="pm"><option value="cheque">Cheque</option><option value="transfer">Bank transfer</option><option value="cash">Cash</option><option value="card">Card</option></select></div>' +
        '<div><label>First cheque no.</label><input id="pc" style="width:110px"></div><div><label>Payment date</label><input type="date" id="pd" value="' + B.today() + '"></div><div><label>Memo</label><input id="pmemo"></div></div>' +
        '<p id="sum" class="sub"></p><button class="primary" id="go">Pay selected bills</button></div>';
      var bank = B.accounts().find(function (a) { return a.system_key === 'bank'; }); if (bank) $('#pf').value = bank.id;
      // A credit card in "Pay from" pays by card (Credit cards module).
      $('#pf').onchange = function () { var a = B.accounts().find(function (x) { return String(x.id) === $('#pf').value; }); if (a && a.card) $('#pm').value = 'card'; };
      $('#db').onchange = function () { pay.due = this.value; pay(supplierId); };
      if ($('#allsup')) $('#allsup').onclick = function () { pay(); };
      var summary = function () {
        var by = {}, nb = 0;
        d.bills.forEach(function (b) { if (b.pay > 0) { nb++; by[b.supplier_id] = (by[b.supplier_id] || 0) + b.pay; } });
        d.credits.forEach(function (c) { if (c.pay > 0) by[c.supplier_id] = (by[c.supplier_id] || 0) - c.pay; });
        var ids = Object.keys(by), tot = ids.reduce(function (t, k) { return t + by[k]; }, 0);
        $('#sum').textContent = ids.length ? nb + ' bill(s) ticked · ' + ids.length + ' payment(s), total ' + J(tot) : 'Nothing selected';
        return by;
      };
      var r2 = function (v) { return Math.round(v * 100) / 100; };
      // One list helper for bills and for credits: a tick box and an amount per row.
      var wire = function (list, tb) {
        all('[data-ck]', tb).forEach(function (cb) { cb.onchange = function () { var x = list[+cb.getAttribute('data-ck')], inp = $('[data-am="' + x.i + '"]', tb); x.pay = cb.checked ? x.open : 0; inp.value = x.pay ? x.pay.toFixed(2) : ''; summary(); }; });
        all('[data-am]', tb).forEach(function (inp) { inp.oninput = function () { var x = list[+inp.getAttribute('data-am')]; x.pay = Math.max(0, r2(+inp.value || 0)); $('[data-ck="' + x.i + '"]', tb).checked = x.pay > 0; summary(); }; });
      };

      var bl = window.ListTools.mount($('#blist'), {

        d.credits.forEach(function (c) { if (c.pay > 0) (by[c.supplier_id] = by[c.supplier_id] || { bills: [], credits: [] }).credits.push({ id: c.id, amount: c.pay }); });

        var run = function (i) {

            .then(function (r) { made.push(r.id); run(i + 1); }).catch(function (e) { toast(e.message + (made.length ? ' (' + made.length + ' made before this)' : '')); pay(supplierId); });
        };
        run(0);
      };
    });
  }

  // ------------------------------------------------------------ enter bill / credit --
  function billForm(kind, pre) {
    var isCredit = kind === 'credit';
    $('#out').innerHTML = '<div class="card"><h2>' + (isCredit ? 'Supplier credit' : 'Enter a bill') + '</h2><p class="sub">' + (isCredit ? 'A credit note from a supplier (a refund owed to you, or a discount). Use it in Pay Bills to reduce a payment.' : 'For bills that did not come through a purchase order: rent, light, phone, repairs, services. Stock bought on a purchase order comes in through receiving.') + '</p>' +
      '<div class="controls" id="scanbar"></div><div id="scaninfo"></div>' +
      '<div class="controls"><div style="flex:1;min-width:220px"><label>Supplier</label><input id="bs" list="suppliers" style="width:100%" value="' + esc(pre ? pre.name : '') + '"></div><div><label>' + (isCredit ? 'Credit note no.' : 'Supplier invoice no.') + '</label><input id="bn" style="width:150px"></div>' +
      '<div><label>Date</label><input type="date" id="bd" value="' + B.today() + '"></div>' + (isCredit ? '' : '<div><label>Due (blank = from terms)</label><input type="date" id="bdu"></div>') + '</div>' +
      '<table class="lines"><thead><tr><th style="width:30%">Category (account)</th><th style="width:13%">Class</th><th style="width:15%" title="A fixed asset this cost is for: repairs, fuel, insurance">Asset</th><th>Description</th><th class="n" style="width:150px">Amount</th><th style="width:40px"></th></tr></thead><tbody id="bl"></tbody></table>' +
      '<div class="controls" style="margin-top:6px"><button class="sm" id="add">Add a line</button></div>' +
      '<div class="controls"><div><label>GCT on the bill (J$)</label><input id="bg" type="number" step="0.01" style="width:130px"></div><button class="sm" id="g15">Add 15% GCT</button><div style="flex:1"><label>Memo</label><input id="bm" style="width:100%"></div></div>' +
      '<h3 id="bt" style="text-align:right"></h3><div class="controls"><button class="primary" id="bsv">Save ' + (isCredit ? 'credit' : 'bill') + '</button></div></div>';
    var addLine = function (acct, cls) {
      var tr = document.createElement('tr');
      if (acct === undefined || cls === undefined) { var sd = supNow && supNow(); if (acct === undefined) acct = sd && sd.default_account_id; if (cls === undefined) cls = sd && sd.default_class_id; }
      tr.innerHTML = '<td><select data-la>' + B.accountOptions('line', acct) + '</select></td><td><select data-lc>' + B.classOptions(cls) + '</select></td><td><select data-lfa>' + B.assetOptions() + '</select></td><td><input data-ld></td><td><input data-lm type="number" step="0.01" style="text-align:right"></td><td><button class="sm" data-lx>✕</button></td>';
      $('#bl').appendChild(tr);
      tr.querySelector('[data-lx]').onclick = function () { tr.remove(); total(); };
      tr.querySelector('[data-lm]').oninput = total;
    };
    var sub = function () { return all('[data-lm]').reduce(function (t, x) { return t + (+x.value || 0); }, 0); };
    var total = function () { $('#bt').textContent = 'Total ' + J(sub() + (+$('#bg').value || 0)); };
    var supNow = function () { return supplierByName($('#bs').value); };
    addLine(pre ? pre.default_account_id : null, pre ? pre.default_class_id : null);
    // The supplier's default category and class fill the first line if it is still blank.
    $('#bs').onchange = function () { var s = supNow(); if (!s) return; var first = $('[data-la]'), fc = $('[data-lc]'); if (first && !first.value && s.default_account_id) first.value = s.default_account_id; if (fc && !fc.value && s.default_class_id) fc.value = s.default_class_id; };
    $('#add').onclick = function () { addLine(); };
    // The supplier's invoice: read it to fill the bill, or just attach it. Either way the
    // original is filed in the document centre against the bill when the bill is saved.
    var invFile = null;
    var showFile = function (extra) {
      $('#scaninfo').innerHTML = (invFile ? '<p class="sub">📎 <b>' + esc(invFile.name) + '</b> will be filed with this ' + (isCredit ? 'credit' : 'bill') + ' in the document centre. <a href="#" id="unfile">remove</a></p>' : '') + (extra || '');
      if ($('#unfile')) $('#unfile').onclick = function (e) { e.preventDefault(); invFile = null; showFile(); };
    };
    var fill = function (r) {
      var v = r.invoice, warn = [];
      if (!v.is_invoice) warn.push('This does not look like an invoice: check it.');
      if (r.supplier) { $('#bs').value = r.supplier.name; $('#bs').onchange(); }
      else if (v.supplier_name) warn.push('The supplier "' + esc(v.supplier_name) + '" is not on file: choose or add them.');
      if (v.invoice_number) $('#bn').value = v.invoice_number;
      if (v.invoice_date) $('#bd').value = v.invoice_date;
      if (v.due_date && $('#bdu')) $('#bdu').value = v.due_date;
      if (v.currency && v.currency !== 'JMD') warn.push('The invoice is in ' + esc(v.currency) + ': convert the amounts to J$ before saving.');
      var s = supNow(), acct = s && s.default_account_id, cls = s && s.default_class_id;
      $('#bl').innerHTML = '';
      var put = function (desc, amt) { addLine(acct || undefined, cls || undefined); var tr = $('#bl').lastChild; tr.querySelector('[data-ld]').value = desc; if (amt != null) tr.querySelector('[data-lm]').value = (+amt).toFixed(2); };
      v.lines.forEach(function (l) {
        var amt = l.amount != null ? l.amount : (l.qty != null && l.unit_cost != null ? Math.round(l.qty * l.unit_cost * 100) / 100 : null);
        put((l.qty != null && l.qty !== 1 ? l.qty + ' × ' : '') + (l.sku ? l.sku + ' ' : '') + l.description, amt);
      });
      if (!v.lines.length) put(v.supplier_name ? 'Invoice ' + (v.invoice_number || '') : '', v.subtotal != null ? v.subtotal : (v.total != null ? v.total - (v.tax || 0) - (v.freight || 0) : null));
      if (v.freight) put('Freight', v.freight);
      if (v.tax != null) $('#bg').value = (+v.tax).toFixed(2);
      if (v.notes) $('#bm').value = v.notes.slice(0, 200);
      total();
      var got = Math.round((sub() + (+$('#bg').value || 0)) * 100) / 100;
      if (v.total != null && Math.abs(got - v.total) > 0.01) warn.push('The lines add up to ' + J(got) + ' but the invoice total is ' + J(v.total) + ': check the lines.');
      showFile('<div class="note ' + (warn.length ? 'warn' : 'info') + '">Read from the invoice: check every field before saving. Choose the category (account) for each line.' + (warn.length ? '<br>' + warn.join('<br>') : '') + '</div>');
    };
    if (window.VAScan) {
      $('#scanbar').appendChild(window.VAScan.button('📷 Scan the supplier\'s invoice', function (f) {
        invFile = f; showFile('<p class="sub">Reading the invoice…</p>');
        window.VAScan.read(f).then(fill).catch(function (e) { showFile('<div class="note bad">' + esc(e.message) + '</div>'); });
      }, { primary: true }));
      $('#scanbar').appendChild(window.VAScan.button('📎 Attach it without reading', function (f) { invFile = f; showFile(); }));
    }
    $('#bg').oninput = total;
    $('#g15').onclick = function () { $('#bg').value = (Math.round(sub() * 0.15 * 100) / 100).toFixed(2); total(); };
    total();
    $('#bsv').onclick = function () {
      var s = supNow();
      if (!s) return toast('Choose the supplier from the list');
      var lines = all('#bl tr').map(function (tr) { return { account_id: tr.querySelector('[data-la]').value, class_id: tr.querySelector('[data-lc]').value, asset_id: tr.querySelector('[data-lfa]').value, description: tr.querySelector('[data-ld]').value, amount: tr.querySelector('[data-lm]').value }; }).filter(function (l) { return +l.amount > 0; });
      api('/api/ap/bills', 'POST', { kind: kind, supplier_id: s.id, number: $('#bn').value, bill_date: $('#bd').value, due_date: $('#bdu') ? $('#bdu').value : '', gct_amount: $('#bg').value, memo: $('#bm').value, lines: lines })
        .then(function (r) {
          var said = (isCredit ? 'Credit' : 'Bill') + ' saved: ' + J(r.total) + (r.due_date ? ', due ' + r.due_date : '');
          if (!invFile) { toast(said); return billForm(kind); }
          return window.VAScan.fileIt(invFile, { category: 'payables', title: (isCredit ? 'Credit note ' : 'Supplier invoice ') + ($('#bn').value || '') + ' - ' + s.name, reference: $('#bn').value, issuer: s.name, issue_date: $('#bd').value,
            links: [{ type: 'bill', id: r.id }, { type: 'supplier', id: s.id }] })
            .then(function (d) { toast(said + '; invoice filed as ' + d.number); }, function (e) { toast(said + '. The invoice was NOT filed (' + e.message + '): file it from the bill.'); })
            .then(function () { billForm(kind); });
        })
        .catch(function (e) { toast(e.message); });
    };
  }

  // ------------------------------------------------------- QuickBooks import --
  // Supplier list (IIF or CSV) and the Unpaid Bills report (CSV): previewed, then the ticked rows imported.
  function qbImport() {
    $('#out').innerHTML = '<div class="card"><h2>Import from QuickBooks</h2><p class="sub">Bring suppliers, and what is still owed to them, over from QuickBooks. The file is compared with what is here first: you see what is new, what has changed (old and new side by side) and what is unchanged, before anything is saved.</p>' +
      '<div class="controls"><div><label>What is in the file</label><select id="qk"><option value="bills">Unpaid bills</option><option value="suppliers">Supplier (vendor) list</option></select></div>' +

      '<div><label>Dates are</label><select id="qo"><option value="mdy">month/day/year (QuickBooks)</option><option value="dmy">day/month/year</option></select></div>' +
      '<div><label>What is here already</label><select id="qm"><option value="update">Update only what changed</option><option value="replace">Replace with the file</option></select></div><button class="primary" id="qp">Preview</button></div>' +
      '<div id="qhelp"></div></div><div id="qout"></div>';

      var mode = $('#qm').value === 'replace'
        ? ($('#qk').value === 'bills' ? ' <b>Replace:</b> bills brought over from QuickBooks before are made to match the file: changed ones are corrected and ones no longer in it are voided. Bills paid here, and bills entered here by hand, are never touched.'
          : ' <b>Replace:</b> each supplier already here takes every detail from the file, blanks and name included.')
        : ($('#qk').value === 'bills' ? ' <b>Update:</b> new bills are added and changed ones corrected; bills no longer in the file are listed for you to void if you choose.'
          : ' <b>Update:</b> new suppliers are added; for one already here, only details the file gives that differ are changed.');
      $('#qhelp').innerHTML = ($('#qk').value === 'bills'
        ? '<p class="sub"><b>QuickBooks Desktop:</b> Reports › Vendors &amp; Payables › Unpaid Bills Detail, dated today, then Excel › Create New Worksheet › Create a comma separated values (.csv) file. <b>QuickBooks Online:</b> Reports › Unpaid Bills › Export to CSV (or to Excel, then save as CSV).'
        : '<p class="sub"><b>QuickBooks Desktop:</b> File › Utilities › Export › Lists to IIF Files › Vendor List; or Reports › List › Vendor Contact List › Excel › CSV. <b>QuickBooks Online:</b> Expenses › Vendors › Export to Excel, then save as CSV.') + mode + '</p>';
    };
    var file = null;
    var preview = function () {
      var kind = $('#qk').value;
      return api('/api/ap/import/' + kind, 'POST', { file: file, date_order: $('#qo').value, mode: $('#qm').value, preview: true })
        .then(function (d) { (kind === 'bills' ? qbBills : qbSuppliers)(d, file, $('#qm').value); }).catch(function (e) { toast(e.message); });
    };

    $('#qm').onchange = function () { help(); if (file) preview(); };

  // Old -> new for each difference a row makes.
  function changeList(ch, money) {
    return (ch || []).map(function (x) { var f = function (v) { return v === '' || v == null ? '(blank)' : money ? J(v) : esc(v); }; return '<div><small>' + esc(x.label) + ': <s>' + f(x.from) + '</s> → <b>' + f(x.to) + '</b></small></div>'; }).join('');
  }
  var QST = { new: ['ok', 'New'], changed: ['warn', 'Changed'], same: ['', 'Unchanged'], gone: ['bad', 'Not in the file'], locked: ['', 'Left alone'], in_system: ['warn', 'Check'], duplicate: ['', 'Already here'], error: ['bad', 'Problem'] };
  function qbBills(d, file, mode) {
    var oe = d.opening_equity, cnt = function (s) { return d.rows.filter(function (r) { return r.status === s; }).length; };
    // Ticked to start with: new and changed; with "replace", the ones no longer in the file too.
    var on = function (r) { return r.status === 'new' || r.status === 'changed' || (r.status === 'gone' && mode === 'replace'); };
    var can = function (r) { return ['new', 'changed', 'gone', 'in_system'].indexOf(r.status) >= 0; };
    $('#qout').innerHTML = '<div class="card"><h2>Unpaid bills: ' + cnt('new') + ' new, ' + cnt('changed') + ' changed, ' + cnt('same') + ' unchanged' + (cnt('gone') ? ', ' + cnt('gone') + ' no longer in QuickBooks' : '') + '</h2>' +
      (d.ledger_start ? '' : '<div class="note bad">The ledger has not been started. Bills imported now show in Payables, but the ledger\'s opening balances will not include them: start the ledger first (Accounting), then import.</div>') +
      '<p class="sub">A new bill is added for what is still owed (its open balance). A changed one is voided and entered again as it is now, so the ledger shows the correction. QuickBooks has already counted these costs, so book them against Opening Balance Equity: only what you owe is added to the books. "Check" means the supplier is already owed that amount or number from purchasing; tick it only if it is a different bill.</p>' +
      '<div class="controls"><div><label>Book new and changed bills against</label><select id="qa">' + B.accountOptions('line', oe && oe.id) + '</select></div><div><label>Class</label><select id="qc">' + B.classOptions() + '</select></div>' +
      '<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="qn" checked> Add suppliers that are not here yet</label></div>' +
      '<div class="scroll"><table><thead><tr><th><input type="checkbox" id="qall"></th><th>Supplier in QuickBooks</th><th>Supplier here</th><th>Type</th><th>No.</th><th>Date</th><th>Due</th><th class="n">Owed</th><th>Status</th></tr></thead><tbody>' +
      d.rows.map(function (r) {
        return '<tr style="' + (r.status === 'same' ? 'opacity:.55' : '') + '"><td>' + (can(r) ? '<input type="checkbox" data-q="' + r.i + '"' + (on(r) ? ' checked' : '') + '>' : '') + '</td><td>' + esc(r.vendor) + '</td>' +
          '<td>' + (r.supplier_id ? esc(r.supplier) + (r.how === 'similar' ? ' <span class="pill warn">similar name</span>' : '') : '<span class="pill">new</span>') + '</td>' +
          '<td>' + (r.kind === 'credit' ? 'Credit' : 'Bill') + '</td><td>' + esc(r.number) + '</td><td>' + esc(r.date) + '</td><td>' + esc(r.due || '') + '</td><td class="n">' + J(r.kind === 'credit' ? -r.amount : r.amount) + '</td>' +
          '<td><span class="pill ' + QST[r.status][0] + '">' + QST[r.status][1] + '</span>' + changeList(r.changes && r.changes.filter(function (x) { return x.field !== 'amount'; })) + changeList(r.changes && r.changes.filter(function (x) { return x.field === 'amount'; }), true) +
          (r.reason && r.status !== 'same' ? '<br><small>' + esc(r.reason) + '</small>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div><div class="controls" style="margin-top:10px"><b id="qt"></b><span style="margin-left:auto"></span><button class="primary" id="qgo">Import</button></div></div>';
    var tot = function () {
      var n = { add: 0, upd: 0, gone: 0 };
      all('[data-q]:checked').forEach(function (x) { var r = d.rows[+x.getAttribute('data-q')]; n[r.status === 'changed' ? 'upd' : r.status === 'gone' ? 'gone' : 'add']++; });
      $('#qt').textContent = n.add + ' to add, ' + n.upd + ' to correct, ' + n.gone + ' to void';

    };
    all('[data-q]').forEach(function (x) { x.onchange = tot; });
    $('#qall').onchange = function () { var v = this.checked; all('[data-q]').forEach(function (x) { x.checked = v; }); tot(); };
    tot();
    $('#qgo').onclick = async function () {
      var ticked = all('[data-q]:checked').map(function (x) { return +x.getAttribute('data-q'); });
      var voids = ticked.filter(function (i) { return d.rows[i].status === 'gone'; }).length;
      if (voids && !(await vasConfirm('Void ' + voids + ' bill(s) that are no longer unpaid in QuickBooks? The ledger reverses them.'))) return;
      if (ticked.some(function (i) { return d.rows[i].status !== 'gone'; }) && !$('#qa').value) return toast('Choose the account to book them against');
      var b = this; b.disabled = true;

        .then(function (r) { toast('Added ' + (r.bills + r.credits) + ', corrected ' + r.updated + ', voided ' + r.voided + (r.suppliers ? '; ' + r.suppliers + ' new supplier(s)' : '')); return loadSuppliers(); })
        .then(function () { tab = 'sup'; show(); }).catch(function (e) { b.disabled = false; toast(e.message); });
    };
  }

      (mode === 'replace' ? 'Replacing: a supplier already here takes every detail from the file, so a detail left blank in QuickBooks is blanked here too.' : 'Updating: a supplier already here changes only the details the file gives that differ; details the file leaves blank are kept.') + '</p>' +
      '<div class="scroll"><table><thead><tr><th><input type="checkbox" id="qall" checked></th><th>Name</th><th>Here</th><th>Phone</th><th>Email</th><th>Terms</th><th>Status and changes</th></tr></thead><tbody>' +
      d.rows.map(function (r) {
        var can = r.status === 'new' || r.status === 'changed';
        return '<tr style="' + (r.status === 'same' ? 'opacity:.55' : '') + '"><td>' + (can ? '<input type="checkbox" data-q="' + r.i + '" checked>' : '') + '</td><td>' + esc(r.name) + '</td><td>' + (r.supplier ? esc(r.supplier) + (r.how === 'similar' ? ' <span class="pill warn">similar name</span>' : '') : '') + '</td>' +
          '<td>' + esc(r.phone) + '</td><td>' + esc(r.email) + '</td><td>' + esc(r.terms) + (r.terms_days != null ? ' <small>(' + r.terms_days + ' days)</small>' : '') + '</td>' +
          '<td><span class="pill ' + QST[r.status][0] + '">' + (r.status === 'duplicate' ? 'Twice in the file' : QST[r.status][1]) + '</span>' + changeList(r.changes) + '</td></tr>';
      }).join('') + '</tbody></table></div><div class="controls" style="margin-top:10px"><span style="margin-left:auto"></span><button class="primary" id="qgo">Import ticked suppliers</button></div></div>';
    $('#qall').onchange = function () { var v = this.checked; all('[data-q]').forEach(function (x) { x.checked = v; }); };
    $('#qgo').onclick = function () {
      var b = this; b.disabled = true;
      api('/api/ap/import/suppliers', 'POST', { file: file, mode: mode, include: all('[data-q]:checked').map(function (x) { return +x.getAttribute('data-q'); }) })
        .then(function (r) { toast('Added ' + r.added + ' supplier(s); updated ' + r.updated); $('#qout').innerHTML = ''; return loadSuppliers(); })
        .catch(function (e) { b.disabled = false; toast(e.message); });
    };
  }
  function loadSuppliers() { return api('/api/ap/supplier-list').then(function (d) { suppliers = d.suppliers; $('#suppliers').innerHTML = suppliers.map(function (s) { return '<option value="' + esc(s.name) + '">'; }).join(''); }); }
  function mark() { all('#tabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tab); }); }
  function show() {
    mark();
    var f = { sup: sup, pay: function () { return pay(); }, bill: function () { billForm('bill'); return Promise.resolve(); }, credit: function () { billForm('credit'); return Promise.resolve(); }, aging: aging, loans: loans, rec: rec, qb: qbImport, train: training }[tab];
    f().catch(function (e) { $('#out').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; });
  }
  all('#tabs button').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); show(); }; });
  // #s=12 opens that supplier, #training the portal training, #dupes the duplicates (links from the old supplier screens).
  function start() {
    var h = location.hash || '', m = /s=(\d+)/.exec(h);
    if (m) { mark(); return detail(+m[1]); }
    if (/training/.test(h)) { tab = 'train'; return show(); }
    if (/dupes/.test(h)) return dupes();
    return show();
  }
  Promise.all([B.loadAccounts(), loadSuppliers()]).then(start).catch(function (e) { $('#out').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; });
})();
</script>
