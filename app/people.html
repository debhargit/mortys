<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People &amp; HR · Vision Auto Solutions</title>
<style>
  :root{ --red:#d62828; --navy:#0b1b2b; --ink:#0f1720; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ok:#16a34a; --warn:#b45309; --chip:#eef2f7; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; --chip:#1f2b38; --warn:#f59e0b; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0} header nav{margin-left:auto;display:flex;gap:14px;font-size:13px;align-items:center;flex-wrap:wrap} header a{color:#fff;opacity:.85}
  main{max-width:1250px;margin:0 auto;padding:14px 16px 60px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px} .tabs button{border-radius:999px} .tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  input,select,button,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  textarea{width:100%} button{cursor:pointer;background:var(--card)} button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600} button.sm{padding:3px 9px;font-size:12.5px}
  button.link{border:0;background:none;color:var(--red);padding:0;font-weight:600}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px} .controls label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px;margin-bottom:10px} .grid label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px} .grid input,.grid select{width:100%}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse} th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  tr.row{cursor:pointer} tr.row:hover td{background:var(--chip)}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip)} .pill.ok{background:#16a34a22;color:var(--ok)} .pill.warn{background:#f59e0b22;color:var(--warn)} .pill.bad{background:#d6282822;color:var(--red)}
  .modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:9990} .modal .card{max-width:900px;width:100%}
  .modal.top{z-index:9995} .modal.top .card{max-width:640px}
  .empty{color:var(--muted);text-align:center;padding:20px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:9999}
  .ftabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:8px 0 12px} .ftabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 10px} .ftabs button.on{border-bottom-color:var(--red);font-weight:600}
  .item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px} .item small{color:var(--muted)}
  .warn{background:#f59e0b18;border-left:3px solid var(--warn);padding:8px 10px;border-radius:8px;margin:8px 0}
  h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px} .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px} .kpi b{display:block;font-size:22px} .kpi span{color:var(--muted);font-size:12px}
  .bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:60px} .bar i{display:block;height:100%;background:var(--red)}
  .org ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line)} .org > ul{border-left:0;padding-left:0}
  .org li{margin:6px 0} .org .node{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer} .org .node:hover{border-color:var(--red)} .org .node small{color:var(--muted);display:block}
  .task{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line)} .task span{flex:1} .task.done span{color:var(--muted);text-decoration:line-through}
  .stars{display:flex;gap:4px} .stars button{padding:2px 9px;font-size:13px} .stars button.on{background:var(--red);border-color:var(--red);color:#fff}
  @media print{ header,.tabs,.controls,button{display:none!important} .card{border:0} }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<header><h1>People &amp; HR</h1><nav><a href="/attendance.html">Attendance</a><a href="/payroll.html">Payroll</a><a href="/training.html">Training</a><a href="/documents.html">Documents</a><a href="/hiring.html">Hiring</a><a href="/admin.html#tab=staff">Users &amp; Staff</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div><div id="modal2"></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var all = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var day = function (t) { return t ? new Date(String(t).length === 10 ? t + 'T12:00:00' : t).toLocaleDateString('en-JM') : ''; };
  var when = function (t) { return t ? new Date(t).toLocaleString('en-JM', { dateStyle: 'short', timeStyle: 'short' }) : ''; };
  var jmd = function (v) { return v == null ? '' : 'J$' + Number(v).toLocaleString('en-JM', { maximumFractionDigits: 2 }); };
  var today = function () { var d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  var CONTRACT = { permanent: 'Permanent', fixed_term: 'Fixed term', part_time: 'Part time', casual: 'Casual', contractor: 'Contractor', intern: 'Internship' };
  var STATUS = { probation: 'On probation', active: 'Active', notice: 'Working notice', left: 'Left' };
  var JOBK = { start: 'Started', promotion: 'Promotion', transfer: 'Transfer', pay_change: 'Pay change', title_change: 'New job title', confirmation: 'Confirmed in post', demotion: 'Demotion', other: 'Other' };
  var CASEK = { counselling: 'Counselling', verbal_warning: 'Verbal warning', written_warning: 'Written warning', final_warning: 'Final written warning', suspension: 'Suspension', dismissal: 'Dismissal', commendation: 'Commendation' };
  var EXITK = { resignation: 'Resignation', termination: 'Termination', redundancy: 'Redundancy', end_of_contract: 'End of contract', retirement: 'Retirement', other: 'Other' };
  var REVK = { probation: 'End of probation', annual: 'Yearly', midyear: 'Mid-year', other: 'Other' };
  var META = { departments: [], people: [], criteria: [] };
  var tab = 'staff', CAN = false, staff = [];

  function toast(t) { var el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.style.display = 'none'; }, 3500); }
  function api(url, method, body) {
    return fetch(url, { method: method || 'GET', credentials: 'same-origin', headers: { Accept: 'application/json', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        if (r.status === 401) { location.href = '/admin.html'; throw new Error('Sign in required'); }
        return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; });
      });
  }
  function modal(h, layer) {
    var host = $(layer === 2 ? '#modal2' : '#modal');
    host.innerHTML = '<div class="modal' + (layer === 2 ? ' top' : '') + '"><div class="card">' + h + '</div></div>';
    host.firstChild.addEventListener('mousedown', function (e) { if (e.target.classList.contains('modal')) close(layer); });
    return host.firstChild;
  }
  function close(layer) { $(layer === 2 ? '#modal2' : '#modal').innerHTML = ''; if (layer !== 2 && /^#staff=/.test(location.hash)) history.replaceState(null, '', '#' + tab); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if ($('#modal2').innerHTML) close(2); else close(); } });
  var opts = function (list, cur, blank) { return (blank != null ? '<option value="">' + esc(blank) + '</option>' : '') + list.map(function (p) { var id = p.id != null ? p.id : p[0], nm = p.name != null ? p.name : p[1]; return '<option value="' + esc(id) + '"' + (String(cur) === String(id) ? ' selected' : '') + '>' + esc(nm) + '</option>'; }).join(''); };
  var pairs = function (o) { return Object.keys(o).map(function (k) { return [k, o[k]]; }); };
  var field = function (label, html) { return '<div><label>' + esc(label) + '</label>' + html + '</div>'; };
  var inp = function (id, v, type) { return '<input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(v == null ? '' : v) + '">'; };
  function statusPill(s) { return '<span class="pill' + (s === 'probation' || s === 'notice' ? ' warn' : s === 'left' ? ' bad' : ' ok') + '">' + esc(STATUS[s] || s) + '</span>'; }
  function csv(name, rows) {
    var text = rows.map(function (r) { return r.map(function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })); a.download = name + '-' + today() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------------------------------------------------------------- tabs --
  var TABS = [['staff', '🗂 Staff files'], ['org', '🌳 Org chart'], ['leave', '🏖 Leave'], ['tasks', '✅ Checklists'], ['reports', '📊 Reports'], ['audit', '📜 HR log'], ['me', '🙂 My HR file']];
  function drawTabs() {
    $('#tabs').innerHTML = TABS.filter(function (t) { return CAN || t[0] === 'me'; }).map(function (t) { return '<button data-t="' + t[0] + '"' + (t[0] === tab ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join('');
    all('[data-t]').forEach(function (b) { b.onclick = function () { location.hash = b.getAttribute('data-t'); }; });
  }
  function show() {
    drawTabs();
    var v = $('#view'); v.innerHTML = '<div class="empty">Loading…</div>';
    var f = { staff: staffList, org: orgChart, leave: leaveView, tasks: tasksView, reports: reportsView, audit: auditView, me: myFile }[tab];
    Promise.resolve(f(v)).catch(function (e) { v.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }

  // ---------------------------------------------------------- staff list --
  function staffList(v) {
    return api('/api/people/staff' + ($('#showLeft') && $('#showLeft').checked ? '?all=1' : '')).then(function (d) {
      var leftOn = $('#showLeft') && $('#showLeft').checked;
      staff = d.staff;
      v.innerHTML = '<div class="card"><h2>Staff files</h2><p class="sub">One file per person: details, emergency contacts, job and pay history, probation, warnings, reviews and goals, leave, documents and checklists. Logins, roles and PINs are on <a href="/admin.html#tab=staff">Users &amp; Staff</a>; pay on <a href="/payroll.html">Payroll</a>; leave days on <a href="/attendance.html#leave">Attendance › Leave</a>.</p>' +
        '<div class="controls"><div style="flex:1;min-width:200px"><label>Find</label><input id="q" type="search" placeholder="Name, job, department or manager" style="width:100%"></div>' +
        '<div><label>Department</label><select id="dF">' + opts(META.departments, '', 'All') + '</select></div><div><label>Status</label><select id="sF">' + opts(pairs(STATUS), '', 'All') + '</select></div>' +
        '<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="showLeft"' + (leftOn ? ' checked' : '') + '> Include people who left</label><button id="csvB">Export CSV</button></div><div id="list"></div></div>';
      function draw() {
        var q = $('#q').value.trim().toLowerCase(), df = $('#dF').value, sf = $('#sF').value;
        var rows = staff.filter(function (s) { return (!q || [s.name, s.job_title, s.department, s.manager, s.employee_no].join(' ').toLowerCase().indexOf(q) >= 0) && (!df || String(s.department_id) === df) && (!sf || s.status === sf); });
        $('#list').innerHTML = rows.length ? '<div class="scroll"><table><thead><tr><th>Name</th><th>Job</th><th>Department</th><th>Manager</th><th>Started</th><th>Contract</th><th>Status</th><th>Needs attention</th></tr></thead><tbody>' + rows.map(function (s) {
          var flags = [];
          if (s.status === 'probation' && s.probation_end && s.probation_end <= new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10)) flags.push('<span class="pill warn">probation ends ' + esc(day(s.probation_end)) + '</span>');
          if (s.open_cases) flags.push('<span class="pill bad">' + s.open_cases + ' warning' + (s.open_cases > 1 ? 's' : '') + '</span>');
          if (s.review_due) flags.push('<span class="pill' + (s.review_due < today() ? ' bad' : '') + '">review ' + esc(day(s.review_due)) + '</span>');
          if (s.open_tasks) flags.push('<span class="pill">' + s.open_tasks + ' to do</span>');
          if (!s.contacts && s.status !== 'left') flags.push('<span class="pill warn">no emergency contact</span>');
          if (!s.has_file) flags.push('<span class="pill">file not started</span>');
          return '<tr class="row" data-u="' + s.id + '"><td><b>' + esc(s.name) + '</b>' + (s.employee_no ? ' <small class="sub">' + esc(s.employee_no) + '</small>' : '') + '</td><td>' + esc(s.job_title || '') + '</td><td>' + esc(s.department || '') + '</td><td>' + esc(s.manager || '') + '</td>' +
            '<td>' + esc(day(s.start_date)) + '</td><td>' + esc(CONTRACT[s.contract_type] || '') + (s.contract_end ? '<br><small>to ' + esc(day(s.contract_end)) + '</small>' : '') + '</td><td>' + statusPill(s.status) + '</td><td>' + flags.join(' ') + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty">Nobody matches.</div>';
        all('[data-u]').forEach(function (r) { r.onclick = function () { openFile(r.getAttribute('data-u')); }; });
      }
      $('#q').oninput = draw; $('#dF').onchange = draw; $('#sF').onchange = draw;
      $('#showLeft').onchange = function () { staffList(v); };
      $('#csvB').onclick = function () { csv('staff', [['Name', 'Employee no', 'Job', 'Department', 'Manager', 'Started', 'Contract', 'Contract ends', 'Status', 'Probation ends', 'Open warnings', 'Emergency contacts']].concat(staff.map(function (s) { return [s.name, s.employee_no, s.job_title, s.department, s.manager, s.start_date, CONTRACT[s.contract_type], s.contract_end, STATUS[s.status], s.probation_end, s.open_cases, s.contacts]; }))); };
      draw();
    });
  }

  // ------------------------------------------------------------ the file --
  var FT = [['profile', 'Profile'], ['contacts', 'Emergency contacts'], ['job', 'Job & pay'], ['conduct', 'Probation & conduct'], ['leave', 'Leave'], ['reviews', 'Reviews & goals'], ['docs', 'Documents'], ['tasks', 'Checklists'], ['exit', 'Leaving'], ['log', 'History']];
  var fileTab = 'profile';
  function openFile(uid, keepTab) {
    if (!keepTab) fileTab = 'profile';
    history.replaceState(null, '', '#staff=' + uid);
    return api('/api/people/staff/' + uid).then(function (f) {
      var u = f.user, p = f.profile || {};
      var mo = modal('<h2>' + esc(u.name || u.email) + ' ' + statusPill(u.is_archived ? 'left' : (p.status || 'active')) + '</h2>' +
        '<p class="sub">' + esc([p.job_title, p.department, p.manager ? 'reports to ' + p.manager : '', u.email, u.phone].filter(Boolean).join(' · ')) + '</p>' +
        (!f.profile ? '<div class="warn">This file has not been started. Fill in the profile and save to start it.</div>' : '') +
        '<div class="ftabs">' + FT.map(function (t) { return '<button data-ft="' + t[0] + '"' + (t[0] === fileTab ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join('') + '</div><div id="fp"></div>' +
        '<div class="controls" style="margin-top:12px"><button id="fPrint">Print</button><button id="fX">Close</button></div>');
      $('#fX').onclick = function () { close(); };
      $('#fPrint').onclick = function () { window.print(); };
      all('[data-ft]', mo).forEach(function (b) { b.onclick = function () { fileTab = b.getAttribute('data-ft'); all('[data-ft]', mo).forEach(function (x) { x.classList.toggle('on', x === b); }); pane(f); }; });
      pane(f);
    }).catch(function (e) { toast(e.message); });
  }
  function reopen(f, msg) { if (msg) toast(msg); openFile(f.user.id, true); if (tab === 'staff') staffList($('#view')); }
  function pane(f) {
    var el = $('#fp'), u = f.user, p = f.profile || {}, uid = u.id;
    var fail = function (e) { toast(e.message); };
    var H = {
      profile: function () {
        el.innerHTML = '<div class="grid">' +
          field('Job title', inp('pT', p.job_title)) + field('Department', '<select id="pD">' + opts(META.departments, p.department_id, '–') + '</select>') + field('Manager (reports to)', '<select id="pM">' + opts(META.people.filter(function (x) { return x.id !== uid; }), p.manager_user_id, '–') + '</select>') +
          field('Start date', inp('pS', p.start_date || (f.payroll && f.payroll.hire_date), 'date')) + field('Contract', '<select id="pC">' + opts(pairs(CONTRACT), p.contract_type || 'permanent') + '</select>') + field('Contract ends (fixed term)', inp('pCe', p.contract_end, 'date')) +
          field('Status', '<select id="pSt">' + opts(pairs(STATUS), p.status || 'active') + '</select>') + field('Probation (months)', inp('pPm', p.probation_months != null ? p.probation_months : 3, 'number')) + field('Probation ends', inp('pPe', p.probation_end, 'date')) +
          field('Works at', inp('pW', p.work_location)) + field('Date of birth', inp('pDob', p.date_of_birth, 'date')) + field('Personal phone', inp('pPh', p.personal_phone)) +
          field('Personal email', inp('pEm', p.personal_email, 'email')) + field('Parish', inp('pPa', p.parish)) + '</div>' +
          '<label class="sub">Home address</label><textarea id="pA" rows="2">' + esc(p.address || '') + '</textarea><label class="sub">HR notes (only HR sees these)</label><textarea id="pN" rows="3">' + esc(p.notes || '') + '</textarea>' +
          (p.confirmed_on ? '<p class="sub">Confirmed in post on ' + esc(day(p.confirmed_on)) + '.</p>' : '') +
          '<p class="sub">Pay, TRN, NIS and bank details are kept in <a href="/payroll.html">Payroll</a>' + (f.payroll ? ' (' + (f.payroll.is_active ? 'paid' : 'switched off') + ', ' + (f.payroll.pay_type === 'hourly' ? jmd(f.payroll.hourly_rate) + ' an hour' : jmd(f.payroll.salary_annual) + ' a year') + ')' : ': not added yet') + '. Training: <a href="/training.html#people">' + ((f.training && f.training.records) || 0) + ' records</a>' + (f.training && f.training.expiring ? ', ' + f.training.expiring + ' expiring soon' : '') + '.' +
          (f.applications && f.applications.length ? ' Hired from application <a href="/hiring.html#app=' + f.applications[0].id + '">' + esc(f.applications[0].ref || '#' + f.applications[0].id) + '</a>.' : '') + '</p>' +
          '<div class="controls"><button class="primary" id="pSave">Save profile</button></div>';
        $('#pSave').onclick = function () {
          var body = { job_title: $('#pT').value, department_id: $('#pD').value, manager_user_id: $('#pM').value, start_date: $('#pS').value, contract_type: $('#pC').value, contract_end: $('#pCe').value, status: $('#pSt').value,
            probation_months: $('#pPm').value, work_location: $('#pW').value, date_of_birth: $('#pDob').value, personal_phone: $('#pPh').value, personal_email: $('#pEm').value, parish: $('#pPa').value, address: $('#pA').value, notes: $('#pN').value };
          // A probation end typed in wins; left as it was, it follows the start date.
          if ($('#pPe').value !== (p.probation_end || '')) body.probation_end = $('#pPe').value;
          api('/api/people/staff/' + uid + '/profile', 'PUT', body).then(function (r) { reopen(f, r.changed.length ? 'Saved' : 'Nothing changed'); }).catch(fail);
        };
      },
      contacts: function () { contactsPane(el, f.contacts, '/api/people/staff/' + uid + '/contacts', function (m) { reopen(f, m); }); },
      job: function () {
        el.innerHTML = '<p class="sub">Every change to the job or pay, newest first. A change dated today or earlier becomes the current job. Tick “pass on to Payroll” to change their pay there too' + (META.can_payroll ? '' : ' (only someone who may change pay can do that)') + '.</p>' +
          '<div class="grid">' + field('What changed', '<select id="jK">' + opts(pairs(JOBK).filter(function (x) { return x[0] !== 'confirmation'; }), 'promotion') + '</select>') + field('From', inp('jE', today(), 'date')) + field('New job title', inp('jT', '')) +
          field('New department', '<select id="jD">' + opts(META.departments, '', 'No change') + '</select>') + field('New manager', '<select id="jM">' + opts(META.people.filter(function (x) { return x.id !== uid; }), '', 'No change') + '</select>') +
          field('New yearly salary (J$)', inp('jS', '')) + field('New hourly rate (J$)', inp('jH', '')) + '</div>' +
          '<label class="sub">Reason</label><input id="jR" style="width:100%"><div class="controls" style="margin-top:8px"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="jP"' + (META.can_payroll && f.payroll ? '' : ' disabled') + '> Pass the new pay on to Payroll</label><button class="primary" id="jGo">Record it</button></div>' +

  // ----------------------------------------------------------- org chart --
  function orgChart(v) {
    return api('/api/people/org').then(function (d) {
      var kids = {}; d.people.forEach(function (p) { (kids[p.manager_id || 0] = kids[p.manager_id || 0] || []).push(p); });
      function tree(id, depth) {
        var list = kids[id] || [];
        if (!list.length || depth > 20) return '';
        return '<ul>' + list.map(function (p) { return '<li><span class="node" data-u="' + p.id + '"><b>' + esc(p.name) + '</b><small>' + esc([p.job_title, p.department].filter(Boolean).join(' · ') || 'job not set') + ((kids[p.id] || []).length ? ' · ' + kids[p.id].length + ' report' + (kids[p.id].length > 1 ? 's' : '') : '') + '</small></span>' + tree(p.id, depth + 1) + '</li>'; }).join('') + '</ul>';
      }
      var none = (kids[0] || []).filter(function (p) { return !(kids[p.id] || []).length; });
      kids[0] = (kids[0] || []).filter(function (p) { return (kids[p.id] || []).length; });
      v.innerHTML = '<div class="card"><h2>Org chart</h2><p class="sub">Who reports to whom, from the manager on each staff file. Click a person to open their file.</p><div class="org">' + (tree(0, 0) || '<div class="empty">No managers set yet. Set each person’s manager on their profile.</div>') + '</div>' +
        (none.length ? '<h4>Manager not set (' + none.length + ')</h4><div class="org"><ul>' + none.map(function (p) { return '<li><span class="node" data-u="' + p.id + '"><b>' + esc(p.name) + '</b><small>' + esc(p.job_title || 'job not set') + '</small></span></li>'; }).join('') + '</ul></div>' : '') + '</div>';

    });

      all('[data-mr]', v).forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-mr'); api('/api/people/me/reviews/' + id + '/ack', 'POST', { comments: $('#mrc' + id).value }).then(function () { toast('Thank you'); myFile(v); }).catch(function (e) { toast(e.message); }); }; });
      all('[data-mc]', v).forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-mc'); api('/api/people/me/cases/' + id + '/ack', 'POST', { response: $('#mcr' + id).value }).then(function () { toast('Recorded'); myFile(v); }).catch(function (e) { toast(e.message); }); }; });
      all('[data-mt]', v).forEach(function (c) { c.onchange = function () { api('/api/people/me/tasks/' + c.getAttribute('data-mt'), 'PATCH', { done: c.checked }).then(function () { toast('Done'); myFile(v); }).catch(function (e) { toast(e.message); }); }; });
    });
  }

  // ---------------------------------------------------------------- start --
  // #staff=12 opens a file over the staff list; #org, #leave... pick a tab.
  var drawn = false;
  function route() {
    var h = location.hash.slice(1), m = /^staff=(\d+)$/.exec(h);
    var want = !CAN ? 'me' : m ? 'staff' : TABS.some(function (t) { return t[0] === h; }) ? h : 'staff';
    if (want !== tab || !drawn) { tab = want; drawn = true; show(); }
    if (m && CAN) openFile(m[1]);
  }
  window.addEventListener('hashchange', route);
  api('/api/people/meta').then(function (m) { META = m; CAN = true; }, function () { CAN = false; }).then(route);
})();
</script>
