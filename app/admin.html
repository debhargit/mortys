    // Prev / Next: step through the currently loaded inventory list (PROD_STATE
    // .rows, in display order) without going back to the table. Disabled at the
    // ends; hidden if this part isn't in the loaded list (e.g. opened from a
    // scan). Alt+←/→ do the same.
    var peIdx = PROD_STATE.rows.findIndex(function(x){ return x.img === p.img; });
    var peGo = function(delta){
      var n = peIdx >= 0 && PROD_STATE.rows[peIdx + delta];
      if (n) { posCloseModal(); productEditModal(n, after); }
    };
    var pePrevBtn = document.getElementById('pePrev'), peNextBtn = document.getElementById('peNext');
    var pePosEl = document.getElementById('pePos');
    if (window.__peKeyHandler) { document.removeEventListener('keydown', window.__peKeyHandler); window.__peKeyHandler = null; }
    if (peIdx < 0) { pePrevBtn.style.display = 'none'; peNextBtn.style.display = 'none'; if (pePosEl) pePosEl.textContent = ''; }
    else {
      if (pePosEl) pePosEl.textContent = (peIdx + 1) + ' of ' + PROD_STATE.rows.length + (PROD_STATE.rows.length >= PROD_PAGE_SIZE ? '+ loaded' : '');
      pePrevBtn.disabled = peIdx <= 0;
      peNextBtn.disabled = peIdx >= PROD_STATE.rows.length - 1;
      pePrevBtn.addEventListener('click', function(){ peGo(-1); });
      peNextBtn.addEventListener('click', function(){ peGo(1); });
      window.__peKeyHandler = function(e){
        if (!e.altKey || !document.getElementById('pePrev')) return;
        if (e.key === 'ArrowLeft')  { e.preventDefault(); if (peIdx > 0) peGo(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); if (peIdx < PROD_STATE.rows.length - 1) peGo(1); }
      };
      document.addEventListener('keydown', window.__peKeyHandler);
    }

    // Live search: jump straight to editing any other part, no trip back to the
    // table. Independent of Prev/Next, which only walk the loaded page.
    (function(){
      var jin = document.getElementById('peJump');
      var jout = document.getElementById('peJumpResults');
      if (!jin || !jout) return;
      var jd = null, jseq = 0, jrows = [], jsel = -1;
      var place = function(){
        var r = jin.getBoundingClientRect();
        jout.style.left = Math.round(r.left) + 'px';
        jout.style.top = Math.round(r.bottom + 4) + 'px';
        jout.style.width = Math.round(r.width) + 'px';
      };
      var hl = function(){
        var k = jout.children;
        for (var i = 0; i < k.length; i++) k[i].style.background = (i === jsel) ? 'var(--hover)' : 'var(--card)';
        if (jsel >= 0 && k[jsel]) k[jsel].scrollIntoView({ block: 'nearest' });
      };
      var render = function(){
        if (!jrows.length) { jout.style.display = 'none'; jout.innerHTML = ''; jsel = -1; return; }
        jout.innerHTML = jrows.map(function(x, i){
          return '<button type="button" data-i="' + i + '" style="display:flex;gap:9px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hover);background:var(--card);color:var(--ink);padding:8px 10px;cursor:pointer;font-family:inherit;font-size:12px">' +
            '<code style="flex-shrink:0;font-weight:700;max-width:170px;word-break:break-all">' + esc(posPartNo(x)) + '</code>' +
            '<span style="flex:1;min-width:0;font-weight:600">' + esc(x.name || '') +
              (x.make_model ? ' <span style="font-weight:400;color:var(--muted)">— ' + esc(x.make_model) + '</span>' : '') + '</span>' +
            '<small style="flex-shrink:0;color:var(--muted)">' + (x.stock_count || 0) + '</small>' +
          '</button>';
        }).join('');
        place();
        jout.style.display = 'block';
        jout.querySelectorAll('button').forEach(function(b){
          b.addEventListener('mousedown', function(e){ e.preventDefault(); pick(jrows[parseInt(b.dataset.i, 10)]); });
          b.addEventListener('mouseenter', function(){ jsel = parseInt(b.dataset.i, 10); hl(); });
        });
        jsel = 0; hl();
      };
      var pick = function(x){ if (!x) return; posCloseModal(); productEditModal(x, after); };
      var run = function(){
        var q = jin.value.trim();
        clearTimeout(jd);
        if (q.length < 2) { jrows = []; render(); return; }
        jd = setTimeout(async function(){
          var seq = ++jseq;
          try {
            var r = await api('/api/products?limit=50&offset=0&q=' + encodeURIComponent(q));
            if (seq !== jseq) return;
            jrows = (r.products || []).filter(function(x){ return x.img !== p.img; });
            render();
          } catch (e) { if (seq === jseq) { jrows = []; render(); } }
        }, 220);
      };
      jin.addEventListener('input', run);
      jin.addEventListener('keydown', function(e){
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          if (!jrows.length) return;
          e.preventDefault();
          jsel = Math.max(0, Math.min(jrows.length - 1, (jsel < 0 ? 0 : jsel) + (e.key === 'ArrowDown' ? 1 : -1)));
          hl();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (jrows.length) pick(jrows[jsel >= 0 ? jsel : 0]);
        } else if (e.key === 'Escape') {
          jin.value = ''; jrows = []; render();
        }
      });
      // mousedown on a result fires before blur, so the pick still lands.
      jin.addEventListener('blur', function(){ setTimeout(function(){ jout.style.display = 'none'; }, 120); });
      jin.addEventListener('focus', function(){ if (jrows.length) { place(); jout.style.display = 'block'; } });
    })();

    // Item type shapes which fields even make sense: a service/fee has no
    // stock concept at all (no bin/location, no low-stock threshold); a
    // tracked item (e.g. tokens) still wants a low-stock threshold but isn't
    // warehouse-placed.
    (function(){
      var typeSel = document.getElementById('peItemType');
      var locSect = document.getElementById('peLocationSect'), lowWrap = document.getElementById('peLowWrap');
      if (!typeSel) return;
      var sync = function(){
        var t = typeSel.value;
        locSect.style.display = (t === 'inventory') ? '' : 'none';
        lowWrap.style.display = (t === 'service') ? 'none' : '';
      };
      typeSel.addEventListener('change', sync);
      sync();
    })();

    // Retail auto-fills from cost × (1 + markup%) until the user types a price
    // by hand — the usual parts-counter default.
    (function(){
      var cost = document.getElementById('peCost'), mk = document.getElementById('peMarkup'), price = document.getElementById('pePrice');
      if (!cost || !mk || !price) return;
      var touched = (price.value || '').trim() !== '';
      price.addEventListener('input', function(){ touched = (price.value.trim() !== ''); });
      var recalc = function(){
        if (touched) return;
        var c2 = parseFloat(cost.value), m = parseFloat(mk.value);
        if (isFinite(c2) && isFinite(m)) price.value = (Math.round(c2 * (1 + m / 100) * 100) / 100).toFixed(2);
      };
      cost.addEventListener('input', recalc);
      mk.addEventListener('input', recalc);
    })();

    // Commission value only means something for percent/amount — grey it out
    // otherwise so it's clear the number field isn't doing anything.
    (function(){
      var typeSel = document.getElementById('peCommType'), val = document.getElementById('peCommValue'), lbl = document.getElementById('peCommValLbl');
      if (!typeSel || !val) return;
      var sync = function(){
        var t = typeSel.value;
        val.disabled = (t !== 'percent' && t !== 'amount');
        lbl.textContent = t === 'percent' ? 'Percent (e.g. 3 for 3%)' : t === 'amount' ? 'Flat amount per unit (J$)' : 'Value';
        if (val.disabled) val.value = '';
      };
      typeSel.addEventListener('change', sync);
      sync();
    })();

    // Bulk pricing: a small repeatable [qty, price] row list, saved on its
    // own via PUT .../price-breaks rather than folded into peSave -- it's a
    // child collection (replace-the-whole-set), not a plain column update.
    (function(){
      var rowsBox = document.getElementById('peBreakRows');
      var breaks = (p.price_breaks || []).map(function(b){ return { min_qty: b.min_qty, price_usd: b.price_usd }; });
      var paintBreaks = function(){
        rowsBox.innerHTML = breaks.length ? breaks.map(function(b, i){
          return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px" data-pbrow="' + i + '">' +
            '<span style="font-size:12.5px;color:var(--muted)">Qty ≥</span>' +
            '<input type="number" min="2" step="1" class="fld pbQty" value="' + esc(b.min_qty == null ? '' : b.min_qty) + '" style="width:80px"/>' +
            '<span style="font-size:12.5px;color:var(--muted)">@ $</span>' +
            '<input type="number" min="0" step="0.01" class="fld pbPrice" value="' + esc(b.price_usd == null ? '' : b.price_usd) + '" style="width:100px"/>' +
            '<span style="font-size:12.5px;color:var(--muted)">each</span>' +
            '<button type="button" class="btn pbRemove" style="padding:3px 9px;background:#fee2e2;color:#b91c1c">✕</button>' +
          '</div>';
        }).join('') : '<div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">No bulk tiers — every quantity pays the sell price above.</div>';
        rowsBox.querySelectorAll('.pbRemove').forEach(function(btn){
          btn.addEventListener('click', function(){
            var i = parseInt(btn.closest('[data-pbrow]').getAttribute('data-pbrow'), 10);
            breaks.splice(i, 1); paintBreaks();
          });
        });
      };
      paintBreaks();
      document.getElementById('peBreakAdd').addEventListener('click', function(){ breaks.push({ min_qty: '', price_usd: '' }); paintBreaks(); });
      document.getElementById('peBreakSave').addEventListener('click', async function(){
        var pbMsg = document.getElementById('peBreakMsg');
        rowsBox.querySelectorAll('[data-pbrow]').forEach(function(row, i){
          breaks[i].min_qty = row.querySelector('.pbQty').value;
          breaks[i].price_usd = row.querySelector('.pbPrice').value;
        });
        var payload = breaks.filter(function(b){ return b.min_qty !== '' || b.price_usd !== ''; })
          .map(function(b){ return { min_qty: parseInt(b.min_qty, 10), price_usd: Number(b.price_usd) }; });
        pbMsg.textContent = 'Saving…'; pbMsg.style.color = 'var(--muted)';
        try {
          await api('/api/admin/products/' + encodeURIComponent(p.img) + '/price-breaks', { method: 'PUT', body: { breaks: payload } });
          pbMsg.textContent = '✓ Saved'; pbMsg.style.color = '#166534';
        } catch (e) { pbMsg.textContent = e.message; pbMsg.style.color = 'var(--red)'; }
      });
    })();

    var msg = document.getElementById('peMsg');
    document.getElementById('peSave').addEventListener('click', async function(){
      var raw = (document.getElementById('pePrice').value || '').trim();
      var body = {
        name: document.getElementById('peName').value.trim(),
        sku: document.getElementById('peSku').value.trim(),
        barcode: document.getElementById('peBarcode').value.trim(),
        make_model: document.getElementById('peMakeModel').value.trim(),
        category: document.getElementById('peCategory').value,
        condition: document.getElementById('peCondition').value,
        stock_count: parseInt(document.getElementById('peStock').value, 10) || 0,
        low_threshold: parseInt(document.getElementById('peLow').value, 10) || 0,
        location: document.getElementById('peLocation').value,
        bin_location: document.getElementById('peBin').value.trim(),
        is_active: document.getElementById('peActive').checked,
        supplier_id: document.getElementById('peSupplier').value || '',
        supplier_part_no: document.getElementById('peSupPartNo').value.trim(),
        costing_method: document.getElementById('peCosting').value,
        stock_uom: document.getElementById('peStockUom').value,
        purchase_uom: document.getElementById('pePurchUom').value,
        serial_required: document.getElementById('peSerial').checked,
        markup_pct: (document.getElementById('peMarkup').value || '').trim(),
        warranty_days: (document.getElementById('peWarranty').value || '').trim(),
        units_per_purchase: (document.getElementById('peUnitsPerPurch').value || '').trim(),
      };
      if (raw !== '') body.price_usd = Number(raw);
      var rawCost = (document.getElementById('peCost').value || '').trim();
      if (rawCost !== '') body.cost_usd = Number(rawCost);
      var rawList = (document.getElementById('peList').value || '').trim();
      if (rawList !== '') body.list_price_usd = Number(rawList);
      body.commission_type = document.getElementById('peCommType').value || null;
      var rawCommVal = (document.getElementById('peCommValue').value || '').trim();
      body.commission_value = rawCommVal !== '' ? Number(rawCommVal) : null;
      body.core_charge_usd = (document.getElementById('peCoreCharge').value || '').trim();
      body.env_fee_usd = (document.getElementById('peEnvFee').value || '').trim();
      body.sale_price_usd = (document.getElementById('peSalePrice').value || '').trim();
      body.sale_starts_at = document.getElementById('peSaleStarts').value || '';
      body.sale_ends_at = document.getElementById('peSaleEnds').value || '';
      body.max_discount_pct = (document.getElementById('peMaxDiscount').value || '').trim();
      body.restricted_instore_only = document.getElementById('peResInstore').checked;
      body.restricted_manager_approval = document.getElementById('peResApproval').checked;
      body.restricted_id_required = document.getElementById('peResId').checked;
      body.restricted_tax_id_required = document.getElementById('peResTaxId').checked;
      body.is_redeemable = document.getElementById('peRedeemable').checked;
      body.item_type = document.getElementById('peItemType').value;
      msg.textContent = 'Saving…'; msg.style.color = 'var(--muted)';
      try {
        await api('/api/admin/products/' + encodeURIComponent(p.img), { method: 'PATCH', body: body });
        posCloseModal();
        posToast('Saved');
        if (after) after();
      } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; }
    });
    document.getElementById('peDelete').addEventListener('click', async function(){
      if (!(await posConfirm('Delete "' + (p.name || p.img) + '" from inventory? This cannot be undone.', { ok:'Delete', danger:true }))) return;
      try {
        await api('/api/admin/products/' + encodeURIComponent(p.img), { method: 'DELETE' });
        posCloseModal(); posToast('Deleted'); if (after) after();
      } catch (e) { posToast(e.message, true); }
    });
    var peMatrixManage = document.getElementById('peMatrixManage');
    if (peMatrixManage) peMatrixManage.addEventListener('click', function(){
      posCloseModal(); matrixManagerModal(p.matrix_id, function(){ load(false); });
    });
    var peMatrixReset = document.getElementById('peMatrixReset');
    if (peMatrixReset) peMatrixReset.addEventListener('click', async function(){
      if (!(await posConfirm('Reset "' + (p.name || p.img) + '" to the matrix\'s current shared values? Any customisation on this part is lost.', { ok:'Reset' }))) return;
      try {
        await api('/api/admin/product-matrix/' + p.matrix_id + '/reset/' + encodeURIComponent(p.img), { method: 'POST' });
        posCloseModal(); posToast('Reset to matrix default'); if (after) after();
      } catch (e) { posToast(e.message, true); }
    });
  }

  // ===========================================================================
  //  MATRIX ITEMS — one photo + shared fields + axis values -> N child parts.
  //  Both modals below live in renderProducts()'s closure so they share cats/
  //  locs/UOM_OPTS/COSTING_OPTS/supplierOptions/load()/productEditModal with
  //  everything else on this screen.
  // ===========================================================================
  function matrixCreateModal(onDone){
    var axis2On = false;
    posModal('🧬 Create a matrix item',
      '<div style="margin-bottom:12px" id="mxImageWidget"></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
        '<div style="grid-column:1/-1"><label class="lbl">Base name *</label><input id="mxName" required placeholder="e.g. Brake Pad Set" class="fld"/></div>' +
        '<div><label class="lbl">Category *</label><select id="mxCategory" required class="fld">' +
          cats.map(function(c){ return '<option value="' + c[0] + '">' + c[1] + '</option>'; }).join('') +
        '</select></div>' +
        '<div><label class="lbl">Condition</label><select id="mxCondition" class="fld"><option value="NEW" selected>NEW</option><option value="USED">USED</option></select></div>' +
        '<div><label class="lbl">Vehicle / fitment</label><input id="mxMakeModel" placeholder="e.g. 2020 Honda Accord" class="fld"/></div>' +
        '<div><label class="lbl">Base SKU <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">(optional — derived from the name)</span></label><input id="mxBaseSku" class="fld"/></div>' +
        '<div><label class="lbl">Cost / buy price (USD)</label><input id="mxCost" type="number" step="0.01" min="0" placeholder="0.00" class="fld"/></div>' +
        '<div><label class="lbl">Markup %</label><input id="mxMarkup" type="number" step="0.1" min="0" placeholder="e.g. 35" class="fld"/></div>' +
        '<div><label class="lbl">Sell price / retail (USD)</label><input id="mxPrice" type="number" step="0.01" min="0" placeholder="auto from cost × markup" class="fld"/></div>' +
        '<div><label class="lbl">List / MSRP (USD)</label><input id="mxList" type="number" step="0.01" min="0" placeholder="reference" class="fld"/></div>' +
        '<div><label class="lbl">Stock count <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">(per variant)</span></label><input id="mxStock" type="number" min="0" value="1" class="fld"/></div>' +
        '<div><label class="lbl">Low-stock threshold</label><input id="mxLow" type="number" min="0" placeholder="0" class="fld"/></div>' +
        '<div><label class="lbl">Stock unit</label><select id="mxStockUom" class="fld">' + uomOptions('each') + '</select></div>' +
        '<div><label class="lbl">Purchase unit</label><select id="mxPurchUom" class="fld">' + uomOptions('') + '</select></div>' +
        '<div><label class="lbl">Units per purchase</label><input id="mxUnitsPerPurch" type="number" step="0.001" min="0" placeholder="e.g. 12 per box" class="fld"/></div>' +
        '<div><label class="lbl">Costing method</label><select id="mxCosting" class="fld">' +
          COSTING_OPTS.map(function(o){ return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('') +
        '</select></div>' +
        '<div><label class="lbl">Supplier</label><select id="mxSupplier" class="fld">' + supplierOptions('') + '</select></div>' +
        '<div><label class="lbl">Supplier part #</label><input id="mxSupPartNo" placeholder="vendor catalogue no." class="fld"/></div>' +
        '<div><label class="lbl">Warranty (days)</label><input id="mxWarranty" type="number" min="0" placeholder="e.g. 90" class="fld"/></div>' +
        '<div><label class="lbl">Core charge (USD, per unit)</label><input id="mxCoreCharge" type="number" step="0.01" min="0" placeholder="0.00" class="fld"/></div>' +
        '<div><label class="lbl">Environmental fee (USD, per unit)</label><input id="mxEnvFee" type="number" step="0.01" min="0" placeholder="0.00" class="fld"/></div>' +
        '<div><label class="lbl">📍 Location</label><select id="mxLocation" class="fld">' +
          locs.map(function(l){ return '<option value="' + l + '">' + l + '</option>'; }).join('') +
        '</select></div>' +
        '<div style="grid-column:1/-1"><label style="display:inline-flex;align-items:center;gap:7px;font-size:13px"><input type="checkbox" id="mxSerial"/> Serial number required at sale</label></div>' +
      '</div>' +
      '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">' +
        '<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;margin-bottom:6px">Axis 1 — required</div>' +
        '<div style="display:grid;grid-template-columns:1fr 2fr;gap:10px">' +
          '<input id="mxAxis1Label" placeholder="Label, e.g. Position" class="fld"/>' +
          '<input id="mxAxis1Values" placeholder="Values, comma-separated — e.g. Front, Rear" class="fld"/>' +
        '</div>' +
        '<button type="button" class="btn" id="mxAxis2Toggle" style="margin-top:8px">+ Add a second axis</button>' +
        '<div id="mxAxis2Box" style="display:none;margin-top:8px;grid-template-columns:1fr 2fr;gap:10px">' +
          '<input id="mxAxis2Label" placeholder="Label, e.g. Side" class="fld"/>' +
          '<input id="mxAxis2Values" placeholder="Values, comma-separated — e.g. Left, Right" class="fld"/>' +
        '</div>' +
      '</div>' +
      '<div id="mxPreview" style="margin-top:12px;font-size:12.5px;color:var(--muted)"></div>' +
      '<div id="mxMsg" style="display:none;margin-top:10px;padding:9px 12px;border-radius:6px;font-size:13px"></div>' +
      '<div style="display:flex;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">' +
        '<button type="button" class="btn ok" id="mxGo">Create matrix</button>' +
      '</div>', 760
    );
    mountImageWidget('mxImageWidget', 'mxPhotoHidden', { noUrl: true });

    (function(){
      var cost = document.getElementById('mxCost'), mk = document.getElementById('mxMarkup'), price = document.getElementById('mxPrice');
      var touched = false;
      price.addEventListener('input', function(){ touched = (price.value.trim() !== ''); });
      var recalc = function(){
        if (touched) return;
        var c2 = parseFloat(cost.value), m = parseFloat(mk.value);
        if (isFinite(c2) && isFinite(m)) price.value = (Math.round(c2 * (1 + m / 100) * 100) / 100).toFixed(2);
      };
      cost.addEventListener('input', recalc);
      mk.addEventListener('input', recalc);
    })();

    var axis2Box = document.getElementById('mxAxis2Box');
    document.getElementById('mxAxis2Toggle').addEventListener('click', function(){
      axis2On = !axis2On;
      axis2Box.style.display = axis2On ? 'grid' : 'none';
      this.textContent = axis2On ? '− Remove second axis' : '+ Add a second axis';
      if (!axis2On) { document.getElementById('mxAxis2Label').value = ''; document.getElementById('mxAxis2Values').value = ''; }
      updatePreview();
    });

    function parseAxis(s){
      var seen = {}, out = [];
      (s || '').split(/[,\n]/).forEach(function(v){ v = v.trim(); if (!v || seen[v.toLowerCase()]) return; seen[v.toLowerCase()] = 1; out.push(v); });
      return out;
    }
    function updatePreview(){
      var name = document.getElementById('mxName').value.trim() || '(name)';
      var a1 = parseAxis(document.getElementById('mxAxis1Values').value);
      var a2 = axis2On ? parseAxis(document.getElementById('mxAxis2Values').value) : [];
      var combos = [];
      a1.forEach(function(x){ if (a2.length) a2.forEach(function(y){ combos.push(name + ' — ' + x + ' / ' + y); }); else combos.push(name + ' — ' + x); });
      var box = document.getElementById('mxPreview');
      box.innerHTML = combos.length
        ? 'Will create <b>' + combos.length + '</b> part' + (combos.length === 1 ? '' : 's') + ': ' + combos.slice(0, 8).map(esc).join(', ') + (combos.length > 8 ? ', …' : '')
        : '';
    }
    ['mxName', 'mxAxis1Values', 'mxAxis2Values'].forEach(function(id){ document.getElementById(id).addEventListener('input', updatePreview); });

    var msg = document.getElementById('mxMsg');
    document.getElementById('mxGo').addEventListener('click', async function(){
      var btn = this;
      var widget = document.getElementById('mxImageWidget').__widget;
      var file = widget ? widget.getFile() : null;
      var name = document.getElementById('mxName').value.trim();
      var category = document.getElementById('mxCategory').value;
      var axis1Values = document.getElementById('mxAxis1Values').value.trim();
      var showMsg = function(text, bad){
        msg.style.display = 'block';
        msg.style.background = bad ? '#fee2e2' : '#dbeafe';
        msg.style.color = bad ? '#991b1b' : '#1e40af';
        msg.textContent = text;
      };
      if (!name || !category) return showMsg('Base name and category are required.', true);
      if (!file) return showMsg('A photo is required — every variant gets its own copy of it.', true);
      if (!axis1Values) return showMsg('Axis 1 values are required.', true);

      var fd = new FormData();
      fd.append('photo', file);
      fd.append('name', name);
      fd.append('category', category);
      fd.append('condition', document.getElementById('mxCondition').value);
      fd.append('make_model', document.getElementById('mxMakeModel').value.trim());
      fd.append('base_sku', document.getElementById('mxBaseSku').value.trim());
      var addIf = function(id, key){ var v = (document.getElementById(id).value || '').trim(); if (v !== '') fd.append(key, v); };
      addIf('mxCost', 'cost_usd'); addIf('mxMarkup', 'markup_pct'); addIf('mxPrice', 'price_usd'); addIf('mxList', 'list_price_usd');
      fd.append('stock_count', document.getElementById('mxStock').value || '1');
      fd.append('low_threshold', document.getElementById('mxLow').value || '0');
      fd.append('stock_uom', document.getElementById('mxStockUom').value);
      fd.append('purchase_uom', document.getElementById('mxPurchUom').value);
      addIf('mxUnitsPerPurch', 'units_per_purchase');
      fd.append('costing_method', document.getElementById('mxCosting').value);
      fd.append('supplier_id', document.getElementById('mxSupplier').value || '');
      fd.append('supplier_part_no', document.getElementById('mxSupPartNo').value.trim());
      addIf('mxWarranty', 'warranty_days');
      fd.append('serial_required', document.getElementById('mxSerial').checked ? '1' : '0');
      addIf('mxCoreCharge', 'core_charge_usd'); addIf('mxEnvFee', 'env_fee_usd');
      fd.append('location', document.getElementById('mxLocation').value);
      fd.append('axis1_label', document.getElementById('mxAxis1Label').value.trim() || 'Variant');
      fd.append('axis1_values', axis1Values);
      if (axis2On) {
        fd.append('axis2_label', document.getElementById('mxAxis2Label').value.trim());
        fd.append('axis2_values', document.getElementById('mxAxis2Values').value.trim());
      }

      showMsg('Creating…');
      btn.disabled = true;
      try {
        var res = await fetch('/api/admin/product-matrix', { method: 'POST', body: fd, credentials: 'same-origin' });
        var data = null; try { data = await res.json(); } catch (e) {}
        if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
        posCloseModal();
        posToast('Matrix created — ' + data.children.length + ' parts added');
        if (onDone) onDone();
        matrixManagerModal(data.matrix_id, onDone);

// Part numbers carry characters that are meaningful inside an attribute
// selector, so escape before building one. CSS.escape isn't in every browser
// this counter runs on.
function cssEsc(s){
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/["\\\]\[\.#:>+~*^$|()]/g, '\\$&');
}

// =============================================================================
//  POS TERMINAL
//  A full parts-counter till: search or scan parts into a cart, attach the
//  customer and the sales rep who worked them, discount by line or by ticket,
//  decide how the goods leave (pickup / delivery / courier), take split tender
//  including charge-to-account, and print whichever of the five counter
//  documents actually applies.
//
//  The catalogue is ~23,000 parts since the stock-listing seed, so the counter
//  searches the server rather than the browser holding the whole table: the old
//  `/api/products?` with no limit pulled 6 MB and built 23k DOM cards on every
//  keystroke. Nothing is listed until the operator types, scans, or picks a
//  category.
// =============================================================================

var POS_REDRAW = null;   // set by renderPOS; lets code outside it refresh the panel
var POS_DRAWCART = null; // set by renderPOS; lets the persistent keydown listener redraw just the cart
var POS_SEL_INDEX = -1;  // legacy-keyboard-mode arrow-key selection into the current results list

// Terminal rules from shop_settings (fetched at the top of renderPOS). Off by
// default so nothing changes until a manager turns them on under Settings.
var POS_RULES = { enforce_login: false, enforce_customer: false, default_fulfilment: '' };
// The operator who unlocked this terminal (pos_enforce_login). Held in
// sessionStorage so a mid-shift reload doesn't force another PIN, but cleared
// by posResetTicket() so the terminal re-locks after every transaction.
var POS_OP = null;
try { POS_OP = JSON.parse(sessionStorage.getItem('mh_pos_op') || 'null'); } catch (_) { POS_OP = null; }
function posSaveOp(){
  try { POS_OP ? sessionStorage.setItem('mh_pos_op', JSON.stringify(POS_OP)) : sessionStorage.removeItem('mh_pos_op'); } catch (_) {}
}
// Guard shared by checkout / quote / save-as-order when pos_enforce_customer
// is on: a real customer (not the walk-in account) must be attached first.
function posRequireCustomer(){
  if (!POS_RULES.enforce_customer) return true;
  if (POS.customer && !POS.customer.is_walkin) return true;
  posToast('Attach a customer before this transaction — terminal rule.', true);
  var cs = document.getElementById('posCustSearch'); if (cs) cs.focus();
  return false;
}
// Asked once when a customer is attached and no default delivery method is set.
function posAskFulfilment(){
  posModal('How does this order leave?',
    '<div style="display:flex;flex-direction:column;gap:8px">' +
      [['pickup','🏪 Counter pickup'], ['delivery','🚚 Delivery'], ['shipping','📦 Shipping / courier']].map(function(o){
        return '<button type="button" class="btn" data-ful="' + o[0] + '" style="padding:13px;font-size:13.5px;text-align:left;font-weight:700">' + o[1] + '</button>';
      }).join('') +
    '</div>', 380);
  var wrap = document.getElementById('mhPosModal');
  if (wrap) wrap.querySelectorAll('[data-ful]').forEach(function(b){
    b.addEventListener('click', function(){
      POS.fulfilment = b.getAttribute('data-ful');
      if (POS.fulfilment === 'pickup') POS.ship.fee = 0;
      posSaveState(); posCloseModal();
      if (POS_REDRAW) POS_REDRAW();
    });
  });
}

// -----------------------------------------------------------------------------
//  Ticket state. Kept in one object and mirrored to localStorage so an
//  accidental refresh mid-sale doesn't drop the customer's cart — at a counter
//  that means re-picking every part with them standing there.
// -----------------------------------------------------------------------------
var POS_STATE_KEY = 'mh_pos_ticket';
var POS = null;

function posBlankTicket(){
  return {
    cart: [],
    customer: null,          // { id, name, phone, email, price_tier, points_balance, open_balance_cents, last_vehicle }
    custName: '', custPhone: '', vehicle: '',
    rep: null,               // { id, name }
    orderDiscRaw: 0, orderDiscMode: 'dollar',
    couponCode: '', couponDiscount: 0,   // couponDiscount is last previewed/applied value; the sale itself always recomputes it fresh
    redeemPts: 0,
    fulfilment: 'pickup',
    ship: { method:'', fee:0, name:'', phone:'', line1:'', line2:'', city:'', parish:'', country:'Jamaica', instructions:'' },
    poNumber: '',
    notes: '',
    holdId: null,            // set when this cart was recalled from a hold
    quoteId: null,           // set when this cart came off a saved quote
    collapsed: false,
    cartFull: true,        // default view: cart takes the whole terminal, with its own
                           // inventory search + filter. ⛶ Exit drops to the split view,
                           // and that choice sticks for the ticket (posSaveState).
    noTax: false,          // operator switched GCT off for this ticket — overrides the default rate,
                           // distinct from a customer-level tax exemption
    tag: '',               // free-text label from the 👁 preview menu ("Tag cart")
    restrictedApprovedBy: null,   // manager's name once a restricted-item approval has been granted this ticket
    verification: { id_type: '', id_number: '', tax_id: '' },  // captured for restricted items requiring one
  };
}
function posLoadState(){
  try {
    var raw = localStorage.getItem(POS_STATE_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      var blank = posBlankTicket();
      // Merge onto a blank so a ticket saved by an older build doesn't arrive
      // missing keys the rest of this panel dereferences.
      Object.keys(blank).forEach(function(k){ if (s[k] === undefined) s[k] = blank[k]; });
      s.ship = Object.assign({}, blank.ship, s.ship || {});
      s.verification = Object.assign({}, blank.verification, s.verification || {});
      return s;
    }
  } catch (_) {}
  return posBlankTicket();
}
function posSaveState(){
  try { localStorage.setItem(POS_STATE_KEY, JSON.stringify(POS)); } catch (_) {}
}
function posResetTicket(){
  POS = posBlankTicket();
  posSaveState();
  // Terminal rule: the next transaction starts from the lock screen.
  if (POS_RULES.enforce_login) { POS_OP = null; posSaveOp(); }
}

// pos_holds / pos_quotes / pos_favourites store items_json as Postgres JSONB.
// The pg driver hands JSONB back already parsed -- an array -- so the old
// JSON.parse(items_json) threw "[object Object] is not valid JSON", which the
// callers' catch swallowed: a recalled hold or quote loaded an empty cart, and
// the recall list showed every ticket as "0 lines". (The D1/SQLite backend
// stores the same column as TEXT, where JSON.parse was correct -- the two
// drifted.) Accept both shapes.
function posItemsArray(v){
  if (Array.isArray(v)) return v;
  if (v == null || v === '' || typeof v === 'object') return [];
  try { var a = JSON.parse(v); return Array.isArray(a) ? a : []; } catch (_) { return []; }
}

var POS_FONT_SCALES = { sm: 1, md: 1.15, lg: 1.35, xl: 1.6 };

// Full-screen cart search filter. A workstation search preference like
// POS_PREFS -- not part of any ticket -- so it lives in its own localStorage
// key and survives "New" and reload.
var POS_CART_FILTER_KEY = 'mh_pos_cart_filter';
function posBlankCartFilter(){ return { stockIn:false, priceMin:'', priceMax:'', location:'', brand:'', category:'', sort:'' }; }
var POS_CART_FILTER = (function(){
  try { return Object.assign(posBlankCartFilter(), JSON.parse(localStorage.getItem(POS_CART_FILTER_KEY) || '{}')); }
  catch (_) { return posBlankCartFilter(); }
})();
function posSaveCartFilter(){ try { localStorage.setItem(POS_CART_FILTER_KEY, JSON.stringify(POS_CART_FILTER)); } catch (_) {} }
function posCartFilterActive(){
  var f = POS_CART_FILTER;
  return !!(f.stockIn || f.priceMin || f.priceMax || f.location || f.brand || f.category || f.sort);
}
// Stored on the user's own row (users.ui_prefs) so the settings follow the
// person, not the machine: the same cashier gets their layout at the counter
// till, the parts desk and the back office. localStorage is kept underneath as
// a cache, so the POS renders with the right settings on the first paint
// instead of flickering from defaults while the server round-trips -- and so a
// till whose database is briefly unreachable still behaves.
function posPrefsKey(){ return POS_PREFS_KEY + ':' + (CURRENT_ADMIN_ID || 'anon'); }
function posLoadPrefs(){
  // columns only affects List/Compact (Grid always shows everything on its
  // card) -- which of the non-essential columns to show. Part No. and
  // Description are always shown regardless; they're what actually
  // identifies the row, not something to hide.
  // Everything that is a property of the *person* rather than the machine.
  // theme, favs and sidebarCollapsed each used to live in their own
  // localStorage key, which meant a cashier who set up their dark theme and
  // pinned five screens at the parts desk found none of it at the front
  // counter -- and lost the lot when the browser cache was cleared. They ride
  // the same record as the POS settings now.
  //
  // The POS cart deliberately stays out: a parked ticket belongs to the till
  // it was parked at, not to whoever is signed in.
  var d = {
    view: 'grid', fontSize: 'md', legacyKeys: false,
    columns: { fit: true, bin: true, qty: true, price: true },
    theme: null,               // null = follow whatever this machine had
    favs: null,                // null = not yet migrated from the old key
    sidebarCollapsed: null,
    landingTab: null,          // null = the app default (POS Terminal)
  };
  try {
    // Falls back to the old shared key so nobody's existing setup is wiped by
    // the upgrade -- to the operator, being silently reset to defaults looks
    // like the feature broke, not like it moved.
    var raw = localStorage.getItem(posPrefsKey()) || localStorage.getItem(POS_PREFS_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s.view) d.view = s.view;
      if (s.fontSize) d.fontSize = s.fontSize;
      if (s.legacyKeys) d.legacyKeys = true;
      if (s.columns) Object.assign(d.columns, s.columns);
      if (s.theme) d.theme = s.theme;
      if (Array.isArray(s.favs)) d.favs = s.favs;
      if (typeof s.sidebarCollapsed === 'boolean') d.sidebarCollapsed = s.sidebarCollapsed;
      if (s.landingTab) d.landingTab = s.landingTab;
    }
  } catch (_) {}
  // Pick up whatever the old single-purpose keys hold, so nobody's existing
  // theme or pinned screens vanish on the upgrade. Only used where the prefs
  // record has nothing to say yet; the first flush writes them into it.
  try {
    if (d.theme == null) d.theme = localStorage.getItem('mh_theme') || null;
    if (d.favs == null) {
      var oldFavs = localStorage.getItem('mh_admin_favs');
      d.favs = oldFavs ? JSON.parse(oldFavs) : [];
    }
    if (d.sidebarCollapsed == null) {
      d.sidebarCollapsed = localStorage.getItem('mh_admin_sidebar_collapsed') === '1';
    }
  } catch (_) { if (d.favs == null) d.favs = []; }
  return d;
}
// Deferred on purpose: the brief is to persist on exit, not on every click of
// the font dropdown. The existing call sites keep calling posSavePrefs() and
// simply mark the prefs dirty; posFlushPrefs() is the only thing that writes.
var POS_PREFS_DIRTY = false;
function posSavePrefs(){ POS_PREFS_DIRTY = true; }

// Merges a stored/server prefs object over the live one. Field-by-field rather
// than Object.assign on the whole thing so a malformed or half-written record
// cannot replace a valid setting with undefined.
function posApplyPrefs(s){
  if (!s || typeof s !== 'object') return;
  if (s.view) POS_PREFS.view = s.view;
  if (s.fontSize) POS_PREFS.fontSize = s.fontSize;
  if (typeof s.legacyKeys === 'boolean') POS_PREFS.legacyKeys = s.legacyKeys;
  if (s.columns) Object.assign(POS_PREFS.columns, s.columns);
  if (s.theme) POS_PREFS.theme = s.theme;
  if (Array.isArray(s.favs)) POS_PREFS.favs = s.favs;
  if (typeof s.sidebarCollapsed === 'boolean') POS_PREFS.sidebarCollapsed = s.sidebarCollapsed;
  if (s.landingTab) POS_PREFS.landingTab = s.landingTab;
}

// Puts the non-POS settings on screen. Called once the server's copy has
// arrived, because the page was painted from this machine's cache and the
// person may have different settings saved against their account.
function applyUserPrefsToChrome(){
  if (POS_PREFS.theme) {
    document.documentElement.setAttribute('data-theme', POS_PREFS.theme);
    try { localStorage.setItem('mh_theme', POS_PREFS.theme); } catch (_) {}
    var tb = document.getElementById('themeToggle');
    if (tb) tb.textContent = POS_PREFS.theme === 'dark' ? '☀️' : '🌙';
  }
  var wrap = document.querySelector('.wrap');
  if (wrap && typeof POS_PREFS.sidebarCollapsed === 'boolean') {
    wrap.classList.toggle('sb-collapsed', POS_PREFS.sidebarCollapsed);
    var sb = document.getElementById('sbCollapseBtn');
    if (sb) {
      sb.textContent = POS_PREFS.sidebarCollapsed ? '»' : '« Collapse';
      sb.title = POS_PREFS.sidebarCollapsed ? 'Expand menu' : 'Collapse menu';
    }
  }
}

// The write. Always updates the local cache; pushes to the server too.
//
// `beacon` is for the exit hooks below. A normal fetch started from pagehide is
// routinely cancelled as the document goes away, which is precisely when this
// most needs to land -- navigator.sendBeacon hands the request to the browser
// to deliver after the page is gone. It can only POST, hence the POST endpoint,
// and the Blob type is what makes express.json() parse the body.
// Returns a promise so sign-out can wait for the write to land before it tears
// the session down; the fire-and-forget callers simply ignore it.
function posFlushPrefs(beacon){
  if (!POS_PREFS_DIRTY) return Promise.resolve();
  var payload = JSON.stringify(POS_PREFS);
  try { localStorage.setItem(posPrefsKey(), payload); } catch (_) {}
  POS_PREFS_DIRTY = false;
  if (!CURRENT_ADMIN_ID) return Promise.resolve();   // not signed in: local cache only
  try {
    if (beacon && navigator.sendBeacon) {
      navigator.sendBeacon('/api/admin/me/ui-prefs', new Blob([payload], { type: 'application/json' }));
      return Promise.resolve();
    }
    // keepalive lets this outlive a tab switch that navigates immediately.
    return fetch('/api/admin/me/ui-prefs', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: payload, credentials: 'same-origin', keepalive: true
    }).catch(function(){});                          // a till with no database still works locally
  } catch (_) { return Promise.resolve(); }
}

var POS_PREFS = posLoadPrefs();

// POS_PREFS above is built while this script parses, when CURRENT_ADMIN_ID is
// still null and the key resolves to ':anon'. Both auth paths await this once
// the session is known, before init() renders the POS.
async function posInitPrefsForUser(){
  POS_PREFS = posLoadPrefs();                   // instant, from this machine's cache
  POS_PREFS_DIRTY = false;
  try {
    var r = await api('/api/admin/me/ui-prefs');
    // Manager-preset pinned screens ride the same response.
    FAVS_LOCKED = !!(r && r.favs_locked);
    FORCED_FAVS = (r && Array.isArray(r.forced_favs)) ? r.forced_favs : null;
    // An empty object means this user has never saved -- keep whatever the
    // local cache gave us rather than stamping defaults over a setup they
    // made on this machine before the server started storing these.
    if (r && r.prefs && Object.keys(r.prefs).length) {
      posApplyPrefs(r.prefs);
      try { localStorage.setItem(posPrefsKey(), JSON.stringify(POS_PREFS)); } catch (_) {}
    } else {
      // First sign-in since the upgrade: seed the server from what this
      // machine already knew, so the settings start following them right away.
      POS_PREFS_DIRTY = true;
      posFlushPrefs();
    }
  } catch (_) {
    // Offline / older server without the endpoint: the cached prefs stand.
  }
}

// ---- exit hooks -------------------------------------------------------------
// pagehide covers closing the tab, reloading and navigating away.
// visibilitychange covers a till being minimised or the browser backgrounded,
// where pagehide is not guaranteed to fire at all. beforeunload is deliberately
// not used: it is ignored on mobile and skipped for bfcache-eligible
// navigations, which are exactly the cases that would lose the write.
window.addEventListener('pagehide', function(){ posFlushPrefs(true); });
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') posFlushPrefs(true);
});
// px = the size at 100% (fontSize:'md'); every call scales from there so one
// number change (POS_FONT_SCALES) re-tunes every view at once.
function posFS(px){ return Math.round(px * (POS_FONT_SCALES[POS_PREFS.fontSize] || 1) * 10) / 10 + 'px'; }
// Same setting, different baseline, for the ticket bar (customer / sales rep /
// vehicle) and the customer lookup dropdown.
//
// posFS() scales from 'sm' = 1.0, so the results list at the default 'md' is
// already sitting 15% above the numbers written in the source. The ticket bar
// cannot take that: it is a fixed-height strip of fixed-width controls, and
// 15% larger by default would wrap it onto a second row for everyone who never
// touched the setting. So these scale RELATIVE TO 'md' -- 'Default' reproduces
// the bar exactly as it looked before it scaled at all, and Small / Large /
// Extra large move around that.
function posBarScale(){ return (POS_FONT_SCALES[POS_PREFS.fontSize] || 1) / POS_FONT_SCALES.md; }
function posBarFS(px){ return Math.round(px * posBarScale() * 10) / 10 + 'px'; }
// Widths have to move with the text or a large setting just clips the
// placeholder inside a control that stayed 170px wide.
function posBarPx(px){ return Math.round(px * posBarScale()) + 'px'; }
function posViewBtn(mode, glyph, label){
  var active = POS_PREFS.view === mode;
  return '<button type="button" class="posViewBtn" data-view="' + mode + '" title="' + label + '" aria-pressed="' + active + '" style="' +
    'width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;' +
    (active ? 'background:var(--navy);color:#fff;border:1px solid var(--navy)' : 'background:var(--card);color:var(--muted);border:1px solid var(--line)') +
    '">' + glyph + '</button>';
}
// Denser views fit more per screen, so it's natural for them to also page in
// bigger chunks -- a compact reader can usefully scan 100 rows at a glance,
// a grid of big cards can't.
function posPageSize(){
  return POS_PREFS.view === 'compact' ? 100 : (POS_PREFS.view === 'list' ? 40 : 60);
}
// Legacy keyboard mode: paints the arrow-key cursor onto whichever row/card
// is at POS_SEL_INDEX and scrolls it into view. Reads directly from the DOM
// (not a per-render closure) so it works no matter which render attached the
// persistent keydown listener that drives it.
function posHighlightSel(){
  var results = document.getElementById('posResults');
  if (!results) return;
  // Row/card containers only -- the per-row checkbox and the "+" button also
  // carry data-img, so a bare [data-img] query returns several nodes per
  // product and throws POS_SEL_INDEX (an index into the product list) off.
  var rows = results.querySelectorAll('.posCard,.posRow');
  rows.forEach(function(row, i){
    if (i === POS_SEL_INDEX) {
      row.style.outline = '3px solid var(--red)';
      row.style.outlineOffset = '-3px';
      row.style.background = 'rgba(220,38,38,.32)';
      row.style.boxShadow = 'inset 6px 0 0 0 var(--red), 0 0 0 3px rgba(220,38,38,.5), 0 8px 22px rgba(0,0,0,.30)';
      row.style.borderRadius = '8px';
      row.style.position = 'relative';
      row.style.zIndex = '3';
      row.style.scrollMarginTop = '10px';
      row.style.scrollMarginBottom = '10px';
      row.scrollIntoView({ block: 'nearest' });
    } else {
      row.style.outline = 'none';
      row.style.background = '';
      row.style.boxShadow = '';
      row.style.borderRadius = '';
      row.style.zIndex = '';
    }
  });
}

// Cents in, formatted dollars out. The catalogue and every server total are in
// cents; only the cart's editable price input works in dollars.
function posCents(c){ return fmtMoney((Number(c) || 0) / 100); }
function posMoney(cents){
  if (cents == null) return null;
  return Math.round(Number(cents)) / 100;
}

// -----------------------------------------------------------------------------
//  Ticket arithmetic. Deliberately mirrors posTotals() on the server so the
//  screen and the receipt can never disagree; the server's figures are still
//  the ones that get stored.
// -----------------------------------------------------------------------------
function posLineGross(i){ return (Number(i.price) || 0) * (Number(i.qty) || 0); }
// Per-line discount is entered either as a flat amount (i.disc) or, when
// i.discMode === 'pct', as a percentage of the line gross (i.discPct). Either
// way this resolves to a dollar figure, clamped to [0, gross]; everything
// downstream (totals, payload, receipt) reads it through here.
function posLineDisc(i){
  var gross = posLineGross(i);
  var raw = i && i.discMode === 'pct'
    ? gross * (Math.max(0, Number(i.discPct) || 0) / 100)
    : Math.max(0, Number(i && i.disc) || 0);
  return Math.min(gross, Math.round(raw * 100) / 100);
}
function posLineNet(i){ return posLineGross(i) - posLineDisc(i); }

function posTotals(){
  var subtotal = POS.cart.reduce(function(s,i){ return s + posLineNet(i); }, 0);
  var lineDisc = POS.cart.reduce(function(s,i){ return s + posLineDisc(i); }, 0);
  var orderDisc = POS.orderDiscMode === 'pct'
    ? Math.round(subtotal * (Number(POS.orderDiscRaw) || 0)) / 100
    : Math.max(0, Number(POS.orderDiscRaw) || 0);
  orderDisc = Math.min(subtotal, Math.round(orderDisc * 100) / 100);
  var maxPts = POS.customer ? (POS.customer.points_balance || 0) : 0;
  var redeemPts = Math.min(maxPts, Math.max(0, parseInt(POS.redeemPts || 0, 10) || 0));
  var loyaltyDisc = Math.min(subtotal - orderDisc, Math.round(redeemPts * POS_POINTS_USD_RATE * 100) / 100);
  // Whatever was last previewed/applied via "Apply" -- the sale itself always
  // recomputes this fresh server-side, so a stale preview (cart changed since)
  // can only ever make the on-screen total optimistic, never actually wrong.
  var couponDisc = POS.couponCode ? Math.max(0, Math.min(subtotal - orderDisc - loyaltyDisc, Number(POS.couponDiscount) || 0)) : 0;
  var goods = Math.max(0, subtotal - orderDisc - loyaltyDisc - couponDisc);
  var shipping = POS.fulfilment === 'pickup' ? 0 : Math.max(0, Number(POS.ship.fee) || 0);
  var taxable = Math.round((goods + shipping) * 100) / 100;
  var tax = (POS.noTax || (POS.customer && POS.customer.tax_exempt)) ? 0 : Math.round(taxable * POS_TAX_RATE * 100) / 100;
  return {
    subtotal: subtotal, lineDisc: lineDisc, orderDisc: orderDisc,
    redeemPts: redeemPts, loyaltyDisc: loyaltyDisc, couponDisc: couponDisc,
    totalDisc: Math.round((orderDisc + loyaltyDisc + couponDisc) * 100) / 100,
    shipping: shipping, taxable: taxable, tax: tax,
    total: Math.round((taxable + tax) * 100) / 100,
  };
}

// The cart payload every server call shares.
function posCartPayload(){
  return POS.cart.map(function(i){
    return {
      product_img: i.img,
      description: i.name,
      qty: i.qty,
      unit_price_usd: Number(i.price) || 0,
      discount_usd: posLineDisc(i),
      discount_note: i.discNote || null,
      serial_number: i.serialNumber || null,
      warranty_days: i.warrantyDays || null,
      core_charge_usd: Number(i.coreChargeUsd) || 0,
      env_fee_usd: Number(i.envFeeUsd) || 0,
    };
  });
}

// sales_rep_id is a mechanics-table foreign key on the server. POS.rep.id is
// normally a real mechanics id, but the signed-in-user fallback carries the
// sentinel 'self' -- send null for that (the name still goes over in
// sales_rep_name, which is free text).
function posRepIdForPayload(){
  return (POS.rep && typeof POS.rep.id === 'number') ? POS.rep.id : null;
}

// The lowest of the base price and every quantity-break the given qty
// qualifies for -- mirrors _lib/price_breaks.js's bestUnitPriceCents (kept in
// USD here since the whole POS cart already works in dollars client-side).
function posBestUnitPrice(basePrice, breaks, qty){
  var best = Number(basePrice) || 0;
  (breaks || []).forEach(function(b){
    var bp = Number(b.price_usd);
    if (qty >= b.min_qty && isFinite(bp) && bp < best) best = bp;
  });
  return best;
}

function posAddToCart(p, qty){
  var serialRequired = !!p.serial_required;
  var isRedeemable = !!p.is_redeemable;
  // The lower of the regular price and an active sale price -- mirrors
  // _lib/price_breaks.js's effectiveBaseCents; quantity breaks then apply on
  // top of *this*, via posBestUnitPrice, exactly like the server does.
  var regularPrice = Number(p.price_usd) || 0;
  var basePrice = (p.sale_price_usd != null && Number(p.sale_price_usd) < regularPrice) ? Number(p.sale_price_usd) : regularPrice;
  var priceBreaks = p.price_breaks || [];
  var extra = {
    location: p.location, bin_location: p.bin_location, stock_count: p.stock_count,
    disc: 0, discPct: 0, discMode: 'amt', discNote: '',
    serialRequired: serialRequired, serialNumber: '', isRedeemable: isRedeemable,
    warrantyDays: p.warranty_days || null,
    coreChargeUsd: Number(p.core_charge_usd) || 0, envFeeUsd: Number(p.env_fee_usd) || 0,
    basePrice: basePrice, priceBreaks: priceBreaks, priceManual: false,
    regularPrice: regularPrice, saleActive: basePrice < regularPrice,
    maxDiscountPct: p.max_discount_pct != null && p.max_discount_pct !== '' ? Number(p.max_discount_pct) : null,
    restrictedManagerApproval: !!p.restricted_manager_approval,
    restrictedIdRequired: !!p.restricted_id_required,
    restrictedTaxIdRequired: !!p.restricted_tax_id_required,
  };
  if (serialRequired || isRedeemable) {
    // Each serialized unit needs its own serial number (typed by the
    // cashier), and each redeemable unit mints its own code (server-side,
    // after the sale) -- either way it can't share a line (and a shared qty)
    // with another unit the way an ordinary part does. Every "add" is its
    // own cart line, always qty 1, so quantity-break pricing (which needs
    // qty >= 2 on one line) never applies here.
    var n = Math.max(1, qty || 1);
    for (var i = 0; i < n; i++) {
      POS.cart.push(Object.assign({ img: p.img, name: p.name, make_model: p.make_model, sku: p.sku || null,
        price: basePrice, qty: 1 }, extra));
    }
    posSaveState();
    return;
  }
  var ex = POS.cart.find(function(c){ return c.img === p.img && !c.serialRequired && !c.isRedeemable; });
  if (ex) {
    ex.qty += (qty || 1);
    if (!ex.priceManual) ex.price = posBestUnitPrice(ex.basePrice, ex.priceBreaks, ex.qty);
  } else {
    var q = qty || 1;
    POS.cart.push(Object.assign({ img: p.img, name: p.name, make_model: p.make_model, sku: p.sku || null,
      price: posBestUnitPrice(basePrice, priceBreaks, q), qty: q }, extra));
  }
  posSaveState();
}

// Lock screen shown when shop_settings.pos_enforce_login is on and no operator
// has unlocked the terminal yet (or the last transaction re-locked it). Pick a
// name, key the PIN, and POST /api/admin/staff/pin-verify -- the PIN must
// belong to the picked person.
async function posRenderLockScreen(panel){
  var ops = [];
  try { ops = (await api('/api/admin/pos/operators')).operators || []; } catch (_) {}
  panel.innerHTML =
    '<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:30px">' +
      '<div style="background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.18);padding:26px 26px 22px;width:100%;max-width:360px;text-align:center">' +
        '<div style="font-size:40px;line-height:1">🔒</div>' +
        '<h2 style="margin:8px 0 2px;color:var(--heading);font-size:19px">POS locked</h2>' +
        '<p style="margin:0 0 16px;color:var(--muted);font-size:12.5px">Choose your name and enter your PIN to start.</p>' +
        (ops.length
          ? '<label class="lbl" style="text-align:left">Operator</label>' +
            '<select id="lockUser" class="fld" style="margin-bottom:10px">' +
              '<option value="">— select —</option>' +
              ops.map(function(o){ return '<option value="' + o.id + '">' + esc(o.name) + '</option>'; }).join('') +
            '</select>' +
            '<label class="lbl" style="text-align:left">PIN</label>' +
            '<input id="lockPin" class="fld" type="password" inputmode="numeric" autocomplete="off" autofocus style="letter-spacing:4px;text-align:center;font-size:16px"/>' +
            '<button type="button" id="lockGo" class="btn ok" style="width:100%;margin-top:14px;padding:11px;font-weight:800">Unlock terminal</button>' +
            '<div id="lockMsg" style="font-size:12px;margin-top:9px;min-height:15px;color:#b91c1c"></div>'
          : '<div style="color:#b91c1c;font-size:12.5px">No staff PINs are set yet. A manager can set one under <b>Staff → each person → PIN</b>, or turn this rule off in <b>Settings</b>.</div>') +
      '</div>' +
    '</div>';
  if (!ops.length) return;
  var sel = document.getElementById('lockUser');
  var pin = document.getElementById('lockPin');
  var msg = document.getElementById('lockMsg');
  var go  = document.getElementById('lockGo');
  async function unlock(){
    var uid = parseInt(sel.value, 10);
    if (!uid) { msg.textContent = 'Pick your name first.'; return; }
    if (!pin.value.trim()) { msg.textContent = 'Enter your PIN.'; return; }
    go.disabled = true; msg.style.color = 'var(--muted)'; msg.textContent = 'Checking…';
    try {
      var res = await api('/api/admin/staff/pin-verify', { method: 'POST', body: { pin: pin.value.trim(), purpose: 'pos' } });
      if (!res.user || res.user.id !== uid) {
        msg.style.color = '#b91c1c';
        msg.textContent = 'That PIN does not match ' + (sel.options[sel.selectedIndex].text) + '.';
        go.disabled = false; pin.value = ''; pin.focus();
        return;
      }
      POS_OP = { id: res.user.id, name: res.user.name, rep_id: res.user.rep_id || null };
      posSaveOp();
      renderPOS(panel);
    } catch (e) {
      msg.style.color = '#b91c1c';
      msg.textContent = e.message || 'PIN not recognised.';
      go.disabled = false; pin.value = ''; pin.focus();
    }
  }
  go.addEventListener('click', unlock);
  pin.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); unlock(); } });
}

async function renderPOS(panel){
  if (!can('pos.access')) {
    panel.innerHTML = '<div style="padding:60px 20px;text-align:center;color:var(--muted)">' +
      '<div style="font-size:44px">🔒</div>' +
      '<h2 style="color:var(--heading);margin:10px 0 4px">POS access is turned off for your account</h2>' +
      '<p>Ask a manager to enable it under Staff → your account → Permissions.</p></div>';
    return;
  }
  POS = posLoadState();

  // Terminal rules (operator PIN unlock, mandatory customer, default delivery
  // method). Fetched here so the flags are current every time the panel opens;
  // absent columns / a failed call just leave every rule off.
  try {
    var __st = (await api('/api/admin/settings')).settings || {};
    POS_RULES.enforce_login    = !!__st.pos_enforce_login;
    POS_RULES.enforce_customer = !!__st.pos_enforce_customer;
