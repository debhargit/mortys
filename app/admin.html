        '</div>' +
        '<div id="rcvList" style="margin-top:12px;overflow-x:auto"></div>' +
        '<div style="display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap">' +
          '<button class="btn ok" id="rcvGo" disabled>Receive 0 items</button>' +
          '<span id="rcvMsg" style="font-size:12.5px"></span>' +
        '</div>' +
      '</div>' +
    '</details>' +
    (r.purchase_orders.length
      ? '<table><thead><tr><th>PO #</th><th>Supplier</th><th>Created</th><th>Expected</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>' +
        r.purchase_orders.map(function(po){
          return '<tr><td><b>' + esc(po.po_number) + '</b></td>' +
            '<td>' + esc(po.supplier_name || '—') + '</td>' +
            '<td>' + fmtDate(po.created_at) + '</td>' +
            '<td>' + (po.expected_date ? new Date(po.expected_date).toLocaleDateString() : '—') + '</td>' +
            '<td><b>' + fmtMoney(po.total_usd) + '</b></td>' +
            '<td>' + badge(po.status, po.status === 'received' ? 'ok' : (po.status === 'cancelled' ? 'bad' : 'pending')) + '</td>' +
            '<td class="actions"><button class="btn" data-open="' + po.id + '">Open</button></td>' +
          '</tr>';
        }).join('') + '</tbody></table>'
      : '<div class="empty">No purchase orders yet — create one above.</div>');

  panel.querySelectorAll('[data-open]').forEach(function(b){
    b.addEventListener('click', function(){ PO_VIEW_ID = b.getAttribute('data-open'); renderPurchaseOrders(panel); });
  });

  // ---- Inline "add a new supplier" on the New PO form ---------------------
  var poSupSel = document.getElementById('poSupplier');
  var poNewSup = document.getElementById('poNewSup');
  if (poSupSel && poNewSup) {
    poSupSel.addEventListener('change', function(){
      poNewSup.style.display = this.value === '__new__' ? 'block' : 'none';
      if (this.value === '__new__') { var n = document.getElementById('poNewSupName'); if (n) n.focus(); }
    });
    var sv = document.getElementById('poNewSupSave');
    if (sv) sv.addEventListener('click', async function(){
      var name = document.getElementById('poNewSupName').value.trim();
      var m = document.getElementById('poNewSupMsg');
      if (!name) { m.textContent = 'Name required'; m.style.color = 'var(--red)'; return; }
      sv.disabled = true; m.textContent = 'Creating…'; m.style.color = 'var(--muted)';
      try {
        var res = await api('/api/admin/suppliers', { method: 'POST', body: {
          name: name, phone: document.getElementById('poNewSupPhone').value.trim() || null,
        }});
        var opt = document.createElement('option');
        opt.value = res.id; opt.textContent = name;
        poSupSel.insertBefore(opt, poSupSel.querySelector('option[value="__new__"]'));
        poSupSel.value = String(res.id);
        poNewSup.style.display = 'none';
        m.textContent = '';
        posToast('Supplier “' + name + '” added');
      } catch (e) { m.textContent = e.message; m.style.color = 'var(--red)'; sv.disabled = false; }
    });
  }

  // ---- Receive without a PO -------------------------------------------------
  var rcvLines = [];   // { img, name, sku, qty, cost, sell, bin }
  var rcvSearch = document.getElementById('rcvSearch');
  var rcvResults = document.getElementById('rcvResults');
  var rcvList = document.getElementById('rcvList');
  var rcvGo = document.getElementById('rcvGo');
  var rcvMsg = document.getElementById('rcvMsg');
  var rcvDeb = null;

  // Inline "add a new supplier" for the receive form (same as the New PO one).
  var rcvSupSel = document.getElementById('rcvSupplier');
  var rcvNewSup = document.getElementById('rcvNewSup');
  if (rcvSupSel && rcvNewSup) {
    rcvSupSel.addEventListener('change', function(){
      rcvNewSup.style.display = this.value === '__new__' ? 'block' : 'none';
      if (this.value === '__new__') { var n = document.getElementById('rcvNewSupName'); if (n) n.focus(); }
    });
    var rsv = document.getElementById('rcvNewSupSave');
    if (rsv) rsv.addEventListener('click', async function(){
      var name = document.getElementById('rcvNewSupName').value.trim();
      var m = document.getElementById('rcvNewSupMsg');
      if (!name) { m.textContent = 'Name required'; m.style.color = 'var(--red)'; return; }
      rsv.disabled = true; m.textContent = 'Creating…'; m.style.color = 'var(--muted)';
      try {
        var sr = await api('/api/admin/suppliers', { method: 'POST', body: { name: name, phone: document.getElementById('rcvNewSupPhone').value.trim() || null } });
        var opt = document.createElement('option');
        opt.value = sr.id; opt.textContent = name;
        rcvSupSel.insertBefore(opt, rcvSupSel.querySelector('option[value="__new__"]'));
        rcvSupSel.value = String(sr.id);
        rcvNewSup.style.display = 'none'; m.textContent = '';
        posToast('Supplier “' + name + '” added');
      } catch (e) { m.textContent = e.message; m.style.color = 'var(--red)'; rsv.disabled = false; }
    });
  }

  function rcvRender(){
    rcvGo.disabled = !rcvLines.length;
    rcvGo.textContent = 'Receive ' + rcvLines.length + ' item' + (rcvLines.length === 1 ? '' : 's');
    if (!rcvLines.length) { rcvList.innerHTML = ''; return; }
    var mini = 'width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:5px;font-size:12px;font-family:inherit';
    rcvList.innerHTML = '<table style="width:100%;min-width:760px"><thead><tr>' +
      '<th style="text-align:left">Part</th><th style="width:150px">Description</th><th style="width:70px">Qty</th>' +
      '<th style="width:90px">Cost</th><th style="width:90px">Sell price</th><th style="width:90px">Bin</th><th style="width:36px"></th>' +
      '</tr></thead><tbody>' +
      rcvLines.map(function(l, i){
        return '<tr><td><b style="font-size:12.5px">' + esc(l.name) + '</b><br/><small style="color:var(--muted)">' + esc(l.sku || l.img) + '</small></td>' +
          '<td><input class="rcvName" data-i="' + i + '" value="' + esc(l.name || '') + '" style="' + mini + '"/></td>' +
          '<td><input type="number" min="1" class="rcvQty" data-i="' + i + '" value="' + l.qty + '" style="' + mini + '"/></td>' +
          '<td><input type="number" min="0" step="0.01" class="rcvCost" data-i="' + i + '" value="' + (l.cost != null ? l.cost : '') + '" placeholder="—" style="' + mini + '"/></td>' +
          '<td><input type="number" min="0" step="0.01" class="rcvSell" data-i="' + i + '" value="' + (l.sell != null ? l.sell : '') + '" placeholder="—" style="' + mini + '"/></td>' +
          '<td><input class="rcvBin" data-i="' + i + '" value="' + esc(l.bin || '') + '" placeholder="—" style="' + mini + '"/></td>' +
          '<td><button class="btn rcvDel" data-i="' + i + '" style="background:#fee2e2;color:#b91c1c;border:0">×</button></td></tr>';
      }).join('') + '</tbody></table>';
    var bind = function(cls, fn){ rcvList.querySelectorAll('.' + cls).forEach(function(el){ el.addEventListener('change', function(){ fn(rcvLines[+el.dataset.i], el.value); }); }); };
    bind('rcvName', function(l, v){ l.name = v.trim(); });
    bind('rcvQty',  function(l, v){ l.qty = Math.max(1, parseInt(v, 10) || 1); });
    bind('rcvCost', function(l, v){ l.cost = v.trim() === '' ? null : Number(v); });
    bind('rcvSell', function(l, v){ l.sell = v.trim() === '' ? null : Number(v); });
    bind('rcvBin',  function(l, v){ l.bin = v.trim() || null; });
    rcvList.querySelectorAll('.rcvDel').forEach(function(el){ el.addEventListener('click', function(){ rcvLines.splice(+el.dataset.i, 1); rcvRender(); }); });
  }
  function rcvAdd(p){
    var ex = rcvLines.find(function(x){ return x.img === p.img; });
    if (ex) { ex.qty += 1; }
    else rcvLines.push({
      img: p.img, name: p.name, sku: p.sku || '', qty: 1,
      cost: p.cost_usd != null ? Number(p.cost_usd) : null,
      sell: p.price_usd != null ? Number(p.price_usd) : null,
      bin: p.bin_location || null,
    });
    rcvSearch.value = ''; rcvResults.style.display = 'none'; rcvRender(); rcvSearch.focus();
  }
  rcvSearch.addEventListener('input', function(){
    var q = this.value.trim();
    clearTimeout(rcvDeb);
    if (q.length < 2) { rcvResults.style.display = 'none'; return; }
    rcvDeb = setTimeout(async function(){
      try {
        var res = await api('/api/products?limit=8&q=' + encodeURIComponent(q));
        var list = res.products || [];
        rcvResults.innerHTML = list.length
          ? list.map(function(p){
              return '<button type="button" class="rcvHit" data-img="' + esc(p.img) + '" style="display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--hover);background:var(--card);color:var(--ink);padding:8px 11px;cursor:pointer;font-family:inherit">' +
                '<b style="flex:1;min-width:0">' + esc(p.name) + '</b>' +
                '<small style="color:var(--muted)">' + esc(p.sku || p.img) + '</small>' +
                '<span style="color:var(--muted)">stock ' + (p.stock_count || 0) + '</span>' +
              '</button>';
            }).join('')
          : '<div style="padding:10px 12px;font-size:12px;color:var(--muted)">no match</div>';
        rcvResults.style.display = 'block';
        rcvResults.querySelectorAll('.rcvHit').forEach(function(b){
          b.addEventListener('click', function(){ var p = list.find(function(x){ return x.img === b.dataset.img; }); if (p) rcvAdd(p); });
        });
      } catch (e) { rcvResults.innerHTML = '<div style="padding:10px;color:#b91c1c;font-size:12px">' + esc(e.message) + '</div>'; rcvResults.style.display = 'block'; }
    }, 200);
  });
  document.addEventListener('click', function(e){ if (rcvResults && !rcvResults.contains(e.target) && e.target !== rcvSearch) rcvResults.style.display = 'none'; });
  rcvGo.addEventListener('click', async function(){
    if (!rcvLines.length) return;
    rcvGo.disabled = true; rcvMsg.textContent = 'Receiving…'; rcvMsg.style.color = 'var(--muted)';
    try {
      var res = await api('/api/admin/receive', { method: 'POST', body: {
        supplier_id: (rcvSupSel && rcvSupSel.value && rcvSupSel.value !== '__new__') ? rcvSupSel.value : null,
        invoice: document.getElementById('rcvInvoice').value.trim() || null,
        items: rcvLines.map(function(l){ return {
          product_img: l.img, qty: l.qty, unit_cost_usd: l.cost, price_usd: l.sell,
          name: l.name, bin_location: l.bin,
        }; }),
      }});
      var okN = (res.received || []).filter(function(x){ return x.ok; }).length;
      var bad = (res.received || []).filter(function(x){ return !x.ok; });
      posToast('Received ' + okN + ' item' + (okN === 1 ? '' : 's') + ' into stock' + (bad.length ? ' — ' + bad.length + ' failed' : ''), bad.length > 0);
      rcvLines = []; document.getElementById('rcvInvoice').value = ''; rcvRender(); rcvMsg.textContent = '';
      renderPurchaseOrders(panel);
    } catch (e) { rcvMsg.textContent = e.message; rcvMsg.style.color = 'var(--red)'; rcvGo.disabled = false; }
  });
}
async function submitPo(){
  var msg = document.getElementById('poMsg');
  msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';
  try {
    var supplierId = document.getElementById('poSupplier').value;
    if (!supplierId || supplierId === '__new__') throw new Error('Choose a supplier, or create one with ➕ Add a new supplier…');
    await api('/api/admin/purchase-orders', { method:'POST', body: {
      supplier_id: supplierId,
      expected_date: document.getElementById('poExpected').value || null,
      notes: document.getElementById('poNotes').value.trim() || null,
    }});
    show('purchaseorders');
  } catch (e) {
    msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
  }
}
async function renderPoDetail(panel, id){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var d;
  try { d = await api('/api/admin/purchase-orders/' + id); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  var po = d.purchase_order;
  var canReceive = po.status !== 'received' && po.status !== 'cancelled';

  panel.innerHTML =
    '<div style="padding:11px 14px;border-bottom:1px solid var(--line)"><button class="btn" id="poBack">‹ All purchase orders</button></div>' +
    '<div style="padding:14px 16px;display:flex;gap:24px;flex-wrap:wrap;border-bottom:1px solid var(--line)">' +
      '<div><div class="lbl">PO #</div><b style="font-size:15px">' + esc(po.po_number) + '</b></div>' +
      '<div><div class="lbl">Supplier</div><b>' + esc(po.supplier_name || '—') + '</b>' +
        (po.supplier_phone ? '<br/><small>' + esc(po.supplier_phone) + '</small>' : '') + '</div>' +
      '<div><div class="lbl">Status</div>' + badge(po.status, po.status === 'received' ? 'ok' : (po.status === 'cancelled' ? 'bad' : 'pending')) + '</div>' +
      '<div><div class="lbl">Total</div><b>' + fmtMoney(po.total_usd) + '</b>' +
        (Number(po.shipping_usd) > 0 ? '<br/><small>+' + fmtMoney(po.shipping_usd) + ' shipping</small>' : '') + '</div>' +
      (po.notes ? '<div><div class="lbl">Notes</div>' + esc(po.notes) + '</div>' : '') +
    '</div>' +
    '<div style="padding:14px 16px">' +
      '<table><thead><tr><th>Description</th><th>SKU</th><th>Ordered</th><th>Received</th><th>Unit cost</th><th>Total</th>' + (canReceive ? '<th>Receive now</th><th>Sell price</th><th>Bin</th>' : '') + '</tr></thead><tbody>' +
        d.items.map(function(it){
          var outstanding = it.qty_ordered - it.qty_received;
          return '<tr><td>' + esc(it.description) + (it.product_name ? '<br/><small style="color:var(--muted)">' + esc(it.product_name) + '</small>' : '') + '</td>' +
            '<td>' + esc(it.sku || '—') + '</td>' +
            '<td>' + it.qty_ordered + '</td>' +
            '<td>' + it.qty_received + (outstanding > 0 ? ' <small style="color:#b45309">(' + outstanding + ' due)</small>' : '') + '</td>' +
            '<td>' + fmtMoney(it.unit_cost_usd) + '</td>' +
            '<td><b>' + fmtMoney(it.total_usd) + '</b></td>' +
            (canReceive
              ? (outstanding > 0
                  ? '<td><input type="number" min="0" max="' + outstanding + '" class="fld-mini" data-recv="' + it.id + '" placeholder="0"/></td>' +
                    '<td><input type="number" min="0" step="0.01" class="fld-mini" data-price="' + it.id + '" placeholder="—"/></td>' +
                    '<td><input class="fld-mini" data-bin="' + it.id + '" value="' + esc(it.bin_location || '') + '" placeholder="—"/></td>'
                  : '<td colspan="3"><small style="color:var(--muted)">complete</small></td>')
              : '') +
          '</tr>';
        }).join('') +
      '</tbody></table>' +
      (canReceive ? '<button class="btn ok" id="poReceiveGo" style="margin-top:10px">Receive entered quantities</button>' : '') +
    '</div>' +
    '<details style="border-top:1px solid var(--line);background:var(--card-soft)">' +
      '<summary style="padding:12px 16px;cursor:pointer;font-weight:700;color:var(--heading)">+ Add line item</summary>' +
      '<form id="poItemForm" style="padding:14px 18px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;max-width:760px" onsubmit="event.preventDefault();submitPoItem(' + id + ');">' +
        '<div style="grid-column:1/-1"><label class="lbl">Description *</label><input id="poiDesc" required class="fld"/></div>' +
        '<div><label class="lbl">SKU</label><input id="poiSku" class="fld"/></div>' +
        '<div><label class="lbl">Qty *</label><input id="poiQty" type="number" min="1" value="1" required class="fld"/></div>' +
        '<div><label class="lbl">Unit cost *</label><input id="poiCost" type="number" min="0" step="0.01" required class="fld"/></div>' +
        '<div><label class="lbl">Product img (optional)</label><input id="poiImg" class="fld" placeholder="link to existing product"/></div>' +
        '<div id="poiMsg" style="grid-column:1/-1;display:none;padding:10px 12px;border-radius:6px;font-size:13px"></div>' +
        '<button type="submit" style="grid-column:1/-1;background:var(--red);color:#fff;border:0;padding:11px 22px;border-radius:7px;font-weight:700;cursor:pointer">Add item</button>' +
      '</form>' +
    '</details>';

  document.getElementById('poBack').addEventListener('click', function(){ PO_VIEW_ID = null; renderPurchaseOrders(panel); });
  var recvBtn = document.getElementById('poReceiveGo');
  if (recvBtn) recvBtn.addEventListener('click', async function(){
    var items = [];
    panel.querySelectorAll('[data-recv]').forEach(function(inp){
      var qty = parseInt(inp.value, 10);
      if (qty > 0) {
        var lid = inp.getAttribute('data-recv');
        var priceEl = panel.querySelector('[data-price="' + lid + '"]');
        var binEl = panel.querySelector('[data-bin="' + lid + '"]');
        items.push({
          id: parseInt(lid, 10), qty_now: qty,
          price_now: priceEl && priceEl.value.trim() !== '' ? priceEl.value.trim() : null,
          bin_now: binEl && binEl.value.trim() !== '' ? binEl.value.trim() : null,
        });
      }
    });
    if (!items.length) { posToast('Enter a quantity to receive on at least one line.', true); return; }
    recvBtn.disabled = true;
    try { await api('/api/admin/purchase-orders/' + id + '/receive', { method:'POST', body: { items: items } }); posToast('Received'); renderPurchaseOrders(panel); }
    catch (e) { posToast('Receive failed: ' + e.message, true); recvBtn.disabled = false; }
  });
}
async function submitPoItem(id){

  msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';

    await api('/api/admin/purchase-orders/' + id + '/items', { method:'POST', body: {
      description: document.getElementById('poiDesc').value.trim(),
      sku: document.getElementById('poiSku').value.trim() || null,

}

// ============= WAREHOUSE (activity log / stock counts / bin check) =============
var WH_VIEW = 'activity';
var WH_COUNT_ID = null;
async function renderWarehouse(panel){
  var toolbar =
    '<div style="padding:12px 16px;background:var(--card-soft);border-bottom:1px solid var(--line);display:flex;gap:6px">' +
      ['activity','counts','bin'].map(function(v){
        var lbl = { activity:'📜 Activity', counts:'🔢 Stock Counts', bin:'📦 Bin Check' }[v];
        return '<button class="whTab" data-v="' + v + '" style="padding:7px 14px;background:' + (WH_VIEW===v?'var(--navy)':'var(--card)') + ';color:' + (WH_VIEW===v?'#fff':'var(--ink)') + ';border:1px solid var(--line);border-radius:7px;font-weight:700;cursor:pointer;font-size:12.5px">' + lbl + '</button>';
      }).join('') +
    '</div>';
  panel.innerHTML = toolbar + '<div id="whBody"><div class="empty">Loading…</div></div>';
  panel.querySelectorAll('.whTab').forEach(function(b){
    b.addEventListener('click', function(){ WH_VIEW = b.getAttribute('data-v'); WH_COUNT_ID = null; renderWarehouse(panel); });
  });
  var body = document.getElementById('whBody');
  if (WH_VIEW === 'activity') return renderWhActivity(body);
  if (WH_VIEW === 'bin') return renderWhBin(body);
  return WH_COUNT_ID ? renderWhCountDetail(body, WH_COUNT_ID, panel) : renderWhCounts(body, panel);
}

async function renderWhActivity(box){
  var r;
  try { r = await api('/api/admin/warehouse-activity?limit=150'); }
  catch (e) { box.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  if (!r.activity.length) { box.innerHTML = '<div class="empty">No warehouse activity recorded yet.</div>'; return; }
  box.innerHTML = '<table><thead><tr><th>When</th><th>Kind</th><th>Product</th><th>Qty</th><th>By</th><th>Notes</th></tr></thead><tbody>' +
    r.activity.map(function(a){
      return '<tr><td>' + fmtDate(a.created_at) + '</td>' +
        '<td>' + badge(a.kind, a.kind === 'count_post' ? 'pending' : (a.kind === 'adjust' ? 'ok' : 'new')) + '</td>' +
        '<td>' + esc(a.product_name || a.product_img || '—') + '</td>' +

async function renderWhCounts(box, panel){

    b.addEventListener('click', function(){ WH_COUNT_ID = b.getAttribute('data-open'); renderWarehouse(panel); });

async function renderWhCountDetail(box, id, panel){
  var d;
  try { d = await api('/api/admin/stock-counts/' + id); }
  catch (e) { box.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  var c = d.count;
  var open = c.status !== 'posted';
  box.innerHTML =
    '<div style="padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">' +
      '<button class="btn" id="whCountBack">‹ All counts</button>' +
      '<div>' + badge(c.status, c.status === 'posted' ? 'ok' : 'pending') + (c.total_variance != null ? ' <small>variance: ' + c.total_variance + '</small>' : '') + '</div>' +
    '</div>' +
    '<table><thead><tr><th>Product</th><th>Bin</th><th>System qty</th><th>Counted</th><th>Variance</th></tr></thead><tbody>' +
      d.items.map(function(it){
        var v = it.counted_qty != null ? it.counted_qty - it.system_qty : null;
        return '<tr><td><b>' + esc(it.product_name || it.product_img || '') + '</b><br/><small style="color:var(--muted)">' + esc(it.sku || '') + '</small></td>' +
          '<td>' + esc(it.bin_location || '—') + '</td>' +
          '<td>' + it.system_qty + '</td>' +
          '<td>' + (open ? '<input type="number" min="0" class="fld-mini" data-item="' + it.id + '" value="' + (it.counted_qty != null ? it.counted_qty : '') + '"/>' : (it.counted_qty != null ? it.counted_qty : '—')) + '</td>' +
          '<td>' + (v != null ? '<span style="color:' + (v<0?'#b91c1c':(v>0?'#15803d':'var(--muted)')) + '">' + (v>0?'+':'') + v + '</span>' : '—') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>' +
    (open ? '<div style="padding:12px 16px;display:flex;gap:8px"><button class="btn" id="whSaveCounts">Save counted quantities</button><button class="btn ok" id="whPostCount">Post count (apply to stock)</button></div>' : '');

  document.getElementById('whCountBack').addEventListener('click', function(){ WH_COUNT_ID = null; renderWarehouse(panel); });
  var saveBtn = document.getElementById('whSaveCounts');
  if (saveBtn) saveBtn.addEventListener('click', async function(){
    var inputs = box.querySelectorAll('[data-item]');
    saveBtn.disabled = true;
    try {
      for (var i = 0; i < inputs.length; i++) {
        var inp = inputs[i];
        if (inp.value === '') continue;
        await api('/api/admin/stock-count-items/' + inp.getAttribute('data-item'), { method:'PATCH', body: { counted_qty: inp.value } });
      }
      renderWarehouse(panel);
    } catch (e) { alert('Save failed: ' + e.message); saveBtn.disabled = false; }
  });
  var postBtn = document.getElementById('whPostCount');
  if (postBtn) postBtn.addEventListener('click', async function(){
    if (!confirm('Post this count? Product stock levels will be updated to match what was counted. This cannot be undone.')) return;
    postBtn.disabled = true;
    try { await api('/api/admin/stock-counts/' + id + '/post', { method:'POST' }); renderWarehouse(panel); }
    catch (e) { alert('Post failed: ' + e.message); postBtn.disabled = false; }
  });
}

        '</div>' : '') +
        '<div style="padding:14px 16px">' +
          '<h3 style="margin:0 0 8px;font-size:13px">🛠 Work order history</h3>' +
          (r.work_orders.length
            ? '<table><thead><tr><th>WO #</th><th>Date</th><th>Complaint</th><th>Mileage</th><th>Total</th><th>Status</th></tr></thead><tbody>' +
              r.work_orders.map(function(w){

                  '<td>' + esc(w.complaint || '') + '</td><td>' + (w.mileage_in || '—') + '</td><td>' + fmtMoney(w.total_usd) + '</td>' +
                  '<td>' + badge(w.status, w.status === 'paid' ? 'ok' : 'pending') + '</td></tr>';
              }).join('') + '</tbody></table>'
            : '<div class="empty">No work orders on record.</div>') +
          (r.inspections.length
            ? '<h3 style="margin:16px 0 8px;font-size:13px">🔍 Inspections</h3><table><thead><tr><th>Date</th><th>Kind</th><th>Mileage</th><th>Status</th></tr></thead><tbody>' +
              r.inspections.map(function(i){
                return '<tr><td>' + fmtDate(i.created_at) + '</td><td>' + esc(i.kind || '') + '</td><td>' + (i.mileage || '—') + '</td><td>' + badge(i.status, i.status==='completed'?'ok':'pending') + '</td></tr>';

      recipient_name: document.getElementById('dlName').value.trim(),
      recipient_phone: document.getElementById('dlPhone').value.trim() || null,
      address: document.getElementById('dlAddress').value.trim() || null,
      driver_id: document.getElementById('dlDriver').value || null,
      scheduled_for: document.getElementById('dlScheduled').value || null,

    show('deliveries');
  } catch (e) {
    msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;

}

var CUST_VIEW_ID = null;
var CUST_Q = '';
// Which slice of the customer file is on screen. Online customers signed
// themselves up on the storefront; counter customers were created for them at
// the till and often have neither a password nor an email they chose. Staff
// are excluded from both and live on the Staff screen -- shown here only if
// someone deliberately asks.
var CUST_ORIGIN = '';
var CUST_TYPE_FILTER = '';

async function renderCustomers(panel){
  if (CUST_VIEW_ID) return renderCustomerDetail(panel, CUST_VIEW_ID);
  var TABS = [
    ['',         'All customers'],
    ['online',   'Online sign-ups'],
    ['counter',  'Created at the counter'],
    ['staff',    'Staff'],
    ['archived', 'Archived'],
  ];
  panel.innerHTML =
    '<div style="padding:12px 16px 0;border-bottom:1px solid var(--line)">' +
      '<div id="custTabs" style="display:flex;gap:4px;flex-wrap:wrap">' +
        TABS.map(function(t){
          var on = CUST_ORIGIN === t[0];
          return '<button class="btn" data-origin="' + t[0] + '" style="border-radius:7px 7px 0 0;' +
            (on ? 'background:var(--red);color:#fff;border-color:var(--red)' : '') + '">' + t[1] +
            '<span class="custCount" data-for="' + t[0] + '" style="opacity:.7;margin-left:6px"></span></button>';
        }).join('') +
      '</div>' +
      '<div style="display:flex;gap:8px;padding:12px 0;flex-wrap:wrap">' +
        '<input id="custQ" class="fld" placeholder="Search name, email, phone, company, account #…" value="' + esc(CUST_Q) + '" style="max-width:340px"/>' +
        '<select id="custType" class="fld" style="max-width:160px"><option value="">All categories</option>' +
          CUST_TYPE_OPTS.map(function(t){ return '<option value="' + t + '"' + (t === CUST_TYPE_FILTER ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
        '</select>' +
        '<button class="btn" id="custGo">Search</button>' +
      '</div>' +
    '</div>' +
    // Staff creation used to live here as a collapsible. It has moved to its
    // own Staff screen -- a customer list is the wrong place to be minting
    // logins, and staff were invisible among thousands of customers. Adding a
    // *customer* belongs here, though: the till has been able to do it all
    // along and this screen could only edit people who already existed.
    '<details style="border-bottom:1px solid var(--line);background:var(--card-soft)">' +
      '<summary style="padding:12px 16px;cursor:pointer;font-weight:700;color:var(--heading)">+ New customer</summary>' +
      '<form style="padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:820px" onsubmit="event.preventDefault();submitNewCustomer();">' +
        '<div><label class="lbl">Name *</label><input id="ncName" required class="fld"/></div>' +
        '<div><label class="lbl">Phone</label><input id="ncPhone" class="fld"/></div>' +
        '<div><label class="lbl">Email <small style="color:var(--muted)">optional</small></label><input id="ncEmail" type="email" class="fld" placeholder="blank = counter customer"/></div>' +
        '<div><label class="lbl">Company</label><input id="ncCompany" class="fld"/></div>' +
        '<div><label class="lbl">Category</label><select id="ncType" class="fld"><option value="">—</option>' +
          CUST_TYPE_OPTS.map(function(t){ return '<option value="' + t + '">' + t + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="lbl">Price tier</label><select id="ncTier" class="fld">' +
          CUST_TYPE_OPTS.map(function(t){ return '<option value="' + t + '"' + (t === 'retail' ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="lbl">Credit type</label><select id="ncCreditType" class="fld"><option value="">—</option>' +
          CREDIT_TYPE_OPTS.map(function(o){ return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="lbl">Credit limit (USD)</label><input id="ncCredit" type="number" min="0" step="0.01" class="fld"/></div>' +
        '<div style="grid-column:1/-1"><label class="lbl">Notes</label><input id="ncNotes" class="fld"/></div>' +
        '<div id="ncMsg" style="grid-column:1/-1;display:none;padding:10px 12px;border-radius:6px;font-size:13px"></div>' +
        '<button type="submit" style="grid-column:1/-1;background:var(--red);color:#fff;border:0;padding:11px 22px;border-radius:7px;font-weight:700;cursor:pointer">Create customer</button>' +
      '</form>' +
    '</details>' +
    '<div id="custList"><div class="empty">Loading…</div></div>';

  async function load(){
    CUST_Q = document.getElementById('custQ').value.trim();
    CUST_TYPE_FILTER = document.getElementById('custType').value;
    var list = document.getElementById('custList');
    list.innerHTML = '<div class="empty">Loading…</div>';
    var qs = [];
    if (CUST_Q) qs.push('q=' + encodeURIComponent(CUST_Q));

    if (CUST_TYPE_FILTER) qs.push('customer_type=' + encodeURIComponent(CUST_TYPE_FILTER));
    var r;
    try { r = await api('/api/admin/users' + (qs.length ? '?' + qs.join('&') : '')); }
    catch (e) { list.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; return; }

    if (r.counts) {

    list.innerHTML = '<table><thead><tr><th>Name</th><th>Contact</th><th>Category</th><th>Account</th><th>Orders</th><th>Lifetime</th><th>Points</th><th>Since</th><th></th></tr></thead><tbody>' +
      r.users.map(function(u){
        // Where the record came from, said plainly -- a counter-created
        // customer with no password behaves differently from one who signed
        // up online, and that is invisible without saying so.
        var origin = u.is_staff || u.is_admin
          ? badge('staff', 'pending')
          : (u.via === 'pos' ? badge('counter', 'ok') : badge('online', 'info'));
        return '<tr><td><b>' + esc(u.name || '—') + '</b> ' + origin +
            (u.company_name ? '<br/><small style="color:var(--muted)">' + esc(u.company_name) + '</small>' : '') + '</td>' +
          '<td><small>' + esc(u.email) + '</small>' + (u.phone ? '<br/><small>' + esc(u.phone) + '</small>' : '') + '</td>' +
          '<td>' + (u.customer_type ? esc(u.customer_type) : '<small style="color:var(--muted)">—</small>') + '</td>' +
          '<td><small>' + esc(u.account_number || '—') + '</small>' +
            (u.credit_limit_usd != null ? '<br/><small style="color:var(--muted)">' + esc(u.credit_type || 'credit') + ' · ' + fmtMoney(u.credit_limit_usd) + '</small>' : '') + '</td>' +
          '<td>' + u.orders + '</td><td>' + fmtMoney(u.lifetime_usd) + '</td><td>' + u.points + '</td>' +
          '<td>' + fmtDate(u.created_at) + '</td>' +
          '<td class="actions"><button class="btn" data-open="' + u.id + '">Open</button>' +
            (u.is_staff || u.is_admin ? '' :
              (CUST_ORIGIN === 'archived'
                ? ' <button class="btn" data-restore="' + u.id + '">Restore</button>'
                : ' <button class="btn" data-del="' + u.id + '" data-name="' + esc(u.name || u.email) + '">Delete</button>')) +
          '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>';
    list.querySelectorAll('[data-open]').forEach(function(b){
      b.addEventListener('click', function(){ CUST_VIEW_ID = b.getAttribute('data-open'); renderCustomers(panel); });
    });
    // Delete tries a real delete first. The server refuses when there is sales
    // history behind the customer and says what it found; archiving is then
    // offered explicitly rather than happening silently under the word
    // "delete", because the two are not the same thing.
    list.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', async function(){
        var uid = this.getAttribute('data-del'), who = this.getAttribute('data-name');
        if (!confirm('Delete ' + who + '?')) return;
        try {
          await api('/api/admin/users/' + uid, { method: 'DELETE' });
          load();
        } catch (e) {
          if (/Archive instead/.test(e.message)) {
            if (confirm(e.message + '\n\nArchive them instead? They stay linked to their history but leave the customer list.')) {
              try { await api('/api/admin/users/' + uid + '?mode=archive', { method: 'DELETE' }); load(); }
              catch (e2) { alert(e2.message); }
            }
          } else alert(e.message);
        }
      });
    });
    list.querySelectorAll('[data-restore]').forEach(function(b){
      b.addEventListener('click', async function(){
        try { await api('/api/admin/users/' + this.getAttribute('data-restore'), { method: 'PATCH', body: { is_archived: false } }); load(); }
        catch (e) { alert(e.message); }
      });
    });
  }

  panel.querySelectorAll('[data-origin]').forEach(function(b){
    b.addEventListener('click', function(){
      CUST_ORIGIN = this.getAttribute('data-origin');
      renderCustomers(panel);
    });
  });
  document.getElementById('custGo').addEventListener('click', load);
  document.getElementById('custType').addEventListener('change', load);
  document.getElementById('custQ').addEventListener('keydown', function(e){ if (e.key === 'Enter') load(); });
  await load();
}

// =============================================================================
//  STAFF PIN AT THE TILL
//
//  One prompt, three jobs: signing in on a shared till, authorising an override
//  a cashier is not allowed to make on their own, and clocking in and out.
//  All three ask the same question -- "who is standing here?" -- so they share
//  one keypad and one endpoint.
//
//  A keypad rather than a text box on purpose: this is used on a touchscreen at
//  a counter, often one-handed, and the digits have to be hittable without a
//  keyboard. The typed value is masked because the person asking for an
//  override is standing next to the cashier whose limit they are lifting.
//
//  Never stores the PIN. The verified identity comes back from the server and
//  is used for that one action.
// =============================================================================
function posPinPrompt(opts){
  var o = opts || {};
  return new Promise(function(resolve){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,.72);z-index:9999;display:flex;align-items:center;justify-content:center';
    var digits = '';
    wrap.innerHTML =
      '<div style="background:var(--card);border-radius:14px;padding:22px;width:320px;box-shadow:0 24px 60px rgba(0,0,0,.45)">' +
        '<div style="font-weight:800;font-size:16px;color:var(--heading);margin-bottom:2px">' + esc(o.title || 'Enter your PIN') + '</div>' +
        '<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">' + esc(o.detail || '') + '</div>' +
        '<div id="pinDots" style="font-size:26px;letter-spacing:9px;height:34px;text-align:center;color:var(--heading);font-weight:700"></div>' +
        '<div id="pinErr" style="display:none;font-size:12.5px;color:var(--red);text-align:center;margin-bottom:6px"></div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px">' +
          ['1','2','3','4','5','6','7','8','9'].map(function(d){
            return '<button class="pinK" data-d="' + d + '" style="padding:14px 0;font-size:19px;font-weight:700;border:1px solid var(--line);background:var(--card-soft);border-radius:9px;cursor:pointer;color:var(--ink)">' + d + '</button>';
          }).join('') +
          '<button class="pinK" data-d="del" style="padding:14px 0;font-size:15px;border:1px solid var(--line);background:var(--card-soft);border-radius:9px;cursor:pointer;color:var(--ink)">⌫</button>' +
          '<button class="pinK" data-d="0" style="padding:14px 0;font-size:19px;font-weight:700;border:1px solid var(--line);background:var(--card-soft);border-radius:9px;cursor:pointer;color:var(--ink)">0</button>' +
          '<button class="pinK" data-d="ok" style="padding:14px 0;font-size:15px;font-weight:700;border:0;background:var(--red);color:#fff;border-radius:9px;cursor:pointer">OK</button>' +
        '</div>' +
        '<button id="pinCancel" style="width:100%;margin-top:10px;padding:9px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px">Cancel</button>' +
      '</div>';
    document.body.appendChild(wrap);

    var dots = wrap.querySelector('#pinDots');
    var err = wrap.querySelector('#pinErr');
    function paint(){ dots.textContent = digits.replace(/./g, '•'); }
    function close(v){ document.removeEventListener('keydown', onKey); wrap.remove(); resolve(v); }
    function fail(m){ err.textContent = m; err.style.display = 'block'; digits = ''; paint(); }

    async function submit(){
      if (!digits) return;
      err.style.display = 'none';
      try {
        // Two endpoints, same keypad. pin-verify identifies someone who is
        // already signed in (crediting a ticket, approving an override);
        // pin-signin IS the sign-in and is the only one reachable without a
        // session. Keeping one keypad means the counter learns one thing.
        var r = o.endpoint
          ? await api(o.endpoint, { method: 'POST', body: { pin: digits } })
          : await api('/api/admin/staff/pin-verify', { method: 'POST', body: { pin: digits, purpose: o.purpose || 'signin' } });
        close(r.user);
      } catch (e) { fail(e.message); }
    }
    function press(d){
      if (d === 'del') digits = digits.slice(0, -1);
      else if (d === 'ok') return submit();
      else if (digits.length < 8) digits += d;
      paint();
    }
    wrap.querySelectorAll('.pinK').forEach(function(b){
      b.addEventListener('click', function(){ press(this.getAttribute('data-d')); });
    });
    wrap.querySelector('#pinCancel').addEventListener('click', function(){ close(null); });
    // A physical keypad is still the fastest input for anyone who has one.
    function onKey(e){
      if (e.key >= '0' && e.key <= '9') press(e.key);
      else if (e.key === 'Backspace') press('del');
      else if (e.key === 'Enter') press('ok');
      else if (e.key === 'Escape') close(null);
      else return;
      e.preventDefault();
    }
    document.addEventListener('keydown', onKey);
    paint();
  });
}

// Captures whatever a restricted item demands before the sale can complete —
// an ID (type + number) and/or a Tax ID — same self-contained overlay style
// as posPinPrompt. Resolves { id_type, id_number, tax_id } or null on cancel.
function posVerificationPrompt(opts){
  var o = opts || {};
  return new Promise(function(resolve){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,.72);z-index:9999;display:flex;align-items:center;justify-content:center';
    wrap.innerHTML =
      '<div style="background:var(--card);border-radius:14px;padding:22px;width:360px;box-shadow:0 24px 60px rgba(0,0,0,.45)">' +
        '<div style="font-weight:800;font-size:16px;color:var(--heading);margin-bottom:2px">Verification required</div>' +
        '<div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">' + esc(o.detail || 'One or more items require this to be recorded before the sale can complete.') + '</div>' +
        (o.needId ?
          '<label class="lbl">ID type</label><select id="vfIdType" class="fld" style="margin-bottom:8px;width:100%">' +
            ['drivers_license', 'passport', 'national_id', 'other'].map(function(t){ return '<option value="' + t + '">' + t.replace(/_/g, ' ') + '</option>'; }).join('') +
          '</select>' +
          '<label class="lbl">ID number</label><input id="vfIdNumber" class="fld" style="margin-bottom:10px;width:100%"/>'
          : '') +
        (o.needTaxId ?
          '<label class="lbl">Tax ID</label><input id="vfTaxId" class="fld" value="' + esc(o.taxIdPrefill || '') + '" style="margin-bottom:10px;width:100%"/>'
          : '') +
        '<div id="vfErr" style="display:none;color:var(--red);font-size:12px;margin-bottom:8px"></div>' +
        '<div style="display:flex;gap:8px">' +
          '<button id="vfOk" class="btn ok" style="flex:1">Confirm</button>' +
          '<button id="vfCancel" class="btn" style="flex:1">Cancel</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    wrap.querySelector('#vfCancel').addEventListener('click', function(){ wrap.remove(); resolve(null); });
    wrap.querySelector('#vfOk').addEventListener('click', function(){
      var idType = o.needId ? document.getElementById('vfIdType').value : '';
      var idNumber = o.needId ? document.getElementById('vfIdNumber').value.trim() : '';
      var taxId = o.needTaxId ? document.getElementById('vfTaxId').value.trim() : '';
      var err = document.getElementById('vfErr');
      if (o.needId && !idNumber) { err.textContent = 'ID number is required.'; err.style.display = 'block'; return; }
      if (o.needTaxId && !taxId) { err.textContent = 'Tax ID is required.'; err.style.display = 'block'; return; }
      wrap.remove();
      resolve({ id_type: idType, id_number: idNumber, tax_id: taxId });
    });
  });
}

// One markup for both the add form and each row's inline editor, so the two
// cannot drift into offering different fields -- which is how the add form
// ended up writing three of the thirteen columns.
function addressForm(p, a){
  a = a || {};
  var v = function(k){ return esc(a[k] == null ? '' : a[k]); };
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">' +
    '<select id="ad' + p + 'Kind" class="fld">' +
      '<option value="shipping"' + (a.kind !== 'billing' ? ' selected' : '') + '>Shipping</option>' +
      '<option value="billing"' + (a.kind === 'billing' ? ' selected' : '') + '>Billing</option>' +
    '</select>' +
    '<input id="ad' + p + 'Label" class="fld" placeholder="Label (Home, Depot…)" value="' + v('label') + '"/>' +
    '<input id="ad' + p + 'Recipient" class="fld" placeholder="Recipient" value="' + v('recipient') + '"/>' +
    '<input id="ad' + p + 'Phone" class="fld" placeholder="Phone" value="' + v('phone') + '"/>' +
    '<input id="ad' + p + 'Line1" class="fld" placeholder="Line 1 *" style="grid-column:1/-1" value="' + v('line1') + '"/>' +
    '<input id="ad' + p + 'Line2" class="fld" placeholder="Line 2" style="grid-column:1/-1" value="' + v('line2') + '"/>' +
    '<input id="ad' + p + 'City" class="fld" placeholder="City" value="' + v('city') + '"/>' +
    '<input id="ad' + p + 'Parish" class="fld" placeholder="Parish" value="' + v('parish') + '"/>' +
    '<input id="ad' + p + 'Postal" class="fld" placeholder="Postal code" value="' + v('postal_code') + '"/>' +
    '<input id="ad' + p + 'Country" class="fld" placeholder="Country" value="' + v('country') + '"/>' +
    '<label style="grid-column:1/-1;display:inline-flex;align-items:center;gap:6px;font-size:12.5px">' +
      '<input type="checkbox" id="ad' + p + 'Default"' + (a.is_default ? ' checked' : '') + '/> Default for this kind</label>' +
  '</div>';
}
function addressBody(p){
  var g = function(k){ var el = document.getElementById('ad' + p + k); return el ? el.value.trim() : ''; };
  var ck = document.getElementById('ad' + p + 'Default');
  return {
    kind: g('Kind') || 'shipping', label: g('Label') || null, recipient: g('Recipient') || null,
    phone: g('Phone') || null, line1: g('Line1'), line2: g('Line2') || null,
    city: g('City') || null, parish: g('Parish') || null,
    postal_code: g('Postal') || null, country: g('Country') || null,
    is_default: ck ? ck.checked : false,
  };
}

//  STAFF & SALES REPS
//
//  One people file: a staff member is a user with is_staff set, and what they
//  do is one or more categories rather than a job column. This screen owns
//  their login, panel role, PIN, employee and national ID, and categories.
//
//  Split out of the Customers screen deliberately -- staff and customers are
//  different kinds of record and were previously managed on the same page.
// =============================================================================
var STAFF_CATS = [];

async function renderStaff(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r, cats, rolesRes, capsRes;
  try {
    r = await api('/api/admin/staff');
    cats = await api('/api/admin/user-categories');
    rolesRes = await api('/api/admin/roles');
    capsRes = await api('/api/admin/capabilities');
  } catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  STAFF_CATS = (cats.categories || []).filter(function(c){ return c.is_active && c.is_staff; });
  // Roles come from the table, so one the shop added itself is assignable.
  // The server still refuses anyone creating a role more senior than their own.
  var ROLES = rolesRes.roles || [];
  var CAPS = capsRes.capabilities || [];
  function roleIsFull(code){
    if (code === 'owner') return true;
    var rr = ROLES.find(function(x){ return x.code === code; });
    return !!(rr && rr.can_manage);
  }
  // Per-user function permission toggles for one staff row. can_manage roles
  // are always full access, so the block is shown read-only for them.
  // Categories carry their own function-permission denies; a staff member
  // inherits the union of their categories' denies, then their own record
  // can re-grant (Allow) or force-deny (Deny) on top.
  var CAT_BY_ID = {}; (cats.categories || []).forEach(function(c){ CAT_BY_ID[c.id] = c; });
  function catDeniesFor(s){
    var d = {};
    (s.categories || []).forEach(function(cc){
      var full = CAT_BY_ID[cc.id];
      var p = (full && full.perms && typeof full.perms === 'object') ? full.perms : {};
      Object.keys(p).forEach(function(k){ if (p[k] === false) d[k] = full.label; });
    });
    return d;
  }
  function permChecks(prefix, s){
    var full = roleIsFull(s.admin_role);
    var ov = (s.perms && typeof s.perms === 'object') ? s.perms : {};
    var catD = catDeniesFor(s);
    var groups = {};
    CAPS.forEach(function(c){ (groups[c.group] = groups[c.group] || []).push(c); });
    var body = Object.keys(groups).map(function(g){
      return '<div style="margin-bottom:8px"><div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;margin-bottom:4px">' + esc(g) + '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:6px 16px">' +
        groups[g].map(function(c){
          var cur = ov[c.key] === true ? 'allow' : ov[c.key] === false ? 'deny' : 'inherit';
          var catNote = catD[c.key] ? ' <small style="color:#b45309">— “' + esc(catD[c.key]) + '” blocks this</small>' : '';
          return '<label style="display:flex;align-items:center;gap:7px;font-size:12.5px' + (full ? ';opacity:.55' : '') + '">' +
            '<select class="' + prefix + 'Perm" data-cap="' + esc(c.key) + '"' + (full ? ' disabled' : '') + ' style="padding:3px 5px;border:1px solid var(--line);border-radius:5px;font-size:12px;background:var(--card);color:var(--ink)">' +
              '<option value="inherit"' + (cur === 'inherit' ? ' selected' : '') + '>Inherit</option>' +
              '<option value="allow"' + (cur === 'allow' ? ' selected' : '') + '>Allow</option>' +
              '<option value="deny"' + (cur === 'deny' ? ' selected' : '') + '>Deny</option>' +
            '</select><span>' + esc(c.label) + catNote + '</span>' +
          '</label>';
        }).join('') + '</div></div>';
    }).join('');
    return '<div style="grid-column:1/-1">' +
      '<label class="lbl">Function permissions' + (full ? ' <small style="color:var(--muted)">— this role counts as a manager, so it always has full access</small>' : ' <small style="color:var(--muted)">— Inherit = follow this person’s categories; Allow overrides a category block; Deny turns it off outright</small>') + '</label>' +
      '<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card)">' + body + '</div>' +
      (full ? '' : '<button class="btn" data-permsave="' + s.id + '" style="margin-top:8px">Save permissions</button> <span id="p' + s.id + 'Msg" style="font-size:12.5px;margin-left:8px"></span>') +
    '</div>';
  }
  function roleOptions(sel){
    return ROLES.map(function(x){
      return '<option value="' + esc(x.code) + '"' + (x.code === sel ? ' selected' : '') + '>' + esc(x.label) + '</option>';
    }).join('');
  }

  function catChecks(prefix, selected){
    var sel = selected || [];
    if (!STAFF_CATS.length) return '<small style="color:var(--muted)">No categories yet — add one under Staff Categories.</small>';
    return STAFF_CATS.map(function(c){
      var on = sel.indexOf(c.id) >= 0 ? ' checked' : '';
      return '<label style="display:inline-flex;align-items:center;gap:5px;margin:0 12px 6px 0;font-size:13px">' +
        '<input type="checkbox" class="' + prefix + 'Cat" value="' + c.id + '"' + on + '/>' + esc(c.label) +
        (c.department ? '<small style="color:var(--muted)"> · ' + esc(c.department) + '</small>' : '') +
      '</label>';
    }).join('');
  }

  // Manager-preset pinned screens for one staff member: a checkbox per sidebar
  // tab plus a Lock toggle. Saved to users.forced_favs / users.favs_locked.
  function favPresetChecks(prefix, selected, locked){
    var sel = selected || [];
    var body = SIDEBAR_GROUPS.map(function(g){
      return '<div style="margin-bottom:6px"><div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;margin-bottom:3px">' + esc(g.title) + '</div>' +
        g.items.map(function(it){
          return '<label style="display:inline-flex;align-items:center;gap:5px;margin:0 12px 4px 0;font-size:12.5px">' +
            '<input type="checkbox" class="' + prefix + 'Fav" value="' + esc(it.tab) + '"' + (sel.indexOf(it.tab) >= 0 ? ' checked' : '') + '/>' + esc(it.label) + '</label>';
        }).join('') + '</div>';
    }).join('');
    return '<div style="grid-column:1/-1">' +
      '<label class="lbl">Pinned screens (preset) <small style="color:var(--muted)">— what this person sees under ⭐ Favourites</small></label>' +
      '<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--card)">' + body +
        '<label style="display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;border-top:1px solid var(--line);padding-top:8px;margin-top:4px">' +
          '<input type="checkbox" class="' + prefix + 'FavLock"' + (locked ? ' checked' : '') + '/> 🔒 Lock — this person cannot pin or unpin screens themselves</label>' +
      '</div>' +
    '</div>';
  }

  panel.innerHTML =
    '<details style="border-bottom:1px solid var(--line);background:var(--card-soft)">' +
      '<summary style="padding:12px 16px;cursor:pointer;font-weight:700;color:var(--heading)">+ New staff member</summary>' +
      '<form id="newStaff" style="padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:820px" onsubmit="event.preventDefault();submitStaff();">' +
        '<div><label class="lbl">Name *</label><input id="sfName" required class="fld"/></div>' +
        '<div><label class="lbl">Email (login) *</label><input id="sfEmail" type="email" required class="fld"/></div>' +
        '<div><label class="lbl">Phone</label><input id="sfPhone" class="fld"/></div>' +
        '<div><label class="lbl">Temporary password *</label><input id="sfPass" required class="fld"/></div>' +
        '<div><label class="lbl">Employee no.</label><input id="sfEmpNo" class="fld" placeholder="EMP-001"/></div>' +
        '<div><label class="lbl">National ID (TRN)</label><input id="sfNid" class="fld"/></div>' +
        '<div><label class="lbl">Till PIN <small style="color:var(--muted)">4–8 digits, optional</small></label><input id="sfPin" class="fld" inputmode="numeric" maxlength="8"/></div>' +
        '<div><label class="lbl">Admin panel role</label><select id="sfRole" class="fld">' + roleOptions('cashier') + '</select></div>' +
        '<div style="grid-column:1/-1"><label class="lbl">Categories</label><div>' + catChecks('sfNew', []) + '</div></div>' +
        '<div style="grid-column:1/-1"><label style="display:inline-flex;align-items:center;gap:6px;font-size:13px">' +
          '<input type="checkbox" id="sfIsAdmin" checked/> Can sign in to the admin panel' +
          '<small style="color:var(--muted)">— uncheck for staff who only need a PIN at the till</small></label></div>' +
        '<div id="sfMsg" style="grid-column:1/-1;display:none;padding:10px 12px;border-radius:6px;font-size:13px"></div>' +
        '<button type="submit" style="grid-column:1/-1;background:var(--red);color:#fff;border:0;padding:11px 22px;border-radius:7px;font-weight:700;cursor:pointer">Create staff member</button>' +
      '</form>' +
    '</details>' +
    (r.staff.length
      ? '<table><thead><tr><th>Name</th><th>Contact</th><th>Employee no.</th><th>Categories</th><th>Panel role</th><th>PIN</th><th></th></tr></thead><tbody>' +
        r.staff.map(function(s){
          var cl = (s.categories || []).map(function(c){
            return '<span style="display:inline-block;background:var(--card-soft);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11.5px;margin:1px 3px 1px 0">' + esc(c.label) + '</span>';
          }).join('') || '<small style="color:var(--muted)">—</small>';
          var isSelf = String(s.id) === String(CURRENT_ADMIN_ID);
          return '<tr' + ((!s.is_staff || s.disabled) ? ' style="opacity:.55"' : '') + '>' +
            '<td><b>' + esc(s.name || '—') + '</b>' +
              (s.disabled ? ' ' + badge('disabled', 'bad') : '') +
              (s.national_id ? '<br/><small style="color:var(--muted)">TRN ' + esc(s.national_id) + '</small>' : '') + '</td>' +
            '<td><small>' + esc(s.email) + (s.phone ? '<br/>' + esc(s.phone) : '') + '</small></td>' +
            '<td>' + esc(s.employee_no || '—') + '</td>' +
            '<td>' + cl + '</td>' +
            '<td>' + (s.is_admin ? esc(s.admin_role) : '<small style="color:var(--muted)">no panel access</small>') + '</td>' +
            '<td>' + (s.has_pin ? badge('set', 'ok') : '<small style="color:var(--muted)">not set</small>') + '</td>' +
            '<td class="actions">' +
              '<button class="btn" data-edit="' + s.id + '">Edit</button> ' +
              '<button class="btn" data-pin="' + s.id + '" data-name="' + esc(s.name || s.email) + '" data-haspin="' + (s.has_pin ? 1 : 0) + '">PIN</button> ' +
              '<button class="btn" data-pw="' + s.id + '" data-name="' + esc(s.name || s.email) + '">Reset password</button>' +
              (isSelf ? ''
                : ' <button class="btn" data-disable="' + s.id + '" data-on="' + (s.disabled ? 1 : 0) + '" data-name="' + esc(s.name || s.email) + '"' +
                  (s.disabled ? ' style="background:var(--ok);color:#fff"' : ' style="background:#fee2e2;color:#b91c1c"') + '>' +
                  (s.disabled ? 'Enable' : 'Disable') + '</button>') +
            '</td></tr>' +
            '<tr id="sfRow' + s.id + '" style="display:none"><td colspan="7" style="background:var(--card-soft)">' +
              '<div style="padding:12px 4px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:820px">' +
                '<div><label class="lbl">Name</label><input class="fld" id="e' + s.id + 'Name" value="' + esc(s.name || '') + '"/></div>' +
                '<div><label class="lbl">Phone</label><input class="fld" id="e' + s.id + 'Phone" value="' + esc(s.phone || '') + '"/></div>' +
                '<div><label class="lbl">Employee no.</label><input class="fld" id="e' + s.id + 'Emp" value="' + esc(s.employee_no || '') + '"/></div>' +
                (r.national_id_visible
                  ? '<div><label class="lbl">National ID (TRN)</label><input class="fld" id="e' + s.id + 'Nid" value="' + esc(s.national_id || '') + '"/></div>'
                  : '<div><label class="lbl">National ID</label><input class="fld" disabled value="hidden for your role"/></div>') +
                '<div><label class="lbl">Admin panel role</label><select class="fld" id="e' + s.id + 'Role">' + roleOptions(s.admin_role) + '</select></div>' +
                '<div><label class="lbl">Status</label><select class="fld" id="e' + s.id + 'Active">' +
                  '<option value="true"' + (s.is_staff ? ' selected' : '') + '>active staff</option>' +
                  '<option value="false"' + (!s.is_staff ? ' selected' : '') + '>no longer staff</option>' +
                '</select></div>' +
                '<div style="grid-column:1/-1"><label class="lbl">Categories</label><div>' +
                  catChecks('e' + s.id, (s.categories || []).map(function(c){ return c.id; })) + '</div></div>' +
                permChecks('e' + s.id, s) +
                favPresetChecks('e' + s.id, Array.isArray(s.forced_favs) ? s.forced_favs : [], !!s.favs_locked) +
                '<div style="grid-column:1/-1"><button class="btn" data-save="' + s.id + '">Save changes</button> ' +
                  '<span id="e' + s.id + 'Msg" style="font-size:12.5px;margin-left:8px"></span></div>' +
              '</div></td></tr>';
        }).join('') + '</tbody></table>'
      : '<div class="empty">No staff yet. Add the first one above.</div>');

  panel.querySelectorAll('[data-edit]').forEach(function(b){
    b.addEventListener('click', function(){
      var row = document.getElementById('sfRow' + this.getAttribute('data-edit'));
      row.style.display = row.style.display === 'none' ? '' : 'none';
    });
  });
  panel.querySelectorAll('[data-permsave]').forEach(function(b){
    b.addEventListener('click', async function(){
      var id = this.getAttribute('data-permsave');
      var msg = document.getElementById('p' + id + 'Msg');
      var perms = {};
      panel.querySelectorAll('.e' + id + 'Perm').forEach(function(sel){
        if (sel.value === 'allow') perms[sel.getAttribute('data-cap')] = true;
        else if (sel.value === 'deny') perms[sel.getAttribute('data-cap')] = false;
        // 'inherit' -> leave the key out
      });
      msg.textContent = 'Saving…'; msg.style.color = 'var(--muted)';
      try {
        await api('/api/admin/users/' + id + '/perms', { method: 'PATCH', body: { perms: perms } });
        msg.textContent = 'Saved. They see the change on their next page load.'; msg.style.color = 'var(--ok, #15803d)';
      } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; }
    });
  });
  panel.querySelectorAll('[data-save]').forEach(function(b){
    b.addEventListener('click', async function(){
      var id = this.getAttribute('data-save');
      var msg = document.getElementById('e' + id + 'Msg');
      var nid = document.getElementById('e' + id + 'Nid');
      var body = {
        name: document.getElementById('e' + id + 'Name').value.trim(),
        phone: document.getElementById('e' + id + 'Phone').value.trim() || null,
        employee_no: document.getElementById('e' + id + 'Emp').value.trim() || null,
        admin_role: document.getElementById('e' + id + 'Role').value,
        is_staff: document.getElementById('e' + id + 'Active').value === 'true',
        categories: Array.prototype.map.call(panel.querySelectorAll('.e' + id + 'Cat:checked'), function(c){ return parseInt(c.value, 10); }),
        forced_favs: Array.prototype.map.call(panel.querySelectorAll('.e' + id + 'Fav:checked'), function(c){ return c.value; }),
        favs_locked: !!(document.querySelector('.e' + id + 'FavLock') && document.querySelector('.e' + id + 'FavLock').checked),
      };
      if (nid && !nid.disabled) body.national_id = nid.value.trim() || null;
      msg.textContent = 'Saving…'; msg.style.color = 'var(--muted)';
      try { await api('/api/admin/staff/' + id, { method: 'PATCH', body: body }); renderStaff(panel); }
      catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; }
    });
  });
  panel.querySelectorAll('[data-pin]').forEach(function(b){
    b.addEventListener('click', function(){
      staffPinModal(b.getAttribute('data-pin'), b.getAttribute('data-name'),
                    b.getAttribute('data-haspin') === '1', function(){ renderStaff(panel); });
    });
  });
  // Disable / re-enable an account. A disabled user cannot sign in by password
  // or PIN, and any open session is dropped on its next admin request.
  panel.querySelectorAll('[data-disable]').forEach(function(b){
    b.addEventListener('click', async function(){
      var id = this.getAttribute('data-disable');
      var on = this.getAttribute('data-on') === '1';   // currently disabled?
      var who = this.getAttribute('data-name');
      if (on) {
        if (!confirm('Re-enable ' + who + '? They will be able to sign in again.')) return;
      } else if (!confirm('Disable ' + who + '?\n\nThey will be signed out and cannot sign in — by password or PIN — until re-enabled. Their record, history and PIN are kept.')) {
        return;
      }
      this.disabled = true;
      try {
        await api('/api/admin/staff/' + id, { method: 'PATCH', body: { disabled: !on } });
        renderStaff(panel);
      } catch (e) { alert(e.message); this.disabled = false; }
    });
  });
  // Reset password: the everyday lockout, where the person is standing at the
  // counter. Not an emailed link -- half the roster has no working email.
  panel.querySelectorAll('[data-pw]').forEach(function(b){
    b.addEventListener('click', async function(){
      var id = this.getAttribute('data-pw');
      var who = this.getAttribute('data-name');
      var pw = prompt('New password for ' + who + ' (at least 6 characters).\n\n' +
                      'Tell it to them directly — they can change it from their account page.');
      if (pw === null) return;
      try {
        await api('/api/admin/staff/' + id + '/password', { method: 'POST', body: { password: pw } });
        alert('Password reset for ' + who + '.\n\nThey are signed out of nothing — the new password takes effect at their next sign-in.');
      } catch (e) { alert(e.message); }
    });
  });
}

// Till-PIN manager for one staff member: generate a fresh random PIN (shown
// once, to read out), type a specific one, or remove it. Replaces the old
// single prompt() that mixed "set" and "clear" into one blank-to-remove box.
function staffPinModal(id, name, hasPin, after){
  function body(state){
    return '<div style="font-size:13px">' +
      '<p style="margin:0 0 12px;color:var(--muted)">Keypad sign-in, time clock and override authorisation for <b style="color:var(--heading)">' + esc(name) + '</b>. ' +
        (hasPin ? 'A PIN is currently set.' : 'No PIN is set yet.') + '</p>' +
      (state && state.pin
        ? '<div style="text-align:center;padding:14px;border:2px dashed #15803d;border-radius:10px;margin-bottom:14px">' +
            '<div class="lbl" style="color:#15803d">New PIN — read it out to ' + esc(name) + '</div>' +
            '<div style="font-size:34px;font-weight:800;letter-spacing:6px;font-family:ui-monospace,monospace;color:var(--heading)">' + esc(state.pin) + '</div>' +
          '</div>'
        : '') +
      '<button type="button" class="btn ok" id="spGen" style="width:100%;padding:10px;margin-bottom:14px">🎲 Generate a new random PIN</button>' +
      '<div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:10px">' +
        '<div style="flex:1"><label class="lbl">Or set a specific PIN (4–8 digits)</label>' +
          '<input id="spPin" class="fld" inputmode="numeric" maxlength="8" placeholder="e.g. 4729"/></div>' +
        '<button type="button" class="btn" id="spSet">Set</button>' +
      '</div>' +
      (hasPin ? '<button type="button" class="btn" id="spClear" style="background:#fee2e2;color:#b91c1c">Remove PIN entirely</button>' : '') +
      '<div id="spMsg" style="font-size:12.5px;margin-top:10px"></div>' +
    '</div>';
  }
  function repaint(state){ document.getElementById('spBody').innerHTML = body(state); wire(); }
  function wire(){
    var msg = document.getElementById('spMsg');
    var fail = function(t){ msg.textContent = t; msg.style.color = 'var(--red)'; };
    document.getElementById('spGen').addEventListener('click', async function(){
      this.disabled = true; msg.textContent = 'Generating…'; msg.style.color = 'var(--muted)';
      try {
        var r = await api('/api/admin/staff/' + id + '/pin/reset', { method: 'POST' });
        hasPin = true; if (after) after();
        repaint({ pin: r.pin });
      } catch (e) { fail(e.message); this.disabled = false; }
    });
    document.getElementById('spSet').addEventListener('click', async function(){
      var v = (document.getElementById('spPin').value || '').trim();
      if (!v) return fail('Type a PIN first, or use Generate.');
      this.disabled = true; msg.textContent = 'Saving…'; msg.style.color = 'var(--muted)';
      try {
        await api('/api/admin/staff/' + id + '/pin', { method: 'POST', body: { pin: v } });
        hasPin = true; if (after) after();
        msg.textContent = '✓ PIN set to ' + v + '.'; msg.style.color = 'var(--ok, #15803d)';
        this.disabled = false;
      } catch (e) { fail(e.message); this.disabled = false; }
    });
    var clr = document.getElementById('spClear');
    if (clr) clr.addEventListener('click', async function(){
      if (!confirm('Remove ' + name + '’s PIN? They will not be able to sign in at the keypad.')) return;
      this.disabled = true;
      try {
        await api('/api/admin/staff/' + id + '/pin', { method: 'POST', body: { clear: true } });
        hasPin = false; if (after) after();
        repaint(null);
        document.getElementById('spMsg').textContent = '✓ PIN removed.';
        document.getElementById('spMsg').style.color = 'var(--ok, #15803d)';
      } catch (e) { fail(e.message); this.disabled = false; }
    });
  }
  posModal('🔑 PIN — ' + esc(name), '<div id="spBody">' + body(null) + '</div>', 460);
  wire();
}

// =============================================================================
//  MY PREFERENCES — everything saved against the signed-in person
//
//  These settings were always adjustable, but only from wherever they happened
//  to live: the theme from a button in the header, the POS layout from inside
//  the till screen, pinned screens from a star in the sidebar. Nowhere showed
//  what was saved against you, and nothing said the settings follow you between
//  machines rather than belonging to the browser.
// =============================================================================
async function renderMyPrefs(panel){
  var tabs = [];
  SIDEBAR_GROUPS.forEach(function(g){ g.items.forEach(function(i){ tabs.push(i); }); });
  var hidden = (MY_ROLE && Array.isArray(MY_ROLE.hidden_tabs)) ? MY_ROLE.hidden_tabs : [];
  // The landing-screen picker only offers screens that are actually in this
  // user's sidebar right now -- role-hidden tabs are left out.
  var landingTabs = [];
  SIDEBAR_GROUPS.forEach(function(g){
    g.items.forEach(function(i){ if (hidden.indexOf(i.tab) === -1) landingTabs.push(i); });
  });
  var visible = landingTabs;
  var favs = loadFavs();

  panel.innerHTML =
    '<div style="padding:16px;max-width:720px">' +
      '<p style="font-size:13px;color:var(--muted);margin:0 0 16px">' +
        'Saved against your account, not this computer — they follow you to any till you sign in at.</p>' +

      '<div class="panel" style="margin-bottom:14px"><div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">🎨 Appearance</div>' +
        '<div style="padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
          '<div><label class="lbl">Theme</label><select id="mpTheme" class="fld">' +
            '<option value="light"' + (POS_PREFS.theme !== 'dark' ? ' selected' : '') + '>Light</option>' +
            '<option value="dark"' + (POS_PREFS.theme === 'dark' ? ' selected' : '') + '>Dark</option>' +
          '</select></div>' +
          '<div><label class="lbl">Menu</label><select id="mpSidebar" class="fld">' +
            '<option value="0"' + (!POS_PREFS.sidebarCollapsed ? ' selected' : '') + '>Expanded</option>' +
            '<option value="1"' + (POS_PREFS.sidebarCollapsed ? ' selected' : '') + '>Collapsed</option>' +
          '</select></div>' +
          '<div style="grid-column:1/-1"><label class="lbl">Start on this screen when I sign in</label>' +
            '<select id="mpLanding" class="fld">' +
              '<option value="">POS Terminal (default)</option>' +
              visible.map(function(t){
                return '<option value="' + esc(t.tab) + '"' + (POS_PREFS.landingTab === t.tab ? ' selected' : '') + '>' + esc(t.label) + '</option>';
              }).join('') +
            '</select></div>' +
        '</div></div>' +

      '<div class="panel" style="margin-bottom:14px"><div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">💵 POS terminal</div>' +
        '<div style="padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
          '<div><label class="lbl">Product view</label><select id="mpView" class="fld">' +
            ['grid','list','compact'].map(function(v){
              return '<option value="' + v + '"' + (POS_PREFS.view === v ? ' selected' : '') + '>' + v + '</option>';
            }).join('') + '</select></div>' +
          '<div><label class="lbl">Text size</label><select id="mpFont" class="fld">' +
            ['sm','md','lg'].map(function(v){
              return '<option value="' + v + '"' + (POS_PREFS.fontSize === v ? ' selected' : '') + '>' + v + '</option>';
            }).join('') + '</select></div>' +
          '<div style="grid-column:1/-1"><label class="lbl">Columns in list view</label><div>' +
            ['bin','qty','price'].map(function(cName){
              return '<label style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:13px">' +
                '<input type="checkbox" class="mpCol" value="' + cName + '"' + (POS_PREFS.columns[cName] ? ' checked' : '') + '/>' + cName + '</label>';
            }).join('') + '</div></div>' +
          '<div style="grid-column:1/-1"><label style="display:inline-flex;align-items:center;gap:6px;font-size:13px">' +
            '<input type="checkbox" id="mpLegacy"' + (POS_PREFS.legacyKeys ? ' checked' : '') + '/> Legacy keyboard shortcuts</label></div>' +
        '</div></div>' +

      '<div class="panel" style="margin-bottom:14px"><div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">⭐ Pinned screens' + (favsAreLocked() ? ' 🔒' : '') + '</div>' +
        '<div style="padding:12px 14px">' +
          (favsAreLocked()
            ? '<small style="color:var(--muted)">Your pinned screens are set by your manager and can’t be changed here.</small>' +
              '<div style="margin-top:8px">' + (favs.length
                ? favs.map(function(t){ var it = tabs.find(function(x){ return x.tab === t; }); return '<span style="display:inline-block;background:var(--card-soft);border:1px solid var(--line);border-radius:10px;padding:2px 9px;font-size:12px;margin:0 6px 6px 0">' + esc(it ? it.label : t) + '</span>'; }).join('')
                : '<small style="color:var(--muted)">— none —</small>') + '</div>'
            : (favs.length
              ? favs.map(function(t){
                  var item = tabs.find(function(x){ return x.tab === t; });
                  return '<label style="display:inline-flex;align-items:center;gap:5px;margin:0 14px 6px 0;font-size:13px">' +
                    '<input type="checkbox" class="mpFav" value="' + esc(t) + '" checked/>' + esc(item ? item.label : t) + '</label>';
                }).join('')
              : '<small style="color:var(--muted)">Nothing pinned. Use the ☆ beside a menu item to pin it.</small>')) +
        '</div></div>' +

      '<button class="btn ok" id="mpSave" style="padding:10px 22px;font-weight:700">Save preferences</button> ' +
      '<button class="btn" id="mpReset">Reset to defaults</button>' +
      '<span id="mpMsg" style="font-size:12.5px;margin-left:10px"></span>' +
    '</div>';

  document.getElementById('mpSave').addEventListener('click', async function(){
    var msg = document.getElementById('mpMsg');
    POS_PREFS.theme = document.getElementById('mpTheme').value;
    POS_PREFS.sidebarCollapsed = document.getElementById('mpSidebar').value === '1';
    POS_PREFS.landingTab = document.getElementById('mpLanding').value || null;
    POS_PREFS.view = document.getElementById('mpView').value;
    POS_PREFS.fontSize = document.getElementById('mpFont').value;
    POS_PREFS.legacyKeys = document.getElementById('mpLegacy').checked;
    POS_PREFS.columns = { bin: false, qty: false, price: false };
    panel.querySelectorAll('.mpCol:checked').forEach(function(c){ POS_PREFS.columns[c.value] = true; });
    if (!favsAreLocked()) {
      POS_PREFS.favs = Array.prototype.map.call(panel.querySelectorAll('.mpFav:checked'), function(c){ return c.value; });
      try { localStorage.setItem(FAV_KEY, JSON.stringify(POS_PREFS.favs)); } catch (_) {}
    }
    posSavePrefs();
    msg.textContent = 'Saving…'; msg.style.color = 'var(--muted)';
    // Written now rather than left to the exit hook: someone who has just
    // pressed Save expects it to be saved, not to be saved when they close
    // the tab.
    await posFlushPrefs();
    applyUserPrefsToChrome();
    buildSidebar();
    msg.textContent = '✓ Saved to your account'; msg.style.color = 'var(--ok, #166534)';
  });

  document.getElementById('mpReset').addEventListener('click', async function(){
    if (!confirm('Reset your preferences to the defaults?')) return;
    POS_PREFS = { view:'grid', fontSize:'md', legacyKeys:false,
                  columns:{ bin:true, qty:true, price:true },
                  theme:'light', favs:[], sidebarCollapsed:false, landingTab:null };
    try { localStorage.setItem(FAV_KEY, '[]'); } catch (_) {}
    posSavePrefs();
    await posFlushPrefs();
    applyUserPrefsToChrome();
    buildSidebar();
    renderMyPrefs(panel);
  });
}

// =============================================================================
//  ROLES — who clears the "manager" bar, and what each role sees
//
//  These used to be three strings hardcoded in two places: a list inside
//  requireManager() and MANAGER_ONLY_TABS here. Now they are rows, so a shop
//  can add a supervisor who receives stock without also handing them pricing.
// =============================================================================
// QuickBooks-style: a clean roles table (Role / Access / Users) with a
// per-row inline editor. The editor groups every screen into collapsible
// permission categories with a "select all" per category and a running
// "N of M" count, a manager-access switch, and — for custom roles — editable
// name and seniority. Behaviour and the /api/admin/roles endpoints are
// unchanged; hidden_tabs is still the set of screens whose box is unticked.
var QBO_ROLES_CSS =
  '<style>' +

  '.qbo-btn:hover{background:var(--qb-green-d)}.qbo-btn:disabled{opacity:.5;cursor:default}' +

  '.qbo-new .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}' +
  '.qbo-table{width:100%;border-collapse:collapse}' +
  '.qbo-table thead th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 20px;border-bottom:2px solid var(--line);font-weight:700;background:var(--card)}' +
  '.qbo-table td{padding:15px 20px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}' +
  '.qbo-row{cursor:pointer}.qbo-row:hover td{background:var(--card-soft)}.qbo-row.open td{background:var(--card-soft2)}' +
  '.qbo-rolename{font-weight:700;color:var(--heading);font-size:14px}' +
  '.qbo-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);margin-top:2px}' +
  '.qbo-link{color:var(--qb-green);font-weight:700;cursor:pointer;background:none;border:0;font-family:inherit;font-size:13px;padding:0}' +
  '.qbo-link:hover{text-decoration:underline}' +
  '.qbo-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}' +
  '.qbo-pill.mgr{background:rgba(44,160,28,.13);color:var(--qb-green-d)}' +
  '.qbo-pill.ltd{background:var(--card-soft2);color:var(--muted)}' +
  '.qbo-pill.sys{background:var(--card-soft2);color:var(--muted);font-weight:600;margin-left:8px}' +
  '.qbo-editor{padding:18px 20px;background:var(--card)}' +

  '.qbo-switch{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card-soft);max-width:640px}' +
  '.qbo-switch input{width:16px;height:16px;margin-top:1px;flex:none}' +
