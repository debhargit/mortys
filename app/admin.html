  // ---------------------------------------------------------------------------
  //  Footer status bar
  // ---------------------------------------------------------------------------
  // The timer is parked on window, not in a local, for two reasons. renderPOS
  // re-runs on a font-size change, a legacy-keys toggle and a view switch, and
  // show() replaces panel.innerHTML wholesale when the operator leaves the tab
  // — neither tells anyone to stop a timer. Without a single well-known handle
  // to clear, every one of those would stack another interval writing to a
  // node that is no longer in the document, for the life of the page.
  // Sizes the results/cart shell from measured geometry so that bar + shell +
  // footer add up to exactly the viewport, leaving no page scroll and no
  // footer below the fold.
  //
  // The hardcoded calc(100vh - Npx) it replaces could never be right: N has to
  // cover the page header, the content padding and the ticket bar, and the
  // ticket bar's own height changes with the font-size setting, whether it
  // wraps to a second row, and whether the shift/terminal chips are showing.
  // The old value was ~85px short, which is why the bottom of the shell -- and
  // then the footer sitting under it -- fell off the end of the page.
  function posSizeShell(){
    var shell = document.getElementById('posShell');
    var footer = document.getElementById('posFooter');
    if (!shell || !footer || !document.body.contains(shell)) return;
    var top = shell.getBoundingClientRect().top + window.scrollY;
    // Whatever the content area reserves below the panel; read rather than
    // assumed, since it differs between the normal and full-screen layouts.
    var area = shell.closest('.content-area');
    var padBottom = area ? parseFloat(getComputedStyle(area).paddingBottom) || 0 : 0;
    var avail = window.innerHeight - top - footer.offsetHeight - padBottom;
    shell.style.height = Math.max(300, Math.round(avail)) + 'px';
  }
  // Re-measure on anything that moves the shell: window resize, entering or
  // leaving full screen, and the ticket bar reflowing.
  if (window.__posSizeHandler) window.removeEventListener('resize', window.__posSizeHandler);
  window.__posSizeHandler = posSizeShell;
  window.addEventListener('resize', posSizeShell);
  // rAF so the first measurement happens after this innerHTML has been laid out.
  requestAnimationFrame(function(){ posSizeShell(); requestAnimationFrame(posSizeShell); });

  function posFootTick(){
    var el = document.getElementById('posFootClock');
    // Not just "is it null" — after a tab switch the old node still exists in
    // the detached tree this closure captured, so check it is still attached.
    if (!el || !document.body.contains(el)){
      if (window.__posClockTimer){ clearInterval(window.__posClockTimer); window.__posClockTimer = null; }
      return;
    }
    var now = new Date();
    el.textContent =
      now.toLocaleDateString('en-US', { weekday:'short', day:'2-digit', month:'short', year:'numeric' }) +
      '  ·  ' +
      now.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true });
  }
  if (window.__posClockTimer) clearInterval(window.__posClockTimer);
  posFootTick();                                    // paint immediately, don't wait 1s for the first tick
  window.__posClockTimer = setInterval(posFootTick, 1000);

  // POS_SHOP is filled in place by loadShopSettingsIntoPosShop() once
  // GET /api/admin/settings resolves, which may land after this render. Re-read
  // it shortly after so the footer ends up showing the configured company name
  // rather than the hardcoded fallback it was built with.
  setTimeout(function(){
    var el = document.getElementById('posFootShop');
    if (el && document.body.contains(el)) el.textContent = POS_SHOP.name || 'Morty\'s Auto Parts';
  }, 1500);

  // Its own function because loadGrid() has four exits — searching, failed,
  // no matches, matches — and the footer has to agree with the status line at
  // every one of them.
  function posFootCount(text){
    var el = document.getElementById('posFootCount');
    if (el) el.textContent = text;
  }

  // ---------------------------------------------------------------------------
  //  Results list — server-side search + real pagination, three view densities
  // ---------------------------------------------------------------------------
  // Seeded parts are keyed by part number and have no photo asset, so the old
  // `<img src=partNumber>` was a broken image on every card. Show the part
  // number itself where a photo would be, and only load a real image when the
  // img field actually looks like one.
  function posThumb(p, sizePx){
    var s = sizePx || 100;
    if (/\.(jpe?g|png|webp|gif|svg)$/i.test(p.img || '') || String(p.img || '').indexOf('/uploads/') === 0){
      return '<img src="' + encodeURI(p.img) + '" style="width:100%;height:' + s + 'px;object-fit:cover;border-radius:6px;background:var(--card-soft2)" onerror="this.style.opacity=0.3"/>';
    }
    return '<div style="height:' + s + 'px;border-radius:6px;background:var(--card-soft2);display:flex;align-items:center;justify-content:center;padding:4px;text-align:center">' +
      '<code style="font-size:' + posFS(11) + ';color:#374151;font-weight:700;word-break:break-all">' + esc(p.img) + '</code></div>';
  }
  // Part No. is sku, falling back to barcode -- same convention used
  // everywhere else in this file (POS Sales detail, PO receiving, etc.).
  function posPartNo(p){ return p.sku || p.barcode || p.img || '—'; }
  // Width of the Part No. column, in px, for the current text-size setting.
  //
  // The font here always scaled; the width did not. At 96px fixed, picking
  // "Large" made the number bigger inside a box that stayed the same size, so
  // MORE of it was cut off, not less. Deriving the width from the same scale is
  // what makes the setting actually work on this column.
  //
  // 18 monospace characters at 0.62em advance (Consolas/Menlo) covers the 95th
  // percentile of this catalogue. The long tail -- "52400-S9A-A01-K/S-ADJUSTABLE"
  // is 28 -- wraps onto a second line instead of being truncated, exactly as
  // the Description column beside it already does.
  // Part No. renders at the SAME size as the Description beside it -- the
  // number is what a cashier reads off the shelf and matches against the bin,
  // so it should not be the smallest text on the row.
  //
  // Defined once and used by both the width calculation and the cell itself.
  // When those two disagree the column truncates, which is precisely the bug
  // this column had when the font scaled and the width did not.
  function posPartNoFS(compact){ return posFS(compact ? 12 : 13); }
  function posPartNoWidth(compact){
    return Math.round(parseFloat(posPartNoFS(compact)) * 0.62 * 18);
  }
  function posStockColor(level){ return level === 'out' ? '#b91c1c' : (level === 'low' ? '#b45309' : '#15803d'); }
  function posPriceHtml(p, fs){
    var usd = p.price_usd != null ? Number(p.price_usd) : null;
    // Most of the seeded catalogue has no price yet. Say so plainly rather
    // than printing "$0.00", which reads as free.
    return usd
      ? '<b style="color:var(--red);font-size:' + fs + '">' + fmtMoney(usd) + '</b>'
      : '<b style="color:var(--heading);font-size:' + posFS(10.5) + ';background:#e0e7ff;padding:2px 6px;border-radius:4px;white-space:nowrap">NO PRICE</b>';
  }

  var posCountMode = 'exact'; // 'exact' | 'capped' (show N+) | 'estimate' (show about N)
  var posSeq = 0;      // guards against a slow response overwriting a newer one
  var posPage = 1;      // 1-based -- real pagination, not "load more"
  var posTotal = 0;

  function posQueryString(offset, limit){
    var q = (document.getElementById('posSearch').value || '').trim();
    var cat = document.getElementById('posCat').value;
    var cond = document.getElementById('posCondition').value;
    var stock = document.getElementById('posStock').value;
    var sort = document.getElementById('posSort').value;
    var veh = document.getElementById('posVehFilter').value;
    var pMin = document.getElementById('posPriceMin').value;
    var pMax = document.getElementById('posPriceMax').value;
    var qs = 'limit=' + limit + '&offset=' + offset;
    if (q) qs += '&q=' + encodeURIComponent(q);
    if (cat) qs += '&category=' + encodeURIComponent(cat);
    if (cond) qs += '&condition=' + encodeURIComponent(cond);
    if (stock) qs += '&stock_status=' + encodeURIComponent(stock);
    if (veh) qs += '&make_model=' + encodeURIComponent(veh);
    if (pMin) qs += '&price_min=' + encodeURIComponent(pMin);
    if (pMax) qs += '&price_max=' + encodeURIComponent(pMax);
    if (sort && sort !== 'name') qs += '&sort=' + encodeURIComponent(sort);
    return qs;
  }

  function posUpdateSelBar(){
    var count = document.getElementById('posSelCount');
    var addBtn = document.getElementById('posSelAddCart');
    var clearBtn = document.getElementById('posSelClear');
    var allCk = document.getElementById('posSelAllCk');
    if (!count) return;
    var n = Object.keys(POS_LIST_SEL).length;
    var shown = (document.getElementById('posResults') && document.getElementById('posResults').__posProducts) || [];
    count.style.display = n ? '' : 'none';
    addBtn.style.display = n ? '' : 'none';
    clearBtn.style.display = n ? '' : 'none';
    count.textContent = n + ' selected';
    if (allCk) {
      allCk.checked = shown.length > 0 && shown.every(function(p){ return !!POS_LIST_SEL[p.img]; });
      allCk.indeterminate = n > 0 && !allCk.checked;
    }
  }

  async function loadGrid(page){
    var results = document.getElementById('posResults');
    var status = document.getElementById('posStatus');
    var paging = document.getElementById('posPaging');
    posPage = Math.max(1, page || 1);
    var pageSize = posPageSize();
    var offset = (posPage - 1) * pageSize;

    // A new search/filter/page invalidates any checkboxes ticked on the
    // previous screen -- they'd otherwise point at products no longer shown.
    POS_LIST_SEL = {};
    posUpdateSelBar();

    var seq = ++posSeq;
    status.textContent = 'Searching…';
    posFootCount('Searching…');

    var resp;
    try {
      resp = await api('/api/products?' + posQueryString(offset, pageSize));
    } catch (e) {
      if (seq !== posSeq) return;
      status.textContent = 'Search failed: ' + (e.message || 'unknown error');
      posFootCount('Search failed');
      return;
    }
    if (seq !== posSeq) return;   // a newer keystroke/filter change already won

    r.products = resp.products || [];
    posTotal = resp.total || 0;
    // The server stops counting past a cap so a one-letter search cannot cost
    // a full table scan; when it does, say "5,000+" rather than print a number
    // that is quietly wrong.
    posCountMode = resp.count_mode || (resp.approximate ? 'capped' : 'exact');

    if (!r.products.length){
      results.innerHTML = '<div class="empty" style="padding:30px;text-align:center;color:var(--muted)">No matches. Try clearing a filter or widening the search.</div>';
      results.__posProducts = []; POS_SEL_INDEX = -1;
      status.textContent = '';
      // The status line goes blank here (the empty-state card already says
      // "no matches"), but the footer is a fixed strip -- leaving it on the
      // previous search's count would be a lie, so it states the zero.
      posFootCount('0 items');
      paging.innerHTML = '';
      return;
    }

    results.innerHTML = posPrefs_render(r.products);
    // Legacy keyboard mode's arrow-key navigation lives in a keydown listener
    // that's only ever attached once (see window.__posKeys below) and so
    // can't close over this render's local `r` -- stash the current list on
    // the DOM node itself so that listener always reads what's actually on
    // screen, no matter which render attached it.
    results.__posProducts = r.products;
    POS_SEL_INDEX = -1;
    var shown = Math.min(pageSize, r.products.length);
    var from = offset + 1, to = offset + shown;
    var totalTxt = posCountMode === 'capped'   ? posTotal.toLocaleString('en-US') + '+'
                 : posCountMode === 'estimate' ? 'about ' + posTotal.toLocaleString('en-US')
                 : posTotal.toLocaleString('en-US');
    status.textContent = totalTxt + ' part' + (posTotal === 1 ? '' : 's') + ' match' + (posTotal === 1 ? 'es' : '') +
      (posTotal > shown ? ' — showing ' + from.toLocaleString('en-US') + '–' + to.toLocaleString('en-US') : '');
    // posTotal is the whole result set, not this page -- so on a paginated
    // search the footer names both, otherwise "60 items" next to page 3 of 40
    // reads as if the search only found 60.
    posFootCount(totalTxt + ' item' + (posTotal === 1 ? '' : 's') +
      (posTotal > shown ? ' · showing ' + from.toLocaleString('en-US') + '–' + to.toLocaleString('en-US') : ''));

    paging.innerHTML = posRenderPaging(pageSize);
    var pv = document.getElementById('posPrevBtn'); if (pv) pv.addEventListener('click', function(){ if (posPage > 1) loadGrid(posPage - 1); });
    var nx = document.getElementById('posNextBtn'); if (nx) nx.addEventListener('click', function(){ loadGrid(posPage + 1); });
    var jp = document.getElementById('posPageGo'); var ji = document.getElementById('posPageInput');
    if (jp && ji) jp.addEventListener('click', function(){ var n = parseInt(ji.value, 10); if (n > 0) loadGrid(n); });
    if (ji) ji.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); var n = parseInt(ji.value, 10); if (n > 0) loadGrid(n); } });

    results.querySelectorAll('[data-img]').forEach(function(row){
      row.addEventListener('click', function(e){
        if (e.target && e.target.classList && (e.target.classList.contains('posSelCk') || e.target.classList.contains('posAddBtn'))) return;
        var p = r.products.find(function(x){ return x.img === row.getAttribute('data-img'); });
        if (!p) return;
        posAddToCart(p, 1);
        drawCart();
      });
    });
    // Explicit "+" on every result row/card -- same add-to-cart as clicking the
    // row, but visible so it's obvious the list feeds the cart. stopPropagation
    // keeps the row's own click handler from firing a second add.
    results.querySelectorAll('.posAddBtn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var p = r.products.find(function(x){ return x.img === btn.getAttribute('data-img'); });
        if (!p) return;
        posAddToCart(p, 1);
        drawCart();
      });
    });
    results.querySelectorAll('.posSelCk').forEach(function(ck){
      ck.addEventListener('click', function(e){ e.stopPropagation(); });
      ck.addEventListener('change', function(){
        var img = ck.getAttribute('data-img');
        var p = r.products.find(function(x){ return x.img === img; });
        if (!p) return;
        if (ck.checked) POS_LIST_SEL[img] = p; else delete POS_LIST_SEL[img];
        posUpdateSelBar();
      });
    });
    // Master checkbox, List/Compact header only (posRenderRows) -- rewired
    // every render since the header row itself is regenerated each time.
    var allCk = document.getElementById('posSelAllCk');
    if (allCk) allCk.addEventListener('change', function(){
      if (this.checked) r.products.forEach(function(p){ POS_LIST_SEL[p.img] = p; });
      else POS_LIST_SEL = {};
      results.querySelectorAll('.posSelCk').forEach(function(ck){ ck.checked = !!POS_LIST_SEL[ck.getAttribute('data-img')]; });
      posUpdateSelBar();
    });
  }

  // ---- view renderers ----------------------------------------------------
  function posPrefs_render(products){
    if (POS_PREFS.view === 'list') return posRenderRows(products, false);
    if (POS_PREFS.view === 'compact') return posRenderRows(products, true);
    return posRenderGrid(products);
  }
  function posRenderGrid(products){
    return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(' + Math.round(170 * (POS_FONT_SCALES[POS_PREFS.fontSize]||1)) + 'px,1fr));gap:10px">' +
      products.map(function(p){
        var loc = p.location
          ? '<small style="display:block;color:#0891b2;font-weight:600;font-size:' + posFS(11) + '">📍 ' + esc(p.location) + (p.bin_location ? ' · ' + esc(p.bin_location) : '') + '</small>'
          : (p.bin_location ? '<small style="display:block;color:var(--muted);font-size:' + posFS(11) + '">🗂 ' + esc(p.bin_location) + '</small>' : '');
        var stock = p.stock_count || 0;
        return '<div data-img="' + esc(p.img) + '" class="posCard" style="position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px">' +
          '<input type="checkbox" class="posSelCk" data-img="' + esc(p.img) + '" title="Select for bulk add"' + (POS_LIST_SEL[p.img] ? ' checked' : '') + ' style="position:absolute;top:6px;left:6px;width:17px;height:17px;z-index:2;cursor:pointer"/>' +
          '<button type="button" class="posAddBtn" data-img="' + esc(p.img) + '" title="Add to cart" aria-label="Add to cart" style="position:absolute;top:6px;right:6px;z-index:2;width:24px;height:24px;padding:0;border:0;border-radius:6px;background:var(--red);color:#fff;font-size:17px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center">+</button>' +
          posThumb(p, Math.round(100 * (POS_FONT_SCALES[POS_PREFS.fontSize]||1))) +
          '<div style="font-size:' + posFS(12) + ';font-weight:700;line-height:1.25">' + esc(p.name) + '</div>' +
          // Part No. at the same size as the product name above it, matching what
          // the List view now does. It used to share one muted <small> with the
          // vehicle fitment, which made the number -- the thing actually matched
          // against the shelf -- the smallest text on the card. Split apart so the
          // fitment can stay secondary while the number does not.
          //
          // <code> and #374151 mirror the List view, so a part number looks the
          // same wherever it appears. break-all because a card is ~195px wide and
          // the longest numbers here run to 28 characters -- they wrap rather than
          // spill out of the card.
          '<code style="display:block;font-size:' + posFS(12) + ';font-weight:700;color:#374151;word-break:break-all;line-height:1.3">' + esc(posPartNo(p)) + '</code>' +
          (p.make_model ? '<small style="color:var(--muted);font-weight:700;font-size:' + posFS(11) + '">' + esc(p.make_model) + '</small>' : '') +
          loc +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px">' +
            posPriceHtml(p, posFS(13)) +
            '<small style="color:' + posStockColor(p.stock_level) + ';font-weight:700;font-size:' + posFS(11) + ';white-space:nowrap">' + stock + ' in stock</small>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }
  // Shared by List and Compact -- same columns (Part No / Description /
  // Vehicle-Fitment / Bin / Qty / Price), Compact just tightens padding+font
  // and drops the thumbnail so more rows fit on screen for scanning a large
  // catalogue fast. Every column past Description is toggleable (🧩 Columns).
  function posRenderRows(products, compact){
    var pad = compact ? '5px 8px' : '9px 10px';
    var thumbSize = compact ? 0 : 34;
    var cols = POS_PREFS.columns;
    // No overflow:hidden on this wrapper (only had it for rounded corners) --
    // it sits between the header row and #posResultsScroll, the actual
    // scrolling container, and overflow:hidden on an element in between
    // clips a position:sticky descendant at *its* edge instead of letting it
    // stick through the real scroll container. The header gets its own
    // top corner radius instead so the rounded-corner look survives losing
    // the parent's clip.
    return '<div style="border:1px solid var(--line);border-radius:8px;background:var(--card)">' +
      '<div style="display:flex;gap:8px;padding:' + pad + ';background:var(--card-soft2);font-size:' + posFS(10.5) + ';font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:8;box-shadow:0 3px 8px rgba(0,0,0,.14);border-radius:7px 7px 0 0;align-items:center">' +
        '<span style="width:17px;flex-shrink:0"><input type="checkbox" id="posSelAllCk" title="Select every item currently loaded on this page" style="width:15px;height:15px;cursor:pointer;vertical-align:middle"/></span>' +
        (thumbSize ? '<span style="width:' + thumbSize + 'px;flex-shrink:0"></span>' : '') +
        '<span style="width:' + posPartNoWidth(compact) + 'px;flex-shrink:0">Part No.</span>' +
        (cols.fit
          ? '<span style="width:' + (compact ? 240 : 320) + 'px;flex-shrink:0">Description</span>' +
            '<span style="flex:1;min-width:0">Vehicle / Fitment</span>'
          : '<span style="flex:1;min-width:0">Description</span>') +
        (cols.bin ? '<span style="width:90px;flex-shrink:0">Bin</span>' : '') +
        (cols.qty ? '<span style="width:64px;flex-shrink:0;text-align:center">Qty</span>' : '') +
        (cols.price ? '<span style="width:80px;flex-shrink:0;text-align:right">Price</span>' : '') +
        '<span style="width:30px;flex-shrink:0"></span>' +
      '</div>' +
      products.map(function(p){
        var stock = p.stock_count || 0;
        var bin = p.bin_location || p.location || '—';
        return '<div data-img="' + esc(p.img) + '" style="display:flex;gap:8px;align-items:flex-start;padding:' + pad + ';border-bottom:1px solid var(--hover);cursor:pointer" class="posRow">' +
          '<input type="checkbox" class="posSelCk" data-img="' + esc(p.img) + '" title="Select for bulk add"' + (POS_LIST_SEL[p.img] ? ' checked' : '') + ' style="width:15px;height:15px;flex-shrink:0;margin-top:2px;cursor:pointer"/>' +
          (thumbSize ? '<span style="width:' + thumbSize + 'px;flex-shrink:0">' + posThumb(p, thumbSize) + '</span>' : '') +
          '<code title="' + esc(posPartNo(p)) + '" style="width:' + posPartNoWidth(compact) + 'px;flex-shrink:0;font-size:' + posPartNoFS(compact) + ';font-weight:700;color:#374151;word-break:break-all;line-height:1.3">' + esc(posPartNo(p)) + '</code>' +
          // Description wraps instead of truncating with an ellipsis -- a
          // one-line-only part name was clipping mid-word on anything long
          // (fitment strings especially). Row's own align-items:flex-start
          // (above) is what keeps the other columns pinned to the top of a
          // now-variable-height row instead of vertically centering oddly.
          '<span style="' + (cols.fit ? 'width:' + (compact ? 240 : 320) + 'px;flex-shrink:0;' : 'flex:1;min-width:0;') + 'font-size:' + posFS(compact?12:13) + ';font-weight:600;word-break:break-word" title="' + esc(p.name) + (p.make_model ? ' — ' + esc(p.make_model) : '') + '">' +
            esc(p.name) + (!cols.fit && p.make_model ? ' <span style="font-weight:700;color:var(--muted)">— ' + esc(p.make_model) + '</span>' : '') +
          '</span>' +
          (cols.fit ? '<span style="flex:1;min-width:0;font-size:' + posFS(compact?11:12) + ';font-weight:700;color:var(--muted);word-break:break-word;line-height:1.3" title="' + esc(p.make_model || '') + '">' + (p.make_model ? esc(p.make_model) : '—') + '</span>' : '') +
          (cols.bin ? '<span style="width:90px;flex-shrink:0;font-size:' + posFS(compact?11:12) + ';color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(bin) + '</span>' : '') +
          (cols.qty ? '<span style="width:64px;flex-shrink:0;text-align:center;font-size:' + posFS(compact?11:12) + ';font-weight:700;color:' + posStockColor(p.stock_level) + '">' + stock + '</span>' : '') +
          (cols.price ? '<span style="width:80px;flex-shrink:0;text-align:right">' + posPriceHtml(p, posFS(compact?12:13)) + '</span>' : '') +
          '<button type="button" class="posAddBtn" data-img="' + esc(p.img) + '" title="Add to cart" aria-label="Add to cart" style="width:26px;height:26px;flex-shrink:0;margin-top:-1px;padding:0;border:0;border-radius:6px;background:var(--red);color:#fff;font-size:17px;font-weight:800;line-height:1;cursor:pointer">+</button>' +
        '</div>';
      }).join('') +
    '</div>' +
    '<style>.posRow:hover{background:var(--card-soft)}</style>';
  }

  function posRenderPaging(pageSize){
    var totalPages = Math.max(1, Math.ceil(posTotal / pageSize));
    if (totalPages <= 1) return '';
    return '<div style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:12.5px">' +
      '<button type="button" id="posPrevBtn" class="btn"' + (posPage <= 1 ? ' disabled style="opacity:.4;cursor:not-allowed"' : '') + '>‹ Prev</button>' +
      '<span style="color:var(--muted)">Page</span>' +
      '<input id="posPageInput" type="number" min="1" max="' + totalPages + '" value="' + posPage + '" style="width:56px;padding:6px;border:1px solid var(--line);border-radius:5px;text-align:center"/>' +
      '<span style="color:var(--muted)">of ' + totalPages.toLocaleString('en-US') + '</span>' +
      '<button type="button" id="posPageGo" class="btn">Go</button>' +
      '<button type="button" id="posNextBtn" class="btn"' + (posPage >= totalPages ? ' disabled style="opacity:.4;cursor:not-allowed"' : '') + '>Next ›</button>' +
    '</div>';
  }

  var posDebounce = null;
  function drawGrid(){
    clearTimeout(posDebounce);
    posDebounce = setTimeout(function(){ loadGrid(1); }, 220);
  }

  // ---------------------------------------------------------------------------
  //  Cart
  // ---------------------------------------------------------------------------
  // Full-screen cart: a proper columned table, because at full width the
  // narrow sidebar layout (name stacked over code, then a row of little
  // inputs) wastes the space and gives the operator nothing to scan down.
  //
  // Columns: SKU, DESCRIPTION, VEHICLE / FITMENT, QTY, UNIT, DISC, EXTENDED.
  // The per-line discount has its own column between UNIT and EXTENDED. Rows
  // are single line and tight -- the discount-reason input only appears on a
  // line that actually has a discount, so a plain cart stays scannable.
  //
  // Every input keeps the class and data- attribute the narrow layout used
  // (posQty/data-idx, posPrice/data-pidx, posDisc/data-didx,
  // posDiscNote/data-nidx, data-rm) so the handlers wired after drawCart()
  // bind to these rows unchanged.
  function drawCartFullTable(items){
    var psuW = posPartNoWidth(false);
    var hFS = posFS(10.5), cFS = posFS(12);
    var head =
      '<div style="display:flex;gap:9px;align-items:center;padding:6px 10px;background:var(--card-soft2);' +
        'border:1px solid var(--line);border-radius:7px 7px 0 0;position:sticky;top:0;z-index:3;' +
        'font-size:' + hFS + ';font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)">' +
        '<span style="width:' + psuW + 'px;flex-shrink:0">SKU</span>' +
        '<span style="width:300px;flex-shrink:0">DESCRIPTION</span>' +
        '<span style="flex:1;min-width:0">VEHICLE / FITMENT</span>' +
        '<span style="width:58px;flex-shrink:0;text-align:center">QTY</span>' +
        '<span style="width:90px;flex-shrink:0;text-align:right">UNIT</span>' +
        '<span style="width:128px;flex-shrink:0;text-align:right">DISC $ / %</span>' +
        '<span style="width:104px;flex-shrink:0;text-align:right">EXTENDED</span>' +
        '<span style="width:26px;flex-shrink:0"></span>' +
      '</div>';

    var body = POS.cart.map(function(i, idx){
      var net = posLineNet(i);
      var d = posLineDisc(i);
      var loc = i.location
        ? '<small style="display:block;color:#0891b2;font-weight:700;font-size:' + posFS(10) + '">📍 ' + esc(i.location) + (i.bin_location ? ' · ' + esc(i.bin_location) : '') + '</small>'
        : (i.bin_location ? '<small style="display:block;color:var(--muted);font-weight:700;font-size:' + posFS(10) + '">🗂 ' + esc(i.bin_location) + '</small>' : '');
      return '<div style="display:flex;gap:9px;align-items:center;padding:4px 10px;border-bottom:1px solid var(--hover);' +
          'border-left:1px solid var(--line);border-right:1px solid var(--line);font-size:' + cFS + ';font-weight:700">' +
        '<code style="width:' + psuW + 'px;flex-shrink:0;font-size:' + cFS + ';font-weight:700;word-break:break-all;line-height:1.2">' +
          esc(i.sku || i.img) + '</code>' +
        '<span style="width:300px;flex-shrink:0;font-weight:700;word-break:break-word;line-height:1.2">' +
          esc(i.name) + loc +
          (i.serialRequired
            ? '<input class="posSerialNum" data-sidx="' + idx + '" value="' + esc(i.serialNumber || '') + '" placeholder="serial # — required to sell" ' +
              'style="width:100%;margin-top:3px;padding:3px 6px;border:1px solid ' + (i.serialNumber ? '#86efac' : '#fca5a5') + ';border-radius:4px;font-size:' + posFS(10.5) + ';font-weight:700;font-family:inherit"/>'
            : '') +
          (i.isRedeemable
            ? '<small style="display:block;margin-top:2px;color:#7c3aed;font-weight:700">🎟 redeemable — a code is generated on sale</small>'
            : '') +
          (d > 0
            ? '<input class="posDiscNote" data-nidx="' + idx + '" value="' + esc(i.discNote || '') + '" placeholder="reason for discount (prints on the invoice)" ' +
              'style="width:100%;margin-top:3px;padding:3px 6px;border:1px solid #fde68a;border-radius:4px;font-size:' + posFS(10.5) + ';font-weight:700;font-family:inherit"/>'
            : '') +
        '</span>' +
        '<span style="flex:1;min-width:0;font-weight:700;color:var(--muted);word-break:break-word;line-height:1.2" title="' + esc(i.make_model || '') + '">' +
          (i.make_model ? esc(i.make_model) : '—') +
        '</span>' +
        '<span style="width:58px;flex-shrink:0;text-align:center">' +
          '<input type="number" min="1" value="' + i.qty + '" data-idx="' + idx + '" class="posQty" ' +
            'style="width:52px;padding:4px;border:1px solid var(--line);border-radius:5px;font-size:' + posFS(12) + ';font-weight:700;text-align:center;font-family:inherit"/>' +
        '</span>' +
        '<span style="width:90px;flex-shrink:0;text-align:right">' +
          '<input type="number" min="0" step="0.01" value="' + (i.price > 0 ? i.price : '') + '" placeholder="price" data-pidx="' + idx + '" class="posPrice" ' +

        '</span>' +
        '<b style="width:104px;flex-shrink:0;text-align:right;font-weight:800;font-size:' + cFS + '">' +
          (i.price > 0 ? fmtMoney(net) : '—') + '</b>' +

          'style="width:26px;flex-shrink:0;background:#fee2e2;color:#b91c1c;border:0;height:25px;border-radius:5px;cursor:pointer;font-weight:800;font-size:' + posFS(12) + '">×</button>' +

    items.innerHTML = head + body +

  function drawCart(){

            (i.location ? '<br/><small style="color:#0891b2">📍 ' + esc(i.location) + '</small>'
                        : (i.bin_location ? '<br/><small style="color:var(--muted)">🗂 ' + esc(i.bin_location) + '</small>' : '')) +
          '</div>' +
          '<button data-rm="' + idx + '" title="Remove" style="background:#fee2e2;color:#b91c1c;border:0;width:24px;height:24px;border-radius:4px;cursor:pointer;font-weight:700;flex:none">×</button>' +
        '</div>' +

        '<div style="display:flex;gap:6px;align-items:center;margin-top:5px">' +
          '<span style="font-size:11px;color:var(--muted)">$</span>' +

            'style="width:72px;padding:4px;border:1px solid ' + (i.price > 0 ? 'var(--line)' : '#818cf8') + ';border-radius:4px;font-size:12px;text-align:right"/>' +
          '<span style="font-size:11px;color:var(--muted)">×</span>' +
          '<input type="number" min="1" value="' + i.qty + '" data-idx="' + idx + '" class="posQty" style="width:46px;padding:4px;border:1px solid var(--line);border-radius:4px;font-size:12px;text-align:center"/>' +
          '<select class="posDiscMode" data-dmidx="' + idx + '" title="Discount as amount or percent" style="padding:4px 2px;border:1px solid var(--line);border-radius:4px;font-size:11px;font-weight:800;background:#fff;color:#111">' +
            '<option value="amt"' + (i.discMode === 'pct' ? '' : ' selected') + '>−$</option>' +
            '<option value="pct"' + (i.discMode === 'pct' ? ' selected' : '') + '>−%</option>' +
          '</select>' +
          '<input type="number" min="0" step="' + (i.discMode === 'pct' ? '0.1' : '0.01') + '" value="' + (i.discMode === 'pct' ? (Number(i.discPct) > 0 ? i.discPct : '') : (d > 0 ? d : '')) + '" placeholder="0" data-didx="' + idx + '" class="posDisc" ' +
            'style="width:52px;padding:4px;border:1px solid ' + (d > 0 ? '#fca5a5' : 'var(--line)') + ';border-radius:4px;font-size:12px;text-align:right"/>' +
          '<b style="margin-left:auto;font-size:12.5px">' + (i.price > 0 ? fmtMoney(net) : '—') + '</b>' +
        '</div>' +
        (!i.priceManual && i.priceBreaks && i.priceBreaks.length && Number(i.price) < Number(i.basePrice)
          ? '<small style="display:block;margin-top:2px;color:#0e7490;font-weight:700">🏷 bulk price for qty ' + i.qty + '</small>' : '') +
        (!i.priceManual && i.saleActive
          ? '<small style="display:block;margin-top:2px;color:#166534;font-weight:700">🏷 sale price</small>' : '') +
        (i.serialRequired
          ? '<input class="posSerialNum" data-sidx="' + idx + '" value="' + esc(i.serialNumber || '') + '" placeholder="serial # — required to sell" style="width:100%;margin-top:4px;padding:3px 6px;border:1px solid ' + (i.serialNumber ? '#86efac' : '#fca5a5') + ';border-radius:4px;font-size:11px"/>'
          : '') +
        (i.isRedeemable
          ? '<small style="display:block;margin-top:2px;color:#7c3aed;font-weight:700">🎟 redeemable — a code is generated on sale</small>'
          : '') +
        (d > 0
          ? '<input class="posDiscNote" data-nidx="' + idx + '" value="' + esc(i.discNote || '') + '" placeholder="reason for discount (prints on invoice)" style="width:100%;margin-top:4px;padding:3px 6px;border:1px solid #fde68a;background:var(--card)beb;border-radius:4px;font-size:11px"/>'
          : '') +
      '</div>';
    }).join('');
    }

    var t = posTotals();
    // Unpriced lines are the normal case on this catalogue. They can't be sold
    // as-is, so the cart tells the operator what's missing and the footer
    // switches the primary action to saving a quote.
    var unpriced = POS.cart.filter(function(i){ return !(i.price > 0); }).length;

    if (POS.cartFull && headBar) {
      // Compact, single-line version for the full-screen header. Same control
      // ids (posOrderDisc / posOrderDiscMode / posTaxToggle) as the sidebar
      // version, so the handlers wired below find them wherever they render.
      totals.innerHTML = '';
      headBar.innerHTML =
        (unpriced ? '<span style="background:#4338ca;color:#fff;padding:2px 7px;border-radius:4px;font-weight:700" title="' + unpriced + ' line' + (unpriced === 1 ? '' : 's') + ' still need a price">⚠ ' + unpriced + '</span>' : '') +
        '<span>Sub <b>' + fmtMoney(t.subtotal) + '</b></span>' +
        '<span style="display:flex;align-items:center;gap:3px">Disc' +
          '<input id="posOrderDisc" type="number" min="0" step="0.01" value="' + (POS.orderDiscRaw || '') + '" placeholder="0" style="width:58px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;font-size:14px;font-weight:800;text-align:right;background:#fff;color:#111"/>' +
          '<select id="posOrderDiscMode" style="padding:3px;border:1px solid var(--line);border-radius:4px;font-size:14px;font-weight:800;background:#fff;color:#111">' +
            '<option value="dollar"' + (POS.orderDiscMode === 'dollar' ? ' selected' : '') + '>$</option>' +
            '<option value="pct"' + (POS.orderDiscMode === 'pct' ? ' selected' : '') + '>%</option>' +
          '</select>' +
        '</span>' +
        (t.lineDisc > 0 ? '<span style="color:#fca5a5">Line −' + fmtMoney(t.lineDisc) + '</span>' : '') +
        (t.orderDisc > 0 ? '<span style="color:#fca5a5">Tkt −' + fmtMoney(t.orderDisc) + '</span>' : '') +
        (t.couponDisc > 0 ? '<span style="color:#fca5a5">🏷 ' + esc(POS.couponCode) + ' −' + fmtMoney(t.couponDisc) + '</span>' : '') +
        (t.shipping > 0 ? '<span style="color:#7dd3fc">Ship ' + fmtMoney(t.shipping) + '</span>' : '') +
        '<label style="display:flex;align-items:center;gap:4px;margin:0;' + ((POS.customer && POS.customer.tax_exempt) ? 'cursor:default' : 'cursor:pointer') + '" title="' + ((POS.customer && POS.customer.tax_exempt) ? 'Customer is tax exempt' : 'Charge GCT on this ticket') + '">' +
          '<input type="checkbox" id="posTaxToggle" ' + ((POS.customer && POS.customer.tax_exempt) ? 'checked disabled' : (POS.noTax ? '' : 'checked')) + ' style="margin:0"/>' +
          '<span>' + ((POS.customer && POS.customer.tax_exempt) ? 'GCT (exempt)' : (POS.noTax ? 'GCT off' : 'GCT')) + ' <b>' + fmtMoney(t.tax) + '</b></span>' +
        '</label>' +
        '<span style="font-size:17px;border-left:1px solid rgba(255,255,255,.28);padding-left:12px">TOTAL <b style="color:#fca5a5">' + fmtMoney(t.total) + '</b></span>';
    } else {
    if (headBar) headBar.innerHTML = '';
    totals.innerHTML =
      (unpriced
        ? '<div style="background:#e0e7ff;color:#1e3a8a;padding:6px 8px;border-radius:5px;margin-bottom:6px;font-size:12px;font-weight:700">' +
            '⚠ ' + unpriced + ' line' + (unpriced === 1 ? '' : 's') + ' still need' + (unpriced === 1 ? 's' : '') + ' a price' +
          '</div>'
        : '') +
      // Ticket-level discount lives with the totals, where the operator is
      // already looking when the customer asks "what can you do on the whole lot".
      '<div style="display:flex;align-items:center;gap:5px;margin-bottom:6px">' +
        '<span style="color:var(--muted);flex:1">Ticket discount</span>' +
        '<input id="posOrderDisc" type="number" min="0" step="0.01" value="' + (POS.orderDiscRaw || '') + '" placeholder="0" style="width:66px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;font-size:12px;text-align:right"/>' +
        '<select id="posOrderDiscMode" style="padding:3px;border:1px solid var(--line);border-radius:4px;font-size:12px">' +
          '<option value="dollar"' + (POS.orderDiscMode === 'dollar' ? ' selected' : '') + '>$</option>' +
          '<option value="pct"' + (POS.orderDiscMode === 'pct' ? ' selected' : '') + '>%</option>' +
        '</select>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:5px;margin-bottom:2px">' +
        '<span style="color:var(--muted);flex:1">Coupon code</span>' +
        (POS.couponCode
          ? '<code style="font-weight:700">' + esc(POS.couponCode) + '</code><button type="button" id="posCouponClear" style="border:0;background:none;color:#b91c1c;cursor:pointer;font-size:13px;padding:0 2px" title="Remove coupon">✕</button>'
          : '<input id="posCouponInput" placeholder="CODE" autocomplete="off" style="width:80px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;font-size:12px;text-transform:uppercase"/>' +
            '<button type="button" id="posCouponApply" class="btn" style="padding:3px 8px;font-size:11px">Apply</button>') +
      '</div>' +
      '<div id="posCouponMsg" style="font-size:11px;margin-bottom:6px;min-height:14px"></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:700"><span>Subtotal</span><b>' + fmtMoney(t.subtotal) + '</b></div>' +
      (t.lineDisc > 0 ? '<div style="display:flex;justify-content:space-between;color:#b91c1c"><span>Line discounts</span><b>−' + fmtMoney(t.lineDisc) + '</b></div>' : '') +
      (t.orderDisc > 0 ? '<div style="display:flex;justify-content:space-between;color:#b91c1c"><span>Ticket discount</span><b>−' + fmtMoney(t.orderDisc) + '</b></div>' : '') +
      (t.couponDisc > 0 ? '<div style="display:flex;justify-content:space-between;color:#b91c1c"><span>Coupon (' + esc(POS.couponCode) + ')</span><b>−' + fmtMoney(t.couponDisc) + '</b></div>' : '') +
      (t.shipping > 0 ? '<div style="display:flex;justify-content:space-between;color:#0e7490"><span>Shipping</span><b>' + fmtMoney(t.shipping) + '</b></div>' : '') +
      // GCT line doubles as its toggle. Checked = charge tax. A customer-level
      // exemption wins and locks the box; otherwise the operator can switch it
      // off for this one ticket (POS.noTax), which the server re-checks on post.
      '<div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700">' +
        '<label style="display:flex;align-items:center;gap:5px;margin:0;' + ((POS.customer && POS.customer.tax_exempt) ? 'cursor:default' : 'cursor:pointer') + '">' +
          '<input type="checkbox" id="posTaxToggle" ' +
            ((POS.customer && POS.customer.tax_exempt) ? 'checked disabled' : (POS.noTax ? '' : 'checked')) +
            ' style="margin:0"/>' +
          '<span>' + ((POS.customer && POS.customer.tax_exempt) ? 'GCT (customer exempt)' : (POS.noTax ? 'GCT 15% — off' : 'GCT 15%')) + '</span>' +
        '</label>' +
        '<b>' + fmtMoney(t.tax) + '</b>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:6px;border-top:2px solid var(--line);font-size:18px;font-weight:800"><b>TOTAL</b><b style="color:var(--red)">' + fmtMoney(t.total) + '</b></div>';
    }

    items.querySelectorAll('.posQty').forEach(function(inp){
      inp.addEventListener('change', function(){
        var line = POS.cart[parseInt(inp.getAttribute('data-idx'), 10)];
        line.qty = Math.max(1, parseInt(inp.value, 10) || 1);
        // A manually-typed price (pos.price_override) is a deliberate call by
        // the cashier and must survive a quantity change; otherwise re-price
        // against this product's bulk tiers for the new quantity.
        if (!line.priceManual) line.price = posBestUnitPrice(line.basePrice, line.priceBreaks, line.qty);
        drawCart();
      });
    });
    items.querySelectorAll('.posPrice').forEach(function(inp){
      inp.addEventListener('change', function(){
        var line = POS.cart[parseInt(inp.getAttribute('data-pidx'), 10)];
        line.price = Math.max(0, Number(inp.value) || 0);
        line.priceManual = true;
        drawCart();
      });
    });
    items.querySelectorAll('.posDiscMode').forEach(function(sel){
      sel.addEventListener('change', function(){
        var line = POS.cart[parseInt(sel.getAttribute('data-dmidx'), 10)];
        if (!line) return;
        line.discMode = sel.value === 'pct' ? 'pct' : 'amt';
        // Keep whichever raw value the operator already typed; the other stays
        // put so a mis-click on the toggle is trivially reversible.
        drawCart();
      });
    });
    items.querySelectorAll('.posDisc').forEach(function(inp){
      inp.addEventListener('change', async function(){
        var idx = parseInt(inp.getAttribute('data-didx'), 10);
        var line = POS.cart[idx];
        var raw = Math.max(0, Number(inp.value) || 0);
        var isPct = line.discMode === 'pct';
        var gross = (Number(line.price) || 0) * (Number(line.qty) || 1);
        // Resolve both the new and previous entry to dollars so the cap check
        // and the "went up" test work the same whether this line is $ or %.
        var want = isPct ? Math.round(gross * raw / 100 * 100) / 100 : raw;
        var was = posLineDisc(line);

        // The customer's discount_limit_pct and this specific product's own
        // max_discount_pct are both ceilings a cashier may give on their own
        // -- whichever is stricter wins. Past it, a manager PIN authorises
        // this one line -- which is the whole point of the override: the
        // cashier keeps the till and the manager does not have to sign in
        // and out to approve a discount. Owners and managers are never
        // asked; they already hold the authority the prompt would be
        // checking for.
        var custCap = POS.customer && POS.customer.discount_limit_pct;
        var itemCap = line.maxDiscountPct;
        var cap = itemCap != null && (custCap == null || itemCap < custCap) ? itemCap : custCap;
        var capIsItem = cap === itemCap && itemCap != null;
        var capValue = (cap != null && gross > 0) ? (gross * Number(cap) / 100) : null;

        if (capValue != null && want > capValue + 0.001 && want > was &&
            !['owner', 'manager'].includes(CURRENT_ADMIN_ROLE)) {
          var appr = await posPinPrompt({
            purpose: 'override',
            title: 'Manager approval needed',
            detail: (capIsItem ? 'This part\'s own discount limit is ' : 'Discount above this customer’s ') + cap + '% limit (' + fmtMoney(capValue) + ' on this line).',
          });
          if (!appr) { drawCart(); return; }  // declined -- redraw restores the old value
          line.discApprovedBy = appr.name;
          // Recorded on the line so the reason prints on the invoice and the
          // approval is not just a thing that happened on a screen.
          line.discNote = (line.discNote ? line.discNote + ' — ' : '') + 'approved by ' + appr.name;
        }
        if (isPct) line.discPct = raw; else line.disc = raw;
        drawCart();
      });
    });
    items.querySelectorAll('.posDiscNote').forEach(function(inp){
      inp.addEventListener('change', function(){
        POS.cart[parseInt(inp.getAttribute('data-nidx'), 10)].discNote = inp.value;
        posSaveState();
      });
    });
    items.querySelectorAll('.posSerialNum').forEach(function(inp){
      inp.addEventListener('change', function(){
        POS.cart[parseInt(inp.getAttribute('data-sidx'), 10)].serialNumber = inp.value.trim();
        drawCart();
      });
    });
    items.querySelectorAll('[data-rm]').forEach(function(btn){
      btn.addEventListener('click', function(){
        POS.cart.splice(parseInt(btn.getAttribute('data-rm'), 10), 1);
        drawCart();
      });
    });
    var od = document.getElementById('posOrderDisc');
    if (od) od.addEventListener('change', function(){ POS.orderDiscRaw = Math.max(0, Number(this.value) || 0); drawCart(); });
    var om = document.getElementById('posOrderDiscMode');
    if (om) om.addEventListener('change', function(){ POS.orderDiscMode = this.value; drawCart(); });
    var tt = document.getElementById('posTaxToggle');
    if (tt) tt.addEventListener('change', function(){ POS.noTax = !this.checked; drawCart(); });
    var cpApply = document.getElementById('posCouponApply');
    if (cpApply) cpApply.addEventListener('click', async function(){
      var inp = document.getElementById('posCouponInput');
      var msg = document.getElementById('posCouponMsg');
      var code = (inp.value || '').trim();
      if (!code) return;
      msg.style.color = 'var(--muted)'; msg.textContent = 'Checking…';
      try {
        var r = await api('/api/admin/pos/coupon-preview', { method: 'POST', body: { code: code, items: posCartPayload() } });
        POS.couponCode = r.code; POS.couponDiscount = r.discount_usd;
        drawCart();
      } catch (e) { msg.style.color = 'var(--red)'; msg.textContent = e.message; }
    });
    var cpClear = document.getElementById('posCouponClear');
    if (cpClear) cpClear.addEventListener('click', function(){ POS.couponCode = ''; POS.couponDiscount = 0; drawCart(); });

    drawCartFooter(unpriced);
    posApplyPerms();
  }

  // Disable / hide the controls this user's account is not permitted to use.
  // Called after every drawCart() (the discount / price / tax inputs are
  // re-rendered each time) and once after the ticket bar is built. The server
  // re-checks every one of these on write -- this is only so the operator
  // isn't offered a button that will 403.
  function posApplyPerms(){
    if (MY_PERMS_FULL) return;
    var apply = function(sel, mode){
      document.querySelectorAll(sel).forEach(function(el){
        if (mode === 'hide') { el.style.display = 'none'; return; }
        if (mode === 'readonly') el.readOnly = true; else el.disabled = true;
        el.style.opacity = '.55'; el.style.cursor = 'not-allowed';
        el.title = 'Not permitted for your account';
      });
    };
    if (!can('pos.ticket_discount')) apply('#posOrderDisc,#posOrderDiscMode', 'disable');
    if (!can('pos.line_discount'))   apply('.posDisc,.posDiscMode', 'disable');
    if (!can('pos.price_override'))  apply('.posPrice', 'readonly');
    if (!can('pos.qty_update'))      apply('.posQty', 'disable');
    if (!can('pos.no_tax'))          apply('#posTaxToggle', 'disable');
    if (!can('pos.add_customer'))    apply('#posCustNew', 'hide');
    if (!can('pos.hold_recall'))     apply('#posHoldBtn,#posRecallBtn', 'hide');
    if (!can('pos.open_close_shift')) apply('#posShiftBtn', 'hide');
  }

  // CHECKOUT can only post a real sale once every line has a price. Until then
  // the quote button leads, so the counter can still hand the customer a
  // number to think about.
  function drawCartFooter(unpriced){
    var co = document.getElementById('posCheckout');
    if (co){
      co.disabled = unpriced > 0 || !POS.cart.length;
      co.style.opacity = co.disabled ? '.45' : '1';
      co.style.cursor = co.disabled ? 'not-allowed' : 'pointer';
      var asOrder = !can('pos.finalise_invoice');
      co.innerHTML = (asOrder ? '➕ SAVE ORDER' : 'CHECKOUT') + ' <small style="opacity:.7;font-weight:600">F9</small>';
      co.title = unpriced > 0
        ? 'Enter a price on every line to ' + (asOrder ? 'save the order' : 'complete a sale')
        : (asOrder ? 'Save this cart as an order for a cashier to take payment' : '');
    }
    var qb = document.getElementById('posSaveQuote');
    if (qb){
      qb.style.background = unpriced > 0 ? '#fbbf24' : 'var(--card-soft2)';

  // ---- terminals dropdown (server only) ------------------------------------
  // The machine indicator in the ticket bar is a button only when this machine
  // holds the database (see the markup above). Clicking it drops down every
  // terminal registered against this server, with per-terminal Block /
  // Disconnect / Forget -- the same endpoints the Settings "Terminals & access"
  // screen uses. All manager-gated server-side; a cashier just gets an error.
  var termBtn = document.getElementById('posTermBtn');
  var termMenu = document.getElementById('posTermMenu');
  // renderPOS() runs many times; drop the previous document-level closer so
  // they don't stack up.
  if (window.__posTermDocHandler) { document.removeEventListener('click', window.__posTermDocHandler); window.__posTermDocHandler = null; }
  if (termBtn && termMenu) {
    var termSelId = null, termThisId = null, termList = [];

    function termFmtSeen(t){
      if (t.online) return 'online';
      return t.last_seen ? 'last seen ' + fmtDate(t.last_seen) : 'never seen';
    }
    function termRender(){
      var onCount = termList.filter(function(t){ return t.online; }).length;
      var sel = termList.find(function(t){ return t.id === termSelId; }) || null;
      termMenu.innerHTML =
        '<div style="padding:8px 11px;font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)">Terminals · ' + onCount + ' online / ' + termList.length + '</div>' +
        (termList.length
          ? termList.map(function(t){
              return '<button type="button" class="posTermRow" data-id="' + t.id + '" style="display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hover);background:' + (t.id === termSelId ? 'var(--hover)' : 'transparent') + ';padding:8px 11px;cursor:pointer;font-family:inherit">' +
                '<div style="display:flex;align-items:center;gap:6px">' +
                  '<span style="width:8px;height:8px;border-radius:50%;flex:none;background:' + (t.online ? '#22c55e' : '#9ca3af') + '"></span>' +
                  '<b style="font-size:12px">' + (t.is_db_host ? '🗄 ' : '🖥 ') + esc(t.name || '(unnamed)') + '</b>' +
                  (t.status === 'blocked' ? '<span style="background:#fee2e2;color:#b91c1c;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;text-transform:uppercase">blocked</span>' : '') +
                  (t.status === 'pending' ? '<span style="background:#fef9c3;color:#854d0e;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;text-transform:uppercase">pending</span>' : '') +
                  (t.id === termThisId ? '<span style="margin-left:auto;font-size:9px;color:var(--muted)">this screen</span>' : '') +
                '</div>' +
                '<div style="font-size:10px;color:var(--muted);margin-top:2px">' + esc(t.hostname || '') + (t.address ? ' · ' + esc(t.address) : '') + ' · ' + termFmtSeen(t) + '</div>' +
              '</button>';
            }).join('')
          : '<div style="padding:14px 11px;font-size:12px;color:var(--muted)">No terminals registered.</div>') +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;padding:8px 11px;border-top:1px solid var(--line);background:var(--card-soft);position:sticky;bottom:0">' +
          (sel && !sel.is_db_host
            ? '<button type="button" id="posTermBlock" class="btn" style="font-size:11px;padding:5px 9px">' + (sel.status === 'blocked' ? '✓ Unblock' : '⛔ Block') + '</button>' +
              '<button type="button" id="posTermKick" class="btn ghost" style="font-size:11px;padding:5px 9px">⏏ Disconnect</button>' +
              '<button type="button" id="posTermForget" class="btn ghost" style="font-size:11px;padding:5px 9px;margin-left:auto">🗑 Forget</button>'
            : '<span style="font-size:11px;color:var(--muted);padding:4px 0">' + (sel ? 'The database host can’t be blocked or removed.' : 'Select a terminal to manage it.') + '</span>') +
        '</div>';
      termMenu.querySelectorAll('.posTermRow').forEach(function(b){
        b.addEventListener('click', function(){ termSelId = parseInt(b.dataset.id, 10); termRender(); });
      });
      var act = function(id, run){
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('click', async function(){
          el.disabled = true;
          try { var go = run(); if (go) await go; } catch (e) { posToast(e && e.message || 'Action failed', true); }
          termLoad();
        });
      };
      act('posTermBlock', function(){
        return api('/api/admin/terminals/' + sel.id, { method:'PATCH', body:{ status: sel.status === 'blocked' ? 'approved' : 'blocked' } });
      });
      act('posTermKick', async function(){
        if (!(await posConfirm('Sign out everyone on "' + (sel.name || 'this terminal') + '" now?\nIt can reconnect on its own afterwards.', { ok:'Disconnect', danger:true }))) return null;
        return api('/api/admin/terminals/' + sel.id + '/terminate', { method:'POST' });
      });
      act('posTermForget', async function(){
        if (!(await posConfirm('Forget "' + (sel.name || 'this terminal') + '"?\nIf it reconnects it comes back as pending.', { ok:'Forget', danger:true }))) return null;
        termSelId = null;
        return api('/api/admin/terminals/' + sel.id, { method:'DELETE' });
      });
    }
    async function termLoad(){
      termMenu.innerHTML = '<div style="padding:14px 11px;font-size:12px;color:var(--muted)">Loading…</div>';
      var r;
      try { r = await api('/api/admin/terminals'); }
      catch (e) { termMenu.innerHTML = '<div style="padding:14px 11px;font-size:12px;color:#b91c1c">' + esc(e && e.message || 'Could not load terminals') + '</div>'; return; }
      termThisId = r.this_terminal_id;
      termList = r.terminals || [];
      if (!termList.some(function(t){ return t.id === termSelId; })) {
        var pick = termList.find(function(t){ return !t.is_db_host && t.id !== termThisId; }) ||
                   termList.find(function(t){ return !t.is_db_host; }) || termList[0];
        termSelId = pick ? pick.id : null;
      }
      termRender();
    }
    termBtn.addEventListener('click', function(e){
      e.stopPropagation();
      var showing = termMenu.style.display === 'block';
      termMenu.style.display = showing ? 'none' : 'block';
      if (!showing) termLoad();
    });
    window.__posTermDocHandler = function(e){
      if (termMenu.style.display === 'block' && !termMenu.contains(e.target) && !termBtn.contains(e.target)) termMenu.style.display = 'none';
    };
    document.addEventListener('click', window.__posTermDocHandler);
  }

  // The "👥 N terminals" pill (owner/manager only) drops down the live list

  // ---- inventory search inside the full-screen cart --------------------------
  // Its own small search rather than a share of loadGrid(): that one owns the
  // paginated results grid, the filter bar, the view modes and the selection
  // state, none of which exist here. This needs one thing -- find a part, add it.
  var cartSearch = document.getElementById('posCartSearch');
  if (cartSearch) {
    var csDeb = null, csSeq = 0, csRows = [], csSel = -1;
    var csOut = document.getElementById('posCartSearchResults');
    var csMsg = document.getElementById('posCartSearchMsg');

    // Paints the arrow-key selection and keeps it on screen. The results box is
    // capped (max-height:min(60vh,520px)) with its own scrollbar, so without scrollIntoView
    // the highlight walks off the bottom of the list and the operator loses it.
    function csHighlight(){
      // Only the result rows carry selection; the sticky header is skipped so
      // csSel stays a straight index into csRows.
      var kids = csOut.querySelectorAll('.csPick');
      for (var i = 0; i < kids.length; i++){
        var on = (i === csSel);
        kids[i].style.background = on ? 'rgba(220,38,38,.16)' : 'var(--card)';
        kids[i].style.boxShadow = on ? 'inset 4px 0 0 var(--red)' : 'none';
      }
      if (csSel >= 0 && kids[csSel]) kids[csSel].scrollIntoView({ block: 'nearest' });
    }

    // Column layout, shared by the header and every row so they line up. SKU is
    // a fixed 20-character monospace column that wraps (not truncates) when the
    // part number runs longer.
    var CS_COL = {
      sku:  'width:20ch;min-width:20ch;flex-shrink:0;white-space:normal;word-break:break-all;overflow-wrap:anywhere',
      desc: 'width:30ch;min-width:30ch;flex-shrink:0;white-space:normal;word-break:break-word;overflow-wrap:anywhere',
      fit:  'flex:1;min-width:0;word-break:break-word',
      bin:  'width:92px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
      qty:  'width:44px;flex-shrink:0;text-align:center',
      price:'width:74px;flex-shrink:0;text-align:right',
    };

    function csRender(){
      if (!csRows.length) { csOut.style.display = 'none'; csOut.innerHTML = ''; csSel = -1; return; }
      var header =
        '<div style="display:flex;gap:10px;align-items:flex-start;padding:7px 11px;background:var(--card-soft2);' +
          'border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:0 3px 8px rgba(0,0,0,.14);' +
          'border-radius:6px 6px 0 0;font-size:' + posFS(10) + ';font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">' +
          '<span style="' + CS_COL.sku + '">SKU</span>' +
          '<span style="' + CS_COL.desc + '">Description</span>' +
          '<span style="' + CS_COL.fit + '">Vehicle / Fitment</span>' +
          '<span style="' + CS_COL.bin + '">Bin</span>' +
          '<span style="' + CS_COL.qty + '">Qty</span>' +
          '<span style="' + CS_COL.price + '">Price</span>' +
        '</div>';
      csOut.innerHTML = header + csRows.map(function(p, i){
        var usd = p.price_usd != null ? Number(p.price_usd) : null;
        var bin = p.bin_location || p.location || '—';
        return '<button type="button" class="csPick" data-i="' + i + '" style="display:flex;width:100%;gap:10px;align-items:flex-start;text-align:left;border:0;border-bottom:1px solid var(--hover);background:var(--card);color:var(--ink);padding:8px 11px;cursor:pointer;font-family:inherit">' +
          '<code style="' + CS_COL.sku + ';font-size:' + posFS(12) + ';font-weight:700;color:var(--ink);line-height:1.3">' + esc(posPartNo(p)) + '</code>' +
          '<span style="' + CS_COL.desc + ';font-size:' + posFS(12) + ';font-weight:600;color:var(--ink)">' + esc(p.name) + '</span>' +
          '<span style="' + CS_COL.fit + ';font-size:' + posFS(11) + ';font-weight:700;color:var(--muted)" title="' + esc(p.make_model || '') + '">' + esc(p.make_model || '—') + '</span>' +
          '<span style="' + CS_COL.bin + ';font-size:' + posFS(10.5) + ';color:#0891b2;font-weight:700" title="' + esc((p.location || '') + (p.location && p.bin_location ? ' · ' : '') + (p.bin_location || '')) + '">' + esc(bin) + '</span>' +
          '<span style="' + CS_COL.qty + ';font-size:' + posFS(11) + ';font-weight:700;color:' + posStockColor(p.stock_level) + '">' + (p.stock_count || 0) + '</span>' +
          '<b style="' + CS_COL.price + ';font-size:' + posFS(12) + ';color:var(--red)">' + (usd ? fmtMoney(usd) : '—') + '</b>' +
        '</button>';
      }).join('');
      csOut.style.display = 'block';
      csOut.querySelectorAll('.csPick').forEach(function(b){
        b.addEventListener('click', function(){ csAdd(csRows[parseInt(b.dataset.i, 10)]); });
        // Pointer and keyboard share one selection, so hovering a row then
        // pressing Enter picks that row rather than the first.
        b.addEventListener('mouseenter', function(){ csSel = parseInt(b.dataset.i, 10); csHighlight(); });
      });
      csSel = 0;
      csHighlight();
    }
    function csAdd(p){
      if (!p) return;
      posAddToCart(p, 1);
      drawCart();
      // Cleared and refocused so scanning or typing the next part needs no mouse.
      cartSearch.value = ''; csRows = []; csRender();
      csMsg.style.color = '#15803d';
      csMsg.textContent = '✔ ' + posPartNo(p);
      setTimeout(function(){ if (csMsg) csMsg.textContent = ''; }, 2000);
      cartSearch.focus();
    }
    // Search + the filter dropdown feed one query. buildProductWhere() on the
    // server takes category / make_model / location / price_min / price_max /
    // stock_status / sort -- these map straight onto it.
    function csQuery(q){
      var f = POS_CART_FILTER;
      var p = ['limit=50', 'offset=0'];
      if (q) p.push('q=' + encodeURIComponent(q));
      if (f.category) p.push('category=' + encodeURIComponent(f.category));
      if (f.brand)    p.push('make_model=' + encodeURIComponent(f.brand));
      if (f.location) p.push('location=' + encodeURIComponent(f.location));
      if (f.priceMin) p.push('price_min=' + encodeURIComponent(f.priceMin));
      if (f.priceMax) p.push('price_max=' + encodeURIComponent(f.priceMax));
      if (f.stockIn)  p.push('stock_status=in');
      if (f.sort)     p.push('sort=' + encodeURIComponent(f.sort));
      return '/api/products?' + p.join('&');
    }
    function csRunSearch(){
      var q = cartSearch.value.trim();
      clearTimeout(csDeb);
      // With a filter set, an empty box still means "show me everything that
      // matches the filter" -- so only bail when there is nothing to go on.
      if (q.length < 2 && !posCartFilterActive()) { csRows = []; csRender(); csMsg.textContent = ''; return; }
      csDeb = setTimeout(async function(){
        var seq = ++csSeq;
        csMsg.style.color = 'var(--muted)'; csMsg.textContent = 'searching…';
        try {
          var r = await api(csQuery(q));
          if (seq !== csSeq) return;                 // a newer keystroke already won
          csRows = r.products || [];
          csRender();
          csMsg.textContent = csRows.length
            ? (r.total > csRows.length
                ? 'showing ' + csRows.length + ' of ' + r.total + (r.count_mode === 'capped' ? '+' : '') + ' — refine to narrow'
                : csRows.length + ' found')
            : 'no match';
        } catch (e) {
          if (seq !== csSeq) return;
          csRows = []; csRender();
          csMsg.style.color = '#b91c1c'; csMsg.textContent = 'search failed';
        }
      }, 220);
    }
    cartSearch.addEventListener('input', csRunSearch);

    // ---- filter dropdown ---------------------------------------------------
    var cfBtn = document.getElementById('posCartFilterBtn');
    var cfMenu = document.getElementById('posCartFilterMenu');
    if (window.__posCartFilterDocHandler) { document.removeEventListener('click', window.__posCartFilterDocHandler); window.__posCartFilterDocHandler = null; }
    if (cfBtn && cfMenu) {
      var cfBrands = null, cfLocs = null;
      var fld = 'padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:inherit;background:var(--card);color:var(--ink);width:100%';
      function cfDot(){
        var d = document.getElementById('posCartFilterDot');
        if (d) d.style.display = posCartFilterActive() ? 'inline' : 'none';
      }
      function cfRender(){
        var f = POS_CART_FILTER;
        var opts = function(arr, cur){ return (arr || []).map(function(v){ return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join(''); };
        cfMenu.innerHTML =
          '<div style="padding:11px;display:grid;gap:9px;width:270px">' +
            '<label style="display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;cursor:pointer">' +
              '<input type="checkbox" id="cfStock"' + (f.stockIn ? ' checked' : '') + '/> In-stock only</label>' +
            '<div style="display:flex;align-items:center;gap:6px;font-size:12.5px">Price ' +
              '<input id="cfMin" type="number" min="0" step="0.01" placeholder="min" value="' + esc(f.priceMin) + '" style="width:70px;' + fld + '"/>' +
              '<span style="color:var(--muted)">–</span>' +
              '<input id="cfMax" type="number" min="0" step="0.01" placeholder="max" value="' + esc(f.priceMax) + '" style="width:70px;' + fld + '"/></div>' +
            '<select id="cfCat" style="' + fld + '"><option value="">Any category</option>' +
              POS_CATEGORIES.map(function(c){ return '<option value="' + c[0] + '"' + (c[0] === f.category ? ' selected' : '') + '>' + esc(c[1]) + '</option>'; }).join('') + '</select>' +
            '<select id="cfBrand" style="' + fld + '"><option value="">Any brand / vehicle fit</option>' + (cfBrands === null ? '<option disabled>loading…</option>' : opts(cfBrands, f.brand)) + '</select>' +
            '<select id="cfLoc" style="' + fld + '"><option value="">Any location</option>' + (cfLocs === null ? '<option disabled>loading…</option>' : opts(cfLocs, f.location)) + '</select>' +
            '<select id="cfSort" style="' + fld + '">' +
              '<option value="">Order: default</option>' +
              '<option value="name_asc"' + (f.sort === 'name_asc' ? ' selected' : '') + '>Description A–Z</option>' +
              '<option value="name_desc"' + (f.sort === 'name_desc' ? ' selected' : '') + '>Description Z–A</option></select>' +
            '<button type="button" id="cfReset" class="btn ghost" style="font-size:11.5px;padding:6px 10px;justify-self:start">↺ Reset filters</button>' +
          '</div>';
        var bind = function(id, ev, fn){ var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
        var commit = function(){ posSaveCartFilter(); cfDot(); csRunSearch(); };
        bind('cfStock', 'change', function(){ POS_CART_FILTER.stockIn = this.checked; commit(); });
        bind('cfMin',   'change', function(){ POS_CART_FILTER.priceMin = this.value.trim(); commit(); });
        bind('cfMax',   'change', function(){ POS_CART_FILTER.priceMax = this.value.trim(); commit(); });
        bind('cfCat',   'change', function(){ POS_CART_FILTER.category = this.value; commit(); });
        bind('cfBrand', 'change', function(){ POS_CART_FILTER.brand = this.value; commit(); });
        bind('cfLoc',   'change', function(){ POS_CART_FILTER.location = this.value; commit(); });
        bind('cfSort',  'change', function(){ POS_CART_FILTER.sort = this.value; commit(); });
        bind('cfReset', 'click',  function(){ POS_CART_FILTER = posBlankCartFilter(); commit(); cfRender(); });
      }
      cfBtn.addEventListener('click', function(e){
        e.stopPropagation();
        var showing = cfMenu.style.display === 'block';
        cfMenu.style.display = showing ? 'none' : 'block';
        if (showing) return;
        var rb = cfBtn.getBoundingClientRect();
        cfMenu.style.top = Math.round(rb.bottom + 5) + 'px';
        cfMenu.style.right = Math.round(window.innerWidth - rb.right) + 'px';
        cfRender();
        if (cfBrands === null || cfLocs === null) {
          Promise.all([
            api('/api/admin/pos/vehicle-models').then(function(r){ return r.models || []; }).catch(function(){ return []; }),
            api('/api/admin/pos/locations').then(function(r){ return r.locations || []; }).catch(function(){ return []; }),
          ]).then(function(res){ cfBrands = res[0]; cfLocs = res[1]; if (cfMenu.style.display === 'block') cfRender(); });
        }
      });
      window.__posCartFilterDocHandler = function(e){
        if (cfMenu.style.display === 'block' && !cfMenu.contains(e.target) && !cfBtn.contains(e.target)) cfMenu.style.display = 'none';
      };
      document.addEventListener('click', window.__posCartFilterDocHandler);
      // A filter carried over from a previous session should populate the list
      // straight away, not wait for the first keystroke.
      if (posCartFilterActive()) csRunSearch();
    }
    cartSearch.addEventListener('keydown', function(e){
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!csRows.length) return;
        e.preventDefault();   // don't let the caret jump within the input instead
        var step = e.key === 'ArrowDown' ? 1 : -1;
        csSel = Math.max(0, Math.min(csRows.length - 1, (csSel < 0 ? 0 : csSel) + step));
        csHighlight();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        // A barcode scanner types the code then sends Enter, usually faster than
        // the 220ms debounce -- so on Enter with nothing listed yet, look the code
        // up directly rather than making the operator scan twice.
        if (csRows.length) return csAdd(csRows[csSel >= 0 ? csSel : 0]);
        var code = this.value.trim();
        if (!code) return;
        api('/api/admin/pos/scan?code=' + encodeURIComponent(code))
          .then(function(res){ if (res && res.product) csAdd(res.product); else throw new Error('no match'); })
          .catch(function(){ csMsg.style.color = '#b91c1c'; csMsg.textContent = 'no match'; });
      } else if (e.key === 'Escape') {
        this.value = ''; csRows = []; csRender(); csMsg.textContent = '';
      }
    });
    setTimeout(function(){ try { cartSearch.focus(); } catch (_) {} }, 80);
  }
  document.getElementById('posRep').addEventListener('change', function(){
    // String compare, not parseInt: rep ids are normally numbers but the
    // signed-in-user fallback uses the id 'self'.
    var raw = this.value;
    var m = reps.find(function(x){ return String(x.id) === String(raw); });
    POS.rep = m ? { id: m.id, name: m.name } : null;
    posSaveState();
  });
  // PIN sign-in: identifies whoever is standing at the till and credits the
  // ticket to them. rep_id comes back from the server already resolved to the
  // mechanics row the sales_rep_id column expects -- the browser has no way to
  // work that out, since mechanics ids and users ids are different id spaces.
  var pinBtn = document.getElementById('posPinBtn');
  if (pinBtn) pinBtn.addEventListener('click', async function(){
    var who = await posPinPrompt({
      purpose: 'signin',
      title: 'Take over this till',
      detail: 'Enter your PIN to be credited with this ticket.',
    });

    if (!who.rep_id) {
      alert(who.name + ' has no sales-rep record, so tickets cannot be credited to them.\n\n' +
            'Add a category (Sales rep, Cashier, Mechanic or Service advisor) under Settings → Users & Staff.');
      return;
    }
    POS.rep = { id: who.rep_id, name: who.name };
    posSaveState();
    var sel = document.getElementById('posRep');
    if (sel) sel.value = String(who.rep_id);

      if (k === 'Escape') {
        var active = document.activeElement;
        if (active && typeof active.blur === 'function') active.blur();
        var cr = document.getElementById('posCustResults'); if (cr) cr.style.display = 'none';
      }
      // Arrow-key navigation of the results list + Enter-to-add, only in
      // Legacy keys mode and only when focus isn't in a text field (so the
      // arrow keys still work normally while typing in search/notes/etc.).
      if (!POS_PREFS.legacyKeys) return;
      var tag = document.activeElement && document.activeElement.tagName;
      var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if (typing && k !== 'Enter') return;
      var results = document.getElementById('posResults');
      var products = results && results.__posProducts || [];
      if (!products.length) return;
      if (k === 'ArrowDown') { e.preventDefault(); POS_SEL_INDEX = Math.min(products.length - 1, POS_SEL_INDEX + 1); posHighlightSel(); }
      else if (k === 'ArrowUp') { e.preventDefault(); POS_SEL_INDEX = Math.max(0, POS_SEL_INDEX - 1); posHighlightSel(); }
      else if (k === 'Enter' && !typing && POS_SEL_INDEX >= 0 && POS_SEL_INDEX < products.length) {
        e.preventDefault();
        posAddToCart(products[POS_SEL_INDEX], 1);
        if (POS_DRAWCART) POS_DRAWCART();
      }
    });
  }

  // drawCart is a closure over this panel's DOM; the modals below live outside
  // renderPOS and need a way back in after they change the ticket.
  POS_REDRAW = function(){ renderPOS(panel); };
  POS_DRAWCART = drawCart;
  loadGrid(1);
  drawCart();
  posApplyPerms();   // ticket-bar controls (hold/recall/shift/new customer)
  // Full-screen cart credits the ticket to whoever is signed in (or took over
  // by PIN), even on a plain reload that didn't go through the ⛶ button.
  if (POS.cartFull) posDefaultRepToSignedInUser();
  // Customer comes first at the start of a ticket -- who it's for is usually
  // known before what's in the cart, and it's one keystroke away from
  // re-focusing the scanner (F2) once that's settled.
  custSearchInp.focus();
}

function posCartToFile(){
  var t = posTotals();
  var esc2 = function(s){ s = String(s == null ? '' : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  var out = ['sku,description,location,qty,unit,discount,amount'];
  posCartLines().forEach(function(l){
    out.push([l.sku, l.name, l.loc, l.qty, l.unit.toFixed(2), l.disc.toFixed(2), l.ext.toFixed(2)].map(esc2).join(','));
  });
  out.push('');
  out.push(esc2('') + ',,,,,Subtotal,' + t.subtotal.toFixed(2));
  if (t.orderDisc > 0) out.push(',,,,,Ticket discount,-' + t.orderDisc.toFixed(2));
  out.push(',,,,,GCT,' + t.tax.toFixed(2));
  out.push(',,,,,TOTAL,' + t.total.toFixed(2));
  var blob = new Blob([out.join('\r\n')], { type: 'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cart-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  posToast('Saved ' + a.download);
}

    (POS.notes ? '\n\nNote: ' + POS.notes : '');
  window.location.href = 'mailto:' + encodeURIComponent(email) +

// F8 Recall -- one modal, three sources of "a ticket from before": a parked
// cart (Held), an unpriced/priced estimate (Quote), or a completed sale
// (Invoice, for looking one up/reprinting/starting a return without
// leaving the counter for the separate POS Sales & Returns tab). Held and
// Quote both load their lines back into the current cart the same way;
// Invoice never does -- it's already been paid, "recalling" it opens the
// existing sale-detail view (posSaleDetail, with its own reprint/return/
// void actions) instead of pretending to re-ring it.
async function posRecallModal(after){
  var mode = 'held';
  var today = new Date().toISOString().slice(0, 10);
  var invFrom = today, invTo = today, invQ = '';
  var retFrom = today, retTo = today, retQ = '';

  function tabBtn(key, glyph, label){
    var on = mode === key;
    return '<button type="button" class="posRecallTab" data-mode="' + key + '" style="padding:8px 14px;border:0;border-bottom:2px solid ' + (on ? 'var(--sky)' : 'transparent') + ';background:none;font-weight:700;font-size:12.5px;cursor:pointer;color:' + (on ? 'var(--heading)' : 'var(--muted)') + ';font-family:inherit">' + glyph + ' ' + label + '</button>';
  }

  async function heldBody(){
    var holds = [];
    try { holds = (await api('/api/admin/pos/holds')).holds || []; }
    catch (e) { return '<div class="empty">Could not load held tickets: ' + esc(e.message) + '</div>'; }
    if (!holds.length) return '<div class="empty">No held tickets.</div>';
    return '<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:420px;overflow-y:auto">' +
      holds.map(function(h){
        var items = posItemsArray(h.items_json);
        return '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--card-soft2)">' +

            '<br/><small style="color:var(--muted)">' + items.length + ' line' + (items.length === 1 ? '' : 's') + ' · ' + posCents(h.subtotal_cents) +
              ' · ' + fmtDate(h.created_at) + (h.held_by_name ? ' · ' + esc(h.held_by_name) : '') + '</small>' +
            (h.vehicle_info ? '<br/><small style="color:var(--muted)">🚗 ' + esc(h.vehicle_info) + '</small>' : '') +
          '</div>' +
          '<button type="button" class="btn ok" data-recall-held="' + h.id + '">Recall</button>' +
          '<button type="button" class="btn" data-drop-held="' + h.id + '" style="background:#fee2e2;color:#b91c1c">Discard</button>' +
        '</div>';
      }).join('') +
    '</div>';

  async function quotesBody(){
    var quotes = [];

    return '<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:420px;overflow-y:auto">' +

        var statusCls = q.status === 'converted' ? 'ok' : (q.status === 'declined' || q.status === 'expired' ? 'bad' : 'pending');
        return '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--card-soft2)">' +
          '<div style="flex:1">' +
