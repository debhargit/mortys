//  notice/footer text on invoices/receipts/statements. One row in
//  shop_settings (server.js), read into POS_SHOP (see
//  loadShopSettingsIntoPosShop() near the print-document code) so every
//  print template already reads from the same place this form writes to.
// =============================================================================
function posDbFieldset(prefix, title, sub, c){
  c = c || {};
  return '<div style="border:1px solid var(--line);border-radius:8px;padding:12px 14px">' +
    '<div style="font-weight:700;font-size:12.5px;margin-bottom:2px">' + title + '</div>' +
    '<div style="color:var(--muted);font-size:11.5px;margin-bottom:10px">' + sub + '</div>' +
    '<div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:8px">' +
      '<div><label class="lbl">Host</label><input id="' + prefix + 'Host" class="fld" value="' + esc(c.host || '') + '" placeholder="localhost"/></div>' +
      '<div><label class="lbl">Port</label><input id="' + prefix + 'Port" class="fld" type="number" value="' + (c.port || 5432) + '"/></div>' +
    '</div>' +
    '<div style="margin-bottom:8px"><label class="lbl">Database name</label><input id="' + prefix + 'Db" class="fld" value="' + esc(c.database || '') + '" placeholder="mortysautoparts"/></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">' +
      '<div><label class="lbl">User</label><input id="' + prefix + 'User" class="fld" value="' + esc(c.user || '') + '" placeholder="postgres"/></div>' +
      '<div><label class="lbl">Password</label><input id="' + prefix + 'Pass" type="password" class="fld" placeholder="' + (c.has_password ? '•••••••• (saved — leave blank to keep)' : 'password') + '"/></div>' +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:10px">' +
      '<button type="button" class="btn ghost" id="' + prefix + 'Test">Test connection</button>' +
      '<span id="' + prefix + 'TestMsg" style="font-size:11.5px;color:var(--muted)"></span>' +
    '</div>' +
  '</div>';
}

// Rendered both on Settings load (passive list, whatever's been heard so
// far) and after a manual scan (fresh list) -- same markup either way, with
// a "Use this server" button that jumps straight to filling in the Database
// connection fields below rather than making the operator copy an IP by hand.
function netServerRows(list){
  if (!list.length) {
    return '<div style="color:var(--muted);font-size:12.5px">No other Morty\'s Auto Parts servers seen on this network yet. If another machine has the local server installed and running, click "Scan for servers".</div>';
  }
  return '<div style="display:grid;gap:8px">' + list.map(function(sv){
    return '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:7px;padding:8px 12px">' +
      '<span style="font-weight:700;font-size:12.5px">🖥 ' + esc(sv.name) + '</span>' +
      '<span style="color:var(--muted);font-size:11.5px">' + esc(sv.host) + ':' + esc(sv.port) + '</span>' +
      (sv.has_local_db
        ? '<span style="background:#dcfce7;color:#166534;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase">local db ' + (sv.db_exists ? 'ready' : 'not created') + '</span>'
        : '<span style="background:#fee2e2;color:#b91c1c;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase">no local db</span>') +
      '<button type="button" class="btn ghost netUseBtn" data-host="' + esc(sv.host) + '" data-port="' + esc(sv.port) + '" style="margin-left:auto;font-size:11.5px;padding:5px 10px">Use this server →</button>' +
    '</div>';
  }).join('') + '</div>';
}

// ---- Terminals & access -----------------------------------------------------
// "Client" here means another PC running its own copy of the package. Those
// copies reach the database directly, so this list is built from what each
// instance registers about itself on its heartbeat, not from connections the
// server can see.
function fmtSeen(iso, online){
  if (online) return '<span style="color:#15803d;font-weight:700">● online</span>';
  if (!iso) return '<span style="color:var(--muted)">never connected</span>';
  var mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 60) return '<span style="color:var(--muted)">' + mins + ' min ago</span>';
  if (mins < 1440) return '<span style="color:var(--muted)">' + Math.floor(mins/60) + ' h ago</span>';
  return '<span style="color:var(--muted)">' + Math.floor(mins/1440) + ' d ago</span>';
}
function terminalRows(list, thisId){
  if (!list.length) return '<div style="color:var(--muted);font-size:12.5px">No terminals registered yet.</div>';
  var badge = { approved:['#dcfce7','#166534','allowed'], pending:['#fef3c7','#92400e','waiting'], blocked:['#fee2e2','#b91c1c','blocked'] };
  return '<div style="display:grid;gap:8px">' + list.map(function(t){
    var b = badge[t.status] || badge.pending;
    var isSelf = t.id === thisId;
    return '<div style="border:1px solid var(--line);border-radius:7px;padding:9px 12px">' +
      '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">' +
        '<span style="font-weight:700;font-size:12.5px">' + (t.is_db_host ? '🗄' : '🖥') + ' ' + esc(t.name || '(unnamed)') + '</span>' +
        '<span style="background:' + b[0] + ';color:' + b[1] + ';font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase">' + b[2] + '</span>' +
        (t.is_db_host ? '<span style="background:#e0e7ff;color:#3730a3;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase">database host</span>' : '') +
        (isSelf ? '<span style="background:#e0f2fe;color:#075985;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase">this screen</span>' : '') +
        (!t.terminal_uid ? '<span style="background:var(--card-soft2);color:var(--muted);font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase">pre-registered</span>' : '') +
        '<span style="margin-left:auto;font-size:11.5px">' + fmtSeen(t.last_seen, t.online) + '</span>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:3px">' +
        (t.address ? esc(t.address) + ':' + esc(t.port || '') + ' · ' : '') +
        (t.hostname ? esc(t.hostname) + ' · ' : '') +
        (t.app_version ? 'v' + esc(t.app_version) : '') +
        (t.approved_by_name ? ' · allowed by ' + esc(t.approved_by_name) : '') +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' +
        (t.status !== 'approved' ? '<button type="button" class="btn ok trmBtn" data-act="approved" data-id="' + t.id + '" style="font-size:11.5px;padding:5px 10px">✓ Allow</button>' : '') +
        (t.status !== 'blocked' && !t.is_db_host ? '<button type="button" class="btn trmBtn" data-act="blocked" data-id="' + t.id + '" style="font-size:11.5px;padding:5px 10px">⛔ Block</button>' : '') +
        (t.terminal_uid && !t.is_db_host ? '<button type="button" class="btn ghost trmKill" data-id="' + t.id + '" data-name="' + esc(t.name || '') + '" style="font-size:11.5px;padding:5px 10px" title="Sign everyone out on that machine now">⏏ Sign out now</button>' : '') +
        (!t.is_db_host ? '<button type="button" class="btn ghost trmDel" data-id="' + t.id + '" data-name="' + esc(t.name || '') + '" style="font-size:11.5px;padding:5px 10px;margin-left:auto">🗑 Forget</button>' : '') +
      '</div>' +
    '</div>';
  }).join('') + '</div>';
}

// 💻 Local / offline server — hosted build only. Hands out the portable
// edition's download + the unzip/run/connect steps. The browser can't install
// anything, so this is "download + do these 5 things", not a one-click wizard.
async function renderLocalServerPanel(box){
  if (!box) return;
  var HD = '<div style="padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px">💻 Set up an offline copy on a shop PC</div>';
  var d;
  try { d = await api('/api/admin/local-server'); }
  catch (e) { box.innerHTML = HD + '<div class="empty" style="padding:20px">Could not load: ' + esc(e.message) + '</div>'; return; }
  var def = d.defaults || {};
  var published = !!d.url;

  var fieldCss = 'width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:inherit;background:var(--card)';
  var lblCss = 'display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:3px';

  box.innerHTML = HD +
    '<div style="padding:16px 18px;font-size:13px;line-height:1.6">' +
      '<p style="margin:0 0 14px">Runs the shop on the local network when the internet is down. It carries its own PostgreSQL — ' +
        '<b>it does not sync with this hosted site</b>, so pick one as the source of truth.</p>' +

      (published ? '' :
        '<div style="background:#fef3c7;color:#92400e;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px">' +
          'No offline bundle has been published yet. Build the portable edition and set <code>LOCAL_SERVER_URL</code> in <code>wrangler.toml</code> — see <code>app/CUTOVER.md</code>. The installer button is disabled until then.' +
        '</div>') +

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;max-width:620px">' +
        '<div style="grid-column:1/-1"><label style="' + lblCss + '">Shop name (shown on the local server)</label>' +
          '<input id="lsShop" style="' + fieldCss + '" value="' + esc(def.shop_name || '') + '"/></div>' +
        '<div><label style="' + lblCss + '">Install folder on the PC</label>' +
          '<input id="lsDir" style="' + fieldCss + '" value="' + esc(def.install_dir || 'C:\\MortysAutoParts') + '"/></div>' +
        '<div><label style="' + lblCss + '">Local server port</label>' +
          '<input id="lsPort" type="number" min="1024" max="65535" style="' + fieldCss + '" value="' + esc(String(def.port || 3057)) + '"/></div>' +
        '<div><label style="' + lblCss + '">Admin sign-in email</label>' +
          '<input id="lsEmail" type="email" style="' + fieldCss + '" value="' + esc(def.admin_email || '') + '"/></div>' +
        '<div><label style="' + lblCss + '">Admin password (min 6 — creates the local login)</label>' +
          '<input id="lsPass" type="text" autocomplete="off" style="' + fieldCss + '" placeholder="choose a password"/></div>' +
        '<label style="grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer">' +
          '<input type="checkbox" id="lsFw"' + (def.open_firewall !== false ? ' checked' : '') + '/> Open the Windows firewall so the other tills can connect (TCP port + discovery UDP 41235)</label>' +
        '<label style="grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer">' +
          '<input type="checkbox" id="lsSvc"' + (def.install_service !== false ? ' checked' : '') + '/> Start automatically with Windows (install as a service)</label>' +
      '</div>' +

      '<div style="margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">' +
        '<button type="button" id="lsBuild"' + (published ? '' : ' disabled') +
          ' style="display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:0;padding:11px 22px;border-radius:8px;font-weight:700;font-size:13.5px;cursor:pointer' + (published ? '' : ';opacity:.5;cursor:not-allowed') + '">' +
          '⬇ Download configured installer</button>' +
        '<span id="lsMsg" style="font-size:12px;color:var(--muted)"></span>' +
      '</div>' +

      '<p style="margin:14px 0 0;color:var(--muted);font-size:12px">' +
        'Run the downloaded <code>.cmd</code> on the shop&rsquo;s main PC (double-click &rarr; approve the admin prompt). ' +
        'It downloads the offline bundle, sets up PostgreSQL, loads the database and creates your admin login — nothing else to do. ' +
        'Other tills then open <code>http://&lt;that PC&rsquo;s IP&gt;:' + esc(String(def.port || 3057)) + '/admin.html</code>. ' +
        'Full notes: <code>app/CUTOVER.md</code>.' +
      '</p>' +
    '</div>';

  var btn = box.querySelector('#lsBuild');
  var msg = box.querySelector('#lsMsg');
  if (btn && published) btn.addEventListener('click', async function(){
    var body = {
      shop_name: box.querySelector('#lsShop').value.trim(),
      install_dir: box.querySelector('#lsDir').value.trim(),
      port: parseInt(box.querySelector('#lsPort').value, 10) || 3057,
      admin_email: box.querySelector('#lsEmail').value.trim(),
      admin_password: box.querySelector('#lsPass').value,
      open_firewall: box.querySelector('#lsFw').checked,
      install_service: box.querySelector('#lsSvc').checked,
    };
    if (body.admin_password.length < 6) { msg.textContent = 'Set an admin password (at least 6 characters).'; msg.style.color = 'var(--red)'; return; }
    btn.disabled = true; msg.textContent = 'Building…'; msg.style.color = 'var(--muted)';
    try {
      var res = await fetch('/api/admin/local-server/installer', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      if (!res.ok) { var j = await res.json().catch(function(){ return {}; }); throw new Error(j.error || ('HTTP ' + res.status)); }
      var blob = await res.blob();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Install Morty\'s Auto Parts Offline.cmd';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      msg.textContent = '✓ Downloaded — run it on the shop PC.'; msg.style.color = '#15803d';
    } catch (e) {
      msg.textContent = '✗ ' + e.message; msg.style.color = 'var(--red)';
    } finally { btn.disabled = false; }
  });
}

// ☁ Off-site backup — configure shipping a full pg_dump to a hosted copy of
// this app (send side), or let another shop's server back up to this one
// (receive side). Self-contained: fetches its own state and re-renders itself.
async function renderBackupPanel(box){
  if (!box) return;
  var HD = '<div style="padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px">☁ Off-site backup</div>';
  var d;
  try { d = await api('/api/admin/backup'); }
  catch (e) {
    // On the hosted (Cloudflare) build the pg_dump/child_process backup can't
    // run — the database is Cloudflare D1, which has its own built-in backup.
    var host = (location.hostname || '').toLowerCase();
    var cloud = e.status === 501 || /not ported|D1|Cloudflare/i.test(e.message || '')
      || host === 'mortsautoparts.com' || /\.pages\.dev$/.test(host);
    if (cloud) {
      box.innerHTML = HD +
        '<div style="padding:16px 18px;font-size:13px;line-height:1.6">' +
          '<p style="margin:0 0 10px"><b>This install runs on Cloudflare</b>, so there is no pg_dump to ship anywhere — the database (Cloudflare&nbsp;D1) is backed up automatically:</p>' +
          '<ul style="margin:0 0 12px 18px;padding:0">' +
            '<li><b>Point-in-time restore (Time Travel)</b> — every write is retained for <b>30 days</b>; you can roll the whole database back to any second in that window. No setup, always on.</li>' +
            '<li><b>On-demand full export</b> — a complete <code>.sql</code> dump whenever you want one.</li>' +
            '<li><b>Deployment history</b> — every deploy of the site is versioned and one-click reversible in the Pages dashboard.</li>' +
          '</ul>' +
          '<div style="background:var(--card-soft,rgba(0,0,0,.04));border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;white-space:pre-wrap;overflow:auto">' +
            '# roll back to a moment in time\nnpx wrangler d1 time-travel restore mortysautoparts-db --timestamp=2026-08-31T12:00:00Z\n\n' +
            '# download a full dump now\nnpx wrangler d1 export mortysautoparts-db --remote --output backup.sql' +
          '</div>' +
          '<p style="margin:12px 0 0;color:var(--muted);font-size:12px">Restore is also available under D1 &rarr; mortysautoparts-db in the Cloudflare dashboard. See <code>app/CUTOVER.md</code> and the &ldquo;Dropped features&rdquo; note in <code>app/PORT.md</code>.</p>' +
        '</div>';
      return;
    }
    box.innerHTML = HD + '<div class="empty" style="padding:20px">Could not load: ' + esc(e.message) + '</div>';
    return;
  }
  var c = d.config || {}, last = d.last;
  var fld = 'padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card);color:var(--ink)';

  var lastLine = !last ? '<span style="color:var(--muted)">No backup run yet.</span>'
    : (last.ok
        ? '<span style="color:#15803d;font-weight:700">✓ ' + fmtDate(last.at) + '</span> · ' + (last.bytes ? (last.bytes/1048576).toFixed(1) + ' MB' : '') + ' · <code style="font-size:11px">' + esc(last.filename || '') + '</code>'
        : '<span style="color:#b91c1c;font-weight:700">✗ ' + fmtDate(last.at) + '</span> · ' + esc(last.error || 'failed') + (last.network ? ' <small style="color:var(--muted)">(will retry when the internet returns)</small>' : ''));

  var recentRows = (d.recent || []).map(function(r){
    return '<tr><td>' + fmtDate(r.created_at) + '</td>' +
      '<td>' + (r.direction === 'in' ? '⬇ received' : '⬆ sent') + '</td>' +
      '<td>' + (r.ok ? '<span style="color:#15803d">ok</span>' : '<span style="color:#b91c1c">failed</span>') + '</td>' +
      '<td>' + (r.bytes ? (r.bytes/1048576).toFixed(1) + ' MB' : '—') + '</td>' +
      '<td><small style="color:var(--muted)">' + esc(r.note || r.filename || '') + '</small></td></tr>';
  }).join('');

  box.innerHTML =
    '<div style="padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px">☁ Off-site backup</div>' +
    (d.is_db_host ? '' : '<div style="padding:10px 16px;background:#fef3c7;color:#92400e;font-size:12px">This machine is a terminal, not the database host — it does not run backups. Configure this on the shop server.</div>') +

    '<div style="padding:14px 16px;border-bottom:1px solid var(--line)">' +
      '<label style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:10px">' +
        '<input type="checkbox" id="bkEnabled"' + (c.enabled ? ' checked' : '') + '/> Back this database up to our online server</label>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px">' +
        '<div style="grid-column:1/-1"><label class="lbl">Online server URL</label><input id="bkUrl" style="' + fld + ';width:100%" value="' + esc(c.url || '') + '" placeholder="https://app.mortsautoparts.com"/></div>' +
        '<div style="grid-column:1/-1"><label class="lbl">Backup key <small style="color:var(--muted)">— from that server’s own Settings → Off-site backup</small></label>' +
          '<input id="bkKey" type="password" style="' + fld + ';width:100%" placeholder="' + (c.key_set ? '•••••••• (leave blank to keep)' : 'paste the key') + '"/></div>' +
        '<div><label class="lbl">Back up every</label><select id="bkEvery" style="' + fld + '">' +
          [1,2,3,6,12,24,48].map(function(h){ return '<option value="' + h + '"' + (Number(c.every_hours) === h ? ' selected' : '') + '>' + (h < 24 ? h + ' hours' : (h/24) + ' day' + (h > 24 ? 's' : '')) + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="lbl">Keep on this PC</label><input id="bkKeep" type="number" min="1" max="365" style="' + fld + '" value="' + (c.keep || 14) + '"/></div>' +
        '<div style="grid-column:1/-1"><label style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px">' +
          '<input type="checkbox" id="bkCatchUp"' + (c.catch_up ? ' checked' : '') + '/> Also catch up as soon as the internet comes back after a failed attempt</label></div>' +
      '</div>' +
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
        '<button type="button" class="btn ok" id="bkSave">Save</button>' +
        '<button type="button" class="btn" id="bkTest">Test connection</button>' +
        '<button type="button" class="btn" id="bkRun"' + (d.is_db_host ? '' : ' disabled') + '>Back up now</button>' +
        '<button type="button" class="btn" id="bkRestore" style="background:#fee2e2;color:#b91c1c"' + (d.is_db_host ? '' : ' disabled') + '>Restore latest…</button>' +
        '<span id="bkMsg" style="font-size:12px"></span>' +
      '</div>' +
      '<div style="margin-top:10px;font-size:12px">Last backup: ' + lastLine + '</div>' +
    '</div>' +

    (recentRows ? '<div style="padding:10px 16px;border-bottom:1px solid var(--line)"><div class="lbl" style="margin-bottom:4px">Recent activity</div>' +
      '<table style="width:100%;font-size:12px"><tbody>' + recentRows + '</tbody></table></div>' : '') +

    '<details style="padding:12px 16px"><summary style="cursor:pointer;font-weight:700;font-size:12.5px">Receive backups from another Morty\'s Auto Parts server</summary>' +
      '<p style="font-size:12px;color:var(--muted);margin:8px 0">Turn this on only on the copy that runs on the internet. Give the key below to the shop server so it can send its backups here.</p>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<input id="bkRecvKey" readonly style="' + fld + ';flex:1;min-width:220px;font-family:ui-monospace,monospace" value="' + (d.receive_key_set ? '(click Show)' : 'not set') + '"/>' +
        '<button type="button" class="btn" id="bkRecvShow">Show</button>' +
        '<button type="button" class="btn" id="bkRecvGen">' + (d.receive_key_set ? 'Regenerate' : 'Generate key') + '</button>' +
      '</div>' +
    '</details>';

  var msg = box.querySelector('#bkMsg');
  function say(t, bad){ msg.textContent = t; msg.style.color = bad ? 'var(--red)' : 'var(--muted)'; }

  box.querySelector('#bkSave').addEventListener('click', async function(){
    say('Saving…');
    var body = {
      enabled: box.querySelector('#bkEnabled').checked,
      url: box.querySelector('#bkUrl').value.trim(),
      every_hours: parseInt(box.querySelector('#bkEvery').value, 10),
      keep: parseInt(box.querySelector('#bkKeep').value, 10),
      catch_up: box.querySelector('#bkCatchUp').checked,
    };
    var k = box.querySelector('#bkKey').value.trim();
    if (k) body.key = k;
    try { await api('/api/admin/backup', { method: 'POST', body: body }); renderBackupPanel(box); }
    catch (e) { say(e.message, true); }
  });
  box.querySelector('#bkTest').addEventListener('click', async function(){
    say('Testing…');
    try {
      var r = await api('/api/admin/backup/test', { method: 'POST', body: {
        url: box.querySelector('#bkUrl').value.trim(),
        key: box.querySelector('#bkKey').value.trim() || undefined,
      }});
      if (r.ok) say('✓ Reached ' + (r.server || 'the server') + ' — key accepted.');
      else say('✗ ' + (r.error || 'failed'), true);
    } catch (e) { say(e.message, true); }
  });
  box.querySelector('#bkRun').addEventListener('click', async function(){
    if (this.disabled) return;
    this.disabled = true; say('Backing up… (this can take a minute)');
    try {
      var r = await api('/api/admin/backup/run', { method: 'POST' });
      if (r.ok) say('✓ Backed up — ' + (r.bytes/1048576).toFixed(1) + ' MB uploaded.');
      else say('✗ ' + (r.error || 'failed'), true);
    } catch (e) { say(e.message, true); }
    setTimeout(function(){ renderBackupPanel(box); }, 1200);
  });
  box.querySelector('#bkRestore').addEventListener('click', async function(){
    if (this.disabled) return;
    if (!confirm('Restore the newest off-site backup OVER this database?\n\nEverything currently in the local database is replaced with the last uploaded copy. The server restarts afterwards. Do this only to recover a broken machine.')) return;
    var typed = prompt('This cannot be undone. Type RESTORE to proceed.');
    if (typed !== 'RESTORE') return;
    say('Restoring… the server will restart when done.');
    try {
      var r = await api('/api/admin/backup/restore', { method: 'POST', body: { confirm: 'RESTORE' } });
      if (r.ok) say('✓ Restored ' + esc(r.restored) + '. The server is restarting — reload this page in a moment.');
      else say('✗ ' + (r.error || 'failed'), true);
    } catch (e) { say(e.message, true); }
  });
  box.querySelector('#bkRecvShow').addEventListener('click', async function(){
    try { var r = await api('/api/admin/backup/receive-key'); box.querySelector('#bkRecvKey').value = r.key || 'not set'; }
    catch (e) { say(e.message, true); }
  });
  box.querySelector('#bkRecvGen').addEventListener('click', async function(){

    catch (e) { say(e.message, true); }
  });
}

          '<div style="font-size:11px;color:var(--muted);margin-bottom:10px">The port the app server listens on. Saving does not restart the server — re-run <code>Start Morty\'s Auto Parts.bat</code> (or restart the Node process) for a changed port to take effect. There\'s no "fallback" port; this process listens on exactly one.</div>' +
          '<div id="setSrvMsg" style="display:none;padding:10px 14px;border-radius:7px;font-size:12.5px;margin-bottom:10px"></div>' +

        '</div>' +
      '</div>' )) +

      '<div class="panel" id="backupPanel" style="margin-top:16px"><div class="empty" style="padding:24px">Loading backup settings…</div></div>' +
    '</div>';

  renderBackupPanel(panel.querySelector('#backupPanel'));

  document.getElementById('setMachineSaveBtn').addEventListener('click', async function(){
    var msg = document.getElementById('setMachineMsg');

  var scanBtn = document.getElementById('setScanBtn');
  var netServersEl = document.getElementById('setNetServers');

        if (hostFld) hostFld.value = b.getAttribute('data-host');

        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });

  // ---- Terminals & access ---------------------------------------------------
  // Every action re-reads the whole list rather than patching the clicked row:
  // approving one machine can change another (switching to "automatically"
  // clears the whole waiting queue), and a stale row here is a machine someone
  // believes is blocked when it is not.
  async function reloadTerminals(){
    var el = document.getElementById('trmList');
    if (!el) return;
    try {
      var r = await api('/api/admin/terminals');
      el.innerHTML = terminalRows(r.terminals || [], r.this_terminal_id);
      wireTerminals();
    } catch (e) {
      el.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">' + esc(e.message) + '</div>';
    }
  }
  function wireTerminals(){
    document.querySelectorAll('.trmBtn').forEach(function(b){
      b.addEventListener('click', async function(){
        b.disabled = true;
        try { await api('/api/admin/terminals/' + b.dataset.id, { method:'PATCH', body:{ status: b.dataset.act } }); }
        catch (e) { alert(e.message); }
        reloadTerminals();
      });
    });
    document.querySelectorAll('.trmKill').forEach(function(b){
      b.addEventListener('click', async function(){
        if (!confirm('Sign everyone out on "' + (b.dataset.name || 'that machine') + '" now?\n\nAnything not yet saved there is lost. The machine stays allowed and can be signed back into straight away.')) return;
        b.disabled = true;
        try { await api('/api/admin/terminals/' + b.dataset.id + '/terminate', { method:'POST' }); }
        catch (e) { alert(e.message); }
        reloadTerminals();
      });
    });
    document.querySelectorAll('.trmDel').forEach(function(b){
      b.addEventListener('click', async function(){
        if (!confirm('Forget "' + (b.dataset.name || 'that machine') + '"?\n\nIf it is still switched on it will reappear on its next check — as waiting, if new machines need approval.')) return;
        b.disabled = true;
        try { await api('/api/admin/terminals/' + b.dataset.id, { method:'DELETE' }); }
        catch (e) { alert(e.message); }
        reloadTerminals();

  var trmRefresh = document.getElementById('trmRefresh');
  if (trmRefresh) trmRefresh.addEventListener('click', reloadTerminals);
  document.querySelectorAll('input[name="trmMode"]').forEach(function(r){
    r.addEventListener('change', async function(){
      var msg = document.getElementById('trmModeMsg');
      if (this.value === 'open' && !confirm('Let any machine on this network connect without asking?\n\nAnything currently waiting is allowed immediately.')) {

  // The token comes back exactly once -- the server keeps only its hash, so
  // there is no "show it again" to build. Hence rendering it big, with copy
  // buttons, and saying plainly that it will not be shown twice.
  var trmLinkBtn = document.getElementById('trmLinkBtn');
  if (trmLinkBtn) trmLinkBtn.addEventListener('click', async function(){
    var out = document.getElementById('trmLinkOut');
    trmLinkBtn.disabled = true; trmLinkBtn.textContent = 'Creating…';
    try {
      var r = await api('/api/admin/terminals/enrol-link', { method:'POST', body:{
        label: document.getElementById('trmLinkLabel').value.trim(),
        minutes: parseInt(document.getElementById('trmLinkMins').value, 10)
      }});
      var mins = Math.max(1, Math.round((new Date(r.expires_at) - Date.now()) / 60000));
      out.style.display = 'block';
      out.innerHTML =
        '<div style="font-size:11.5px;color:var(--muted);margin-bottom:6px">Paste this on the new machine — it is shown <b>once</b> and expires in about ' + mins + ' minutes.</div>' +
        '<div style="font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 11px" id="trmLinkUrl">' + esc(r.link) + '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">' +
          '<button type="button" class="btn" id="trmCopyLink" style="font-size:11.5px;padding:5px 10px">📋 Copy link</button>' +
          '<button type="button" class="btn ghost" id="trmCopyCode" style="font-size:11.5px;padding:5px 10px">📋 Copy code only</button>' +
          '<span style="font-family:ui-monospace,Consolas,monospace;font-size:12.5px;letter-spacing:1px;color:var(--muted)">' + esc(r.code) + '</span>' +
        '</div>';
      // execCommand fallback: the shop runs over plain HTTP, and
      // navigator.clipboard is unavailable outside a secure context in most
      // browsers -- which is exactly this situation, not an edge case.
      function copy(text, btn){
        var done = function(){ var t = btn.textContent; btn.textContent = '✓ Copied'; setTimeout(function(){ btn.textContent = t; }, 1400); };
        if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, function(){}); return; }
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (_) {}
        document.body.removeChild(ta);
      }
      document.getElementById('trmCopyLink').addEventListener('click', function(){ copy(r.link, this); });
      document.getElementById('trmCopyCode').addEventListener('click', function(){ copy(r.code, this); });
    } catch (e) {
      out.style.display = 'block';
      out.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">' + esc(e.message) + '</div>';
    }
    trmLinkBtn.disabled = false; trmLinkBtn.textContent = '🔗 Create a connection link';
  });

  var trmAdd = document.getElementById('trmAddBtn');
  if (trmAdd) trmAdd.addEventListener('click', async function(){

  function dbFieldValues(prefix){
    return {
      host: document.getElementById(prefix + 'Host').value.trim(),
      port: parseInt(document.getElementById(prefix + 'Port').value, 10) || 5432,
      database: document.getElementById(prefix + 'Db').value.trim(),

  ['dbLocal', 'dbOnline'].forEach(function(prefix){
    var testBtn = document.getElementById(prefix + 'Test');

    testBtn.addEventListener('click', async function(){

    var msg = document.getElementById('setDbMsg');

    } finally {
      dbSaveBtn.disabled = false;
    }
  });

  var dbRefreshBtn = document.getElementById('dbRefreshBtn');
  if (dbRefreshBtn) dbRefreshBtn.addEventListener('click', function(){ renderSettings(panel); });

  var dbCreateBtn = document.getElementById('dbCreateBtn');
  if (dbCreateBtn) dbCreateBtn.addEventListener('click', async function(){
    dbCreateBtn.disabled = true; dbCreateBtn.textContent = 'Creating…';
    try {
      await api('/api/admin/settings/db-server/create-database', { method: 'POST' });
      renderSettings(panel);
    } catch (e) {
      alert('Could not create the database: ' + e.message);
      dbCreateBtn.disabled = false; dbCreateBtn.textContent = 'Create the app database';
    }
  });

  var dbInstallBtn = document.getElementById('dbInstallBtn');
  if (dbInstallBtn) dbInstallBtn.addEventListener('click', async function(){
    if (!confirm('This runs the real PostgreSQL installer on the server machine (Windows, via winget). It can take several minutes and may need a permission prompt approved on that machine. Continue?')) return;
    var msg = document.getElementById('dbInstallMsg');
    dbInstallBtn.disabled = true; dbInstallBtn.textContent = '⏳ Installing…';
    msg.style.color = 'var(--muted)'; msg.textContent = 'Started — polling for completion…';

    }
    // Poll until the server reports the install finished, then refresh the
    // whole panel so the status/buttons reflect reality.
    var poll = setInterval(async function(){
      var st;
      try { st = await api('/api/admin/settings/db-server-status'); } catch (_) { return; }
      if (!st.install || !st.install.running) {
        clearInterval(poll);

  var srvSaveBtn = document.getElementById('setSrvSaveBtn');
  if (srvSaveBtn) srvSaveBtn.addEventListener('click', async function(){

      var r = await api('/api/admin/settings/server', { method: 'PATCH', body: { port: parseInt(document.getElementById('srvPort').value, 10) } });
      msg.style.background = '#dcfce7'; msg.style.color = '#166534';
      msg.textContent = r.restart_required

        : 'Saved.';

      msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
    } finally {
      srvSaveBtn.disabled = false;
    }
  });
}

async function submitSettings(){
  var msg = document.getElementById('setMsg');
  var btn = document.getElementById('setSaveBtn');
  msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';
  btn.disabled = true;
  try {
    var body = {
      company_name: document.getElementById('setName').value.trim(),
      address: document.getElementById('setAddress').value.trim(),
      country: document.getElementById('setCountry').value.trim(),
      phone: document.getElementById('setPhone').value.trim(),
      email: document.getElementById('setEmail').value.trim() || null,
      website: document.getElementById('setWebsite').value.trim() || null,
      print_logo_on_invoice: document.getElementById('setPrintLogo').checked,
      default_print_template: document.getElementById('setDefaultTpl').value,
      quote_valid_days: parseInt(document.getElementById('setQuoteDays').value, 10) || 14,
      invoice_notice: document.getElementById('setInvoiceNotice').value.trim(),
      receipt_notice: document.getElementById('setReceiptNotice').value.trim(),
      statement_notice: document.getElementById('setStatementNotice').value.trim(),
      storefront_prices: !!(document.getElementById('setStorefrontPrices') || {}).checked,
      pos_enforce_login: !!(document.getElementById('setPosEnforceLogin') || {}).checked,
      pos_enforce_customer: !!(document.getElementById('setPosEnforceCustomer') || {}).checked,
      pos_default_fulfilment: (document.getElementById('setPosDefaultFul') || {}).value || null,
    };
    await api('/api/admin/settings', { method: 'PATCH', body: body });
    // Reflect immediately in POS_SHOP so a sale rung up right after saving
    // (no page reload) prints with the new info, not what loaded at page-open.
    Object.assign(POS_SHOP, {
      name: body.company_name, address: body.address, country: body.country, phone: body.phone,
      email: body.email, website: body.website, print_logo: body.print_logo_on_invoice,
      default_print_template: body.default_print_template,
      invoice_notice: body.invoice_notice, receipt_notice: body.receipt_notice, statement_notice: body.statement_notice,
    });
    msg.style.background = '#dcfce7'; msg.style.color = '#166534'; msg.textContent = 'Saved.';
  } catch (e) {
    msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

  }

// =============================================================================
//  init() — called after successful sign-in (also on initial load if already
//  authenticated). Builds the sidebar and shows the default tab.
// =============================================================================
// =============================================================================
//  TERMINAL PRESENCE — heartbeat + live "N terminals connected" count
// =============================================================================
// Every admin / POS browser keeps a stable id in localStorage and POSTs it to
// /api/admin/presence about once a minute. The server counts the beats it has
// seen recently; the POS ticket bar shows owners and managers how many tills
// are connected to the admin right now.
var TERMINALS_ONLINE = null;   // last count from the server; null = not known yet
var TERMINAL_ID = null;

function terminalId(){
  if (TERMINAL_ID) return TERMINAL_ID;
  var id = null;
  try { id = localStorage.getItem('mh_terminal_id'); } catch (_) {}
  if (!id) {
    id = 'T-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    try { localStorage.setItem('mh_terminal_id', id); } catch (_) {}
  }
  TERMINAL_ID = id;
  return id;
}
function terminalLabel(){
  try { var l = localStorage.getItem('mh_terminal_label'); if (l) return l; } catch (_) {}
  return 'Till ' + terminalId().slice(-4).toUpperCase();
}
function terminalAgo(ts){
  if (!ts) return '';
  var s = Math.max(0, Math.round((Date.now() - new Date((ts.indexOf('Z') < 0 && ts.indexOf('T') > 0 ? ts + 'Z' : ts.replace(' ', 'T') + 'Z'))) / 1000));
  if (s < 45) return 'just now';
  if (s < 5400) return Math.round(s / 60) + ' min ago';
  return Math.round(s / 3600) + ' h ago';
}
function renderTerminalList(){
  var box = document.getElementById('posTermList');
  if (!box) return;
  var list = (window.__presenceTerminals || []).slice()
    .sort(function(a, b){ return (b.is_self ? 1 : 0) - (a.is_self ? 1 : 0) || String(b.last_seen).localeCompare(String(a.last_seen)); });
  box.innerHTML =
    '<div style="padding:8px 11px;font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)">' +
      list.length + ' terminal' + (list.length === 1 ? '' : 's') + ' online</div>' +
    (list.length
      ? list.map(function(t){
          return '<div style="padding:8px 11px;border-bottom:1px solid var(--hover)">' +
            '<div style="display:flex;align-items:center;gap:6px">' +
              '<span style="width:8px;height:8px;border-radius:50%;flex:none;background:#22c55e"></span>' +
              '<b style="font-size:12px">🖥 ' + esc(t.label || 'Terminal') + '</b>' +
              (t.is_self ? '<span style="margin-left:auto;font-size:9px;color:var(--muted)">this screen</span>' : '') +
            '</div>' +
            '<div style="font-size:10px;color:var(--muted);margin-top:2px">' +
              (t.user_name ? esc(t.user_name) + ' · ' : '') + (terminalAgo(t.last_seen) || 'active') + '</div>' +
          '</div>';
        }).join('')
      : '<div style="padding:14px 11px;font-size:12px;color:var(--muted)">No other terminals right now.</div>');
}
function paintTerminalCount(){
  var wrap = document.getElementById('posTermCountWrap');
  var el = document.getElementById('posTermCount');
  if (!wrap || !el) return;
  if (TERMINALS_ONLINE == null) { wrap.style.display = 'none'; return; }
  var n = TERMINALS_ONLINE;
  wrap.style.display = 'inline-flex';
  el.textContent = '👥 ' + n + ' ' + (n === 1 ? 'terminal' : 'terminals') + ' ▾';
  el.title = n + ' terminal' + (n === 1 ? '' : 's') +
    ' connected to the admin in the last few minutes (this one included). Click for the list.';
  var box = document.getElementById('posTermList');
  if (box && box.style.display === 'block') renderTerminalList();
}
async function presenceBeat(){
  try {
    var r = await api('/api/admin/presence', {
      method: 'POST',
      body: { terminal_id: terminalId(), label: terminalLabel() },
    });
    if (r && typeof r.online === 'number') {
      TERMINALS_ONLINE = r.online;
      window.__presenceTerminals = r.terminals || [];
    }
  } catch (_) { /* not permitted / offline — keep the last known count */ }
  paintTerminalCount();
}
function startTerminalPresence(){
  if (window.__presenceTimer) clearInterval(window.__presenceTimer);
  presenceBeat();
  window.__presenceTimer = setInterval(presenceBeat, 60000);
  if (!window.__presenceVisWired) {
    window.__presenceVisWired = true;
    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) presenceBeat();
    });
  }
}

async function init(){
  try {
    buildSidebar();
    startTerminalPresence();
    try { await loadSummary(); } catch (_) {}
    // The screen this person wants to land on. POS Terminal stays the default
    // -- this is a counter-sales app first -- but someone who lives in Reports
    // or Warehouse should not have to click past the till every morning.
    // Checked against the renderer table so a saved tab that has since been
    // removed, or one this role may not see, falls back rather than erroring.
    var landing = POS_PREFS && POS_PREFS.landingTab;
    var hidden = (MY_ROLE && Array.isArray(MY_ROLE.hidden_tabs)) ? MY_ROLE.hidden_tabs : [];
    if (!landing || !renderers[landing] || hidden.indexOf(landing) !== -1) landing = null;
    await show(currentTab || landing || 'pos');
  } catch (e) {
    console.warn('[init] failed:', e);
    var p = document.getElementById('panel');
    if (p) p.innerHTML = '<div class="empty">Failed to load: ' + esc(e.message) + '</div>';
  }
}

// =============================================================================
//  BOOT — check existing session; show signin or proceed to admin UI.
// =============================================================================
document.addEventListener('DOMContentLoaded', async function(){
  var bg = document.getElementById('signinBg');
  if (!bg) return;
  try {
    var r = await api('/api/me');
    if (r && r.user && r.user.is_admin) {
      bg.classList.remove('show');
      CURRENT_ADMIN_ROLE = r.user.admin_role || 'manager';
      CURRENT_ADMIN_ID = r.user.id;
      CURRENT_ADMIN_NAME = r.user.name || r.user.email || null;
      MY_PERMS = r.user.perms || {}; MY_PERMS_FULL = r.user.perms_full !== false;
      // Before init(), which builds the sidebar from it.
      await loadMyRole();
      await posInitPrefsForUser();   // local cache first, then the user's saved prefs
      applyUserPrefsToChrome();      // theme + sidebar, now that their copy has arrived
      var who = document.getElementById('whoLabel');
      if (who) who.textContent = (r.user.name || r.user.email) + ' · ' + CURRENT_ADMIN_ROLE;
      init();
    } else {
      bg.classList.add('show');
      checkDbUp();   // say so up front if the database is the reason
      var em = document.getElementById('adEmail'); if (em) em.focus();
    }
  } catch (e) {
    bg.classList.add('show');
    checkDbUp();   // /api/me failing may itself be the database being down
    var em2 = document.getElementById('adEmail'); if (em2) em2.focus();
  }
});

</script>
