<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Morty's Auto Parts</title>
<meta name="robots" content="noindex,nofollow" />
<script>
// Set the theme before first paint so there's no flash of the wrong colors.
// The click handler that flips this (and re-saves it) lives with the rest of
// the header wiring near the bottom of the main script, next to signoutBtn.
(function(){
  try {
    var t = localStorage.getItem('mh_theme');
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  } catch (_) {}
})();
</script>
<style>
  :root{
    --red:#d62828; --red-dark:#a31f1f;
    --sky:#0ea5e9; --sky-dark:#0284c7;
    --navy:#0b1b2b; --ink:#0f1720;
    --muted:#6b7280; --bg:#f6f7f9;
    --card:#fff; --line:#e5e7eb;
    --ok:#16a34a; --warn:#f59e0b;
    --card-soft:#fafafa; --card-soft2:#f3f4f6; --hover:#f1f5f9;
    /* Card/panel heading text -- same navy as the brand color in light mode,
       but --navy itself stays a fixed dark brand color in both themes (it's
       also used as a background -- header, sidebar, buttons -- which must
       stay dark-navy regardless of theme), so a plain dark-on-dark swap of
       --navy would go illegible on a dark card. Headings get their own token. */
    --heading:#0b1b2b;
  }
  /* Dark mode: same brand/status colors (red/sky/navy/ok/warn already read fine
     on both), only the neutral surface + text tokens swap. Toggled via a
     data-theme attribute on <html> set by the anti-flash script in <head>
     and by #themeToggle's click handler (see bottom of the main script). */
  :root[data-theme="dark"]{
    color-scheme:dark;
    /* High-contrast text everywhere in dark mode: body + headings pure white,
       secondary/label text a bright near-white (readable, still a step down). */
    --ink:#ffffff; --muted:#e2e8f0; --bg:#0d1420;
    --card:#17202e; --line:#2b3648;
    --card-soft:#1e2836; --card-soft2:#232e3f; --hover:#263244;
    --heading:#ffffff;
  }
  /* Catch text that hard-codes a low-contrast grey (inline styles / other
     rules) so nothing stays dim on a dark surface. */
  :root[data-theme="dark"] .sidebar,
  :root[data-theme="dark"] .sidebar .grp-title:hover,
  :root[data-theme="dark"] .badge.expired{ color:#e6ebf3; }
  :root[data-theme="dark"] [style*="color:#6b7280"],
  :root[data-theme="dark"] [style*="color:#64748b"],
  :root[data-theme="dark"] [style*="color:#6B7280"],
  :root[data-theme="dark"] [style*="color:#4b5563"],
  :root[data-theme="dark"] [style*="color:#475569"],
  :root[data-theme="dark"] [style*="color:#9ca3af"],
  :root[data-theme="dark"] [style*="color:#94a3b8"],
  :root[data-theme="dark"] [style*="color:#cbd5e1"],
  :root[data-theme="dark"] [style*="color:#94a3b8"],
  :root[data-theme="dark"] [style*="color: var(--muted)"],
  :root[data-theme="dark"] [style*="color:var(--muted)"]{ color:#e2e8f0 !important; }
  /* END THEME VARS */
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  a{color:inherit}
  header.top{background:var(--navy);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
  header.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.3px}
  header.top .who{font-size:13px;color:#cbd5e1;display:flex;gap:10px;align-items:center}
  header.top a.home{color:#94a3b8;text-decoration:none;font-size:13px}
  header.top a.home:hover{color:#fff}
  header.top button{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
  header.top button:hover{background:rgba(255,255,255,.08)}
  header.top button#themeToggle{padding:6px 10px;font-size:15px;line-height:1}
  .wrap{max-width:1480px;margin:0 auto;padding:0;display:grid;grid-template-columns:240px 1fr;gap:0;align-items:start}
  .sidebar{background:#0b1b2b;color:var(--line);padding:10px 0 40px;position:sticky;top:0;overflow-y:auto;height:100vh}
  .sidebar::-webkit-scrollbar{width:7px}
  .sidebar::-webkit-scrollbar-track{background:transparent}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
  .sidebar::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.30)}
  .sidebar .grp{margin-bottom:8px}
  .sidebar .grp-title{padding:6px 14px;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#94a3b8;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;border-radius:4px}
  .sidebar .grp-title:hover{background:rgba(255,255,255,.05);color:var(--line)}
  .sidebar .grp-title .chev{transition:transform .15s;font-size:10px;opacity:.6}
  .sidebar .grp.collapsed .grp-title .chev{transform:rotate(-90deg)}
  .sidebar .grp.collapsed .grp-items{display:none}
  .sidebar .grp-items{padding-top:2px}
  .sidebar .item{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 18px;font-size:13px;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;font-family:inherit;background:none;border-top:0;border-right:0;border-bottom:0;width:100%;text-align:left}
  .sidebar .item:hover{background:rgba(255,255,255,.05);color:#fff}
  .sidebar .item.active{background:rgba(14,165,233,.18);border-left-color:var(--sky);color:#fff;font-weight:700}
  .sidebar .item .star{margin-left:auto;color:#475569;cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:3px}
  .sidebar .item .star:hover{background:rgba(255,255,255,.08);color:#ffb703}
  .sidebar .item .star.on{color:#ffb703}
  .sidebar .item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sidebar .empty-fav{padding:5px 18px;font-size:11px;color:#64748b;font-style:italic}
  /* Account footer — pinned to the bottom of the nav rail */
  .sidebar .sb-foot{position:sticky;bottom:0;margin-top:12px;padding:10px 14px 14px;background:#0b1b2b;border-top:1px solid rgba(255,255,255,.12)}
  .sidebar .sb-who{display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:700;color:#cbd5e1;margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sidebar .sb-who small{color:#94a3b8;font-weight:600;text-transform:capitalize}
  .sidebar .sb-signout{width:100%;padding:8px 10px;background:rgba(214,40,40,.16);color:#fecaca;border:1px solid rgba(214,40,40,.4);border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .sidebar .sb-signout:hover{background:rgba(214,40,40,.30);color:#fff}
  .sidebar .sb-signin{background:rgba(14,165,233,.18);color:#bae6fd;border-color:rgba(14,165,233,.45)}
  .sidebar .sb-signin:hover{background:rgba(14,165,233,.32);color:#fff}
  .content-area{padding:18px 22px;min-width:0}
  .menu-toggle{display:none}
  .wrap{transition:grid-template-columns .15s}
  .sbCollapseBtn{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.08);color:#94a3b8;padding:10px 0;cursor:pointer;font-size:12px;font-weight:700;text-align:center;font-family:inherit;letter-spacing:.3px}
  .sbCollapseBtn:hover{background:rgba(255,255,255,.06);color:#fff}
  @media (min-width:901px){
    /* Whole-sidebar collapse (desktop) -- separate from the existing
       per-group collapse (grp-title/chev, above): this hides the entire
       nav down to a slim rail with just the expand button, to reclaim
       width for the content area (the POS terminal in particular wants
       every inch it can get). Group-level collapse still works normally
       whenever the sidebar itself isn't collapsed. */
    .wrap.sb-collapsed{grid-template-columns:44px 1fr}
    .wrap.sb-collapsed .sidebar .grp{display:none}
  }
  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;display:block}
    .sidebar{position:fixed;left:-260px;top:0;bottom:0;width:240px;height:100vh;z-index:200;transition:left .2s;box-shadow:4px 0 16px rgba(0,0,0,.3)}
    .sidebar.show{left:0}
    .content-area{padding:14px}
    .menu-toggle{display:inline-block;background:var(--navy);color:#fff;border:0;padding:7px 12px;border-radius:6px;font-weight:700;cursor:pointer;font-family:inherit}
    /* The whole-sidebar collapse toggle is desktop-only -- on mobile the
       sidebar is already off-canvas by default and opened via ☰ Menu, so
       a second collapse control would be redundant. */
    .sbCollapseBtn{display:none}
  }
  .sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190}
  .sb-overlay.show{display:block}

  /* Full screen (POS terminal). CSS-only, independent of the browser
     Fullscreen API (which may be blocked) -- this is what actually does the
     work. It keeps the collapsible sidebar and the #posFooter status strip
     (company name / result count / clock); only the page header and the KPI
     tiles go, which is the vertical room worth reclaiming. Zero top padding
     lines the cart's top edge up with the sidebar's; 8px at the bottom keeps
     the CHECKOUT footer clear of the status strip. posSizeShell() sizes the
     shell to whatever is left. */
  body.pos-fullscreen header.top,
  body.pos-fullscreen .tiles { display:none !important; }
  body.pos-fullscreen .wrap { max-width:none; }
  body.pos-fullscreen .content-area { padding:0 8px 8px; }

  /* Big red X to leave the full-screen POS terminal. Only visible in
     fullscreen; fixed to the top-right corner above everything. */
  #posCloseTerminal{
    position:fixed; top:10px; right:12px; z-index:100000; display:none;
    width:46px; height:46px; border:0; border-radius:50%; cursor:pointer;
    background:#d62828; color:#fff; font:800 26px/1 system-ui,sans-serif;
    align-items:center; justify-content:center; padding:0;
    box-shadow:0 4px 16px rgba(214,40,40,.55), 0 0 0 3px rgba(255,255,255,.85);
    transition:transform .12s ease, background .12s ease, box-shadow .12s ease;
  }
  body.pos-fullscreen #posCloseTerminal{ display:flex; }
  #posCloseTerminal:hover, #posCloseTerminal:focus-visible{
    background:#a31f1f; transform:scale(1.14); outline:0;
    box-shadow:0 8px 24px rgba(163,31,31,.7), 0 0 0 4px rgba(255,255,255,.95);
  }
  #posCloseTerminal::after{
    content:"Close terminal"; position:absolute; top:50%; right:56px;
    transform:translateY(-50%) scale(.9); transform-origin:right center;
    background:#0a0a0c; color:#fff; font:700 12.5px/1 system-ui,sans-serif;
    letter-spacing:.02em; padding:7px 11px; border-radius:7px; white-space:nowrap;
    box-shadow:0 6px 18px rgba(0,0,0,.35); opacity:0; pointer-events:none;
    transition:opacity .12s ease, transform .12s ease;
  }
  #posCloseTerminal:hover::after, #posCloseTerminal:focus-visible::after{
    opacity:1; transform:translateY(-50%) scale(1);
  }

  .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:24px}
  @media(max-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:540px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  .tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
  .tile .val{font-size:28px;font-weight:900;color:var(--heading);line-height:1;margin-top:6px}
  .tile.warn .val{color:var(--warn)}
  .tile.alert .val{color:var(--red)}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;background:var(--card);padding:6px 6px 0;border-radius:10px 10px 0 0}
  .tabs button{background:transparent;border:none;padding:10px 16px;border-radius:8px 8px 0 0;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit;white-space:nowrap}
  .tabs button.active{background:var(--navy);color:#fff}
  .tabs button:hover:not(.active){background:var(--hover);color:var(--ink)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--card-soft);text-align:left;padding:10px 12px;font-weight:700;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.5px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:hover td{background:var(--card-soft)}
  td.actions{white-space:nowrap}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .badge.new{background:#fef3c7;color:#92400e}
  .badge.pending{background:#dbeafe;color:#1e40af}
  .badge.confirmed{background:#d1fae5;color:#065f46}
  .badge.completed{background:#e0e7ff;color:#3730a3}
  .badge.cancelled{background:#fee2e2;color:#991b1b}
  .badge.won{background:#d1fae5;color:#065f46}
  .badge.lost{background:#fee2e2;color:#991b1b}
  .badge.quoted{background:#fef3c7;color:#92400e}
  .badge.approved{background:#d1fae5;color:#065f46}
  .badge.unapproved{background:#fee2e2;color:#991b1b}
  /* ok / bad were already used by the Mechanics screen and the staff PIN
     column but had no rule, so those badges rendered unstyled. info is the
     online/counter marker on the customer list. */
  .badge.ok{background:#d1fae5;color:#065f46}
  .badge.bad{background:#fee2e2;color:#991b1b}
  .badge.info{background:#e0e7ff;color:#3730a3}
  .badge.lowstock{background:#fef3c7;color:#92400e}
  .badge.outstock{background:#fee2e2;color:#991b1b}
  .badge.instock{background:#d1fae5;color:#065f46}
  /* Generic good/bad variants. badge(x,'ok') was already being called by the
     marketing and quote lists with no rule behind it, so those pills rendered
     unstyled. */
  .badge.ok{background:#d1fae5;color:#065f46}
  .badge.bad{background:#fee2e2;color:#991b1b}
  .badge.open{background:#dbeafe;color:#1e40af}
  .badge.accepted{background:#d1fae5;color:#065f46}
  .badge.declined{background:#fee2e2;color:#991b1b}
  .badge.converted{background:#e0e7ff;color:#3730a3}
  .badge.expired{background:var(--card-soft2);color:#4b5563}
  .badge.voided{background:#fee2e2;color:#991b1b}
  .badge.paid{background:#d1fae5;color:#065f46}

  button.btn{background:var(--navy);color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;margin-right:4px;font-family:inherit}
  button.btn:hover{background:var(--red)}
  button.btn.ok{background:var(--ok)}
  button.btn.ok:hover{background:#15803d}
  button.btn.del{background:var(--red)}
  button.btn.del:hover{background:var(--red-dark)}
  button.btn.ghost{background:var(--hover);color:var(--ink);border:1px solid var(--line)}
  button.btn.ghost:hover{background:var(--line);color:var(--ink)}
  select.statusEdit,input.stockEdit,input.priceEdit{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:inherit}
  input.stockEdit,input.priceEdit{width:80px}

  /* Form helper classes used by new renderers. Not scoped to `form` -- the POS
     panels lay fields out in plain divs (a till has no submit button to
     protect), and scoping these left every one of those inputs unstyled. */
  .fld{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card);box-sizing:border-box}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px}
  .fld-mini{padding:4px 6px;border:1px solid var(--line);border-radius:5px;font-size:11.5px;font-family:inherit;width:72px}

  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}
  .stars{color:#ffb703;letter-spacing:1px}

  /* SIGN-IN OVERLAY */
  .signin-bg{position:fixed;inset:0;background:rgba(11,27,43,.95);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .signin-bg.show{display:flex}
  .signin-card{background:var(--card);border-radius:14px;max-width:380px;width:100%;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .signin-card h2{margin:0 0 6px;font-size:22px}
  .signin-card p.sub{color:var(--muted);font-size:13px;margin:0 0 22px}
  .signin-card label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .signin-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:12px;font-family:inherit}
  .signin-card button{width:100%;background:var(--red);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
  .signin-card button:hover{background:var(--red-dark)}
  .signin-card .err{color:var(--red);font-size:12px;margin-bottom:10px;display:none}
  .signin-card .err.show{display:block}
  .signin-card .hint{font-size:11px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.5}
  .signin-card .hint code{background:var(--hover);padding:2px 5px;border-radius:4px;font-size:11px}

  /* INSPECTIONS */
  .insp-cat{margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .insp-cat h4{margin:0;padding:9px 14px;background:var(--card-soft2);font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .insp-cat h4 small{font-weight:600;font-size:11px}
  .insp-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:9px 14px;border-bottom:1px dashed var(--line);align-items:center;font-size:13px}
  .insp-item:last-child{border-bottom:0}
  .insp-item .name{font-weight:600}
  .insp-item .toggles{display:inline-flex;gap:3px}
  .insp-item .toggles button{padding:5px 9px;border:1px solid var(--line);background:var(--card);border-radius:5px;cursor:pointer;font-weight:700;font-size:11px;color:var(--muted);font-family:inherit;line-height:1}
  .insp-item .toggles button.pass.on{background:#16a34a;color:#fff;border-color:#16a34a}
  .insp-item .toggles button.attention.on{background:#f59e0b;color:#fff;border-color:#f59e0b}
  .insp-item .toggles button.fail.on{background:#dc2626;color:#fff;border-color:#dc2626}
  .insp-item .toggles button.na.on{background:var(--muted);color:#fff;border-color:var(--muted)}
  .insp-item .note{padding:5px 8px;border:1px solid var(--line);border-radius:5px;font-size:12px;font-family:inherit;width:170px}
  .insp-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px 0}
  .insp-photos .ph{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;cursor:pointer}
  .insp-photos .ph img{width:100%;height:120px;object-fit:cover;display:block}
  .insp-photos .ph .meta{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;padding:4px 6px;font-size:10.5px;font-weight:600;text-align:left}
  .insp-photos .ph .markCount{position:absolute;top:6px;right:6px;background:#dc2626;color:#fff;border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:800}
  .insp-photos .addbtn{display:flex;align-items:center;justify-content:center;border:2px dashed #cbd5e1;background:var(--card-soft);border-radius:8px;height:120px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);flex-direction:column;gap:6px}
  .insp-photos .addbtn:hover{background:var(--hover);border-color:#94a3b8}

  /* ANNOTATION OVERLAY */
  .anno-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:6000;display:none;align-items:center;justify-content:center;flex-direction:column;padding:14px}
  .anno-modal.show{display:flex}
  .anno-modal .stage{position:relative;max-width:96vw;max-height:78vh;cursor:crosshair}
  .anno-modal .stage img{display:block;max-width:96vw;max-height:78vh;width:auto;height:auto;user-select:none;-webkit-user-drag:none}
  .anno-mark{position:absolute;background:rgba(220,38,38,.85);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.6);cursor:pointer;z-index:5}
  .anno-mark.amber{background:rgba(245,158,11,.9)}
  .anno-mark.green{background:rgba(22,163,74,.9)}
  .anno-mark .lbl{position:absolute;left:30px;top:-2px;background:rgba(0,0,0,.85);color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.2}
  .anno-tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
  .anno-tools button{padding:8px 14px;border:0;border-radius:6px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit}
  .anno-tools .red{background:#dc2626;color:#fff}
  .anno-tools .amber{background:#f59e0b;color:#fff}
  .anno-tools .green{background:#16a34a;color:#fff}
  .anno-tools .gray{background:#4b5563;color:#fff}
  .anno-tools .gray:hover{background:#374151}
  .anno-tools input{padding:8px 10px;border:0;border-radius:6px;font-size:12.5px;font-family:inherit;min-width:170px}
  .anno-status{color:#cbd5e1;font-size:12px;margin-top:8px}
</style>
</head>

<!-- SIGN-IN -->
<div class="signin-bg" id="signinBg">
  <form class="signin-card" id="signinForm" onsubmit="event.preventDefault(); doSignIn();">
    <h2>Admin sign-in</h2>
    <p class="sub">Restricted area. Use your admin account.</p>
    <!-- Shown before anyone types, when /api/health reports the database is
         down. Without it a copied till looks like it is rejecting the
         password, and people retype it instead of looking at the database. -->
    <div id="dbDownBanner" style="display:none;text-align:left;background:#fef3c7;border:1px solid #f59e0b;color:#7c2d12;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.55">
      <b style="display:block;margin-bottom:4px">The database is not running</b>

    </div>

    <!-- The counter route. A shared till changes hands all day, and typing an
         email and password each time is how one account ends up signed in for
         the whole shift. -->
    <button type="button" id="pinSignInBtn" style="margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--ink)">🔑 Sign in with PIN</button>
    <div class="hint">
      <!-- The seeded credentials used to be printed here, next to a button that
           typed them into the form. Anyone who could reach this page could read
           them, so the page was handing out the admin account to the whole LAN.
           The recovery path stays (an operator who forgets the password still
           needs a way back in) but it is now a plain link that says what it
           does only once you click it. -->
      <button type="button" id="resetDefaultLink" style="background:none;border:0;color:var(--muted);font-size:11.5px;cursor:pointer;padding:4px;font-family:inherit;text-decoration:underline">Locked out? Recover admin access</button>
    </div>

<script>
'use strict';

async function api(path, opts){
  opts = opts || {};
  var init = {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin'
  };
  if (opts.body) init.body = JSON.stringify(opts.body);
  var res = await fetch(path, init);
  var data = null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok) {
    // Carry the status and the body on the error. Throwing only the message
    // discarded everything the server said about *why* -- db_down being the
    // one that matters, since it separates "the database is stopped" from
    // "your password is wrong".
    var err = new Error((data && data.error) || ('HTTP ' + res.status));
    err.status = res.status;
    err.data = data || null;
    if (data && data.db_down) err.db_down = true;
    throw err;
  }
  return data;
}

function fmtDate(s){
  if (!s) return '';
  var d = new Date(s);
  return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}
function fmtMoney(n){
  if (n == null) return '—';
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function badge(text, cls){ return '<span class="badge ' + cls + '">' + esc(text) + '</span>'; }

// Wires every <select class="statusEdit" data-id data-kind> in a container to
// PATCH the right endpoint on change. Called by renderInquiries/renderAppointments/
// renderOrders, but was never actually defined (2026-08-18 audit fix) -- every
// call threw ReferenceError at the very end of rendering, and show()'s catch-all
// wiped out the table those renderers had ALREADY built, replacing it with a
// bare error message. So those three tabs looked broken outright even though
// only the status dropdown itself needed fixing.
var STATUS_EDIT_ENDPOINTS = {
  inquiry:     function(id){ return '/api/admin/inquiries/' + id; },
  appointment: function(id){ return '/api/admin/appointments/' + id; },
  order:       function(id){ return '/api/admin/orders/' + id; },
};
function wireStatusSelects(container){
  container.querySelectorAll('.statusEdit').forEach(function(sel){
    var prev = sel.value;
    sel.addEventListener('change', async function(){
      var kind = sel.getAttribute('data-kind');
      var mk = STATUS_EDIT_ENDPOINTS[kind];
      if (!mk) { alert('Unknown status kind: ' + kind); sel.value = prev; return; }
      var id = sel.getAttribute('data-id');
      var next = sel.value;
      sel.disabled = true;
      try {
        await api(mk(id), { method:'PATCH', body: { status: next } });
        prev = next;
      } catch (e) {
        alert('Failed to update status: ' + e.message);
        sel.value = prev;
      } finally {
        sel.disabled = false;
      }
    });
  });
}

// ============= AUTH =============
// The server starts even when the database is unreachable, so the admin page
// can load and explain itself (see boot.js). This is the explaining part:
// without it the page looks perfectly healthy and simply refuses every
// sign-in, which reads as a wrong password rather than a stopped database.
//
// Polls while the banner is up so a till recovers on its own once Postgres
// finishes starting -- first boot with the bundled database has been measured
// at over two minutes, which is long enough for someone to try signing in.
var DB_DOWN_TIMER = null;
async function checkDbUp(){
  var banner = document.getElementById('dbDownBanner');
  if (!banner) return true;
  var up = true;
  try {
    var r = await fetch('/api/health', { credentials: 'same-origin' });
    var d = await r.json();
    up = (d && d.db === 'up');
  } catch (_) {
    // The server itself is unreachable. That is a different fault and the
    // browser already shows it; don't claim it is the database.
    up = true;
  }
  banner.style.display = up ? 'none' : 'block';
  if (!up && !DB_DOWN_TIMER) {
    DB_DOWN_TIMER = setInterval(function(){ checkDbUp(); }, 5000);
  } else if (up && DB_DOWN_TIMER) {
    clearInterval(DB_DOWN_TIMER); DB_DOWN_TIMER = null;
  }
  return up;
}

async function doSignIn(){
  var email = document.getElementById('adEmail').value.trim();
  var password = document.getElementById('adPass').value;
  var err = document.getElementById('signinErr');
  err.classList.remove('show');
  try {
    var r = await api('/api/auth/signin', { method:'POST', body:{ email: email, password: password } });
    if (!r.user || !r.user.is_admin){
      err.textContent = 'This account does not have admin access.';
      err.classList.add('show');
      return;
    }
    document.getElementById('signinBg').classList.remove('show');
    CURRENT_ADMIN_ROLE = r.user.admin_role || 'manager';
    CURRENT_ADMIN_ID = r.user.id;
    CURRENT_ADMIN_NAME = r.user.name || r.user.email || null;
    MY_PERMS = r.user.perms || {}; MY_PERMS_FULL = r.user.perms_full !== false;
    // Both boot paths need this: signing in fresh went straight to init() with
    // MY_ROLE still null, so the sidebar hid nothing until the next reload.
    await loadMyRole();
    await posInitPrefsForUser();   // local cache first, then the user's saved prefs
    applyUserPrefsToChrome();      // theme + sidebar, now that their copy has arrived
    document.getElementById('whoLabel').textContent = (r.user.name || r.user.email) + ' · ' + CURRENT_ADMIN_ROLE;
    init();
  } catch(e){
    // The server answers a database outage with a 503 and db_down, so the
    // banner does the explaining and the red "wrong credentials" line stays
    // out of it -- the password was never the problem.
    if (e && (e.db_down || /database is not running/i.test(e.message || ''))) {
      await checkDbUp();
      return;
    }
    err.textContent = e.message || 'Sign-in failed.';
    err.classList.add('show');
  }
}

// Password show/hide toggle
document.addEventListener('DOMContentLoaded', function(){
  // PIN sign-in. Goes through the same doSignIn() tail as a password sign-in
  // -- role, prefs, sidebar, init -- so there is one way the panel comes up,
  // not two that drift apart.
  var pinBtn = document.getElementById('pinSignInBtn');
  if (pinBtn) pinBtn.addEventListener('click', async function(){
    var who = await posPinPrompt({
      endpoint: '/api/auth/pin-signin',
      title: 'Sign in with your PIN',
      detail: 'Enter your till PIN to open the admin panel.',
    });
    if (!who) return;
    document.getElementById('signinBg').classList.remove('show');
    CURRENT_ADMIN_ROLE = who.admin_role || 'manager';
    CURRENT_ADMIN_ID = who.id;
    CURRENT_ADMIN_NAME = who.name || who.email || null;
    await loadMyRole();
    await posInitPrefsForUser();
    applyUserPrefsToChrome();
    var wl = document.getElementById('whoLabel');
    if (wl) wl.textContent = (who.name || who.email) + ' · ' + CURRENT_ADMIN_ROLE;
    init();
  });

  var tog = document.getElementById('adPassToggle');
  var inp = document.getElementById('adPass');
  if (tog && inp){
    tog.addEventListener('click', function(){
      if (inp.type === 'password') { inp.type = 'text'; tog.textContent = '🙈'; tog.title = 'Hide password'; }
      else { inp.type = 'password'; tog.textContent = '👁'; tog.title = 'Show password'; }
    });
  }
  // "Reset password on server" — calls the endpoint; gracefully degrades if not registered yet.
  var reset = document.getElementById('resetDefaultLink');
  if (reset) reset.addEventListener('click', async function(e){
    e.preventDefault();
    if (!confirm('Reset admin@mortysautoparts.com to password "password123"?\n\nThis is safe — it only resets THIS one account.')) return;
    try {
      var r = await fetch('/api/auth/reset-default-admin', { method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:'{}' });
      var text = await r.text();
      var d = null;
      try { d = JSON.parse(text); } catch (_) {
        // Not JSON — most likely the server hasn't been restarted since this endpoint was added.
        alert('⚠ The reset endpoint is not yet available on the server.\n\nThis means the server hasn\'t been restarted since the latest code update.\n\nRestart the admin server and try again, or sign in with the account the shop was set up with.');
        return;
      }
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      document.getElementById('adEmail').value = d.email;
      document.getElementById('adPass').value = d.password;
      alert('✓ Reset complete.\n\nEmail: ' + d.email + '\nPassword: ' + d.password + '\n\nClick Sign In to log in now.');
    } catch(err){ alert('Reset failed: ' + err.message); }
  });
});

document.getElementById('signoutBtn').addEventListener('click', async function(){
  // Flush BEFORE the session ends. posPrefsKey() reads CURRENT_ADMIN_ID, so
  // writing after sign-out would file this cashier's settings under ':anon'
  // and hand them to whoever signs in next.
  await posFlushPrefs();
  try { await api('/api/auth/signout', { method:'POST' }); } catch(e){}
  location.reload();
});

// ============= THEME (light / dark) =============
// The actual attribute is set before first paint by the inline script in
// <head> (reads the same localStorage key) so there's no flash on load --
// this just keeps the button in sync and handles the click.
(function(){
  var btn = document.getElementById('themeToggle');
  function current(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function paint(){ btn.textContent = current() === 'dark' ? '☀️' : '🌙'; }
  btn.addEventListener('click', function(){
    var next = current() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    // localStorage stays the cache the <head> script reads to avoid a flash of
    // the wrong theme; the prefs record is what makes it follow the person.
    try { localStorage.setItem('mh_theme', next); } catch (_) {}
    if (typeof POS_PREFS !== 'undefined' && POS_PREFS) { POS_PREFS.theme = next; posSavePrefs(); }
    paint();
  });
  paint();
})();

// ============= TILES =============
// Live preview the photo the admin picked (file picker or camera)
function previewNewPhoto(input){
  var box = document.getElementById('npPreview');
  var img = document.getElementById('npPreviewImg');
  if (!input.files || !input.files[0]) { box.style.display = 'none'; return; }
  var reader = new FileReader();
  reader.onload = function(e){ img.src = e.target.result; box.style.display = 'block'; };
  reader.readAsDataURL(input.files[0]);
}

async function submitNewProduct(){
  var file = document.getElementById('npPhoto').files[0];
  var msg = document.getElementById('npMsg');
  var btn = document.getElementById('npSubmit');
  msg.style.display = 'none';
  if (!file){ msg.style.background = '#fee2e2'; msg.style.color = '#991b1b'; msg.textContent = 'Pick or snap a photo first.'; msg.style.display = 'block'; return; }
  var fd = new FormData();
  fd.append('photo', file);
  fd.append('name', document.getElementById('npName').value.trim());
  fd.append('make_model', document.getElementById('npMakeModel').value.trim());
  fd.append('category', document.getElementById('npCategory').value);
  fd.append('condition', document.getElementById('npCondition').value);
  fd.append('price_usd', document.getElementById('npPrice').value || '');
  fd.append('stock_count', document.getElementById('npStock').value || '1');
  btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    var res = await fetch('/api/admin/products', { method:'POST', body: fd, credentials:'same-origin' });
    var data = null; try { data = await res.json(); } catch(e){}
    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    msg.style.background = '#dcfce7'; msg.style.color = '#166534';
    msg.textContent = '✓ Added! Refreshing list…'; msg.style.display = 'block';
    setTimeout(function(){ show('products'); loadSummary(); }, 700);
  } catch(e){
    msg.style.background = '#fee2e2'; msg.style.color = '#991b1b';
    msg.textContent = 'Failed: ' + e.message; msg.style.display = 'block';
  } finally { btn.disabled = false; btn.textContent = 'Add Part to Inventory'; }
}

// submitNewStaff() lived here. Removed with the form it drove -- staff are
// created on the Staff screen now (submitStaff), which also handles
// categories, PIN, employee number and national ID.

async function loadSummary(){
  try {
    var s = await api('/api/admin/summary');
    var tiles = document.getElementById('tiles');
    tiles.innerHTML = [
      tile('new inquiries', s.new_inquiries, s.new_inquiries > 0 ? 'alert' : ''),
      tile('pending appointments', s.pending_appointments, s.pending_appointments > 0 ? 'warn' : ''),
      tile('notify subscriptions', s.pending_notifications),
      tile('reviews to moderate', s.pending_reviews, s.pending_reviews > 0 ? 'warn' : ''),
      tile('open orders', s.pending_orders, s.pending_orders > 0 ? 'warn' : ''),
      tile('low-stock products', s.low_stock_count, s.low_stock_count > 0 ? 'alert' : '')
    ].join('');
  } catch(e){ /* ignore */ }
}
function tile(lbl, val, cls){
  return '<div class="tile ' + (cls || '') + '"><div class="lbl">' + lbl + '</div><div class="val">' + val + '</div></div>';
}

// ============= TABS =============
var renderers = {
  inquiries:     renderInquiries,
  appointments:  renderAppointments,
  notifications: renderNotifications,
  reviews:       renderReviews,
  orders:        renderOrders,
  products:      renderProducts,
  customers:     renderCustomers,
  messages:      renderMessages,
  inspections:   renderInspections,
  mechanics:     renderMechanics,
  staff:            renderStaff,
  staffcategories:  renderStaffCategories,
  roles:            renderRoles,
  myprefs:          renderMyPrefs,
  services:      renderServices,
  requisitions:  renderRequisitions,
  workorders:    renderWorkOrders,
  schedule:      renderSchedule,
  timeclock:     renderTimeClock,
  partsreq:      renderPartsReq,
  cashreport:    renderCashReport,
  pettycash:     renderPettyCash,
  recurring:     renderRecurring,
  lowstock:      renderLowStock,
  warehouse:     renderWarehouse,
  deliveries:    renderDeliveries,
  suppliers:     renderSuppliers,
  purchaseorders: renderPurchaseOrders,
  pos:           renderPOS,
  quotes:        renderQuotes,
  cashier:       renderCashier,
  vehiclehistory: renderVehicleHistory,
  maintdue:      renderMaintDue,

  dashboard:     renderDashboard,
  reports:       renderReports,
  coupons:       renderCoupons,
  giftcards:     renderGiftCards,
  redemptions:   renderRedemptions
};
// POS Terminal, not Dashboard, is the default landing tab -- this is a
// counter-sales app first; staff signing in should land straight on the
// register, not a KPI screen they have to click past every time.
var currentTab = 'pos';
// Set on sign-in from /api/me / /api/auth/signin ('owner' | 'manager' | 'cashier').
// 'owner'/'manager' see everything; 'cashier' gets a trimmed sidebar (the
// backend enforces the actual restriction on every endpoint via
// requireManager() regardless of what this hides -- this is UI convenience,
// not the security boundary).
var CURRENT_ADMIN_ROLE = 'manager';
var CURRENT_ADMIN_ID = null; // this signed-in admin's own user id -- used to hide/disable self-demotion controls
var CURRENT_ADMIN_NAME = null; // display name (or email) of the signed-in admin -- POS uses it to credit a rep who has no staff row
// Per-user function permissions from /api/me. MY_PERMS_FULL is true for
// can_manage roles (owner/manager/custom) -- they are never restricted.
// can('some.cap') is the single check the UI uses; the server re-checks.
var MY_PERMS = {};
var MY_PERMS_FULL = true;
function can(cap){ return MY_PERMS_FULL || MY_PERMS[cap] !== false; }
// Sidebar items a cashier account doesn't see. Matches the endpoints gated
// by requireManager() in server.js: staff/supplier management, purchase
// orders, coupons, and marketing are all manager-rate financial/roster
// decisions, not day-to-day counter work.
// Staff management is a roster and payroll matter, and the staff screen shows
// national IDs and sets PINs -- squarely manager work, and the backend enforces
// it with requireManager regardless of what this hides.
// The signed-in user's own role, fetched at boot. Replaces MANAGER_ONLY_TABS,
// which was a hardcoded copy of rules the server also held -- two lists that
// could disagree, and did. Null until loadMyRole() returns, which is treated
// as "hide nothing": the backend still refuses anything this role may not do.
var MY_ROLE = null;
async function loadMyRole(){
  try { MY_ROLE = (await api('/api/admin/roles/mine')).role; }
  catch (_) { MY_ROLE = null; }
  return MY_ROLE;
}

// ============= SIDEBAR NAVIGATION =============
// Grouped menu definition — every tab grouped under a top-level section.
var SIDEBAR_GROUPS = [
  { title: '📊 Overview', items: [

    { tab:'reports', label:'📑 Reports' },
  ]},

  { title: '📦 Parts Department', items: [
    { tab:'products', label:'📦 Products / Stock' },
    { tab:'warehouse', label:'🏗 Warehouse' },
    { tab:'deliveries', label:'🚚 Deliveries' },
    { tab:'suppliers', label:'🏭 Suppliers' },
    { tab:'purchaseorders', label:'📥 Receive PO' },

  { title: '💵 Sales & POS', items: [

  // the customer list -- which made staff hard to find and easy to create by
  // accident while looking someone up. User management sits under Settings:
  // it is administration, done occasionally, not counter work.
  { title: '⚙️ Settings', items: [
    { tab:'settings', label:'⚙️ Company & Print Settings' },
    // Not manager-gated: these are your own settings, so every role sees it.
    { tab:'myprefs', label:'🎨 My Preferences' },
    { tab:'staff', label:'🧑‍🔧 Users & Staff' },
    { tab:'roles', label:'🔐 Roles & Permissions' },
    { tab:'staffcategories', label:'🏷 Staff Categories' },
  ]},
];

// Pinned screens live on the user's prefs record now, so they follow the
// person between tills. The old key is still written as a cache so the sidebar
// paints correctly on the first frame, before the server copy arrives.
var FAV_KEY = 'mh_admin_favs';
// Manager-preset pinned screens, from GET /api/admin/me/ui-prefs. When
// FAVS_LOCKED the user sees exactly FORCED_FAVS and cannot pin/unpin; when
// not locked, FORCED_FAVS is a starting set used only while the user has
// pinned nothing of their own.
var FAVS_LOCKED = false;
var FORCED_FAVS = null;
function favsAreLocked(){ return FAVS_LOCKED && Array.isArray(FORCED_FAVS); }
function loadFavs(){
  if (favsAreLocked()) return FORCED_FAVS.slice();
  var own = (POS_PREFS && Array.isArray(POS_PREFS.favs)) ? POS_PREFS.favs : null;
  if (own && own.length) return own;
  if (Array.isArray(FORCED_FAVS) && FORCED_FAVS.length) return FORCED_FAVS.slice();
  if (own) return own;
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch (_) { return []; }
}
function saveFavs(arr){
  if (favsAreLocked()) return;                    // the manager owns these
  if (POS_PREFS) { POS_PREFS.favs = arr; posSavePrefs(); }
  try { localStorage.setItem(FAV_KEY, JSON.stringify(arr)); } catch (_) {}
}
function toggleFav(tab){
  if (favsAreLocked()) {
    if (typeof posToast === 'function') posToast('Pinned screens are set by your manager.');
    return;
  }
  var f = loadFavs().slice();
  var i = f.indexOf(tab);
  if (i === -1) f.push(tab); else f.splice(i, 1);
  saveFavs(f);
  buildSidebar();
}

// Whole-sidebar collapse (distinct from per-group collapse right below --
// this hides the entire nav down to a slim rail; see the CSS comment on
// .wrap.sb-collapsed for why the two are kept separate).
var SB_COLLAPSED_KEY = 'mh_admin_sidebar_collapsed';
function isSidebarCollapsed(){
  if (POS_PREFS && typeof POS_PREFS.sidebarCollapsed === 'boolean') return POS_PREFS.sidebarCollapsed;
  try { return localStorage.getItem(SB_COLLAPSED_KEY) === '1'; } catch (_) { return false; }
}
function toggleSidebarCollapse(){
  var next = !isSidebarCollapsed();
  try { localStorage.setItem(SB_COLLAPSED_KEY, next ? '1' : '0'); } catch (_) {}
  if (POS_PREFS) { POS_PREFS.sidebarCollapsed = next; posSavePrefs(); }
  var wrap = document.querySelector('.wrap');
  if (wrap) wrap.classList.toggle('sb-collapsed', next);
  var btn = document.getElementById('sbCollapseBtn');
  if (btn) { btn.textContent = next ? '»' : '« Collapse'; btn.title = next ? 'Expand menu' : 'Collapse menu'; }
}

// Accordion sidebar: at most one group open at a time, and none open on load.
//
// Was a persisted LIST of collapsed group keys (mh_admin_collapsed_groups),
// which is the wrong shape for an accordion -- with only one group ever open,
// "which one" IS the entire state, and a list leaves room for entries that
// contradict it. Deliberately a plain variable rather than localStorage: the
// brief is that every fresh load starts tidy, so this must NOT survive a
// reload. It does survive buildSidebar() being re-run within the session
// (pinning a favourite rebuilds the whole sidebar), which is why it is not
// just read off the DOM.
var OPEN_GROUP = '';
function toggleGroupCollapse(key){
  // Clicking the group that is already open shuts it, leaving nothing open --
  // without this there would be no way back to an all-collapsed menu.
  OPEN_GROUP = (OPEN_GROUP === key) ? '' : key;
  // Repaint every group from the one source of truth instead of toggling the
  // clicked one and trusting the rest to already agree with it.
  document.querySelectorAll('.sidebar .grp').forEach(function(g){
    g.classList.toggle('collapsed', g.getAttribute('data-grp') !== OPEN_GROUP);
  });
}

function buildSidebar(){
  var sb = document.getElementById('sidebar');
  if (!sb) return;
  var favs = loadFavs();
  var openGroup = OPEN_GROUP;
  // Which screens this role does not see, as configured on the Roles screen.
  // The real access control is still requireManager() on the backend; this
  // only keeps someone from seeing tabs whose buttons would all 403.
  //
  // Read from the server rather than decided here. The old version tested for
  // the literal role 'cashier' against a hardcoded tab list, so a shop that
  // added any other role got the full sidebar regardless of what it could
  // actually do -- and the UI's idea of the rules could drift from the
  // server's, which is the failure this whole change is about.
  var hide = (MY_ROLE && Array.isArray(MY_ROLE.hidden_tabs)) ? MY_ROLE.hidden_tabs.slice() : [];
  // Per-user function permissions can also hide a tab: no pos.access -> no
  // POS Terminal in the sidebar (renderPOS refuses it too).
  if (!can('pos.access') && hide.indexOf('pos') === -1) hide.push('pos');
  if (!can('reports.view') && hide.indexOf('reports') === -1) hide.push('reports');
  if (!can('cashier.access') && hide.indexOf('cashier') === -1) hide.push('cashier');
  var groups = SIDEBAR_GROUPS
    .map(function(g){
      return { title: g.title,
               items: hide.length ? g.items.filter(function(it){ return hide.indexOf(it.tab) === -1; }) : g.items.slice() };
    })
    .filter(function(g){ return g.items.length > 0; });
  // Build label map for fav rendering
  var labelMap = {};
  groups.forEach(function(g){ g.items.forEach(function(it){ labelMap[it.tab] = it.label; }); });

  // Inverted from the old "is it in the collapsed list" test: everything is
  // collapsed unless it is the one open group, so a fresh load (OPEN_GROUP '')
  // shuts every group including Favourites.
  function grpClass(key){ return 'grp' + (key === openGroup ? '' : ' collapsed'); }

  var sbCollapsed = isSidebarCollapsed();
  var wrapEl = document.querySelector('.wrap');
  if (wrapEl) wrapEl.classList.toggle('sb-collapsed', sbCollapsed);

  var html = '<button type="button" class="sbCollapseBtn" id="sbCollapseBtn" title="' +
    (sbCollapsed ? 'Expand menu' : 'Collapse menu') + '">' + (sbCollapsed ? '»' : '« Collapse') + '</button>';
  var favsLk = favsAreLocked();
  // Favourites group (also collapsible)
  html += '<div class="' + grpClass('__fav') + '" data-grp="__fav">' +
    '<div class="grp-title" data-toggle="__fav"><span>⭐ Favourites' + (favsLk ? ' 🔒' : '') + '</span><span class="chev">▾</span></div>' +
    '<div class="grp-items">';
  if (favs.length === 0) {
    html += '<div class="empty-fav">' + (favsLk ? 'Your manager has not preset any.' : 'Click ☆ next to any item to pin it here') + '</div>';
  } else {
    favs.forEach(function(t){
      if (!labelMap[t]) return;
      html += '<button class="item ' + (currentTab===t?'active':'') + '" data-go="' + t + '"><span class="lbl">' + labelMap[t] + '</span>' +
        (favsLk ? '<span class="star on" title="Pinned by your manager" style="cursor:default">🔒</span>'
                : '<span class="star on" data-star="' + t + '">★</span>') +
      '</button>';
    });
  }
  html += '</div></div>';
  // Then all groups
  groups.forEach(function(g, gi){
    var key = 'g' + gi;
    html += '<div class="' + grpClass(key) + '" data-grp="' + key + '">' +
      '<div class="grp-title" data-toggle="' + key + '"><span>' + g.title + '</span><span class="chev">▾</span></div>' +
      '<div class="grp-items">';
    g.items.forEach(function(it){
      var isFav = favs.indexOf(it.tab) !== -1;
      html += '<button class="item ' + (currentTab===it.tab?'active':'') + '" data-go="' + it.tab + '">' +
        '<span class="lbl">' + it.label + '</span>' +
        (favsLk
          ? (isFav ? '<span class="star on" title="Pinned by your manager" style="cursor:default">🔒</span>' : '')
          : '<span class="star ' + (isFav?'on':'') + '" data-star="' + it.tab + '" title="Pin to favourites">' + (isFav ? '★' : '☆') + '</span>') +
      '</button>';
    });
    html += '</div></div>';
  });
  // Account footer: who's signed in + Sign out, pinned at the bottom of the
  // rail (mirrors the header control, closer to hand). Shows Sign in instead
  // when there is no session -- e.g. it lapsed and the modal is up.
  if (CURRENT_ADMIN_ID) {
    html += '<div class="sb-foot">' +
      '<div class="sb-who" title="' + esc(String(CURRENT_ADMIN_NAME || '')) + '">' +
        '👤 <span class="lbl" style="flex:1;overflow:hidden;text-overflow:ellipsis">' + esc(String(CURRENT_ADMIN_NAME || 'Signed in')) + '</span>' +
        '<small>' + esc(String(CURRENT_ADMIN_ROLE || '')) + '</small>' +
      '</div>' +
      '<button type="button" class="sb-signout" id="sbSignout">⎋ Sign out</button>' +
    '</div>';
  } else {
    html += '<div class="sb-foot"><button type="button" class="sb-signout sb-signin" id="sbSignin">🔑 Sign in</button></div>';
  }
  sb.innerHTML = html;
  // Wire item clicks
  sb.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(e){
      if (e.target.dataset.star) return;
      currentTab = b.dataset.go;
      show(currentTab);
      sb.querySelectorAll('.item').forEach(function(x){ x.classList.toggle('active', x.dataset.go === currentTab); });
      if (window.innerWidth <= 900) {
        document.getElementById('sidebar').classList.remove('show');
        document.getElementById('sbOverlay').classList.remove('show');
      }
    });
  });
  // Wire star clicks
  sb.querySelectorAll('[data-star]').forEach(function(s){
    s.addEventListener('click', function(e){ e.stopPropagation(); toggleFav(s.dataset.star); });
  });
  // Wire group-title collapse toggles
  sb.querySelectorAll('[data-toggle]').forEach(function(t){
    t.addEventListener('click', function(){ toggleGroupCollapse(t.dataset.toggle); });
  });
  var sbBtn = document.getElementById('sbCollapseBtn');
  if (sbBtn) sbBtn.addEventListener('click', toggleSidebarCollapse);
  // Account footer: reuse the header's handlers so there's one code path.
  var sbSo = document.getElementById('sbSignout');
  if (sbSo) sbSo.addEventListener('click', function(){ var h = document.getElementById('signoutBtn'); if (h) h.click(); });
  var sbSi = document.getElementById('sbSignin');
  if (sbSi) sbSi.addEventListener('click', function(){
    var bg = document.getElementById('signinBg'); if (bg) bg.classList.add('show');
    var em = document.getElementById('adEmail'); if (em) setTimeout(function(){ try { em.focus(); } catch (_) {} }, 50);
  });
}

// Overlay click closes mobile sidebar
document.addEventListener('DOMContentLoaded', function(){
  var ov = document.getElementById('sbOverlay');
  if (ov) ov.addEventListener('click', function(){
    document.getElementById('sidebar').classList.remove('show');
    ov.classList.remove('show');
  });
  buildSidebar();
});

async function show(tab){
  // Leaving the POS terminal is an exit as much as closing the tab is -- the
  // panel is about to be torn down, so commit the view/font/column choices now
  // rather than hoping the operator eventually closes the browser.
  if (currentTab === 'pos' && tab !== 'pos') posFlushPrefs();
  currentTab = tab;
  // The tender overlay and the POS modals are appended to <body>, not to the
  // panel, so leaving a tab while one is open used to leave it floating over
  // whatever came next with no way back to the button that closes it.
  if (typeof closeTenderModal === 'function') closeTenderModal();
  if (typeof posCloseModal === 'function') posCloseModal();
  var panel = document.getElementById('panel');
  panel.innerHTML = '<div class="empty">Loading…</div>';
  // Reflect active state in the sidebar
  document.querySelectorAll('.sidebar .item').forEach(function(x){ x.classList.toggle('active', x.dataset.go === tab); });
  // The KPI tile strip eats vertical space every dense list-based tab wants
  // back, and the POS terminal wants it most -- it sizes its own results
  // list/cart to the viewport height (see posPageSize()/the pos-shell grid
  // in renderPOS). Hide it there; every other tab keeps it as-is.
  var tiles = document.getElementById('tiles');
  if (tiles) tiles.style.display = (tab === 'pos') ? 'none' : '';
  try { await renderers[tab](panel); }
  catch(e){ panel.innerHTML = '<div class="empty">Error: ' + esc(e.message) + '</div>'; }
}
