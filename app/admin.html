async function renderInquiries(panel){
  var r = await api('/api/admin/inquiries');
  if (!r.inquiries.length) return panel.innerHTML = '<div class="empty">No inquiries yet.</div>';
  panel.innerHTML = '<table><thead><tr>' +
    '<th>When</th><th>Customer</th><th>Vehicle</th><th>Request</th><th>Quote</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>' +
    r.inquiries.map(function(i){
      var veh = [i.vehicle_year, i.vehicle_make, i.vehicle_model].filter(Boolean).join(' ');
      var photoUrl = i.has_photo ? '/api/admin/inquiries/' + i.id + '/photo' : '';
      var photo = photoUrl
        ? '<a href="' + photoUrl + '" target="_blank" rel="noopener" title="View full size"><img src="' + photoUrl + '" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin-top:6px;display:block;cursor:zoom-in"/></a>'
        : '';
      var items = posItemsArray(i.items_json);
      var need = items.length
        ? '<div style="display:flex;flex-direction:column;gap:3px">' + items.map(function(it){
            var lp = it.unit_price_cents != null ? ' <b style="color:var(--navy)">' + fmtMoney(it.unit_price_cents / 100) + '</b>' : '';
            return '<div style="font-size:12.5px"><b>' + it.qty + ' ×</b> ' + esc(it.name) +
              (it.img && it.img !== it.name ? ' <code style="font-size:11px;color:var(--muted)">' + esc(it.img) + '</code>' : '') + lp +
              (it.make_model ? '<br/><small style="color:var(--muted);padding-left:18px">' + esc(it.make_model) + '</small>' : '') +
            '</div>';
          }).join('') + '</div>'
        : esc(i.part_description);
      var src = i.source === 'cart'
        ? '<small style="display:inline-block;background:#dbeafe;color:#1d4ed8;font-weight:700;padding:1px 6px;border-radius:4px;font-size:10.5px;margin-bottom:4px">🛒 CART QUOTE</small><br/>'
        : '';
      var acct = i.user_id
        ? '<br/><small style="color:var(--muted)">acct: ' + esc(i.account_name || ('#' + i.user_id)) +
          (Number(i.customer_show_prices) ? ' · <b style="color:#15803d">prices ON</b>' : ' · <span style="color:#b45309">prices off</span>') + '</small>'
        : '<br/><small style="color:var(--muted)">guest — no account</small>';
      return '<tr>' +
        '<td>' + fmtDate(i.created_at) + '</td>' +
        '<td><b>' + esc(i.name) + '</b><br/><small><a href="tel:' + esc(i.phone) + '">' + esc(i.phone) + '</a></small>' +
          (i.email ? '<br/><small><a href="mailto:' + esc(i.email) + '">' + esc(i.email) + '</a></small>' : '') + acct + '</td>' +
        '<td>' + esc(veh) + (i.condition ? '<br/><small>' + esc(i.condition) + '</small>' : '') + '</td>' +
        '<td>' + src + need + photo + '</td>' +
        '<td>' + (i.quote_total_usd != null ? '<b>' + fmtMoney(i.quote_total_usd) + '</b>' : '<small style="color:var(--muted)">—</small>') + '</td>' +
        '<td>' + badge(i.status, i.status) + '</td>' +
        '<td class="actions"><button class="btn" data-editinq="' + i.id + '" style="white-space:nowrap">✏️ Price / edit</button></td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
  panel.querySelectorAll('[data-editinq]').forEach(function(b){
    b.addEventListener('click', function(){ renderInquiryEditor(panel, b.getAttribute('data-editinq')); });
  });
}

async function renderInquiryEditor(panel, id){
  panel.innerHTML = '<div class="empty">Loading quote request…</div>';
  var r = await api('/api/admin/inquiries/' + id);
  var inq = r.inquiry, items = r.items || [], stock = r.stock || {};
  var veh = [inq.vehicle_year, inq.vehicle_make, inq.vehicle_model].filter(Boolean).join(' ');
  var photoUrl = inq.has_photo ? '/api/admin/inquiries/' + inq.id + '/photo' : '';
  var isCart = inq.source === 'cart';

  function row(it){
    var st = stock[it.img] || {};
    return '<tr class="inqLine">' +
      '<td><input class="il-name" value="' + esc(it.name || '') + '" style="width:100%;min-width:160px"/></td>' +
      '<td><input class="il-img" value="' + esc(it.img || '') + '" style="width:120px;font-family:ui-monospace,monospace;font-size:12px"/></td>' +
      '<td>' + (st.stock_count != null ? '<span style="color:' + (st.stock_count > 0 ? '#15803d' : '#b91c1c') + '">' + st.stock_count + '</span>' : '<small style="color:var(--muted)">—</small>') + '</td>' +
      '<td><input class="il-qty" type="number" min="1" value="' + (it.qty || 1) + '" style="width:58px"/></td>' +
      '<td><small style="color:var(--muted)">' + (it.list_price_usd != null ? fmtMoney(it.list_price_usd) : '—') + '</small></td>' +
      '<td><input class="il-price" type="number" min="0" step="0.01" value="' + (it.unit_price_usd != null ? it.unit_price_usd : '') + '" placeholder="0.00" style="width:90px"/></td>' +
      '<td class="il-total" style="text-align:right;font-weight:700">—</td>' +
      '<td><button type="button" class="btn il-del" title="Remove line">✕</button></td>' +
    '</tr>';
  }

  panel.innerHTML =
    '<div style="padding:14px 16px;display:flex;flex-direction:column;gap:14px">' +
      '<div><button class="btn" id="inqBack">‹ Back to list</button></div>' +
      '<div style="display:flex;gap:20px;flex-wrap:wrap">' +
        '<div style="flex:1;min-width:220px">' +
          '<h3 style="margin:0 0 6px">' + esc(inq.name || '(no name)') + (isCart ? ' <small style="background:#dbeafe;color:#1d4ed8;font-weight:700;padding:1px 7px;border-radius:5px;font-size:11px">CART QUOTE</small>' : '') + '</h3>' +
          '<div style="font-size:13px;color:var(--muted);line-height:1.7">' +
            (inq.phone ? '📞 <a href="tel:' + esc(inq.phone) + '">' + esc(inq.phone) + '</a><br/>' : '') +
            (inq.email ? '✉️ <a href="mailto:' + esc(inq.email) + '">' + esc(inq.email) + '</a><br/>' : '') +
            (veh ? '🚗 ' + esc(veh) + '<br/>' : '') +
            (inq.condition ? 'Condition: ' + esc(inq.condition) + '<br/>' : '') +
            'Received ' + fmtDate(inq.created_at) +
          '</div>' +
        '</div>' +
        '<div style="flex:1;min-width:220px">' +
          '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card-soft)">' +
            '<div style="font-weight:700;margin-bottom:6px">Customer pricing</div>' +
            (inq.user_id
              ? '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">Account: <b>' + esc(inq.account_name || ('#' + inq.user_id)) + '</b></div>' +
                '<button class="btn" id="inqShowPrices" style="background:' + (Number(inq.customer_show_prices) ? '#15803d' : 'var(--navy)') + ';color:#fff">' +
                  (Number(inq.customer_show_prices) ? '✓ Prices visible to this customer — click to hide' : 'Show prices to this customer') +
                '</button>'
              : '<div style="font-size:13px;color:#b45309">This request came in without a customer account, so there is nobody to unlock pricing for. Ask them to create an account and re-submit, or send the quote manually.</div>') +
          '</div>' +
        '</div>' +
      '</div>' +
      (photoUrl ? '<div><a href="' + photoUrl + '" target="_blank" rel="noopener"><img src="' + photoUrl + '" style="max-height:140px;border-radius:8px;border:1px solid var(--line)"/></a></div>' : '') +
      (isCart
        ? '<div style="overflow-x:auto"><table style="width:100%"><thead><tr>' +
            '<th>Part</th><th>Part #</th><th>Stock</th><th>Qty</th><th>List</th><th>Unit price</th><th style="text-align:right">Line</th><th></th>' +
          '</tr></thead><tbody id="inqLines">' + items.map(row).join('') + '</tbody></table>' +
          '<button class="btn" id="inqAddLine" style="margin-top:8px">+ Add line</button></div>'
        : '<div style="border:1px solid var(--line);border-radius:8px;padding:12px"><b>Part requested</b><div style="margin-top:4px;white-space:pre-wrap">' + esc(inq.part_description || '') + '</div></div>') +
      '<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end">' +
        '<label style="flex:1;min-width:240px">Quote notes (lead time, substitutions — shown to the counter)<br/>' +
          '<textarea id="inqNotes" rows="3" style="width:100%">' + esc(inq.quote_notes || '') + '</textarea></label>' +
        '<label>Status<br/><select id="inqStatus">' +
          ['new','quoted','won','lost'].map(function(s){ return '<option value="' + s + '"' + (s === inq.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
        '</select></label>' +
        (isCart ? '<div style="font-size:16px;font-weight:800">Total: <span id="inqTotal">—</span></div>' : '') +
      '</div>' +
      '<div><button class="btn primary" id="inqSave" style="background:var(--navy);color:#fff;padding:10px 22px">Save quote</button> <span id="inqMsg" style="margin-left:10px;font-size:13px"></span></div>' +
    '</div>';

  function recalc(){
    var total = 0;
    panel.querySelectorAll('.inqLine').forEach(function(tr){
      // A blank / invalid quantity counts as 1 -- the line was added because
      // the customer wants the part, so "no number" means one, not zero.
      var qty = parseInt(tr.querySelector('.il-qty').value, 10);
      if (!(qty > 0)) qty = 1;
      var pr = parseFloat(tr.querySelector('.il-price').value);
      var cell = tr.querySelector('.il-total');
      if (isFinite(pr) && pr >= 0){ var lt = pr * qty; total += lt; cell.textContent = fmtMoney(lt); }
      else cell.textContent = '—';
    });
    var tEl = panel.querySelector('#inqTotal');
    if (tEl) tEl.textContent = total > 0 ? fmtMoney(total) : '—';
  }
  function wireLine(tr){
    tr.querySelectorAll('.il-qty,.il-price').forEach(function(el){ el.addEventListener('input', recalc); });
    // Normalise a left-blank quantity back to 1 once the operator leaves the field.
    tr.querySelector('.il-qty').addEventListener('change', function(){
      if (!(parseInt(this.value, 10) > 0)) this.value = 1;
      recalc();
    });
    tr.querySelector('.il-del').addEventListener('click', function(){ tr.remove(); recalc(); });
  }
  panel.querySelectorAll('.inqLine').forEach(wireLine);
  recalc();

  var addBtn = panel.querySelector('#inqAddLine');
  if (addBtn) addBtn.addEventListener('click', function(){
    var tb = panel.querySelector('#inqLines');
    var tmp = document.createElement('tbody');
    tmp.innerHTML = row({ name:'', img:'', qty:1, list_price_usd:null, unit_price_usd:null });
    var tr = tmp.firstChild;
    tb.appendChild(tr); wireLine(tr); recalc();
  });

  panel.querySelector('#inqBack').addEventListener('click', function(){ renderInquiries(panel); });

  var spBtn = panel.querySelector('#inqShowPrices');
  if (spBtn) spBtn.addEventListener('click', async function(){
    var turnOn = !Number(inq.customer_show_prices);
    spBtn.disabled = true;
    try {
      var res = await api('/api/admin/inquiries/' + id + '/show-prices', { method:'POST', body:{ enabled: turnOn } });
      inq.customer_show_prices = res.show_prices ? 1 : 0;
      spBtn.style.background = res.show_prices ? '#15803d' : 'var(--navy)';
      spBtn.textContent = res.show_prices ? '✓ Prices visible to this customer — click to hide' : 'Show prices to this customer';
    } catch(e){ alert('Could not update: ' + e.message); }
    finally { spBtn.disabled = false; }
  });

  panel.querySelector('#inqSave').addEventListener('click', async function(){
    var body = { status: panel.querySelector('#inqStatus').value, quote_notes: panel.querySelector('#inqNotes').value };
    if (isCart){
      body.items = [].map.call(panel.querySelectorAll('.inqLine'), function(tr){
        var pr = parseFloat(tr.querySelector('.il-price').value);
        return {
          img: tr.querySelector('.il-img').value.trim(),
          name: tr.querySelector('.il-name').value.trim(),
          qty: parseInt(tr.querySelector('.il-qty').value, 10) || 1,
          unit_price_usd: isFinite(pr) && pr >= 0 ? pr : null
        };
      }).filter(function(it){ return it.img || it.name; });
    }
    var msg = panel.querySelector('#inqMsg');
    msg.textContent = 'Saving…'; msg.style.color = 'var(--muted)';
    try {
      await api('/api/admin/inquiries/' + id, { method:'PATCH', body: body });
      msg.textContent = '✓ Saved'; msg.style.color = '#15803d';
    } catch(e){ msg.textContent = '✗ ' + e.message; msg.style.color = '#b91c1c'; }
  });
}

var apptView = 'list';
var apptWeekAnchor = null; // Date or null = "this week"
async function renderAppointments(panel){
  var toolbar =
    '<div style="padding:12px 16px;background:var(--card-soft);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      '<div class="seg-toggle" style="display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden">' +
        '<button class="seg-btn ' + (apptView==='list'?'on':'') + '" data-view="list" style="padding:7px 14px;background:' + (apptView==='list'?'var(--navy)':'var(--card)') + ';color:' + (apptView==='list'?'#fff':'var(--ink)') + ';border:0;font-weight:700;cursor:pointer;font-size:12.5px">📋 List</button>' +
        '<button class="seg-btn ' + (apptView==='calendar'?'on':'') + '" data-view="calendar" style="padding:7px 14px;background:' + (apptView==='calendar'?'var(--navy)':'var(--card)') + ';color:' + (apptView==='calendar'?'#fff':'var(--ink)') + ';border:0;font-weight:700;cursor:pointer;font-size:12.5px">🗓 Calendar</button>' +
      '</div>' +
      (apptView==='calendar' ?
        '<button class="btn" id="weekPrev" style="margin-left:auto">‹ Prev</button>' +
        '<button class="btn" id="weekThis">This week</button>' +
        '<button class="btn" id="weekNext">Next ›</button>' : '') +
    '</div>';
  panel.innerHTML = toolbar + '<div id="apptBody"><div class="empty">Loading…</div></div>';
  panel.querySelectorAll('.seg-btn').forEach(function(b){
    b.addEventListener('click', function(){ apptView = b.dataset.view; renderAppointments(panel); });
  });
  if (apptView === 'calendar'){
    var prev = document.getElementById('weekPrev'), thisW = document.getElementById('weekThis'), nextW = document.getElementById('weekNext');
    if (prev) prev.addEventListener('click', function(){ shiftWeek(-7); renderAppointments(panel); });
    if (thisW) thisW.addEventListener('click', function(){ apptWeekAnchor = null; renderAppointments(panel); });
    if (nextW) nextW.addEventListener('click', function(){ shiftWeek(7); renderAppointments(panel); });
    await renderApptCalendar(document.getElementById('apptBody'));
  } else {
    await renderApptList(document.getElementById('apptBody'));
  }
}
function shiftWeek(days){
  var d = apptWeekAnchor ? new Date(apptWeekAnchor) : new Date();
  d.setDate(d.getDate() + days);
  apptWeekAnchor = d;
}
async function renderApptList(box){
  var r = await api('/api/admin/appointments');
  if (!r.appointments.length) return box.innerHTML = '<div class="empty">No service appointments yet.</div>';
  box.innerHTML = '<table><thead><tr>' +
    '<th>When</th><th>Customer</th><th>Vehicle</th><th>Service</th><th>Slot</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>' +
    r.appointments.map(function(a){
      var veh = [a.vehicle_year, a.vehicle_make, a.vehicle_model].filter(Boolean).join(' ');
      var slot = a.preferred_date ? new Date(a.preferred_date).toLocaleDateString() : '—';
      if (a.time_slot) slot += ' · ' + a.time_slot;
      return '<tr>' +
        '<td>' + fmtDate(a.created_at) + '</td>' +
        '<td><b>' + esc(a.name) + '</b><br/><small>' + esc(a.phone) + (a.email ? ' · ' + esc(a.email) : '') + '</small></td>' +
        '<td>' + esc(veh) + '</td>' +
        '<td>' + esc(a.service_type || '—') + (a.notes ? '<br/><small style="color:var(--muted)">' + esc(a.notes) + '</small>' : '') + '</td>' +
        '<td>' + esc(slot) + '</td>' +
        '<td>' + badge(a.status, a.status) + '</td>' +
        '<td class="actions"><select class="statusEdit" data-id="' + a.id + '" data-kind="appointment">' +
          ['pending','confirmed','completed','cancelled'].map(function(s){
            return '<option value="' + s + '"' + (s===a.status?' selected':'') + '>' + s + '</option>';
          }).join('') +
        '</select></td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
  wireStatusSelects(box);
}
async function renderApptCalendar(box){
  var qs = apptWeekAnchor ? '?week=' + apptWeekAnchor.toISOString().slice(0,10) : '';
  var r = await api('/api/admin/appointments/calendar' + qs);
  var start = new Date(r.week_start + 'T00:00:00');
  var days = [];
  for (var i=0; i<6; i++){ var d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
  var slots = ['8:00 AM','9:00 AM','10:00 AM','11:00 AM','12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM'];
  // Bucket appointments by date+slot
  var byDay = {};
  (r.appointments || []).forEach(function(a){
    var ds = a.preferred_date ? new Date(a.preferred_date).toISOString().slice(0,10) : '';
    var key = ds + '|' + (a.time_slot || '—');
    (byDay[key] = byDay[key] || []).push(a);
  });
  var hdr = '<div style="padding:10px 16px;font-size:13px;color:var(--muted);background:var(--card);border-bottom:1px solid var(--line)">Week of ' +
    start.toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'}) +
    ' — <b>' + (r.appointments||[]).length + '</b> appointment(s)</div>';
  var grid =
    '<div style="overflow:auto"><table class="cal" style="border-collapse:collapse;width:100%;min-width:780px;font-size:12px">' +
      '<thead><tr><th style="background:var(--card-soft2);padding:8px;border:1px solid var(--line);width:90px">Slot</th>' +
        days.map(function(d){
          var iso = d.toISOString().slice(0,10);
          var isToday = iso === new Date().toISOString().slice(0,10);
          return '<th style="background:' + (isToday?'#fef3c7':'var(--card-soft2)') + ';padding:8px;border:1px solid var(--line);text-align:left">' +
            d.toLocaleDateString('en-US',{weekday:'short'}) +
            '<br/><small style="font-weight:400;color:var(--muted)">' + d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + '</small></th>';
        }).join('') +
      '</tr></thead><tbody>' +
      slots.map(function(slot){
        return '<tr><td style="background:var(--card-soft);padding:8px;border:1px solid var(--line);font-weight:700;font-size:11.5px;color:var(--muted);vertical-align:top">' + slot + '</td>' +
          days.map(function(d){
            var iso = d.toISOString().slice(0,10);
            var key = iso + '|' + slot;
            var bks = byDay[key] || [];
            return '<td style="padding:4px;border:1px solid var(--line);vertical-align:top;min-height:46px;height:46px">' +
              bks.map(function(a){
                var veh = [a.vehicle_year, a.vehicle_make, a.vehicle_model].filter(Boolean).join(' ');
                var cls = a.status === 'confirmed' ? '#16a34a' : a.status === 'completed' ? 'var(--muted)' : a.status === 'cancelled' ? '#ef4444' : '#f59e0b';
                return '<div title="' + esc(a.name + ' · ' + a.phone + (veh ? ' · ' + veh : '') + (a.service_type ? ' · ' + a.service_type : '')) + '" style="background:' + cls + ';color:#fff;padding:3px 6px;border-radius:4px;margin-bottom:2px;font-size:11px;font-weight:600;cursor:help">' +
                  esc(a.name.split(' ')[0]) + (veh ? ' · ' + esc(a.vehicle_make || '') : '') +
                '</div>';
              }).join('') +
            '</td>';
          }).join('') +
        '</tr>';
      }).join('') +
    '</tbody></table></div>' +
    '<div style="padding:10px 16px;font-size:11.5px;color:var(--muted);background:var(--card-soft);border-top:1px solid var(--line)">' +
      '<b>Legend:</b> ' +
      '<span style="display:inline-block;width:10px;height:10px;background:#f59e0b;border-radius:2px;vertical-align:middle"></span> Pending · ' +
      '<span style="display:inline-block;width:10px;height:10px;background:#16a34a;border-radius:2px;vertical-align:middle"></span> Confirmed · ' +
      '<span style="display:inline-block;width:10px;height:10px;background:var(--muted);border-radius:2px;vertical-align:middle"></span> Completed · ' +
      '<span style="display:inline-block;width:10px;height:10px;background:#ef4444;border-radius:2px;vertical-align:middle"></span> Cancelled' +
    '</div>';
  box.innerHTML = hdr + grid;
}

async function renderNotifications(panel){
  var r = await api('/api/admin/notifications');
  var actionBar = '<div style="padding:14px 16px;background:var(--card-soft);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
    '<small style="color:var(--muted);font-size:12px">Click below to email everyone waiting on a product that\'s now back in stock.</small>' +
    '<button class="btn ok" id="blastBtn">🔔 Send back-in-stock alerts</button>' +
    '</div>';
  if (!r.notifications.length){
    panel.innerHTML = actionBar + '<div class="empty">No notify-me subscriptions yet.</div>';
  } else {
    panel.innerHTML = actionBar +
      '<table><thead><tr>' +
      '<th>When</th><th>Product</th><th>Stock</th><th>Email</th><th>Phone</th><th>Notified</th>' +
      '</tr></thead><tbody>' +
      r.notifications.map(function(n){
        var stockBadge = n.stock_count > 0
          ? badge('in stock ' + n.stock_count, 'instock')
          : badge('out', 'outstock');
        return '<tr>' +
          '<td>' + fmtDate(n.created_at) + '</td>' +
          '<td>' + esc(n.product_name || n.product_img) + '</td>' +
          '<td>' + stockBadge + '</td>' +
          '<td>' + esc(n.email) + '</td>' +
          '<td>' + esc(n.phone || '—') + '</td>' +
          '<td>' + (n.notified_at ? fmtDate(n.notified_at) : '<small style="color:var(--muted)">not yet</small>') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>';
  }
  document.getElementById('blastBtn').addEventListener('click', async function(){
    var b = document.getElementById('blastBtn');
    var orig = b.textContent;
    b.textContent = 'Sending…';
    b.disabled = true;
    try {
      var res = await api('/api/admin/notify-back-in-stock', { method:'POST' });
      alert('Back-in-stock blast sent.\n\n' +
            'Candidates: ' + res.candidates + '\n' +
            'Emails:     ' + (res.emails_sent || 0) + '\n' +
            'SMS:        ' + (res.sms_sent || 0));
      loadSummary();
      show(currentTab);
    } catch(e){
      alert('Failed: ' + e.message);
      b.textContent = orig;
      b.disabled = false;
    }
  });
}

async function renderReviews(panel){
  var r = await api('/api/admin/reviews');
  if (!r.reviews.length) return panel.innerHTML = '<div class="empty">No reviews yet.</div>';
  panel.innerHTML = '<table><thead><tr>' +
    '<th>When</th><th>Customer</th><th>Rating</th><th>Review</th><th>Vehicle</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>' +
    r.reviews.map(function(v){
      var stars = '★★★★★'.slice(0, v.rating) + '☆☆☆☆☆'.slice(0, 5 - v.rating);
      return '<tr>' +
        '<td>' + fmtDate(v.created_at) + '</td>' +
        '<td><b>' + esc(v.name) + '</b>' + (v.city ? '<br/><small>' + esc(v.city) + '</small>' : '') + '</td>' +
        '<td><span class="stars">' + stars + '</span></td>' +
        '<td>' + esc(v.body) + '</td>' +
        '<td>' + esc(v.vehicle || '—') + '</td>' +
        '<td>' + (v.approved ? badge('approved','approved') : badge('pending','unapproved')) + '</td>' +
        '<td class="actions">' +
          (v.approved
            ? '<button class="btn ghost" data-id="' + v.id + '" data-do="unapprove">Unapprove</button>'
            : '<button class="btn ok" data-id="' + v.id + '" data-do="approve">Approve</button>') +
          '<button class="btn del" data-id="' + v.id + '" data-do="delete">Delete</button>' +
        '</td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
  panel.querySelectorAll('[data-do]').forEach(function(b){
    b.addEventListener('click', async function(){
      var id = b.dataset.id;
      try {
        if (b.dataset.do === 'approve') await api('/api/admin/reviews/' + id, { method:'PATCH', body:{ approved: true } });
        else if (b.dataset.do === 'unapprove') await api('/api/admin/reviews/' + id, { method:'PATCH', body:{ approved: false } });
        else if (b.dataset.do === 'delete'){
          if (!confirm('Delete this review permanently?')) return;
          await api('/api/admin/reviews/' + id, { method:'DELETE' });
        }
        loadSummary();
        show(currentTab);
      } catch(e){ alert(e.message); }
    });
  });
}

// "Orders" is every completed sale, whichever door it came through: storefront
// orders (source 'online') and counter sales (source 'counter'), served
// pre-merged and pre-filtered by GET /api/admin/orders. Was storefront-only
// and called "Online Orders".
var ORDERS_FILTER = { source:'', status:'', payment:'', fulfilment:'', type:'', from:'', to:'', q:'' };
function ordersFilterBlank(){ return { source:'', status:'', payment:'', fulfilment:'', type:'', from:'', to:'', q:'' }; }

async function renderOrders(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var f = ORDERS_FILTER;
  var qs = Object.keys(f).filter(function(k){ return f[k]; })
    .map(function(k){ return k + '=' + encodeURIComponent(f[k]); }).join('&');
  var r;
  try { r = await api('/api/admin/orders' + (qs ? '?' + qs : '')); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load orders: ' + esc(e.message) + '</div>'; return; }
  var orders = r.orders || [];
  var sum = r.summary || { n: orders.length, total: 0 };
  var lim = r.limit || 300;

  var seg = function(name, val, label){
    var on = (f[name] || '') === val;
    return '<button type="button" class="ordSeg" data-k="' + name + '" data-v="' + esc(val) + '" style="padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:' +
      (on ? 'var(--navy)' : 'var(--card)') + ';color:' + (on ? '#fff' : 'var(--ink)') + ';font-weight:700;font-size:12px;cursor:pointer;font-family:inherit">' + esc(label) + '</button>';
  };
  var selFld = 'padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:inherit;background:var(--card);color:var(--ink)';
  var opt = function(v, cur, lbl){ return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(lbl != null ? lbl : v) + '</option>'; };

  panel.innerHTML =
    '<div style="padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card-soft);display:flex;flex-direction:column;gap:10px">' +
      '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
        '<span class="lbl" style="margin:0 3px 0 0">Source</span>' +
        seg('source','','All') + seg('source','online','🛒 Online') + seg('source','counter','🧾 Counter') +
        '<span style="width:14px"></span>' +
        '<span class="lbl" style="margin:0 3px 0 0">Customer</span>' +
        seg('type','','Any') + seg('type','account','Account') + seg('type','guest','Guest / walk-in') +
      '</div>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<select id="ordStatus" style="' + selFld + '">' + opt('', f.status, 'Any status') +
          ['pending','confirmed','ready','completed','cancelled','voided'].map(function(s){ return opt(s, f.status); }).join('') + '</select>' +
        '<select id="ordPay" style="' + selFld + '">' + opt('', f.payment, 'Any payment') +
          ['paid','partial','unpaid','refunded','failed'].map(function(s){ return opt(s, f.payment); }).join('') + '</select>' +
        '<select id="ordFul" style="' + selFld + '">' + opt('', f.fulfilment, 'Any fulfilment') +
          ['pickup','delivery','shipping'].map(function(s){ return opt(s, f.fulfilment); }).join('') + '</select>' +
        '<span class="lbl" style="margin:0">From</span><input type="date" id="ordFrom" value="' + esc(f.from) + '" style="' + selFld + '"/>' +
        '<span class="lbl" style="margin:0">To</span><input type="date" id="ordTo" value="' + esc(f.to) + '" style="' + selFld + '"/>' +
        '<input id="ordQ" placeholder="Search customer or ref…" value="' + esc(f.q) + '" style="' + selFld + ';min-width:190px;flex:1"/>' +
        '<button class="btn" id="ordApply">Apply</button>' +
        (qs ? '<button class="btn ghost" id="ordClear">Clear</button>' : '') +
      '</div>' +
      '<div style="display:flex;gap:8px">' + tile('orders', sum.n) + tile('value', fmtMoney(sum.total)) + '</div>' +
    '</div>' +
    (orders.length
      ? '<table><thead><tr><th>When</th><th>Ref</th><th>Source</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>' +
        orders.map(function(o){
          var srcBadge = o.source === 'online'
            ? '<span class="badge" style="background:#dbeafe;color:#1e40af">🛒 Online</span>'
            : '<span class="badge" style="background:#f3e8ff;color:#6b21a8">🧾 Counter</span>';
          var cust = esc(o.customer_name || (o.is_guest ? 'Guest / walk-in' : '—')) +
            (o.customer_phone ? '<br/><small><a href="tel:' + esc(o.customer_phone) + '">' + esc(o.customer_phone) + '</a></small>'
              : (o.customer_email ? '<br/><small style="color:var(--muted)">' + esc(o.customer_email) + '</small>' : ''));
          var payCls = o.payment_status === 'paid' ? 'ok' : (o.payment_status === 'unpaid' || o.payment_status === 'failed' ? 'bad' : 'pending');
          var stCls = ({ completed:'ok', confirmed:'ok', ready:'pending', pending:'pending', cancelled:'bad', voided:'bad' })[o.status] || 'pending';
          var statusCell = o.source === 'online'
            ? '<select class="statusEdit" data-id="' + o.id + '" data-kind="order">' +
                ['pending','confirmed','ready','completed','cancelled'].map(function(s){ return '<option value="' + s + '"' + (s === o.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
              '</select>'
            : badge(o.status, stCls);
          return '<tr' + (o.voided ? ' style="opacity:.55"' : '') + '>' +
            '<td>' + fmtDate(o.created_at) + '</td>' +
            '<td><b>' + esc(o.ref || '') + '</b></td>' +
            '<td>' + srcBadge + (o.fulfilment && o.fulfilment !== 'pickup' ? '<br/><small style="color:var(--muted)">' + esc(o.fulfilment) + '</small>' : '') + '</td>' +
            '<td>' + cust + '</td>' +
            '<td>' + (o.item_count || 0) + '</td>' +
            '<td><b>' + fmtMoney(o.total_usd) + '</b></td>' +
            '<td>' + badge(o.payment_status || '—', payCls) +
              (o.payment_method ? '<br/><small style="color:var(--muted)">' + esc(o.payment_method) + '</small>' : '') + '</td>' +
            '<td>' + statusCell + '</td>' +
            '<td class="actions">' +
              (o.source === 'online'
                ? '<a href="/pickslip.html?order=' + o.id + '" target="_blank" title="Pick slip" style="margin-right:6px;text-decoration:none;font-size:15px">📋</a>' +
                  '<button class="btn" data-ord-online="' + o.id + '">Open</button>'
                : '<button class="btn" data-ord-counter="' + o.id + '">Open</button>') +
            '</td>' +
          '</tr>';
        }).join('') + '</tbody></table>' +
        (orders.length >= lim ? '<div style="padding:10px 16px;color:var(--muted);font-size:12px">Showing the newest ' + lim + '. Narrow the filters to see older orders.</div>' : '')
      : '<div class="empty">No orders match these filters.</div>');

  wireStatusSelects(panel);
  panel.querySelectorAll('.ordSeg').forEach(function(b){
    b.addEventListener('click', function(){ ORDERS_FILTER[b.getAttribute('data-k')] = b.getAttribute('data-v'); renderOrders(panel); });
  });
  function applyFilters(){
    ORDERS_FILTER.status     = panel.querySelector('#ordStatus').value;
    ORDERS_FILTER.payment    = panel.querySelector('#ordPay').value;
    ORDERS_FILTER.fulfilment = panel.querySelector('#ordFul').value;
    ORDERS_FILTER.from       = panel.querySelector('#ordFrom').value;
    ORDERS_FILTER.to         = panel.querySelector('#ordTo').value;
    ORDERS_FILTER.q          = panel.querySelector('#ordQ').value.trim();
    renderOrders(panel);
  }
  panel.querySelector('#ordApply').addEventListener('click', applyFilters);
  panel.querySelector('#ordQ').addEventListener('keydown', function(e){ if (e.key === 'Enter') applyFilters(); });
  var clr = panel.querySelector('#ordClear');
  if (clr) clr.addEventListener('click', function(){ ORDERS_FILTER = ordersFilterBlank(); renderOrders(panel); });
  panel.querySelectorAll('[data-ord-counter]').forEach(function(b){
    b.addEventListener('click', function(){ posSaleDetail(b.getAttribute('data-ord-counter'), function(){ renderOrders(panel); }); });
  });
  panel.querySelectorAll('[data-ord-online]').forEach(function(b){
    b.addEventListener('click', function(){ showOrderDetail(b.getAttribute('data-ord-online'), function(){ renderOrders(panel); }); });
  });
}

// ============= PRODUCTS (with location field) =============
// Like the POS, this searches the server: the catalogue is ~23,000 parts and
// the old version pulled every one of them and rendered a table row each.
var PROD_PAGE_SIZE = 50;
var PROD_STATE = { q:'', cat:'', inStock:false, offset:0, rows:[] };

// ============= INVENTORY IMPORT =============
// Upload -> preview -> confirm. The preview step is not decoration: an
// inventory file rewrites the whole catalogue, and the shop's own export has
// title banners above the header, blank bin columns and the occasional
// negative quantity. Seeing what the server made of the file before it writes
// anything is the difference between a fixable mistake and a restore-from-
// backup afternoon.

// FormData must not carry an explicit Content-Type -- the browser has to set
// the multipart boundary itself -- so this cannot go through api().
async function inventoryImportPost(file, mode, deactivateMissing){
  var fd = new FormData();
  fd.append('file', file);
  var url = '/api/admin/inventory/import?mode=' + encodeURIComponent(mode) +
            (deactivateMissing ? '&deactivate_missing=true' : '');
  var res = await fetch(url, { method: 'POST', body: fd, credentials: 'same-origin' });
  var data = null;
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

function invImportStat(value, label, colour){
  return '<div style="flex:1;min-width:96px;background:var(--card-soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:center">' +
    '<div style="font-size:22px;font-weight:800;color:' + colour + ';line-height:1.1">' + value + '</div>' +
    '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:3px">' + esc(label) + '</div>' +
  '</div>';
}

function invImportIssueRows(issues){
  if (!issues || !issues.length) return '';
  var colours = { skipped:'#b91c1c', duplicate:'#b45309', warning:'#b45309' };
  return '<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:700;font-size:13px;color:var(--heading)">' +
      '⚠ ' + issues.length + ' row' + (issues.length === 1 ? '' : 's') + ' need a look</summary>' +
      '<div style="max-height:180px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:6px">' +
        issues.map(function(it){
          return '<div style="padding:6px 10px;border-bottom:1px solid var(--card-soft2);font-size:12.5px">' +
            '<b style="color:' + (colours[it.level] || 'var(--muted)') + '">line ' + it.line + '</b> · ' +
            esc(it.level) + ' — ' + esc(it.message) + '</div>';
        }).join('') +
      '</div></details>';
}

function invImportSampleTable(sample){
  if (!sample || !sample.length) return '';
  var cols = [['sku','Part no.'],['name','Description'],['stock_count','Qty'],
              ['price_usd','Price'],['bin_location','Bin'],['category','Category']];
  return '<details style="margin-top:10px" open><summary style="cursor:pointer;font-weight:700;font-size:13px;color:var(--heading)">First ' + sample.length + ' rows as the server read them</summary>' +
    '<div style="overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:6px">' +
      '<table style="width:100%;border-collapse:collapse;font-size:12.5px">' +
        '<thead><tr>' + cols.map(function(c){
          return '<th style="text-align:left;padding:6px 9px;background:var(--card-soft);border-bottom:1px solid var(--line);white-space:nowrap">' + c[1] + '</th>';
        }).join('') + '</tr></thead><tbody>' +
        sample.map(function(r){
          return '<tr>' + cols.map(function(c){
            var v = r[c[0]];
            if (c[0] === 'price_usd') v = (v == null ? '—' : fmtMoney(v));
            return '<td style="padding:5px 9px;border-bottom:1px solid var(--card-soft2);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis">' + esc(v == null ? '' : v) + '</td>';
          }).join('') + '</tr>';
        }).join('') +
      '</tbody></table>' +
    '</div></details>';
}

function invImportMappingRow(p){
  var mapped = p.mapped_columns || {};
  var keys = Object.keys(mapped);
  var chips = keys.map(function(k){
    return '<span style="display:inline-block;background:var(--card-soft2);border:1px solid var(--line);border-radius:20px;padding:2px 9px;margin:2px 3px 2px 0;font-size:11.5px">' +
      esc(mapped[k]) + ' <span style="color:var(--muted)">→</span> <b>' + esc(k) + '</b></span>';
  }).join('');
  var ignored = (p.ignored_columns || []).length
    ? '<div style="margin-top:6px;font-size:11.5px;color:var(--muted)">Ignored: ' +
        esc((p.ignored_columns || []).join(', ')) + '</div>'
    : '';
  return '<div style="margin-top:12px">' +
    '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:4px">Columns matched (header on line ' + p.header_line + ')</div>' +

async function startInventoryImport(file, onDone){
  posModal('📥 Import inventory',
    '<div id="invImpBody" style="font-size:13.5px;color:var(--muted);padding:14px 2px">' +
      'Reading <b>' + esc(file.name) + '</b>…' +
    '</div>', 780);

  var preview;
  try {
    preview = await inventoryImportPost(file, 'preview', false);
  } catch (e) {
    document.getElementById('invImpBody').innerHTML =
      '<div style="background:#fee2e2;color:#991b1b;border-radius:8px;padding:12px 14px;font-size:13.5px">' +
        '<b>Could not read that file.</b><div style="margin-top:6px">' + esc(e.message) + '</div>' +
      '</div>';
    return;
  }

  var body = document.getElementById('invImpBody');
  if (!body) return; // operator closed the dialog while it was parsing

  body.innerHTML =
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">' +
      esc(preview.file) + ' · ' + esc(preview.format) + ' (' + esc(preview.detail) + ') · ' +
      preview.rows_in_file + ' rows read, ' + preview.unique_parts + ' distinct parts' +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      invImportStat(preview.will_add, 'new parts', '#047857') +
      invImportStat(preview.will_update, 'updated', '#1d4ed8') +
      invImportStat(preview.issue_count, 'to review', preview.issue_count ? '#b45309' : 'var(--muted)') +
    '</div>' +
    invImportMappingRow(preview) +
    invImportSampleTable(preview.sample) +
    invImportIssueRows(preview.issues) +
    '<label style="display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:10px 12px;background:var(--card-soft);border:1px solid var(--line);border-radius:8px;cursor:pointer">' +
      '<input type="checkbox" id="invImpDeactivate" style="margin-top:2px"/>' +
      '<span style="font-size:12.5px"><b>Treat this file as the complete stock list.</b><br>' +
      '<span style="color:var(--muted)">Anything not in the file is hidden from the shop and the POS. ' +
      'Leave this off when importing only part of your stock.</span></span>' +
    '</label>' +
    '<div id="invImpMsg" style="display:none;margin-top:10px;padding:10px 12px;border-radius:6px;font-size:13px"></div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">' +
      '<button type="button" id="invImpCancel" class="btn">Cancel</button>' +
      '<button type="button" id="invImpGo" style="background:var(--red);color:#fff;border:0;border-radius:7px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:13.5px;font-family:inherit">' +
        'Import ' + preview.unique_parts + ' part' + (preview.unique_parts === 1 ? '' : 's') +
      '</button>' +
    '</div>';

  document.getElementById('invImpCancel').addEventListener('click', posCloseModal);

  document.getElementById('invImpGo').addEventListener('click', async function(){
    var btn = this;
    var deactivate = document.getElementById('invImpDeactivate').checked;
    var msg = document.getElementById('invImpMsg');

    // Hiding the entire rest of the catalogue is not undoable from this
    // screen, so it gets a second question rather than one stray click.
    if (deactivate) {
      var n = preview.will_deactivate;
      if (!confirm('This will hide ' + n + ' part' + (n === 1 ? '' : 's') +
                   ' that are not in this file, removing them from the shop and the POS.\n\nContinue?')) return;
    }

    btn.disabled = true;
    btn.textContent = 'Importing…';
    msg.style.display = 'block';
    msg.style.background = 'var(--card-soft)';
    msg.style.color = 'var(--muted)';
    msg.textContent = 'Writing ' + preview.unique_parts + ' parts — this can take a moment for a large file.';

    try {
      // Re-sent rather than cached server-side: holding a 23,000-row upload in
      // memory between two requests, keyed to nothing in particular, would be
      // a worse trade than one more upload.
      var r = await inventoryImportPost(file, 'commit', deactivate);
      msg.style.background = '#dcfce7';
      msg.style.color = '#166534';
      msg.innerHTML = '<b>Done.</b> ' + r.inserted + ' added, ' + r.updated + ' updated' +
                      (deactivate ? ', ' + r.will_deactivate + ' hidden' : '') + '.';
      btn.textContent = 'Imported';
      document.getElementById('invImpCancel').textContent = 'Close';
      if (onDone) onDone();
    } catch (e) {
      msg.style.background = '#fee2e2';
      msg.style.color = '#991b1b';
      msg.innerHTML = '<b>Import failed — nothing was changed.</b><div style="margin-top:4px">' + esc(e.message) + '</div>';
      btn.disabled = false;
      btn.textContent = 'Try again';
    }
  });
}

  // existing part — same keyboard model as the "Find another part" box in the
  // edit modal (↑/↓ to move, Enter to pick).
  (function(){
    var cost = document.getElementById('npCost'), mk = document.getElementById('npMarkup'), price = document.getElementById('npPrice');
    if (cost && mk && price) {
      var touched = false;
      price.addEventListener('input', function(){ touched = (price.value.trim() !== ''); });

      mk.addEventListener('input', recalc);

    var setV = function(id, v){ var el = document.getElementById(id); if (el && v != null && v !== '') el.value = v; };
    var setChk = function(id, v){ var el = document.getElementById(id); if (el) el.checked = !!v; };
    var hl = function(){
      var k = jout.children;
      for (var i = 0; i < k.length; i++) k[i].style.background = (i === jsel) ? 'var(--hover)' : 'var(--card)';
      if (jsel >= 0 && k[jsel]) k[jsel].scrollIntoView({ block: 'nearest' });
    };
    var render = function(){
      if (!jrows.length) { jout.style.display = 'none'; jout.innerHTML = ''; jsel = -1; return; }
      jout.innerHTML = jrows.map(function(x, i){
        return '<button type="button" data-i="' + i + '" style="display:flex;gap:9px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hover);background:var(--card);color:var(--ink);padding:8px 10px;cursor:pointer;font-family:inherit;font-size:12px">' +

      }).join('');
      jout.style.display = 'block';
      jout.querySelectorAll('button').forEach(function(b){
        b.addEventListener('mousedown', function(e){ e.preventDefault(); pick(jrows[parseInt(b.dataset.i, 10)]); });
        b.addEventListener('mouseenter', function(){ jsel = parseInt(b.dataset.i, 10); hl(); });
      });
      jsel = 0; hl();
    };
    var pick = async function(x){
      if (!x) return;
      jin.value = ''; jrows = []; render();
      var p = x;
      try { var full = (await api('/api/admin/products/' + encodeURIComponent(x.img))).product; if (full) p = Object.assign({}, x, full); } catch (_) {}
      setV('npName', p.name); setV('npMakeModel', p.make_model);
      var catSel = document.getElementById('npCategory'); if (catSel && p.category) catSel.value = p.category;
      var condSel = document.getElementById('npCondition'); if (condSel && p.condition) condSel.value = p.condition;
      setV('npCost', p.cost_usd); setV('npMarkup', p.markup_pct); setV('npPrice', p.price_usd);
      setV('npList', p.list_price_usd); setV('npLow', p.low_threshold);
      setV('npStockUom', p.stock_uom || 'each'); setV('npPurchUom', p.purchase_uom);
      setV('npUnitsPerPurch', p.units_per_purchase);
      var costSel = document.getElementById('npCosting'); if (costSel) costSel.value = p.costing_method || '';
      var supSel = document.getElementById('npSupplier'); if (supSel) supSel.value = p.supplier_id || '';
      setV('npSupPartNo', p.supplier_part_no); setV('npWarranty', p.warranty_days);
      setV('npBin', p.bin_location);
      var locSel = document.getElementById('npLocation'); if (locSel && p.location) locSel.value = p.location;
      setChk('npSerial', p.serial_required);
      posToast('Copied details from ' + (p.name || p.img) + ' — set a fresh SKU, photo and stock.');
      var nn = document.getElementById('npName'); if (nn) nn.focus();
    };
    var run = function(){
      var q = jin.value.trim();
      clearTimeout(jd);
      if (q.length < 2) { jrows = []; render(); return; }
      jd = setTimeout(async function(){
        var seq = ++jseq;
        try {
          var r = await api('/api/products?limit=40&offset=0&q=' + encodeURIComponent(q));
          if (seq !== jseq) return;
          jrows = r.products || []; render();
        } catch (e) { if (seq === jseq) { jrows = []; render(); } }
      }, 220);
    };
    jin.addEventListener('input', run);
    jin.addEventListener('keydown', function(e){
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!jrows.length) return;
        e.preventDefault();
        jsel = Math.max(0, Math.min(jrows.length - 1, (jsel < 0 ? 0 : jsel) + (e.key === 'ArrowDown' ? 1 : -1)));
        hl();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (jrows.length) pick(jrows[jsel >= 0 ? jsel : 0]);
      } else if (e.key === 'Escape') {
        jin.value = ''; jrows = []; render();
      }
    });
    jin.addEventListener('blur', function(){ setTimeout(function(){ jout.style.display = 'none'; }, 120); });
  })();

  // load() below is a hoisted function declaration, so passing it here before
  // its definition is fine -- it gives the importer a way to refresh the list
  // once rows have actually changed.
  var invImportInput = document.getElementById('invImportInput');
  if (invImportInput) {
    invImportInput.addEventListener('change', function(){
      var file = this.files && this.files[0];
      // Reset immediately: without this, picking the same file again after a
      // cancel fires no change event and the button looks broken.
      this.value = '';
      if (file) startInventoryImport(file, function(){ load(false); });
    });
  }
  var matrixCreateBtn = document.getElementById('matrixCreateBtn');
  if (matrixCreateBtn) matrixCreateBtn.addEventListener('click', function(){ matrixCreateModal(function(){ load(false); }); });

  var seq = 0;
  var debounce = null;

  async function load(append){
    var list = document.getElementById('prodList');
    var status = document.getElementById('prodStatus');
    if (!append){
      PROD_STATE.offset = 0;
      PROD_STATE.rows = [];
    }
    var mySeq = ++seq;
    status.textContent = 'Loading…';

    var qs = 'limit=' + PROD_PAGE_SIZE + '&offset=' + PROD_STATE.offset;
    if (PROD_STATE.q) qs += '&q=' + encodeURIComponent(PROD_STATE.q);
    if (PROD_STATE.cat) qs += '&category=' + encodeURIComponent(PROD_STATE.cat);
    if (PROD_STATE.inStock) qs += '&in_stock=1';

    var resp, total = null;
    try {
      resp = await api('/api/products?' + qs);
      if (!append){
        var cq = 'in_stock=' + (PROD_STATE.inStock ? '1' : '0') + (PROD_STATE.cat ? '&category=' + encodeURIComponent(PROD_STATE.cat) : '');
        // /products/count doesn't filter by q, so only claim a total when the
        // count actually covers what's on screen.
        if (!PROD_STATE.q){
          try { total = (await api('/api/products/count?' + cq)).count; } catch (_) {}
        }
      }
    } catch (e) {
      if (mySeq !== seq) return;
      status.textContent = '';
      list.innerHTML = '<div class="empty">Could not load parts: ' + esc(e.message || 'unknown error') + '</div>';
      return;
    }
    if (mySeq !== seq) return;

    var got = resp.products || [];
    PROD_STATE.rows = PROD_STATE.rows.concat(got);
    PROD_STATE.offset += got.length;

    if (!PROD_STATE.rows.length){
      status.textContent = '';
      list.innerHTML = '<div class="empty">No parts match that search.</div>';
      return;
    }

    list.innerHTML = '<table id="prodTable" tabindex="0" style="outline:none"><thead><tr>' +
      '<th>Part</th><th>Cat.</th><th>Cond.</th><th>Loc.</th><th>Bin</th><th>Price (USD)</th><th>Stock</th><th>Lvl</th><th></th>' +
      '</tr></thead><tbody>' +
      PROD_STATE.rows.map(function(p, i){
        var lvl = p.stock_level === 'out' ? badge('out','outstock') : p.stock_level === 'low' ? badge('low','lowstock') : badge('in','instock');
        var usd = p.price_usd != null ? '$' + Number(p.price_usd).toFixed(2) : '<span style="color:var(--muted)">no price</span>';
        // Part number (p.img, the PK / photo name) at the same size as the
        // part name; SKU bold. .skuCell is the target of the arrow-key blue
        // highlight (see the keydown handler below).
        return '<tr class="prodRow" data-i="' + i + '" data-img="' + esc(p.img) + '" style="cursor:pointer">' +
          '<td><b>' + esc(p.name) + '</b>' +
            (p.matrix_id ? ' <button type="button" class="btn" data-matrix="' + p.matrix_id + '" style="padding:1px 7px;font-size:10.5px;border-radius:10px;background:#ede9fe;color:#6d28d9;border:0;cursor:pointer;vertical-align:middle">🧬 matrix</button>' : '') +
            (p.item_type === 'service' ? ' <span style="padding:1px 7px;font-size:10.5px;border-radius:10px;background:#fef3c7;color:#92400e;vertical-align:middle">🧾 service</span>'
              : p.item_type === 'tracked' ? ' <span style="padding:1px 7px;font-size:10.5px;border-radius:10px;background:#e0f2fe;color:#075985;vertical-align:middle">🎫 tracked</span>' : '') +
            '<div style="margin-top:2px"><b class="skuCell" style="color:#0369a1">' + esc(p.sku || 'no SKU') + '</b>' +
              ' <span style="color:var(--muted)">' + esc(p.img) + '</span></div>' +
            (p.make_model ? '<small style="color:var(--muted)">' + esc(p.make_model) + '</small>' : '') + '</td>' +
          '<td>' + esc(p.category || '') + '</td>' +
          '<td>' + esc(p.condition || '') + '</td>' +
          '<td>' + esc(p.location || '—') + '</td>' +
          '<td>' + esc(p.bin_location || '—') + '</td>' +
          '<td>' + usd + '</td>' +
          '<td>' + p.stock_count + '</td>' +
          '<td>' + lvl + '</td>' +
          '<td class="actions"><button class="btn ok" data-editimg="' + esc(p.img) + '">✎ Edit</button> ' +
            '<button class="btn" data-rmimg="' + esc(p.img) + '" style="background:#fee2e2;color:#b91c1c;border:0">×</button></td>' +
        '</tr>';
      }).join('') + '</tbody></table>' +
      (got.length === PROD_PAGE_SIZE
        ? '<div style="padding:12px;text-align:center"><button id="prodMore" class="btn" type="button">Load more</button></div>'
        : '');

    status.textContent = 'Showing ' + PROD_STATE.rows.length + (total != null ? ' of ' + total.toLocaleString('en-US') : '') + ' parts';

    var more = document.getElementById('prodMore');
    if (more) more.addEventListener('click', function(){ load(true); });
    wireRows(list);
  }

  function wireRows(scope){
    var openEdit = function(img){
      var p = PROD_STATE.rows.find(function(x){ return x.img === img; });
      if (p) productEditModal(p, function(){ load(false); });
    };
    scope.querySelectorAll('[data-editimg]').forEach(function(btn){
      btn.addEventListener('click', function(e){ e.stopPropagation(); openEdit(btn.getAttribute('data-editimg')); });
    });
    scope.querySelectorAll('[data-matrix]').forEach(function(btn){
      btn.addEventListener('click', function(e){ e.stopPropagation(); matrixManagerModal(parseInt(btn.getAttribute('data-matrix'), 10), function(){ load(false); }); });
    });
    scope.querySelectorAll('.prodRow').forEach(function(tr){
      tr.addEventListener('click', function(){ openEdit(tr.getAttribute('data-img')); });
      tr.addEventListener('mouseenter', function(){
        var t = document.getElementById('prodTable');
        if (t && t.__setSel) t.__setSel(parseInt(tr.getAttribute('data-i'), 10));
      });
    });
    scope.querySelectorAll('[data-rmimg]').forEach(function(btn){
      btn.addEventListener('click', async function(e){
        e.stopPropagation();
        if (!(await posConfirm('Remove this part from inventory?', { ok:'Remove', danger:true }))) return;
        var img = btn.getAttribute('data-rmimg');
        try { await api('/api/admin/products/' + encodeURIComponent(img), { method:'DELETE' }); load(false); }
        catch (err) { posToast(err.message, true); }
      });
    });

    // Arrow-key navigation over the rows, with the SKU cell highlighted blue as
    // the selection scrolls -- Enter opens the edit modal for the selected row.
    var table = document.getElementById('prodTable');
    if (table) {
      var sel = -1;
      var paint = function(scroll){
        var rows = table.querySelectorAll('.prodRow');
        rows.forEach(function(r, i){
          var sku = r.querySelector('.skuCell');
          var on = i === sel;
          r.style.background = on ? 'rgba(3,105,161,.12)' : '';
          if (sku){
            sku.style.background = on ? '#0369a1' : '';
            sku.style.color = on ? '#fff' : '#0369a1';
            sku.style.padding = on ? '1px 5px' : '';
            sku.style.borderRadius = on ? '3px' : '';
          }
        });
        if (scroll && sel >= 0 && rows[sel]) rows[sel].scrollIntoView({ block: 'nearest' });
      };
      table.__setSel = function(i){ sel = i; paint(false); };
      table.addEventListener('keydown', function(e){
        var rows = table.querySelectorAll('.prodRow');
        if (!rows.length) return;
        if (e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(rows.length - 1, sel + 1); paint(true); }
        else if (e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(0, sel - 1); paint(true); }
        else if (e.key === 'Enter' && sel >= 0){ e.preventDefault(); openEdit(rows[sel].getAttribute('data-img')); }
      });
    }
  }
