async function renderRoles(panel, openCode){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r;
  try { r = await api('/api/admin/roles'); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }

  var groups = SIDEBAR_GROUPS;
  var totalScreens = 0;
  groups.forEach(function(g){ totalScreens += g.items.length; });
  function plainTitle(t){ return t.replace(/^[^A-Za-z0-9]+\s*/, ''); }
  function realHidden(role){
    var h = Array.isArray(role.hidden_tabs) ? role.hidden_tabs : [];
    var n = 0;
    groups.forEach(function(g){ g.items.forEach(function(t){ if (h.indexOf(t.tab) >= 0) n++; }); });
    return n;
  }

  function editorHtml(role){
    var hidden = Array.isArray(role.hidden_tabs) ? role.hidden_tabs : [];
    var cats = groups.map(function(g, gi){
      var shownInGrp = g.items.filter(function(t){ return hidden.indexOf(t.tab) < 0; }).length;
      var perms = g.items.map(function(t){
        var on = hidden.indexOf(t.tab) < 0 ? ' checked' : '';
        return '<label class="qbo-perm"><input type="checkbox" class="qbo-tab" value="' + esc(t.tab) + '"' + on + '/> ' + esc(t.label) + '</label>';
      }).join('');
      return '<div class="qbo-cat" data-gi="' + gi + '">' +
          '<div class="qbo-cat-hd">' +
            '<span class="chev">▶</span>' +
            '<span class="qbo-cat-nm">' + esc(plainTitle(g.title)) + '</span>' +
            '<span class="qbo-cat-ct"><span class="qbo-cat-n">' + shownInGrp + '</span> of ' + g.items.length + '</span>' +
          '</div>' +
          '<div class="qbo-cat-bd">' +
            '<label class="qbo-perm all"><input type="checkbox" class="qbo-catall"' + (shownInGrp === g.items.length ? ' checked' : '') + '/> Select all</label>' +
            perms +
          '</div>' +
        '</div>';
    }).join('');

    return '<div class="qbo-editor" data-role="' + esc(role.code) + '">' +
      '<h3>' + esc(role.label) + '</h3>' +
      '<div class="qbo-code">' + esc(role.code) + ' · ' + role.member_count + ' staff · seniority ' + role.rank + '</div>' +
      (role.is_system
        ? ''
        : '<div class="qbo-sec">Role details</div>' +
          '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">' +
            '<div><label class="lbl">Name</label><input class="fld qbo-elabel" value="' + esc(role.label) + '"/></div>' +
            '<div><label class="lbl">Seniority</label><input class="fld qbo-erank" type="number" value="' + role.rank + '" style="width:100px"/></div>' +
          '</div>') +
      '<div class="qbo-sec">Manager access</div>' +
      '<label class="qbo-switch">' +
        '<input type="checkbox" class="qbo-emanage"' + (role.can_manage ? ' checked' : '') + '/>' +
        '<span><span class="t">Counts as a manager</span>' +
        '<span class="d">Passes the manager-only checks on the server — receiving stock, editing pricing, issuing refunds, managing staff. The screen list below still controls the sidebar.</span></span>' +
      '</label>' +
      '<div class="qbo-sec">Screens this role can open</div>' +
      cats +
      '<div class="qbo-foot">' +
        '<button class="qbo-btn qbo-save" data-code="' + esc(role.code) + '">Save changes</button>' +
        '<button class="qbo-btn ghost qbo-cancel">Cancel</button>' +
        '<span class="qbo-msg"></span>' +
        '<span class="sp"></span>' +
        (role.is_system ? '' : '<button class="qbo-btn danger qbo-del" data-code="' + esc(role.code) + '">Delete role</button>') +
      '</div>' +
    '</div>';
  }

  var rowsHtml = r.roles.map(function(role){
    var locked = role.code === 'owner';
    var shown = totalScreens - realHidden(role);
    var access = role.can_manage
      ? '<span class="qbo-pill mgr">✓ Manager rights</span>'
      : '<span class="qbo-pill ltd">Limited</span> <span style="color:var(--muted);font-size:12px;margin-left:6px">sees ' + shown + ' of ' + totalScreens + ' screens</span>';
    return '<tbody>' +
      '<tr class="qbo-row' + (role.code === openCode ? ' open' : '') + '" data-code="' + esc(role.code) + '">' +
        '<td><div class="qbo-rolename">' + esc(role.label) + (role.is_system ? '<span class="qbo-pill sys">Built in</span>' : '') + '</div>' +
            '<div class="qbo-code">' + esc(role.code) + '</div></td>' +
        '<td>' + access + '</td>' +
        '<td>' + role.member_count + '</td>' +
        '<td style="text-align:right">' + (locked
          ? '<span style="color:var(--muted);font-size:12px">Locked</span>'
          : '<button class="qbo-link">Edit</button>') + '</td>' +
      '</tr>' +
      (locked ? '' :
        '<tr class="qbo-editrow" data-code="' + esc(role.code) + '"' + (role.code === openCode ? '' : ' hidden') + '>' +
          '<td colspan="4" style="padding:0">' + editorHtml(role) + '</td>' +
        '</tr>') +
    '</tbody>';
  }).join('');

  panel.innerHTML =
    QBO_ROLES_CSS +
    '<div class="qbo">' +
      '<div class="qbo-hd">' +
        '<div><h2>Roles &amp; permissions</h2>' +
          '<p>A role is a set of screens plus whether it clears the manager bar. Add one to hand out part of a manager’s access without the rest. The Owner role is fixed — it is the way back in if a permission is set wrong.</p></div>' +
        '<button class="qbo-btn" id="qboNewToggle">＋ New role</button>' +
      '</div>' +
      '<div class="qbo-new" id="qboNewForm" hidden>' +
        '<form class="row" onsubmit="event.preventDefault();submitRole();">' +
          '<div><label class="lbl">Role name</label><input id="nrLabel" class="fld" placeholder="e.g. Supervisor"/></div>' +
          '<div><label class="lbl">Seniority <span style="text-transform:none;letter-spacing:0;font-weight:400">(lower = more senior)</span></label><input id="nrRank" type="number" class="fld" value="50" style="width:120px"/></div>' +
          '<label style="display:inline-flex;align-items:center;gap:7px;font-size:13px;padding-bottom:9px"><input type="checkbox" id="nrManage"/> Counts as a manager</label>' +
          '<button class="qbo-btn" id="nrCreate" type="submit" style="margin-bottom:1px">Create role</button>' +
          '<button class="qbo-btn ghost" id="nrCancel" type="button" style="margin-bottom:1px">Cancel</button>' +
          '<span id="nrMsg" class="qbo-msg" style="margin-left:4px"></span>' +
        '</form>' +
      '</div>' +
      '<table class="qbo-table"><thead><tr><th>Role</th><th>Access</th><th>Users</th><th></th></tr></thead>' +
        rowsHtml +
      '</table>' +
    '</div>';

  // ---- New-role form toggle -------------------------------------------------
  var newForm = panel.querySelector('#qboNewForm');
  panel.querySelector('#qboNewToggle').addEventListener('click', function(){
    newForm.hidden = !newForm.hidden;
    if (!newForm.hidden) panel.querySelector('#nrLabel').focus();
  });
  panel.querySelector('#nrCancel').addEventListener('click', function(){ newForm.hidden = true; });

  // ---- Row expand / collapse (one editor open at a time) ------------------
  panel.querySelectorAll('.qbo-row').forEach(function(row){
    row.addEventListener('click', function(){
      var code = row.getAttribute('data-code');
      var edit = panel.querySelector('.qbo-editrow[data-code="' + code + '"]');
      if (!edit) return;
      var wasOpen = !edit.hidden;
      panel.querySelectorAll('.qbo-editrow').forEach(function(e){ e.hidden = true; });
      panel.querySelectorAll('.qbo-row').forEach(function(r2){ r2.classList.remove('open'); });
      if (!wasOpen) { edit.hidden = false; row.classList.add('open'); }
    });
  });

  // ---- Inside each editor -------------------------------------------------
  panel.querySelectorAll('.qbo-editor').forEach(function(ed){
    function syncCat(cat){
      var boxes = cat.querySelectorAll('.qbo-tab');
      var on = 0;
      boxes.forEach(function(b){ if (b.checked) on++; });
      cat.querySelector('.qbo-cat-n').textContent = on;
      var all = cat.querySelector('.qbo-catall');
      all.checked = on === boxes.length;
      all.indeterminate = on > 0 && on < boxes.length;
    }
    ed.querySelectorAll('.qbo-cat').forEach(function(cat){
      cat.querySelector('.qbo-cat-hd').addEventListener('click', function(e){
        if (e.target.classList.contains('qbo-catall')) return;   // let the checkbox act
        cat.classList.toggle('open');
      });
      cat.querySelector('.qbo-catall').addEventListener('click', function(e){ e.stopPropagation(); });
      cat.querySelector('.qbo-catall').addEventListener('change', function(){
        var want = this.checked;
        cat.querySelectorAll('.qbo-tab').forEach(function(b){ b.checked = want; });
        syncCat(cat);
      });
      cat.querySelectorAll('.qbo-tab').forEach(function(b){ b.addEventListener('change', function(){ syncCat(cat); }); });
    });

    ed.querySelector('.qbo-cancel').addEventListener('click', function(){
      var er = ed.closest('.qbo-editrow');
      er.hidden = true;
      panel.querySelector('.qbo-row[data-code="' + er.getAttribute('data-code') + '"]').classList.remove('open');
    });

    ed.querySelector('.qbo-save').addEventListener('click', async function(){
      var code = this.getAttribute('data-code');
      var msg = ed.querySelector('.qbo-msg');
      var body = {
        can_manage: ed.querySelector('.qbo-emanage').checked,
        hidden_tabs: Array.prototype.filter.call(ed.querySelectorAll('.qbo-tab'), function(x){ return !x.checked; })
                          .map(function(x){ return x.value; }),
      };
      var elabel = ed.querySelector('.qbo-elabel');
      if (elabel && elabel.value.trim()) body.label = elabel.value.trim();
      var erank = ed.querySelector('.qbo-erank');
      if (erank && erank.value !== '') body.rank = parseInt(erank.value, 10) || 50;
      msg.textContent = 'Saving…'; msg.style.color = 'var(--muted)';
      try {
        await api('/api/admin/roles/' + encodeURIComponent(code), { method: 'PATCH', body: body });
        // The sidebar is built from the signed-in user's own role, so re-read it.
        await loadMyRole();
        buildSidebar();
        renderRoles(panel, code);
      } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; }
    });

    var del = ed.querySelector('.qbo-del');
    if (del) del.addEventListener('click', async function(){
      if (!confirm('Delete this role? Staff must be moved off it first.')) return;
      try { await api('/api/admin/roles/' + encodeURIComponent(this.getAttribute('data-code')), { method: 'DELETE' }); renderRoles(panel); }
      catch (e) { ed.querySelector('.qbo-msg').textContent = e.message; ed.querySelector('.qbo-msg').style.color = 'var(--red)'; }
    });
  });
}

async function submitRole(panel){
  panel = panel || document.getElementById('panel') || document.querySelector('.content-area');
  var msg = document.getElementById('nrMsg');
  var label = document.getElementById('nrLabel').value.trim();
  if (!label) { msg.textContent = 'Give it a name'; msg.style.color = 'var(--red)'; return; }
  msg.textContent = 'Adding…'; msg.style.color = 'var(--muted)';
  try {
    var res = await api('/api/admin/roles', { method: 'POST', body: {
      label: label,
      rank: parseInt(document.getElementById('nrRank').value, 10) || 50,
      can_manage: document.getElementById('nrManage').checked,
    }});
    renderRoles(panel, res && res.role && res.role.code);
  } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; }
}

async function submitStaff(){
  var msg = document.getElementById('sfMsg');
  var body = {
    name: document.getElementById('sfName').value.trim(),
    email: document.getElementById('sfEmail').value.trim(),
    phone: document.getElementById('sfPhone').value.trim() || null,
    password: document.getElementById('sfPass').value,
    employee_no: document.getElementById('sfEmpNo').value.trim() || null,
    national_id: document.getElementById('sfNid').value.trim() || null,
    admin_role: document.getElementById('sfRole').value,
    is_admin: document.getElementById('sfIsAdmin').checked,
    categories: Array.prototype.map.call(document.querySelectorAll('.sfNewCat:checked'), function(c){ return parseInt(c.value, 10); }),
  };
  var pin = document.getElementById('sfPin').value.trim();
  if (pin) body.pin = pin;
  msg.style.display = 'block'; msg.textContent = 'Creating…';
  msg.style.background = 'var(--card-soft)'; msg.style.color = 'var(--muted)';
  try {

async function renderStaffCategories(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r, capsRes;
  try {
    r = await api('/api/admin/user-categories');
    capsRes = await api('/api/admin/capabilities');
  }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  var CAPS = capsRes.capabilities || [];
  var CAP_GROUPS = {};
  CAPS.forEach(function(c){ (CAP_GROUPS[c.group] = CAP_GROUPS[c.group] || []).push(c); });

  // One category's function-permission grid. Ticked = the category allows it;
  // unticked = members are denied it (a member's own record can re-grant).
  function catPermGrid(c){
    var deny = (c.perms && typeof c.perms === 'object') ? c.perms : {};
    return '<tr id="catP' + c.id + '" style="display:none"><td colspan="8" style="background:var(--card-soft)">' +
      '<div style="padding:12px 6px;max-width:900px">' +
        '<div style="font-weight:700;font-size:13px;margin-bottom:8px">Function permissions for “' + esc(c.label) + '”' +
          ' <small style="color:var(--muted);font-weight:400">unticked = members of this category cannot do it</small></div>' +
        Object.keys(CAP_GROUPS).map(function(g){
          return '<div style="margin-bottom:8px"><div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;margin-bottom:4px">' + esc(g) + '</div>' +
            CAP_GROUPS[g].map(function(cap){
              var allowed = deny[cap.key] !== false;
              return '<label style="display:inline-flex;align-items:center;gap:5px;margin:0 14px 5px 0;font-size:12.5px">' +
                '<input type="checkbox" class="catPerm' + c.id + '" data-cap="' + esc(cap.key) + '"' + (allowed ? ' checked' : '') + '/>' + esc(cap.label) + '</label>';
            }).join('') + '</div>';
        }).join('') +
        '<button class="btn ok" data-catpermsave="' + c.id + '">Save permissions</button> ' +
        '<span id="catPMsg' + c.id + '" style="font-size:12.5px;margin-left:8px"></span>' +
      '</div></td></tr>';
  }

  panel.innerHTML =
    '<div style="padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card-soft)">' +
      '<form id="newCat" style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end" onsubmit="event.preventDefault();submitCategory();">' +
        '<div><label class="lbl">New category</label><input id="ncLabel" class="fld" placeholder="e.g. Tyre fitter" style="width:200px"/></div>' +
        '<div><label class="lbl">Department</label><input id="ncDept" class="fld" placeholder="service / counter" style="width:160px"/></div>' +
        '<div><label class="lbl">Order</label><input id="ncSort" type="number" class="fld" value="100" style="width:90px"/></div>' +
        '<button class="btn" type="submit">Add</button>' +
        '<span id="ncMsg" style="font-size:12.5px;margin-left:6px"></span>' +
      '</form>' +
    '</div>' +
    '<table><thead><tr><th>Label</th><th>Code</th><th>Department</th><th>Staff</th><th>People</th><th>Restrictions</th><th>Status</th><th></th></tr></thead><tbody>' +
    r.categories.map(function(c){
      var denyCount = Object.values((c.perms && typeof c.perms === 'object') ? c.perms : {}).filter(function(v){ return v === false; }).length;
      return '<tr' + (c.is_active ? '' : ' style="opacity:.55"') + '>' +
        '<td><b>' + esc(c.label) + '</b>' + (c.is_system ? ' <small style="color:var(--muted)">built in</small>' : '') + '</td>' +
        '<td><code style="font-size:12px">' + esc(c.code) + '</code></td>' +
        '<td>' + esc(c.department || '—') + '</td>' +
        '<td>' + (c.is_staff ? 'yes' : 'no') + '</td>' +
        '<td>' + c.member_count + '</td>' +
        '<td>' + (denyCount ? badge(denyCount + ' function' + (denyCount === 1 ? '' : 's') + ' blocked', 'info') : '<small style="color:var(--muted)">none</small>') + '</td>' +
        '<td>' + badge(c.is_active ? 'active' : 'inactive', c.is_active ? 'ok' : 'bad') + '</td>' +
        '<td class="actions">' +
          '<button class="btn" data-catperm="' + c.id + '">⚙ Permissions</button> ' +
          '<button class="btn" data-tog="' + c.id + '" data-on="' + c.is_active + '">' + (c.is_active ? 'Deactivate' : 'Reactivate') + '</button>' +
          // System categories are looked up by code by the till and the service
          // module, so removing one would break a feature rather than tidy a list.
          (c.is_system ? '' : ' <button class="btn" data-del="' + c.id + '">Delete</button>') +
        '</td></tr>' + catPermGrid(c);
    }).join('') + '</tbody></table>';

  panel.querySelectorAll('[data-catperm]').forEach(function(b){
    b.addEventListener('click', function(){
      var row = document.getElementById('catP' + this.getAttribute('data-catperm'));
      row.style.display = row.style.display === 'none' ? '' : 'none';
    });
  });
  panel.querySelectorAll('[data-catpermsave]').forEach(function(b){
    b.addEventListener('click', async function(){
      var id = this.getAttribute('data-catpermsave');
      var msg = document.getElementById('catPMsg' + id);
      var perms = {};
      panel.querySelectorAll('.catPerm' + id).forEach(function(cb){
        if (!cb.checked) perms[cb.getAttribute('data-cap')] = false;
      });
      msg.textContent = 'Saving…'; msg.style.color = 'var(--muted)';
      try {
        await api('/api/admin/user-categories/' + id + '/perms', { method: 'PATCH', body: { perms: perms } });
        msg.textContent = 'Saved. Members see it on their next page load.'; msg.style.color = '#15803d';
      } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--red)'; }
    });
  });

  panel.querySelectorAll('[data-tog]').forEach(function(b){
    b.addEventListener('click', async function(){
      var on = this.getAttribute('data-on') === 'true';
      try { await api('/api/admin/user-categories/' + this.getAttribute('data-tog'), { method: 'PATCH', body: { is_active: !on } }); renderStaffCategories(panel); }
      catch (e) { alert(e.message); }
    });
  });
  panel.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click', async function(){
      if (!confirm('Delete this category? Anyone holding it loses it.')) return;
      try { await api('/api/admin/user-categories/' + this.getAttribute('data-del'), { method: 'DELETE' }); renderStaffCategories(panel); }
      catch (e) { alert(e.message); }
    });
  });
}

// ============= TIME CLOCK =============
async function renderTimeClock(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var entries, mechs;
  try {
    entries = (await api('/api/admin/time-entries')).entries || [];
    mechs = (await api('/api/admin/mechanics?active=true')).mechanics || [];
  } catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  var open = entries.filter(function(e){ return !e.clocked_out_at; });
  var mechOptions = mechs.map(function(m){ return '<option value="' + m.id + '">' + esc(m.name) + '</option>'; }).join('');

  panel.innerHTML =
    '<div style="padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:end;flex-wrap:wrap">' +
      '<div><label class="lbl">Clock in</label><select id="tcMech" class="fld" style="width:200px">' + mechOptions + '</select></div>' +
      '<div><label class="lbl">Work order # (optional)</label><input id="tcWo" class="fld" style="width:140px" placeholder="WO id"/></div>' +
      '<button class="btn ok" id="tcClockIn">⏱ Clock in</button>' +
      // Picking your own name off a dropdown is not a record of who was here,
      // it is a record of what someone selected. A PIN identifies the person,
      // and on a shared screen it is also faster than finding yourself in a
      // list of the whole workshop.
      '<button class="btn" id="tcPinIn" title="Identify yourself with your PIN">🔑 Clock in with PIN</button>' +
    '</div>' +
    (open.length
      ? '<div style="padding:12px 16px"><h3 style="margin:0 0 8px;font-size:13px">🟢 Currently clocked in</h3>' +
        '<table><thead><tr><th>Mechanic</th><th>WO</th><th>Since</th><th></th></tr></thead><tbody>' +
        open.map(function(e){
          return '<tr><td><b>' + esc(e.mechanic_name || '') + '</b></td><td>' + esc(e.wo_number || '—') + '</td>' +
            '<td>' + fmtDate(e.clocked_in_at) + '</td>' +
            '<td class="actions"><button class="btn" data-out="' + e.id + '">Clock out</button></td></tr>';
        }).join('') + '</tbody></table></div>'
      : '') +
    '<div style="padding:12px 16px"><h3 style="margin:0 0 8px;font-size:13px">📋 Recent entries</h3>' +
      (entries.length
        ? '<table><thead><tr><th>Mechanic</th><th>WO</th><th>In</th><th>Out</th><th>Hours</th></tr></thead><tbody>' +
          entries.map(function(e){
            return '<tr><td>' + esc(e.mechanic_name || '') + '</td><td>' + esc(e.wo_number || '—') + '</td>' +
              '<td>' + fmtDate(e.clocked_in_at) + '</td><td>' + (e.clocked_out_at ? fmtDate(e.clocked_out_at) : '—') + '</td>' +
              '<td>' + (e.hours != null ? Number(e.hours).toFixed(2) : '—') + '</td></tr>';
          }).join('') + '</tbody></table>'
        : '<div class="empty">No time entries yet.</div>') +
    '</div>';

  async function clockIn(mechanicId){
    try {
      await api('/api/admin/time-entries/clock-in', { method:'POST', body: {
        mechanic_id: mechanicId, work_order_id: document.getElementById('tcWo').value || null,
      }});
      show('timeclock');
    } catch (e) { alert(e.message); }
  }
  document.getElementById('tcClockIn').addEventListener('click', function(){
    var mid = document.getElementById('tcMech').value;
    if (!mid) { alert('No active mechanics to clock in.'); return; }
    clockIn(mid);
  });
  document.getElementById('tcPinIn').addEventListener('click', async function(){
    var who = await posPinPrompt({
      purpose: 'clock',
      title: 'Clock in',
      detail: 'Enter your PIN to start your shift.',
    });
    if (!who) return;
    // The time clock keys on mechanics(id); rep_id is that same row, resolved
    // server-side from the signed-in person's categories.
    if (!who.rep_id) {
      alert(who.name + ' has no service record, so there is nothing to clock time against.\n\n' +
            'Give them a category under Settings → Users & Staff.');
      return;
    }
    clockIn(who.rep_id);
  });
  panel.querySelectorAll('[data-out]').forEach(function(b){
    b.addEventListener('click', async function(){
      try { await api('/api/admin/time-entries/' + b.getAttribute('data-out') + '/clock-out', { method:'POST' }); show('timeclock'); }
      catch (e) { alert(e.message); }
    });
  });
}

async function renderSchedule(panel){

  var qs = SCHED_ANCHOR ? '?week=' + SCHED_ANCHOR : '';
  var r, mechs;
  try {
    r = await api('/api/admin/schedule' + qs);
    mechs = (await api('/api/admin/mechanics?active=true')).mechanics || [];
  } catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }

  panel.innerHTML =
    '<div style="padding:12px 16px;background:var(--card-soft);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center">' +
      '<button class="btn" id="schedPrev">‹ Prev week</button>' +
      '<button class="btn" id="schedThis">This week</button>' +
      '<button class="btn" id="schedNext">Next week ›</button>' +
      '<b style="margin-left:8px">' + r.week_start + ' — ' + r.week_end + '</b>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px">' +
      '<div class="panel">' +
        '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">📅 Service appointments (' + r.appointments.length + ')</div>' +
        '<div style="padding:10px 14px">' +
          (r.appointments.length ? r.appointments.map(function(a){
            return '<div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)">' +
              '<b>' + esc(a.name) + '</b> — ' + esc([a.vehicle_year,a.vehicle_make,a.vehicle_model].filter(Boolean).join(' ')) + '<br/>' +
              (a.preferred_date ? new Date(a.preferred_date).toLocaleDateString() : '') + (a.time_slot ? ' · ' + esc(a.time_slot) : '') + ' ' + badge(a.status, a.status) + '</div>';
          }).join('') : '<div class="empty" style="padding:10px 0">None this week.</div>') +
        '</div>' +
      '</div>' +
      '<div class="panel">' +
        '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">🛠 Work orders (' + r.work_orders.length + ')</div>' +
        '<div style="padding:10px 14px">' +
          (r.work_orders.length ? r.work_orders.map(function(w){
            return '<div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)">' +
              '<b>' + esc(w.wo_number) + '</b> — ' + esc(w.customer_name) + '<br/>' +
              esc(w.mechanic_name || 'unassigned') + ' · ' + badge(w.status, w.status==='paid'?'ok':'pending') + (w.priority==='rush' ? ' ' + badge('rush','bad') : '') + '</div>';
          }).join('') : '<div class="empty" style="padding:10px 0">None this week.</div>') +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div style="padding:0 16px 16px">' +
      '<div class="panel">' +
        '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">🚫 Blocked time</div>' +
        '<div style="padding:10px 14px">' +
          (r.blocks.length ? r.blocks.map(function(b){
            return '<div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)">' +
              esc(b.mechanic_name || 'Shop-wide') + ' — ' + new Date(b.block_date).toLocaleDateString() + (b.time_slot ? ' ' + esc(b.time_slot) : '') +
              (b.reason ? ' — ' + esc(b.reason) : '') + ' <button class="btn" data-del="' + b.id + '" style="padding:2px 8px;font-size:10.5px;background:#fee2e2;color:#b91c1c">✕</button></div>';
          }).join('') : '<div class="empty" style="padding:10px 0">Nothing blocked this week.</div>') +
          '<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:var(--sky-dark);font-weight:700">+ Block time</summary>' +
            '<form style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;max-width:600px" onsubmit="event.preventDefault();submitScheduleBlock();">' +
              '<select id="sbMech" class="fld"><option value="">Shop-wide</option>' + mechs.map(function(m){ return '<option value="' + m.id + '">' + esc(m.name) + '</option>'; }).join('') + '</select>' +
              '<input id="sbDate" type="date" required class="fld"/>' +
              '<input id="sbReason" class="fld" placeholder="Reason"/>' +
              '<button type="submit" class="btn ok" style="grid-column:1/-1;width:fit-content">Save</button>' +
            '</form></details>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('schedPrev').addEventListener('click', function(){ shiftSchedWeek(-7); renderSchedule(panel); });
  document.getElementById('schedThis').addEventListener('click', function(){ SCHED_ANCHOR = null; renderSchedule(panel); });
  document.getElementById('schedNext').addEventListener('click', function(){ shiftSchedWeek(7); renderSchedule(panel); });
  panel.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click', async function(){
      try { await api('/api/admin/schedule-blocks/' + b.getAttribute('data-del'), { method:'DELETE' }); renderSchedule(panel); }
      catch (e) { alert(e.message); }
    });
  });
}
function shiftSchedWeek(days){
  var d = SCHED_ANCHOR ? new Date(SCHED_ANCHOR) : new Date();
  d.setDate(d.getDate() + days);
  SCHED_ANCHOR = d.toISOString().slice(0, 10);
}
async function submitScheduleBlock(){
  try {
    await api('/api/admin/schedule-blocks', { method:'POST', body: {
      mechanic_id: document.getElementById('sbMech').value || null,
      block_date: document.getElementById('sbDate').value,
      reason: document.getElementById('sbReason').value.trim() || null,
    }});
    show('schedule');
  } catch (e) { alert(e.message); }
}

// A parts pull: search the live catalogue (same feel as the POS cart), build a
// multi-line list with qty + optional price, and attach it to a work order OR
// run it standalone (counter / internal / stock transfer -- work_order_id NULL).
var PARTSREQ_VIEW_ID = null;
var PARTSREQ_STATUS_FILTER = '';

async function renderPartsReq(panel){
  if (PARTSREQ_VIEW_ID) return renderPartsReqDetail(panel, PARTSREQ_VIEW_ID);
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r, mechs = [];
  try {
    r = await api('/api/admin/parts-requisitions' + (PARTSREQ_STATUS_FILTER ? '?status=' + encodeURIComponent(PARTSREQ_STATUS_FILTER) : ''));
    try { mechs = (await api('/api/admin/mechanics?active=true')).mechanics || []; } catch (_) {}
  } catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }

  var draft = { items: [] };   // { product_img, sku, name, qty, price }
  function prPartNo(p){ return p.sku || p.barcode || ((p.img || '').split('/').pop()) || '—'; }

  var fld = 'padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card);color:var(--ink)';
  var statuses = ['', 'pending', 'partial', 'backordered', 'fulfilled'];
  var filterChips = statuses.map(function(s){
    var on = PARTSREQ_STATUS_FILTER === s;
    return '<button type="button" class="prFilt" data-s="' + s + '" style="padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:' +
      (on ? 'var(--navy)' : 'var(--card)') + ';color:' + (on ? '#fff' : 'var(--ink)') + ';font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">' +
      (s || 'All') + '</button>';
  }).join(' ');

  panel.innerHTML =
    '<details open style="border-bottom:1px solid var(--line);background:var(--card-soft)">' +
      '<summary style="padding:12px 16px;cursor:pointer;font-weight:700;color:var(--heading)">+ New parts pull</summary>' +
      '<form id="prForm" style="padding:14px 18px;max-width:820px">' +
        '<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px">' +
          '<div><label class="lbl">For</label>' +
            '<label style="display:inline-flex;align-items:center;gap:5px;font-size:13px;margin-right:12px"><input type="radio" name="prFor" value="counter" checked/> Counter / internal</label>' +
            '<label style="display:inline-flex;align-items:center;gap:5px;font-size:13px"><input type="radio" name="prFor" value="wo"/> Work order</label>' +
          '</div>' +
          '<div id="prWoWrap" style="display:none"><label class="lbl">Work order #</label><input id="prWo" type="number" min="1" style="' + fld + ';width:120px"/></div>' +
          '<div><label class="lbl">Requested by</label><select id="prReqBy" style="' + fld + '"><option value="">—</option>' +
            mechs.map(function(m){ return '<option value="' + m.id + '">' + esc(m.name) + '</option>'; }).join('') + '</select></div>' +
          '<div style="flex:1;min-width:180px"><label class="lbl">Notes</label><input id="prNotes" style="' + fld + ';width:100%" placeholder="optional"/></div>' +
        '</div>' +
        '<div style="position:relative">' +
          '<label class="lbl">Add parts</label>' +
          '<input id="prSearch" autocomplete="off" placeholder="Scan or search part no., name or vehicle… (↑↓ + Enter adds top match)" style="' + fld + ';width:100%;border:2px solid #0891b2"/>' +
          '<span id="prSearchMsg" style="position:absolute;right:8px;top:26px;font-size:11.5px;color:var(--muted)"></span>' +
          '<div id="prSearchRes" style="margin-top:6px;max-height:320px;overflow-y:auto;display:none;border:1px solid var(--line);border-radius:7px;background:var(--card)"></div>' +
        '</div>' +
        '<div id="prCart" style="margin-top:12px;border:1px solid var(--line);border-radius:7px;overflow:hidden"></div>' +
        '<div id="prMsg" style="display:none;margin-top:10px;padding:10px 12px;border-radius:6px;font-size:13px"></div>' +
        '<button type="submit" id="prSubmit" disabled style="margin-top:12px;background:var(--red);color:#fff;border:0;padding:11px 24px;border-radius:7px;font-weight:700;cursor:pointer">Submit pull</button>' +
      '</form>' +
    '</details>' +
    '<div style="padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
      '<span class="lbl" style="margin:0 4px 0 0">Status</span>' + filterChips +
    '</div>' +
    (r.requisitions.length
      ? '<table><thead><tr><th>PR #</th><th>For</th><th>Requested</th><th>Items</th><th>Status</th><th></th></tr></thead><tbody>' +
        r.requisitions.map(function(pr){
          var forCell = pr.wo_number
            ? '🛠 ' + esc(pr.wo_number) + (pr.customer_name ? '<br/><small style="color:var(--muted)">' + esc(pr.customer_name) + '</small>' : '')
            : '<span style="color:var(--muted)">Counter / internal</span>';
          return '<tr><td><b>' + esc(pr.pr_number) + '</b></td>' +
            '<td>' + forCell + '</td>' +
            '<td>' + fmtDate(pr.created_at) + (pr.requester_name ? '<br/><small style="color:var(--muted)">' + esc(pr.requester_name) + '</small>' : '') + '</td>' +
            '<td>' + (pr.item_count != null ? pr.item_count : '') + '</td>' +
            '<td>' + badge(pr.status, pr.status === 'fulfilled' ? 'ok' : (pr.status === 'backordered' ? 'bad' : 'pending')) + '</td>' +
            '<td class="actions"><button class="btn" data-open="' + pr.id + '">Open</button></td>' +
          '</tr>';
        }).join('') + '</tbody></table>'
      : '<div class="empty">No parts pulls' + (PARTSREQ_STATUS_FILTER ? ' with status “' + esc(PARTSREQ_STATUS_FILTER) + '”' : ' yet') + '.</div>');

  panel.querySelectorAll('[data-open]').forEach(function(b){
    b.addEventListener('click', function(){ PARTSREQ_VIEW_ID = b.getAttribute('data-open'); renderPartsReq(panel); });
  });
  panel.querySelectorAll('.prFilt').forEach(function(b){
    b.addEventListener('click', function(){ PARTSREQ_STATUS_FILTER = b.getAttribute('data-s'); renderPartsReq(panel); });
  });

  // ---- work-order toggle ------------------------------------------------
  panel.querySelectorAll('input[name="prFor"]').forEach(function(radio){
    radio.addEventListener('change', function(){
      panel.querySelector('#prWoWrap').style.display = panel.querySelector('input[name="prFor"]:checked').value === 'wo' ? '' : 'none';
    });
  });

  // ---- draft cart ------------------------------------------------------
  function prDrawCart(){
    var box = panel.querySelector('#prCart');
    var sub = panel.querySelector('#prSubmit');
    if (!draft.items.length) {
      box.innerHTML = '<div class="empty" style="padding:16px;font-size:12.5px">No parts added yet — search above.</div>';
      if (sub) sub.disabled = true;
      return;
    }
    box.innerHTML = '<table style="width:100%;font-size:12.5px"><thead><tr>' +
        '<th align="left">Part</th><th style="width:70px">Qty</th><th style="width:116px" align="right">Unit price</th><th style="width:34px"></th></tr></thead><tbody>' +
      draft.items.map(function(it, idx){
        return '<tr>' +
          '<td><code style="font-size:11px">' + esc(it.sku || '') + '</code><br/>' + esc(it.name || '') + '</td>' +
          '<td style="text-align:center"><input type="number" min="1" value="' + it.qty + '" class="prQ" data-i="' + idx + '" style="width:58px;padding:4px;border:1px solid var(--line);border-radius:5px;text-align:center;font-family:inherit"/></td>' +
          '<td align="right"><input type="number" min="0" step="0.01" value="' + (it.price === '' || it.price == null ? '' : it.price) + '" placeholder="—" class="prP" data-i="' + idx + '" style="width:98px;padding:4px;border:1px solid var(--line);border-radius:5px;text-align:right;font-family:inherit"/></td>' +
          '<td align="right"><button type="button" class="prRm" data-i="' + idx + '" style="background:#fee2e2;color:#b91c1c;border:0;width:24px;height:24px;border-radius:4px;cursor:pointer;font-weight:700">×</button></td>' +
        '</tr>';
      }).join('') + '</tbody></table>';
    if (sub) sub.disabled = false;
    box.querySelectorAll('.prQ').forEach(function(inp){ inp.addEventListener('input', function(){ draft.items[+inp.dataset.i].qty = Math.max(1, parseInt(inp.value, 10) || 1); }); });
    box.querySelectorAll('.prP').forEach(function(inp){ inp.addEventListener('input', function(){ draft.items[+inp.dataset.i].price = inp.value === '' ? '' : Math.max(0, Number(inp.value) || 0); }); });
    box.querySelectorAll('.prRm').forEach(function(b){ b.addEventListener('click', function(){ draft.items.splice(+b.dataset.i, 1); prDrawCart(); }); });
  }
  prDrawCart();

  // ---- catalogue search (modelled on the POS full-cart search) --------
  var searchInp = panel.querySelector('#prSearch');
  var resBox = panel.querySelector('#prSearchRes');
  var msgEl = panel.querySelector('#prSearchMsg');
  var sDeb = null, sSeq = 0, sRows = [], sSel = -1;

  function sHighlight(){
    var kids = resBox.children;
    for (var i = 0; i < kids.length; i++) {
      kids[i].style.background = (i === sSel) ? 'var(--hover)' : 'var(--card)';
      kids[i].style.boxShadow = (i === sSel) ? 'inset 3px 0 0 var(--red)' : 'none';
    }
    if (sSel >= 0 && kids[sSel]) kids[sSel].scrollIntoView({ block: 'nearest' });
  }
  function sRender(){
    if (!sRows.length) { resBox.style.display = 'none'; resBox.innerHTML = ''; sSel = -1; return; }
    resBox.innerHTML = sRows.map(function(p, i){
      var usd = p.price_usd != null ? Number(p.price_usd) : null;
      var place = (p.location ? '📍 ' + esc(p.location) : '') + (p.location && p.bin_location ? ' ' : '') + (p.bin_location ? '🗂 ' + esc(p.bin_location) : '');
      return '<button type="button" class="prPick" data-i="' + i + '" style="display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--hover);background:var(--card);color:var(--ink);padding:9px 11px;cursor:pointer;font-family:inherit">' +
        '<code style="flex-shrink:0;font-size:12px;font-weight:700;max-width:180px;word-break:break-all">' + esc(prPartNo(p)) + '</code>' +
        '<span style="flex:1;min-width:0;font-size:12.5px;font-weight:600">' + esc(p.name || '') + '</span>' +
        (place ? '<small style="flex-shrink:0;color:#0891b2;font-weight:700;font-size:10.5px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + place + '</small>' : '') +
        '<small style="flex-shrink:0;font-weight:700;color:' + ((p.stock_count || 0) > 0 ? '#15803d' : '#b91c1c') + '">stock ' + (p.stock_count || 0) + '</small>' +
        '<b style="flex-shrink:0;color:var(--red);min-width:64px;text-align:right">' + (usd != null ? fmtMoney(usd) : '—') + '</b>' +
      '</button>';
    }).join('');
    resBox.style.display = 'block';
    resBox.querySelectorAll('.prPick').forEach(function(b){
      b.addEventListener('click', function(){ sAdd(sRows[+b.dataset.i]); });
      b.addEventListener('mouseenter', function(){ sSel = +b.dataset.i; sHighlight(); });
    });
    sSel = 0; sHighlight();
  }
  function sAdd(p){
    if (!p) return;
    var ex = draft.items.find(function(x){ return x.product_img && x.product_img === p.img; });
    if (ex) ex.qty += 1;
    else draft.items.push({ product_img: p.img || null, sku: prPartNo(p), name: p.name || '', qty: 1,
      price: p.price_usd != null ? Number(p.price_usd) : '' });
    prDrawCart();
    searchInp.value = ''; sRows = []; sRender();
    msgEl.style.color = '#15803d'; msgEl.textContent = '✔ ' + prPartNo(p);
    setTimeout(function(){ if (msgEl) msgEl.textContent = ''; }, 1800);
    searchInp.focus();
  }
  function sRun(){
    var qy = searchInp.value.trim();
    clearTimeout(sDeb);
    if (qy.length < 2) { sRows = []; sRender(); msgEl.textContent = ''; return; }
    sDeb = setTimeout(async function(){
      var seq = ++sSeq;
      msgEl.style.color = 'var(--muted)'; msgEl.textContent = 'searching…';
      try {
        var res = await api('/api/products?limit=9&offset=0&q=' + encodeURIComponent(qy));
        if (seq !== sSeq) return;
        sRows = res.products || [];
        sRender();
        msgEl.textContent = sRows.length ? ((res.total != null ? res.total : sRows.length) + (res.count_mode === 'capped' ? '+' : '') + ' found') : 'no match';
      } catch (e) {
        if (seq !== sSeq) return;
        sRows = []; sRender(); msgEl.style.color = '#b91c1c'; msgEl.textContent = 'search failed';
      }
    }, 220);
  }
  searchInp.addEventListener('input', sRun);
  searchInp.addEventListener('keydown', function(e){
    if (!sRows.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); sSel = Math.min(sRows.length - 1, sSel + 1); sHighlight(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sSel = Math.max(0, sSel - 1); sHighlight(); }
    else if (e.key === 'Enter') { e.preventDefault(); sAdd(sRows[sSel < 0 ? 0 : sSel]); }
    else if (e.key === 'Escape') { sRows = []; sRender(); }
  });

  // ---- submit --------------------------------------------------------
  panel.querySelector('#prForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var msg = panel.querySelector('#prMsg');
    var fail = function(t){ msg.style.display = 'block'; msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = t; };
    if (!draft.items.length) return fail('Add at least one part.');
    var forWO = panel.querySelector('input[name="prFor"]:checked').value === 'wo';
    var woId = (panel.querySelector('#prWo').value || '').trim();
    if (forWO && !woId) return fail('Enter the work order number.');
    msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';
    try {
      var res = await api('/api/admin/parts-requisitions', { method: 'POST', body: {
        work_order_id: forWO ? woId : null,
        requested_by: panel.querySelector('#prReqBy').value || null,
        notes: panel.querySelector('#prNotes').value.trim() || null,
        items: draft.items.map(function(it){
          return { description: it.name || it.sku, qty_requested: it.qty,
                   unit_price_usd: it.price === '' ? null : it.price,
                   product_img: it.product_img };
        }),
      }});
      PARTSREQ_VIEW_ID = String(res.id);
      renderPartsReq(panel);
    } catch (err) { fail(err.message); }
  });
}

// Tables rendered by the current report, kept so "Export CSV" can serialise
// exactly what is on screen rather than re-querying.
var RPT_TABLES = [];
var RPT_CURRENT = '__overview';
// Custom Inventory report picker state (persists while the Reports tab is open).

// Reports are read in Jamaican dollars — the catalogue and every POS figure
// is J$. Display only; the stored values are unchanged.
function rMoney(v){ return v == null ? '—' : 'J$' + Number(v).toLocaleString('en-JM', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function rPct(v){ return v == null ? '—' : Number(v).toFixed(1) + '%'; }
function rNum(v){ return v == null ? '—' : Number(v).toLocaleString('en-US'); }
function rHours(v){ return v == null ? '—' : Number(v).toFixed(2); }

// cols: [{k, label, money:true, num:true, hours:true, right:true}]
function rptTable(title, cols, rows, emptyMsg){
  RPT_TABLES.push({ title: title, cols: cols, rows: rows || [] });
  var head = '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">' + title + '</div>';
  if (!rows || !rows.length) {
    return '<div class="panel">' + head + '<div class="empty">' + esc(emptyMsg || 'Nothing in this range.') + '</div></div>';
  }
  var th = cols.map(function(c){
    return '<th style="text-align:' + (c.right || c.money || c.num || c.hours ? 'right' : 'left') + '">' + esc(c.label) + '</th>';
  }).join('');
  var body = rows.map(function(r){
    return '<tr>' + cols.map(function(c){
      var v = r[c.k];
      var txt = c.money ? rMoney(v) : c.hours ? rHours(v) : c.num ? rNum(v) : (v == null || v === '' ? '—' : esc(String(v)));
      return '<td style="text-align:' + (c.right || c.money || c.num || c.hours ? 'right' : 'left') + '">' + txt + '</td>';
    }).join('') + '</tr>';
  }).join('');
  return '<div class="panel">' + head +
    '<table><thead><tr>' + th + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

function rptGrid(html){
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 18px 18px">' + html + '</div>';
}

function rptCsv(){
  if (RPT_CURRENT === '__overview') return alert('Pick a report first.');
  if (!RPT_TABLES.length) return alert('Nothing to export yet.');
  var out = [];
  RPT_TABLES.forEach(function(t){
    out.push('"' + t.title.replace(/"/g, '""') + '"');
    out.push(t.cols.map(function(c){ return '"' + c.label.replace(/"/g, '""') + '"'; }).join(','));
    t.rows.forEach(function(r){
      out.push(t.cols.map(function(c){
        var v = r[c.k];
        if (v == null) return '';
        return '"' + String(v).replace(/"/g, '""') + '"';
      }).join(','));
    });
    out.push('');
  });
  var blob = new Blob([out.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vas-' + RPT_CURRENT + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

      document.getElementById('rptTo').value = today;
      document.getElementById('rptFrom').value = new Date(Date.now() - days * 86400000).toISOString().slice(0, 10);
      run();
    };
  });
  document.getElementById('rptRun').onclick = run;
  document.getElementById('rptCsvBtn').onclick = rptCsv;
  document.getElementById('rptPrintBtn').onclick = function(){ rptPrint(); };

  var LAST = null;

  async function run(){
    var box = document.getElementById('rptBody');
    // The overview landing page is pure client-side — no fetch, no date range.
    if (RPT_CURRENT === '__overview') {
      RPT_TABLES = []; LAST = null;
      rptInvPicker(false);
      box.innerHTML = RPT_RENDERERS.__overview();
      Array.prototype.forEach.call(box.querySelectorAll('[data-rptopen]'), function(b){
        b.onclick = function(){ RPT_CURRENT = b.getAttribute('data-rptopen'); markActive(); run(); };
      });
      return;
    }
    var def = REPORT_DEFS.filter(function(d){ return d.key === RPT_CURRENT; })[0];
    var range = '?from=' + document.getElementById('rptFrom').value + '&to=' + document.getElementById('rptTo').value;
    var qs = def.dated === false ? '' : range;
    // The Z endpoint keys off a session, not a date range -- the range here
    // only decides which sessions the picker offers.
    if (RPT_CURRENT === 'z') qs = RPT_SESSION_ID ? '?session_id=' + RPT_SESSION_ID : '';
    if (RPT_CURRENT === 'inventory-custom') qs = '?' + rptInvQS();
    if (RPT_CURRENT === 'serial-lookup') qs = '?q=' + encodeURIComponent(SERIAL_Q);
    rptInvPicker(RPT_CURRENT === 'inventory-custom');
    rptSerialPicker(RPT_CURRENT === 'serial-lookup');
    box.innerHTML = '<div class="empty">Loading…</div>';
    RPT_TABLES = [];
    var r;
    try { r = await api('/api/admin/reports/' + RPT_CURRENT + qs); }
    catch (e) {
      LAST = null;
      box.innerHTML = '<div class="empty" style="padding:26px 18px">' + esc(e.message) + '</div>';
      return;
    }
    LAST = r;
    if (RPT_CURRENT === 'inventory-custom') rptInvPicker(true, r.facets);

    var head = '';
    if (RPT_CURRENT === 'z') {
      var sess = [];
      try { sess = (await api('/api/admin/reports/drawer-sessions' + range)).sessions || []; } catch (e2) { sess = []; }
      head = '<div style="padding:14px 18px 0;display:flex;gap:9px;align-items:center;flex-wrap:wrap">' +
        '<label class="lbl" style="margin:0">Till session</label>' +
        '<select id="rptSession" class="fld" style="width:auto;min-width:300px">' +
          '<option value="">(most recent close)</option>' +
          sess.map(function(s){
            return '<option value="' + s.id + '"' + (String(s.id) === String(r.session.id) ? ' selected' : '') + '>' +
              '#' + s.id + ' — ' + esc(fmtDate(s.opened_at)) +
              (s.closed_at ? ' → ' + esc(fmtDate(s.closed_at)) : ' (still open)') + '</option>';
          }).join('') +
        '</select>' +
        '<span style="font-size:11.5px;color:var(--muted)">Change the date range above to list other days.</span>' +
      '</div>';
    }
    box.innerHTML = head + RPT_RENDERERS[RPT_CURRENT](r);

    var selEl = document.getElementById('rptSession');
    if (selEl) selEl.onchange = function(){ RPT_SESSION_ID = selEl.value || null; run(); };

    var payGo = document.getElementById('commPayGo');
    if (payGo) payGo.addEventListener('click', async function(){
      var repId = document.getElementById('commPayRep').value;
      var amt = document.getElementById('commPayAmt').value;
      var msgEl = document.getElementById('commPayMsg');
      if (!repId) { msgEl.style.color = '#b91c1c'; msgEl.textContent = 'Choose a rep.'; return; }
      if (!(Number(amt) > 0)) { msgEl.style.color = '#b91c1c'; msgEl.textContent = 'Enter an amount.'; return; }
      msgEl.style.color = 'var(--muted)'; msgEl.textContent = 'Saving…';
      try {
        await api('/api/admin/mechanics/' + repId + '/commission-payouts', { method:'POST', body: {
          amount_usd: amt,
          notes: document.getElementById('commPayNotes').value.trim() || null,
          period_from: document.getElementById('rptFrom').value, period_to: document.getElementById('rptTo').value,
        }});
        msgEl.style.color = '#166534'; msgEl.textContent = '✓ Recorded';
        setTimeout(run, 700);
      } catch (e) { msgEl.style.color = '#b91c1c'; msgEl.textContent = e.message; }
    });
  }

  function rptPrint(){
    if (!LAST) return alert('Run a report first.');
    if (RPT_CURRENT === 'z' || RPT_CURRENT === 'x') return printTill(LAST);
    // Everything else prints as the on-screen tables.
    var html = '<div style="font-family:system-ui,sans-serif;padding:18px">' +
      '<h2 style="margin:0 0 4px">' + esc((REPORT_DEFS.filter(function(d){ return d.key === RPT_CURRENT; })[0] || {}).label || 'Report') + '</h2>' +
      '<div style="font-size:12px;color:#555;margin-bottom:14px">' +
        (LAST.from ? esc(LAST.from) + ' → ' + esc(LAST.to) : 'Snapshot') + '</div>' +
      RPT_TABLES.map(function(t){
        return '<h3 style="margin:16px 0 6px;font-size:13px">' + esc(t.title.replace(/<[^>]*>/g, '')) + '</h3>' +
          '<table style="font-size:12px"><thead><tr>' +
          t.cols.map(function(c){ return '<th style="text-align:left;border-bottom:1px solid #999;padding:3px 6px">' + esc(c.label) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          t.rows.map(function(row){
            return '<tr>' + t.cols.map(function(c){
              var v = row[c.k];
              var txt = c.money ? rMoney(v) : c.hours ? rHours(v) : (v == null ? '—' : String(v));
              return '<td style="padding:3px 6px;border-bottom:1px solid #eee">' + esc(txt) + '</td>';
            }).join('') + '</tr>';
          }).join('') + '</tbody></table>';
      }).join('') + '</div>';
    posPrintWindow('Report', '', html);
  }

  markActive();
  run();
}

// ---- Till receipt (X / Z) -------------------------------------------------
// Printed on the same 80mm stationery as POS receipts so a Z can be spiked
// with the day's takings.
function printTill(r){
  function line(l, v, bold){
    return '<tr><td style="padding:1px 0">' + (bold ? '<b>' + esc(l) + '</b>' : esc(l)) + '</td>' +
           '<td style="padding:1px 0;text-align:right">' + (bold ? '<b>' + v + '</b>' : v) + '</td></tr>';
  }
  var rows = '';
  rows += line('Gross sales', rMoney(r.sales.subtotal));
  rows += line('Discounts', '-' + rMoney(r.sales.discount));
  rows += line('Tax', rMoney(r.sales.tax));
  rows += line('Total sales', rMoney(r.sales.total), true);
  rows += line('Refunds', '-' + rMoney(r.refund_total));
  rows += line('NET', rMoney(r.net_total), true);
  rows += line('Transactions', rNum(r.sales.count));
  rows += line('Units', rNum(r.sales.units));
  rows += line('Average ticket', rMoney(r.sales.avg_ticket));
  rows += line('Voids', rNum(r.voids.n) + ' / ' + rMoney(r.voids.total));

  var tenders = r.tenders.map(function(t){ return line(t.method, rMoney(t.total)); }).join('');
  var cash = '';
  cash += line('Opening float', rMoney(r.cash.opening_float));
  cash += line('Cash sales', rMoney(r.cash.cash_sales));
  cash += line('Cash refunds', '-' + rMoney(r.cash.cash_refunds));
  cash += line('Expected in drawer', rMoney(r.cash.expected), true);
  if (r.cash.counted != null) {
    cash += line('Counted', rMoney(r.cash.counted));
    cash += line('Variance', rMoney(r.cash.variance), true);
  }

  var body =
    '<div style="width:76mm;margin:0 auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:8px 0">' +
      '<div style="text-align:center;font-weight:700;font-size:13px">MORTY\'S AUTO PARTS</div>' +
      '<div style="text-align:center;font-size:10px">51 Red Hills Road, Kingston</div>' +
      '<div style="text-align:center;margin:6px 0;font-weight:700;font-size:14px">' + esc(r.kind) + ' REPORT' +
        (r.kind === 'X' ? ' (LIVE)' : '') + '</div>' +
      '<div style="font-size:10px">Session #' + esc(String(r.session.id)) + '</div>' +
      '<div style="font-size:10px">Opened ' + esc(fmtDate(r.session.opened_at)) +
        (r.session.opener_name ? ' by ' + esc(r.session.opener_name) : '') + '</div>' +
      '<div style="font-size:10px">' + (r.session.closed_at
        ? 'Closed ' + esc(fmtDate(r.session.closed_at)) + (r.session.closer_name ? ' by ' + esc(r.session.closer_name) : '')
        : 'STILL OPEN — figures are provisional') + '</div>' +
      '<hr style="border:0;border-top:1px dashed #000;margin:6px 0"/>' +
      '<table style="width:100%">' + rows + '</table>' +
      '<hr style="border:0;border-top:1px dashed #000;margin:6px 0"/>' +
      '<div style="font-weight:700">TENDERS</div>' +
      '<table style="width:100%">' + (tenders || line('(none)', '')) + '</table>' +
      '<hr style="border:0;border-top:1px dashed #000;margin:6px 0"/>' +
      '<div style="font-weight:700">CASH RECONCILIATION</div>' +
      '<table style="width:100%">' + cash + '</table>' +
      '<hr style="border:0;border-top:1px dashed #000;margin:6px 0"/>' +
      '<table style="width:100%">' +
        line('Grand total (running)', rMoney(r.grand_total.total), true) +
        line('Lifetime transactions', rNum(r.grand_total.n)) +
      '</table>' +
      '<div style="text-align:center;font-size:9px;margin-top:8px">Printed ' + esc(new Date().toLocaleString()) + '</div>' +
    '</div>';
  posPrintWindow(r.kind + ' Report', '@page{size:80mm auto;margin:3mm}', body, 'width=420,height=800');
}

function tillHtml(r){
  var provisional = !r.final
    ? '<div style="margin:0 18px 12px;padding:9px 12px;border-radius:6px;background:rgba(234,179,8,.12);font-size:12px">' +
      '⚠ This till is still open — figures are provisional and will move until it is closed.</div>'
    : '';
  var v = r.cash.variance;
  var vCls = (v == null || Math.abs(v) < 0.005) ? '' : 'alert';
  return '<div style="padding:16px 18px 4px">' +
      '<div style="font-size:12.5px;margin-bottom:10px">' +
        '<b>Session #' + esc(String(r.session.id)) + '</b> · opened ' + esc(fmtDate(r.session.opened_at)) +
        (r.session.opener_name ? ' by <b>' + esc(r.session.opener_name) + '</b>' : '') +
        (r.session.closed_at ? ' · closed ' + esc(fmtDate(r.session.closed_at)) +
          (r.session.closer_name ? ' by <b>' + esc(r.session.closer_name) + '</b>' : '') : ' · <b>still open</b>') +
      '</div>' +
      '<div class="tiles" style="grid-template-columns:repeat(5,1fr);margin-bottom:16px">' +
        tile('net takings', rMoney(r.net_total)) +
        tile('total sales', rMoney(r.sales.total)) +
        tile('transactions', rNum(r.sales.count)) +
        tile('average ticket', rMoney(r.sales.avg_ticket)) +
        tile('cash variance', v == null ? '—' : rMoney(v), vCls) +
      '</div>' +
    '</div>' + provisional +
    rptGrid(
      rptTable('💰 Sales breakdown', [{ k:'label', label:'' }, { k:'value', label:'Amount', money:true }], [
        { label:'Gross (subtotal)', value:r.sales.subtotal },
        { label:'Discounts', value:-r.sales.discount },
        { label:'Tax', value:r.sales.tax },
        { label:'Total sales', value:r.sales.total },
        { label:'Refunds', value:-r.refund_total },
        { label:'Net', value:r.net_total },
      ]) +
      rptTable('🧾 Cash reconciliation', [{ k:'label', label:'' }, { k:'value', label:'Amount', money:true }], [
        { label:'Opening float', value:r.cash.opening_float },
        { label:'Cash sales', value:r.cash.cash_sales },
        { label:'Cash refunds', value:-r.cash.cash_refunds },
        { label:'Expected in drawer', value:r.cash.expected },
        { label:'Counted', value:r.cash.counted },
        { label:'Variance', value:r.cash.variance },
      ])
    ) +
    rptGrid(
      rptTable('💳 Tenders', [{ k:'method', label:'Method' }, { k:'n', label:'Txns', num:true }, { k:'total', label:'Total', money:true }], r.tenders, 'No payments taken.') +
      rptTable('↩️ Refunds by method', [{ k:'method', label:'Method' }, { k:'n', label:'Count', num:true }, { k:'total', label:'Total', money:true }], r.refunds, 'No refunds.')
    ) +
    rptGrid(
      rptTable('👤 By cashier', [{ k:'cashier', label:'Cashier' }, { k:'n', label:'Txns', num:true }, { k:'total', label:'Total', money:true }], r.by_cashier) +
      rptTable('🕐 By hour', [{ k:'hour', label:'Hour' }, { k:'n', label:'Txns', num:true }, { k:'total', label:'Total', money:true }], r.hourly)
    ) +
    '<div style="padding:0 18px 22px">' +
      rptTable('📊 Non-resettable totals', [{ k:'label', label:'' }, { k:'value', label:'Value' }], [
        { label:'Grand total (running, all time to close)', value:rMoney(r.grand_total.total) },
        { label:'Lifetime transactions', value:rNum(r.grand_total.n) },
        { label:'Voided in this session', value:rNum(r.voids.n) + ' / ' + rMoney(r.voids.total) },
        { label:'Units sold', value:rNum(r.sales.units) },
      ]) +
    '</div>';
}

async function submitCoupon(){
