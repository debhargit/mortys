  async function paint(){
    var body = mode === 'held' ? await heldBody() : mode === 'quotes' ? await quotesBody()
      : mode === 'returns' ? await returnsBody() : await invoicesBody();
    posModal('📂 Recall',
      '<div style="display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px">' +
        tabBtn('held', '⏸', 'Held tickets') + tabBtn('quotes', '📝', 'Quotes') + tabBtn('invoices', '🧾', 'Invoices') +
        tabBtn('returns', '↩️', 'Credit Notes') +
      '</div>' + body,
      640
    );
    document.querySelectorAll('.posRecallTab').forEach(function(b){
      b.addEventListener('click', function(){ mode = b.getAttribute('data-mode'); paint(); });
    });

    // ---- Held: recall / discard (unchanged behaviour, moved from the old
    // single-purpose version of this modal)
    document.querySelectorAll('[data-recall-held]').forEach(function(b){
      b.addEventListener('click', async function(){
        if (POS.cart.length && !confirm('The current cart will be replaced. Continue?')) return;
        var id = b.getAttribute('data-recall-held');
        try {
          var res = await api('/api/admin/pos/holds/' + id);
          var h = res.hold;
          var items = posItemsArray(h.items_json);
          POS = posBlankTicket();
          // items_json stores exactly what posCartPayload() sends --
          // unit_price_usd/discount_usd (dollars), not the _cents names.
          POS.cart = items.map(function(it){
            return {
              img: it.product_img, name: it.description, price: Number(it.unit_price_usd) || 0,
              qty: it.qty || 1, disc: Number(it.discount_usd) || 0, discNote: it.discount_note || '',
            };
          });
          POS.custName = h.customer_name || '';
          POS.custPhone = h.customer_phone || '';
          POS.vehicle = h.vehicle_info || '';
          POS.rep = h.sales_rep_id ? { id: h.sales_rep_id, name: h.sales_rep_name } : null;
          POS.holdId = h.id;
          // The customer record itself isn't stored on the hold, so re-attach
          // it by id to get a live points balance rather than a stale one.
          if (h.customer_id) {
            try {
              var lk = await api('/api/admin/pos/customer-lookup?q=' + encodeURIComponent(h.customer_name || ''));
              var m = (lk.matches || []).find(function(x){ return x.id === h.customer_id; });
              if (m) POS.customer = { id: m.id, name: m.name, phone: m.phone, email: m.email, price_tier: m.price_tier, points_balance: m.points_balance || 0, open_balance_cents: m.open_balance_cents || 0 };
            } catch (_) {}
          }
          posSaveState();
          posCloseModal();
          if (after) after();
        } catch (e) { alert('Could not recall that ticket: ' + e.message); }
      });
    });
    document.querySelectorAll('[data-drop-held]').forEach(function(b){
      b.addEventListener('click', async function(){
        if (!confirm('Discard this held ticket for good?')) return;
        try { await api('/api/admin/pos/holds/' + b.getAttribute('data-drop-held'), { method: 'DELETE' }); paint(); }
        catch (e) { alert(e.message); }
      });
    });

    // ---- Quotes: load into cart (same mapping showQuoteDetail's own "Load
    // into POS" button uses) or view full detail
    document.querySelectorAll('[data-recall-quote]').forEach(function(b){
      b.addEventListener('click', async function(){
        if (POS.cart.length && !confirm('The current cart will be replaced. Continue?')) return;
        var id = b.getAttribute('data-recall-quote');
        try {
          var res = await api('/api/admin/pos/quotes/' + id);
          var q = res.quote;
          var items = posItemsArray(q.items_json);
          POS = posBlankTicket();
          // Same items_json shape as the Held branch above -- unit_price_usd/
          // discount_usd, not _cents.
          POS.cart = items.map(function(it){
            return {
              img: it.product_img, name: it.description, price: Number(it.unit_price_usd) || 0,
              qty: it.qty || 1, disc: Number(it.discount_usd) || 0, discNote: it.discount_note || '',
            };
          });
          POS.custName = q.customer_name || '';
          POS.custPhone = q.customer_phone || '';
          POS.vehicle = q.vehicle_info || '';
          POS.rep = q.sales_rep_id ? { id: q.sales_rep_id, name: q.sales_rep_name } : null;
          POS.quoteId = q.id;
          if (q.customer_id) POS.customer = { id: q.customer_id, name: q.customer_name, phone: q.customer_phone, email: q.customer_email, price_tier: 'retail', points_balance: 0, open_balance_cents: 0 };
          posSaveState();
          posCloseModal();
          if (after) after();
        } catch (e) { alert('Could not load that quote: ' + e.message); }
      });
    });
    document.querySelectorAll('[data-view-quote]').forEach(function(b){
      b.addEventListener('click', function(){ showQuoteDetail(b.getAttribute('data-view-quote')); });
    });

    // ---- Invoices: search by number (any date) or a date range + view (a
    // completed sale opens the existing sale-detail view -- reprint/return/
    // void live there already, no reason to duplicate them here)
    var invGo = document.getElementById('prInvGo');
    if (invGo) invGo.addEventListener('click', function(){
      invQ = document.getElementById('prInvQ').value || '';
      invFrom = document.getElementById('prInvFrom').value || today;
      invTo = document.getElementById('prInvTo').value || today;
      paint();
    });
    var invQEl = document.getElementById('prInvQ');
    if (invQEl) invQEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') invGo.click(); });
    document.querySelectorAll('[data-view-invoice]').forEach(function(b){
      b.addEventListener('click', function(){ posSaleDetail(b.getAttribute('data-view-invoice'), after); });
    });

    // ---- Credit notes / returns: same search-or-range pattern. "View" opens
    // the parent sale, where the return already has its own 🧾 Credit note
    // reprint button -- no reason to duplicate that document builder here.
    var retGo = document.getElementById('prRetGo');
    if (retGo) retGo.addEventListener('click', function(){
      retQ = document.getElementById('prRetQ').value || '';
      retFrom = document.getElementById('prRetFrom').value || today;
      retTo = document.getElementById('prRetTo').value || today;
      paint();
    });
    var retQEl = document.getElementById('prRetQ');
    if (retQEl) retQEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') retGo.click(); });
    document.querySelectorAll('[data-view-return]').forEach(function(b){
      b.addEventListener('click', function(){ posSaleDetail(b.getAttribute('data-view-return'), after); });
    });
  }

  paint();
}

// =============================================================================
//  QUOTES
//  Lines with no price go up at zero -- that's what makes it a request for a
//  quote rather than an offer, and it puts the part numbers and quantities on
//  record so the quote can be priced and re-issued later without re-keying it.
// =============================================================================
async function posSaveCartAsQuote(after){
  if (!POS.cart.length) return posToast('Cart is empty.', true);
  var t = posTotals();
  try {
    var resp = await api('/api/admin/pos/quote', { method:'POST', body: {
      items: posCartPayload(),
      discount_usd: t.orderDisc,
      customer_id: POS.customer ? POS.customer.id : null,
      customer_name: POS.custName || (POS.customer && POS.customer.name) || null,
      customer_phone: POS.custPhone || null,
      customer_email: POS.customer ? POS.customer.email : null,
      vehicle_info: POS.vehicle || null,
      sales_rep_id: posRepIdForPayload(),
      sales_rep_name: POS.rep ? POS.rep.name : null,
      notes: POS.notes || null,
    }});
    var unpriced = POS.cart.filter(function(i){ return !(i.price > 0); }).length;
    posToast('Quote ' + resp.quote_number + ' saved — ' + posCents(resp.total_cents) +
      (unpriced ? ' · ' + unpriced + ' line' + (unpriced === 1 ? '' : 's') + ' still to price' : ''));
    // Print straight away -- no "print it now?" prompt to click through.
    try {
      var q = await api('/api/admin/pos/quotes/' + resp.id);
      posPrintQuote(q.quote, q.shop);
    } catch (_) {}
    posResetTicket();
    if (after) after();
  } catch (e) {
    posToast('Could not save the quote: ' + e.message, true);
  }
}

// A carrier tracking number for courier orders. MAP = Morty's Auto Parts;
// YYMMDD + 5 random base36 chars keeps them roughly sortable and unlikely
// to collide without needing a round-trip to the server to reserve one.
function posGenTracking(){
  var d = new Date();
  var p = function(n){ return String(n).padStart(2, '0'); };
  return 'MAP-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '-' +
    Math.random().toString(36).slice(2, 7).toUpperCase();
}
// Shapes a delivery block { name,phone,line1,line2,city,parish,method,courier,
// tracking,instructions } into the { sale, items, shop } doc-data posDocLabel
// expects, so a shipping label can be printed before the order even has an id.
function posOrderLabelData(sc, ref, items){
  return {
    sale: {
      receipt_number: ref,
      tracking_number: sc.tracking || null,
      ship_method: sc.courier ? ('Courier — ' + sc.courier) : (sc.method || 'COURIER'),
      ship_name: sc.name || null, ship_phone: sc.phone || null,
      ship_line1: sc.line1 || null, ship_line2: sc.line2 || null,
      ship_city: sc.city || null, ship_parish: sc.parish || null,
      ship_country: (POS_SHOP && POS_SHOP.country) || 'Jamaica',
      ship_instructions: sc.instructions || null,
      balance_due_cents: 0, created_at: new Date().toISOString(),
    },
    items: items || (POS.cart || []).map(function(i){ return { qty: i.qty }; }),
    shop: POS_SHOP,
  };
}

function posSaveCartAsOrder(after){

  function soCollectShip(){
    return {
      name: gg('soName'), phone: gg('soPhone'),
      line1: gg('soL1'), line2: gg('soL2'), city: gg('soCity'), parish: gg('soParish'),
      method: soMethodSel.value, courier: gg('soCourier'), tracking: soTracking.value,
      instructions: gg('soInstr'),

  function soSyncMethod(){
    var isCourier = soMethodSel.value === 'Courier';

  document.getElementById('soTrackGen').addEventListener('click', function(){ soTracking.value = posGenTracking(); });
  document.getElementById('soLabelBtn').addEventListener('click', function(){
    var sc = soCollectShip();
    if (!sc.name || !sc.line1) return posToast('Fill in the recipient and address first.', true);
    posDocLabel(posOrderLabelData(sc, 'DRAFT'));
  });
  document.getElementById('soCancel').addEventListener('click', posCloseModal);
  document.getElementById('soSave').addEventListener('click', async function(){
    var f = soFul.value;
    var g = gg;
    var notify = [];
    if (f !== 'pickup') {
      var miss = [];
      if (!g('soName'))   miss.push('recipient');
      if (!g('soPhone'))  miss.push('phone');
      if (!g('soL1'))     miss.push('address line 1');
      if (!g('soCity'))   miss.push('city / town');
      if (!g('soParish')) miss.push('parish');
      if (miss.length) return posToast('Delivery address needs: ' + miss.join(', ') + '.', true);
      notify = [].map.call(document.querySelectorAll('.soNotify:checked'), function(c){ return c.value; });
      if (!notify.length) return posToast('Choose at least one way to notify the customer — email, SMS or WhatsApp.', true);
    }
    var body = {
      items: posCartPayload(), discount_usd: t.orderDisc,
      customer_id: POS.customer ? POS.customer.id : null,
      customer_name: POS.custName || (POS.customer && POS.customer.name) || null,
      customer_phone: POS.custPhone || null,
      vehicle_info: POS.vehicle || null,
      sales_rep_id: posRepIdForPayload(), sales_rep_name: POS.rep ? POS.rep.name : null,
      notes: POS.notes || null, no_tax: !!POS.noTax, fulfilment: f,
      ship_instructions: g('soInstr') || null,
    };
    if (f !== 'pickup') {
      body.ship_method = soMethodSel.value || null;
      // Lenient parse -- the operator may type "1,500" or "$1500.00".
      body.ship_fee_usd = parseFloat(String(document.getElementById('soFee').value).replace(/[^0-9.]/g, '')) || 0;
      body.ship_name = g('soName') || null; body.ship_phone = g('soPhone') || null;
      body.ship_line1 = g('soL1') || null;  body.ship_line2 = g('soL2') || null;
      body.ship_city = g('soCity') || null; body.ship_parish = g('soParish') || null;
      body.notify_methods = notify;
      if (soMethodSel.value === 'Courier') {
        body.ship_courier = g('soCourier') || null;
        body.tracking_number = soTracking.value || posGenTracking();
      }
    }
    this.disabled = true; this.textContent = 'Saving…';
    try {
      var resp = await api('/api/admin/pos/order', { method: 'POST', body: body });
      posCloseModal();
      posToast('Order #' + resp.order_id + ' saved — a cashier can take payment now.' +
        (notify.length ? ' Notify: ' + notify.join(', ') + '.' : ''));
      // Courier order -> pop the shipping label straight away (before the
      // cart is cleared, so the piece count is still right).
      if (body.tracking_number) {
        posDocLabel(posOrderLabelData({
          name: body.ship_name, phone: body.ship_phone, line1: body.ship_line1, line2: body.ship_line2,
          city: body.ship_city, parish: body.ship_parish, method: body.ship_method,
          courier: body.ship_courier, tracking: body.tracking_number, instructions: body.ship_instructions,
        }, 'Order #' + resp.order_id));
      }
      posResetTicket();
      if (after) after();
    } catch (e) {
      this.disabled = false; this.textContent = 'Save order';
      posToast('Could not save the order: ' + e.message, true);
    }
  });
}

// ============= CASHIER — take payment on POS orders =============
// Counter operators without pos.finalise_invoice save orders here; a cashier
// picks one up, takes payment (replayed through the real /pos/sale path so
// stock + the invoice are minted exactly as a normal sale), and it closes.
var CASHIER_VIEW_ID = null;
async function renderCashier(panel){
  if (CASHIER_VIEW_ID) return renderCashierOrder(panel, CASHIER_VIEW_ID);
  panel.innerHTML = '<div class="empty">Loading orders…</div>';
  var r;
  try { r = await api('/api/admin/pos/orders?status=pending'); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  var rows = r.orders || [];
  panel.innerHTML =
    '<div style="padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)">' +
      '<h3 style="margin:0;font-size:16px">💵 Cashier — orders awaiting payment</h3>' +
      '<span style="color:var(--muted);font-size:12.5px">' + rows.length + ' pending</span>' +
      '<button class="btn" id="cashRefresh" style="margin-left:auto;font-size:12px">↻ Refresh</button>' +
    '</div>' +
    (rows.length
      ? '<table><thead><tr><th>Order</th><th>Taken</th><th>By</th><th>Customer</th><th>Leaves</th><th class="r">Units</th><th class="r">Total</th><th></th></tr></thead><tbody>' +
        rows.map(function(o){
          return '<tr class="cashRow" data-id="' + o.id + '" style="cursor:pointer">' +
            '<td><b>#' + o.id + '</b></td>' +
            '<td>' + esc(fmtDate(o.created_at)) + '</td>' +
            '<td>' + esc(o.taken_by_name || '—') + '</td>' +
            '<td>' + esc(o.customer_name || 'Walk-in') + (o.customer_phone ? ' · ' + esc(o.customer_phone) : '') + '</td>' +
            '<td>' + esc(o.ship_instructions ? '📝 ' : '') + (o.sales_rep_name ? 'rep ' + esc(o.sales_rep_name) : '') + '</td>' +
            '<td class="r">' + (o.unit_count || 0) + '</td>' +
            '<td class="r"><b>' + fmtMoney(o.total_usd || 0) + '</b></td>' +
            '<td class="r"><button class="btn ok" data-take="' + o.id + '" style="font-size:11.5px">Take payment ›</button></td>' +
          '</tr>';
        }).join('') + '</tbody></table>'
      : '<div class="empty" style="padding:32px">No orders waiting. When a counter operator saves an order it shows up here.</div>');
  var rf = document.getElementById('cashRefresh');
  if (rf) rf.addEventListener('click', function(){ renderCashier(panel); });
  panel.querySelectorAll('.cashRow, [data-take]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.stopPropagation();
      CASHIER_VIEW_ID = parseInt(el.getAttribute('data-id') || el.getAttribute('data-take'), 10);
      renderCashierOrder(panel, CASHIER_VIEW_ID);
    });
  });
}

async function renderCashierOrder(panel, id){
  panel.innerHTML = '<div class="empty">Loading order #' + id + '…</div>';
  var d;
  try { d = await api('/api/admin/pos/orders/' + id); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  var o = d.order, pay = d.payload || {}, items = d.items || [];
  var guide = (o.total_cents || 0) / 100;
  var ship = pay.fulfilment && pay.fulfilment !== 'pickup';
  panel.innerHTML =
    '<div style="padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)">' +
      '<button class="btn" id="cashBack">‹ All orders</button>' +
      '<h3 style="margin:0;font-size:16px">Order #' + o.id + '</h3>' +
      (o.status !== 'pending' ? badge(o.status, o.status === 'completed' ? 'ok' : 'bad') : '') +
      '<button class="btn" id="cashCancel" style="margin-left:auto;background:#fee2e2;color:#b91c1c;font-size:11.5px">Cancel order</button>' +
    '</div>' +
    '<div style="padding:16px;display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start">' +
      '<div>' +
        '<div style="color:var(--muted);font-size:12.5px;margin-bottom:8px">' +
          esc(o.customer_name || 'Cash Customer – Walk-in') + (o.customer_phone ? ' · ' + esc(o.customer_phone) : '') +
          (pay.sales_rep_name ? ' · rep ' + esc(pay.sales_rep_name) : '') +
          (pay.vehicle_info ? ' · ' + esc(pay.vehicle_info) : '') + '</div>' +
        '<table><thead><tr><th>Part</th><th>Description</th><th class="r">Qty</th><th class="r">Unit</th></tr></thead><tbody>' +
          items.map(function(it){
            return '<tr><td><code>' + esc(it.sku || it.product_img || '—') + '</code></td>' +
              '<td>' + esc(it.name || (pay.items || []).reduce(function(a,x){ return x.product_img === it.product_img ? x.description : a; }, '') || '') + '</td>' +
              '<td class="r">' + it.qty + '</td><td class="r">' + fmtMoney(it.unit_price_usd || 0) + '</td></tr>';
          }).join('') + '</tbody></table>' +
        (ship
          ? '<div style="margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px">' +
            '<b>' + esc((pay.fulfilment || '').toUpperCase()) + '</b>' + (pay.ship_method ? ' via ' + esc(pay.ship_method) : '') +
            (pay.ship_courier ? ' (' + esc(pay.ship_courier) + ')' : '') +
            (pay.ship_fee_usd ? ' · fee ' + fmtMoney(pay.ship_fee_usd) : '') + '<br>' +
            esc([pay.ship_name, pay.ship_phone].filter(Boolean).join(' · ')) + '<br>' +
            esc([pay.ship_line1, pay.ship_line2, pay.ship_city, pay.ship_parish].filter(Boolean).join(', ')) +
            (pay.tracking_number ? '<br><span style="font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700">🏷 ' + esc(pay.tracking_number) + '</span>' : '') +
            (pay.notify_methods && pay.notify_methods.length ? '<br><span style="color:var(--muted)">Notify: ' + esc(pay.notify_methods.join(', ')) + '</span>' : '') +
            (pay.tracking_number ? '<br><button type="button" class="btn" id="cashLabel" style="margin-top:6px;font-size:11.5px">🏷 Print shipping label</button>' : '') +
            '</div>'
          : '') +
        (o.ship_instructions ? '<div style="margin-top:10px;background:#fef9c3;border:1px solid #fde68a;border-radius:8px;padding:9px 12px;font-size:12.5px"><b>Instructions:</b> ' + esc(o.ship_instructions) + '</div>' : '') +
      '</div>' +
      '<div style="border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--card-soft2)">' +
        '<div style="font-size:12px;color:var(--muted)">Amount to collect <span style="font-size:10.5px">(guide — final figure is calculated on save)</span></div>' +
        '<div style="font-size:26px;font-weight:900;color:var(--red);margin:2px 0 12px">' + fmtMoney(guide) + '</div>' +
        '<label class="lbl">Payment method</label>' +
        '<select id="cashMethod" class="fld">' +
          ['cash','card','cheque','bank','account'].map(function(m){ return '<option value="' + m + '">' + m.charAt(0).toUpperCase() + m.slice(1) + '</option>'; }).join('') +
        '</select>' +
        '<div id="cashCashRow"><label class="lbl">Cash tendered (USD)</label><input id="cashTendered" type="number" step="0.01" min="0" class="fld" placeholder="' + guide.toFixed(2) + '"/></div>' +
        '<div id="cashRefRow" style="display:none"><label class="lbl">Reference</label><input id="cashRef" class="fld" placeholder="auth / cheque / PO no."/></div>' +
        '<button class="btn ok" id="cashInvoice" style="width:100%;margin-top:12px;padding:11px;font-weight:800">✅ Take payment &amp; invoice</button>' +
        '<div id="cashMsg" style="font-size:12px;margin-top:8px"></div>' +
      '</div>' +
    '</div>';
  document.getElementById('cashBack').addEventListener('click', function(){ CASHIER_VIEW_ID = null; renderCashier(panel); });
  var cashLabel = document.getElementById('cashLabel');
  if (cashLabel) cashLabel.addEventListener('click', function(){
    posDocLabel(posOrderLabelData({
      name: pay.ship_name, phone: pay.ship_phone, line1: pay.ship_line1, line2: pay.ship_line2,
      city: pay.ship_city, parish: pay.ship_parish, method: pay.ship_method, courier: pay.ship_courier,
      tracking: pay.tracking_number, instructions: o.ship_instructions,
    }, 'Order #' + o.id, items.map(function(it){ return { qty: it.qty }; })));
  });
  var mSel = document.getElementById('cashMethod');
  mSel.addEventListener('change', function(){
    document.getElementById('cashCashRow').style.display = this.value === 'cash' ? 'block' : 'none';
    document.getElementById('cashRefRow').style.display = ['card','cheque','bank','account'].indexOf(this.value) !== -1 ? 'block' : 'none';
  });
  document.getElementById('cashCancel').addEventListener('click', async function(){
    if (!(await posConfirm('Cancel order #' + o.id + '? The counter operator would have to ring it again.', { ok:'Cancel order', danger:true }))) return;
    try { await api('/api/admin/pos/orders/' + o.id + '/cancel', { method:'POST' }); CASHIER_VIEW_ID = null; renderCashier(panel); }
    catch (e) { posToast(e.message, true); }
  });
  document.getElementById('cashInvoice').addEventListener('click', async function(){
    var method = mSel.value;
    var p = { method: method, amount_usd: null, reference: null, amount_tendered: null };
    if (method === 'cash') {
      var tv = document.getElementById('cashTendered').value;
      p.amount_tendered = tv === '' ? guide : Number(tv);
    } else {
      p.reference = (document.getElementById('cashRef').value || '').trim() || null;
    }
    var msg = document.getElementById('cashMsg'); msg.style.color = 'var(--muted)'; msg.textContent = 'Posting…';
    this.disabled = true;
    try {
      var res = await api('/api/admin/pos/orders/' + o.id + '/invoice', { method:'POST', body: { payments: [p] } });
      var s = res.sale || {};
      if (await posConfirm('Invoice ' + (s.invoice_number || '#' + s.id) + ' — ' + fmtMoney(s.total_usd || guide) +
          (s.change_due ? '\n\nChange due: ' + fmtMoney(s.change_due) : '') + '\n\nPrint it now?', { ok:'Print', cancel:'Not now' })) {
        try { var full = await api('/api/admin/pos/sales/' + s.id); posPrintDoc('invoice', posSaleToDocData(full, POS_SHOP)); } catch (_) {}
      }
      CASHIER_VIEW_ID = null; renderCashier(panel);
    } catch (e) {
      this.disabled = false; msg.style.color = 'var(--red)'; msg.textContent = e.message;
    }
  });
}

// Everything the counter saves from the POS lands here, priced or not. A quote
// with unpriced lines is a job to finish, so those are called out.
async function renderQuotes(panel){
  var r = await api('/api/admin/pos/quotes');
  if (!r.quotes.length) {
    return panel.innerHTML = '<div class="empty">No quotes yet. Build a cart in the POS and hit <b>QUOTE</b>.</div>';
  }
  panel.innerHTML = '<table><thead><tr>' +
    '<th>Quote</th><th>When</th><th>Customer</th><th>Rep</th><th>Total</th><th>Valid until</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>' +
    r.quotes.map(function(q){
      var statusCls = q.status === 'converted' ? 'ok' : (q.status === 'declined' || q.status === 'expired' ? 'bad' : 'pending');
      return '<tr>' +
        '<td><b>' + esc(q.quote_number || '') + '</b>' +
          (q.receipt_number ? '<br/><small style="color:#15803d">→ ' + esc(q.receipt_number) + '</small>' : '') + '</td>' +
        '<td>' + fmtDate(q.created_at) + '</td>' +
        '<td>' + esc(q.customer_name || '—') +
          (q.customer_phone ? '<br/><small><a href="tel:' + esc(q.customer_phone) + '">' + esc(q.customer_phone) + '</a></small>' : '') + '</td>' +
        '<td><small>' + esc(q.sales_rep_name || '—') + '</small></td>' +
        '<td>' + (q.total_cents > 0
          ? '<b>' + posCents(q.total_cents) + '</b>'
          : '<span style="background:#e0e7ff;color:#1e3a8a;font-weight:700;padding:2px 6px;border-radius:4px;font-size:11.5px">NEEDS PRICING</span>') + '</td>' +
        '<td>' + esc(q.valid_until || '—') + '</td>' +
        '<td>' + badge(q.status || 'open', statusCls) + '</td>' +
        '<td class="actions"><button class="btn" data-quote="' + esc(String(q.id)) + '">Open</button></td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
  panel.querySelectorAll('[data-quote]').forEach(function(b){
    b.addEventListener('click', function(){ showQuoteDetail(b.getAttribute('data-quote')); });
  });
}

async function showQuoteDetail(ref){
  var r;
  try { r = await api('/api/admin/pos/quotes/' + encodeURIComponent(ref)); }
  catch (e) { return alert('Could not load that quote: ' + e.message); }
  var q = r.quote;
  var items = posItemsArray(q.items_json);
  // items_json stores exactly what posCartPayload() sends when a quote is
  // saved -- unit_price_usd (dollars), not unit_price_cents. Reading
  // unit_price_cents off these raw stored items was always undefined,
  // which made every quote's lines show "needs pricing" regardless of
  // whether a real price was set. Convert to cents here for posCents().
  var rows = items.map(function(it){
    var cents = Math.round(Number(it.unit_price_usd || 0) * 100);
    return '<tr>' +
      '<td>' + esc(it.description || it.product_img || '') +
        (it.product_img ? '<br/><code style="font-size:11px;color:var(--muted)">' + esc(it.product_img) + '</code>' : '') + '</td>' +
      '<td style="text-align:center">' + (it.qty || 1) + '</td>' +
      '<td style="text-align:right">' + (cents > 0 ? posCents(cents) : '<span style="color:#1e3a8a;font-weight:700">needs pricing</span>') + '</td>' +
      '<td style="text-align:right">' + (cents > 0 ? posCents(cents * (it.qty || 1)) : '—') + '</td>' +
    '</tr>';
  }).join('');
  var unpriced = items.filter(function(it){ return !(Number(it.unit_price_usd) > 0); }).length;

  posModal('Quote ' + esc(q.quote_number || ''),
    '<div style="font-size:13px;margin-bottom:10px">' +
      '<b>' + esc(q.customer_name || 'Walk-in') + '</b>' +
      (q.customer_phone ? ' · <a href="tel:' + esc(q.customer_phone) + '">' + esc(q.customer_phone) + '</a>' : '') +
      (q.vehicle_info ? '<br/><small style="color:var(--muted)">🚗 ' + esc(q.vehicle_info) + '</small>' : '') +
      (q.sales_rep_name ? '<br/><small style="color:var(--muted)">Rep: ' + esc(q.sales_rep_name) + '</small>' : '') +
      (q.valid_until ? '<br/><small style="color:var(--muted)">Valid until ' + esc(q.valid_until) + '</small>' : '') +
    '</div>' +
    '<table style="width:100%;font-size:12.5px"><thead><tr>' +
      '<th align="left">Part</th><th>Qty</th><th align="right">Unit</th><th align="right">Line</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div style="text-align:right;margin-top:10px;font-size:14px">' +
      '<div style="color:var(--muted);font-size:12.5px">Subtotal ' + posCents(q.subtotal_cents) +
      (q.discount_cents > 0 ? ' · Discount −' + posCents(q.discount_cents) : '') +
      ' · GCT ' + posCents(q.tax_cents) + '</div>' +
      '<b>Total ' + posCents(q.total_cents) + '</b>' +
    '</div>' +
    '<div style="display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap">' +
      '<button type="button" class="btn" id="qPrint" title="Full A4 quotation format">📄 Print quote</button>' +
      '<button type="button" class="btn ghost" id="qPrintReceipt" title="Same layout as a thermal sale receipt">🧾 Receipt-style</button>' +
      '<button type="button" class="btn ghost" id="qPrintInvoice" title="Same layout as an A4 invoice">📋 Invoice-style</button>' +
      (q.status !== 'converted'
        ? '<button type="button" class="btn ok" id="qLoad"' + (unpriced ? ' title="Unpriced lines will need a price before checkout"' : '') + '>🛒 Load into POS</button>' +
          '<button type="button" class="btn" id="qAccept">Mark accepted</button>' +
          '<button type="button" class="btn" id="qDecline" style="background:#fee2e2;color:#b91c1c">Mark declined</button>'
        : '<span style="align-self:center;font-size:12.5px;color:#15803d;font-weight:700">✔ Converted to a sale</span>') +
    '</div>'
  );

  document.getElementById('qPrint').addEventListener('click', function(){ posPrintQuote(q, r.shop); });
  document.getElementById('qPrintReceipt').addEventListener('click', function(){ posDocReceipt(posQuoteToDocData(q, r.shop)); });
  document.getElementById('qPrintInvoice').addEventListener('click', function(){ posDocInvoice(posQuoteToDocData(q, r.shop)); });
  var ld = document.getElementById('qLoad');
  if (ld) ld.addEventListener('click', function(){
    POS = posLoadState();
    if (POS.cart.length && !confirm('The current cart will be replaced. Continue?')) return;
    POS = posBlankTicket();
    // items_json stores unit_price_usd/discount_usd (what posCartPayload()
    // actually sends), not the _cents field names -- see the same note on
    // the item-rows rendering above.
    POS.cart = items.map(function(it){
      return {
        img: it.product_img, name: it.description, price: Number(it.unit_price_usd) || 0,
        qty: it.qty || 1, disc: Number(it.discount_usd) || 0, discNote: it.discount_note || '',
      };
    });
    POS.custName = q.customer_name || '';
    POS.custPhone = q.customer_phone || '';
    POS.vehicle = q.vehicle_info || '';
    POS.rep = q.sales_rep_id ? { id: q.sales_rep_id, name: q.sales_rep_name } : null;
    POS.quoteId = q.id;
    if (q.customer_id) POS.customer = { id: q.customer_id, name: q.customer_name, phone: q.customer_phone, email: q.customer_email, price_tier: 'retail', points_balance: 0, open_balance_cents: 0 };
    posSaveState();
    posCloseModal();
    show('pos');
  });
  ['qAccept','qDecline'].forEach(function(id){
    var b = document.getElementById(id);
    if (!b) return;
    b.addEventListener('click', async function(){
      try {
        await api('/api/admin/pos/quotes/' + q.id, { method:'PATCH', body: { status: id === 'qAccept' ? 'accepted' : 'declined' } });
        posCloseModal();
        show('quotes');
      } catch (e) { alert(e.message); }
    });
  });
}

// =============================================================================
//  TENDER & CHECKOUT
//  Pick the fulfilment, discount, loyalty and tender(s), then post the sale and
//  offer whichever documents actually apply to it.
// =============================================================================
var TENDER = null;

function openTenderModal(after){
  if (!POS.cart.length) return alert('Cart is empty.');

  // Fresh tender state every open. payments is an array of
  //   { method, amount_usd|null, amount_tendered|null (cash only), reference|null }
  // amount_usd=null means "auto-fill with the remaining balance".
  TENDER = {
    payments: [ { method: 'cash', amount_usd: null, amount_tendered: null, reference: null } ],
    posting: false,
  };
  // Delivery defaults to the customer we already have, so the common case is
  // one radio click rather than retyping a name and number.
  if (!POS.ship.name) POS.ship.name = POS.custName || (POS.customer && POS.customer.name) || '';
  if (!POS.ship.phone) POS.ship.phone = POS.custPhone || (POS.customer && POS.customer.phone) || '';

  if (!document.getElementById('tenderOverlay')) {
    document.body.insertAdjacentHTML('beforeend',
      '<div id="tenderOverlay" style="position:fixed;inset:0;background:rgba(11,27,43,.78);z-index:9999;display:none;align-items:center;justify-content:center;padding:14px;overflow:auto">' +
        '<div id="tenderBox" style="background:var(--card);border-radius:14px;max-width:760px;width:100%;padding:0;box-shadow:0 24px 60px rgba(0,0,0,.5);position:relative;font-family:inherit;max-height:94vh;display:flex;flex-direction:column">' +
          '<header style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--navy);color:#fff;border-radius:14px 14px 0 0">' +
            '<h2 id="tenderTitle" style="margin:0;font-size:17px;letter-spacing:.5px">💳 TENDER &amp; CHECKOUT</h2>' +
            '<button id="tenderClose" type="button" style="background:none;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer">&times;</button>' +
          '</header>' +
          '<div id="tenderBody" style="flex:1;overflow-y:auto;padding:16px 20px"></div>' +
          '<footer id="tenderFoot" style="padding:14px 20px;border-top:1px solid var(--line);background:var(--card-soft);display:flex;justify-content:space-between;gap:10px;align-items:center;border-radius:0 0 14px 14px;flex-wrap:wrap"></footer>' +
        '</div>' +
      '</div>'
    );

  document.getElementById('tenderFoot').innerHTML =
    '<button id="tenderCancel" type="button" class="btn" style="background:var(--line)">Cancel</button>' +
    '<button id="tenderComplete" type="button" style="background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 28px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14.5px;letter-spacing:.5px">Complete Sale</button>';
  document.getElementById('tenderCancel').addEventListener('click', closeTenderModal);

  // Sum of the tender rows. Rows with amount_usd=null are auto-filled with the
  // remainder. `account` is a charge, not money, so it is tracked apart: it
  // covers the ticket but does not count as tendered and never makes change.
  function paymentSummary(total){
    var allocated = 0;
    TENDER.payments.forEach(function(p){
      if (p.amount_usd != null && p.amount_usd !== '') allocated += Number(p.amount_usd);
    });
    var remaining = Math.round((total - allocated) * 100) / 100;
    var blankIdx = -1;
    for (var i = 0; i < TENDER.payments.length; i++) {
      if (TENDER.payments[i].amount_usd == null || TENDER.payments[i].amount_usd === '') { blankIdx = i; break; }
    }
    var moneyIn = 0, charged = 0;
    TENDER.payments.forEach(function(p, idx){
      var amt = (p.amount_usd != null && p.amount_usd !== '') ? Number(p.amount_usd)
              : (idx === blankIdx ? Math.max(0, remaining) : 0);
      if (p.method === 'account') { charged += amt; return; }
      if (p.method === 'cash' && p.amount_tendered != null && p.amount_tendered !== '') moneyIn += Number(p.amount_tendered);
      else moneyIn += amt;
    });
    var dueNow = Math.round((total - charged) * 100) / 100;
    return {
      allocated: allocated, remaining: remaining, blankIdx: blankIdx,
      moneyIn: moneyIn, charged: charged, dueNow: dueNow,
      change: Math.round((moneyIn - dueNow) * 100) / 100,
    };
  }

  function renderPaymentRow(p, idx, autoFillHint){

    var isAccount = p.method === 'account';
    var isGiftCard = p.method === 'gift_card';

    // Charging to an account needs a real customer record to charge against.

    return '<div style="border:1px solid ' + (accountBlocked ? '#fca5a5' : 'var(--line)') + ';border-radius:8px;padding:10px;margin-bottom:6px;background:var(--card-soft)">' +
      '<div style="display:grid;grid-template-columns:repeat(' + Object.keys(methods).length + ',1fr);gap:4px;margin-bottom:8px">' +

        }).join('') +

        : '') +

          '<input class="tPayAmt" data-pidx="' + idx + '" type="number" min="0" step="0.01" value="' + (p.amount_usd != null && p.amount_usd !== '' ? p.amount_usd : '') + '" placeholder="' + hint + '" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:13px;font-weight:700"/>' +

              '<input class="tPayTendered" data-pidx="' + idx + '" type="number" min="0" step="0.01" value="' + (p.amount_tendered != null && p.amount_tendered !== '' ? p.amount_tendered : '') + '" placeholder="' + hint + '" style="width:100%;padding:7px 9px;border:1px solid #86efac;background:#f0fdf4;border-radius:5px;font-family:inherit;font-size:13px;font-weight:700"/>' +

                '<input class="tPayRef" data-pidx="' + idx + '" type="date" value="' + esc(p.reference || '') + '" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:13px"/></div>'
            : isGiftCard
              ? '<div><label style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px">Gift card code</label>' +
                  '<div style="display:flex;gap:4px">' +
                    '<input class="tPayRef" data-pidx="' + idx + '" type="text" value="' + esc(p.reference || '') + '" placeholder="e.g. GC-AB12CD" style="flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:13px;text-transform:uppercase"/>' +

          '</div>'
        : '') +
      (TENDER.payments.length > 1
        ? '<div style="text-align:right;margin-top:6px"><button type="button" class="tRemPayment" data-pidx="' + idx + '" style="background:none;border:0;color:#b91c1c;font-size:11px;cursor:pointer;font-weight:700">Remove tender ✕</button></div>'
        : '') +
    '</div>';
  }

  function wireEvents(){
    // Fulfilment
    document.querySelectorAll('.tFul').forEach(function(b){
      b.addEventListener('click', function(){
        POS.fulfilment = this.getAttribute('data-ful');
        if (POS.fulfilment === 'pickup') POS.ship.fee = 0;
        posSaveState();
        paint();
      });
    });
    var shipFields = { shName:'name', shPhone:'phone', shLine1:'line1', shLine2:'line2', shCity:'city', shParish:'parish', shMethod:'method', shInstr:'instructions' };
    Object.keys(shipFields).forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.addEventListener('input', function(){ POS.ship[shipFields[id]] = this.value; posSaveState(); });
    });
    var fee = document.getElementById('shFee');
    if (fee) fee.addEventListener('input', function(){ POS.ship.fee = Math.max(0, Number(this.value) || 0); posSaveState(); paint(); });
    var saved = document.getElementById('shUseSaved');
    if (saved) saved.addEventListener('click', async function(){
      try {
        var r = await api('/api/admin/pos/customer/' + POS.customer.id + '/addresses');
        var a = (r.addresses || [])[0];
        if (!a) return;
        POS.ship.line1 = a.line1 || ''; POS.ship.line2 = a.line2 || '';
        POS.ship.city = a.city || ''; POS.ship.parish = a.parish || '';
        POS.ship.name = a.recipient || POS.ship.name; POS.ship.phone = a.phone || POS.ship.phone;
        posSaveState(); paint();
      } catch (e) { alert(e.message); }
    });

    // Loyalty
    var rp = document.getElementById('tRedeemPts');
    if (rp) rp.addEventListener('input', function(){ POS.redeemPts = parseInt(this.value, 10) || 0; posSaveState(); paint(); });
    var rmax = document.getElementById('tRedeemMax');
    if (rmax) rmax.addEventListener('click', function(){
      // Cap redemption at what the ticket is actually worth, so points aren't
      // burned past a zero balance.
      var save = POS.redeemPts;
      POS.redeemPts = 0;
      var t0 = posTotals();
      POS.redeemPts = save;
      POS.redeemPts = Math.min(POS.customer.points_balance, Math.floor(t0.total / POS_POINTS_USD_RATE));
      posSaveState();
      paint();
    });

    // Tenders
    document.querySelectorAll('.tPayMethodBtn').forEach(function(b){
      b.addEventListener('click', function(){
        var row = TENDER.payments[parseInt(this.getAttribute('data-pidx'), 10)];
        row.method = this.getAttribute('data-method');
        delete row._gcBalance; delete row._gcActive;   // stale lookup from a different method/code
        paint();
      });
    });
    document.querySelectorAll('.tPayAmt').forEach(function(inp){
      inp.addEventListener('input', function(){
        TENDER.payments[parseInt(this.getAttribute('data-pidx'), 10)].amount_usd = this.value === '' ? null : Number(this.value);
        paint();
      });
    });
    document.querySelectorAll('.tPayTendered').forEach(function(inp){
      inp.addEventListener('input', function(){
        TENDER.payments[parseInt(this.getAttribute('data-pidx'), 10)].amount_tendered = this.value === '' ? null : Number(this.value);
        paint();
      });
    });
    document.querySelectorAll('.tPayRef').forEach(function(inp){
      inp.addEventListener('input', function(){
        var row = TENDER.payments[parseInt(this.getAttribute('data-pidx'), 10)];
        row.reference = this.value;
        delete row._gcBalance; delete row._gcActive;   // code changed -- last balance no longer applies
      });
    });
    document.querySelectorAll('.tGcCheck').forEach(function(b){
      b.addEventListener('click', async function(){
        var i = parseInt(this.getAttribute('data-pidx'), 10);
        var row = TENDER.payments[i];
        var code = String(row.reference || '').trim().toUpperCase();
        if (!code) return alert('Enter the gift card code first.');
        this.disabled = true; this.textContent = '…';
        try {
          var gc = (await api('/api/admin/gift-cards/' + encodeURIComponent(code))).gift_card;
          row._gcBalance = gc.balance_usd;
          row._gcActive = !!gc.is_active;
          if (gc.is_active && gc.balance_usd > 0) {
            // Same "how much is left to pay" math as the EXACT button, capped
            // at whatever the card actually has on it.
            var t = posTotals();
            var summ = paymentSummary(t.total);
            var want = summ.blankIdx === i ? Math.max(0, summ.remaining) : Number(row.amount_usd || 0) || Math.max(0, summ.remaining);
            row.amount_usd = Math.round(Math.min(gc.balance_usd, want) * 100) / 100;
          }
        } catch (e) {
          delete row._gcBalance; delete row._gcActive;
          alert('Could not look up that gift card: ' + e.message);
        }
        paint();
      });
    });
    document.querySelectorAll('.tQuickAmt').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(this.getAttribute('data-pidx'), 10);
        var cur = TENDER.payments[i].amount_tendered != null ? Number(TENDER.payments[i].amount_tendered) : 0;
        TENDER.payments[i].amount_tendered = Math.round((cur + Number(this.getAttribute('data-amt'))) * 100) / 100;
        paint();
      });
    });
    document.querySelectorAll('.tExact').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(this.getAttribute('data-pidx'), 10);
        var t = posTotals();
        var summ = paymentSummary(t.total);
        var rest = summ.blankIdx === i ? Math.max(0, summ.remaining) : Number(TENDER.payments[i].amount_usd || 0);
        if (!rest) rest = Math.max(0, summ.remaining);
        TENDER.payments[i].amount_usd = rest;
        TENDER.payments[i].amount_tendered = rest;
        paint();
      });
    });
    var addBtn = document.getElementById('tAddPayment');
    if (addBtn) addBtn.addEventListener('click', function(){
      TENDER.payments.push({ method: 'card', amount_usd: null, amount_tendered: null, reference: null });
      paint();
    });
    document.querySelectorAll('.tRemPayment').forEach(function(btn){
      btn.addEventListener('click', function(){
        TENDER.payments.splice(parseInt(this.getAttribute('data-pidx'), 10), 1);
        if (!TENDER.payments.length) TENDER.payments = [{ method:'cash', amount_usd:null, amount_tendered:null, reference:null }];
        paint();
      });
    });

    var po = document.getElementById('tPo');   if (po) po.addEventListener('input', function(){ POS.poNumber = this.value; posSaveState(); });
    var no = document.getElementById('tNotes'); if (no) no.addEventListener('input', function(){
      POS.notes = this.value; posSaveState();
      // Keep the cart sidebar's comment box (behind this modal) in sync so
      // it doesn't show a stale value if the modal is closed without checking out.
      var cn = document.getElementById('posCartNotes'); if (cn) cn.value = this.value;
      var nd = document.getElementById('posNoteDot'); if (nd) nd.style.display = this.value.trim() ? 'inline' : 'none';
    });
  }

  paint();

  document.getElementById('tenderComplete').onclick = async function(){
    if (TENDER.posting) return;
    var completeBtn = this;
    var t = posTotals();
    var summ = paymentSummary(t.total);

    if (summ.charged > 0 && !POS.customer) {
      return alert('A charge sale has to go on a customer account. Attach a customer first, or change that tender to cash or card.');
    }
    if (POS.fulfilment !== 'pickup' && !(POS.ship.line1 || '').trim()) {
      return alert('A delivery or shipping sale needs a street address.');
    }
    var missingSerial = POS.cart.find(function(i){ return i.serialRequired && !(i.serialNumber || '').trim(); });
    if (missingSerial) return alert('"' + missingSerial.name + '" requires a serial number to sell — enter it on the cart line.');

    var needApproval = POS.cart.some(function(i){ return i.restrictedManagerApproval; });
    if (needApproval && !POS.restrictedApprovedBy && !['owner', 'manager'].includes(CURRENT_ADMIN_ROLE)) {
      var appr = await posPinPrompt({
        purpose: 'override', title: 'Manager approval needed',
        detail: 'One or more items in this cart require manager approval to sell.',
      });
      if (!appr) return;
      POS.restrictedApprovedBy = appr.name;
      posSaveState();
    }
    var needId = POS.cart.some(function(i){ return i.restrictedIdRequired; }) && !(POS.verification.id_number || '').trim();
    var needTaxId = POS.cart.some(function(i){ return i.restrictedTaxIdRequired; }) && !(POS.verification.tax_id || '').trim();
    if (needId || needTaxId) {
      var v = await posVerificationPrompt({
        needId: needId, needTaxId: needTaxId,
        taxIdPrefill: (POS.customer && POS.customer.tax_id) || '',
      });
      if (!v) return;
      if (needId) { POS.verification.id_type = v.id_type; POS.verification.id_number = v.id_number; }
      if (needTaxId) POS.verification.tax_id = v.tax_id;
      posSaveState();
    }
    if (summ.moneyIn + 0.001 < summ.dueNow) {
      return alert('Tendered (' + fmtMoney(summ.moneyIn) + ') is less than the amount due now (' + fmtMoney(summ.dueNow) + ').');
    }
    var missingGcCode = TENDER.payments.some(function(p){ return p.method === 'gift_card' && !(p.reference || '').trim(); });
    if (missingGcCode) return alert('Enter (and Check) a gift card code for the gift card tender before completing the sale.');
    var missingRef = TENDER.payments.some(function(p){
      return (p.method === 'card' || p.method === 'cheque' || p.method === 'bank') && !(p.reference || '').trim();
    });
    if (missingRef && !confirm('One or more non-cash tenders has no reference. Continue anyway?')) return;
    if (summ.charged > 0 && !confirm('Charge ' + fmtMoney(summ.charged) + ' to ' + (POS.customer.name || 'this account') + '?\n\nThe goods leave against a balance, not against money.')) return;

    // Fill auto rows with the calculated remainder so the server sees explicit
    // numbers rather than having to guess the same way twice.
    var payments = TENDER.payments.map(function(p, idx){
      var amt = (p.amount_usd != null && p.amount_usd !== '')
        ? Number(p.amount_usd)
        : (idx === summ.blankIdx ? Math.max(0, summ.remaining) : 0);
      return {
        method: p.method,
        amount_usd: Math.round(amt * 100) / 100,
        amount_tendered: p.method === 'cash'
          ? (p.amount_tendered != null && p.amount_tendered !== '' ? Number(p.amount_tendered) : amt)
          : null,
        reference: p.method === 'account' ? null : ((p.reference || '').trim() || null),
      };
    });
    var accountRow = TENDER.payments.find(function(p){ return p.method === 'account'; });

    var payload = {
      items: posCartPayload(),
      payments: payments,
      discount_usd: t.orderDisc,
      loyalty_points_redeemed: t.redeemPts,
      customer_id: POS.customer ? POS.customer.id : null,
      customer_name: POS.custName || (POS.customer && POS.customer.name) || null,
      customer_phone: POS.custPhone || null,
      vehicle_info: POS.vehicle || null,
      sales_rep_id: posRepIdForPayload(),
      sales_rep_name: POS.rep ? POS.rep.name : null,
      notes: POS.notes || null,
      po_number: POS.poNumber || null,
      fulfilment: POS.fulfilment,
      ship_method: POS.ship.method || null,
      ship_fee_usd: POS.fulfilment === 'pickup' ? 0 : (Number(POS.ship.fee) || 0),
      ship_name: POS.ship.name || null,
      ship_phone: POS.ship.phone || null,
      ship_line1: POS.ship.line1 || null,
      ship_line2: POS.ship.line2 || null,
      ship_city: POS.ship.city || null,
      ship_parish: POS.ship.parish || null,
      ship_instructions: POS.ship.instructions || null,
      due_date: accountRow && accountRow.reference ? accountRow.reference : null,
      quote_id: POS.quoteId || null,
      hold_id: POS.holdId || null,
      no_tax: !!POS.noTax,   // operator switched GCT off on this ticket; server re-checks
      restricted_approved_by: POS.restrictedApprovedBy || null,
      verify_id_type: POS.verification.id_type || null,
      verify_id_number: POS.verification.id_number || null,
      verify_tax_id: POS.verification.tax_id || null,
      coupon_code: POS.couponCode || null,
    };

    TENDER.posting = true;
    completeBtn.disabled = true;
    completeBtn.textContent = 'Posting…';
    try {
      var resp = await api('/api/admin/pos/sale', { method:'POST', body: payload });
      // Re-read the stored sale so every document prints from the canonical
      // record rather than from whatever is still in the browser.
      var full = null;
      try { full = await api('/api/admin/pos/sales/' + resp.id); } catch (_) {}
      posResetTicket();
      showTenderReceipt(resp, full, after);
    } catch (e) {
      TENDER.posting = false;
      alert('Sale failed: ' + e.message);
      completeBtn.disabled = false;
      completeBtn.textContent = 'Complete Sale';
    }
  };

  document.getElementById('tenderOverlay').style.display = 'flex';
}

function closeTenderModal(){
  var o = document.getElementById('tenderOverlay');
  if (o) o.style.display = 'none';
}

// -----------------------------------------------------------------------------
//  Post-sale: confirmation plus the document rack. Which documents are offered
//  depends on how the goods are leaving -- a counter pickup has nothing to pack
//  and nothing to label, so those two are shown disabled with the reason rather
//  than hidden, so the operator can see the rule instead of wondering.
// -----------------------------------------------------------------------------
function showTenderReceipt(resp, full, after){
  // full (a fresh GET /api/admin/pos/sales/:id, fetched right after posting)
  // is the canonical source when it loaded -- resp is the direct POST reply,
  // which has the same real dollar fields (subtotal_usd, tax_usd, etc., NOT
  // the *_cents/invoice_number/fulfilment/delivery/balance_due shape this
  // function used to read -- those never existed on either response, so the
  // totals shown here were silently all zero on every single sale).
  var sale = (full && full.sale) || resp;
  var pays = (full && full.payments) || resp.payments || [];
  var loyalty = resp.loyalty;
  var methodLabel = posMethodLabel;
  var posFul = sale.fulfilment || resp.fulfilment || 'pickup';

  document.getElementById('tenderTitle').innerHTML = '✅ SALE COMPLETE';
  document.getElementById('tenderBody').innerHTML =
    '<div style="text-align:center;padding:18px 10px 14px">' +
      '<div style="font-size:52px;line-height:1">✅</div>' +
      '<h2 style="margin:10px 0 2px;color:var(--heading);font-size:21px">Sale Complete</h2>' +
      '<p style="color:var(--muted);font-size:13.5px;margin:0">Receipt <b>' + esc(resp.receipt_number || sale.receipt_number || '') + '</b></p>' +
      (loyalty && (loyalty.points_earned || loyalty.points_redeemed)
        ? '<p style="color:#92400e;font-size:12.5px;margin:5px 0 0">' +
            (loyalty.points_redeemed ? '⭐ ' + loyalty.points_redeemed + ' pts redeemed · ' : '') +
            (loyalty.points_earned ? '+' + loyalty.points_earned + ' pts earned · ' : '') +
            'Balance: ' + (loyalty.balance != null ? loyalty.balance : 0) + ' pts' +
          '</p>'
        : '') +
    '</div>' +

    '<div style="display:flex;justify-content:center;margin-bottom:16px"><div style="background:var(--card-soft);border:1px solid var(--line);border-radius:10px;padding:14px 22px;text-align:left;min-width:310px;font-size:13.5px">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span>Subtotal</span><b>' + fmtMoney(sale.subtotal_usd) + '</b></div>' +
      (Number(sale.discount_usd) > Number(sale.loyalty_discount_usd || 0) ? '<div style="display:flex;justify-content:space-between;margin-bottom:3px;color:#b91c1c"><span>Discount</span><b>−' + fmtMoney(sale.discount_usd - Number(sale.loyalty_discount_usd || 0)) + '</b></div>' : '') +
      (Number(sale.loyalty_discount_usd) > 0 ? '<div style="display:flex;justify-content:space-between;margin-bottom:3px;color:#92400e"><span>⭐ Loyalty</span><b>−' + fmtMoney(sale.loyalty_discount_usd) + '</b></div>' : '') +
      '<div style="display:flex;justify-content:space-between;margin-bottom:3px;color:var(--muted)"><span>' + (sale.tax_exempt ? 'GCT (exempt)' : 'GCT 15%') + '</span><b>' + fmtMoney(sale.tax_usd) + '</b></div>' +
      '<div style="display:flex;justify-content:space-between;padding-top:6px;border-top:1px solid var(--line);font-size:16px;margin-bottom:6px"><b>Total</b><b>' + fmtMoney(sale.total_usd) + '</b></div>' +
      pays.map(function(p){
        return '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:#374151"><span>' + methodLabel(p.method) + (p.reference ? ' · ' + esc(p.reference) : '') + '</span><b>' + fmtMoney(p.amount_usd) + '</b></div>';
      }).join('') +
      (Number(resp.change_due || sale.change_due) > 0
        ? '<div style="display:flex;justify-content:space-between;padding-top:6px;border-top:1px dashed var(--line);margin-top:4px;color:#15803d;font-size:14px"><b>Change</b><b>' + fmtMoney(resp.change_due || sale.change_due) + '</b></div>'
        : '') +
    '</div></div>' +

    // ---- Document rack. Packing slip / shipping label apply once the sale is
    // a delivery or a shipment (migration 0010's fulfilment); a counter pickup
    // has nothing to pack or label, so those stay disabled with the reason.
    '<div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px">' +
      '<div style="font-weight:700;color:var(--heading);font-size:11.5px;margin-bottom:9px;letter-spacing:.5px">🖨 PRINT</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px">' +
        posDocButton('receipt',  '🧾 Receipt',        'Thermal receipt for the customer', true) +
        posDocButton('invoice',  '📄 Invoice',        'Full tax invoice',                 true) +
        posDocButton('pickslip', '📋 Pick slip',      'Warehouse pull list by bin',       true) +
        posDocButton('packing',  '📦 Packing slip',   posFul === 'pickup' ? 'N/A — counter pickup' : 'What to pack for this order', posFul !== 'pickup') +
        posDocButton('label',    '🏷 Shipping label', posFul === 'shipping' ? 'Carrier label with barcode' : 'N/A — no courier shipment', posFul === 'shipping') +
        posDocButton('gift',     '🎁 Gift receipt',   'Proof of purchase, no prices',     true) +
      '</div>' +
    '</div>';

  document.getElementById('tenderFoot').innerHTML =
    '<span style="font-size:12px;color:var(--muted)">' + (posFul === 'pickup' ? 'Counter pickup' : posFul === 'delivery' ? 'For delivery' : 'For shipping') + ' — pick a format above, print it, and hand over the parts.</span>' +
    '<button id="tenderDone" type="button" style="background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 28px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14.5px">Done</button>';

  document.querySelectorAll('[data-doc]').forEach(function(b){
    if (b.disabled) return;
    b.addEventListener('click', async function(){
      var data = full;
      if (!data) {
        try { data = await api('/api/admin/pos/sales/' + resp.id); }
        catch (e) { return alert('Could not load the sale to print: ' + e.message); }
      }
      // posPrintDoc's templates read the cents-based shape posSaleToDocData()
      // produces, not the raw {sale,items,payments} this screen already has
      // -- posSaleDetail's reprint buttons go through that adapter, this one
      // didn't, so every document printed straight off "Sale Complete" came
      // out blank/zeroed even though reprinting the same sale later worked.
      posPrintDoc(this.getAttribute('data-doc'), posSaleToDocData(data, POS_SHOP));
    });
  });
  document.getElementById('tenderDone').addEventListener('click', function(){
    closeTenderModal();
    if (after) after();
  });

  // Auto-print the shop's default document (Setup → Print defaults) so the
  // common case -- ring up, hand over a receipt -- needs no click at all.
  // The document rack above stays fully available for anything else (a
  // customer who wants an invoice too, a gift receipt, a reprint).
  (async function(){
    var autoKind = POS_SHOP.default_print_template === 'invoice' ? 'invoice' : 'receipt';
    var autoBtn = document.querySelector('[data-doc="' + autoKind + '"]');
    if (!autoBtn || autoBtn.disabled) return;
    // Same {sale,items,payments} shape posSaleToDocData() needs -- `full` is
    // usually already that shape; refetch rather than falling back to the
    // raw POST response, which is flat (no .sale/.items) and would print
    // blank, same bug the manual document buttons above were fixed for.
    var data = full;
    if (!data) { try { data = await api('/api/admin/pos/sales/' + resp.id); } catch (_) { return; } }
    posPrintDoc(autoKind, posSaleToDocData(data, POS_SHOP));
  })();
}

function posDocButton(kind, label, sub, enabled){
  return '<button type="button" data-doc="' + kind + '"' + (enabled ? '' : ' disabled') +
    ' style="text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:' + (enabled ? 'var(--card)' : 'var(--card-soft2)') +
    ';cursor:' + (enabled ? 'pointer' : 'not-allowed') + ';font-family:inherit;opacity:' + (enabled ? '1' : '.55') + '">' +
    '<b style="font-size:12.5px;color:' + (enabled ? 'var(--heading)' : 'var(--muted)') + '">' + label + '</b>' +
    '<br/><small style="font-size:10.5px;color:var(--muted)">' + sub + '</small>' +
  '</button>';
}

function posMethodLabel(m){
  return ({ cash:'Cash', card:'Card', cheque:'Cheque', bank:'Bank transfer', loyalty:'Loyalty', gift_card:'Gift card', account:'On account', split:'Split', store_credit:'Store credit' })[m] || m;
}

// =============================================================================
//  COUNTER DOCUMENTS
//  Five documents come off a sale, and which ones apply depends on how the
//  goods leave:
//    receipt   — always. Thermal, for the customer.
//    invoice   — always. A4 tax invoice; the one a trade customer files.
//    pick slip — always. Bin-ordered pull list, no prices, for the warehouse.
//    packing   — only when it is being delivered or shipped. Goes in the box.
//    label     — only when it is being shipped. Address label for the parcel.
//    gift      — always. Proof of purchase with the money taken off.
//  Every document renders from the stored sale fetched back from the server,
//  so a reprint months later is identical to the original.
// =============================================================================

// Code 39: the barcode symbology a parts counter's existing scanners already
// read without configuration, and simple enough to render honestly here rather
// than pulling in a library. Each character is 9 elements (bar/space
// alternating, starting with a bar); 'w' elements are 3 units wide, 'n' are 1,
// and characters are separated by a 1-unit space.
var POS_CODE39 = {
  '0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw',
  '5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn',
  'A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn',
  'F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn',
  'K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn',
  'P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn',
  'U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn',
  'Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn'
};
function posBarcode(text, height, unit){
  var h = height || 52, u = unit || 2;
  var s = '*' + String(text || '').toUpperCase().replace(/[^0-9A-Z\-. ]/g, '-') + '*';
  var x = 0, rects = [];
  for (var i = 0; i < s.length; i++) {
    var pat = POS_CODE39[s[i]];
    if (!pat) continue;
    for (var j = 0; j < 9; j++) {
      var w = (pat[j] === 'w' ? 3 : 1) * u;
      if (j % 2 === 0) rects.push('<rect x="' + x + '" y="0" width="' + w + '" height="' + h + '"/>');
      x += w;
    }
    x += u; // inter-character gap
  }
  return '<svg viewBox="0 0 ' + x + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none" style="max-width:340px">' +
    '<g fill="#000">' + rects.join('') + '</g></svg>';
}

// Opens a print window. Kept in one place so every document shares the same
// page setup and the same "render, then print" timing -- printing before the
// document has laid out gives a blank sheet on some browsers.
function posPrintWindow(title, pageCss, bodyHtml, size){
  var w = window.open('', '_blank', size || 'width=860,height=900');
  if (!w) return alert('Your browser blocked the print window. Allow pop-ups for this site and try again.');
  w.document.write(
    '<!doctype html><html><head><meta charset="utf-8"/><title>' + esc(title) + '</title><style>' +
    '*{box-sizing:border-box}body{margin:0;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    'table{width:100%;border-collapse:collapse}' +
    '@media print{.noprint{display:none}}' +
    pageCss +
    '</style></head><body>' + bodyHtml +
    '<div class="noprint" style="text-align:center;padding:14px;font-family:system-ui,sans-serif">' +
      '<button onclick="window.print()" style="background:#0b1b2b;color:#fff;border:0;padding:10px 22px;border-radius:6px;font-weight:700;cursor:pointer">Print</button>' +
    '</div></body></html>'
  );
  w.document.close();
  w.focus();
  setTimeout(function(){ try { w.print(); } catch (_) {} }, 350);
}

function posShipToBlock(s){
  return [s.ship_name, s.ship_line1, s.ship_line2, [s.ship_city, s.ship_parish].filter(Boolean).join(', '), s.ship_country, s.ship_phone]
    .filter(Boolean).map(function(l){ return esc(l); }).join('<br/>');
}
function posShopBlock(shop){
  return esc(shop.name) + '<br/>' + esc(shop.address) + '<br/>' + esc(shop.country || '') + '<br/>' + esc(shop.phone);
}
function posWhen(s){
  return new Date(s || Date.now()).toLocaleString('en-JM', { dateStyle:'medium', timeStyle:'short' });
}

function posPrintDoc(kind, data){
  var fns = { receipt: posDocReceipt, invoice: posDocInvoice, pickslip: posDocPickSlip, packing: posDocPacking, label: posDocLabel, gift: posDocGift };
  var fn = fns[kind];
  if (!fn) return alert('Unknown document: ' + kind);
  if ((kind === 'packing' || kind === 'label') && data.sale.fulfilment === 'pickup') {
    return alert('That document does not apply to a counter pickup — there is nothing to pack or ship.');
  }
  fn(data);
}

  '.shop{font-size:11px;line-height:1.5;text-align:right}' +
  '.shop b{font-size:14px;color:#0b1b2b}' +
  '.meta{display:flex;gap:26px;margin-bottom:14px;flex-wrap:wrap}' +

// Logo markup shared by every A4 document (Invoice/Pick Slip/Packing Slip,
// all via this header) plus the two thermal formats below -- one place to
// gate on the "Print logo on invoice" setting so a business without a logo
// uploaded, or with it turned off, never gets a broken <img>.
function posLogoImg(shop, maxHeight){
  if (!shop || !shop.print_logo || !shop.logo_url) return '';
  return '<img src="' + esc(shop.logo_url) + '" style="max-height:' + maxHeight + 'px;max-width:100%;object-fit:contain" alt=""/>';
}
function posDocHeader(title, shop){
  var logo = posLogoImg(shop, 52);
  return '<div class="hd">' +
    (logo ? '<div style="margin-right:14px">' + logo + '</div>' : '') +
    '<div style="flex:1"><h1>' + title + '</h1></div>' +
    '<div class="shop"><b>' + esc(shop.name) + '</b><br/>' + esc(shop.address) + '<br/>' +
    esc(shop.country || '') + '<br/>Tel ' + esc(shop.phone) +
    (shop.email ? '<br/>' + esc(shop.email) : '') +
    (shop.website ? '<br/>' + esc(shop.website) : '') + '</div></div>';
}

// ---- INVOICE ---------------------------------------------------------------
function posDocInvoice(d){
  var s = d.sale, shop = d.shop;
  var paidStamp = d.is_quote
    ? '<span class="stamp" style="color:#1e40af;border-color:#1e40af">QUOTATION — NOT A TAX INVOICE</span>'
    : s.voided
      ? '<span class="stamp" style="color:#b91c1c;border-color:#b91c1c">VOIDED</span>'
      : s.balance_due_cents > 0
        ? '<span class="stamp" style="color:#b45309;border-color:#b45309">BALANCE DUE</span>'
        : '<span class="stamp" style="color:#15803d;border-color:#15803d">PAID IN FULL</span>';

  var rows = d.items.map(function(it){
    return '<tr>' +
      '<td class="c">' + it.qty + '</td>' +
      '<td><b>' + esc(it.description) + '</b>' +
        (it.product_img ? '<br/><span style="font-size:9.5px;color:#6b7280;font-family:ui-monospace,monospace">' + esc(it.sku || it.product_img) + '</span>' : '') +
        (it.discount_note ? '<br/><span style="font-size:9.5px;color:#b45309">↳ ' + esc(it.discount_note) + '</span>' : '') +
        (it.warranty_until ? '<br/><span style="font-size:9.5px;color:#0e7490">Warranty to ' + esc(it.warranty_until) + '</span>' : '') +
        (it.serial_number ? '<br/><span style="font-size:9.5px;color:#6b7280">S/N ' + esc(it.serial_number) + '</span>' : '') +
      '</td>' +
      '<td class="r">' + posCents(it.unit_price_cents) + '</td>' +
      '<td class="r">' + (it.discount_cents > 0 ? '−' + posCents(it.discount_cents) : '—') + '</td>' +
      '<td class="r"><b>' + posCents(it.total_cents) + '</b></td>' +
    '</tr>';
  }).join('');

  // Discount on the sale row is the ticket discount plus loyalty; loyalty is
  // broken out so the customer can see what their points were worth.
  var ticketDisc = (s.discount_cents || 0) - (s.loyalty_discount_cents || 0);

  posPrintWindow((d.is_quote ? 'Quote ' : 'Invoice ') + (s.invoice_number || s.receipt_number), POS_A4_CSS,
    '<div class="doc">' +
      posDocHeader(d.is_quote ? 'QUOTATION' : 'INVOICE', shop) +
      '<div class="meta">' +
        '<div class="box"><div class="lbl">Bill to</div>' +
          '<b>' + esc(s.customer_name || 'Cash sale / walk-in') + '</b>' +
          (s.customer_phone ? '<br/>' + esc(s.customer_phone) : '') +
          (s.vehicle_info ? '<br/><span style="color:#6b7280">Vehicle: ' + esc(s.vehicle_info) + '</span>' : '') +
        '</div>' +
        (s.fulfilment !== 'pickup'
          ? '<div class="box"><div class="lbl">Ship to</div>' + posShipToBlock(s) + '</div>'
          : '<div class="box"><div class="lbl">Collection</div>Counter pickup<br/><span style="color:#6b7280">' + esc(shop.address) + '</span></div>') +
        '<div class="box" style="text-align:right">' +
          '<div class="lbl">' + (d.is_quote ? 'Quote no.' : 'Invoice no.') + '</div><b style="font-size:14px">' + esc(s.invoice_number || s.receipt_number || '—') + '</b>' +
          (d.is_quote ? '' : '<div class="lbl" style="margin-top:6px">Receipt</div>' + esc(s.receipt_number || '')) +
          '<div class="lbl" style="margin-top:6px">Date</div>' + posWhen(s.created_at) +
          (s.po_number ? '<div class="lbl" style="margin-top:6px">Your PO</div>' + esc(s.po_number) : '') +
          (d.is_quote && s.valid_until ? '<div class="lbl" style="margin-top:6px">Valid until</div><b>' + esc(s.valid_until) + '</b>' : '') +
          (!d.is_quote && s.due_date ? '<div class="lbl" style="margin-top:6px">Payment due</div><b>' + esc(s.due_date) + '</b>' : '') +
        '</div>' +
      '</div>' +
      '<div style="margin-bottom:10px">' + paidStamp +
        (s.sales_rep_name ? '<span style="margin-left:14px;font-size:10.5px;color:#6b7280">Served by <b style="color:#111">' + esc(s.sales_rep_name) + '</b></span>' : '') +
        (s.cashier_user_name ? '<span style="margin-left:10px;font-size:10.5px;color:#6b7280">· Rung by ' + esc(s.cashier_user_name) + '</span>' : '') +
      '</div>' +
      '<table><thead><tr><th class="c" style="width:44px">Qty</th><th>Part / description</th>' +
        '<th class="r" style="width:80px">Unit</th><th class="r" style="width:74px">Disc.</th><th class="r" style="width:88px">Amount</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>' +
      '<div class="tot">' +
        '<div><span>Subtotal</span><span>' + posCents(s.subtotal_cents) + '</span></div>' +
        (ticketDisc > 0 ? '<div style="color:#b91c1c"><span>Ticket discount</span><span>−' + posCents(ticketDisc) + '</span></div>' : '') +
        (s.loyalty_discount_cents > 0 ? '<div style="color:#b45309"><span>Loyalty (' + s.loyalty_points_redeemed + ' pts)</span><span>−' + posCents(s.loyalty_discount_cents) + '</span></div>' : '') +
        (s.ship_fee_cents > 0 ? '<div><span>' + esc(s.ship_method || 'Shipping') + '</span><span>' + posCents(s.ship_fee_cents) + '</span></div>' : '') +
        '<div style="color:#6b7280"><span>' + (s.tax_exempt ? esc(d.tax_label || 'GCT') + ' (exempt)' : esc(d.tax_label || 'GCT (15%)')) + '</span><span>' + posCents(s.tax_cents) + '</span></div>' +
        '<div class="grand"><span>TOTAL</span><span>' + posCents(s.total_cents) + '</span></div>' +
        (d.payments || []).map(function(p){
          return '<div style="font-size:10.5px;color:#6b7280"><span>' + esc(posMethodLabel(p.method)) + (p.reference ? ' · ' + esc(p.reference) : '') + '</span><span>' + posCents(p.amount_cents) + '</span></div>';
        }).join('') +
        (s.balance_due_cents > 0
          ? '<div style="color:#b91c1c;font-weight:800;border-top:1px dashed #d1d5db;margin-top:5px;padding-top:5px"><span>BALANCE DUE</span><span>' + posCents(s.balance_due_cents) + '</span></div>'
          : '') +
      '</div>' +
      (s.notes ? '<div style="margin-top:16px;font-size:10.5px"><b>Notes:</b> ' + esc(s.notes) + '</div>' : '') +
      '<div class="foot">' +
        (d.is_quote
          ? 'This is a quotation, not a tax invoice. Prices hold until ' + esc(s.valid_until || 'the date above') +
            ' and are subject to stock being available at the time of order.'
          : (s.balance_due_cents > 0 ? '<b>Payment due ' + esc(s.due_date || 'on receipt') + '.</b> ' : '') +
            esc(shop.invoice_notice || ('Goods remain the property of ' + shop.name + ' until paid in full. Returns accepted within 14 days with this invoice, in original condition. Electrical parts are non-returnable.'))
        ) +
        '<br/>Thank you for your business — ' + esc(shop.phone) +
      '</div>' +
    '</div>'
  );
}

// ---- CREDIT NOTE / REFUND RECEIPT ----------------------------------------
// Printed after a return or a void, so a refund leaves the counter with its
// own document instead of only a reprinted invoice/receipt. `sale` is the
// pos_sales row (dollar fields). `ret` is either a real pos_sale_returns row
// -- with .items attached by GET /api/admin/pos/sales/:id -- or a synthetic
// { void:true, ... } built from the whole sale for a full void.
function posCreditNote(sale, ret, shop){
  shop = shop || POS_SHOP;
  ret = ret || {};
  var isVoid   = !!ret.void;
  var method   = ret.refund_method || sale.payment_method || 'cash';
  var isCredit = method === 'store_credit';
  var heading  = isVoid ? 'CREDIT NOTE — SALE VOIDED'
    : isCredit           ? 'CREDIT NOTE'
    : method === 'cash'  ? 'CASH REFUND'
    : 'REFUND — ' + String(posMethodLabel(method)).toUpperCase();
  var docNo = ret.return_number || ('VOID-' + (sale.receipt_number || sale.id));
  var pick  = function(a, b){ return Number(a != null ? a : b) || 0; };
  var sub   = pick(ret.refund_subtotal_usd, sale.subtotal_usd);
  var disc  = pick(ret.refund_discount_usd, sale.discount_usd);
  var tax   = pick(ret.refund_tax_usd,      sale.tax_usd);
  var total = pick(ret.refund_total_usd,    sale.total_usd);
  var lines = Array.isArray(ret.items) ? ret.items : [];
  var rows  = lines.map(function(it){
    var qty = Number(it.qty) || 0;
    var amt = it.refund_usd != null ? Number(it.refund_usd) : (Number(it.unit_price_usd) || 0) * qty;
    var unit = it.unit_price_usd != null ? Number(it.unit_price_usd) : (qty ? amt / qty : amt);
    return '<tr>' +
      '<td class="c">' + qty + '</td>' +
      '<td><b>' + esc(it.description || '') + '</b>' +
        (it.sku || it.product_img ? '<br/><span style="font-size:9.5px;color:#6b7280;font-family:ui-monospace,monospace">' + esc(it.sku || it.product_img) + '</span>' : '') +
      '</td>' +
      '<td class="r">' + fmtMoney(unit) + '</td>' +
      '<td class="r"><b>' + fmtMoney(amt) + '</b></td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="4" style="color:#6b7280">Whole sale — every line reversed.</td></tr>';

  posPrintWindow('Credit note ' + docNo, POS_A4_CSS,
    '<div class="doc">' +
      posDocHeader('CREDIT NOTE', shop) +
      '<div style="margin-bottom:12px"><span class="stamp" style="color:#b45309;border-color:#b45309">' + esc(heading) + '</span>' +
        (ret.processed_by_name ? '<span style="margin-left:14px;font-size:10.5px;color:#6b7280">Processed by <b style="color:#111">' + esc(ret.processed_by_name) + '</b></span>' : '') +
      '</div>' +
      '<div class="meta">' +
        '<div class="box"><div class="lbl">Credit to</div><b>' + esc(sale.customer_name || 'Cash sale / walk-in') + '</b>' +
          (sale.customer_phone ? '<br/>' + esc(sale.customer_phone) : '') +
          (sale.vehicle_info ? '<br/><span style="color:#6b7280">Vehicle: ' + esc(sale.vehicle_info) + '</span>' : '') + '</div>' +
        '<div class="box"><div class="lbl">Against</div>Invoice <b>' + esc(sale.invoice_number || sale.receipt_number || '—') + '</b>' +
          '<br/><span style="color:#6b7280">Receipt ' + esc(sale.receipt_number || '') + '<br/>' + posWhen(sale.created_at) + '</span></div>' +
        '<div class="box" style="text-align:right"><div class="lbl">Credit note no.</div><b style="font-size:14px">' + esc(docNo) + '</b>' +
          '<div class="lbl" style="margin-top:6px">Date</div>' + posWhen(ret.created_at || sale.voided_at) + '</div>' +
      '</div>' +
      '<table><thead><tr><th class="c" style="width:44px">Qty</th><th>Part / description</th>' +
        '<th class="r" style="width:88px">Unit</th><th class="r" style="width:96px">Refund</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>' +
      '<div class="tot">' +
        '<div><span>Goods returned</span><span>' + fmtMoney(sub) + '</span></div>' +
        (disc > 0 ? '<div style="color:#b91c1c"><span>Less discount recovered</span><span>−' + fmtMoney(disc) + '</span></div>' : '') +
        '<div style="color:#6b7280"><span>' + (sale.tax_exempt ? 'GCT (exempt)' : 'GCT') + '</span><span>' + fmtMoney(tax) + '</span></div>' +
        '<div class="grand"><span>TOTAL REFUNDED</span><span>' + fmtMoney(total) + '</span></div>' +
        '<div style="font-size:10.5px;color:#6b7280"><span>Method</span><span>' + esc(isCredit ? 'Store credit' : posMethodLabel(method)) + '</span></div>' +
      '</div>' +
      (isCredit && ret.store_credit_code
        ? '<div style="margin-top:16px;border:2px dashed #15803d;border-radius:6px;padding:10px 14px;max-width:340px">' +
            '<div class="lbl" style="color:#15803d">Store credit — gift card</div>' +
            '<b style="font-size:20px;letter-spacing:2px;font-family:ui-monospace,monospace">' + esc(ret.store_credit_code) + '</b>' +
            '<div style="font-size:9.5px;color:#6b7280;margin-top:3px">Worth ' + fmtMoney(total) + '. Present this code on a future purchase — it does not expire.</div>' +
          '</div>'
        : '') +
      ((ret.reason || ret.notes) ? '<div style="margin-top:16px;font-size:10.5px"><b>Reason:</b> ' + esc(ret.reason || ret.notes) + '</div>' : '') +
      '<div class="foot">' +
        (isVoid
          ? 'This sale has been voided in full and the goods returned to stock. The original receipt is no longer valid.'
          : 'This credit note confirms the return of the goods listed above and the refund shown. Please keep it with your records.') +
        '<br/>' + esc(shop.name) + ' — ' + esc(shop.phone) +
      '</div>' +
    '</div>'
  );
}

    '<div class="sep"></div>' +
    d.items.map(function(it){
      return '<div style="margin-bottom:3px">' + esc(it.description) +

    (s.ship_fee_cents > 0 ? '<div class="row"><span>Shipping</span><span>' + posCents(s.ship_fee_cents) + '</span></div>' : '') +
    '<div class="row"><span>' + (s.tax_exempt ? 'GCT (exempt)' : 'GCT 15%') + '</span><span>' + posCents(s.tax_cents) + '</span></div>' +
    '<div class="row big"><span>TOTAL</span><span>' + posCents(s.total_cents) + '</span></div>' +
    '<div class="sep"></div>' +
    (d.payments || []).map(function(p){
      return '<div class="row"><span>' + esc(posMethodLabel(p.method).toUpperCase()) + (p.reference ? ' ' + esc(p.reference) : '') + '</span><span>' + posCents(p.amount_cents) + '</span></div>' +
        (p.method === 'cash' && p.amount_tendered_cents != null ? '<div class="row mut"><span>  Tendered</span><span>' + posCents(p.amount_tendered_cents) + '</span></div>' : '');

    (s.change_due_cents > 0 ? '<div class="row big"><span>CHANGE</span><span>' + posCents(s.change_due_cents) + '</span></div>' : '') +
