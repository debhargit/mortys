          '<br/><span style="color:#6b7280">' + posWhen(s.created_at) + '</span></div>' +

// Styled stand-ins for window.alert / window.confirm, so POS actions never
// fire a raw browser dialog. posToast auto-dismisses; posConfirm resolves a
// promise (Enter = OK, Esc / backdrop = cancel).
function posToast(msg, isError){
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(8px);z-index:9800;' +
    'background:' + (isError ? '#7f1d1d' : 'var(--navy)') + ';color:#fff;padding:11px 18px;border-radius:9px;' +
    'font-size:13px;font-weight:700;box-shadow:0 12px 34px rgba(0,0,0,.35);max-width:min(440px,90vw);' +
    'opacity:0;transition:opacity .16s ease,transform .16s ease';
  t.textContent = (isError ? '⚠ ' : '') + String(msg);
  document.body.appendChild(t);
  requestAnimationFrame(function(){ t.style.opacity = '1'; t.style.transform = 'translateX(-50%) translateY(0)'; });
  setTimeout(function(){
    t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(8px)';
    setTimeout(function(){ t.remove(); }, 220);
  }, isError ? 4200 : 2600);
}
function posConfirm(msg, opts){
  opts = opts || {};
  return new Promise(function(resolve){
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;background:rgba(11,27,43,.6);display:flex;align-items:center;justify-content:center;z-index:9700;padding:20px';
    wrap.innerHTML = '<div style="background:var(--card);border-radius:12px;max-width:420px;width:100%;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.4)">' +
        (opts.title ? '<h3 style="margin:0 0 10px;font-size:16px;color:var(--heading)">' + esc(opts.title) + '</h3>' : '') +
        '<div style="font-size:13.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap">' + esc(String(msg)) + '</div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">' +
          '<button type="button" class="btn ghost" data-v="0" style="font-size:12.5px;padding:7px 14px">' + esc(opts.cancel || 'Cancel') + '</button>' +
          '<button type="button" class="btn" data-v="1" style="font-size:12.5px;padding:7px 14px' + (opts.danger ? ';background:var(--red)' : '') + '">' + esc(opts.ok || 'OK') + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    function done(v){ wrap.remove(); document.removeEventListener('keydown', onKey); resolve(v); }
    function onKey(e){ if (e.key === 'Escape') done(false); else if (e.key === 'Enter') done(true); }
    wrap.addEventListener('click', function(e){ if (e.target === wrap) done(false); });
    wrap.querySelectorAll('button[data-v]').forEach(function(b){ b.addEventListener('click', function(){ done(b.dataset.v === '1'); }); });
    document.addEventListener('keydown', onKey);
    var okb = wrap.querySelector('button[data-v="1"]'); if (okb) okb.focus();
  });
}

// Open/close a cash-drawer shift right from the POS terminal, without
// leaving for the Cash Report tab. Same endpoints and math Cash Report's
// own "open/close till" already uses (opening_float, closing_amount vs.
// expected_cash = opening_float + cash sales since opened_at, variance) --
// one shift per register regardless of which screen opened or closed it.
async function posShiftModal(session, after){
  var mechs = [];
  try { mechs = (await api('/api/admin/mechanics?active=true')).mechanics || []; } catch (_) {}
  var mechOptions = '<option value="">— (not tracked)</option>' +
    mechs.map(function(m){ return '<option value="' + m.id + '">' + esc(m.name) + '</option>'; }).join('');

  if (session) {
    posModal('🗄 Close shift',
      '<div style="font-size:13px;margin-bottom:12px">' +
        '<b>Session #' + session.id + '</b> open since ' + fmtDate(session.opened_at) +
        (session.opener_name ? ' by <b>' + esc(session.opener_name) + '</b>' : '') +
        '<br/>Opening float: <b>' + fmtMoney(session.opening_float) + '</b>' +
        (session.notes ? '<br/><small style="color:var(--muted)">' + esc(session.notes) + '</small>' : '') +
      '</div>' +
      '<div style="display:grid;gap:10px">' +
        '<div><label class="lbl">Closing cash count *</label><input id="psClosing" type="number" step="0.01" min="0" class="fld" placeholder="0.00"/></div>' +
        '<div><label class="lbl">Closed by</label><select id="psClosedBy" class="fld">' + mechOptions + '</select></div>' +
        '<div><label class="lbl">Notes</label><input id="psCloseNotes" class="fld" placeholder="optional"/></div>' +
      '</div>' +
      '<button type="button" class="btn" id="psCloseBtn" style="margin-top:14px;background:var(--red)">Close till</button>' +
      '<div id="psCloseResult" style="margin-top:10px"></div>',
      460
    );
    document.getElementById('psCloseBtn').addEventListener('click', async function(){
      var btn = this;
      var res = document.getElementById('psCloseResult');
      var closing = document.getElementById('psClosing').value;
      if (closing === '') { res.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">Enter a closing cash count.</div>'; return; }
      btn.disabled = true;
      try {
        var r = await api('/api/admin/cash-drawer/' + session.id + '/close', { method: 'POST', body: {
          closing_amount: Number(closing),
          closed_by: document.getElementById('psClosedBy').value || null,
          notes: document.getElementById('psCloseNotes').value || null,
        }});
        var v = r.variance;
        var vColor = v === 0 ? 'var(--ok)' : (v < 0 ? '#b91c1c' : '#92400e');
        res.innerHTML = '<div style="padding:10px 12px;background:var(--card-soft);border:1px solid var(--line);border-radius:8px;font-size:13px">' +
          'Expected: <b>' + fmtMoney(r.expected_cash) + '</b> · Counted: <b>' + fmtMoney(r.closing_amount) + '</b> · ' +
          'Variance: <b style="color:' + vColor + '">' + (v > 0 ? '+' : '') + fmtMoney(v) + '</b>' +
        '</div>';
        setTimeout(function(){ posCloseModal(); if (after) after(); }, 1600);
      } catch (e) {
        res.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">' + esc(e.message) + '</div>';
        btn.disabled = false;
      }
    });
  } else {
    posModal('🗄 Open shift',
      '<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">No cash drawer shift is currently open for this register.</div>' +
      '<div style="display:grid;gap:10px">' +
        '<div><label class="lbl">Opening float *</label><input id="psFloat" type="number" step="0.01" min="0" class="fld" value="0.00"/></div>' +
        '<div><label class="lbl">Opened by</label><select id="psOpenedBy" class="fld">' + mechOptions + '</select></div>' +
        '<div><label class="lbl">Notes</label><input id="psOpenNotes" class="fld" placeholder="optional"/></div>' +
      '</div>' +
      '<button type="button" class="btn ok" id="psOpenBtn" style="margin-top:14px">Open till</button>' +
      '<div id="psOpenResult" style="margin-top:10px"></div>',
      460
    );
    document.getElementById('psOpenBtn').addEventListener('click', async function(){
      var btn = this;
      var res = document.getElementById('psOpenResult');
      btn.disabled = true;
      try {
        await api('/api/admin/cash-drawer/open', { method: 'POST', body: {
          opening_float: Number(document.getElementById('psFloat').value || 0),
          opened_by: document.getElementById('psOpenedBy').value || null,
          notes: document.getElementById('psOpenNotes').value || null,
        }});
        posCloseModal();
        if (after) after();
      } catch (e) {
        res.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">' + esc(e.message) + '</div>';
        btn.disabled = false;
      }
    });
  }
}

//  POS SALES — the day's tickets: reprint any document, take a payment against
//  a charge sale, process a return, or void. This is where a counter spends its
//  time after the sale, and none of it was reachable before.
// =============================================================================
// NOTE (2026-08-18 audit fix): this tab used to call a GET /api/admin/pos/summary
// endpoint that never existed, and read fields (payment_status, balance_due_cents,
// fulfilment, invoice_number, sales_rep_name, *_cents amounts) that don't exist

// to use only the real GET /api/admin/pos/sales(+/:id) + POST .../void endpoints,
// with a summary computed client-side from the sales already fetched.
async function renderPOSSales(panel){
  var today = new Date().toISOString().slice(0, 10);
  var from = POS_SALES_FROM || today;
  var to = POS_SALES_TO || today;

  panel.innerHTML =

      '<th>Receipt</th><th>When</th><th>Customer</th><th>Cashier</th><th>Total</th><th>Method</th><th>Status</th><th></th>' +

    list.querySelectorAll('[data-sale]').forEach(function(b){

// Adapts a real pos_sales row (dollars) into the {sale,items,payments,shop}
// shape the counter-document renderers below (posDocReceipt/Invoice/PickSlip/
// Gift) expect (cents, plus the fulfilment / ship_* / balance-due fields).
// Keeps that print/barcode machinery working against real data instead of
// rewriting six document templates. Since migration 0010 was ported the
// fulfilment, ship_fee, balance_due, invoice_number, sales_rep_name and
// per-line discount fields are all real on the row -- passed straight through,
// so posPrintDoc's pickup guard now enables Packing/Label for a delivery or
// shipment.
function posSaleToDocData(d, shop){
  var s = d.sale;
  var mappedSale = Object.assign({}, s, {
    subtotal_cents: Math.round(Number(s.subtotal_usd || 0) * 100),
    discount_cents: Math.round(Number(s.discount_usd || 0) * 100),
    loyalty_discount_cents: Math.round(Number(s.loyalty_discount_usd || 0) * 100),
    tax_cents: Math.round(Number(s.tax_usd || 0) * 100),
    total_cents: Math.round(Number(s.total_usd || 0) * 100),
    change_due_cents: Math.round(Number(s.change_due || 0) * 100),
    balance_due_cents: Math.round(Number(s.balance_due_usd || 0) * 100),
    ship_fee_cents: Math.round(Number(s.ship_fee_usd || 0) * 100),
    fulfilment: s.fulfilment || 'pickup',
    sales_rep_name: s.sales_rep_name || null,
    cashier_user_name: s.cashier_name || null,
    invoice_number: s.invoice_number || null,
  });
  var mappedItems = d.items.map(function(it){
    return Object.assign({}, it, {
      unit_price_cents: Math.round(Number(it.unit_price_usd || 0) * 100),
      total_cents: Math.round(Number(it.total_usd || 0) * 100),
      discount_cents: Math.round(Number(it.discount_usd || 0) * 100),
    });
  });
  var mappedPayments = (d.payments || []).map(function(p){
    return Object.assign({}, p, {
      amount_cents: Math.round(Number(p.amount_usd || 0) * 100),
      amount_tendered_cents: p.amount_tendered != null ? Math.round(Number(p.amount_tendered) * 100) : null,
    });
  });
  return { sale: mappedSale, items: mappedItems, payments: mappedPayments, shop: shop };
}
// Adapts a saved quote (pos_quotes row) into the same {sale,items,payments,
// shop} shape posSaleToDocData produces for a real sale, so a quote can
// print through the exact same posDocReceipt/posDocInvoice instead of a
// third copy of each template. is_quote:true is what those two branch on
// to show "QUOTATION" framing (stamp, footer, valid-until) instead of
// payment/void framing -- a quote has never taken money, so payments is
// always [].
function posQuoteToDocData(q, shop){
  var items = posItemsArray(q.items_json);
  var mappedSale = {
    receipt_number: q.quote_number, invoice_number: null,
    customer_name: q.customer_name, customer_phone: q.customer_phone, customer_email: q.customer_email,
    vehicle_info: q.vehicle_info, sales_rep_name: q.sales_rep_name || null, cashier_user_name: null,
    created_at: q.created_at, valid_until: q.valid_until,
    subtotal_cents: Math.round(Number(q.subtotal_usd || 0) * 100),
    discount_cents: Math.round(Number(q.discount_usd || 0) * 100),
    loyalty_discount_cents: 0,
    tax_cents: Math.round(Number(q.tax_usd || 0) * 100),
    total_cents: Math.round(Number(q.total_usd || 0) * 100),
    change_due_cents: 0, balance_due_cents: 0, ship_fee_cents: 0,
    fulfilment: 'pickup', voided: false, tax_exempt: false, notes: q.notes,
  };
  var mappedItems = items.map(function(it){
    // Stored lines are exactly what posCartPayload() sends: unit_price_usd
    // (dollars) and qty -- NOT the _cents field names. Reading unit_price_cents
    // off them was always undefined, which printed every priced quote at $0.
    var qty = Number(it.qty); if (!(qty > 0)) qty = 1;
    var cents = Number(it.unit_price_cents);
    if (!(cents > 0)) cents = Math.round((Number(it.unit_price_usd) || 0) * 100);
    return {
      description: it.description || it.product_img || '', product_img: it.product_img || null,
      sku: it.sku || null, qty: qty, unit_price_cents: cents, discount_cents: 0,
      total_cents: it.total_cents != null ? it.total_cents : cents * qty,
    };
  });
  return { sale: mappedSale, items: mappedItems, payments: [], shop: shop, is_quote: true };
}

// ---- NOTE (2026-08-18, "do all improvements" pass) -------------------------
// posSettleModal (partial-payment/balance-due settlement) was removed in an
// earlier pass because POST .../payment doesn't exist anywhere in server.js
// -- still true, still not built (POS sales here are always paid in full at
// the register; "balance due" would need a whole invoice-terms model this

// for the same reason, is now real: POST /api/admin/pos/sales/:id/return
// exists (itemized per-line refund with prorated discount/tax, restock,
// optional store-credit gift card, proportional loyalty rollback) -- see
// ADMIN-POS-AUDIT.md.
// =============================================================================
//  POS RETURNS -- pick lines + quantities off a prior sale and refund them.
// =============================================================================
function posReturnModal(d, after){
  var s = d.sale;
  var returnable = d.items.filter(function(it){ return (it.qty - (it.returned_qty || 0)) > 0; });

  // A warranty claim past the normal return window is prorated by how much
  // of the warranty period is left (days remaining / total warranty days),
  // rather than refused outright or refunded in full regardless of age.
  function warrantyPct(it){
    if (!it.warranty_until) return null;
    var totalDays = Math.round((new Date(it.warranty_until) - new Date(s.created_at)) / 86400000);
    var daysLeft = Math.round((new Date(it.warranty_until) - new Date()) / 86400000);
    if (daysLeft <= 0) return 0;
    return totalDays > 0 ? Math.max(0, Math.min(100, Math.round((daysLeft / totalDays) * 100))) : 100;
  }

  posModal('Return items — ' + esc(s.receipt_number || ''),
    '<table style="width:100%;font-size:12.5px"><thead><tr>' +
      '<th align="left">Part</th><th>Sold</th><th>Returned</th><th>Return qty</th><th align="right">Unit</th>' +
    '</tr></thead><tbody>' +
      returnable.map(function(it){
        var remaining = it.qty - (it.returned_qty || 0);
        var pct = warrantyPct(it);
        var warrantyHtml = '';
        if (pct === 0) {
          warrantyHtml = '<br/><small style="color:#b91c1c">Warranty expired ' + esc(it.warranty_until) + '</small>';
        } else if (pct != null) {
          warrantyHtml = '<br/><label style="font-size:10.5px;color:#0e7490;display:inline-flex;align-items:center;gap:4px;margin-top:3px;cursor:pointer">' +
            '<input type="checkbox" class="rtWarranty" data-wid="' + it.id + '" data-pct="' + pct + '"/> Warranty claim — prorate to ' + pct + '% (covered to ' + esc(it.warranty_until) + ')' +
          '</label>';
        }
        return '<tr><td>' + esc(it.description) + (it.serial_number ? '<br/><code style="font-size:10.5px;color:var(--muted)">S/N ' + esc(it.serial_number) + '</code>' : '') + warrantyHtml + '</td>' +
          '<td style="text-align:center">' + it.qty + '</td>' +
          '<td style="text-align:center">' + (it.returned_qty || 0) + '</td>' +
          '<td style="text-align:center"><input type="number" min="0" max="' + remaining + '" value="0" class="fld-mini" data-retqty="' + it.id + '" style="width:56px"/></td>' +
          '<td style="text-align:right">' + fmtMoney(it.unit_price_usd) + '</td>' +
        '</tr>';
      }).join('') +
    '</tbody></table>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">' +
      '<div><label class="lbl">Refund method</label><select id="rtMethod" class="fld">' +
        '<option value="cash">Cash</option><option value="card">Card</option><option value="cheque">Cheque</option>' +
        '<option value="bank">Bank transfer</option><option value="store_credit">Store credit (issues a gift card)</option>' +
      '</select></div>' +
      '<div><label class="lbl">Reason</label><input id="rtReason" class="fld" placeholder="e.g. wrong part, defective"/></div>' +
      '<div style="grid-column:1/-1"><label class="lbl">Notes</label><input id="rtNotes" class="fld"/></div>' +
    '</div>' +
    '<div id="rtEstimate" style="margin-top:10px;font-size:12.5px;color:var(--muted)"></div>' +
    '<div id="rtMsg" style="display:none;margin-top:10px;padding:9px 12px;border-radius:6px;font-size:12.5px"></div>' +
    '<div style="display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">' +
      '<button type="button" class="btn ok" id="rtGo">Process return</button>' +
    '</div>',
    640
  );

  function lineProratePct(sid){
    var ck = document.querySelector('.rtWarranty[data-wid="' + sid + '"]');
    return (ck && ck.checked) ? Number(ck.getAttribute('data-pct')) : 100;
  }
  function estimate(){
    var subtotal = Number(s.subtotal_usd) || 0;
    var proportion0 = 0, refundSubtotal = 0;
    document.querySelectorAll('#mhPosModal [data-retqty]').forEach(function(inp){
      var qty = parseInt(inp.value, 10) || 0;
      if (qty <= 0) return;
      var sid = inp.getAttribute('data-retqty');
      var it = returnable.find(function(x){ return String(x.id) === sid; });
      if (!it) return;
      var perUnit = Number(it.unit_price_usd) + (Number(it.core_charge_usd || 0) + Number(it.env_fee_usd || 0)) / it.qty;
      refundSubtotal += perUnit * qty * (lineProratePct(sid) / 100);
    });
    proportion0 = subtotal > 0 ? Math.min(1, refundSubtotal / subtotal) : 0;
    var refundTotal = refundSubtotal - (Number(s.discount_usd) * proportion0) + (Number(s.tax_usd) * proportion0);
    document.getElementById('rtEstimate').textContent = refundSubtotal > 0
      ? 'Estimated refund: ' + fmtMoney(refundTotal) + ' (server computes the final figure)'
      : 'Enter a quantity above to estimate the refund.';
  }
  document.querySelectorAll('#mhPosModal [data-retqty]').forEach(function(inp){ inp.addEventListener('input', estimate); });
  document.querySelectorAll('#mhPosModal .rtWarranty').forEach(function(ck){ ck.addEventListener('change', estimate); });

  document.getElementById('rtGo').addEventListener('click', async function(){
    var go = this;
    var items = [], enteredLines = [];
    document.querySelectorAll('#mhPosModal [data-retqty]').forEach(function(inp){
      var qty = parseInt(inp.value, 10) || 0;
      if (qty <= 0) return;
      var sid = parseInt(inp.getAttribute('data-retqty'), 10);
      var ck = document.querySelector('.rtWarranty[data-wid="' + sid + '"]');
      var pct = ck ? Number(ck.getAttribute('data-pct')) : 100;
      var claim = !!(ck && ck.checked);
      items.push({ sale_item_id: sid, qty: qty, prorate_pct: claim ? pct : 100, warranty_claim: claim });
      var src = (d.items || []).find(function(x){ return x.id === sid; }) || {};
      var srcPerUnit = Number(src.unit_price_usd) + (Number(src.core_charge_usd || 0) + Number(src.env_fee_usd || 0)) / (Number(src.qty) || 1);
      enteredLines.push({ description: src.description, product_img: src.product_img, sku: src.sku,
        qty: qty, unit_price_usd: src.unit_price_usd,
        refund_usd: Math.round(srcPerUnit * qty * (claim ? pct / 100 : 1) * 100) / 100 });
    });
    var msg = document.getElementById('rtMsg');
    if (!items.length) { msg.style.display = 'block'; msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = 'Enter a return quantity for at least one item.'; return; }
    var methodVal = document.getElementById('rtMethod').value;
    var reasonVal = document.getElementById('rtReason').value.trim() || null;
    var notesVal  = document.getElementById('rtNotes').value.trim() || null;
    msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Processing…';
    go.disabled = true;
    try {
      var r = await api('/api/admin/pos/sales/' + s.id + '/return', { method: 'POST', body: {
        items: items, refund_method: methodVal, reason: reasonVal, notes: notesVal,
      }});
      go.style.display = 'none';
      msg.style.background = '#dcfce7'; msg.style.color = '#166534';
      msg.innerHTML = '✓ <b>' + esc(r.return_number) + '</b> processed — refund ' + fmtMoney(r.refund_total_usd) +
        (r.store_credit_code ? ' as store credit <code>' + esc(r.store_credit_code) + '</code>' : '') +
        (r.loyalty_points_clawed_back || r.loyalty_points_recredited
          ? ' (loyalty: −' + r.loyalty_points_clawed_back + ' earned, +' + r.loyalty_points_recredited + ' recredited)' : '') +
        '<div style="margin-top:10px;display:flex;gap:8px">' +
          '<button type="button" class="btn ok" id="rtPrintCN">🧾 Print ' + (methodVal === 'store_credit' ? 'credit note' : methodVal === 'cash' ? 'cash refund' : 'refund receipt') + '</button>' +
          '<button type="button" class="btn" id="rtDone">Done</button>' +
        '</div>';
      document.getElementById('rtPrintCN').addEventListener('click', function(){
        posCreditNote(s, {
          return_number: r.return_number, refund_method: methodVal,
          refund_subtotal_usd: r.refund_subtotal_usd, refund_discount_usd: r.refund_discount_usd,
          refund_tax_usd: r.refund_tax_usd, refund_total_usd: r.refund_total_usd,
          store_credit_code: r.store_credit_code, reason: reasonVal || notesVal,
          created_at: new Date().toISOString(), items: enteredLines,
        }, POS_SHOP);
      });
      document.getElementById('rtDone').addEventListener('click', function(){
        posCloseModal(); posSaleDetail(s.id, after); if (after) after();
      });
    } catch (e) {
      go.disabled = false;
      msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = 'Failed: ' + e.message;
    }
  });
}

async function submitCampaign(){
  var msg = document.getElementById('cmpMsg');
  msg.style.display = 'block';
  msg.style.background = '#dbeafe'; msg.style.color = '#1e40af';
  msg.textContent = 'Saving…';
  try {
    var body = {
      name: document.getElementById('cmpName').value.trim(),
      kind: document.getElementById('cmpKind').value,
      segment: document.getElementById('cmpSeg').value,
      subject: document.getElementById('cmpSubj').value.trim(),
      body: document.getElementById('cmpBody').value.trim(),
      scheduled_for: document.getElementById('cmpWhen').value || null
    };
    await api('/api/admin/marketing/campaigns', { method:'POST', body: body });
    show('marketing');
  } catch (e) {
    msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c';
    msg.textContent = e.message;
  }
}

async function renderDashboard(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var d;
  try { d = await api('/api/admin/dashboard'); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load dashboard: ' + esc(e.message) + '</div>'; return; }

  var sa = d.sales || {}, at = d.attention || {}, ar = d.ar || {};
  var now = new Date();
  var hr = now.getHours();
  var greet = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  var dateStr = now.toLocaleDateString('en-JM', { weekday:'long', month:'long', day:'numeric' });

  function kpi(label, value, sub, accent, reportKey){
    var tag = reportKey ? 'button type="button"' : 'div';
    return '<' + tag + ' class="dash-kpi' + (accent ? ' accent' : '') + '"' + (reportKey ? ' data-report="' + reportKey + '"' : '') + '>' +
      '<div class="dash-kpi-l">' + esc(label) + '</div>' +
      '<div class="dash-kpi-v">' + value + '</div>' +
      (sub ? '<div class="dash-kpi-s">' + sub + '</div>' : '') +
    '</' + (reportKey ? 'button' : 'div') + '>';
  }
  function alertChip(icon, n, label, tab, level){
    if (!n) return '';
    return '<button type="button" class="dash-alert' + (level ? ' ' + level : '') + '" data-go="' + tab + '">' +
      '<span class="dash-alert-n">' + n + '</span><span>' + icon + ' ' + esc(label) + '</span></button>';
  }

  // ---- 14-day combined sales bar chart ----
  var spark = d.sales_sparkline || [];
  var sMax = Math.max.apply(null, spark.map(function(x){ return x.total; }).concat([1]));
  var bars = spark.map(function(x, i){
    var h = x.total > 0 ? Math.max(4, Math.round((x.total / sMax) * 108)) : 3;
    var cls = i === spark.length - 1 ? 'today' : (x.total > 0 ? '' : 'zero');
    var lbl = new Date(x.day + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
    return '<div class="dash-bar ' + cls + '" style="height:' + h + 'px" title="' + lbl + ' — ' + fmtMoney(x.total) + '"></div>';
  }).join('');
  var xFirst = spark.length ? new Date(spark[0].day + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '';
  var xMid = spark.length ? new Date(spark[Math.floor(spark.length / 2)].day + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '';

  // ---- tender mix ----
  var mix = d.tender_mix || [];
  var mixMax = Math.max.apply(null, mix.map(function(m){ return m.total; }).concat([1]));

  var alerts =
    alertChip('🛒', at.orders_pending, 'orders to process', 'orders', 'warn') +
    alertChip('⚠', at.out_of_stock, 'out of stock', 'lowstock', 'bad') +
    alertChip('📉', at.low_stock, 'low stock', 'lowstock', 'warn') +
    alertChip('📤', at.parts_pulls_open, 'parts pulls open', 'partsreq') +
    alertChip('📝', at.quotes_open, 'open quotes', 'quotes') +
    alertChip('⏸', at.holds, 'held tickets', 'pos') +
    alertChip('💳', ar.customers_owing, 'accounts owing ' + fmtMoney(ar.total_owed || 0), 'customers', 'warn');

  panel.innerHTML =
    DASH_CSS +
    '<div class="dash">' +
      '<div class="dash-hd"><b>' + greet + '.</b> &nbsp;' + esc(dateStr) + '</div>' +

      '<div class="dash-kpis">' +
        kpi('Sales today', fmtMoney(sa.today || 0),
            (sa.today_n || 0) + ' ' + ((sa.today_n === 1) ? 'sale' : 'sales') +
            (sa.today_n ? ' · avg ' + fmtMoney(sa.avg_today || 0) : ''), true, 'sales') +
        kpi('Last 7 days', fmtMoney(sa.week || 0), (sa.week_n || 0) + ' sales', false, 'sales') +
        kpi('Last 30 days', fmtMoney(sa.month || 0), (sa.month_n || 0) + ' sales', false, 'sales') +
        kpi('Accounts receivable', fmtMoney(ar.total_owed || 0),
            (ar.customers_owing || 0) + ' ' + ((ar.customers_owing === 1) ? 'account' : 'accounts') + ' owing',
            (ar.total_owed || 0) > 0, 'customer-detail') +
      '</div>' +

      (alerts
        ? '<div class="dash-sec">Needs attention</div><div class="dash-alerts">' + alerts + '</div>'
        : '<div class="dash-ok">✓ Nothing needs attention right now.</div>') +

      '<div class="dash-grid">' +
        '<div class="dash-card">' +
          '<div class="dash-card-hd">📈 Sales — last 14 days <small>counter + online · max ' + fmtMoney(sMax) + '</small></div>' +
          '<div class="dash-bars">' + bars + '</div>' +
          '<div class="dash-xax"><span>' + esc(xFirst) + '</span><span>' + esc(xMid) + '</span><span>today</span></div>' +
        '</div>' +
        '<div class="dash-card">' +
          '<div class="dash-card-hd">💳 Payments taken <small>counter · last 7 days</small></div>' +
          (mix.length
            ? '<div class="dash-mix">' + mix.map(function(m){
                var pct = Math.round((m.total / mixMax) * 100);
                return '<div class="dash-mix-row"><span class="m">' + esc(posMethodLabel(m.method)) + '</span>' +
                  '<span class="track"><span style="width:' + pct + '%"></span></span>' +
                  '<span class="amt">' + fmtMoney(m.total) + '</span></div>';
              }).join('') + '</div>'
            : '<div class="empty" style="padding:24px">No counter payments in the last 7 days.</div>') +
        '</div>' +
      '</div>' +

      '<div class="dash-grid">' +
        '<div class="dash-card">' +
          '<div class="dash-card-hd">🏆 Top sellers <small>last 7 days</small></div>' +
          ((d.top_sellers || []).length
            ? '<table><thead><tr><th>Part</th><th>Qty</th><th style="text-align:right">Revenue</th></tr></thead><tbody>' +
                d.top_sellers.map(function(t){
                  return '<tr><td>' + esc(t.name || '—') + (t.sku ? '<br/><small style="color:var(--muted)">' + esc(t.sku) + '</small>' : '') + '</td>' +
                    '<td>' + t.qty + '</td><td style="text-align:right"><b>' + fmtMoney(t.revenue) + '</b></td></tr>';
                }).join('') + '</tbody></table>'
            : '<div class="empty" style="padding:24px">No sales in the last 7 days.</div>') +
        '</div>' +
        '<div class="dash-card">' +
          '<div class="dash-card-hd">🧾 Recent sales</div>' +
          ((d.recent || []).length
            ? d.recent.map(function(rc){
                return '<div class="dash-recent-row" data-src="' + rc.source + '" data-id="' + rc.id + '"' + (rc.voided ? ' style="opacity:.5"' : '') + '>' +
                  '<b style="min-width:110px">' + esc(rc.ref || '') + '</b>' +
                  '<span style="flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(rc.customer || '') + '</span>' +
                  '<span style="color:var(--muted);font-size:11.5px">' + fmtDate(rc.created_at) + '</span>' +
                  '<b style="min-width:78px;text-align:right">' + fmtMoney(rc.total) + '</b>' +
                '</div>';
              }).join('')
            : '<div class="empty" style="padding:24px">No sales yet.</div>') +
        '</div>' +
      '</div>' +

      (d.has_service
        ? '<div class="dash-sec">Service centre</div>' +
          '<div class="dash-grid">' +
            '<div class="dash-card">' +
              '<div class="dash-card-hd">🛠 Open work orders <small>service revenue 7d ' + fmtMoney(d.revenue.week) + ' · 30d ' + fmtMoney(d.revenue.month) + '</small></div>' +
              ((d.work_orders_by_status || []).filter(function(s){ return !['paid','cancelled'].includes(s.status); }).length
                ? '<div class="dash-chips">' + d.work_orders_by_status.filter(function(s){ return !['paid','cancelled'].includes(s.status); }).map(function(s){
                    return badge(s.status + ' · ' + s.n, s.status);
                  }).join(' ') + '</div>'
                : '<div class="empty" style="padding:20px">No open work orders.</div>') +
            '</div>' +
            '<div class="dash-card">' +
              '<div class="dash-card-hd">👷 Mechanic utilisation <small>7 days</small></div>' +
              ((d.mechanic_utilization || []).length
                ? '<table><thead><tr><th>Mechanic</th><th>Jobs</th><th>Hrs</th><th style="text-align:right">Revenue</th></tr></thead><tbody>' +
                    d.mechanic_utilization.map(function(m){
                      return '<tr><td><b>' + esc(m.name) + '</b></td><td>' + m.jobs + '</td><td>' + Number(m.hours).toFixed(1) + '</td>' +
                        '<td style="text-align:right">' + fmtMoney(m.revenue) + '</td></tr>';
                    }).join('') + '</tbody></table>'
                : '<div class="empty" style="padding:20px">No mechanic activity this week.</div>') +
            '</div>' +
          '</div>'
        : '') +
    '</div>';

  panel.querySelectorAll('.dash-alert[data-go]').forEach(function(b){
    b.addEventListener('click', function(){ show(b.getAttribute('data-go')); });
  });
  // KPI cards drill into the matching report.
  panel.querySelectorAll('.dash-kpi[data-report]').forEach(function(b){
    b.addEventListener('click', function(){ RPT_CURRENT = b.getAttribute('data-report'); show('reports'); });
  });
  panel.querySelectorAll('.dash-recent-row').forEach(function(row){
    row.addEventListener('click', function(){
      var id = row.getAttribute('data-id');
      if (row.getAttribute('data-src') === 'online') showOrderDetail(id, function(){ renderDashboard(panel); });
      else posSaleDetail(id, function(){ renderDashboard(panel); });
    });
  });
}

// ============= CASH REPORT (+ cash drawer open/close) =============
// Wires the existing cash-drawer session endpoints (open/close a till with a
// cash count + variance) and the existing cash-report endpoint (work-order
// payments grouped by method/mechanic/day). Also pulls the same-day-range POS
// sales total from the existing pos/sales endpoint for a fuller picture, since
// the register's actual cash count needs to reconcile against BOTH streams
// (service payments AND parts-counter cash sales), not just one.
var CR_METHOD_LABEL = { cash:'Cash', card:'Card', bank_transfer:'Bank Transfer', cheque:'Cheque', mobile:'Mobile' };
async function renderCashReport(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var today = new Date().toISOString().slice(0, 10);
  var session, mechs;
  try {
    session = (await api('/api/admin/cash-drawer/open')).session;
  } catch (e) {
    panel.innerHTML = '<div class="empty">Could not load cash drawer: ' + esc(e.message) + '</div>';
    return;
  }
  try { mechs = (await api('/api/admin/mechanics?active=true')).mechanics || []; }
  catch (e) { mechs = []; }

  var mechOptions = '<option value="">— (not tracked)</option>' +
    mechs.map(function(m){ return '<option value="' + m.id + '">' + esc(m.name) + '</option>'; }).join('');

  var drawerHtml = session
    ? '<div style="padding:14px 16px">' +
        '<div style="margin-bottom:10px;font-size:13px">' +
          '<b>Session #' + session.id + '</b> open since ' + fmtDate(session.opened_at) +
          (session.opener_name ? ' by <b>' + esc(session.opener_name) + '</b>' : '') +
          '<br/>Opening float: <b>' + fmtMoney(session.opening_float) + '</b>' +
          (session.notes ? '<br/><small style="color:var(--muted)">' + esc(session.notes) + '</small>' : '') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;align-items:end">' +
          '<div><label class="lbl">Closing cash count *</label><input id="crClosing" type="number" step="0.01" min="0" class="fld" placeholder="0.00"/></div>' +
          '<div><label class="lbl">Closed by</label><select id="crClosedBy" class="fld">' + mechOptions + '</select></div>' +
          '<div><label class="lbl">Notes</label><input id="crCloseNotes" class="fld" placeholder="optional"/></div>' +
        '</div>' +
        '<button class="btn" id="crCloseBtn" style="margin-top:10px;background:var(--red)">Close till</button>' +
        '<div id="crCloseResult" style="margin-top:10px"></div>' +
        '<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">' +
          '<div style="font-weight:700;font-size:12.5px;margin-bottom:6px">💵 Payouts from this session</div>' +
          '<div id="crPayouts"><div class="empty">Loading…</div></div>' +
          '<div style="display:flex;gap:8px;align-items:flex-end;margin-top:8px;flex-wrap:wrap">' +
            '<div><label class="lbl">Amount</label><input id="crPayoutAmt" type="number" step="0.01" min="0" class="fld" style="width:100px"/></div>' +
            '<div><label class="lbl">Reason</label><input id="crPayoutReason" class="fld" style="width:200px" placeholder="e.g. courier, supplies"/></div>' +
            '<div><label class="lbl">Paid to</label><input id="crPayoutTo" class="fld" style="width:140px"/></div>' +
            '<button class="btn" id="crPayoutGo">Record payout</button>' +
          '</div>' +
          '<div id="crPayoutMsg" style="margin-top:6px;font-size:12.5px"></div>' +
        '</div>' +
      '</div>'
    : '<div style="padding:14px 16px">' +
        '<div style="margin-bottom:8px;font-size:13px;color:var(--muted)">No cash drawer session is currently open.</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;align-items:end">' +
          '<div><label class="lbl">Opening float *</label><input id="crFloat" type="number" step="0.01" min="0" class="fld" value="0.00"/></div>' +
          '<div><label class="lbl">Opened by</label><select id="crOpenedBy" class="fld">' + mechOptions + '</select></div>' +
          '<div><label class="lbl">Notes</label><input id="crOpenNotes" class="fld" placeholder="optional"/></div>' +
        '</div>' +
        '<button class="btn ok" id="crOpenBtn" style="margin-top:10px">Open till</button>' +
        '<div id="crOpenResult" style="margin-top:10px"></div>' +
      '</div>';

  panel.innerHTML =
    '<div class="panel" style="margin:16px 18px 0">' +
      '<div style="padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px">🗄 Cash Drawer</div>' +
      drawerHtml +
    '</div>' +
    '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:16px 18px 0">' +
      '<label class="lbl" style="margin:0">From</label><input type="date" id="crFrom" value="' + today + '" class="fld" style="width:150px"/>' +
      '<label class="lbl" style="margin:0">To</label><input type="date" id="crTo" value="' + today + '" class="fld" style="width:150px"/>' +
      '<button class="btn" id="crGo">Run report</button>' +
    '</div>' +
    '<div id="crReport"><div class="empty">Loading report…</div></div>';

  async function loadReport(){
    var from = document.getElementById('crFrom').value;
    var to = document.getElementById('crTo').value;
    var box = document.getElementById('crReport');
    box.innerHTML = '<div class="empty">Loading…</div>';
    var rep, pos;
    try {
      rep = await api('/api/admin/cash-report?from=' + from + '&to=' + to);
    } catch (e) {
      box.innerHTML = '<div class="empty">Could not load report: ' + esc(e.message) + '</div>';
      return;
    }
    try { pos = await api('/api/admin/pos/sales?from=' + from + '&to=' + to); }
    catch (e) { pos = { sales: [] }; }
    var posTotal = (pos.sales || []).reduce(function(s, row){ return s + Number(row.total_usd || 0); }, 0);

    box.innerHTML =
      '<div style="padding:16px 18px">' +
        '<div class="tiles" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">' +
          tile('service payments — ' + from + (to !== from ? ' to ' + to : ''), fmtMoney(rep.totals.s)) +
          tile('# payments', rep.totals.n) +
          tile('POS sales (same range)', fmtMoney(posTotal) + ' (' + (pos.sales || []).length + ')') +
          tile('combined', fmtMoney(Number(rep.totals.s) + posTotal)) +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">' +
          '<div class="panel">' +
            '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">By payment method (service)</div>' +
            (rep.by_method.length
              ? '<table><thead><tr><th>Method</th><th>Count</th><th>Total</th></tr></thead><tbody>' +
                  rep.by_method.map(function(m){ return '<tr><td>' + esc(CR_METHOD_LABEL[m.method] || m.method) + '</td><td>' + m.n + '</td><td>' + fmtMoney(m.s) + '</td></tr>'; }).join('') +
                '</tbody></table>'
              : '<div class="empty">No payments in range.</div>') +
          '</div>' +
          '<div class="panel">' +
            '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">By mechanic (service)</div>' +
            (rep.by_mechanic.length
              ? '<table><thead><tr><th>Mechanic</th><th>Count</th><th>Total</th></tr></thead><tbody>' +
                  rep.by_mechanic.map(function(m){ return '<tr><td>' + esc(m.mechanic_name || '—') + '</td><td>' + m.n + '</td><td>' + fmtMoney(m.s) + '</td></tr>'; }).join('') +
                '</tbody></table>'
              : '<div class="empty">No payments in range.</div>') +
          '</div>' +
        '</div>' +
        '<div class="panel" style="margin-top:16px">' +
          '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">Recent service payments</div>' +
          (rep.recent.length
            ? '<table><thead><tr><th>When</th><th>WO #</th><th>Customer</th><th>Method</th><th>Received by</th><th>Amount</th></tr></thead><tbody>' +
                rep.recent.map(function(p){
                  return '<tr><td>' + fmtDate(p.received_at) + '</td><td>' + esc(p.wo_number || '') + '</td><td>' + esc(p.customer_name || '') + '</td>' +
                    '<td>' + esc(CR_METHOD_LABEL[p.method] || p.method) + '</td><td>' + esc(p.receiver_name || '—') + '</td><td>' + fmtMoney(p.amount_usd) + '</td></tr>';
                }).join('') + '</tbody></table>'
            : '<div class="empty">No payments in range.</div>') +
        '</div>' +
      '</div>';
  }

  document.getElementById('crGo').addEventListener('click', loadReport);

  async function loadPayouts(){
    var box = document.getElementById('crPayouts');
    if (!box || !session) return;
    var d;
    try { d = await api('/api/admin/cash-payouts?drawer_session_id=' + session.id); }
    catch (e) { box.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
    var total = d.payouts.reduce(function(s, p){ return s + Number(p.amount_usd || 0); }, 0);
    box.innerHTML = d.payouts.length
      ? '<table style="font-size:12.5px"><thead><tr><th>When</th><th>Reason</th><th>Paid to</th><th align="right">Amount</th></tr></thead><tbody>' +
          d.payouts.map(function(p){
            return '<tr><td>' + fmtDate(p.created_at) + '</td><td>' + esc(p.reason) + '</td><td>' + esc(p.paid_to || '—') + '</td>' +
              '<td align="right">' + fmtMoney(p.amount_usd) + '</td></tr>';
          }).join('') +
        '</tbody></table><div style="margin-top:4px;font-size:12.5px;color:var(--muted)">Total: <b>' + fmtMoney(total) + '</b></div>'
      : '<div class="empty">No payouts recorded from this session yet.</div>';
  }
  loadPayouts();
  var payoutGo = document.getElementById('crPayoutGo');
  if (payoutGo) payoutGo.addEventListener('click', async function(){
    var msg = document.getElementById('crPayoutMsg');
    var amt = document.getElementById('crPayoutAmt').value;
    var reason = document.getElementById('crPayoutReason').value.trim();
    if (!amt || Number(amt) <= 0) { msg.style.color = 'var(--red)'; msg.textContent = 'Enter a positive amount.'; return; }
    if (!reason) { msg.style.color = 'var(--red)'; msg.textContent = 'A reason is required.'; return; }
    msg.style.color = 'var(--muted)'; msg.textContent = 'Saving…';
    try {
      await api('/api/admin/cash-payouts', { method: 'POST', body: {
        amount_usd: amt, reason: reason, paid_to: document.getElementById('crPayoutTo').value.trim() || null,
        source_type: 'drawer', drawer_session_id: session.id,
      }});
      document.getElementById('crPayoutAmt').value = ''; document.getElementById('crPayoutReason').value = ''; document.getElementById('crPayoutTo').value = '';
      msg.style.color = '#166534'; msg.textContent = 'Recorded.';
      loadPayouts();
    } catch (e) { msg.style.color = 'var(--red)'; msg.textContent = e.message; }
  });

  var openBtn = document.getElementById('crOpenBtn');
  if (openBtn) openBtn.addEventListener('click', async function(){
    var res = document.getElementById('crOpenResult');
    openBtn.disabled = true;
    try {
      await api('/api/admin/cash-drawer/open', { method:'POST', body: {
        opening_float: Number(document.getElementById('crFloat').value || 0),
        opened_by: document.getElementById('crOpenedBy').value || null,
        notes: document.getElementById('crOpenNotes').value || null
      }});
      show('cashreport');
    } catch (e) {
      res.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">' + esc(e.message) + '</div>';
      openBtn.disabled = false;
    }
  });

  var closeBtn = document.getElementById('crCloseBtn');
  if (closeBtn) closeBtn.addEventListener('click', async function(){
    var res = document.getElementById('crCloseResult');
    var closing = document.getElementById('crClosing').value;
    if (closing === '') { res.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">Enter a closing cash count.</div>'; return; }
    closeBtn.disabled = true;
    try {
      var r = await api('/api/admin/cash-drawer/' + session.id + '/close', { method:'POST', body: {
        closing_amount: Number(closing),
        closed_by: document.getElementById('crClosedBy').value || null,
        notes: document.getElementById('crCloseNotes').value || null
      }});
      var v = r.variance;
      var vColor = v === 0 ? 'var(--ok)' : (v < 0 ? '#b91c1c' : '#92400e');
      res.innerHTML = '<div style="padding:10px 12px;background:var(--card-soft);border:1px solid var(--line);border-radius:8px;font-size:13px">' +
        'Expected: <b>' + fmtMoney(r.expected_cash) + '</b> · Counted: <b>' + fmtMoney(r.closing_amount) + '</b> · ' +
        'Variance: <b style="color:' + vColor + '">' + (v > 0 ? '+' : '') + fmtMoney(v) + '</b>' +
      '</div>';
      setTimeout(function(){ show('cashreport'); }, 1800);
    } catch (e) {
      res.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">' + esc(e.message) + '</div>';
      closeBtn.disabled = false;
    }
  });

  loadReport();
}

// ============= PETTY CASH =============
// Fund management + payout browsing across everything (not just the current
// till session, which the Cash Report tab already covers inline). A payout
// against a fund never touches any drawer's reconciliation -- only a
// drawer-sourced payout (recorded here or from Cash Report) does that.
var PC_VIEW_FUND = null;
async function renderPettyCash(panel){
  if (PC_VIEW_FUND) return renderPettyCashFundDetail(panel, PC_VIEW_FUND);
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r;
  try { r = await api('/api/admin/petty-cash-funds'); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  panel.innerHTML =
    '<details style="border-bottom:1px solid var(--line);background:var(--card-soft)">' +
      '<summary style="padding:12px 16px;cursor:pointer;font-weight:700;color:var(--heading)">+ New petty cash fund</summary>' +
      '<form id="newFund" style="padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px" onsubmit="event.preventDefault();submitPettyCashFund();">' +
        '<div><label class="lbl">Name *</label><input id="pcfName" required class="fld" placeholder="e.g. Front Desk Petty Cash"/></div>' +
        '<div><label class="lbl">Opening balance</label><input id="pcfOpening" type="number" min="0" step="0.01" value="0" class="fld"/></div>' +
        '<div id="pcfMsg" style="grid-column:1/-1;display:none;padding:10px 12px;border-radius:6px;font-size:13px"></div>' +
        '<button type="submit" style="grid-column:1/-1;background:var(--red);color:#fff;border:0;padding:11px 22px;border-radius:7px;font-weight:700;cursor:pointer">Create fund</button>' +
      '</form>' +
    '</details>' +
    (r.funds.length
      ? '<table><thead><tr><th>Name</th><th>Balance</th><th>Custodian</th><th>Status</th><th></th></tr></thead><tbody>' +
        r.funds.map(function(f){
          return '<tr' + (!f.is_active ? ' style="opacity:.55"' : '') + '>' +
            '<td><b>' + esc(f.name) + '</b></td>' +
            '<td><b>' + fmtMoney(f.balance_usd) + '</b></td>' +
            '<td>' + esc(f.custodian_name || '—') + '</td>' +
            '<td>' + badge(f.is_active ? 'active' : 'inactive', f.is_active ? 'ok' : 'bad') + '</td>' +
            '<td class="actions"><button class="btn" data-open="' + f.id + '">Open</button></td>' +
          '</tr>';
        }).join('') + '</tbody></table>'
      : '<div class="empty">No petty cash funds yet — create one above, or just record payouts straight from the register on the Cash Report tab.</div>');

  panel.querySelectorAll('[data-open]').forEach(function(b){
    b.addEventListener('click', function(){ PC_VIEW_FUND = parseInt(b.getAttribute('data-open'), 10); renderPettyCash(panel); });
  });
}
async function submitPettyCashFund(){
  var msg = document.getElementById('pcfMsg');
  msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';
  try {
    await api('/api/admin/petty-cash-funds', { method: 'POST', body: {
      name: document.getElementById('pcfName').value.trim(),
      opening_balance_usd: document.getElementById('pcfOpening').value || 0,
    }});
    show('pettycash');
  } catch (e) { msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message; }
}
async function renderPettyCashFundDetail(panel, fundId){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var funds, payouts;
  try {
    funds = (await api('/api/admin/petty-cash-funds')).funds;
    payouts = (await api('/api/admin/cash-payouts?fund_id=' + fundId)).payouts;
  } catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  var f = funds.find(function(x){ return x.id === fundId; });
  if (!f) { panel.innerHTML = '<div class="empty">Fund not found.</div>'; return; }

  panel.innerHTML =
    '<div style="padding:11px 14px;border-bottom:1px solid var(--line)"><button class="btn" id="pcBack">‹ All funds</button></div>' +
    '<div style="padding:14px 16px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)">' +
      '<div><div class="lbl">Fund</div><b style="font-size:16px">' + esc(f.name) + '</b></div>' +
      '<div><div class="lbl">Balance</div><b style="font-size:15px">' + fmtMoney(f.balance_usd) + '</b></div>' +
      '<div><div class="lbl">Custodian</div>' + esc(f.custodian_name || '—') + '</div>' +
      '<div><div class="lbl">Status</div>' + badge(f.is_active ? 'active' : 'inactive', f.is_active ? 'ok' : 'bad') + '</div>' +
    '</div>' +
    '<div style="padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:20px;flex-wrap:wrap">' +
      '<form id="pcReplenishForm" style="display:flex;gap:8px;align-items:flex-end" onsubmit="event.preventDefault();submitReplenish(' + fundId + ');">' +
        '<div><label class="lbl">Replenish amount</label><input id="pcReplenishAmt" type="number" min="0.01" step="0.01" required class="fld" style="width:100px"/></div>' +
        '<div><label class="lbl">Source</label><select id="pcReplenishSource" class="fld"><option value="bank">Bank / owner (no drawer)</option><option value="drawer">The open register drawer</option></select></div>' +
        '<button type="submit" class="btn ok">Replenish</button>' +
      '</form>' +
      '<form id="pcPayoutForm" style="display:flex;gap:8px;align-items:flex-end" onsubmit="event.preventDefault();submitFundPayout(' + fundId + ');">' +
        '<div><label class="lbl">Payout amount</label><input id="pcPayoutAmt" type="number" min="0.01" step="0.01" required class="fld" style="width:100px"/></div>' +
        '<div><label class="lbl">Reason</label><input id="pcPayoutReason" required class="fld" style="width:160px"/></div>' +
        '<div><label class="lbl">Paid to</label><input id="pcPayoutTo" class="fld" style="width:130px"/></div>' +
        '<button type="submit" class="btn">Record payout</button>' +
      '</form>' +
      '<span id="pcMsg" style="align-self:center;font-size:12.5px"></span>' +
    '</div>' +
    '<div style="padding:14px 16px">' +
      '<h4 style="margin:0 0 8px">Ledger</h4>' +
      (payouts.length
        ? '<table><thead><tr><th>Date</th><th>Reason</th><th>Paid to</th><th>Authorized by</th><th align="right">Amount</th></tr></thead><tbody>' +
          payouts.map(function(p){
            return '<tr><td>' + fmtDate(p.created_at) + '</td>' +
              '<td>' + esc(p.reason) + '</td><td>' + esc(p.paid_to || '—') + '</td><td>' + esc(p.authorized_by_name || '—') + '</td>' +
              '<td align="right">' + fmtMoney(p.amount_usd) + '</td></tr>';
          }).join('') + '</tbody></table>'
        : '<div class="empty">No activity yet.</div>') +
    '</div>';

  document.getElementById('pcBack').addEventListener('click', function(){ PC_VIEW_FUND = null; renderPettyCash(panel); });
}
async function submitReplenish(fundId){
  var msg = document.getElementById('pcMsg');
  msg.style.color = 'var(--muted)'; msg.textContent = 'Saving…';
  try {
    var source = document.getElementById('pcReplenishSource').value;
    var body = { amount_usd: document.getElementById('pcReplenishAmt').value, source: source };
    if (source === 'drawer') {
      var open = null;
      try { open = (await api('/api/admin/cash-drawer/open')).session; } catch (_) {}
      if (!open) { msg.style.color = 'var(--red)'; msg.textContent = 'No cash drawer session is currently open.'; return; }
      body.drawer_session_id = open.id;
    }
    await api('/api/admin/petty-cash-funds/' + fundId + '/replenish', { method: 'POST', body: body });
    PC_VIEW_FUND = fundId;
    show('pettycash');
  } catch (e) { msg.style.color = 'var(--red)'; msg.textContent = e.message; }
}
async function submitFundPayout(fundId){
  var msg = document.getElementById('pcMsg');
  msg.style.color = 'var(--muted)'; msg.textContent = 'Saving…';
  try {
    await api('/api/admin/cash-payouts', { method: 'POST', body: {
      amount_usd: document.getElementById('pcPayoutAmt').value,
      reason: document.getElementById('pcPayoutReason').value.trim(),
      paid_to: document.getElementById('pcPayoutTo').value.trim() || null,
      source_type: 'fund', fund_id: fundId,
    }});
    PC_VIEW_FUND = fundId;
    show('pettycash');
  } catch (e) { msg.style.color = 'var(--red)'; msg.textContent = e.message; }
}

// ============= RECURRING CHARGES =============
// A plan bills automatically on a schedule via the 'recurring-charges'
// scheduled job (_lib/recurring.js, registered in _lib/jobs.js) -- this
// screen is just the admin CRUD + a manual "run now" for testing/urgent
// billing. Mirrors the coupons/gift-cards/redemptions list+detail pattern.
var RC_VIEW_PLAN = null;
var RC_ITEMS = [];   // the create form's repeatable line-item rows
var RC_CUSTOMER = null;   // { id, name } picked via the search box below
async function renderRecurring(panel){
  if (RC_VIEW_PLAN) return renderRecurringDetail(panel, RC_VIEW_PLAN);
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r;
  try { r = await api('/api/admin/recurring-plans'); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }

  RC_ITEMS = [{ description: '', qty: 1, unit_price_usd: '' }];
  RC_CUSTOMER = null;
  var freqLabel = { weekly:'Weekly', monthly:'Monthly', quarterly:'Quarterly', yearly:'Yearly' };
  var targetLabel = { order:'Order (invoiced by email)', pos_account_sale:'POS sale, charged to account' };

  panel.innerHTML =
    '<details style="border-bottom:1px solid var(--line);background:var(--card-soft)">' +
      '<summary style="padding:12px 16px;cursor:pointer;font-weight:700;color:var(--heading)">+ New recurring plan</summary>' +
      '<div style="padding:14px 18px;max-width:760px">' +
        '<div style="position:relative;margin-bottom:10px">' +
          '<label class="lbl">Customer *</label>' +
          '<input id="rcCustSearch" placeholder="🔎 search name, phone, or account #…" autocomplete="off" class="fld"/>' +
          '<div id="rcCustResults" style="display:none;position:absolute;z-index:60;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 36px rgba(0,0,0,.30);max-height:280px;overflow-y:auto"></div>' +
          '<div id="rcCustPicked" style="margin-top:4px;font-size:12.5px;color:var(--muted)"></div>' +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
          '<div><label class="lbl">Bills as</label><select id="rcTarget" class="fld">' +
            '<option value="order">Order (invoiced by email)</option><option value="pos_account_sale">POS sale, charged to account</option>' +
          '</select></div>' +
          '<div><label class="lbl">Frequency</label><select id="rcFrequency" class="fld">' +
            '<option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="quarterly">Quarterly</option><option value="yearly">Yearly</option>' +
          '</select></div>' +
          '<div style="grid-column:1/-1"><label class="lbl">Description</label><input id="rcDescription" class="fld" placeholder="e.g. Monthly rent"/></div>' +
          '<div><label class="lbl">First charge date</label><input id="rcNextRun" type="date" value="' + new Date().toISOString().slice(0,10) + '" class="fld"/></div>' +
          '<div><label class="lbl">Ends on <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">(optional)</span></label><input id="rcEndDate" type="date" class="fld"/></div>' +
          '<div><label class="lbl"># of charges <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">(optional — blank = until cancelled)</span></label><input id="rcOccurrences" type="number" min="1" class="fld"/></div>' +
        '</div>' +
        '<div style="margin-top:12px">' +
          '<div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;margin-bottom:6px">Line items</div>' +
          '<div id="rcItemRows"></div>' +
          '<button type="button" class="btn" id="rcItemAdd" style="margin-top:4px">+ Add line</button>' +
        '</div>' +
        '<div id="rcMsg" style="display:none;margin-top:10px;padding:9px 12px;border-radius:6px;font-size:13px"></div>' +
        '<button type="button" class="btn ok" id="rcCreateGo" style="margin-top:12px">Create plan</button>' +
      '</div>' +
    '</details>' +
    (r.plans.length
      ? '<table><thead><tr><th>Customer</th><th>Description</th><th>Amount</th><th>Bills as</th><th>Frequency</th><th>Next run</th><th>Status</th><th></th></tr></thead><tbody>' +
        r.plans.map(function(p){
          return '<tr' + (!p.is_active ? ' style="opacity:.55"' : '') + '>' +
            '<td>' + esc(p.customer_name || ('#' + p.customer_id)) + '</td>' +
            '<td>' + esc(p.description) + '</td>' +
            '<td>' + fmtMoney(p.amount_usd) + '</td>' +
            '<td>' + esc(targetLabel[p.target] || p.target) + '</td>' +
            '<td>' + esc(freqLabel[p.frequency] || p.frequency) + '</td>' +
            '<td>' + esc(p.next_run_date) + (p.occurrences_left != null ? '<br/><small style="color:var(--muted)">' + p.occurrences_left + ' left</small>' : '') + '</td>' +
            '<td>' + badge(p.is_active ? 'active' : 'paused', p.is_active ? 'ok' : 'bad') + '</td>' +
            '<td class="actions"><button class="btn" data-open="' + p.id + '">Open</button></td>' +
          '</tr>';
        }).join('') + '</tbody></table>'
      : '<div class="empty">No recurring plans yet — create one above.</div>');

  function paintItemRows(){
    var box = document.getElementById('rcItemRows');
    box.innerHTML = RC_ITEMS.map(function(it, i){
      return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px" data-rcrow="' + i + '">' +
        '<input placeholder="Description" class="fld rcDesc" value="' + esc(it.description) + '" style="flex:1"/>' +
        '<input type="number" min="1" placeholder="Qty" class="fld rcQty" value="' + esc(it.qty) + '" style="width:70px"/>' +
        '<span style="font-size:12.5px;color:var(--muted)">@ $</span>' +
        '<input type="number" min="0" step="0.01" placeholder="Price" class="fld rcPrice" value="' + esc(it.unit_price_usd) + '" style="width:100px"/>' +
        '<button type="button" class="btn rcRowDel" style="padding:3px 9px;background:#fee2e2;color:#b91c1c">✕</button>' +
      '</div>';
    }).join('');
    box.querySelectorAll('.rcRowDel').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.closest('[data-rcrow]').getAttribute('data-rcrow'), 10);
        if (RC_ITEMS.length > 1) { RC_ITEMS.splice(i, 1); paintItemRows(); }
      });
    });
  }
  paintItemRows();
  document.getElementById('rcItemAdd').addEventListener('click', function(){ RC_ITEMS.push({ description:'', qty:1, unit_price_usd:'' }); paintItemRows(); });

  // Customer search -- same debounced-search-box pattern as the product
  // form's "Copy from an existing part" widget, hitting the existing
  // customer-lookup endpoint (there's no single shared customer-picker
  // widget in admin.html to reuse -- POS's own is wired inline into the
  // POS panel).
  (function(){
    var jin = document.getElementById('rcCustSearch'), jout = document.getElementById('rcCustResults');
    var jd = null, jseq = 0, jrows = [];
    var render = function(){
      if (!jrows.length) { jout.style.display = 'none'; jout.innerHTML = ''; return; }
      jout.innerHTML = jrows.map(function(x, i){
        return '<button type="button" data-i="' + i + '" style="display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--hover);background:var(--card);color:var(--ink);padding:8px 10px;cursor:pointer;font-family:inherit;font-size:12.5px">' +
          '<b>' + esc(x.name || '') + '</b> <span style="color:var(--muted)">' + esc(x.email || x.phone || '') + '</span></button>';
      }).join('');
      jout.style.display = 'block';
      jout.querySelectorAll('button').forEach(function(b){
        b.addEventListener('mousedown', function(e){
          e.preventDefault();
          var x = jrows[parseInt(b.getAttribute('data-i'), 10)];
          RC_CUSTOMER = { id: x.id, name: x.name };
          document.getElementById('rcCustPicked').textContent = 'Selected: ' + x.name;
          jin.value = ''; jrows = []; render();
        });
      });
    };
    jin.addEventListener('input', function(){
      var q = jin.value.trim();
      clearTimeout(jd);
      if (q.length < 2) { jrows = []; render(); return; }
      jd = setTimeout(async function(){
        var seq = ++jseq;
        try {
          var res = await api('/api/admin/pos/customer-lookup?q=' + encodeURIComponent(q) + '&phone=' + encodeURIComponent(q));
          if (seq !== jseq) return;
          jrows = res.matches || []; render();
        } catch (e) { if (seq === jseq) { jrows = []; render(); } }
      }, 220);
    });
    jin.addEventListener('blur', function(){ setTimeout(function(){ jout.style.display = 'none'; }, 120); });
  })();

  document.getElementById('rcCreateGo').addEventListener('click', async function(){
    var msg = document.getElementById('rcMsg');
    var showMsg = function(text, bad){ msg.style.display = 'block'; msg.style.background = bad ? '#fee2e2' : '#dbeafe'; msg.style.color = bad ? '#991b1b' : '#1e40af'; msg.textContent = text; };
    if (!RC_CUSTOMER) return showMsg('Pick a customer first.', true);
    var description = document.getElementById('rcDescription').value.trim();
    if (!description) return showMsg('A description is required.', true);
    document.querySelectorAll('#rcItemRows [data-rcrow]').forEach(function(row, i){
      RC_ITEMS[i].description = row.querySelector('.rcDesc').value.trim();
      RC_ITEMS[i].qty = row.querySelector('.rcQty').value;
      RC_ITEMS[i].unit_price_usd = row.querySelector('.rcPrice').value;
    });
    var items = RC_ITEMS.filter(function(it){ return it.description && it.unit_price_usd !== ''; })
      .map(function(it){ return { description: it.description, qty: parseInt(it.qty, 10) || 1, unit_price_usd: Number(it.unit_price_usd) }; });
    if (!items.length) return showMsg('At least one line item (description + price) is required.', true);
    showMsg('Saving…');
    try {
      await api('/api/admin/recurring-plans', { method: 'POST', body: {
        customer_id: RC_CUSTOMER.id, target: document.getElementById('rcTarget').value,
        description: description, frequency: document.getElementById('rcFrequency').value,
        next_run_date: document.getElementById('rcNextRun').value || null,
        end_date: document.getElementById('rcEndDate').value || null,
        occurrences_left: document.getElementById('rcOccurrences').value || null,
        items: items,
      }});
      show('recurring');
    } catch (e) { showMsg(e.message, true); }
  });

  panel.querySelectorAll('[data-open]').forEach(function(b){
    b.addEventListener('click', function(){ RC_VIEW_PLAN = parseInt(b.getAttribute('data-open'), 10); renderRecurring(panel); });
  });
}
async function renderRecurringDetail(panel, planId){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var d;
  try { d = await api('/api/admin/recurring-plans/' + planId); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  var p = d.plan;
  panel.innerHTML =
    '<div style="padding:11px 14px;border-bottom:1px solid var(--line)"><button class="btn" id="rcBack">‹ All plans</button></div>' +
    '<div style="padding:14px 16px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)">' +
      '<div><div class="lbl">Customer</div><b>' + esc(p.customer_name || ('#' + p.customer_id)) + '</b></div>' +
      '<div><div class="lbl">Description</div>' + esc(p.description) + '</div>' +
      '<div><div class="lbl">Bills as</div>' + (p.target === 'order' ? 'Order (email invoice)' : 'POS sale, charged to account') + '</div>' +
      '<div><div class="lbl">Frequency</div>' + esc(p.frequency) + '</div>' +
      '<div><div class="lbl">Next run</div>' + esc(p.next_run_date) + (p.occurrences_left != null ? ' (' + p.occurrences_left + ' left)' : '') + '</div>' +
      '<div><div class="lbl">Status</div>' + badge(p.is_active ? 'active' : 'paused', p.is_active ? 'ok' : 'bad') + '</div>' +
      '<div style="margin-left:auto;display:flex;gap:6px">' +
        '<button class="btn" id="rcRunNow">▶ Run now</button>' +
        '<button class="btn ' + (p.is_active ? '' : 'ok') + '" id="rcToggle">' + (p.is_active ? 'Pause' : 'Resume') + '</button>' +
      '</div>' +
    '</div>' +
    '<div style="padding:14px 16px;border-bottom:1px solid var(--line)">' +
      '<h4 style="margin:0 0 8px">Line items</h4>' +
      '<table><thead><tr><th>Description</th><th>Qty</th><th align="right">Price</th></tr></thead><tbody>' +
        p.items.map(function(it){ return '<tr><td>' + esc(it.description) + '</td><td>' + it.qty + '</td><td align="right">' + fmtMoney(it.unit_price_usd) + '</td></tr>'; }).join('') +
      '</tbody></table>' +
      '<div id="rcDetailMsg" style="margin-top:8px;font-size:12.5px"></div>' +
    '</div>' +
    '<div style="padding:14px 16px">' +
      '<h4 style="margin:0 0 8px">Run history</h4>' +
      (d.runs.length
        ? '<table><thead><tr><th>Date</th><th>Status</th><th>Order/Sale</th><th>Error</th></tr></thead><tbody>' +
          d.runs.map(function(x){
            return '<tr><td>' + esc(x.run_date) + '</td><td>' + badge(x.status, x.status === 'ok' ? 'ok' : 'bad') + '</td>' +
              '<td>' + (x.order_id ? 'Order #' + x.order_id : x.sale_id ? 'Sale #' + x.sale_id : '—') + '</td>' +
              '<td style="color:#b91c1c">' + esc(x.error || '') + '</td></tr>';
          }).join('') + '</tbody></table>'
        : '<div class="empty">No runs yet.</div>') +
    '</div>';

  document.getElementById('rcBack').addEventListener('click', function(){ RC_VIEW_PLAN = null; renderRecurring(panel); });
  document.getElementById('rcToggle').addEventListener('click', async function(){
    try { await api('/api/admin/recurring-plans/' + planId, { method: 'PATCH', body: { is_active: !p.is_active } }); renderRecurringDetail(panel, planId); }
    catch (e) { alert(e.message); }
  });
  document.getElementById('rcRunNow').addEventListener('click', async function(){
    var msg = document.getElementById('rcDetailMsg');
    msg.style.color = 'var(--muted)'; msg.textContent = 'Running…';
    try {
      var r = await api('/api/admin/recurring-plans/' + planId + '/run-now', { method: 'POST' });
      msg.style.color = r.status === 'ok' ? '#166534' : 'var(--red)';
      msg.textContent = r.status === 'ok' ? 'Ran successfully.' : ('Failed: ' + r.error);
      renderRecurringDetail(panel, planId);
    } catch (e) { msg.style.color = 'var(--red)'; msg.textContent = e.message; }
  });
}

// ============= LOW STOCK =============
async function renderLowStock(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r;
  try { r = await api('/api/admin/low-stock'); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  if (!r.products.length) { panel.innerHTML = '<div class="empty">Nothing low on stock right now. 🎉</div>'; return; }
  panel.innerHTML =
    '<div style="padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)">' + r.count + ' product' + (r.count===1?'':'s') + ' at or below its reorder threshold.</div>' +
    '<table><thead><tr><th>Product</th><th>Vehicle</th><th>Category</th><th>On hand</th><th>Threshold</th><th>Restock to</th></tr></thead><tbody>' +
    r.products.map(function(p){
      return '<tr>' +
        '<td><b>' + esc(p.name) + '</b><br/><small style="color:var(--muted)">' + esc(p.img) + '</small></td>' +
        '<td>' + esc(p.make_model || '') + '</td>' +
        '<td>' + esc(p.category || '') + '</td>' +
        '<td>' + badge(p.stock_count, p.stock_count <= 0 ? 'bad' : 'pending') + '</td>' +
        '<td>' + p.low_threshold + '</td>' +
        '<td class="actions">' +
          '<input type="number" min="0" class="fld-mini" data-restock="' + esc(p.img) + '" placeholder="qty"/> ' +
          '<button class="btn ok" data-go="' + esc(p.img) + '">Set</button>' +
        '</td>' +
      '</tr>';
    }).join('') + '</tbody></table>';

  panel.querySelectorAll('[data-go]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      var img = btn.getAttribute('data-go');
      var input = panel.querySelector('[data-restock="' + CSS.escape(img) + '"]');
      var qty = parseInt(input.value, 10);
      if (!(qty >= 0)) { alert('Enter a quantity ≥ 0'); return; }
      btn.disabled = true;
      try {
        await api('/api/admin/stock-adjust', { method:'POST', body: { product_img: img, new_qty: qty, reason: 'Restock from Low Stock tab' } });
        show('lowstock');
      } catch (e) { alert('Failed: ' + e.message); btn.disabled = false; }
    });
  });
}

// ============= SUPPLIERS =============
async function renderSuppliers(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r;
  try { r = await api('/api/admin/suppliers'); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  panel.innerHTML =
    '<details style="border-bottom:1px solid var(--line);background:var(--card-soft)">' +
      '<summary style="padding:12px 16px;cursor:pointer;font-weight:700;color:var(--heading)">+ New supplier</summary>' +
      '<form id="newSupplier" style="padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:760px" onsubmit="event.preventDefault();submitSupplier();">' +
        '<div><label class="lbl">Name *</label><input id="supName" required class="fld"/></div>' +
        '<div><label class="lbl">Code</label><input id="supCode" class="fld" placeholder="e.g. NAPA"/></div>' +
        '<div><label class="lbl">Contact name</label><input id="supContact" class="fld"/></div>' +
        '<div><label class="lbl">Phone</label><input id="supPhone" class="fld"/></div>' +
        '<div><label class="lbl">Email</label><input id="supEmail" type="email" class="fld"/></div>' +
        '<div><label class="lbl">Lead time (days)</label><input id="supLead" type="number" min="0" class="fld" value="7"/></div>' +
        '<div style="grid-column:1/-1"><label class="lbl">Address</label><input id="supAddress" class="fld"/></div>' +
        '<div id="supMsg" style="grid-column:1/-1;display:none;padding:10px 12px;border-radius:6px;font-size:13px"></div>' +
        '<button type="submit" style="grid-column:1/-1;background:var(--red);color:#fff;border:0;padding:11px 22px;border-radius:7px;font-weight:700;cursor:pointer">Save supplier</button>' +
      '</form>' +
    '</details>' +
    (r.suppliers.length
      ? '<table><thead><tr><th>Name</th><th>Code</th><th>Contact</th><th>Phone / Email</th><th>Lead time</th><th>Status</th><th></th></tr></thead><tbody>' +
        r.suppliers.map(function(s){
          return '<tr' + (!s.is_active ? ' style="opacity:.55"' : '') + '>' +
            '<td><b>' + esc(s.name) + '</b></td>' +
            '<td>' + esc(s.code || '—') + '</td>' +
            '<td>' + esc(s.contact_name || '—') + '</td>' +
            '<td>' + esc(s.phone || '') + (s.email ? '<br/><small>' + esc(s.email) + '</small>' : '') + '</td>' +
            '<td>' + (s.lead_time_days != null ? s.lead_time_days + ' days' : '—') + '</td>' +
            '<td>' + badge(s.is_active ? 'active' : 'inactive', s.is_active ? 'ok' : 'bad') + '</td>' +
            '<td class="actions"><button class="btn" data-toggle="' + s.id + '" data-active="' + s.is_active + '">' + (s.is_active ? 'Deactivate' : 'Reactivate') + '</button></td>' +
          '</tr>';
        }).join('') + '</tbody></table>'
      : '<div class="empty">No suppliers yet — add one above.</div>');

  panel.querySelectorAll('[data-toggle]').forEach(function(b){
    b.addEventListener('click', async function(){
      var id = b.getAttribute('data-toggle');
      var wasActive = b.getAttribute('data-active') === 'true';
      try { await api('/api/admin/suppliers/' + id, { method:'PATCH', body: { is_active: !wasActive } }); show('suppliers'); }
      catch (e) { alert(e.message); }
    });
  });
}
async function submitSupplier(){
  var msg = document.getElementById('supMsg');
  msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';
  try {
    await api('/api/admin/suppliers', { method:'POST', body: {
      name: document.getElementById('supName').value.trim(),
      code: document.getElementById('supCode').value.trim() || null,
      contact_name: document.getElementById('supContact').value.trim() || null,
      phone: document.getElementById('supPhone').value.trim() || null,
      email: document.getElementById('supEmail').value.trim() || null,
      lead_time_days: document.getElementById('supLead').value || 7,
      address: document.getElementById('supAddress').value.trim() || null,
    }});
    show('suppliers');
  } catch (e) {
    msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
  }
}

// ============= PURCHASE ORDERS =============
var PO_VIEW_ID = null; // set when drilled into a single PO's detail
async function renderPurchaseOrders(panel){
  if (PO_VIEW_ID) return renderPoDetail(panel, PO_VIEW_ID);
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r, sup;
  try {
    r = await api('/api/admin/purchase-orders');
    sup = await api('/api/admin/suppliers?active=true');
  } catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }

  panel.innerHTML =
    '<details style="border-bottom:1px solid var(--line);background:var(--card-soft)">' +
      '<summary style="padding:12px 16px;cursor:pointer;font-weight:700;color:var(--heading)">+ New purchase order</summary>' +
      '<form id="newPo" style="padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:640px" onsubmit="event.preventDefault();submitPo();">' +
        '<div><label class="lbl">Supplier *</label><select id="poSupplier" required class="fld">' +
          '<option value="">— choose —</option>' +
          sup.suppliers.map(function(s){ return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('') +
          '<option value="__new__">➕ Add a new supplier…</option>' +
        '</select>' +
          '<div id="poNewSup" style="display:none;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card)">' +
            '<div style="display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end">' +
              '<div><label class="lbl">New supplier name *</label><input id="poNewSupName" class="fld"/></div>' +
              '<div><label class="lbl">Phone</label><input id="poNewSupPhone" class="fld"/></div>' +
              '<button type="button" class="btn ok" id="poNewSupSave">Create</button>' +
            '</div>' +
            '<span id="poNewSupMsg" style="font-size:12px"></span>' +
          '</div>' +
        '</div>' +
        '<div><label class="lbl">Expected date</label><input id="poExpected" type="date" class="fld"/></div>' +
        '<div style="grid-column:1/-1"><label class="lbl">Notes</label><input id="poNotes" class="fld"/></div>' +
        '<div id="poMsg" style="grid-column:1/-1;display:none;padding:10px 12px;border-radius:6px;font-size:13px"></div>' +

        '<div id="rcvNewSup" style="display:none;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card)">' +
          '<div style="display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end">' +
            '<div><label class="lbl">New supplier name *</label><input id="rcvNewSupName" class="fld"/></div>' +
            '<div><label class="lbl">Phone</label><input id="rcvNewSupPhone" class="fld"/></div>' +
            '<button type="button" class="btn ok" id="rcvNewSupSave">Create</button>' +
          '</div><span id="rcvNewSupMsg" style="font-size:12px"></span>' +
        '</div>' +
        '<div style="position:relative"><label class="lbl">Find the part</label>' +
          '<input id="rcvSearch" class="fld" placeholder="Search part name or SKU…" autocomplete="off"/>' +
