      '<button class="btn" id="vhGo">Look up</button>' +
    '</div><div id="vhResult"></div>';
  function go(){
    var vin = document.getElementById('vhVin').value.trim();
    var plate = document.getElementById('vhPlate').value.trim();
    if (!vin && !plate) return;
    var result = document.getElementById('vhResult');
    result.innerHTML = '<div class="empty">Loading…</div>';
    var qs = (vin ? 'vin=' + encodeURIComponent(vin) : '') + (plate ? (vin?'&':'') + 'plate=' + encodeURIComponent(plate) : '');
    api('/api/admin/vehicle-history?' + qs).then(function(r){
      if (!r.work_orders.length && !r.inspections.length && !r.appointments.length) {
        result.innerHTML = '<div class="empty">No history found for that vehicle.</div>';
        return;
      }
      var v = r.vehicle;
      result.innerHTML =
        (v ? '<div style="padding:14px 16px;background:var(--card-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:24px;flex-wrap:wrap">' +
          '<div><div class="lbl">Vehicle</div><b>' + esc([v.year, v.make, v.model].filter(Boolean).join(' ')) + '</b><br/><small>VIN ' + esc(v.vin || '—') + ' · Plate ' + esc(v.plate || '—') + '</small></div>' +
          '<div><div class="lbl">Last customer</div><b>' + esc(v.last_customer || '—') + '</b></div>' +
          '<div><div class="lbl">Last seen</div>' + (v.last_seen ? new Date(v.last_seen).toLocaleDateString() : '—') + (v.last_mileage ? ' @ ' + v.last_mileage + ' km' : '') + '</div>' +
          '<div><div class="lbl">Total visits</div><b>' + r.stats.total_wos + '</b></div>' +
          '<div><div class="lbl">Lifetime spend</div><b>' + fmtMoney(r.stats.lifetime_spend) + '</b></div>' +
        '</div>' : '') +
        '<div style="padding:14px 16px">' +
          '<h3 style="margin:0 0 8px;font-size:13px">🛠 Work order history</h3>' +
          (r.work_orders.length
            ? '<table><thead><tr><th>WO #</th><th>Date</th><th>Complaint</th><th>Mileage</th><th>Total</th><th>Status</th></tr></thead><tbody>' +
              r.work_orders.map(function(w){
                return '<tr><td><b>' + esc(w.wo_number) + '</b></td><td>' + (w.intake_date ? new Date(w.intake_date).toLocaleDateString() : '') + '</td>' +
                  '<td>' + esc(w.complaint || '') + '</td><td>' + (w.mileage_in || '—') + '</td><td>' + fmtMoney(w.total_usd) + '</td>' +
                  '<td>' + badge(w.status, w.status === 'paid' ? 'ok' : 'pending') + '</td></tr>';
              }).join('') + '</tbody></table>'
            : '<div class="empty">No work orders on record.</div>') +
          (r.inspections.length
            ? '<h3 style="margin:16px 0 8px;font-size:13px">🔍 Inspections</h3><table><thead><tr><th>Date</th><th>Kind</th><th>Mileage</th><th>Status</th></tr></thead><tbody>' +
              r.inspections.map(function(i){
                return '<tr><td>' + fmtDate(i.created_at) + '</td><td>' + esc(i.kind || '') + '</td><td>' + (i.mileage || '—') + '</td><td>' + badge(i.status, i.status==='completed'?'ok':'pending') + '</td></tr>';
              }).join('') + '</tbody></table>'
            : '') +
        '</div>';
    }).catch(function(e){ result.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }
  document.getElementById('vhGo').addEventListener('click', go);
  ['vhVin','vhPlate'].forEach(function(id){ document.getElementById(id).addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); }); });
}

async function submitDelivery(){
  var msg = document.getElementById('dlMsg');
  msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';
  try {
    await api('/api/admin/deliveries', { method:'POST', body: {
      recipient_name: document.getElementById('dlName').value.trim(),
      recipient_phone: document.getElementById('dlPhone').value.trim() || null,
      address: document.getElementById('dlAddress').value.trim() || null,
      driver_id: document.getElementById('dlDriver').value || null,
      scheduled_for: document.getElementById('dlScheduled').value || null,
      notes: document.getElementById('dlNotes').value.trim() || null,
    }});
    show('deliveries');
  } catch (e) {
    msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
  }
}

async function submitCustRole(id, body){
  var msg = document.getElementById('custRoleMsg');
  msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';
  try {
    await api('/api/admin/users/' + id + '/role', { method:'PATCH', body: body });
    show('customers');
  } catch (e) {
    msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
  }
}
async function submitCustProfile(id){
  var msg = document.getElementById('cpMsg');
  msg.style.display='block'; msg.style.background='#dbeafe'; msg.style.color='#1e40af'; msg.textContent='Saving…';
  try {
    await api('/api/admin/users/' + id, { method:'PATCH', body: {
      name: document.getElementById('cpName').value.trim() || null,
      phone: document.getElementById('cpPhone').value.trim() || null,
      company_name: document.getElementById('cpCompany').value.trim() || null,
      customer_type: document.getElementById('cpType').value || null,
      price_tier: document.getElementById('cpTier').value.trim() || null,
      discount_pct: document.getElementById('cpDisc').value || null,
      credit_limit_usd: document.getElementById('cpCredit').value || null,
      payment_terms_days: document.getElementById('cpTerms').value || null,
      discount_limit_pct: document.getElementById('cpDiscLimit').value || null,
      tax_exempt: document.getElementById('cpTaxExempt').value === '1',
      tax_id: document.getElementById('cpTax').value.trim() || null,
      rating: document.getElementById('cpRating').value || null,
      internal_notes: document.getElementById('cpNotes').value.trim() || null,
    }});
    msg.style.background='#dcfce7'; msg.style.color='#166534'; msg.textContent='Saved';
  } catch (e) { msg.style.background='#fee2e2'; msg.style.color='#b91c1c'; msg.textContent=e.message; }
}

async function submitNotice(id){
  var msg = document.getElementById('ntMsg');
  var body = document.getElementById('ntBody').value.trim();
  if (!body) return;
  msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Sending…';
  try {
    var r = await api('/api/admin/users/' + id + '/notifications', { method:'POST', body: {
      kind: document.getElementById('ntKind').value,
      body: body,
    }});
    msg.style.background = '#dcfce7'; msg.style.color = '#166534';
    msg.textContent = r.emailed ? '✓ Sent and emailed.' : '✓ Logged (customer has no email on file).';
    setTimeout(function(){ CUST_VIEW_ID = id; renderCustomers(document.getElementById('panel')); }, 900);
  } catch (e) {
    msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
  }
}
async function submitAccountPayment(id){
  var msg = document.getElementById('apMsg');
  msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Recording…';
  try {
    var r = await api('/api/admin/users/' + id + '/account-payments', { method:'POST', body: {
      amount_usd: document.getElementById('apAmount').value,
      method: document.getElementById('apMethod').value,
      reference: document.getElementById('apRef').value.trim() || null,
      notes: document.getElementById('apNotes').value.trim() || null,

async function renderMessages(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r;
  try { r = await api('/api/admin/messages/inbox'); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  if (!r.threads.length) { panel.innerHTML = '<div class="empty">No customer message threads yet.</div>'; return; }
  panel.innerHTML = '<table><thead><tr><th>Customer</th><th>Last message</th><th>When</th><th>Unread</th><th></th></tr></thead><tbody>' +
    r.threads.map(function(t){
      return '<tr' + (t.unread > 0 ? ' style="background:#fef9e7"' : '') + '>' +
        '<td><b>' + esc(t.customer_name || '—') + '</b><br/><small>' + esc(t.customer_email || '') + '</small></td>' +
        '<td>' + esc((t.last_message || '').slice(0, 80)) + '</td>' +
        '<td>' + fmtDate(t.last_message_at) + '</td>' +
        '<td>' + (t.unread > 0 ? badge(t.unread + ' new', 'alert') : '—') + '</td>' +
        '<td class="actions"><button class="btn" data-open="' + t.user_id + '">Open thread</button></td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
  panel.querySelectorAll('[data-open]').forEach(function(b){
    b.addEventListener('click', function(){
      CUST_VIEW_ID = b.getAttribute('data-open');
      show('customers');
    });
  });
}

          return '<tr><td><b>' + esc(e.mechanic_name || '') + '</b></td><td>' + esc(e.wo_number || '—') + '</td>' +
            '<td>' + fmtDate(e.clocked_in_at) + '</td>' +
            '<td class="actions"><button class="btn" data-out="' + e.id + '">Clock out</button></td></tr>';
        }).join('') + '</tbody></table></div>'
      : '') +
    '<div style="padding:12px 16px"><h3 style="margin:0 0 8px;font-size:13px">📋 Recent entries</h3>' +
      (entries.length
        ? '<table><thead><tr><th>Mechanic</th><th>WO</th><th>In</th><th>Out</th><th>Hours</th></tr></thead><tbody>' +

            return '<tr><td>' + esc(e.mechanic_name || '') + '</td><td>' + esc(e.wo_number || '—') + '</td>' +

              '<td>' + (e.hours != null ? Number(e.hours).toFixed(2) : '—') + '</td></tr>';

        : '<div class="empty">No time entries yet.</div>') +

        mechanic_id: mid, work_order_id: document.getElementById('tcWo').value || null,
      }});
      show('timeclock');
    } catch (e) { alert(e.message); }
  });
  panel.querySelectorAll('[data-out]').forEach(function(b){
    b.addEventListener('click', async function(){
      try { await api('/api/admin/time-entries/' + b.getAttribute('data-out') + '/clock-out', { method:'POST' }); show('timeclock'); }

  panel.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click', async function(){
      try { await api('/api/admin/schedule-blocks/' + b.getAttribute('data-del'), { method:'DELETE' }); renderSchedule(panel); }
      catch (e) { alert(e.message); }
    });
  });
}
function shiftSchedWeek(days){
  var d = SCHED_ANCHOR ? new Date(SCHED_ANCHOR) : new Date();
  d.setDate(d.getDate() + days);
  SCHED_ANCHOR = d.toISOString().slice(0, 10);
}

}

// One tab covering every transaction area, backed by /api/admin/reports/*.
// Both backends return money as USD floats (see the header comment on the
// reports block in server.js), so everything here can go straight to
// fmtMoney() without caring which one is serving.

var REPORT_DEFS = [
  { key:'z',           label:'🧾 Z Report (End of Day)', group:'Till' },
  { key:'x',           label:'👁 X Report (Live Till)',  group:'Till',      dated:false },
  { key:'sales',       label:'💵 Sales Summary',         group:'Sales' },
  { key:'products',    label:'📦 Products & Categories', group:'Sales' },
  { key:'returns',     label:'↩️ Returns & Refunds',     group:'Sales' },
  { key:'tax',         label:'🧮 Tax Collected',         group:'Sales' },
  { key:'orders',      label:'🛒 Online Orders',         group:'Sales' },
  { key:'workorders',  label:'🛠 Service / Work Orders', group:'Operations' },
  { key:'purchasing',  label:'📥 Purchasing & Receiving',group:'Operations' },
  { key:'inventory',   label:'🏗 Inventory Position',    group:'Operations', dated:false },
  { key:'labour',      label:'⏱ Labour Hours',           group:'Operations' },
  { key:'customers',   label:'👥 Customers & Loyalty',   group:'Operations' },
];

// Tables rendered by the current report, kept so "Export CSV" can serialise
// exactly what is on screen rather than re-querying.
var RPT_TABLES = [];
var RPT_CURRENT = 'z';
// Which till session the Z report is pinned to. null = most recent close.
var RPT_SESSION_ID = null;

function rMoney(v){ return v == null ? '—' : fmtMoney(v); }
function rNum(v){ return v == null ? '—' : Number(v).toLocaleString('en-US'); }
function rHours(v){ return v == null ? '—' : Number(v).toFixed(2); }

// cols: [{k, label, money:true, num:true, hours:true, right:true}]
function rptTable(title, cols, rows, emptyMsg){
  RPT_TABLES.push({ title: title, cols: cols, rows: rows || [] });
  var head = '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">' + title + '</div>';
  if (!rows || !rows.length) {
    return '<div class="panel">' + head + '<div class="empty">' + esc(emptyMsg || 'Nothing in this range.') + '</div></div>';
  }
  var th = cols.map(function(c){
    return '<th style="text-align:' + (c.right || c.money || c.num || c.hours ? 'right' : 'left') + '">' + esc(c.label) + '</th>';
  }).join('');
  var body = rows.map(function(r){
    return '<tr>' + cols.map(function(c){
      var v = r[c.k];
      var txt = c.money ? rMoney(v) : c.hours ? rHours(v) : c.num ? rNum(v) : (v == null || v === '' ? '—' : esc(String(v)));
      return '<td style="text-align:' + (c.right || c.money || c.num || c.hours ? 'right' : 'left') + '">' + txt + '</td>';
    }).join('') + '</tr>';
  }).join('');
  return '<div class="panel">' + head +
    '<table><thead><tr>' + th + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

function rptGrid(html){
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 18px 18px">' + html + '</div>';
}

function rptCsv(){
  if (!RPT_TABLES.length) return alert('Nothing to export yet.');
  var out = [];
  RPT_TABLES.forEach(function(t){
    out.push('"' + t.title.replace(/"/g, '""') + '"');
    out.push(t.cols.map(function(c){ return '"' + c.label.replace(/"/g, '""') + '"'; }).join(','));
    t.rows.forEach(function(r){
      out.push(t.cols.map(function(c){
        var v = r[c.k];
        if (v == null) return '';
        return '"' + String(v).replace(/"/g, '""') + '"';
      }).join(','));
    });
    out.push('');
  });
  var blob = new Blob([out.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'meltha-' + RPT_CURRENT + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

async function renderReports(panel){
  var today = new Date().toISOString().slice(0, 10);
  var groups = {};
  REPORT_DEFS.forEach(function(d){ (groups[d.group] = groups[d.group] || []).push(d); });

  panel.innerHTML =
    '<div style="display:grid;grid-template-columns:210px 1fr;gap:0;align-items:start">' +
      '<div class="panel" style="margin:16px 0 18px 18px">' +
        '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">📑 Reports</div>' +
        Object.keys(groups).map(function(g){
          return '<div style="padding:8px 14px 2px;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700">' + esc(g) + '</div>' +
            groups[g].map(function(d){
              return '<button class="rptPick" data-key="' + d.key + '" style="display:block;width:100%;text-align:left;padding:7px 14px;font-size:12.5px;background:none;border:0;border-left:3px solid transparent;cursor:pointer;font-family:inherit;color:inherit">' + d.label + '</button>';
            }).join('');
        }).join('') +
      '</div>' +
      '<div>' +
        '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:16px 18px 0">' +
          '<label class="lbl" style="margin:0">From</label><input type="date" id="rptFrom" value="' + today + '" class="fld" style="width:150px"/>' +
          '<label class="lbl" style="margin:0">To</label><input type="date" id="rptTo" value="' + today + '" class="fld" style="width:150px"/>' +
          '<button class="btn" data-preset="today">Today</button>' +
          '<button class="btn" data-preset="week">7d</button>' +
          '<button class="btn" data-preset="month">30d</button>' +
          '<button class="btn ok" id="rptRun">Run</button>' +
          '<button class="btn" id="rptCsvBtn">⬇ CSV</button>' +
          '<button class="btn" id="rptPrintBtn">🖨 Print</button>' +
        '</div>' +
        '<div id="rptBody"><div class="empty">Loading…</div></div>' +
      '</div>' +
    '</div>';

  function markActive(){
    Array.prototype.forEach.call(panel.querySelectorAll('.rptPick'), function(b){
      var on = b.getAttribute('data-key') === RPT_CURRENT;
      b.style.borderLeftColor = on ? 'var(--sky)' : 'transparent';
      b.style.background = on ? 'rgba(14,165,233,.10)' : 'none';
      b.style.fontWeight = on ? '700' : '400';
    });
  }

  Array.prototype.forEach.call(panel.querySelectorAll('.rptPick'), function(b){
    b.onclick = function(){
      RPT_CURRENT = b.getAttribute('data-key');
      RPT_SESSION_ID = null; // a pinned session shouldn't follow you to another report
      markActive();
      run();
    };
  });
  Array.prototype.forEach.call(panel.querySelectorAll('[data-preset]'), function(b){
    b.onclick = function(){
      var p = b.getAttribute('data-preset');
      var days = p === 'today' ? 0 : p === 'week' ? 6 : 29;
      document.getElementById('rptTo').value = today;
      document.getElementById('rptFrom').value = new Date(Date.now() - days * 86400000).toISOString().slice(0, 10);
      run();
    };
  });
  document.getElementById('rptRun').onclick = run;
  document.getElementById('rptCsvBtn').onclick = rptCsv;
  document.getElementById('rptPrintBtn').onclick = function(){ rptPrint(); };

  var LAST = null;

  async function run(){
    var box = document.getElementById('rptBody');
    var def = REPORT_DEFS.filter(function(d){ return d.key === RPT_CURRENT; })[0];
    var range = '?from=' + document.getElementById('rptFrom').value + '&to=' + document.getElementById('rptTo').value;
    var qs = def.dated === false ? '' : range;
    // The Z endpoint keys off a session, not a date range -- the range here
    // only decides which sessions the picker offers.
    if (RPT_CURRENT === 'z') qs = RPT_SESSION_ID ? '?session_id=' + RPT_SESSION_ID : '';
    box.innerHTML = '<div class="empty">Loading…</div>';
    RPT_TABLES = [];
    var r;
    try { r = await api('/api/admin/reports/' + RPT_CURRENT + qs); }
    catch (e) {
      LAST = null;
      box.innerHTML = '<div class="empty" style="padding:26px 18px">' + esc(e.message) + '</div>';
      return;
    }
    LAST = r;

    var head = '';
    if (RPT_CURRENT === 'z') {
      var sess = [];
      try { sess = (await api('/api/admin/reports/drawer-sessions' + range)).sessions || []; } catch (e2) { sess = []; }
      head = '<div style="padding:14px 18px 0;display:flex;gap:9px;align-items:center;flex-wrap:wrap">' +
        '<label class="lbl" style="margin:0">Till session</label>' +
        '<select id="rptSession" class="fld" style="width:auto;min-width:300px">' +
          '<option value="">(most recent close)</option>' +
          sess.map(function(s){
            return '<option value="' + s.id + '"' + (String(s.id) === String(r.session.id) ? ' selected' : '') + '>' +
              '#' + s.id + ' — ' + esc(fmtDate(s.opened_at)) +
              (s.closed_at ? ' → ' + esc(fmtDate(s.closed_at)) : ' (still open)') + '</option>';
          }).join('') +
        '</select>' +
        '<span style="font-size:11.5px;color:var(--muted)">Change the date range above to list other days.</span>' +
      '</div>';
    }
    box.innerHTML = head + RPT_RENDERERS[RPT_CURRENT](r);

    var selEl = document.getElementById('rptSession');
    if (selEl) selEl.onchange = function(){ RPT_SESSION_ID = selEl.value || null; run(); };
  }

  function rptPrint(){
    if (!LAST) return alert('Run a report first.');
    if (RPT_CURRENT === 'z' || RPT_CURRENT === 'x') return printTill(LAST);
    // Everything else prints as the on-screen tables.
    var html = '<div style="font-family:system-ui,sans-serif;padding:18px">' +
      '<h2 style="margin:0 0 4px">' + esc((REPORT_DEFS.filter(function(d){ return d.key === RPT_CURRENT; })[0] || {}).label || 'Report') + '</h2>' +
      '<div style="font-size:12px;color:#555;margin-bottom:14px">' +
        (LAST.from ? esc(LAST.from) + ' → ' + esc(LAST.to) : 'Snapshot') + '</div>' +
      RPT_TABLES.map(function(t){
        return '<h3 style="margin:16px 0 6px;font-size:13px">' + esc(t.title.replace(/<[^>]*>/g, '')) + '</h3>' +
          '<table style="font-size:12px"><thead><tr>' +
          t.cols.map(function(c){ return '<th style="text-align:left;border-bottom:1px solid #999;padding:3px 6px">' + esc(c.label) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
          t.rows.map(function(row){
            return '<tr>' + t.cols.map(function(c){
              var v = row[c.k];
              var txt = c.money ? rMoney(v) : c.hours ? rHours(v) : (v == null ? '—' : String(v));
              return '<td style="padding:3px 6px;border-bottom:1px solid #eee">' + esc(txt) + '</td>';
            }).join('') + '</tr>';
          }).join('') + '</tbody></table>';
      }).join('') + '</div>';
    posPrintWindow('Report', '', html);
  }

  markActive();
  run();
}

// ---- Till receipt (X / Z) -------------------------------------------------
// Printed on the same 80mm stationery as POS receipts so a Z can be spiked
// with the day's takings.
function printTill(r){
  function line(l, v, bold){
    return '<tr><td style="padding:1px 0">' + (bold ? '<b>' + esc(l) + '</b>' : esc(l)) + '</td>' +
           '<td style="padding:1px 0;text-align:right">' + (bold ? '<b>' + v + '</b>' : v) + '</td></tr>';
  }
  var rows = '';
  rows += line('Gross sales', rMoney(r.sales.subtotal));
  rows += line('Discounts', '-' + rMoney(r.sales.discount));
  rows += line('Tax', rMoney(r.sales.tax));
  rows += line('Total sales', rMoney(r.sales.total), true);
  rows += line('Refunds', '-' + rMoney(r.refund_total));
  rows += line('NET', rMoney(r.net_total), true);
  rows += line('Transactions', rNum(r.sales.count));
  rows += line('Units', rNum(r.sales.units));
  rows += line('Average ticket', rMoney(r.sales.avg_ticket));
  rows += line('Voids', rNum(r.voids.n) + ' / ' + rMoney(r.voids.total));

  var tenders = r.tenders.map(function(t){ return line(t.method, rMoney(t.total)); }).join('');
  var cash = '';
  cash += line('Opening float', rMoney(r.cash.opening_float));
  cash += line('Cash sales', rMoney(r.cash.cash_sales));
  cash += line('Cash refunds', '-' + rMoney(r.cash.cash_refunds));
  cash += line('Expected in drawer', rMoney(r.cash.expected), true);
  if (r.cash.counted != null) {
    cash += line('Counted', rMoney(r.cash.counted));
    cash += line('Variance', rMoney(r.cash.variance), true);
  }

  var body =
    '<div style="width:76mm;margin:0 auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;padding:8px 0">' +
      '<div style="text-align:center;font-weight:700;font-size:13px">MELTHA HONDA SALES &amp; SERVS</div>' +
      '<div style="text-align:center;font-size:10px">127 Hagley Park Road, Kingston 11</div>' +
      '<div style="text-align:center;margin:6px 0;font-weight:700;font-size:14px">' + esc(r.kind) + ' REPORT' +
        (r.kind === 'X' ? ' (LIVE)' : '') + '</div>' +
      '<div style="font-size:10px">Session #' + esc(String(r.session.id)) + '</div>' +
      '<div style="font-size:10px">Opened ' + esc(fmtDate(r.session.opened_at)) +
        (r.session.opener_name ? ' by ' + esc(r.session.opener_name) : '') + '</div>' +
      '<div style="font-size:10px">' + (r.session.closed_at
        ? 'Closed ' + esc(fmtDate(r.session.closed_at)) + (r.session.closer_name ? ' by ' + esc(r.session.closer_name) : '')
        : 'STILL OPEN — figures are provisional') + '</div>' +
      '<hr style="border:0;border-top:1px dashed #000;margin:6px 0"/>' +
      '<table style="width:100%">' + rows + '</table>' +
      '<hr style="border:0;border-top:1px dashed #000;margin:6px 0"/>' +
      '<div style="font-weight:700">TENDERS</div>' +
      '<table style="width:100%">' + (tenders || line('(none)', '')) + '</table>' +
      '<hr style="border:0;border-top:1px dashed #000;margin:6px 0"/>' +
      '<div style="font-weight:700">CASH RECONCILIATION</div>' +
      '<table style="width:100%">' + cash + '</table>' +
      '<hr style="border:0;border-top:1px dashed #000;margin:6px 0"/>' +
      '<table style="width:100%">' +
        line('Grand total (running)', rMoney(r.grand_total.total), true) +
        line('Lifetime transactions', rNum(r.grand_total.n)) +
      '</table>' +
      '<div style="text-align:center;font-size:9px;margin-top:8px">Printed ' + esc(new Date().toLocaleString()) + '</div>' +
    '</div>';
  posPrintWindow(r.kind + ' Report', '@page{size:80mm auto;margin:3mm}', body, 'width=420,height=800');
}

function tillHtml(r){
  var provisional = !r.final
    ? '<div style="margin:0 18px 12px;padding:9px 12px;border-radius:6px;background:rgba(234,179,8,.12);font-size:12px">' +
      '⚠ This till is still open — figures are provisional and will move until it is closed.</div>'
    : '';
  var v = r.cash.variance;
  var vCls = (v == null || Math.abs(v) < 0.005) ? '' : 'alert';
  return '<div style="padding:16px 18px 4px">' +
      '<div style="font-size:12.5px;margin-bottom:10px">' +
        '<b>Session #' + esc(String(r.session.id)) + '</b> · opened ' + esc(fmtDate(r.session.opened_at)) +
        (r.session.opener_name ? ' by <b>' + esc(r.session.opener_name) + '</b>' : '') +

async function renderCoupons(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r;
  try { r = await api('/api/admin/coupons'); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  panel.innerHTML =
    '<details style="border-bottom:1px solid var(--line);background:var(--card-soft)">' +
      '<summary style="padding:12px 16px;cursor:pointer;font-weight:700;color:var(--heading)">+ New coupon</summary>' +
      '<form id="newCoupon" style="padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:760px" onsubmit="event.preventDefault();submitCoupon();">' +
        '<div><label class="lbl">Code *</label><input id="cpnCode" required class="fld" style="text-transform:uppercase" placeholder="e.g. SUMMER10"/></div>' +
        '<div><label class="lbl">Kind</label><select id="cpnKind" class="fld"><option value="flat">Flat $ off</option><option value="percent">% off</option></select></div>' +
        '<div><label class="lbl">Amount *</label><input id="cpnAmount" type="number" min="0" step="0.01" required class="fld"/></div>' +
        '<div><label class="lbl">Min subtotal</label><input id="cpnMin" type="number" min="0" step="0.01" value="0" class="fld"/></div>' +
        '<div><label class="lbl">Max redemptions</label><input id="cpnMax" type="number" min="1" class="fld" placeholder="unlimited"/></div>' +
        '<div><label class="lbl">Expires</label><input id="cpnExpires" type="date" class="fld"/></div>' +
        '<div style="grid-column:1/-1"><label class="lbl">Description</label><input id="cpnDesc" class="fld"/></div>' +
        '<div id="cpnMsg" style="grid-column:1/-1;display:none;padding:10px 12px;border-radius:6px;font-size:13px"></div>' +
        '<button type="submit" style="grid-column:1/-1;background:var(--red);color:#fff;border:0;padding:11px 22px;border-radius:7px;font-weight:700;cursor:pointer">Save coupon</button>' +
      '</form>' +
    '</details>' +
    (r.coupons.length
      ? '<table><thead><tr><th>Code</th><th>Discount</th><th>Min order</th><th>Redeemed</th><th>Expires</th><th>Status</th><th></th></tr></thead><tbody>' +
        r.coupons.map(function(c){
          return '<tr' + (!c.is_active ? ' style="opacity:.55"' : '') + '>' +
            '<td><code style="font-weight:700">' + esc(c.code) + '</code>' + (c.description ? '<br/><small style="color:var(--muted)">' + esc(c.description) + '</small>' : '') + '</td>' +
            '<td>' + (c.kind === 'percent' ? c.amount + '%' : fmtMoney(c.amount)) + ' off</td>' +
            '<td>' + (c.min_subtotal > 0 ? fmtMoney(c.min_subtotal) : '—') + '</td>' +
            '<td>' + c.redeemed_count + (c.max_redemptions ? ' / ' + c.max_redemptions : '') + '</td>' +
            '<td>' + (c.expires_at ? new Date(c.expires_at).toLocaleDateString() : '—') + '</td>' +
            '<td>' + badge(c.is_active ? 'active' : 'inactive', c.is_active ? 'ok' : 'bad') + '</td>' +
            '<td class="actions"><button class="btn" data-toggle="' + esc(c.code) + '" data-active="' + c.is_active + '">' + (c.is_active ? 'Deactivate' : 'Reactivate') + '</button></td>' +
          '</tr>';
        }).join('') + '</tbody></table>'
      : '<div class="empty">No coupons yet — create one above.</div>');

  panel.querySelectorAll('[data-toggle]').forEach(function(b){
    b.addEventListener('click', async function(){
      var code = b.getAttribute('data-toggle');
      var wasActive = b.getAttribute('data-active') === 'true';
      try { await api('/api/admin/coupons/' + encodeURIComponent(code), { method:'PATCH', body: { is_active: !wasActive } }); show('coupons'); }
      catch (e) { alert(e.message); }
    });
  });
}
async function submitCoupon(){
  var msg = document.getElementById('cpnMsg');
  msg.style.display='block'; msg.style.background='#dbeafe'; msg.style.color='#1e40af'; msg.textContent='Saving…';
  try {
    await api('/api/admin/coupons', { method:'POST', body: {
      code: document.getElementById('cpnCode').value.trim().toUpperCase(),
      kind: document.getElementById('cpnKind').value,
      amount: document.getElementById('cpnAmount').value,
      min_subtotal: document.getElementById('cpnMin').value || 0,
      max_redemptions: document.getElementById('cpnMax').value || null,
      expires_at: document.getElementById('cpnExpires').value || null,
      description: document.getElementById('cpnDesc').value.trim() || null,
    }});
    show('coupons');
  } catch (e) { msg.style.background='#fee2e2'; msg.style.color='#b91c1c'; msg.textContent=e.message; }
}

  document.getElementById('gcBack').addEventListener('click', function(){ GC_VIEW_CODE = null; renderGiftCards(panel); });

async function submitGiftCardReload(code){
  var msg = document.getElementById('gcReloadMsg');
  msg.style.display = 'inline-block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';
  try {
    await api('/api/admin/gift-cards/' + encodeURIComponent(code) + '/reload', { method:'POST', body: {
      amount_usd: document.getElementById('gcReloadAmount').value,
    }});
    show('giftcards');
  } catch (e) {
    msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
  }
}

        '<div style="padding:14px 16px">' +
          (srvCfg.restart_required
            ? '<div style="background:#fef3c7;color:#92400e;padding:8px 11px;border-radius:6px;font-size:11.5px;margin-bottom:10px">Currently running on port <b>' + esc(srvCfg.running_port) + '</b>. A restart is needed to switch to the saved port <b>' + esc(srvCfg.configured_port) + '</b>.</div>'
            : '') +
          '<div style="max-width:200px;margin-bottom:10px"><label class="lbl">Port</label><input id="srvPort" type="number" min="1" max="65535" class="fld" value="' + (srvCfg.configured_port || srvCfg.running_port || 3040) + '"/></div>' +
          '<div style="font-size:11px;color:var(--muted);margin-bottom:10px">The port the app server listens on. Saving does not restart the server — re-run <code>start-melthahonda.bat</code> (or restart the Node process) for a changed port to take effect. There\'s no "fallback" port; this process listens on exactly one.</div>' +
          '<div id="setSrvMsg" style="display:none;padding:10px 14px;border-radius:7px;font-size:12.5px;margin-bottom:10px"></div>' +
          '<button type="button" id="setSrvSaveBtn" style="background:var(--navy);color:#fff;border:0;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13.5px">Save port</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  document.getElementById('setSaveBtn').addEventListener('click', submitSettings);
  document.getElementById('setLogoUpload').addEventListener('click', async function(){
    var f = document.getElementById('setLogoFile').files[0];
    var msg = document.getElementById('setLogoMsg');
    if (!f) { msg.style.color = '#b91c1c'; msg.textContent = 'Choose a file first.'; return; }
    msg.style.color = 'var(--muted)'; msg.textContent = 'Uploading…';
    try {
      var fd = new FormData(); fd.append('logo', f);
      var r = await fetch('/api/admin/settings/logo', { method: 'POST', body: fd, credentials: 'same-origin' });
      var d = await r.json();
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      document.getElementById('setLogoPreview').innerHTML = '<img src="' + esc(d.logo_url) + '" style="max-width:100%;max-height:100%;object-fit:contain"/>';
      POS_SHOP.logo_url = d.logo_url;
      msg.style.color = '#15803d'; msg.textContent = 'Logo updated.';
    } catch (e) { msg.style.color = '#b91c1c'; msg.textContent = e.message; }
  });

  document.getElementById('setMachineSaveBtn').addEventListener('click', async function(){
    var msg = document.getElementById('setMachineMsg');
    msg.style.color = 'var(--muted)'; msg.textContent = 'Saving…';
    try {
      await api('/api/admin/settings/machine', { method: 'PATCH', body: { name: document.getElementById('setMachineName').value.trim() } });
      msg.style.color = '#15803d'; msg.textContent = 'Saved.';
    } catch (e) { msg.style.color = '#b91c1c'; msg.textContent = e.message; }
  });

  var scanBtn = document.getElementById('setScanBtn');
  var netServersEl = document.getElementById('setNetServers');
  function wireNetUseButtons(){
    netServersEl.querySelectorAll('.netUseBtn').forEach(function(b){
      b.addEventListener('click', function(){
        var hostFld = document.getElementById('dbLocalHost'), portFld = document.getElementById('dbLocalPort');
        if (hostFld) hostFld.value = b.getAttribute('data-host');
        if (portFld) portFld.value = 5432; // the announced port is the app's HTTP port, not Postgres's -- 5432 is Postgres's own default, left editable
        var target = document.getElementById('dbLocalTest');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        var msg = document.getElementById('dbLocalTestMsg');
        if (msg) { msg.style.color = 'var(--muted)'; msg.textContent = 'Filled in from ' + b.getAttribute('data-host') + ' — check the port, then Test connection.'; }
      });
    });
  }
  wireNetUseButtons();
  if (scanBtn) scanBtn.addEventListener('click', async function(){
    scanBtn.disabled = true; scanBtn.textContent = '🔍 Scanning…';
    try {
      var r = await api('/api/admin/settings/network-servers/scan', { method: 'POST' });
      netServersEl.innerHTML = netServerRows(r.servers || []);
      wireNetUseButtons();
    } catch (e) {
      netServersEl.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">' + esc(e.message) + '</div>';
    } finally {
      scanBtn.disabled = false; scanBtn.textContent = '🔍 Scan for servers';
    }
  });

  function dbFieldValues(prefix){
    return {
      host: document.getElementById(prefix + 'Host').value.trim(),
      port: parseInt(document.getElementById(prefix + 'Port').value, 10) || 5432,
      database: document.getElementById(prefix + 'Db').value.trim(),
      user: document.getElementById(prefix + 'User').value.trim(),
      password: document.getElementById(prefix + 'Pass').value, // '' means "keep existing" server-side
    };
  }
  ['dbLocal', 'dbOnline'].forEach(function(prefix){
    var testBtn = document.getElementById(prefix + 'Test');
    if (!testBtn) return;
    testBtn.addEventListener('click', async function(){
      var msg = document.getElementById(prefix + 'TestMsg');
      var v = dbFieldValues(prefix);
      if (!v.host) { msg.style.color = '#b91c1c'; msg.textContent = 'Host is required.'; return; }
      msg.style.color = 'var(--muted)'; msg.textContent = 'Testing…';
      try {
        var r = await api('/api/admin/settings/database/test', { method: 'POST', body: v });
        if (r.ok) { msg.style.color = '#15803d'; msg.textContent = '✓ Connected.'; }
        else { msg.style.color = '#b91c1c'; msg.textContent = r.error || 'Could not connect.'; }
      } catch (e) { msg.style.color = '#b91c1c'; msg.textContent = e.message; }
    });
  });
  var dbSaveBtn = document.getElementById('setDbSaveBtn');
  if (dbSaveBtn) dbSaveBtn.addEventListener('click', async function(){
    var msg = document.getElementById('setDbMsg');
    msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';
    dbSaveBtn.disabled = true;
    try {
      var localV = dbFieldValues('dbLocal');
      var onlineV = dbFieldValues('dbOnline');
      var body = {
        local: localV.host ? localV : null,
        online: onlineV.host ? onlineV : null,
      };
      await api('/api/admin/settings/database', { method: 'PATCH', body: body });
      msg.style.background = '#dcfce7'; msg.style.color = '#166534';
      msg.textContent = 'Saved. Connections switched over immediately — no restart needed.';
    } catch (e) {
      msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
    } finally {
      dbSaveBtn.disabled = false;
    }
  });

  var dbRefreshBtn = document.getElementById('dbRefreshBtn');
  if (dbRefreshBtn) dbRefreshBtn.addEventListener('click', function(){ renderSettings(panel); });

  var dbCreateBtn = document.getElementById('dbCreateBtn');
  if (dbCreateBtn) dbCreateBtn.addEventListener('click', async function(){
    dbCreateBtn.disabled = true; dbCreateBtn.textContent = 'Creating…';
    try {
      await api('/api/admin/settings/db-server/create-database', { method: 'POST' });
      renderSettings(panel);
    } catch (e) {
      alert('Could not create the database: ' + e.message);
      dbCreateBtn.disabled = false; dbCreateBtn.textContent = 'Create the app database';
    }
  });

  var dbInstallBtn = document.getElementById('dbInstallBtn');
  if (dbInstallBtn) dbInstallBtn.addEventListener('click', async function(){
    if (!confirm('This runs the real PostgreSQL installer on the server machine (Windows, via winget). It can take several minutes and may need a permission prompt approved on that machine. Continue?')) return;
    var msg = document.getElementById('dbInstallMsg');
    dbInstallBtn.disabled = true; dbInstallBtn.textContent = '⏳ Installing…';
    msg.style.color = 'var(--muted)'; msg.textContent = 'Started — polling for completion…';
    try {
      await api('/api/admin/settings/db-server/install', { method: 'POST' });
    } catch (e) {
      msg.style.color = '#b91c1c'; msg.textContent = e.message;
      dbInstallBtn.disabled = false; dbInstallBtn.textContent = '⬇ Install PostgreSQL';
      return;
    }
    // Poll until the server reports the install finished, then refresh the
    // whole panel so the status/buttons reflect reality.
    var poll = setInterval(async function(){
      var st;
      try { st = await api('/api/admin/settings/db-server-status'); } catch (_) { return; }
      if (!st.install || !st.install.running) {
        clearInterval(poll);
        renderSettings(panel);
      }
    }, 5000);
  });

  var srvSaveBtn = document.getElementById('setSrvSaveBtn');
  if (srvSaveBtn) srvSaveBtn.addEventListener('click', async function(){
    var msg = document.getElementById('setSrvMsg');
    msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';
    srvSaveBtn.disabled = true;
    try {
      var r = await api('/api/admin/settings/server', { method: 'PATCH', body: { port: parseInt(document.getElementById('srvPort').value, 10) } });
      msg.style.background = '#dcfce7'; msg.style.color = '#166534';
      msg.textContent = r.restart_required
        ? 'Saved. Restart the server for port ' + r.configured_port + ' to take effect (currently still running on ' + r.running_port + ').'
        : 'Saved.';
    } catch (e) {
      msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
    } finally {
      srvSaveBtn.disabled = false;
    }
  });
}

async function submitSettings(){
  var msg = document.getElementById('setMsg');
  var btn = document.getElementById('setSaveBtn');
  msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Saving…';
  btn.disabled = true;
  try {
    var body = {
      company_name: document.getElementById('setName').value.trim(),
      address: document.getElementById('setAddress').value.trim(),
      country: document.getElementById('setCountry').value.trim(),
      phone: document.getElementById('setPhone').value.trim(),
      email: document.getElementById('setEmail').value.trim() || null,
      website: document.getElementById('setWebsite').value.trim() || null,
      print_logo_on_invoice: document.getElementById('setPrintLogo').checked,
      default_print_template: document.getElementById('setDefaultTpl').value,
      quote_valid_days: parseInt(document.getElementById('setQuoteDays').value, 10) || 14,
      invoice_notice: document.getElementById('setInvoiceNotice').value.trim(),
      receipt_notice: document.getElementById('setReceiptNotice').value.trim(),
      statement_notice: document.getElementById('setStatementNotice').value.trim(),
    };
    await api('/api/admin/settings', { method: 'PATCH', body: body });
    // Reflect immediately in POS_SHOP so a sale rung up right after saving
    // (no page reload) prints with the new info, not what loaded at page-open.
    Object.assign(POS_SHOP, {
      name: body.company_name, address: body.address, country: body.country, phone: body.phone,
      email: body.email, website: body.website, print_logo: body.print_logo_on_invoice,
      default_print_template: body.default_print_template,
      invoice_notice: body.invoice_notice, receipt_notice: body.receipt_notice, statement_notice: body.statement_notice,
    });
    msg.style.background = '#dcfce7'; msg.style.color = '#166534'; msg.textContent = 'Saved.';
  } catch (e) {
    msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

// ============= submitNewProduct (with location) =============
async function submitNewProduct(){
  var msg = document.getElementById('npMsg');
  msg.style.display = 'block';
  msg.style.background = '#dbeafe'; msg.style.color = '#1e40af';
  msg.textContent = 'Saving…';
  try {
    var w = document.getElementById('npImageWidget').__widget;
    var f = w ? w.getFile() : null;
    var url = w ? w.getUrl() : '';
    if (!f && !url) throw new Error('Please add a photo (camera/file/URL).');
    var fd = new FormData();
    if (f) fd.append('photo', f);
    if (url) fd.append('photo_url', url);
    fd.append('name', document.getElementById('npName').value.trim());
    fd.append('make_model', document.getElementById('npMakeModel').value.trim());
    fd.append('category', document.getElementById('npCategory').value);
    fd.append('condition', document.getElementById('npCondition').value);
    fd.append('price_usd', document.getElementById('npPrice').value || '0');
    fd.append('stock_count', document.getElementById('npStock').value || '0');
    fd.append('bin_location', document.getElementById('npBin').value.trim());
    fd.append('location', document.getElementById('npLocation').value);
    var res = await fetch('/api/admin/products', { method:'POST', body: fd, credentials:'same-origin' });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Save failed');
    msg.style.background = '#dcfce7';
    msg.style.color = '#166534';
    msg.textContent = 'Added';
    setTimeout(function(){ show('products'); }, 600);
  } catch (e) {
    msg.style.background = '#fee2e2';
    msg.style.color = '#b91c1c';
    msg.textContent = e.message;
  }
}



// =============================================================================
//  init() — called after successful sign-in (also on initial load if already
//  authenticated). Builds the sidebar and shows the default tab.
// =============================================================================
async function init(){
  try {
    buildSidebar();
    try { await loadSummary(); } catch (_) {}
    await show(currentTab || 'pos');
  } catch (e) {
    console.warn('[init] failed:', e);
    var p = document.getElementById('panel');
    if (p) p.innerHTML = '<div class="empty">Failed to load: ' + esc(e.message) + '</div>';
  }
}

// =============================================================================
//  BOOT — check existing session; show signin or proceed to admin UI.
// =============================================================================
document.addEventListener('DOMContentLoaded', async function(){
  var bg = document.getElementById('signinBg');
  if (!bg) return;
  try {
    var r = await api('/api/me');
    if (r && r.user && r.user.is_admin) {
      bg.classList.remove('show');
      CURRENT_ADMIN_ROLE = r.user.admin_role || 'manager';
      CURRENT_ADMIN_ID = r.user.id;
      var who = document.getElementById('whoLabel');
      if (who) who.textContent = (r.user.name || r.user.email) + ' · ' + CURRENT_ADMIN_ROLE;
      init();
    } else {
      bg.classList.add('show');
      var em = document.getElementById('adEmail'); if (em) em.focus();
    }
  } catch (e) {
    bg.classList.add('show');
    var em2 = document.getElementById('adEmail'); if (em2) em2.focus();
  }
});

</script>
