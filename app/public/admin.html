<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Meltha Honda Sales &amp; Servs</title>
<meta name="robots" content="noindex,nofollow" />
<script>
// Set the theme before first paint so there's no flash of the wrong colors.
// The click handler that flips this (and re-saves it) lives with the rest of
// the header wiring near the bottom of the main script, next to signoutBtn.
(function(){
  try {
    var t = localStorage.getItem('mh_theme');
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  } catch (_) {}
})();
</script>
<style>
  :root{
    --red:#d62828; --red-dark:#a31f1f;
    --sky:#0ea5e9; --sky-dark:#0284c7;
    --navy:#0b1b2b; --ink:#0f1720;
    --muted:#6b7280; --bg:#f6f7f9;
    --card:#fff; --line:#e5e7eb;
    --ok:#16a34a; --warn:#f59e0b;
    --card-soft:#fafafa; --card-soft2:#f3f4f6; --hover:#f1f5f9;
    /* Card/panel heading text -- same navy as the brand color in light mode,
       but --navy itself stays a fixed dark brand color in both themes (it's
       also used as a background -- header, sidebar, buttons -- which must
       stay dark-navy regardless of theme), so a plain dark-on-dark swap of
       --navy would go illegible on a dark card. Headings get their own token. */
    --heading:#0b1b2b;
  }
  /* Dark mode: same brand/status colors (red/sky/navy/ok/warn already read fine
     on both), only the neutral surface + text tokens swap. Toggled via a
     data-theme attribute on <html> set by the anti-flash script in <head>
     and by #themeToggle's click handler (see bottom of the main script). */
  :root[data-theme="dark"]{
    --ink:#e6e9ee; --muted:#93a1b5; --bg:#0d1420;
    --card:#17202e; --line:#2b3648;
    --card-soft:#1e2836; --card-soft2:#232e3f; --hover:#263244;
    --heading:#cfe0f5;
  }
  /* END THEME VARS */
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  a{color:inherit}
  header.top{background:var(--navy);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
  header.top h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.3px}
  header.top .who{font-size:13px;color:#cbd5e1;display:flex;gap:10px;align-items:center}
  header.top a.home{color:#94a3b8;text-decoration:none;font-size:13px}
  header.top a.home:hover{color:#fff}
  header.top button{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
  header.top button:hover{background:rgba(255,255,255,.08)}
  header.top button#themeToggle{padding:6px 10px;font-size:15px;line-height:1}
  .wrap{max-width:1480px;margin:0 auto;padding:0;display:grid;grid-template-columns:240px 1fr;gap:0;align-items:start}
  .sidebar{background:#0b1b2b;color:var(--line);padding:10px 0 40px;position:sticky;top:0;overflow-y:auto;height:100vh}
  .sidebar::-webkit-scrollbar{width:7px}
  .sidebar::-webkit-scrollbar-track{background:transparent}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
  .sidebar::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.30)}
  .sidebar .grp{margin-bottom:8px}
  .sidebar .grp-title{padding:6px 14px;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#94a3b8;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;border-radius:4px}
  .sidebar .grp-title:hover{background:rgba(255,255,255,.05);color:var(--line)}
  .sidebar .grp-title .chev{transition:transform .15s;font-size:10px;opacity:.6}
  .sidebar .grp.collapsed .grp-title .chev{transform:rotate(-90deg)}
  .sidebar .grp.collapsed .grp-items{display:none}
  .sidebar .grp-items{padding-top:2px}
  .sidebar .item{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 18px;font-size:13px;color:#cbd5e1;cursor:pointer;border-left:3px solid transparent;font-family:inherit;background:none;border-top:0;border-right:0;border-bottom:0;width:100%;text-align:left}
  .sidebar .item:hover{background:rgba(255,255,255,.05);color:#fff}
  .sidebar .item.active{background:rgba(14,165,233,.18);border-left-color:var(--sky);color:#fff;font-weight:700}
  .sidebar .item .star{margin-left:auto;color:#475569;cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:3px}
  .sidebar .item .star:hover{background:rgba(255,255,255,.08);color:#ffb703}
  .sidebar .item .star.on{color:#ffb703}
  .sidebar .item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sidebar .empty-fav{padding:5px 18px;font-size:11px;color:#64748b;font-style:italic}
  .content-area{padding:18px 22px;min-width:0}
  .menu-toggle{display:none}
  .wrap{transition:grid-template-columns .15s}
  .sbCollapseBtn{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.08);color:#94a3b8;padding:10px 0;cursor:pointer;font-size:12px;font-weight:700;text-align:center;font-family:inherit;letter-spacing:.3px}
  .sbCollapseBtn:hover{background:rgba(255,255,255,.06);color:#fff}
  @media (min-width:901px){
    /* Whole-sidebar collapse (desktop) -- separate from the existing
       per-group collapse (grp-title/chev, above): this hides the entire
       nav down to a slim rail with just the expand button, to reclaim
       width for the content area (the POS terminal in particular wants
       every inch it can get). Group-level collapse still works normally
       whenever the sidebar itself isn't collapsed. */
    .wrap.sb-collapsed{grid-template-columns:44px 1fr}
    .wrap.sb-collapsed .sidebar .grp{display:none}
  }
  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;display:block}
    .sidebar{position:fixed;left:-260px;top:0;bottom:0;width:240px;height:100vh;z-index:200;transition:left .2s;box-shadow:4px 0 16px rgba(0,0,0,.3)}
    .sidebar.show{left:0}
    .content-area{padding:14px}
    .menu-toggle{display:inline-block;background:var(--navy);color:#fff;border:0;padding:7px 12px;border-radius:6px;font-weight:700;cursor:pointer;font-family:inherit}
    /* The whole-sidebar collapse toggle is desktop-only -- on mobile the
       sidebar is already off-canvas by default and opened via ☰ Menu, so
       a second collapse control would be redundant. */
    .sbCollapseBtn{display:none}
  }
  .sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190}
  .sb-overlay.show{display:block}

  /* Full screen (POS terminal) -- hides the header/sidebar chrome and lets
     the content area use the whole viewport. Independent of the real
     browser Fullscreen API (which may be blocked); this CSS-only layout
     change is what actually does the work and always applies regardless of
     whether the browser grants real fullscreen. */
  body.pos-fullscreen header.top,
  body.pos-fullscreen .sidebar,
  body.pos-fullscreen .sbCollapseBtn { display:none !important; }
  body.pos-fullscreen .wrap { grid-template-columns:1fr !important; max-width:none; }
  body.pos-fullscreen .content-area { padding:8px; }
  body.pos-fullscreen .tiles { display:none !important; }

  .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:24px}
  @media(max-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:540px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  .tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
  .tile .val{font-size:28px;font-weight:900;color:var(--heading);line-height:1;margin-top:6px}
  .tile.warn .val{color:var(--warn)}
  .tile.alert .val{color:var(--red)}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;background:var(--card);padding:6px 6px 0;border-radius:10px 10px 0 0}
  .tabs button{background:transparent;border:none;padding:10px 16px;border-radius:8px 8px 0 0;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit;white-space:nowrap}
  .tabs button.active{background:var(--navy);color:#fff}
  .tabs button:hover:not(.active){background:var(--hover);color:var(--ink)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:var(--card-soft);text-align:left;padding:10px 12px;font-weight:700;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.5px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:hover td{background:var(--card-soft)}
  td.actions{white-space:nowrap}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .badge.new{background:#fef3c7;color:#92400e}
  .badge.pending{background:#dbeafe;color:#1e40af}
  .badge.confirmed{background:#d1fae5;color:#065f46}
  .badge.completed{background:#e0e7ff;color:#3730a3}
  .badge.cancelled{background:#fee2e2;color:#991b1b}
  .badge.won{background:#d1fae5;color:#065f46}
  .badge.lost{background:#fee2e2;color:#991b1b}
  .badge.quoted{background:#fef3c7;color:#92400e}
  .badge.approved{background:#d1fae5;color:#065f46}
  .badge.unapproved{background:#fee2e2;color:#991b1b}
  .badge.lowstock{background:#fef3c7;color:#92400e}
  .badge.outstock{background:#fee2e2;color:#991b1b}
  .badge.instock{background:#d1fae5;color:#065f46}
  /* Generic good/bad variants. badge(x,'ok') was already being called by the
     marketing and quote lists with no rule behind it, so those pills rendered
     unstyled. */
  .badge.ok{background:#d1fae5;color:#065f46}
  .badge.bad{background:#fee2e2;color:#991b1b}
  .badge.open{background:#dbeafe;color:#1e40af}
  .badge.accepted{background:#d1fae5;color:#065f46}
  .badge.declined{background:#fee2e2;color:#991b1b}
  .badge.converted{background:#e0e7ff;color:#3730a3}
  .badge.expired{background:var(--card-soft2);color:#4b5563}
  .badge.voided{background:#fee2e2;color:#991b1b}
  .badge.paid{background:#d1fae5;color:#065f46}

  button.btn{background:var(--navy);color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;margin-right:4px;font-family:inherit}
  button.btn:hover{background:var(--red)}
  button.btn.ok{background:var(--ok)}
  button.btn.ok:hover{background:#15803d}
  button.btn.del{background:var(--red)}
  button.btn.del:hover{background:var(--red-dark)}
  button.btn.ghost{background:var(--hover);color:var(--ink);border:1px solid var(--line)}
  button.btn.ghost:hover{background:var(--line);color:var(--ink)}
  select.statusEdit,input.stockEdit,input.priceEdit{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:inherit}
  input.stockEdit,input.priceEdit{width:80px}

  /* Form helper classes used by new renderers. Not scoped to `form` -- the POS
     panels lay fields out in plain divs (a till has no submit button to
     protect), and scoping these left every one of those inputs unstyled. */
  .fld{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;background:var(--card);box-sizing:border-box}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px}
  .fld-mini{padding:4px 6px;border:1px solid var(--line);border-radius:5px;font-size:11.5px;font-family:inherit;width:72px}

  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}
  .stars{color:#ffb703;letter-spacing:1px}

  /* SIGN-IN OVERLAY */
  .signin-bg{position:fixed;inset:0;background:rgba(11,27,43,.95);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .signin-bg.show{display:flex}
  .signin-card{background:var(--card);border-radius:14px;max-width:380px;width:100%;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
  .signin-card h2{margin:0 0 6px;font-size:22px}
  .signin-card p.sub{color:var(--muted);font-size:13px;margin:0 0 22px}
  .signin-card label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .signin-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:12px;font-family:inherit}
  .signin-card button{width:100%;background:var(--red);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit}
  .signin-card button:hover{background:var(--red-dark)}
  .signin-card .err{color:var(--red);font-size:12px;margin-bottom:10px;display:none}
  .signin-card .err.show{display:block}
  .signin-card .hint{font-size:11px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.5}
  .signin-card .hint code{background:var(--hover);padding:2px 5px;border-radius:4px;font-size:11px}

  /* INSPECTIONS */
  .insp-cat{margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .insp-cat h4{margin:0;padding:9px 14px;background:var(--card-soft2);font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .insp-cat h4 small{font-weight:600;font-size:11px}
  .insp-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:9px 14px;border-bottom:1px dashed var(--line);align-items:center;font-size:13px}
  .insp-item:last-child{border-bottom:0}
  .insp-item .name{font-weight:600}
  .insp-item .toggles{display:inline-flex;gap:3px}
  .insp-item .toggles button{padding:5px 9px;border:1px solid var(--line);background:var(--card);border-radius:5px;cursor:pointer;font-weight:700;font-size:11px;color:var(--muted);font-family:inherit;line-height:1}
  .insp-item .toggles button.pass.on{background:#16a34a;color:#fff;border-color:#16a34a}
  .insp-item .toggles button.attention.on{background:#f59e0b;color:#fff;border-color:#f59e0b}
  .insp-item .toggles button.fail.on{background:#dc2626;color:#fff;border-color:#dc2626}
  .insp-item .toggles button.na.on{background:var(--muted);color:#fff;border-color:var(--muted)}
  .insp-item .note{padding:5px 8px;border:1px solid var(--line);border-radius:5px;font-size:12px;font-family:inherit;width:170px}
  .insp-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px 0}
  .insp-photos .ph{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;cursor:pointer}
  .insp-photos .ph img{width:100%;height:120px;object-fit:cover;display:block}
  .insp-photos .ph .meta{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;padding:4px 6px;font-size:10.5px;font-weight:600;text-align:left}
  .insp-photos .ph .markCount{position:absolute;top:6px;right:6px;background:#dc2626;color:#fff;border-radius:999px;padding:2px 7px;font-size:10.5px;font-weight:800}
  .insp-photos .addbtn{display:flex;align-items:center;justify-content:center;border:2px dashed #cbd5e1;background:var(--card-soft);border-radius:8px;height:120px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);flex-direction:column;gap:6px}
  .insp-photos .addbtn:hover{background:var(--hover);border-color:#94a3b8}

  /* ANNOTATION OVERLAY */
  .anno-modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:6000;display:none;align-items:center;justify-content:center;flex-direction:column;padding:14px}
  .anno-modal.show{display:flex}
  .anno-modal .stage{position:relative;max-width:96vw;max-height:78vh;cursor:crosshair}
  .anno-modal .stage img{display:block;max-width:96vw;max-height:78vh;width:auto;height:auto;user-select:none;-webkit-user-drag:none}
  .anno-mark{position:absolute;background:rgba(220,38,38,.85);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.6);cursor:pointer;z-index:5}
  .anno-mark.amber{background:rgba(245,158,11,.9)}
  .anno-mark.green{background:rgba(22,163,74,.9)}
  .anno-mark .lbl{position:absolute;left:30px;top:-2px;background:rgba(0,0,0,.85);color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.2}
  .anno-tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
  .anno-tools button{padding:8px 14px;border:0;border-radius:6px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit}
  .anno-tools .red{background:#dc2626;color:#fff}
  .anno-tools .amber{background:#f59e0b;color:#fff}
  .anno-tools .green{background:#16a34a;color:#fff}
  .anno-tools .gray{background:#4b5563;color:#fff}
  .anno-tools .gray:hover{background:#374151}
  .anno-tools input{padding:8px 10px;border:0;border-radius:6px;font-size:12.5px;font-family:inherit;min-width:170px}
  .anno-status{color:#cbd5e1;font-size:12px;margin-top:8px}
</style>
</head>
<body>

<header class="top">
  <div style="display:flex;align-items:center;gap:14px">
    <div style="width:34px;height:34px;border-radius:8px;background:linear-gradient(160deg,#0ea5e9 52%,#d62828 52%);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.3)">MH</div>
    <h1>Meltha Honda · Admin</h1>
    <a class="home" href="/">← Public site</a>
  </div>
  <div class="who">
    <span id="whoLabel">—</span>
    <button id="themeToggle" type="button" title="Switch between light and dark mode">🌙</button>
    <button id="signoutBtn">Sign out</button>
  </div>
</header>

<div class="sb-overlay" id="sbOverlay"></div>
<div class="wrap">
  <nav class="sidebar" id="sidebar"><!-- populated by JS --></nav>
  <main class="content-area">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('show');document.getElementById('sbOverlay').classList.toggle('show')">☰ Menu</button>
      <div class="tiles" id="tiles" style="flex:1"></div>
    </div>
    <div class="panel" id="panel"><div class="empty">Loading…</div></div>
  </main>
</div>

<!-- SIGN-IN -->
<div class="signin-bg" id="signinBg">
  <form class="signin-card" id="signinForm" onsubmit="event.preventDefault(); doSignIn();">
    <h2>Admin sign-in</h2>
    <p class="sub">Restricted area. Use your admin account.</p>
    <div class="err" id="signinErr"></div>
    <label>Email</label>
    <input type="email" id="adEmail" required autocomplete="email" placeholder="admin@example.com" />
    <label>Password</label>
    <div style="position:relative">
      <input type="password" id="adPass" required autocomplete="current-password" style="padding-right:50px"/>
      <button type="button" id="adPassToggle" tabindex="-1" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;width:auto" title="Show / hide password">👁</button>
    </div>
    <button type="submit">Sign In</button>
    <div class="hint">
      <!-- The seeded credentials used to be printed here, next to a button that
           typed them into the form. Anyone who could reach this page could read
           them, so the page was handing out the admin account to the whole LAN.
           The recovery path stays (an operator who forgets the password still
           needs a way back in) but it is now a plain link that says what it
           does only once you click it. -->
      <button type="button" id="resetDefaultLink" style="background:none;border:0;color:var(--muted);font-size:11.5px;cursor:pointer;padding:4px;font-family:inherit;text-decoration:underline">Locked out? Recover admin access</button>
    </div>
  </form>
</div>

<script>
'use strict';

async function api(path, opts){
  opts = opts || {};
  var init = {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin'
  };
  if (opts.body) init.body = JSON.stringify(opts.body);
  var res = await fetch(path, init);
  var data = null;
  try { data = await res.json(); } catch(e){}
  if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
  return data;
}

function fmtDate(s){
  if (!s) return '';
  var d = new Date(s);
  return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
}
function fmtMoney(n){
  if (n == null) return '—';
  return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function badge(text, cls){ return '<span class="badge ' + cls + '">' + esc(text) + '</span>'; }

// Wires every <select class="statusEdit" data-id data-kind> in a container to
// PATCH the right endpoint on change. Called by renderInquiries/renderAppointments/
// renderOrders, but was never actually defined (2026-08-18 audit fix) -- every
// call threw ReferenceError at the very end of rendering, and show()'s catch-all
// wiped out the table those renderers had ALREADY built, replacing it with a
// bare error message. So those three tabs looked broken outright even though
// only the status dropdown itself needed fixing.
var STATUS_EDIT_ENDPOINTS = {
  inquiry:     function(id){ return '/api/admin/inquiries/' + id; },
  appointment: function(id){ return '/api/admin/appointments/' + id; },
  order:       function(id){ return '/api/admin/orders/' + id; },
};
function wireStatusSelects(container){
  container.querySelectorAll('.statusEdit').forEach(function(sel){
    var prev = sel.value;
    sel.addEventListener('change', async function(){
      var kind = sel.getAttribute('data-kind');
      var mk = STATUS_EDIT_ENDPOINTS[kind];
      if (!mk) { alert('Unknown status kind: ' + kind); sel.value = prev; return; }
      var id = sel.getAttribute('data-id');
      var next = sel.value;
      sel.disabled = true;
      try {
        await api(mk(id), { method:'PATCH', body: { status: next } });
        prev = next;
      } catch (e) {
        alert('Failed to update status: ' + e.message);
        sel.value = prev;
      } finally {
        sel.disabled = false;
      }
    });
  });
}

async function doSignIn(){
  var email = document.getElementById('adEmail').value.trim();
  var password = document.getElementById('adPass').value;
  var err = document.getElementById('signinErr');
  err.classList.remove('show');
  try {
    var r = await api('/api/auth/signin', { method:'POST', body:{ email: email, password: password } });
    if (!r.user || !r.user.is_admin){
      err.textContent = 'This account does not have admin access.';
      err.classList.add('show');
      return;
    }
    document.getElementById('signinBg').classList.remove('show');
    CURRENT_ADMIN_ROLE = r.user.admin_role || 'manager';
    CURRENT_ADMIN_ID = r.user.id;
    document.getElementById('whoLabel').textContent = (r.user.name || r.user.email) + ' · ' + CURRENT_ADMIN_ROLE;
    init();
  } catch(e){
    err.textContent = e.message || 'Sign-in failed.';
    err.classList.add('show');
  }
}

    try {
      var r = await fetch('/api/auth/reset-default-admin', { method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:'{}' });
      var text = await r.text();
      var d = null;
      try { d = JSON.parse(text); } catch (_) {
        // Not JSON — most likely the server hasn't been restarted since this endpoint was added.
        alert('⚠ The reset endpoint is not yet available on the server.\n\nThis means the server hasn\'t been restarted since the latest code update.\n\nRestart the admin server and try again, or sign in with the account the shop was set up with.');
        return;

      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      document.getElementById('adEmail').value = d.email;
      document.getElementById('adPass').value = d.password;
      alert('✓ Reset complete.\n\nEmail: ' + d.email + '\nPassword: ' + d.password + '\n\nClick Sign In to log in now.');

// ============= THEME (light / dark) =============
// The actual attribute is set before first paint by the inline script in
// <head> (reads the same localStorage key) so there's no flash on load --
// this just keeps the button in sync and handles the click.
(function(){
  var btn = document.getElementById('themeToggle');
  function current(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function paint(){ btn.textContent = current() === 'dark' ? '☀️' : '🌙'; }
  btn.addEventListener('click', function(){
    var next = current() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('mh_theme', next); } catch (_) {}
    paint();
  });
  paint();
})();

  fd.append('category', document.getElementById('npCategory').value);

  fd.append('price_usd', document.getElementById('npPrice').value || '');
  fd.append('stock_count', document.getElementById('npStock').value || '1');
  btn.disabled = true; btn.textContent = 'Uploading…';
  try {
    var res = await fetch('/api/admin/products', { method:'POST', body: fd, credentials:'same-origin' });

    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    msg.style.background = '#dcfce7'; msg.style.color = '#166534';

var FAV_KEY = 'mh_admin_favs';
function loadFavs(){ try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch (_) { return []; } }
function saveFavs(arr){ try { localStorage.setItem(FAV_KEY, JSON.stringify(arr)); } catch (_) {} }
function toggleFav(tab){
  var f = loadFavs();
  var i = f.indexOf(tab);
  if (i === -1) f.push(tab); else f.splice(i, 1);
  saveFavs(f);
  buildSidebar();

// Whole-sidebar collapse (distinct from per-group collapse right below --
// this hides the entire nav down to a slim rail; see the CSS comment on
// .wrap.sb-collapsed for why the two are kept separate).
var SB_COLLAPSED_KEY = 'mh_admin_sidebar_collapsed';
function isSidebarCollapsed(){ try { return localStorage.getItem(SB_COLLAPSED_KEY) === '1'; } catch (_) { return false; } }
function toggleSidebarCollapse(){
  var next = !isSidebarCollapsed();
  try { localStorage.setItem(SB_COLLAPSED_KEY, next ? '1' : '0'); } catch (_) {}
  var wrap = document.querySelector('.wrap');
  if (wrap) wrap.classList.toggle('sb-collapsed', next);
  var btn = document.getElementById('sbCollapseBtn');
  if (btn) { btn.textContent = next ? '»' : '« Collapse'; btn.title = next ? 'Expand menu' : 'Collapse menu'; }
}

var COLLAPSED_KEY = 'mh_admin_collapsed_groups';
function loadCollapsed(){ try { return JSON.parse(localStorage.getItem(COLLAPSED_KEY) || '[]'); } catch (_) { return []; } }
function saveCollapsed(arr){ try { localStorage.setItem(COLLAPSED_KEY, JSON.stringify(arr)); } catch (_) {} }
function toggleGroupCollapse(key){
  var c = loadCollapsed();
  var i = c.indexOf(key);
  if (i === -1) c.push(key); else c.splice(i, 1);
  saveCollapsed(c);
  var grp = document.querySelector('.sidebar .grp[data-grp="' + key + '"]');
  if (grp) grp.classList.toggle('collapsed');
}

function buildSidebar(){
  var sb = document.getElementById('sidebar');
  if (!sb) return;
  var favs = loadFavs();
  var collapsed = loadCollapsed();
  // Cashier accounts get a trimmed sidebar (see MANAGER_ONLY_TABS) -- the
  // real access control is requireManager() on the backend; this just keeps
  // a cashier from seeing tabs whose buttons would all 403.
  var groups = CURRENT_ADMIN_ROLE === 'cashier'
    ? SIDEBAR_GROUPS.map(function(g){ return { title: g.title, items: g.items.filter(function(it){ return MANAGER_ONLY_TABS.indexOf(it.tab) === -1; }) }; }).filter(function(g){ return g.items.length > 0; })
    : SIDEBAR_GROUPS;
  // Build label map for fav rendering
  var labelMap = {};
  groups.forEach(function(g){ g.items.forEach(function(it){ labelMap[it.tab] = it.label; }); });

  function grpClass(key){ return 'grp' + (collapsed.indexOf(key) !== -1 ? ' collapsed' : ''); }

  var sbCollapsed = isSidebarCollapsed();
  var wrapEl = document.querySelector('.wrap');
  if (wrapEl) wrapEl.classList.toggle('sb-collapsed', sbCollapsed);

  var html = '<button type="button" class="sbCollapseBtn" id="sbCollapseBtn" title="' +
    (sbCollapsed ? 'Expand menu' : 'Collapse menu') + '">' + (sbCollapsed ? '»' : '« Collapse') + '</button>';
  // Favourites group (also collapsible)
  html += '<div class="' + grpClass('__fav') + '" data-grp="__fav">' +
    '<div class="grp-title" data-toggle="__fav"><span>⭐ Favourites</span><span class="chev">▾</span></div>' +
    '<div class="grp-items">';
  if (favs.length === 0) {
    html += '<div class="empty-fav">Click ☆ next to any item to pin it here</div>';
  } else {
    favs.forEach(function(t){
      if (!labelMap[t]) return;
      html += '<button class="item ' + (currentTab===t?'active':'') + '" data-go="' + t + '"><span class="lbl">' + labelMap[t] + '</span><span class="star on" data-star="' + t + '">★</span></button>';
    });
  }
  html += '</div></div>';
  // Then all groups
  groups.forEach(function(g, gi){
    var key = 'g' + gi;
    html += '<div class="' + grpClass(key) + '" data-grp="' + key + '">' +
      '<div class="grp-title" data-toggle="' + key + '"><span>' + g.title + '</span><span class="chev">▾</span></div>' +
      '<div class="grp-items">';
    g.items.forEach(function(it){
      var isFav = favs.indexOf(it.tab) !== -1;
      html += '<button class="item ' + (currentTab===it.tab?'active':'') + '" data-go="' + it.tab + '">' +
        '<span class="lbl">' + it.label + '</span>' +
        '<span class="star ' + (isFav?'on':'') + '" data-star="' + it.tab + '" title="Pin to favourites">' + (isFav ? '★' : '☆') + '</span>' +
      '</button>';
    });
    html += '</div></div>';
  });
  sb.innerHTML = html;
  // Wire item clicks
  sb.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(e){
      if (e.target.dataset.star) return;
      currentTab = b.dataset.go;
      show(currentTab);
      sb.querySelectorAll('.item').forEach(function(x){ x.classList.toggle('active', x.dataset.go === currentTab); });
      if (window.innerWidth <= 900) {
        document.getElementById('sidebar').classList.remove('show');
        document.getElementById('sbOverlay').classList.remove('show');
      }
    });
  });
  // Wire star clicks
  sb.querySelectorAll('[data-star]').forEach(function(s){
    s.addEventListener('click', function(e){ e.stopPropagation(); toggleFav(s.dataset.star); });
  });
  // Wire group-title collapse toggles
  sb.querySelectorAll('[data-toggle]').forEach(function(t){
    t.addEventListener('click', function(){ toggleGroupCollapse(t.dataset.toggle); });
  });
  var sbBtn = document.getElementById('sbCollapseBtn');
  if (sbBtn) sbBtn.addEventListener('click', toggleSidebarCollapse);
}

async function show(tab){
  currentTab = tab;
  // The tender overlay and the POS modals are appended to <body>, not to the
  // panel, so leaving a tab while one is open used to leave it floating over
  // whatever came next with no way back to the button that closes it.
  if (typeof closeTenderModal === 'function') closeTenderModal();
  if (typeof posCloseModal === 'function') posCloseModal();
  var panel = document.getElementById('panel');
  panel.innerHTML = '<div class="empty">Loading…</div>';
  // Reflect active state in the sidebar
  document.querySelectorAll('.sidebar .item').forEach(function(x){ x.classList.toggle('active', x.dataset.go === tab); });
  // The KPI tile strip eats vertical space every dense list-based tab wants
  // back, and the POS terminal wants it most -- it sizes its own results
  // list/cart to the viewport height (see posPageSize()/the pos-shell grid
  // in renderPOS). Hide it there; every other tab keeps it as-is.
  var tiles = document.getElementById('tiles');
  if (tiles) tiles.style.display = (tab === 'pos') ? 'none' : '';
  try { await renderers[tab](panel); }
  catch(e){ panel.innerHTML = '<div class="empty">Error: ' + esc(e.message) + '</div>'; }
}

async function renderInquiries(panel){
  var r = await api('/api/admin/inquiries');
  if (!r.inquiries.length) return panel.innerHTML = '<div class="empty">No inquiries yet.</div>';
  panel.innerHTML = '<table><thead><tr>' +
    '<th>When</th><th>Customer</th><th>Vehicle</th><th>Part needed</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>' +
    r.inquiries.map(function(i){
      var veh = [i.vehicle_year, i.vehicle_make, i.vehicle_model].filter(Boolean).join(' ');
      // Inline photos live in D1 while R2 is off, so both cases go through the
      // admin photo route rather than linking photo_path directly.
      var photoUrl = i.has_photo ? '/api/admin/inquiries/' + i.id + '/photo' : '';
      var photo = photoUrl
        ? '<a href="' + photoUrl + '" target="_blank" rel="noopener" title="View full size"><img src="' + photoUrl + '" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin-top:6px;display:block;cursor:zoom-in"/></a>'
        : '';
      // A cart request carries the actual part numbers — show them as a pick
      // list rather than the flattened summary line.
      var items = [];
      if (i.items_json) { try { items = JSON.parse(i.items_json) || []; } catch(e){ items = []; } }
      var need = items.length
        ? '<div style="display:flex;flex-direction:column;gap:3px">' + items.map(function(it){
            return '<div style="font-size:12.5px"><b>' + it.qty + ' ×</b> ' + esc(it.name) +
              (it.img && it.img !== it.name ? ' <code style="font-size:11px;color:var(--muted)">' + esc(it.img) + '</code>' : '') +
              (it.make_model ? '<br/><small style="color:var(--muted);padding-left:18px">' + esc(it.make_model) + '</small>' : '') +
            '</div>';
          }).join('') + '</div>'
        : esc(i.part_description);
      var src = i.source === 'cart'
        ? '<small style="display:inline-block;background:#dbeafe;color:#1d4ed8;font-weight:700;padding:1px 6px;border-radius:4px;font-size:10.5px;margin-bottom:4px">🛒 CART QUOTE</small><br/>'
        : '';
      return '<tr>' +
        '<td>' + fmtDate(i.created_at) + '</td>' +
        '<td><b>' + esc(i.name) + '</b><br/><small><a href="tel:' + esc(i.phone) + '">' + esc(i.phone) + '</a></small>' +
          (i.email ? '<br/><small><a href="mailto:' + esc(i.email) + '">' + esc(i.email) + '</a></small>' : '') + '</td>' +
        '<td>' + esc(veh) + (i.condition ? '<br/><small>' + esc(i.condition) + '</small>' : '') + '</td>' +
        '<td>' + src + need + photo + '</td>' +
        '<td>' + badge(i.status, i.status) + '</td>' +
        '<td class="actions"><select class="statusEdit" data-id="' + i.id + '" data-kind="inquiry">' +
          ['new','quoted','won','lost'].map(function(s){
            return '<option value="' + s + '"' + (s===i.status?' selected':'') + '>' + s + '</option>';
          }).join('') +
        '</select></td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
  wireStatusSelects(panel);
}

var apptView = 'list';
var apptWeekAnchor = null; // Date or null = "this week"
async function renderAppointments(panel){
  var toolbar =
    '<div style="padding:12px 16px;background:var(--card-soft);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      '<div class="seg-toggle" style="display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden">' +
        '<button class="seg-btn ' + (apptView==='list'?'on':'') + '" data-view="list" style="padding:7px 14px;background:' + (apptView==='list'?'var(--navy)':'var(--card)') + ';color:' + (apptView==='list'?'#fff':'var(--ink)') + ';border:0;font-weight:700;cursor:pointer;font-size:12.5px">📋 List</button>' +
        '<button class="seg-btn ' + (apptView==='calendar'?'on':'') + '" data-view="calendar" style="padding:7px 14px;background:' + (apptView==='calendar'?'var(--navy)':'var(--card)') + ';color:' + (apptView==='calendar'?'#fff':'var(--ink)') + ';border:0;font-weight:700;cursor:pointer;font-size:12.5px">🗓 Calendar</button>' +
      '</div>' +
      (apptView==='calendar' ?
        '<button class="btn" id="weekPrev" style="margin-left:auto">‹ Prev</button>' +
        '<button class="btn" id="weekThis">This week</button>' +
        '<button class="btn" id="weekNext">Next ›</button>' : '') +
    '</div>';
  panel.innerHTML = toolbar + '<div id="apptBody"><div class="empty">Loading…</div></div>';
  panel.querySelectorAll('.seg-btn').forEach(function(b){
    b.addEventListener('click', function(){ apptView = b.dataset.view; renderAppointments(panel); });
  });
  if (apptView === 'calendar'){
    var prev = document.getElementById('weekPrev'), thisW = document.getElementById('weekThis'), nextW = document.getElementById('weekNext');
    if (prev) prev.addEventListener('click', function(){ shiftWeek(-7); renderAppointments(panel); });
    if (thisW) thisW.addEventListener('click', function(){ apptWeekAnchor = null; renderAppointments(panel); });
    if (nextW) nextW.addEventListener('click', function(){ shiftWeek(7); renderAppointments(panel); });
    await renderApptCalendar(document.getElementById('apptBody'));
  } else {
    await renderApptList(document.getElementById('apptBody'));
  }
}
function shiftWeek(days){
  var d = apptWeekAnchor ? new Date(apptWeekAnchor) : new Date();
  d.setDate(d.getDate() + days);
  apptWeekAnchor = d;
}
async function renderApptList(box){
  var r = await api('/api/admin/appointments');
  if (!r.appointments.length) return box.innerHTML = '<div class="empty">No service appointments yet.</div>';
  box.innerHTML = '<table><thead><tr>' +
    '<th>When</th><th>Customer</th><th>Vehicle</th><th>Service</th><th>Slot</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>' +
    r.appointments.map(function(a){
      var veh = [a.vehicle_year, a.vehicle_make, a.vehicle_model].filter(Boolean).join(' ');
      var slot = a.preferred_date ? new Date(a.preferred_date).toLocaleDateString() : '—';
      if (a.time_slot) slot += ' · ' + a.time_slot;
      return '<tr>' +
        '<td>' + fmtDate(a.created_at) + '</td>' +
        '<td><b>' + esc(a.name) + '</b><br/><small>' + esc(a.phone) + (a.email ? ' · ' + esc(a.email) : '') + '</small></td>' +
        '<td>' + esc(veh) + '</td>' +
        '<td>' + esc(a.service_type || '—') + (a.notes ? '<br/><small style="color:var(--muted)">' + esc(a.notes) + '</small>' : '') + '</td>' +
        '<td>' + esc(slot) + '</td>' +
        '<td>' + badge(a.status, a.status) + '</td>' +
        '<td class="actions"><select class="statusEdit" data-id="' + a.id + '" data-kind="appointment">' +
          ['pending','confirmed','completed','cancelled'].map(function(s){
            return '<option value="' + s + '"' + (s===a.status?' selected':'') + '>' + s + '</option>';
          }).join('') +
        '</select></td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
  wireStatusSelects(box);
}
async function renderApptCalendar(box){
  var qs = apptWeekAnchor ? '?week=' + apptWeekAnchor.toISOString().slice(0,10) : '';
  var r = await api('/api/admin/appointments/calendar' + qs);
  var start = new Date(r.week_start + 'T00:00:00');
  var days = [];
  for (var i=0; i<6; i++){ var d = new Date(start); d.setDate(start.getDate() + i); days.push(d); }
  var slots = ['8:00 AM','9:00 AM','10:00 AM','11:00 AM','12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM'];
  // Bucket appointments by date+slot
  var byDay = {};
  (r.appointments || []).forEach(function(a){
    var ds = a.preferred_date ? new Date(a.preferred_date).toISOString().slice(0,10) : '';
    var key = ds + '|' + (a.time_slot || '—');
    (byDay[key] = byDay[key] || []).push(a);
  });
  var hdr = '<div style="padding:10px 16px;font-size:13px;color:var(--muted);background:var(--card);border-bottom:1px solid var(--line)">Week of ' +
    start.toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'}) +
    ' — <b>' + (r.appointments||[]).length + '</b> appointment(s)</div>';
  var grid =
    '<div style="overflow:auto"><table class="cal" style="border-collapse:collapse;width:100%;min-width:780px;font-size:12px">' +
      '<thead><tr><th style="background:var(--card-soft2);padding:8px;border:1px solid var(--line);width:90px">Slot</th>' +
        days.map(function(d){
          var iso = d.toISOString().slice(0,10);
          var isToday = iso === new Date().toISOString().slice(0,10);
          return '<th style="background:' + (isToday?'#fef3c7':'var(--card-soft2)') + ';padding:8px;border:1px solid var(--line);text-align:left">' +
            d.toLocaleDateString('en-US',{weekday:'short'}) +
            '<br/><small style="font-weight:400;color:var(--muted)">' + d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + '</small></th>';
        }).join('') +
      '</tr></thead><tbody>' +
      slots.map(function(slot){
        return '<tr><td style="background:var(--card-soft);padding:8px;border:1px solid var(--line);font-weight:700;font-size:11.5px;color:var(--muted);vertical-align:top">' + slot + '</td>' +
          days.map(function(d){
            var iso = d.toISOString().slice(0,10);
            var key = iso + '|' + slot;
            var bks = byDay[key] || [];
            return '<td style="padding:4px;border:1px solid var(--line);vertical-align:top;min-height:46px;height:46px">' +
              bks.map(function(a){
                var veh = [a.vehicle_year, a.vehicle_make, a.vehicle_model].filter(Boolean).join(' ');
                var cls = a.status === 'confirmed' ? '#16a34a' : a.status === 'completed' ? 'var(--muted)' : a.status === 'cancelled' ? '#ef4444' : '#f59e0b';
                return '<div title="' + esc(a.name + ' · ' + a.phone + (veh ? ' · ' + veh : '') + (a.service_type ? ' · ' + a.service_type : '')) + '" style="background:' + cls + ';color:#fff;padding:3px 6px;border-radius:4px;margin-bottom:2px;font-size:11px;font-weight:600;cursor:help">' +
                  esc(a.name.split(' ')[0]) + (veh ? ' · ' + esc(a.vehicle_make || '') : '') +
                '</div>';
              }).join('') +
            '</td>';
          }).join('') +
        '</tr>';
      }).join('') +
    '</tbody></table></div>' +
    '<div style="padding:10px 16px;font-size:11.5px;color:var(--muted);background:var(--card-soft);border-top:1px solid var(--line)">' +
      '<b>Legend:</b> ' +
      '<span style="display:inline-block;width:10px;height:10px;background:#f59e0b;border-radius:2px;vertical-align:middle"></span> Pending · ' +
      '<span style="display:inline-block;width:10px;height:10px;background:#16a34a;border-radius:2px;vertical-align:middle"></span> Confirmed · ' +
      '<span style="display:inline-block;width:10px;height:10px;background:var(--muted);border-radius:2px;vertical-align:middle"></span> Completed · ' +
      '<span style="display:inline-block;width:10px;height:10px;background:#ef4444;border-radius:2px;vertical-align:middle"></span> Cancelled' +
    '</div>';
  box.innerHTML = hdr + grid;
}

async function renderNotifications(panel){
  var r = await api('/api/admin/notifications');
  var actionBar = '<div style="padding:14px 16px;background:var(--card-soft);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
    '<small style="color:var(--muted);font-size:12px">Click below to email everyone waiting on a product that\'s now back in stock.</small>' +
    '<button class="btn ok" id="blastBtn">🔔 Send back-in-stock alerts</button>' +
    '</div>';
  if (!r.notifications.length){
    panel.innerHTML = actionBar + '<div class="empty">No notify-me subscriptions yet.</div>';
  } else {
    panel.innerHTML = actionBar +
      '<table><thead><tr>' +
      '<th>When</th><th>Product</th><th>Stock</th><th>Email</th><th>Phone</th><th>Notified</th>' +
      '</tr></thead><tbody>' +
      r.notifications.map(function(n){
        var stockBadge = n.stock_count > 0
          ? badge('in stock ' + n.stock_count, 'instock')
          : badge('out', 'outstock');
        return '<tr>' +
          '<td>' + fmtDate(n.created_at) + '</td>' +
          '<td>' + esc(n.product_name || n.product_img) + '</td>' +
          '<td>' + stockBadge + '</td>' +
          '<td>' + esc(n.email) + '</td>' +
          '<td>' + esc(n.phone || '—') + '</td>' +
          '<td>' + (n.notified_at ? fmtDate(n.notified_at) : '<small style="color:var(--muted)">not yet</small>') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>';
  }
  document.getElementById('blastBtn').addEventListener('click', async function(){
    var b = document.getElementById('blastBtn');
    var orig = b.textContent;
    b.textContent = 'Sending…';
    b.disabled = true;
    try {
      var res = await api('/api/admin/notify-back-in-stock', { method:'POST' });
      alert('Back-in-stock blast sent.\n\n' +
            'Candidates: ' + res.candidates + '\n' +
            'Emails:     ' + (res.emails_sent || 0) + '\n' +
            'SMS:        ' + (res.sms_sent || 0));
      loadSummary();
      show(currentTab);
    } catch(e){
      alert('Failed: ' + e.message);
      b.textContent = orig;
      b.disabled = false;
    }
  });
}

async function renderReviews(panel){
  var r = await api('/api/admin/reviews');
  if (!r.reviews.length) return panel.innerHTML = '<div class="empty">No reviews yet.</div>';
  panel.innerHTML = '<table><thead><tr>' +
    '<th>When</th><th>Customer</th><th>Rating</th><th>Review</th><th>Vehicle</th><th>Status</th><th></th>' +
    '</tr></thead><tbody>' +
    r.reviews.map(function(v){
      var stars = '★★★★★'.slice(0, v.rating) + '☆☆☆☆☆'.slice(0, 5 - v.rating);
      return '<tr>' +
        '<td>' + fmtDate(v.created_at) + '</td>' +
        '<td><b>' + esc(v.name) + '</b>' + (v.city ? '<br/><small>' + esc(v.city) + '</small>' : '') + '</td>' +
        '<td><span class="stars">' + stars + '</span></td>' +
        '<td>' + esc(v.body) + '</td>' +
        '<td>' + esc(v.vehicle || '—') + '</td>' +
        '<td>' + (v.approved ? badge('approved','approved') : badge('pending','unapproved')) + '</td>' +
        '<td class="actions">' +
          (v.approved
            ? '<button class="btn ghost" data-id="' + v.id + '" data-do="unapprove">Unapprove</button>'
            : '<button class="btn ok" data-id="' + v.id + '" data-do="approve">Approve</button>') +
          '<button class="btn del" data-id="' + v.id + '" data-do="delete">Delete</button>' +
        '</td>' +
      '</tr>';
    }).join('') + '</tbody></table>';
  panel.querySelectorAll('[data-do]').forEach(function(b){
    b.addEventListener('click', async function(){
      var id = b.dataset.id;
      try {
        if (b.dataset.do === 'approve') await api('/api/admin/reviews/' + id, { method:'PATCH', body:{ approved: true } });
        else if (b.dataset.do === 'unapprove') await api('/api/admin/reviews/' + id, { method:'PATCH', body:{ approved: false } });
        else if (b.dataset.do === 'delete'){
          if (!confirm('Delete this review permanently?')) return;
          await api('/api/admin/reviews/' + id, { method:'DELETE' });
        }
        loadSummary();
        show(currentTab);
      } catch(e){ alert(e.message); }
    });
  });
}

// ============= PRODUCTS (with location field) =============
// Like the POS, this searches the server: the catalogue is ~23,000 parts and
// the old version pulled every one of them and rendered a table row each.
var PROD_PAGE_SIZE = 50;
var PROD_STATE = { q:'', cat:'', inStock:false, offset:0, rows:[] };

async function renderProducts(panel){
  // The category list has to match what's actually stored, or filtering (and
  // any part added through this form) silently misses every existing row.
  var cats = POS_CATEGORIES;
  var locs = ['Main Warehouse','Service Bay','Branch B','Showroom','Receiving','Other'];
  var addPanel =
    '<div style="padding:8px 16px;background:var(--card-soft);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
      '<label class="btn" style="background:#fef3c7;color:#92400e;cursor:pointer;margin:0">📥 Import parts from CSV<input type="file" id="partsCsvInput" accept=".csv,text/csv" style="display:none"/></label>' +
      '<a class="btn" href="data:text/csv;charset=utf-8,img,name,make_model,category,condition,price_usd,cost_usd,stock_count,sku,location%0Aimg/abc.jpg,Front bumper,2020 Honda Accord,Bumpers,USED,180,120,3,BMP-001,Main Warehouse" download="parts-template.csv" style="text-decoration:none;background:var(--card-soft2)">📄 Template</a>' +
      '<small style="color:var(--muted);margin-left:auto">Columns: img · name · make_model · category · condition · price_usd · cost_usd · stock_count · sku · location</small>' +
    '</div>' +
    '<details style="border-bottom:1px solid var(--line);background:var(--card-soft)">' +
      '<summary style="padding:14px 16px;cursor:pointer;font-weight:700;font-size:14px;color:var(--heading);user-select:none">+ Add new part (or 📸 snap a photo)</summary>' +
      '<div style="padding:16px 18px">' +
        '<form id="newProdForm" onsubmit="event.preventDefault();submitNewProduct();" enctype="multipart/form-data" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:880px">' +
          '<div style="grid-column:1/-1" id="npImageWidget"></div>' +
          '<div><label class="lbl">Part name *</label><input id="npName" required placeholder="e.g. AC Compressor" class="fld"/></div>' +
          '<div><label class="lbl">Vehicle / fitment</label><input id="npMakeModel" placeholder="e.g. 2020 Honda Accord" class="fld"/></div>' +
          '<div><label class="lbl">Category *</label><select id="npCategory" required class="fld">' +
            cats.map(function(c){ return '<option value="' + c[0] + '">' + c[1] + '</option>'; }).join('') +
          '</select></div>' +
          '<div><label class="lbl">Condition</label><select id="npCondition" class="fld"><option value="USED" selected>USED</option><option value="NEW">NEW</option></select></div>' +
          '<div><label class="lbl">Price (USD)</label><input id="npPrice" type="number" step="0.01" min="0" placeholder="0.00" class="fld"/></div>' +
          '<div><label class="lbl">Stock count</label><input id="npStock" type="number" min="0" value="1" class="fld"/></div>' +
          '<div><label class="lbl">Bin / Rack</label><input id="npBin" placeholder="e.g. A-12" class="fld"/></div>' +
          '<div><label class="lbl">📍 Location</label>' +
            '<select id="npLocation" class="fld">' +
              locs.map(function(l){ return '<option value="' + l + '">' + l + '</option>'; }).join('') +
            '</select></div>' +
          '<div id="npMsg" style="grid-column:1/-1;display:none;padding:10px 12px;border-radius:6px;font-size:13px"></div>' +
          '<button type="submit" id="npSubmit" style="grid-column:1/-1;background:var(--red);color:#fff;border:0;border-radius:7px;padding:11px 22px;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit;margin-top:6px">Add Part to Inventory</button>' +
        '</form>' +
      '</div>' +
    '</details>';
  var toolbar =
    '<div style="padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      '<input id="prodSearch" placeholder="Search part no., name or vehicle…" autocomplete="off" value="' + esc(PROD_STATE.q) + '" style="flex:1;min-width:220px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-size:13px"/>' +
      '<select id="prodCat" style="padding:9px;border:1px solid var(--line);border-radius:6px"><option value="">All categories</option>' +
        cats.map(function(c){ return '<option value="'+c[0]+'"' + (PROD_STATE.cat===c[0]?' selected':'') + '>'+c[1]+'</option>'; }).join('') +
      '</select>' +
      '<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap"><input type="checkbox" id="prodInStock"' + (PROD_STATE.inStock?' checked':'') + '/> In stock only</label>' +
      '<span id="prodStatus" style="font-size:12.5px;color:var(--muted);margin-left:auto"></span>' +
    '</div>';

  panel.innerHTML = addPanel + toolbar + '<div id="prodList"></div>';
  mountImageWidget('npImageWidget', 'npPhotoHidden');

  var seq = 0;
  var debounce = null;

  async function load(append){
    var list = document.getElementById('prodList');
    var status = document.getElementById('prodStatus');
    if (!append){
      PROD_STATE.offset = 0;
      PROD_STATE.rows = [];
    }
    var mySeq = ++seq;
    status.textContent = 'Loading…';

    var qs = 'limit=' + PROD_PAGE_SIZE + '&offset=' + PROD_STATE.offset;
    if (PROD_STATE.q) qs += '&q=' + encodeURIComponent(PROD_STATE.q);
    if (PROD_STATE.cat) qs += '&category=' + encodeURIComponent(PROD_STATE.cat);
    if (PROD_STATE.inStock) qs += '&in_stock=1';

    var resp, total = null;
    try {
      resp = await api('/api/products?' + qs);
      if (!append){
        var cq = 'in_stock=' + (PROD_STATE.inStock ? '1' : '0') + (PROD_STATE.cat ? '&category=' + encodeURIComponent(PROD_STATE.cat) : '');
        // /products/count doesn't filter by q, so only claim a total when the
        // count actually covers what's on screen.
        if (!PROD_STATE.q){
          try { total = (await api('/api/products/count?' + cq)).count; } catch (_) {}
        }
      }
    } catch (e) {
      if (mySeq !== seq) return;
      status.textContent = '';
      list.innerHTML = '<div class="empty">Could not load parts: ' + esc(e.message || 'unknown error') + '</div>';
      return;
    }
    if (mySeq !== seq) return;

    var got = resp.products || [];
    PROD_STATE.rows = PROD_STATE.rows.concat(got);
    PROD_STATE.offset += got.length;

    if (!PROD_STATE.rows.length){
      status.textContent = '';
      list.innerHTML = '<div class="empty">No parts match that search.</div>';
      return;
    }

    list.innerHTML = '<table><thead><tr>' +
      '<th>Part</th><th>Cat.</th><th>Cond.</th><th>Loc.</th><th>Bin</th><th>Price (USD)</th><th>Stock</th><th>Lvl</th><th></th>' +
      '</tr></thead><tbody>' +
      PROD_STATE.rows.map(function(p){
        var lvl = p.stock_level === 'out' ? badge('out','outstock') : p.stock_level === 'low' ? badge('low','lowstock') : badge('in','instock');
        // /api/products returns price_usd (a plain dollar amount), not
        // price_cents -- a prior "fix" had this backwards and made every
        // price box render empty regardless of what was actually in the DB.
        var usd = p.price_usd != null ? p.price_usd : '';
        return '<tr>' +
          '<td>' + esc(p.name) + '<br/><code style="font-size:11px;color:var(--muted)">' + esc(p.img) + '</code>' +
            (p.make_model ? '<br/><small style="color:var(--muted)">' + esc(p.make_model) + '</small>' : '') + '</td>' +
          '<td>' + esc(p.category || '') + '</td>' +
          '<td>' + esc(p.condition || '') + '</td>' +
          '<td><input class="locEdit fld-mini" value="' + esc(p.location || '') + '" data-img="' + esc(p.img) + '" placeholder="–"/></td>' +
          '<td><input class="binEdit fld-mini" value="' + esc(p.bin_location || '') + '" data-img="' + esc(p.img) + '" placeholder="–"/></td>' +
          '<td><input class="priceEdit fld-mini" type="number" step="0.01" min="0" value="' + usd + '" placeholder="no price" data-img="' + esc(p.img) + '"/></td>' +
          '<td><input class="stockEdit fld-mini" type="number" min="0" value="' + p.stock_count + '" data-img="' + esc(p.img) + '"/></td>' +
          '<td>' + lvl + '</td>' +
          '<td class="actions"><button class="btn ok" data-saveimg="' + esc(p.img) + '">Save</button> <button class="btn" data-rmimg="' + esc(p.img) + '" style="background:#fee2e2;color:#b91c1c;border:0">×</button></td>' +
        '</tr>';
      }).join('') + '</tbody></table>' +
      (got.length === PROD_PAGE_SIZE
        ? '<div style="padding:12px;text-align:center"><button id="prodMore" class="btn" type="button">Load more</button></div>'
        : '');

    status.textContent = 'Showing ' + PROD_STATE.rows.length + (total != null ? ' of ' + total.toLocaleString('en-US') : '') + ' parts';

    var more = document.getElementById('prodMore');
    if (more) more.addEventListener('click', function(){ load(true); });
    wireRows(list);
  }

  function wireRows(scope){
    scope.querySelectorAll('[data-saveimg]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var img = btn.getAttribute('data-saveimg');
        var priceEl = scope.querySelector('.priceEdit[data-img="' + cssEsc(img) + '"]');
        var stock = scope.querySelector('.stockEdit[data-img="' + cssEsc(img) + '"]').value;
        var loc = scope.querySelector('.locEdit[data-img="' + cssEsc(img) + '"]').value;
        var bin = scope.querySelector('.binEdit[data-img="' + cssEsc(img) + '"]').value;
        var raw = (priceEl.value || '').trim();
        var body = { stock_count: parseInt(stock, 10), location: loc, bin_location: bin };
        // PATCH /api/admin/products/:img only recognises price_usd -- a prior
        // "fix" sent price_cents instead, so every price edit here was
        // silently discarded (the field just isn't in that route's allow-
        // list). An empty box means "still unpriced" and is left alone
        // rather than zeroed.
        if (raw !== '') body.price_usd = Number(raw);
        try {
          await api('/api/admin/products/' + encodeURIComponent(img), { method:'PATCH', body: body });
          btn.textContent = '✓';
          setTimeout(function(){ btn.textContent = 'Save'; }, 1500);
        } catch (e) { alert('Save failed: ' + e.message); }
      });
    });
    scope.querySelectorAll('[data-rmimg]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        if (!confirm('Remove this part?')) return;
        var img = btn.getAttribute('data-rmimg');
        try { await api('/api/admin/products/' + encodeURIComponent(img), { method:'DELETE' }); show('products'); }
        catch (e) { alert(e.message); }
      });
    });
  }

  document.getElementById('prodSearch').addEventListener('input', function(e){
    PROD_STATE.q = e.target.value.trim();
    clearTimeout(debounce);
    debounce = setTimeout(function(){ load(false); }, 220);
  });
  document.getElementById('prodCat').addEventListener('change', function(e){
    PROD_STATE.cat = e.target.value; load(false);
  });
  document.getElementById('prodInStock').addEventListener('change', function(e){
    PROD_STATE.inStock = e.target.checked; load(false);
  });

  load(false);
}

// Part numbers carry characters that are meaningful inside an attribute
// selector, so escape before building one. CSS.escape isn't in every browser
// this counter runs on.
function cssEsc(s){
  if (window.CSS && CSS.escape) return CSS.escape(s);
  return String(s).replace(/["\\\]\[\.#:>+~*^$|()]/g, '\\$&');
}

// =============================================================================
//  POS TERMINAL
//  A full parts-counter till: search or scan parts into a cart, attach the
//  customer and the sales rep who worked them, discount by line or by ticket,
//  decide how the goods leave (pickup / delivery / courier), take split tender
//  including charge-to-account, and print whichever of the five counter
//  documents actually applies.
//
//  The catalogue is ~23,000 parts since the stock-listing seed, so the counter
//  searches the server rather than the browser holding the whole table: the old
//  `/api/products?` with no limit pulled 6 MB and built 23k DOM cards on every
//  keystroke. Nothing is listed until the operator types, scans, or picks a
//  category.
// =============================================================================

var POS_REDRAW = null;   // set by renderPOS; lets code outside it refresh the panel
var POS_DRAWCART = null; // set by renderPOS; lets the persistent keydown listener redraw just the cart
var POS_SEL_INDEX = -1;  // legacy-keyboard-mode arrow-key selection into the current results list
// Checkbox multi-select on the results list -- {img: product} for whatever's
// currently checked. Scoped to the current page on purpose: it's cleared on
// every loadGrid() (new search/filter/page), so a checkbox can never point
// at a product that's no longer on screen.
var POS_LIST_SEL = {};
var POS_TAX_RATE = 0.15; // Jamaica GCT
var POS_POINTS_USD_RATE = 0.05;  // mirrors POINTS_USD_RATE_CENTS — 100 pts = $5

// Matches the `category` values the seed actually writes. The old list
// ('Engines', 'Bumpers', ...) matched no row in the table, so filtering by
// category always came back empty.
var POS_CATEGORIES = [
  ['engine','Engine & Drivetrain'], ['body','Body & Doors'], ['suspension','Suspension'],
  ['electrical','Electrical'], ['brakes','Brakes'], ['wheels','Wheels & Tires'],
  ['fluids','Filters & Fluids'], ['accessories','Accessories'],
];

var POS_PARISHES = ['Kingston','St. Andrew','St. Catherine','Clarendon','Manchester','St. Elizabeth',
  'Westmoreland','Hanover','St. James','Trelawny','St. Ann','St. Mary','Portland','St. Thomas'];

// -----------------------------------------------------------------------------
//  Ticket state. Kept in one object and mirrored to localStorage so an
//  accidental refresh mid-sale doesn't drop the customer's cart — at a counter
//  that means re-picking every part with them standing there.
// -----------------------------------------------------------------------------
var POS_STATE_KEY = 'mh_pos_ticket';
var POS = null;

function posBlankTicket(){
  return {
    cart: [],
    customer: null,          // { id, name, phone, email, price_tier, points_balance, open_balance_cents, last_vehicle }
    custName: '', custPhone: '', vehicle: '',
    rep: null,               // { id, name }
    orderDiscRaw: 0, orderDiscMode: 'dollar',
    redeemPts: 0,
    fulfilment: 'pickup',
    ship: { method:'', fee:0, name:'', phone:'', line1:'', line2:'', city:'', parish:'', country:'Jamaica', instructions:'' },
    poNumber: '',
    notes: '',
    holdId: null,            // set when this cart was recalled from a hold
    quoteId: null,           // set when this cart came off a saved quote
    collapsed: false,
  };
}
function posLoadState(){
  try {
    var raw = localStorage.getItem(POS_STATE_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      var blank = posBlankTicket();
      // Merge onto a blank so a ticket saved by an older build doesn't arrive
      // missing keys the rest of this panel dereferences.
      Object.keys(blank).forEach(function(k){ if (s[k] === undefined) s[k] = blank[k]; });
      s.ship = Object.assign({}, blank.ship, s.ship || {});
      return s;
    }
  } catch (_) {}
  return posBlankTicket();
}
function posSaveState(){
  try { localStorage.setItem(POS_STATE_KEY, JSON.stringify(POS)); } catch (_) {}
}
function posResetTicket(){
  POS = posBlankTicket();
  posSaveState();
}

// -----------------------------------------------------------------------------
//  Results-list display preferences (view density, font size). Separate from
//  the ticket state above on purpose: "New ticket" clears the cart and
//  customer, but a cashier's chosen text size / list density is a workstation
//  setting, not part of any one sale, and should survive "New" and sign-out.
// -----------------------------------------------------------------------------
var POS_PREFS_KEY = 'mh_pos_prefs';
var POS_FONT_SCALES = { sm: 1, md: 1.15, lg: 1.35, xl: 1.6 };
function posLoadPrefs(){
  // columns only affects List/Compact (Grid always shows everything on its
  // card) -- which of the non-essential columns to show. Part No. and
  // Description are always shown regardless; they're what actually
  // identifies the row, not something to hide.
  var d = { view: 'grid', fontSize: 'md', legacyKeys: false, columns: { bin: true, qty: true, price: true } };
  try {
    var raw = localStorage.getItem(POS_PREFS_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s.view) d.view = s.view;
      if (s.fontSize) d.fontSize = s.fontSize;
      if (s.legacyKeys) d.legacyKeys = true;
      if (s.columns) Object.assign(d.columns, s.columns);
    }
  } catch (_) {}
  return d;
}
function posSavePrefs(){ try { localStorage.setItem(POS_PREFS_KEY, JSON.stringify(POS_PREFS)); } catch (_) {} }
var POS_PREFS = posLoadPrefs();
// px = the size at 100% (fontSize:'md'); every call scales from there so one
// number change (POS_FONT_SCALES) re-tunes every view at once.
function posFS(px){ return Math.round(px * (POS_FONT_SCALES[POS_PREFS.fontSize] || 1) * 10) / 10 + 'px'; }
function posViewBtn(mode, glyph, label){
  var active = POS_PREFS.view === mode;
  return '<button type="button" class="posViewBtn" data-view="' + mode + '" title="' + label + '" aria-pressed="' + active + '" style="' +
    'width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:15px;line-height:1;' +
    (active ? 'background:var(--navy);color:#fff;border:1px solid var(--navy)' : 'background:var(--card);color:var(--muted);border:1px solid var(--line)') +
    '">' + glyph + '</button>';
}
// Denser views fit more per screen, so it's natural for them to also page in
// bigger chunks -- a compact reader can usefully scan 100 rows at a glance,
// a grid of big cards can't.
function posPageSize(){
  return POS_PREFS.view === 'compact' ? 100 : (POS_PREFS.view === 'list' ? 40 : 60);
}
// Legacy keyboard mode: paints the arrow-key cursor onto whichever row/card
// is at POS_SEL_INDEX and scrolls it into view. Reads directly from the DOM
// (not a per-render closure) so it works no matter which render attached the
// persistent keydown listener that drives it.
function posHighlightSel(){
  var results = document.getElementById('posResults');
  if (!results) return;
  var rows = results.querySelectorAll('[data-img]');
  rows.forEach(function(row, i){
    if (i === POS_SEL_INDEX) {
      row.style.outline = '2px solid var(--red)';
      row.style.outlineOffset = '-2px';
      row.scrollIntoView({ block: 'nearest' });
    } else {
      row.style.outline = 'none';
    }
  });
}

// Cents in, formatted dollars out. The catalogue and every server total are in
// cents; only the cart's editable price input works in dollars.
function posCents(c){ return fmtMoney((Number(c) || 0) / 100); }
function posMoney(cents){
  if (cents == null) return null;
  return Math.round(Number(cents)) / 100;
}

// -----------------------------------------------------------------------------
//  Ticket arithmetic. Deliberately mirrors posTotals() on the server so the
//  screen and the receipt can never disagree; the server's figures are still
//  the ones that get stored.
// -----------------------------------------------------------------------------
function posLineGross(i){ return (Number(i.price) || 0) * (Number(i.qty) || 0); }
function posLineDisc(i){ return Math.min(posLineGross(i), Math.max(0, Number(i.disc) || 0)); }
function posLineNet(i){ return posLineGross(i) - posLineDisc(i); }

function posTotals(){
  var subtotal = POS.cart.reduce(function(s,i){ return s + posLineNet(i); }, 0);
  var lineDisc = POS.cart.reduce(function(s,i){ return s + posLineDisc(i); }, 0);
  var orderDisc = POS.orderDiscMode === 'pct'
    ? Math.round(subtotal * (Number(POS.orderDiscRaw) || 0)) / 100
    : Math.max(0, Number(POS.orderDiscRaw) || 0);
  orderDisc = Math.min(subtotal, Math.round(orderDisc * 100) / 100);
  var maxPts = POS.customer ? (POS.customer.points_balance || 0) : 0;
  var redeemPts = Math.min(maxPts, Math.max(0, parseInt(POS.redeemPts || 0, 10) || 0));
  var loyaltyDisc = Math.min(subtotal - orderDisc, Math.round(redeemPts * POS_POINTS_USD_RATE * 100) / 100);
  var goods = Math.max(0, subtotal - orderDisc - loyaltyDisc);
  var shipping = POS.fulfilment === 'pickup' ? 0 : Math.max(0, Number(POS.ship.fee) || 0);
  var taxable = Math.round((goods + shipping) * 100) / 100;
  var tax = (POS.customer && POS.customer.tax_exempt) ? 0 : Math.round(taxable * POS_TAX_RATE * 100) / 100;
  return {
    subtotal: subtotal, lineDisc: lineDisc, orderDisc: orderDisc,
    redeemPts: redeemPts, loyaltyDisc: loyaltyDisc,
    totalDisc: Math.round((orderDisc + loyaltyDisc) * 100) / 100,
    shipping: shipping, taxable: taxable, tax: tax,
    total: Math.round((taxable + tax) * 100) / 100,
  };
}

// The cart payload every server call shares.
function posCartPayload(){
  return POS.cart.map(function(i){
    return {
      product_img: i.img,
      description: i.name,
      qty: i.qty,
      unit_price_usd: Number(i.price) || 0,
      discount_usd: posLineDisc(i),
      discount_note: i.discNote || null,
    };
  });
}

function posAddToCart(p, qty){
  var ex = POS.cart.find(function(c){ return c.img === p.img; });
  if (ex) { ex.qty += (qty || 1); }
  else {
    POS.cart.push({
      img: p.img, name: p.name, make_model: p.make_model, sku: p.sku || null,
      price: Number(p.price_usd) || 0, qty: qty || 1,
      location: p.location, bin_location: p.bin_location,
      stock_count: p.stock_count, disc: 0, discNote: '',
    });
  }
  posSaveState();
}

// =============================================================================
//  MAIN PANEL
// =============================================================================
async function renderPOS(panel){
  POS = posLoadState();

  // Staff list for the rep picker. A till that can't say who sold the part
  // can't pay commission on it, so this loads with the panel rather than
  // being an afterthought at tender time.
  var reps = [];
  try { reps = (await api('/api/admin/pos/reps')).reps || []; } catch (_) {}
  var holdCount = 0;
  try { holdCount = ((await api('/api/admin/pos/holds')).holds || []).length; } catch (_) {}

  // Shift/float -- reuses the existing cash-drawer session endpoints (same
  // ones the Cash Report tab's "open/close till" already drives) so there's
  // one shift per register regardless of which screen opened or closed it.
  // Surfaced here too because a cashier landing on POS Terminal (now the
  // default tab) shouldn't have to go find Cash Report just to start their
  // shift before ringing anything up.
  var shiftSession = null;
  try { shiftSession = (await api('/api/admin/cash-drawer/open')).session; } catch (_) {}

  // Fetched once per panel load -- used both to default a brand-new ticket
  // (below) and by the "✕ back to walk-in" button further down, which needs
  // it regardless of whether a different customer is already attached.
  var walkin = null;
  try { walkin = (await api('/api/admin/pos/walkin-customer')).customer; } catch (_) {}

  // Which machine this terminal is running on, and whether it has a local
  // server of its own -- shown as a small badge in the ticket bar so staff
  // on a multi-terminal counter can tell which register they're on and
  // whether it's talking to a local database or relying on the fallback.
  var machine = null;
  try { machine = await api('/api/admin/settings/machine'); } catch (_) {}

  // Every ticket needs a real customer_id to attach to (credit/discount
  // limits, loyalty, and receipts all key off it) -- a brand-new ticket
  // defaults to the seeded "Cash Customer - Walk-in" account rather than
  // sitting blank. That account is excluded from loyalty server-side (see
  // getWalkinCustomerId() in server.js), so defaulting to it here is safe.
  if (!POS.customer && !POS.custName) {
    if (walkin) {
      POS.customer = { id: walkin.id, name: walkin.name, account_number: walkin.account_number,
        price_tier: 'retail', points_balance: 0, open_balance_cents: 0, is_walkin: true };
      posSaveState();
    }
  }

  var r = { products: [] };

  function repOptions(){
    return '<option value="">— sales rep —</option>' + reps.map(function(m){
      var sel = POS.rep && POS.rep.id === m.id ? ' selected' : '';
      return '<option value="' + m.id + '"' + sel + '>' + esc(m.name) + (m.role && m.role !== 'mechanic' ? ' · ' + esc(m.role) : '') + '</option>';
    }).join('');
  }

  // Every color in here is a fixed light shade, in both themes on purpose --
  // this renders into #posCustChip inside #posBar, which stays a hardcoded
  // navy background (var(--navy), same in light and dark mode -- the ticket
  // bar keeps its brand color regardless of theme). Text colors that follow
  // the theme (var(--ink)/var(--heading)/var(--muted)) go dark in light
  // mode and disappear against that navy, which is exactly the "customer
  // name and phone not visible in light mode" bug -- those vars are for
  // text on var(--card), not on this bar.
  function customerChip(){
    if (!POS.customer) {
      return '<span style="font-size:12.5px;color:#cbd5e1">Walk-in' +
        (POS.custName ? ' · <b style="color:#fff">' + esc(POS.custName) + '</b>' : '') + '</span>';
    }
    if (POS.customer.is_walkin) {
      return '<span style="font-size:12.5px;color:#cbd5e1">🚶 <b style="color:#fff">Cash Customer – Walk-in</b>' +
        '<small style="opacity:.7"> · ' + esc(POS.customer.account_number || '') + '</small></span>';
    }
    var c = POS.customer;
    var tierColors = { retail:'#64748b', trade:'#0e7490', fleet:'#7c3aed', dealer:'#b91c1c' };
    var col = tierColors[c.price_tier || 'retail'] || '#64748b';
    return '<span style="font-size:12.5px;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap">' +
      '<b style="color:#fff">' + esc(c.name || '(no name)') + '</b>' +
      '<span style="background:' + col + ';color:#fff;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase">' + esc(c.price_tier || 'retail') + '</span>' +
      (c.tax_exempt ? '<span style="background:#dcfce7;color:#166534;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase" title="No GCT is charged on this customer\'s sales">tax exempt</span>' : '') +
      (c.phone ? '<span style="color:#cbd5e1">' + esc(c.phone) + '</span>' : '') +
      (c.points_balance ? '<span style="color:#fde68a;font-weight:700">⭐ ' + c.points_balance + '</span>' : '') +
      (c.open_balance_cents > 0 ? '<span style="background:#fee2e2;color:#b91c1c;font-weight:700;padding:1px 6px;border-radius:3px">owes ' + posCents(c.open_balance_cents) + '</span>' : '') +
    '</span>';
  }

  panel.innerHTML =
    // ---- TICKET BAR: who is buying, who is selling, what to do with the cart
    '<div id="posBar" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:var(--navy);color:#fff;border-radius:8px 8px 0 0">' +
      '<div style="position:relative;flex:1;min-width:280px" id="posCustWrap">' +
        '<div style="display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:6px">' +
          '<span style="font-size:15px">👤</span>' +
          '<span id="posCustChip" style="flex:1;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + customerChip() + '</span>' +
          '<input id="posCustSearch" placeholder="Search name, phone, account #… (F4)" autocomplete="off" style="width:170px;padding:5px 8px;border:0;border-radius:5px;font-size:12px;font-family:inherit"/>' +
          '<button id="posCustNew" class="posBarBtn" title="Quick-add a new customer">+ New</button>' +
          (POS.customer && !POS.customer.is_walkin && POS.customer.open_balance_cents > 0 && ['owner', 'manager'].indexOf(CURRENT_ADMIN_ROLE) !== -1
            ? '<button id="posCustSettle" class="posBarBtn" style="background:#fee2e2;color:#7f1d1d" title="Record a payment against this customer\'s account">💰 Settle</button>'
            : '') +
          (POS.customer && !POS.customer.is_walkin ? '<button id="posCustClear" class="posBarBtn" title="Back to walk-in">✕</button>' : '') +
        '</div>' +
        '<div id="posCustResults" style="display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.22);z-index:60;max-height:280px;overflow-y:auto"></div>' +
