  // ---------------------------------------------------------------------------
  //  Results list — server-side search + real pagination, three view densities
  // ---------------------------------------------------------------------------
  // Seeded parts are keyed by part number and have no photo asset, so the old
  // `<img src=partNumber>` was a broken image on every card. Show the part
  // number itself where a photo would be, and only load a real image when the
  // img field actually looks like one.
  function posThumb(p, sizePx){
    var s = sizePx || 100;
    if (/\.(jpe?g|png|webp|gif|svg)$/i.test(p.img || '') || String(p.img || '').indexOf('/uploads/') === 0){
      return '<img src="' + encodeURI(p.img) + '" style="width:100%;height:' + s + 'px;object-fit:cover;border-radius:6px;background:var(--card-soft2)" onerror="this.style.opacity=0.3"/>';
    }
    return '<div style="height:' + s + 'px;border-radius:6px;background:var(--card-soft2);display:flex;align-items:center;justify-content:center;padding:4px;text-align:center">' +
      '<code style="font-size:' + posFS(11) + ';color:#374151;font-weight:700;word-break:break-all">' + esc(p.img) + '</code></div>';
  }
  // Part No. is sku, falling back to barcode -- same convention used
  // everywhere else in this file (POS Sales detail, PO receiving, etc.).
  function posPartNo(p){ return p.sku || p.barcode || '—'; }
  function posStockColor(level){ return level === 'out' ? '#b91c1c' : (level === 'low' ? '#b45309' : '#15803d'); }
  function posPriceHtml(p, fs){
    var usd = p.price_usd != null ? Number(p.price_usd) : null;
    // Most of the seeded catalogue has no price yet. Say so plainly rather
    // than printing "$0.00", which reads as free.
    return usd
      ? '<b style="color:var(--red);font-size:' + fs + '">' + fmtMoney(usd) + '</b>'
      : '<b style="color:var(--heading);font-size:' + posFS(10.5) + ';background:#e0e7ff;padding:2px 6px;border-radius:4px;white-space:nowrap">NO PRICE</b>';
  }

  var posSeq = 0;      // guards against a slow response overwriting a newer one
  var posPage = 1;      // 1-based -- real pagination, not "load more"
  var posTotal = 0;

  function posQueryString(offset, limit){
    var q = (document.getElementById('posSearch').value || '').trim();
    var cat = document.getElementById('posCat').value;
    var cond = document.getElementById('posCondition').value;
    var stock = document.getElementById('posStock').value;
    var sort = document.getElementById('posSort').value;
    var veh = document.getElementById('posVehFilter').value;
    var pMin = document.getElementById('posPriceMin').value;
    var pMax = document.getElementById('posPriceMax').value;
    var qs = 'limit=' + limit + '&offset=' + offset;
    if (q) qs += '&q=' + encodeURIComponent(q);
    if (cat) qs += '&category=' + encodeURIComponent(cat);
    if (cond) qs += '&condition=' + encodeURIComponent(cond);
    if (stock) qs += '&stock_status=' + encodeURIComponent(stock);
    if (veh) qs += '&make_model=' + encodeURIComponent(veh);
    if (pMin) qs += '&price_min=' + encodeURIComponent(pMin);
    if (pMax) qs += '&price_max=' + encodeURIComponent(pMax);
    if (sort && sort !== 'name') qs += '&sort=' + encodeURIComponent(sort);
    return qs;
  }

  function posUpdateSelBar(){
    var count = document.getElementById('posSelCount');
    var addBtn = document.getElementById('posSelAddCart');
    var clearBtn = document.getElementById('posSelClear');
    var allCk = document.getElementById('posSelAllCk');
    if (!count) return;
    var n = Object.keys(POS_LIST_SEL).length;
    var shown = (document.getElementById('posResults') && document.getElementById('posResults').__posProducts) || [];
    count.style.display = n ? '' : 'none';
    addBtn.style.display = n ? '' : 'none';
    clearBtn.style.display = n ? '' : 'none';
    count.textContent = n + ' selected';
    if (allCk) {
      allCk.checked = shown.length > 0 && shown.every(function(p){ return !!POS_LIST_SEL[p.img]; });
      allCk.indeterminate = n > 0 && !allCk.checked;
    }
  }

  async function loadGrid(page){
    var results = document.getElementById('posResults');
    var status = document.getElementById('posStatus');
    var paging = document.getElementById('posPaging');
    posPage = Math.max(1, page || 1);
    var pageSize = posPageSize();
    var offset = (posPage - 1) * pageSize;

    // A new search/filter/page invalidates any checkboxes ticked on the
    // previous screen -- they'd otherwise point at products no longer shown.
    POS_LIST_SEL = {};
    posUpdateSelBar();

    var seq = ++posSeq;
    status.textContent = 'Searching…';

    var resp;
    try {
      resp = await api('/api/products?' + posQueryString(offset, pageSize));
    } catch (e) {
      if (seq !== posSeq) return;
      status.textContent = 'Search failed: ' + (e.message || 'unknown error');
      return;
    }
    if (seq !== posSeq) return;   // a newer keystroke/filter change already won

    r.products = resp.products || [];
    posTotal = resp.total || 0;

    if (!r.products.length){
      results.innerHTML = '<div class="empty" style="padding:30px;text-align:center;color:var(--muted)">No matches. Try clearing a filter or widening the search.</div>';
      results.__posProducts = []; POS_SEL_INDEX = -1;
      status.textContent = '';
      paging.innerHTML = '';
      return;
    }

    results.innerHTML = posPrefs_render(r.products);
    // Legacy keyboard mode's arrow-key navigation lives in a keydown listener
    // that's only ever attached once (see window.__posKeys below) and so
    // can't close over this render's local `r` -- stash the current list on
    // the DOM node itself so that listener always reads what's actually on
    // screen, no matter which render attached it.
    results.__posProducts = r.products;
    POS_SEL_INDEX = -1;
    var shown = Math.min(pageSize, r.products.length);
    var from = offset + 1, to = offset + shown;
    status.textContent = posTotal.toLocaleString('en-US') + ' part' + (posTotal === 1 ? '' : 's') + ' match' + (posTotal === 1 ? 'es' : '') +
      (posTotal > shown ? ' — showing ' + from.toLocaleString('en-US') + '–' + to.toLocaleString('en-US') : '');

    paging.innerHTML = posRenderPaging(pageSize);
    var pv = document.getElementById('posPrevBtn'); if (pv) pv.addEventListener('click', function(){ if (posPage > 1) loadGrid(posPage - 1); });
    var nx = document.getElementById('posNextBtn'); if (nx) nx.addEventListener('click', function(){ loadGrid(posPage + 1); });
    var jp = document.getElementById('posPageGo'); var ji = document.getElementById('posPageInput');
    if (jp && ji) jp.addEventListener('click', function(){ var n = parseInt(ji.value, 10); if (n > 0) loadGrid(n); });
    if (ji) ji.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); var n = parseInt(ji.value, 10); if (n > 0) loadGrid(n); } });

    results.querySelectorAll('[data-img]').forEach(function(row){
      row.addEventListener('click', function(e){
        if (e.target && e.target.classList && e.target.classList.contains('posSelCk')) return;
        var p = r.products.find(function(x){ return x.img === row.getAttribute('data-img'); });
        if (!p) return;
        posAddToCart(p, 1);
        drawCart();
      });
    });
    results.querySelectorAll('.posSelCk').forEach(function(ck){
      ck.addEventListener('click', function(e){ e.stopPropagation(); });
      ck.addEventListener('change', function(){
        var img = ck.getAttribute('data-img');
        var p = r.products.find(function(x){ return x.img === img; });
        if (!p) return;
        if (ck.checked) POS_LIST_SEL[img] = p; else delete POS_LIST_SEL[img];
        posUpdateSelBar();
      });
    });
    // Master checkbox, List/Compact header only (posRenderRows) -- rewired
    // every render since the header row itself is regenerated each time.
    var allCk = document.getElementById('posSelAllCk');
    if (allCk) allCk.addEventListener('change', function(){
      if (this.checked) r.products.forEach(function(p){ POS_LIST_SEL[p.img] = p; });
      else POS_LIST_SEL = {};
      results.querySelectorAll('.posSelCk').forEach(function(ck){ ck.checked = !!POS_LIST_SEL[ck.getAttribute('data-img')]; });
      posUpdateSelBar();
    });
  }

  // ---- view renderers ----------------------------------------------------
  function posPrefs_render(products){
    if (POS_PREFS.view === 'list') return posRenderRows(products, false);
    if (POS_PREFS.view === 'compact') return posRenderRows(products, true);
    return posRenderGrid(products);
  }
  function posRenderGrid(products){
    return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(' + Math.round(170 * (POS_FONT_SCALES[POS_PREFS.fontSize]||1)) + 'px,1fr));gap:10px">' +
      products.map(function(p){
        var loc = p.location
          ? '<small style="display:block;color:#0891b2;font-weight:600;font-size:' + posFS(11) + '">📍 ' + esc(p.location) + (p.bin_location ? ' · ' + esc(p.bin_location) : '') + '</small>'
          : (p.bin_location ? '<small style="display:block;color:var(--muted);font-size:' + posFS(11) + '">🗂 ' + esc(p.bin_location) + '</small>' : '');
        var stock = p.stock_count || 0;
        return '<div data-img="' + esc(p.img) + '" class="posCard" style="position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px">' +
          '<input type="checkbox" class="posSelCk" data-img="' + esc(p.img) + '" title="Select for bulk add"' + (POS_LIST_SEL[p.img] ? ' checked' : '') + ' style="position:absolute;top:6px;left:6px;width:17px;height:17px;z-index:2;cursor:pointer"/>' +
          posThumb(p, Math.round(100 * (POS_FONT_SCALES[POS_PREFS.fontSize]||1))) +
          '<div style="font-size:' + posFS(12) + ';font-weight:700;line-height:1.25">' + esc(p.name) + '</div>' +
          '<small style="color:var(--muted);font-size:' + posFS(11) + '">' + esc(posPartNo(p)) + (p.make_model ? ' · ' + esc(p.make_model) : '') + '</small>' +
          loc +
          '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px">' +
            posPriceHtml(p, posFS(13)) +
            '<small style="color:' + posStockColor(p.stock_level) + ';font-weight:700;font-size:' + posFS(11) + ';white-space:nowrap">' + stock + ' in stock</small>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }
  // Shared by List and Compact -- same columns (Part No / Description / Bin /
  // Qty / Price), Compact just tightens padding+font and drops the thumbnail
  // so more rows fit on screen at once for scanning a large catalogue fast.
  function posRenderRows(products, compact){
    var pad = compact ? '5px 8px' : '9px 10px';
    var thumbSize = compact ? 0 : 34;
    var cols = POS_PREFS.columns;
    // No overflow:hidden on this wrapper (only had it for rounded corners) --
    // it sits between the header row and #posResultsScroll, the actual
    // scrolling container, and overflow:hidden on an element in between
    // clips a position:sticky descendant at *its* edge instead of letting it
    // stick through the real scroll container. The header gets its own
    // top corner radius instead so the rounded-corner look survives losing
    // the parent's clip.
    return '<div style="border:1px solid var(--line);border-radius:8px;background:var(--card)">' +
      '<div style="display:flex;gap:8px;padding:' + pad + ';background:var(--card-soft2);font-size:' + posFS(10.5) + ';font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;border-radius:7px 7px 0 0;align-items:center">' +
        '<span style="width:17px;flex-shrink:0"><input type="checkbox" id="posSelAllCk" title="Select every item currently loaded on this page" style="width:15px;height:15px;cursor:pointer;vertical-align:middle"/></span>' +
        (thumbSize ? '<span style="width:' + thumbSize + 'px;flex-shrink:0"></span>' : '') +
        '<span style="width:96px;flex-shrink:0">Part No.</span>' +
        '<span style="flex:1;min-width:0">Description</span>' +
        (cols.bin ? '<span style="width:90px;flex-shrink:0">Bin</span>' : '') +
        (cols.qty ? '<span style="width:64px;flex-shrink:0;text-align:center">Qty</span>' : '') +
        (cols.price ? '<span style="width:80px;flex-shrink:0;text-align:right">Price</span>' : '') +
      '</div>' +
      products.map(function(p){
        var stock = p.stock_count || 0;
        var bin = p.bin_location || p.location || '—';
        return '<div data-img="' + esc(p.img) + '" style="display:flex;gap:8px;align-items:flex-start;padding:' + pad + ';border-bottom:1px solid var(--hover);cursor:pointer" class="posRow">' +
          '<input type="checkbox" class="posSelCk" data-img="' + esc(p.img) + '" title="Select for bulk add"' + (POS_LIST_SEL[p.img] ? ' checked' : '') + ' style="width:15px;height:15px;flex-shrink:0;margin-top:2px;cursor:pointer"/>' +
          (thumbSize ? '<span style="width:' + thumbSize + 'px;flex-shrink:0">' + posThumb(p, thumbSize) + '</span>' : '') +
          '<code style="width:96px;flex-shrink:0;font-size:' + posFS(compact?10.5:11.5) + ';color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(posPartNo(p)) + '</code>' +
          // Description wraps instead of truncating with an ellipsis -- a
          // one-line-only part name was clipping mid-word on anything long
          // (fitment strings especially). Row's own align-items:flex-start
          // (above) is what keeps the other columns pinned to the top of a
          // now-variable-height row instead of vertically centering oddly.
          '<span style="flex:1;min-width:0;font-size:' + posFS(compact?12:13) + ';font-weight:600;word-break:break-word" title="' + esc(p.name) + (p.make_model ? ' — ' + esc(p.make_model) : '') + '">' +
            esc(p.name) + (p.make_model ? ' <span style="font-weight:400;color:var(--muted)">— ' + esc(p.make_model) + '</span>' : '') +
          '</span>' +
          (cols.bin ? '<span style="width:90px;flex-shrink:0;font-size:' + posFS(compact?11:12) + ';color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(bin) + '</span>' : '') +
          (cols.qty ? '<span style="width:64px;flex-shrink:0;text-align:center;font-size:' + posFS(compact?11:12) + ';font-weight:700;color:' + posStockColor(p.stock_level) + '">' + stock + '</span>' : '') +
          (cols.price ? '<span style="width:80px;flex-shrink:0;text-align:right">' + posPriceHtml(p, posFS(compact?12:13)) + '</span>' : '') +
        '</div>';
      }).join('') +
    '</div>' +
    '<style>.posRow:hover{background:var(--card-soft)}</style>';
  }

  function posRenderPaging(pageSize){
    var totalPages = Math.max(1, Math.ceil(posTotal / pageSize));
    if (totalPages <= 1) return '';
    return '<div style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:12.5px">' +
      '<button type="button" id="posPrevBtn" class="btn"' + (posPage <= 1 ? ' disabled style="opacity:.4;cursor:not-allowed"' : '') + '>‹ Prev</button>' +
      '<span style="color:var(--muted)">Page</span>' +
      '<input id="posPageInput" type="number" min="1" max="' + totalPages + '" value="' + posPage + '" style="width:56px;padding:6px;border:1px solid var(--line);border-radius:5px;text-align:center"/>' +
      '<span style="color:var(--muted)">of ' + totalPages.toLocaleString('en-US') + '</span>' +
      '<button type="button" id="posPageGo" class="btn">Go</button>' +
      '<button type="button" id="posNextBtn" class="btn"' + (posPage >= totalPages ? ' disabled style="opacity:.4;cursor:not-allowed"' : '') + '>Next ›</button>' +
    '</div>';
  }

  var posDebounce = null;
  function drawGrid(){
    clearTimeout(posDebounce);
    posDebounce = setTimeout(function(){ loadGrid(1); }, 220);
  }

  // ---------------------------------------------------------------------------
  //  Cart
  // ---------------------------------------------------------------------------
  function drawCart(){
    posSaveState();
    var badge = document.getElementById('posCartBadge');
    if (badge) badge.textContent = POS.cart.reduce(function(s,i){ return s + i.qty; }, 0);
    if (POS.collapsed) return;

    var items = document.getElementById('posCartItems');
    var totals = document.getElementById('posCartTotals');
    if (!items || !totals) return;

    if (!POS.cart.length) {
      items.innerHTML = '<div class="empty" style="padding:22px;text-align:center;color:var(--muted);font-size:13px">Cart is empty</div>';
      totals.innerHTML = '';
      drawCartFooter(0);
      return;
    }

    items.innerHTML = POS.cart.map(function(i, idx){
      var net = posLineNet(i);
      var d = posLineDisc(i);
      return '<div style="padding:8px 0;border-bottom:1px dashed var(--line)">' +
        '<div style="display:flex;gap:8px;align-items:flex-start">' +
          '<div style="flex:1;font-size:12.5px"><b>' + esc(i.name) + '</b>' +
            '<br/><code style="font-size:10.5px;color:var(--muted)">' + esc(i.img) + '</code>' +
            (i.location ? '<br/><small style="color:#0891b2">📍 ' + esc(i.location) + '</small>'
                        : (i.bin_location ? '<br/><small style="color:var(--muted)">🗂 ' + esc(i.bin_location) + '</small>' : '')) +
          '</div>' +
          '<button data-rm="' + idx + '" title="Remove" style="background:#fee2e2;color:#b91c1c;border:0;width:24px;height:24px;border-radius:4px;cursor:pointer;font-weight:700;flex:none">×</button>' +
        '</div>' +
        // Price is editable here so an unpriced part can be quoted or sold
        // without leaving the counter to go edit the inventory record first.
        '<div style="display:flex;gap:6px;align-items:center;margin-top:5px">' +
          '<span style="font-size:11px;color:var(--muted)">$</span>' +
          '<input type="number" min="0" step="0.01" value="' + (i.price > 0 ? i.price : '') + '" placeholder="price" data-pidx="' + idx + '" class="posPrice" ' +
            'style="width:72px;padding:4px;border:1px solid ' + (i.price > 0 ? 'var(--line)' : '#818cf8') + ';border-radius:4px;font-size:12px;text-align:right"/>' +
          '<span style="font-size:11px;color:var(--muted)">×</span>' +
          '<input type="number" min="1" value="' + i.qty + '" data-idx="' + idx + '" class="posQty" style="width:46px;padding:4px;border:1px solid var(--line);border-radius:4px;font-size:12px;text-align:center"/>' +
          '<span style="font-size:11px;color:#b91c1c" title="Discount on this line">−$</span>' +
          '<input type="number" min="0" step="0.01" value="' + (d > 0 ? d : '') + '" placeholder="0" data-didx="' + idx + '" class="posDisc" ' +
            'style="width:58px;padding:4px;border:1px solid ' + (d > 0 ? '#fca5a5' : 'var(--line)') + ';border-radius:4px;font-size:12px;text-align:right"/>' +
          '<b style="margin-left:auto;font-size:12.5px">' + (i.price > 0 ? fmtMoney(net) : '—') + '</b>' +
        '</div>' +
        (d > 0
          ? '<input class="posDiscNote" data-nidx="' + idx + '" value="' + esc(i.discNote || '') + '" placeholder="reason for discount (prints on invoice)" style="width:100%;margin-top:4px;padding:3px 6px;border:1px solid #fde68a;background:var(--card)beb;border-radius:4px;font-size:11px"/>'
          : '') +
      '</div>';
    }).join('');

    var t = posTotals();
    // Unpriced lines are the normal case on this catalogue. They can't be sold
    // as-is, so the cart tells the operator what's missing and the footer
    // switches the primary action to saving a quote.
    var unpriced = POS.cart.filter(function(i){ return !(i.price > 0); }).length;
    totals.innerHTML =
      (unpriced
        ? '<div style="background:#e0e7ff;color:#1e3a8a;padding:6px 8px;border-radius:5px;margin-bottom:6px;font-size:12px;font-weight:700">' +
            '⚠ ' + unpriced + ' line' + (unpriced === 1 ? '' : 's') + ' still need' + (unpriced === 1 ? 's' : '') + ' a price' +
          '</div>'
        : '') +
      // Ticket-level discount lives with the totals, where the operator is
      // already looking when the customer asks "what can you do on the whole lot".
      '<div style="display:flex;align-items:center;gap:5px;margin-bottom:6px">' +
        '<span style="color:var(--muted);flex:1">Ticket discount</span>' +
        '<input id="posOrderDisc" type="number" min="0" step="0.01" value="' + (POS.orderDiscRaw || '') + '" placeholder="0" style="width:66px;padding:3px 5px;border:1px solid var(--line);border-radius:4px;font-size:12px;text-align:right"/>' +
        '<select id="posOrderDiscMode" style="padding:3px;border:1px solid var(--line);border-radius:4px;font-size:12px">' +
          '<option value="dollar"' + (POS.orderDiscMode === 'dollar' ? ' selected' : '') + '>$</option>' +
          '<option value="pct"' + (POS.orderDiscMode === 'pct' ? ' selected' : '') + '>%</option>' +
        '</select>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between"><span>Subtotal</span><b>' + fmtMoney(t.subtotal) + '</b></div>' +
      (t.lineDisc > 0 ? '<div style="display:flex;justify-content:space-between;color:#b91c1c"><span>Line discounts</span><b>−' + fmtMoney(t.lineDisc) + '</b></div>' : '') +
      (t.orderDisc > 0 ? '<div style="display:flex;justify-content:space-between;color:#b91c1c"><span>Ticket discount</span><b>−' + fmtMoney(t.orderDisc) + '</b></div>' : '') +
      (t.shipping > 0 ? '<div style="display:flex;justify-content:space-between;color:#0e7490"><span>Shipping</span><b>' + fmtMoney(t.shipping) + '</b></div>' : '') +
      '<div style="display:flex;justify-content:space-between;color:var(--muted)"><span>' + (POS.customer && POS.customer.tax_exempt ? 'GCT (exempt)' : 'GCT 15%') + '</span><b>' + fmtMoney(t.tax) + '</b></div>' +
      '<div style="display:flex;justify-content:space-between;margin-top:4px;padding-top:4px;border-top:1px solid var(--line);font-size:14px"><b>TOTAL</b><b style="color:var(--red)">' + fmtMoney(t.total) + '</b></div>';

    items.querySelectorAll('.posQty').forEach(function(inp){
      inp.addEventListener('change', function(){
        POS.cart[parseInt(inp.getAttribute('data-idx'), 10)].qty = Math.max(1, parseInt(inp.value, 10) || 1);
        drawCart();
      });
    });
    items.querySelectorAll('.posPrice').forEach(function(inp){
      inp.addEventListener('change', function(){
        POS.cart[parseInt(inp.getAttribute('data-pidx'), 10)].price = Math.max(0, Number(inp.value) || 0);
        drawCart();
      });
    });
    items.querySelectorAll('.posDisc').forEach(function(inp){
      inp.addEventListener('change', function(){
        POS.cart[parseInt(inp.getAttribute('data-didx'), 10)].disc = Math.max(0, Number(inp.value) || 0);
        drawCart();
      });
    });
    items.querySelectorAll('.posDiscNote').forEach(function(inp){
      inp.addEventListener('change', function(){
        POS.cart[parseInt(inp.getAttribute('data-nidx'), 10)].discNote = inp.value;
        posSaveState();
      });
    });
    items.querySelectorAll('[data-rm]').forEach(function(btn){
      btn.addEventListener('click', function(){
        POS.cart.splice(parseInt(btn.getAttribute('data-rm'), 10), 1);
        drawCart();
      });
    });
    var od = document.getElementById('posOrderDisc');
    if (od) od.addEventListener('change', function(){ POS.orderDiscRaw = Math.max(0, Number(this.value) || 0); drawCart(); });
    var om = document.getElementById('posOrderDiscMode');
    if (om) om.addEventListener('change', function(){ POS.orderDiscMode = this.value; drawCart(); });

    drawCartFooter(unpriced);
  }

  // CHECKOUT can only post a real sale once every line has a price. Until then
  // the quote button leads, so the counter can still hand the customer a
  // number to think about.
  function drawCartFooter(unpriced){
    var co = document.getElementById('posCheckout');
    if (co){
      co.disabled = unpriced > 0 || !POS.cart.length;
      co.style.opacity = co.disabled ? '.45' : '1';
      co.style.cursor = co.disabled ? 'not-allowed' : 'pointer';
      co.title = unpriced > 0 ? 'Enter a price on every line to complete a sale' : '';
    }
    var qb = document.getElementById('posSaveQuote');
    if (qb){
      qb.style.background = unpriced > 0 ? '#fbbf24' : 'var(--card-soft2)';
    }
  }

  // ---------------------------------------------------------------------------
  //  Ticket-bar wiring
  // ---------------------------------------------------------------------------
  function refreshBar(){ POS_REDRAW(); }

  document.getElementById('posCartToggle').addEventListener('click', function(){
    POS.collapsed = !POS.collapsed;
    posSaveState();
    renderPOS(panel);
  });
  document.getElementById('posRep').addEventListener('change', function(){
    var id = parseInt(this.value, 10) || null;
    var m = reps.find(function(x){ return x.id === id; });
    POS.rep = m ? { id: m.id, name: m.name } : null;
    posSaveState();
  });
  document.getElementById('posVehicle').addEventListener('input', function(){ POS.vehicle = this.value; posSaveState(); });
  var cartNotesInp = document.getElementById('posCartNotes');
  if (cartNotesInp) cartNotesInp.addEventListener('input', function(){ POS.notes = this.value; posSaveState(); });
  document.getElementById('posCustNew').addEventListener('click', function(){ posNewCustomerModal(refreshBar); });
  var settleBtn = document.getElementById('posCustSettle');
  if (settleBtn) settleBtn.addEventListener('click', function(){ posSettleBalanceModal(POS.customer, refreshBar); });
  var cc = document.getElementById('posCustClear');
  if (cc) cc.addEventListener('click', function(){
    posAttachCustomer(walkin ? { id: walkin.id, name: walkin.name, account_number: walkin.account_number, is_walkin: true } : null);
    POS.custName = ''; POS.custPhone = '';
    posSaveState(); refreshBar();
  });

  // ---- Customer live search: types → searches, no Find button / Enter needed.
  function posAttachCustomer(m){
    if (!m) { POS.customer = null; }
    else if (m.is_walkin) { POS.customer = m; }
    else {
      POS.customer = {
        id: m.id, name: m.name, phone: m.phone, email: m.email, account_number: m.account_number,
        price_tier: m.price_tier || 'retail', points_balance: m.points_balance || 0,
        open_balance_cents: m.open_balance_cents || 0, last_vehicle: m.last_vehicle || null,
        credit_limit_usd: m.credit_limit_usd, payment_terms_days: m.payment_terms_days, discount_limit_pct: m.discount_limit_pct,
        tax_exempt: !!m.tax_exempt,
      };
      POS.custName = m.name || POS.custName;
      POS.custPhone = m.phone || POS.custPhone;
      if (!POS.vehicle && m.last_vehicle) POS.vehicle = m.last_vehicle;
    }
    POS.redeemPts = 0;
    posSaveState();
  }
  var custSearchInp = document.getElementById('posCustSearch');
  var custResults = document.getElementById('posCustResults');
  var custDebounce = null;
  function closeCustResults(){ custResults.style.display = 'none'; custResults.innerHTML = ''; }
  function renderCustResults(matches, query){
    if (!matches.length) {
      custResults.innerHTML = query.trim().length >= 2
        ? '<button type="button" id="posCustQuickAdd" style="display:block;width:100%;text-align:left;border:0;background:var(--card);padding:10px 12px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--sky-dark);font-weight:700">+ Quick-add "' + esc(query.trim()) + '" as a new customer</button>'
        : '<div style="padding:10px 12px;font-size:12.5px;color:var(--muted)">Type a name, phone, or account number…</div>';
      custResults.style.display = 'block';
      var qa = document.getElementById('posCustQuickAdd');
      if (qa) qa.addEventListener('click', function(){
        closeCustResults(); custSearchInp.value = '';
        posNewCustomerModal(refreshBar, query.trim());
      });
      return;
    }
    custResults.innerHTML = matches.map(function(m){
      return '<button type="button" class="posCustPick" data-id="' + m.id + '" style="display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--card-soft2);background:var(--card);padding:9px 12px;cursor:pointer;font-family:inherit">' +
        '<b style="font-size:13.5px;color:var(--heading)">' + esc(m.name || '(no name)') + '</b>' +
        '<span style="font-size:11px;color:var(--muted)"> · ' + esc(m.account_number || '—') + '</span>' +
        (m.tax_exempt ? '<span style="margin-left:6px;background:#dcfce7;color:#166534;font-size:9px;font-weight:800;padding:1px 5px;border-radius:3px;text-transform:uppercase">tax exempt</span>' : '') +
        '<br/><small style="color:var(--muted)">' + esc(m.phone || 'no phone') + ' · ' + esc(m.price_tier || 'retail') + ' · ⭐ ' + (m.points_balance || 0) + ' pts' +
          (m.open_balance_cents > 0 ? ' · <b style="color:#b91c1c">owes ' + posCents(m.open_balance_cents) + '</b>' : '') + '</small>' +
      '</button>';
    }).join('');
    custResults.style.display = 'block';
    custResults.querySelectorAll('.posCustPick').forEach(function(b){
      b.addEventListener('click', function(){
        var m = matches.find(function(x){ return x.id === parseInt(b.getAttribute('data-id'), 10); });
        if (!m) return;
        posAttachCustomer(m);
        closeCustResults();
        custSearchInp.value = '';
        refreshBar();
      });
    });
  }
  if (custSearchInp) custSearchInp.addEventListener('input', function(){
    var q = this.value.trim();
    clearTimeout(custDebounce);
    if (!q) { closeCustResults(); return; }
    custDebounce = setTimeout(async function(){
      try {
        var res = await api('/api/admin/pos/customer-lookup?phone=' + encodeURIComponent(q) + '&q=' + encodeURIComponent(q));
        renderCustResults(res.matches || [], q);
      } catch (e) { custResults.innerHTML = '<div style="padding:10px 12px;font-size:12.5px;color:#b91c1c">Search failed: ' + esc(e.message) + '</div>'; custResults.style.display = 'block'; }
    }, 200);
  });
  document.addEventListener('click', function(e){
    var wrap = document.getElementById('posCustWrap');
    if (wrap && !wrap.contains(e.target)) closeCustResults();
  });
  if (custSearchInp) custSearchInp.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeCustResults(); this.blur(); } });
  document.getElementById('posHoldBtn').addEventListener('click', function(){ posHoldCart(refreshBar); });
  document.getElementById('posRecallBtn').addEventListener('click', function(){ posRecallModal(refreshBar); });
  document.getElementById('posNewBtn').addEventListener('click', function(){
    if (POS.cart.length && !confirm('Clear this ticket and start a new one? The cart will be discarded.')) return;
    posResetTicket();
    refreshBar();
  });
  document.getElementById('posShiftBtn').addEventListener('click', function(){ posShiftModal(shiftSession, refreshBar); });

  // Scanner: a hardware scanner types the code then sends Enter. An exact hit
  // goes straight into the cart so the operator never takes a hand off the gun.
  var scanInp = document.getElementById('posScan');
  scanInp.addEventListener('keydown', async function(e){
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var raw = this.value.trim();
    if (!raw) return;
    this.value = '';
    // Legacy "qty*code" entry -- e.g. "3*BMP-001" adds 3 units in one scan
    // instead of scanning the same part three times. Works whether or not
    // Legacy keys mode is on; the mode just surfaces it in the shortcut legend.
    var qty = 1, code = raw;
    var starIdx = raw.indexOf('*');
    if (starIdx > 0 && /^\d+$/.test(raw.slice(0, starIdx))) {
      qty = Math.max(1, parseInt(raw.slice(0, starIdx), 10));
      code = raw.slice(starIdx + 1).trim();
    }
    var status = document.getElementById('posStatus');
    if (!code) return;
    try {
      var res = await api('/api/admin/pos/scan?code=' + encodeURIComponent(code));
      if (!res.product) throw new Error('no match');
      posAddToCart(res.product, qty);
      drawCart();
      status.innerHTML = '<span style="color:#15803d;font-weight:700">✔ Added ' + (qty > 1 ? qty + '× ' : '') + esc(res.product.name) + '</span>';
    } catch (err) {
      // Not a known code — fall back to putting it in the search box so the
      // operator can see what is close rather than getting a dead end.
      status.innerHTML = '<span style="color:#b91c1c;font-weight:700">No exact match for "' + esc(code) + '" — searching…</span>';
      document.getElementById('posSearch').value = code;
      loadGrid(1);
    }
  });

  document.getElementById('posSearch').addEventListener('input', drawGrid);
  document.getElementById('posCat').addEventListener('change', drawGrid);
  document.getElementById('posCondition').addEventListener('change', drawGrid);
  document.getElementById('posStock').addEventListener('change', drawGrid);
  document.getElementById('posVehFilter').addEventListener('change', drawGrid);
  document.getElementById('posPriceMin').addEventListener('input', drawGrid);
  document.getElementById('posPriceMax').addEventListener('input', drawGrid);
  document.getElementById('posFiltersClear').addEventListener('click', function(){
    document.getElementById('posSearch').value = '';
    document.getElementById('posCat').value = '';
    document.getElementById('posCondition').value = '';
    document.getElementById('posStock').value = '';
    document.getElementById('posVehFilter').value = '';
    document.getElementById('posPriceMin').value = '';
    document.getElementById('posPriceMax').value = '';
    loadGrid(1);
  });
  document.getElementById('posSort').addEventListener('change', drawGrid);
  document.getElementById('posSelAddCart').addEventListener('click', function(){
    var items = Object.keys(POS_LIST_SEL).map(function(img){ return POS_LIST_SEL[img]; });
    items.forEach(function(p){ posAddToCart(p, 1); });
    POS_LIST_SEL = {};
    posUpdateSelBar();
    document.querySelectorAll('.posSelCk').forEach(function(ck){ ck.checked = false; });
    drawCart();
  });
  document.getElementById('posSelClear').addEventListener('click', function(){
    POS_LIST_SEL = {};
    posUpdateSelBar();
    document.querySelectorAll('.posSelCk').forEach(function(ck){ ck.checked = false; });
  });
  // posSelAllCk itself is wired per-render, further down where the row
  // checkboxes are (see loadGrid()) -- it now lives inside the List/
  // Compact header row (posRenderRows), which is regenerated on every
  // search/filter/page change, not a static element that exists once at
  // panel load. Grid view has no header row, so there's no master
  // checkbox there -- individual card checkboxes still work as before.
  // Vehicle filter options come from the live catalogue, not a hardcoded
  // list, so they can't drift out of sync with what's actually stocked.
  api('/api/admin/pos/vehicle-models').then(function(res){
    var sel = document.getElementById('posVehFilter');
    if (!sel) return;
    (res.models || []).forEach(function(m){
      var opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      sel.appendChild(opt);
    });
  }).catch(function(){});
  document.querySelectorAll('.posViewBtn').forEach(function(b){
    b.addEventListener('click', function(){
      POS_PREFS.view = b.getAttribute('data-view');
      posSavePrefs();
      renderPOS(panel);
    });
  });
  document.getElementById('posFontSize').addEventListener('change', function(){
    POS_PREFS.fontSize = this.value;
    posSavePrefs();
    renderPOS(panel);
  });
  var colBtn = document.getElementById('posColumnsBtn');
  var colMenu = document.getElementById('posColumnsMenu');
  colBtn.addEventListener('click', function(e){
    e.stopPropagation();
    colMenu.style.display = colMenu.style.display === 'none' ? 'block' : 'none';
  });
  document.addEventListener('click', function(e){
    if (colMenu.style.display !== 'none' && !colMenu.contains(e.target) && e.target !== colBtn) colMenu.style.display = 'none';
  });
  document.querySelectorAll('.posColCk').forEach(function(ck){
    ck.addEventListener('change', function(){
      POS_PREFS.columns[this.getAttribute('data-col')] = this.checked;
      posSavePrefs();
      loadGrid(posPage); // re-render the current page's rows with the new columns; no need to re-fetch or reset to page 1
    });
  });
  var fsBtn = document.getElementById('posFullscreenBtn');
  function posInFullscreen(){ return document.body.classList.contains('pos-fullscreen'); }
  function posSetFullscreen(on){
    document.body.classList.toggle('pos-fullscreen', on);
    fsBtn.textContent = on ? '⛶ Exit full screen' : '⛶ Full screen';
    // Best-effort real browser fullscreen too -- some browsers block this
    // outside a direct user gesture or in an iframe, so it's allowed to
    // silently fail; the CSS-based layout change above is what actually
    // matters and always works regardless.
    try {
      if (on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
      else if (!on && document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(function(){});
    } catch (_) {}
  }
  fsBtn.addEventListener('click', function(){ posSetFullscreen(!posInFullscreen()); });
  // The browser's own Escape-to-exit (or F11) on real fullscreen shouldn't
  // leave the CSS-hidden sidebar/header stuck hidden with no way back.
  document.addEventListener('fullscreenchange', function(){
    if (!document.fullscreenElement && posInFullscreen()) posSetFullscreen(false);
  });
  document.getElementById('posLegacyKeys').addEventListener('change', function(){
    POS_PREFS.legacyKeys = this.checked;
    posSavePrefs();
    renderPOS(panel);
  });
  document.getElementById('posCheckout').addEventListener('click', function(){
    if (!POS.cart.length) return alert('Cart is empty.');
    if (POS.cart.some(function(i){ return !(i.price > 0); }))
      return alert('Enter a price on every line before completing a sale, or save it as a quote instead.');
    openTenderModal(refreshBar);
  });
  document.getElementById('posSaveQuote').addEventListener('click', function(){ posSaveCartAsQuote(refreshBar); });
  document.getElementById('posClear').addEventListener('click', function(){
    if (!POS.cart.length) return;
    if (!confirm('Empty the cart?')) return;
    POS.cart = [];
    drawCart();
  });

  // Counter keyboard shortcuts. A till gets driven by hand, not by mouse.
  if (!window.__posKeys) {
    window.__posKeys = true;
    document.addEventListener('keydown', function(e){
      if (currentTab !== 'pos') return;
      var k = e.key;
      if (['F2','F3','F4','F5','F7','F8','F9','F10'].indexOf(k) !== -1) e.preventDefault();
      if (k === 'F2') { var s = document.getElementById('posScan'); if (s) s.focus(); }
      if (k === 'F3') { var se = document.getElementById('posSearch'); if (se) se.focus(); }
      if (k === 'F4') { var cs = document.getElementById('posCustSearch'); if (cs) cs.focus(); }
      if (k === 'F5') { var nb = document.getElementById('posNewBtn'); if (nb) nb.click(); }
      if (k === 'F7') { var h = document.getElementById('posHoldBtn'); if (h) h.click(); }
      if (k === 'F8') { var rc = document.getElementById('posRecallBtn'); if (rc) rc.click(); }
      if (k === 'F9') { var c2 = document.getElementById('posCheckout'); if (c2 && !c2.disabled) c2.click(); }
      if (k === 'F10') { var cl = document.getElementById('posClear'); if (cl) cl.click(); }
      if (k === 'Escape') {
        var active = document.activeElement;
        if (active && typeof active.blur === 'function') active.blur();
        var cr = document.getElementById('posCustResults'); if (cr) cr.style.display = 'none';
      }
      // Arrow-key navigation of the results list + Enter-to-add, only in
      // Legacy keys mode and only when focus isn't in a text field (so the
      // arrow keys still work normally while typing in search/notes/etc.).
      if (!POS_PREFS.legacyKeys) return;
      var tag = document.activeElement && document.activeElement.tagName;
      var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if (typing && k !== 'Enter') return;
      var results = document.getElementById('posResults');
      var products = results && results.__posProducts || [];
      if (!products.length) return;
      if (k === 'ArrowDown') { e.preventDefault(); POS_SEL_INDEX = Math.min(products.length - 1, POS_SEL_INDEX + 1); posHighlightSel(); }
      else if (k === 'ArrowUp') { e.preventDefault(); POS_SEL_INDEX = Math.max(0, POS_SEL_INDEX - 1); posHighlightSel(); }
      else if (k === 'Enter' && !typing && POS_SEL_INDEX >= 0 && POS_SEL_INDEX < products.length) {
        e.preventDefault();
        posAddToCart(products[POS_SEL_INDEX], 1);
        if (POS_DRAWCART) POS_DRAWCART();
      }
    });
  }

  // drawCart is a closure over this panel's DOM; the modals below live outside
  // renderPOS and need a way back in after they change the ticket.
  POS_REDRAW = function(){ renderPOS(panel); };
  POS_DRAWCART = drawCart;
  loadGrid(1);
  drawCart();
  // Customer comes first at the start of a ticket -- who it's for is usually
  // known before what's in the cart, and it's one keystroke away from
  // re-focusing the scanner (F2) once that's settled.
  custSearchInp.focus();
}

function posCustomerModal(after){
  posModal('Attach a customer',
    '<div style="display:grid;grid-template-columns:1fr auto;gap:6px">' +
      '<input id="pcQuery" placeholder="Phone, name or email…" style="padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-size:13.5px"/>' +
      '<button type="button" id="pcGo" style="background:var(--navy);color:#fff;border:0;border-radius:6px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer">🔍 Find</button>' +
    '</div>' +
    '<div id="pcResults" style="margin-top:10px"></div>' +
    '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">' +
      '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;margin-bottom:6px">Or just name the walk-in</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">' +
        '<input id="pcName" placeholder="Name" value="' + esc(POS.custName || '') + '" style="padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px"/>' +
        '<input id="pcPhone" placeholder="Phone" value="' + esc(POS.custPhone || '') + '" style="padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px"/>' +
      '</div>' +
      '<button type="button" id="pcUseWalkin" class="btn" style="margin-top:8px">Use these details</button>' +
    '</div>'
  );

  async function search(){
    var q = document.getElementById('pcQuery').value.trim();
    var box = document.getElementById('pcResults');
    if (!q) return;
    box.innerHTML = '<div style="font-size:12.5px;color:var(--muted);padding:6px">Searching…</div>';
    try {
      var res = await api('/api/admin/pos/customer-lookup?phone=' + encodeURIComponent(q) + '&q=' + encodeURIComponent(q));
      var matches = res.matches || [];
      if (!matches.length) {
        box.innerHTML = '<div style="font-size:12.5px;color:var(--muted);padding:6px">No customer on file. Use “New” to create one, or just name the walk-in below.</div>';
        return;
      }
      box.innerHTML = '<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:230px;overflow-y:auto">' +
        matches.map(function(m){
          return '<button type="button" class="pcPick" data-id="' + m.id + '" style="display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--card-soft2);background:var(--card);padding:9px 12px;cursor:pointer;font-family:inherit">' +
            '<b style="font-size:13.5px;color:var(--heading)">' + esc(m.name || '(no name)') + '</b>' +
            '<span style="font-size:12px;color:var(--muted)"> · ' + esc(m.phone || 'no phone') + '</span>' +
            '<br/><small style="color:var(--muted)">' + esc(m.price_tier || 'retail') + ' · ⭐ ' + (m.points_balance || 0) + ' pts' +
              (m.open_balance_cents > 0 ? ' · <b style="color:#b91c1c">owes ' + posCents(m.open_balance_cents) + '</b>' : '') +
              (m.last_vehicle ? ' · 🚗 ' + esc(m.last_vehicle) : '') + '</small>' +
          '</button>';
        }).join('') + '</div>';
      box.querySelectorAll('.pcPick').forEach(function(b){
        b.addEventListener('click', function(){
          var m = matches.find(function(x){ return x.id === parseInt(b.getAttribute('data-id'), 10); });
          if (!m) return;
          POS.customer = {
            id: m.id, name: m.name, phone: m.phone, email: m.email,
            price_tier: m.price_tier || 'retail',
            points_balance: m.points_balance || 0,
            open_balance_cents: m.open_balance_cents || 0,
            last_vehicle: m.last_vehicle || null,
            last_address: m.last_address || null,
          };
          POS.custName = m.name || POS.custName;
          POS.custPhone = m.phone || POS.custPhone;
          if (!POS.vehicle && m.last_vehicle) POS.vehicle = m.last_vehicle;
          POS.redeemPts = 0;
          posSaveState();
          posCloseModal();
          if (after) after();
        });
      });
    } catch (e) {
      box.innerHTML = '<div style="font-size:12.5px;color:#b91c1c;padding:6px">Lookup failed: ' + esc(e.message) + '</div>';
    }
  }
  document.getElementById('pcGo').addEventListener('click', search);
  document.getElementById('pcQuery').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); search(); } });
  document.getElementById('pcUseWalkin').addEventListener('click', function(){
    POS.customer = null;
    POS.custName = document.getElementById('pcName').value.trim();
    POS.custPhone = document.getElementById('pcPhone').value.trim();
    posSaveState();
    posCloseModal();
    if (after) after();
  });
  document.getElementById('pcQuery').focus();
}

// Quick "customer walks in and pays down their tab" flow, right from the
// ticket bar -- the same endpoint and history live on the customer's own
// profile (Settle Balance panel) for the full picture, this is just the fast
// path so the cashier doesn't have to leave the till to take the payment.
function posSettleBalanceModal(customer, after){
  var owed = (customer.open_balance_cents || 0) / 100;
  posModal('Settle balance — ' + esc(customer.name || ''),
    '<div style="text-align:center;padding:6px 0 16px">' +
      '<div class="lbl">Currently owes</div>' +
      '<b style="font-size:26px;color:#b91c1c">' + fmtMoney(owed) + '</b>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
      '<div><label class="lbl">Amount (USD) *</label><input id="sbAmount" type="number" min="0.01" step="0.01" value="' + owed.toFixed(2) + '" class="fld"/></div>' +
      '<div><label class="lbl">Method *</label><select id="sbMethod" class="fld">' +
        '<option value="cash">Cash</option><option value="card">Card</option><option value="cheque">Cheque</option><option value="bank">Bank transfer</option>' +
      '</select></div>' +
      '<div><label class="lbl">Reference</label><input id="sbRef" class="fld" placeholder="cheque #, txn id…"/></div>' +
      '<div><label class="lbl">Notes</label><input id="sbNotes" class="fld"/></div>' +
    '</div>' +
    '<div id="sbMsg" style="display:none;margin-top:10px;padding:9px 12px;border-radius:6px;font-size:12.5px"></div>' +
    '<div style="display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">' +
      '<button type="button" class="btn ok" id="sbGo">Record payment</button>' +
    '</div>',
    440
  );
  document.getElementById('sbGo').addEventListener('click', async function(){
    var msg = document.getElementById('sbMsg');
    msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Recording…';
    try {
      var r = await api('/api/admin/users/' + customer.id + '/account-payments', { method:'POST', body: {
        amount_usd: document.getElementById('sbAmount').value,
        method: document.getElementById('sbMethod').value,
        reference: document.getElementById('sbRef').value.trim() || null,
        notes: document.getElementById('sbNotes').value.trim() || null,
      }});
      msg.style.background = '#dcfce7'; msg.style.color = '#166534';
      msg.textContent = '✓ Recorded. New balance: ' + fmtMoney(r.balance_after_usd) + (r.overpaid ? ' (in credit)' : '');
      // Reflect the paid-down balance on the attached customer immediately
      // so the ticket bar's Settle button hides itself once nothing's owed.
      POS.customer.open_balance_cents = Math.max(0, Math.round(r.balance_after_usd * 100));
      posSaveState();
      setTimeout(function(){ posCloseModal(); if (after) after(); }, 1200);
    } catch (e) {
      msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = e.message;
    }
  });
}

async function posHoldCart(after){
  if (!POS.cart.length) return alert('Nothing to hold — the cart is empty.');
  var label = prompt('Label this held ticket (so you can find it again):',
    POS.custName || (POS.customer && POS.customer.name) || 'Walk-in');
  if (label === null) return;
  try {
    var res = await api('/api/admin/pos/hold', { method:'POST', body: {
      label: label || 'Walk-in',
      items: posCartPayload(),
      customer_id: POS.customer ? POS.customer.id : null,
      customer_name: POS.custName || null,
      customer_phone: POS.custPhone || null,
      vehicle_info: POS.vehicle || null,
      sales_rep_id: POS.rep ? POS.rep.id : null,
      sales_rep_name: POS.rep ? POS.rep.name : null,
      notes: POS.notes || null,
    }});
    alert('Held as ' + res.hold_number + '. Recall it from 📂 Recall (F8).');
    posResetTicket();
    if (after) after();
  } catch (e) {
    alert('Could not hold that ticket: ' + e.message);
  }
}

// F8 Recall -- one modal, three sources of "a ticket from before": a parked
// cart (Held), an unpriced/priced estimate (Quote), or a completed sale
// (Invoice, for looking one up/reprinting/starting a return without
// leaving the counter for the separate POS Sales & Returns tab). Held and
// Quote both load their lines back into the current cart the same way;
// Invoice never does -- it's already been paid, "recalling" it opens the
// existing sale-detail view (posSaleDetail, with its own reprint/return/
// void actions) instead of pretending to re-ring it.
async function posRecallModal(after){
  var mode = 'held';
  var today = new Date().toISOString().slice(0, 10);
  var invFrom = today, invTo = today;

  function tabBtn(key, glyph, label){
    var on = mode === key;
    return '<button type="button" class="posRecallTab" data-mode="' + key + '" style="padding:8px 14px;border:0;border-bottom:2px solid ' + (on ? 'var(--sky)' : 'transparent') + ';background:none;font-weight:700;font-size:12.5px;cursor:pointer;color:' + (on ? 'var(--heading)' : 'var(--muted)') + ';font-family:inherit">' + glyph + ' ' + label + '</button>';
  }

  async function heldBody(){
    var holds = [];
    try { holds = (await api('/api/admin/pos/holds')).holds || []; }
    catch (e) { return '<div class="empty">Could not load held tickets: ' + esc(e.message) + '</div>'; }
    if (!holds.length) return '<div class="empty">No held tickets.</div>';
    return '<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:420px;overflow-y:auto">' +
      holds.map(function(h){
        var items = [];
        try { items = JSON.parse(h.items_json || '[]') || []; } catch (_) {}
        return '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--card-soft2)">' +
          '<div style="flex:1">' +
            '<b style="color:var(--heading);font-size:13.5px">' + esc(h.label || 'Walk-in') + '</b> ' +
            '<code style="font-size:11px;color:var(--muted)">' + esc(h.hold_number || '') + '</code>' +
            '<br/><small style="color:var(--muted)">' + items.length + ' line' + (items.length === 1 ? '' : 's') + ' · ' + posCents(h.subtotal_cents) +
              ' · ' + fmtDate(h.created_at) + (h.held_by_name ? ' · ' + esc(h.held_by_name) : '') + '</small>' +
            (h.vehicle_info ? '<br/><small style="color:var(--muted)">🚗 ' + esc(h.vehicle_info) + '</small>' : '') +
          '</div>' +
          '<button type="button" class="btn ok" data-recall-held="' + h.id + '">Recall</button>' +
          '<button type="button" class="btn" data-drop-held="' + h.id + '" style="background:#fee2e2;color:#b91c1c">Discard</button>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  async function quotesBody(){
    var quotes = [];
    try { quotes = (await api('/api/admin/pos/quotes')).quotes || []; }
    catch (e) { return '<div class="empty">Could not load quotes: ' + esc(e.message) + '</div>'; }
    if (!quotes.length) return '<div class="empty">No quotes yet.</div>';
    return '<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:420px;overflow-y:auto">' +
      quotes.map(function(q){
        var statusCls = q.status === 'converted' ? 'ok' : (q.status === 'declined' || q.status === 'expired' ? 'bad' : 'pending');
        return '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--card-soft2)">' +
          '<div style="flex:1">' +
            '<b style="color:var(--heading);font-size:13.5px">' + esc(q.customer_name || 'Walk-in') + '</b> ' +
            '<code style="font-size:11px;color:var(--muted)">' + esc(q.quote_number || '') + '</code> ' +
            badge(q.status || 'open', statusCls) +
            '<br/><small style="color:var(--muted)">' + fmtMoney(q.total_usd) + ' · ' + fmtDate(q.created_at) +
              (q.valid_until ? ' · valid until ' + esc(q.valid_until) : '') + '</small>' +
          '</div>' +
          (q.status !== 'converted' ? '<button type="button" class="btn ok" data-recall-quote="' + q.id + '">Load</button>' : '') +
          '<button type="button" class="btn ghost" data-view-quote="' + q.id + '">View</button>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  async function invoicesBody(){
    var r;
    try { r = await api('/api/admin/pos/sales?from=' + invFrom + '&to=' + invTo); }
    catch (e) { return '<div class="empty">Could not load invoices: ' + esc(e.message) + '</div>'; }
    var rows = r.sales || [];
    return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12.5px">' +
        '<label class="lbl" style="margin:0">From</label><input type="date" id="prInvFrom" value="' + invFrom + '" class="fld" style="width:140px"/>' +
        '<label class="lbl" style="margin:0">To</label><input type="date" id="prInvTo" value="' + invTo + '" class="fld" style="width:140px"/>' +
        '<button type="button" class="btn" id="prInvGo">Apply</button>' +
      '</div>' +
      (rows.length
        ? '<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:360px;overflow-y:auto">' +
            rows.map(function(s){
              return '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--card-soft2)' + (s.voided ? ';opacity:.55' : '') + '">' +
                '<div style="flex:1">' +
                  '<b style="color:var(--heading);font-size:13.5px">' + esc(s.receipt_number || '') + '</b>' +
                  (s.voided ? ' ' + badge('voided', 'bad') : '') +
                  '<br/><small style="color:var(--muted)">' + esc(s.customer_name || 'Walk-in') + ' · ' + fmtMoney(s.total_usd) + ' · ' + fmtDate(s.created_at) + '</small>' +
                '</div>' +
                '<button type="button" class="btn ghost" data-view-invoice="' + s.id + '">View</button>' +
              '</div>';
            }).join('') +
          '</div>'
        : '<div class="empty">No invoices in that range.</div>');
  }

  async function paint(){
    var body = mode === 'held' ? await heldBody() : mode === 'quotes' ? await quotesBody() : await invoicesBody();
    posModal('📂 Recall',
      '<div style="display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px">' +
        tabBtn('held', '⏸', 'Held tickets') + tabBtn('quotes', '📝', 'Quotes') + tabBtn('invoices', '🧾', 'Invoices') +
      '</div>' + body,
      600
    );
    document.querySelectorAll('.posRecallTab').forEach(function(b){
      b.addEventListener('click', function(){ mode = b.getAttribute('data-mode'); paint(); });
    });

    // ---- Held: recall / discard (unchanged behaviour, moved from the old
    // single-purpose version of this modal)
    document.querySelectorAll('[data-recall-held]').forEach(function(b){
      b.addEventListener('click', async function(){
        if (POS.cart.length && !confirm('The current cart will be replaced. Continue?')) return;
        var id = b.getAttribute('data-recall-held');
        try {
          var res = await api('/api/admin/pos/holds/' + id);
          var h = res.hold;
          var items = JSON.parse(h.items_json || '[]') || [];
          POS = posBlankTicket();
          // items_json stores exactly what posCartPayload() sends --
          // unit_price_usd/discount_usd (dollars), not the _cents names.
          POS.cart = items.map(function(it){
            return {
              img: it.product_img, name: it.description, price: Number(it.unit_price_usd) || 0,
              qty: it.qty || 1, disc: Number(it.discount_usd) || 0, discNote: it.discount_note || '',
            };
          });
          POS.custName = h.customer_name || '';
          POS.custPhone = h.customer_phone || '';
          POS.vehicle = h.vehicle_info || '';
          POS.rep = h.sales_rep_id ? { id: h.sales_rep_id, name: h.sales_rep_name } : null;
          POS.holdId = h.id;
          // The customer record itself isn't stored on the hold, so re-attach
          // it by id to get a live points balance rather than a stale one.
          if (h.customer_id) {
            try {
              var lk = await api('/api/admin/pos/customer-lookup?q=' + encodeURIComponent(h.customer_name || ''));
              var m = (lk.matches || []).find(function(x){ return x.id === h.customer_id; });
              if (m) POS.customer = { id: m.id, name: m.name, phone: m.phone, email: m.email, price_tier: m.price_tier, points_balance: m.points_balance || 0, open_balance_cents: m.open_balance_cents || 0 };
            } catch (_) {}
          }
          posSaveState();
          posCloseModal();
          if (after) after();
        } catch (e) { alert('Could not recall that ticket: ' + e.message); }
      });
    });
    document.querySelectorAll('[data-drop-held]').forEach(function(b){
      b.addEventListener('click', async function(){
        if (!confirm('Discard this held ticket for good?')) return;
        try { await api('/api/admin/pos/holds/' + b.getAttribute('data-drop-held'), { method: 'DELETE' }); paint(); }
        catch (e) { alert(e.message); }
      });
    });

    // ---- Quotes: load into cart (same mapping showQuoteDetail's own "Load
    // into POS" button uses) or view full detail
    document.querySelectorAll('[data-recall-quote]').forEach(function(b){
      b.addEventListener('click', async function(){
        if (POS.cart.length && !confirm('The current cart will be replaced. Continue?')) return;
        var id = b.getAttribute('data-recall-quote');
        try {
          var res = await api('/api/admin/pos/quotes/' + id);
          var q = res.quote;
          var items = [];
          try { items = JSON.parse(q.items_json || '[]') || []; } catch (_) {}
          POS = posBlankTicket();
          // Same items_json shape as the Held branch above -- unit_price_usd/
          // discount_usd, not _cents.
          POS.cart = items.map(function(it){
            return {
              img: it.product_img, name: it.description, price: Number(it.unit_price_usd) || 0,
              qty: it.qty || 1, disc: Number(it.discount_usd) || 0, discNote: it.discount_note || '',
            };
          });
          POS.custName = q.customer_name || '';
          POS.custPhone = q.customer_phone || '';
          POS.vehicle = q.vehicle_info || '';
          POS.rep = q.sales_rep_id ? { id: q.sales_rep_id, name: q.sales_rep_name } : null;
          POS.quoteId = q.id;
          if (q.customer_id) POS.customer = { id: q.customer_id, name: q.customer_name, phone: q.customer_phone, email: q.customer_email, price_tier: 'retail', points_balance: 0, open_balance_cents: 0 };
          posSaveState();
          posCloseModal();
          if (after) after();
        } catch (e) { alert('Could not load that quote: ' + e.message); }
      });
    });
    document.querySelectorAll('[data-view-quote]').forEach(function(b){
      b.addEventListener('click', function(){ showQuoteDetail(b.getAttribute('data-view-quote')); });
    });

    // ---- Invoices: date range + view (a completed sale opens the existing
    // sale-detail view -- reprint/return/void live there already, no reason
    // to duplicate them here)
    var invGo = document.getElementById('prInvGo');
    if (invGo) invGo.addEventListener('click', function(){
      invFrom = document.getElementById('prInvFrom').value || today;
      invTo = document.getElementById('prInvTo').value || today;
      paint();
    });
    document.querySelectorAll('[data-view-invoice]').forEach(function(b){
      b.addEventListener('click', function(){ posSaleDetail(b.getAttribute('data-view-invoice'), after); });
    });
  }

  paint();
}

// =============================================================================
//  QUOTES
//  Lines with no price go up at zero -- that's what makes it a request for a
//  quote rather than an offer, and it puts the part numbers and quantities on
//  record so the quote can be priced and re-issued later without re-keying it.
// =============================================================================
async function posSaveCartAsQuote(after){
  if (!POS.cart.length) return alert('Cart is empty.');
  var t = posTotals();
  try {
    var resp = await api('/api/admin/pos/quote', { method:'POST', body: {
      items: posCartPayload(),
      discount_usd: t.orderDisc,
      customer_id: POS.customer ? POS.customer.id : null,
      customer_name: POS.custName || (POS.customer && POS.customer.name) || null,
      customer_phone: POS.custPhone || null,
      customer_email: POS.customer ? POS.customer.email : null,
      vehicle_info: POS.vehicle || null,
      sales_rep_id: POS.rep ? POS.rep.id : null,
      sales_rep_name: POS.rep ? POS.rep.name : null,
      notes: POS.notes || null,
    }});
    var unpriced = POS.cart.filter(function(i){ return !(i.price > 0); }).length;
    if (confirm('Quote ' + resp.quote_number + ' saved — ' + posCents(resp.total_cents) +
        (unpriced ? '\n\n' + unpriced + ' line' + (unpriced === 1 ? '' : 's') + ' saved with no price; open the quote to fill them in once you have costs.' : '') +
        '\n\nPrint it now?')) {
      var q = await api('/api/admin/pos/quotes/' + resp.id);
      posPrintQuote(q.quote, q.shop);
    }
    posResetTicket();
    if (after) after();
  } catch (e) {
    alert('Could not save the quote: ' + e.message);
  }
}

// Everything the counter saves from the POS lands here, priced or not. A quote
// with unpriced lines is a job to finish, so those are called out.

        '<td>' + fmtDate(q.created_at) + '</td>' +
        '<td>' + esc(q.customer_name || '—') +
          (q.customer_phone ? '<br/><small><a href="tel:' + esc(q.customer_phone) + '">' + esc(q.customer_phone) + '</a></small>' : '') + '</td>' +

async function showQuoteDetail(ref){
  var r;
  try { r = await api('/api/admin/pos/quotes/' + encodeURIComponent(ref)); }
  catch (e) { return alert('Could not load that quote: ' + e.message); }
  var q = r.quote;
  var items = [];
  try { items = JSON.parse(q.items_json || '[]') || []; } catch (_) {}
  // items_json stores exactly what posCartPayload() sends when a quote is
  // saved -- unit_price_usd (dollars), not unit_price_cents. Reading
  // unit_price_cents off these raw stored items was always undefined,
  // which made every quote's lines show "needs pricing" regardless of
  // whether a real price was set. Convert to cents here for posCents().
  var rows = items.map(function(it){
    var cents = Math.round(Number(it.unit_price_usd || 0) * 100);
    return '<tr>' +
      '<td>' + esc(it.description || it.product_img || '') +
        (it.product_img ? '<br/><code style="font-size:11px;color:var(--muted)">' + esc(it.product_img) + '</code>' : '') + '</td>' +
      '<td style="text-align:center">' + (it.qty || 1) + '</td>' +
      '<td style="text-align:right">' + (cents > 0 ? posCents(cents) : '<span style="color:#1e3a8a;font-weight:700">needs pricing</span>') + '</td>' +
      '<td style="text-align:right">' + (cents > 0 ? posCents(cents * (it.qty || 1)) : '—') + '</td>' +
    '</tr>';
  }).join('');
  var unpriced = items.filter(function(it){ return !(Number(it.unit_price_usd) > 0); }).length;

  posModal('Quote ' + esc(q.quote_number || ''),
    '<div style="font-size:13px;margin-bottom:10px">' +
      '<b>' + esc(q.customer_name || 'Walk-in') + '</b>' +
      (q.customer_phone ? ' · <a href="tel:' + esc(q.customer_phone) + '">' + esc(q.customer_phone) + '</a>' : '') +
      (q.vehicle_info ? '<br/><small style="color:var(--muted)">🚗 ' + esc(q.vehicle_info) + '</small>' : '') +
      (q.sales_rep_name ? '<br/><small style="color:var(--muted)">Rep: ' + esc(q.sales_rep_name) + '</small>' : '') +
      (q.valid_until ? '<br/><small style="color:var(--muted)">Valid until ' + esc(q.valid_until) + '</small>' : '') +
    '</div>' +
    '<table style="width:100%;font-size:12.5px"><thead><tr>' +
      '<th align="left">Part</th><th>Qty</th><th align="right">Unit</th><th align="right">Line</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div style="text-align:right;margin-top:10px;font-size:14px">' +
      '<div style="color:var(--muted);font-size:12.5px">Subtotal ' + posCents(q.subtotal_cents) +
      (q.discount_cents > 0 ? ' · Discount −' + posCents(q.discount_cents) : '') +
      ' · GCT ' + posCents(q.tax_cents) + '</div>' +
      '<b>Total ' + posCents(q.total_cents) + '</b>' +
    '</div>' +
    '<div style="display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap">' +
      '<button type="button" class="btn" id="qPrint" title="Full A4 quotation format">📄 Print quote</button>' +
      '<button type="button" class="btn ghost" id="qPrintReceipt" title="Same layout as a thermal sale receipt">🧾 Receipt-style</button>' +
      '<button type="button" class="btn ghost" id="qPrintInvoice" title="Same layout as an A4 invoice">📋 Invoice-style</button>' +
      (q.status !== 'converted'
        ? '<button type="button" class="btn ok" id="qLoad"' + (unpriced ? ' title="Unpriced lines will need a price before checkout"' : '') + '>🛒 Load into POS</button>' +
          '<button type="button" class="btn" id="qAccept">Mark accepted</button>' +
          '<button type="button" class="btn" id="qDecline" style="background:#fee2e2;color:#b91c1c">Mark declined</button>'
        : '<span style="align-self:center;font-size:12.5px;color:#15803d;font-weight:700">✔ Converted to a sale</span>') +
    '</div>'
  );

  document.getElementById('qPrint').addEventListener('click', function(){ posPrintQuote(q, r.shop); });
  document.getElementById('qPrintReceipt').addEventListener('click', function(){ posDocReceipt(posQuoteToDocData(q, r.shop)); });
  document.getElementById('qPrintInvoice').addEventListener('click', function(){ posDocInvoice(posQuoteToDocData(q, r.shop)); });
  var ld = document.getElementById('qLoad');
  if (ld) ld.addEventListener('click', function(){
    POS = posLoadState();
    if (POS.cart.length && !confirm('The current cart will be replaced. Continue?')) return;
    POS = posBlankTicket();
    // items_json stores unit_price_usd/discount_usd (what posCartPayload()
    // actually sends), not the _cents field names -- see the same note on
    // the item-rows rendering above.
    POS.cart = items.map(function(it){
      return {
        img: it.product_img, name: it.description, price: Number(it.unit_price_usd) || 0,
        qty: it.qty || 1, disc: Number(it.discount_usd) || 0, discNote: it.discount_note || '',

    });
    POS.custName = q.customer_name || '';
    POS.custPhone = q.customer_phone || '';
    POS.vehicle = q.vehicle_info || '';
    POS.rep = q.sales_rep_id ? { id: q.sales_rep_id, name: q.sales_rep_name } : null;
    POS.quoteId = q.id;
    if (q.customer_id) POS.customer = { id: q.customer_id, name: q.customer_name, phone: q.customer_phone, email: q.customer_email, price_tier: 'retail', points_balance: 0, open_balance_cents: 0 };
    posSaveState();
    posCloseModal();
    show('pos');
  });
  ['qAccept','qDecline'].forEach(function(id){
    var b = document.getElementById(id);
    if (!b) return;
    b.addEventListener('click', async function(){
      try {
        await api('/api/admin/pos/quotes/' + q.id, { method:'PATCH', body: { status: id === 'qAccept' ? 'accepted' : 'declined' } });
        posCloseModal();
        show('quotes');
      } catch (e) { alert(e.message); }
    });
  });
}

// =============================================================================
//  TENDER & CHECKOUT
//  Pick the fulfilment, discount, loyalty and tender(s), then post the sale and
//  offer whichever documents actually apply to it.
// =============================================================================
var TENDER = null;

function openTenderModal(after){
  if (!POS.cart.length) return alert('Cart is empty.');

  // Fresh tender state every open. payments is an array of
  //   { method, amount_usd|null, amount_tendered|null (cash only), reference|null }
  // amount_usd=null means "auto-fill with the remaining balance".
  TENDER = {
    payments: [ { method: 'cash', amount_usd: null, amount_tendered: null, reference: null } ],
    posting: false,
  };
  // Delivery defaults to the customer we already have, so the common case is
  // one radio click rather than retyping a name and number.
  if (!POS.ship.name) POS.ship.name = POS.custName || (POS.customer && POS.customer.name) || '';
  if (!POS.ship.phone) POS.ship.phone = POS.custPhone || (POS.customer && POS.customer.phone) || '';

  if (!document.getElementById('tenderOverlay')) {
    document.body.insertAdjacentHTML('beforeend',
      '<div id="tenderOverlay" style="position:fixed;inset:0;background:rgba(11,27,43,.78);z-index:9999;display:none;align-items:center;justify-content:center;padding:14px;overflow:auto">' +
        '<div id="tenderBox" style="background:var(--card);border-radius:14px;max-width:760px;width:100%;padding:0;box-shadow:0 24px 60px rgba(0,0,0,.5);position:relative;font-family:inherit;max-height:94vh;display:flex;flex-direction:column">' +
          '<header style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--navy);color:#fff;border-radius:14px 14px 0 0">' +
            '<h2 id="tenderTitle" style="margin:0;font-size:17px;letter-spacing:.5px">💳 TENDER &amp; CHECKOUT</h2>' +
            '<button id="tenderClose" type="button" style="background:none;border:0;color:#fff;font-size:26px;line-height:1;cursor:pointer">&times;</button>' +
          '</header>' +
          '<div id="tenderBody" style="flex:1;overflow-y:auto;padding:16px 20px"></div>' +
          '<footer id="tenderFoot" style="padding:14px 20px;border-top:1px solid var(--line);background:var(--card-soft);display:flex;justify-content:space-between;gap:10px;align-items:center;border-radius:0 0 14px 14px;flex-wrap:wrap"></footer>' +
        '</div>' +
      '</div>'
    );
    document.getElementById('tenderClose').addEventListener('click', closeTenderModal);
    document.getElementById('tenderOverlay').addEventListener('click', function(e){
      if (e.target.id === 'tenderOverlay') closeTenderModal();
    });
  }
  document.getElementById('tenderTitle').innerHTML = '💳 TENDER &amp; CHECKOUT';
  document.getElementById('tenderFoot').innerHTML =
    '<button id="tenderCancel" type="button" class="btn" style="background:var(--line)">Cancel</button>' +
    '<button id="tenderComplete" type="button" style="background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 28px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14.5px;letter-spacing:.5px">Complete Sale</button>';
  document.getElementById('tenderCancel').addEventListener('click', closeTenderModal);

  // Sum of the tender rows. Rows with amount_usd=null are auto-filled with the
  // remainder. `account` is a charge, not money, so it is tracked apart: it
  // covers the ticket but does not count as tendered and never makes change.
  function paymentSummary(total){
    var allocated = 0;
    TENDER.payments.forEach(function(p){
      if (p.amount_usd != null && p.amount_usd !== '') allocated += Number(p.amount_usd);
    });
    var remaining = Math.round((total - allocated) * 100) / 100;
    var blankIdx = -1;
    for (var i = 0; i < TENDER.payments.length; i++) {
      if (TENDER.payments[i].amount_usd == null || TENDER.payments[i].amount_usd === '') { blankIdx = i; break; }
    }
    var moneyIn = 0, charged = 0;
    TENDER.payments.forEach(function(p, idx){
      var amt = (p.amount_usd != null && p.amount_usd !== '') ? Number(p.amount_usd)
              : (idx === blankIdx ? Math.max(0, remaining) : 0);
      if (p.method === 'account') { charged += amt; return; }
      if (p.method === 'cash' && p.amount_tendered != null && p.amount_tendered !== '') moneyIn += Number(p.amount_tendered);
      else moneyIn += amt;
    });
    var dueNow = Math.round((total - charged) * 100) / 100;
    return {
      allocated: allocated, remaining: remaining, blankIdx: blankIdx,
      moneyIn: moneyIn, charged: charged, dueNow: dueNow,
      change: Math.round((moneyIn - dueNow) * 100) / 100,
    };
  }

  function paint(){
    var t = posTotals();
    var summ = paymentSummary(t.total);
    var body = document.getElementById('tenderBody');
    var ful = POS.fulfilment;

    body.innerHTML =
      // ---- Order summary
      '<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:var(--card-soft)">' +
        '<div style="font-weight:700;color:var(--heading);font-size:13px;margin-bottom:8px;letter-spacing:.5px">ORDER (' + POS.cart.length + ' line' + (POS.cart.length === 1 ? '' : 's') + ')</div>' +
        '<div style="max-height:104px;overflow-y:auto;font-size:12.5px">' +
          POS.cart.map(function(i){
            return '<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)">' +
              '<span>' + esc(i.name) + ' <small style="color:var(--muted)">× ' + i.qty + '</small>' +
                (posLineDisc(i) > 0 ? ' <small style="color:#b91c1c">−' + fmtMoney(posLineDisc(i)) + '</small>' : '') + '</span>' +
              '<b>' + fmtMoney(posLineNet(i)) + '</b>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +

      // ---- Who: read-only here; the ticket bar owns it
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:12.5px">' +
        '<span style="color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.5px">CUSTOMER</span>' +
        '<b>' + esc(POS.custName || (POS.customer && POS.customer.name) || 'Walk-in') + '</b>' +
