      '<div style="border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:12px">' +
        '<div style="font-weight:700;color:var(--heading);font-size:11.5px;margin-bottom:7px;letter-spacing:.5px">HOW IS IT LEAVING?</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">' +
          [['pickup','🏪 Counter pickup'],['delivery','🚚 Local delivery'],['shipping','📦 Courier / shipping']].map(function(f){
            var on = ful === f[0];
            return '<button type="button" class="tFul" data-ful="' + f[0] + '" style="padding:9px 6px;border:2px solid ' + (on ? 'var(--navy)' : 'var(--line)') + ';border-radius:7px;background:' + (on ? 'var(--navy)' : 'var(--card)') + ';color:' + (on ? '#fff' : 'var(--heading)') + ';font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">' + f[1] + '</button>';
          }).join('') +
        '</div>' +
        (ful === 'pickup'
          ? '<div style="margin-top:8px;font-size:12px;color:var(--muted)">Customer takes the parts at the counter — no packing slip or shipping label needed.</div>'
          : '<div style="margin-top:10px;display:grid;gap:7px">' +
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">' +
                '<input id="shName" placeholder="Recipient name" value="' + esc(POS.ship.name) + '" class="fld"/>' +
                '<input id="shPhone" placeholder="Recipient phone" value="' + esc(POS.ship.phone) + '" class="fld"/>' +
              '</div>' +
              '<input id="shLine1" placeholder="Street address *" value="' + esc(POS.ship.line1) + '" class="fld"/>' +
              '<input id="shLine2" placeholder="Apt / building / landmark" value="' + esc(POS.ship.line2) + '" class="fld"/>' +
              '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">' +
                '<input id="shCity" placeholder="Town / city" value="' + esc(POS.ship.city) + '" class="fld"/>' +
                '<select id="shParish" class="fld"><option value="">— parish —</option>' +
                  POS_PARISHES.map(function(p){ return '<option' + (POS.ship.parish === p ? ' selected' : '') + '>' + p + '</option>'; }).join('') +
                '</select>' +
              '</div>' +
              '<div style="display:grid;grid-template-columns:2fr 1fr;gap:7px">' +
                '<input id="shMethod" placeholder="' + (ful === 'delivery' ? 'Own van / driver' : 'Carrier & service (e.g. Knutsford Express)') + '" value="' + esc(POS.ship.method) + '" class="fld"/>' +
                '<div style="display:flex;align-items:center;gap:4px"><span style="font-size:12px;color:var(--muted)">Fee $</span>' +
                  '<input id="shFee" type="number" min="0" step="0.01" value="' + (POS.ship.fee || '') + '" placeholder="0.00" class="fld" style="text-align:right"/></div>' +
              '</div>' +
              '<input id="shInstr" placeholder="Delivery instructions (optional)" value="' + esc(POS.ship.instructions) + '" class="fld"/>' +
              (POS.customer && POS.customer.last_address
                ? '<button type="button" id="shUseSaved" class="btn" style="justify-self:start;font-size:11.5px">Use saved address: ' + esc(POS.customer.last_address) + '</button>'
                : '') +
            '</div>') +
      '</div>' +

      // ---- Loyalty redemption (only when a customer with points is attached)
      (POS.customer && POS.customer.points_balance > 0
        ? '<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:10px;padding:10px 14px;margin-bottom:12px">' +
            '<div style="display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:end">' +
              '<div>' +
                '<label class="lbl" style="color:#92400e">⭐ Redeem loyalty points <small style="font-weight:500">(' + POS.customer.points_balance + ' pts = ' + fmtMoney(POS.customer.points_balance * POS_POINTS_USD_RATE) + ')</small></label>' +
                '<input id="tRedeemPts" type="number" min="0" step="1" max="' + POS.customer.points_balance + '" value="' + (POS.redeemPts || 0) + '" style="width:100%;padding:8px 10px;border:1px solid #fde68a;border-radius:6px;font-family:inherit;font-size:14px;font-weight:700"/>' +
              '</div>' +
              '<button type="button" id="tRedeemMax" style="background:#f59e0b;color:#fff;border:0;border-radius:6px;padding:9px 12px;font-weight:700;font-size:12px;cursor:pointer">Max</button>' +
              '<div style="font-size:14px;font-weight:700;color:#92400e">−' + fmtMoney(t.loyaltyDisc) + '</div>' +
            '</div>' +
          '</div>'
        : '') +

      // ---- Totals strip
      '<div style="background:var(--navy);color:#fff;border-radius:10px;padding:14px 16px;margin-bottom:12px;font-size:13.5px">' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Subtotal</span><span>' + fmtMoney(t.subtotal) + '</span></div>' +
        (t.orderDisc > 0 ? '<div style="display:flex;justify-content:space-between;margin-bottom:4px;color:#fca5a5"><span>Ticket discount</span><span>−' + fmtMoney(t.orderDisc) + '</span></div>' : '') +
        (t.loyaltyDisc > 0 ? '<div style="display:flex;justify-content:space-between;margin-bottom:4px;color:#fcd34d"><span>⭐ Loyalty (' + t.redeemPts + ' pts)</span><span>−' + fmtMoney(t.loyaltyDisc) + '</span></div>' : '') +
        (t.shipping > 0 ? '<div style="display:flex;justify-content:space-between;margin-bottom:4px;color:#7dd3fc"><span>Shipping</span><span>' + fmtMoney(t.shipping) + '</span></div>' : '') +
        '<div style="display:flex;justify-content:space-between;margin-bottom:6px;color:#cbd5e1"><span>' + (POS.customer && POS.customer.tax_exempt ? 'GCT (exempt)' : 'GCT 15%') + '</span><span>' + fmtMoney(t.tax) + '</span></div>' +
        '<div style="display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid #1e3a5f;font-size:17px;font-weight:800"><span>TOTAL DUE</span><span style="color:#fbbf24">' + fmtMoney(t.total) + '</span></div>' +
      '</div>' +

      // ---- Tenders
      '<div style="margin-bottom:12px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
          '<label class="lbl" style="margin:0">Payment' + (TENDER.payments.length > 1 ? 's (split tender)' : '') + '</label>' +
          '<button type="button" id="tAddPayment" style="background:#ecfeff;border:1px solid #67e8f9;color:#0e7490;border-radius:6px;padding:4px 10px;font-size:11.5px;font-weight:700;cursor:pointer">+ Add tender</button>' +
        '</div>' +
        TENDER.payments.map(function(p, idx){ return renderPaymentRow(p, idx, summ.blankIdx === idx ? Math.max(0, summ.remaining) : null); }).join('') +
        (summ.charged > 0
          ? '<div style="display:flex;justify-content:space-between;margin-top:6px;padding:7px 10px;background:#fef3c7;border:1px solid #fde68a;border-radius:6px;font-size:12.5px">' +
              '<span style="color:#92400e;font-weight:700">📗 On account (balance due)</span><b style="color:#92400e">' + fmtMoney(summ.charged) + '</b></div>'
          : '') +
        '<div style="display:flex;justify-content:space-between;margin-top:6px;padding:6px 10px;background:' + (summ.moneyIn + 0.001 >= summ.dueNow ? '#dcfce7' : '#fee2e2') + ';border-radius:6px;font-size:12.5px">' +
          '<span style="color:#374151">Tendered / due now</span>' +
          '<b style="color:' + (summ.moneyIn + 0.001 >= summ.dueNow ? '#15803d' : '#b91c1c') + '">' + fmtMoney(summ.moneyIn) + ' / ' + fmtMoney(summ.dueNow) + '</b>' +
        '</div>' +
        (summ.change > 0 && TENDER.payments.some(function(p){ return p.method === 'cash'; })
          ? '<div style="display:flex;justify-content:space-between;margin-top:4px;padding:6px 10px;background:#dcfce7;border-radius:6px;font-size:13px"><span style="color:#374151;font-weight:700">Change due</span><b style="color:#15803d;font-size:15px">' + fmtMoney(summ.change) + '</b></div>'
          : '') +
      '</div>' +

      // ---- Reference + notes
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
        '<div><label class="lbl">Customer PO / job ref (optional)</label>' +
          '<input id="tPo" value="' + esc(POS.poNumber || '') + '" placeholder="Their reference" class="fld"/></div>' +
        '<div><label class="lbl">Notes (optional)</label>' +
          '<input id="tNotes" value="' + esc(POS.notes || '') + '" placeholder="Prints on the invoice" class="fld"/></div>' +
      '</div>';

    wireEvents();
  }

  function renderPaymentRow(p, idx, autoFillHint){
    var methods = { cash:'💵 Cash', card:'💳 Card', cheque:'📝 Cheque', bank:'🏦 Bank', account:'📗 Account' };
    var isCash = p.method === 'cash';
    var isAccount = p.method === 'account';
    var hint = autoFillHint != null ? autoFillHint.toFixed(2) + ' (auto)' : '0.00';
    // Charging to an account needs a real customer record to charge against.
    var accountBlocked = isAccount && !POS.customer;
    return '<div style="border:1px solid ' + (accountBlocked ? '#fca5a5' : 'var(--line)') + ';border-radius:8px;padding:10px;margin-bottom:6px;background:var(--card-soft)">' +
      '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px">' +
        Object.keys(methods).map(function(m){
          var on = p.method === m;
          return '<button type="button" class="tPayMethodBtn" data-pidx="' + idx + '" data-method="' + m + '" style="padding:6px 3px;border:2px solid ' + (on ? 'var(--navy)' : 'var(--line)') + ';border-radius:6px;background:' + (on ? 'var(--navy)' : 'var(--card)') + ';color:' + (on ? '#fff' : 'var(--heading)') + ';font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">' + methods[m] + '</button>';
        }).join('') +
      '</div>' +
      (accountBlocked
        ? '<div style="background:#fee2e2;color:#b91c1c;padding:6px 9px;border-radius:5px;font-size:12px;font-weight:700;margin-bottom:7px">Attach a customer account first — “Find” or “New” on the ticket bar.</div>'
        : '') +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end">' +
        '<div>' +
          '<label style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px">Amount</label>' +
          '<input class="tPayAmt" data-pidx="' + idx + '" type="number" min="0" step="0.01" value="' + (p.amount_usd != null && p.amount_usd !== '' ? p.amount_usd : '') + '" placeholder="' + hint + '" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:13px;font-weight:700"/>' +
        '</div>' +
        (isCash
          ? '<div>' +
              '<label style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px">Tendered</label>' +
              '<input class="tPayTendered" data-pidx="' + idx + '" type="number" min="0" step="0.01" value="' + (p.amount_tendered != null && p.amount_tendered !== '' ? p.amount_tendered : '') + '" placeholder="' + hint + '" style="width:100%;padding:7px 9px;border:1px solid #86efac;background:#f0fdf4;border-radius:5px;font-family:inherit;font-size:13px;font-weight:700"/>' +
            '</div>'
          : isAccount
            ? '<div><label style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px">Due date</label>' +
                '<input class="tPayRef" data-pidx="' + idx + '" type="date" value="' + esc(p.reference || '') + '" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:13px"/></div>'
            : '<div>' +
                '<label style="font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;display:block;margin-bottom:3px">Reference</label>' +
                '<input class="tPayRef" data-pidx="' + idx + '" type="text" value="' + esc(p.reference || '') + '" placeholder="' + (p.method === 'card' ? '****1234' : p.method === 'cheque' ? 'CHQ #5012' : 'Txn ref') + '" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;font-family:inherit;font-size:13px"/>' +
              '</div>'
        ) +
      '</div>' +
      (isCash
        ? '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">' +
            [500,1000,2000,5000].map(function(q){
              return '<button type="button" class="tQuickAmt" data-pidx="' + idx + '" data-amt="' + q + '" style="flex:1;background:var(--card);border:1px solid #86efac;color:#15803d;padding:3px 4px;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer">+$' + q + '</button>';
            }).join('') +
            '<button type="button" class="tExact" data-pidx="' + idx + '" style="flex:1;background:#15803d;color:#fff;border:0;padding:3px 4px;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer">EXACT</button>' +
          '</div>'
        : '') +
      (TENDER.payments.length > 1
        ? '<div style="text-align:right;margin-top:6px"><button type="button" class="tRemPayment" data-pidx="' + idx + '" style="background:none;border:0;color:#b91c1c;font-size:11px;cursor:pointer;font-weight:700">Remove tender ✕</button></div>'
        : '') +
    '</div>';
  }

  function wireEvents(){
    // Fulfilment
    document.querySelectorAll('.tFul').forEach(function(b){
      b.addEventListener('click', function(){
        POS.fulfilment = this.getAttribute('data-ful');
        if (POS.fulfilment === 'pickup') POS.ship.fee = 0;
        posSaveState();
        paint();
      });
    });
    var shipFields = { shName:'name', shPhone:'phone', shLine1:'line1', shLine2:'line2', shCity:'city', shParish:'parish', shMethod:'method', shInstr:'instructions' };
    Object.keys(shipFields).forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.addEventListener('input', function(){ POS.ship[shipFields[id]] = this.value; posSaveState(); });
    });
    var fee = document.getElementById('shFee');
    if (fee) fee.addEventListener('input', function(){ POS.ship.fee = Math.max(0, Number(this.value) || 0); posSaveState(); paint(); });
    var saved = document.getElementById('shUseSaved');
    if (saved) saved.addEventListener('click', async function(){
      try {
        var r = await api('/api/admin/pos/customer/' + POS.customer.id + '/addresses');
        var a = (r.addresses || [])[0];
        if (!a) return;
        POS.ship.line1 = a.line1 || ''; POS.ship.line2 = a.line2 || '';
        POS.ship.city = a.city || ''; POS.ship.parish = a.parish || '';
        POS.ship.name = a.recipient || POS.ship.name; POS.ship.phone = a.phone || POS.ship.phone;
        posSaveState(); paint();
      } catch (e) { alert(e.message); }
    });

    // Loyalty
    var rp = document.getElementById('tRedeemPts');
    if (rp) rp.addEventListener('input', function(){ POS.redeemPts = parseInt(this.value, 10) || 0; posSaveState(); paint(); });
    var rmax = document.getElementById('tRedeemMax');
    if (rmax) rmax.addEventListener('click', function(){
      // Cap redemption at what the ticket is actually worth, so points aren't
      // burned past a zero balance.
      var save = POS.redeemPts;
      POS.redeemPts = 0;
      var t0 = posTotals();
      POS.redeemPts = save;
      POS.redeemPts = Math.min(POS.customer.points_balance, Math.floor(t0.total / POS_POINTS_USD_RATE));
      posSaveState();
      paint();
    });

    // Tenders
    document.querySelectorAll('.tPayMethodBtn').forEach(function(b){
      b.addEventListener('click', function(){
        TENDER.payments[parseInt(this.getAttribute('data-pidx'), 10)].method = this.getAttribute('data-method');
        paint();
      });
    });
    document.querySelectorAll('.tPayAmt').forEach(function(inp){
      inp.addEventListener('input', function(){
        TENDER.payments[parseInt(this.getAttribute('data-pidx'), 10)].amount_usd = this.value === '' ? null : Number(this.value);
        paint();
      });
    });
    document.querySelectorAll('.tPayTendered').forEach(function(inp){
      inp.addEventListener('input', function(){
        TENDER.payments[parseInt(this.getAttribute('data-pidx'), 10)].amount_tendered = this.value === '' ? null : Number(this.value);
        paint();
      });
    });
    document.querySelectorAll('.tPayRef').forEach(function(inp){
      inp.addEventListener('input', function(){
        TENDER.payments[parseInt(this.getAttribute('data-pidx'), 10)].reference = this.value;
      });
    });
    document.querySelectorAll('.tQuickAmt').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(this.getAttribute('data-pidx'), 10);
        var cur = TENDER.payments[i].amount_tendered != null ? Number(TENDER.payments[i].amount_tendered) : 0;
        TENDER.payments[i].amount_tendered = Math.round((cur + Number(this.getAttribute('data-amt'))) * 100) / 100;
        paint();
      });
    });
    document.querySelectorAll('.tExact').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(this.getAttribute('data-pidx'), 10);
        var t = posTotals();
        var summ = paymentSummary(t.total);
        var rest = summ.blankIdx === i ? Math.max(0, summ.remaining) : Number(TENDER.payments[i].amount_usd || 0);
        if (!rest) rest = Math.max(0, summ.remaining);
        TENDER.payments[i].amount_usd = rest;
        TENDER.payments[i].amount_tendered = rest;
        paint();
      });
    });
    var addBtn = document.getElementById('tAddPayment');
    if (addBtn) addBtn.addEventListener('click', function(){
      TENDER.payments.push({ method: 'card', amount_usd: null, amount_tendered: null, reference: null });
      paint();
    });
    document.querySelectorAll('.tRemPayment').forEach(function(btn){
      btn.addEventListener('click', function(){
        TENDER.payments.splice(parseInt(this.getAttribute('data-pidx'), 10), 1);
        if (!TENDER.payments.length) TENDER.payments = [{ method:'cash', amount_usd:null, amount_tendered:null, reference:null }];
        paint();
      });
    });

    var po = document.getElementById('tPo');   if (po) po.addEventListener('input', function(){ POS.poNumber = this.value; posSaveState(); });
    var no = document.getElementById('tNotes'); if (no) no.addEventListener('input', function(){
      POS.notes = this.value; posSaveState();
      // Keep the cart sidebar's comment box (behind this modal) in sync so
      // it doesn't show a stale value if the modal is closed without checking out.
      var cn = document.getElementById('posCartNotes'); if (cn) cn.value = this.value;
    });
  }

  paint();

  document.getElementById('tenderComplete').onclick = async function(){
    if (TENDER.posting) return;
    var completeBtn = this;
    var t = posTotals();
    var summ = paymentSummary(t.total);

    if (summ.charged > 0 && !POS.customer) {
      return alert('A charge sale has to go on a customer account. Attach a customer first, or change that tender to cash or card.');
    }
    if (POS.fulfilment !== 'pickup' && !(POS.ship.line1 || '').trim()) {
      return alert('A delivery or shipping sale needs a street address.');
    }
    if (summ.moneyIn + 0.001 < summ.dueNow) {
      return alert('Tendered (' + fmtMoney(summ.moneyIn) + ') is less than the amount due now (' + fmtMoney(summ.dueNow) + ').');
    }
    var missingRef = TENDER.payments.some(function(p){
      return (p.method === 'card' || p.method === 'cheque' || p.method === 'bank') && !(p.reference || '').trim();
    });
    if (missingRef && !confirm('One or more non-cash tenders has no reference. Continue anyway?')) return;
    if (summ.charged > 0 && !confirm('Charge ' + fmtMoney(summ.charged) + ' to ' + (POS.customer.name || 'this account') + '?\n\nThe goods leave against a balance, not against money.')) return;

    // Fill auto rows with the calculated remainder so the server sees explicit
    // numbers rather than having to guess the same way twice.
    var payments = TENDER.payments.map(function(p, idx){
      var amt = (p.amount_usd != null && p.amount_usd !== '')
        ? Number(p.amount_usd)
        : (idx === summ.blankIdx ? Math.max(0, summ.remaining) : 0);
      return {
        method: p.method,
        amount_usd: Math.round(amt * 100) / 100,
        amount_tendered: p.method === 'cash'
          ? (p.amount_tendered != null && p.amount_tendered !== '' ? Number(p.amount_tendered) : amt)
          : null,
        reference: p.method === 'account' ? null : ((p.reference || '').trim() || null),
      };
    });
    var accountRow = TENDER.payments.find(function(p){ return p.method === 'account'; });

    var payload = {
      items: posCartPayload(),
      payments: payments,
      discount_usd: t.orderDisc,
      loyalty_points_redeemed: t.redeemPts,
      customer_id: POS.customer ? POS.customer.id : null,
      customer_name: POS.custName || (POS.customer && POS.customer.name) || null,
      customer_phone: POS.custPhone || null,
      vehicle_info: POS.vehicle || null,
      sales_rep_id: POS.rep ? POS.rep.id : null,
      sales_rep_name: POS.rep ? POS.rep.name : null,
      notes: POS.notes || null,
      po_number: POS.poNumber || null,
      fulfilment: POS.fulfilment,
      ship_method: POS.ship.method || null,
      ship_fee_usd: POS.fulfilment === 'pickup' ? 0 : (Number(POS.ship.fee) || 0),
      ship_name: POS.ship.name || null,
      ship_phone: POS.ship.phone || null,
      ship_line1: POS.ship.line1 || null,
      ship_line2: POS.ship.line2 || null,
      ship_city: POS.ship.city || null,
      ship_parish: POS.ship.parish || null,
      ship_instructions: POS.ship.instructions || null,
      due_date: accountRow && accountRow.reference ? accountRow.reference : null,
      quote_id: POS.quoteId || null,
      hold_id: POS.holdId || null,
    };

    TENDER.posting = true;
    completeBtn.disabled = true;
    completeBtn.textContent = 'Posting…';
    try {
      var resp = await api('/api/admin/pos/sale', { method:'POST', body: payload });
      // Re-read the stored sale so every document prints from the canonical
      // record rather than from whatever is still in the browser.
      var full = null;
      try { full = await api('/api/admin/pos/sales/' + resp.id); } catch (_) {}
      posResetTicket();
      showTenderReceipt(resp, full, after);
    } catch (e) {
      TENDER.posting = false;
      alert('Sale failed: ' + e.message);
      completeBtn.disabled = false;
      completeBtn.textContent = 'Complete Sale';
    }
  };

  document.getElementById('tenderOverlay').style.display = 'flex';
}

function closeTenderModal(){
  var o = document.getElementById('tenderOverlay');

}

// -----------------------------------------------------------------------------
//  Post-sale: confirmation plus the document rack. Which documents are offered
//  depends on how the goods are leaving -- a counter pickup has nothing to pack
//  and nothing to label, so those two are shown disabled with the reason rather
//  than hidden, so the operator can see the rule instead of wondering.
// -----------------------------------------------------------------------------
function showTenderReceipt(resp, full, after){
  // full (a fresh GET /api/admin/pos/sales/:id, fetched right after posting)
  // is the canonical source when it loaded -- resp is the direct POST reply,
  // which has the same real dollar fields (subtotal_usd, tax_usd, etc., NOT
  // the *_cents/invoice_number/fulfilment/delivery/balance_due shape this
  // function used to read -- those never existed on either response, so the
  // totals shown here were silently all zero on every single sale).
  var sale = (full && full.sale) || resp;
  var pays = (full && full.payments) || resp.payments || [];
  var loyalty = resp.loyalty;
  var methodLabel = posMethodLabel;

  document.getElementById('tenderTitle').innerHTML = '✅ SALE COMPLETE';
  document.getElementById('tenderBody').innerHTML =
    '<div style="text-align:center;padding:18px 10px 14px">' +
      '<div style="font-size:52px;line-height:1">✅</div>' +
      '<h2 style="margin:10px 0 2px;color:var(--heading);font-size:21px">Sale Complete</h2>' +
      '<p style="color:var(--muted);font-size:13.5px;margin:0">Receipt <b>' + esc(resp.receipt_number || sale.receipt_number || '') + '</b></p>' +
      (loyalty && (loyalty.points_earned || loyalty.points_redeemed)
        ? '<p style="color:#92400e;font-size:12.5px;margin:5px 0 0">' +
            (loyalty.points_redeemed ? '⭐ ' + loyalty.points_redeemed + ' pts redeemed · ' : '') +
            (loyalty.points_earned ? '+' + loyalty.points_earned + ' pts earned · ' : '') +
            'Balance: ' + (loyalty.balance != null ? loyalty.balance : 0) + ' pts' +
          '</p>'
        : '') +
    '</div>' +

    '<div style="display:flex;justify-content:center;margin-bottom:16px"><div style="background:var(--card-soft);border:1px solid var(--line);border-radius:10px;padding:14px 22px;text-align:left;min-width:310px;font-size:13.5px">' +
      '<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span>Subtotal</span><b>' + fmtMoney(sale.subtotal_usd) + '</b></div>' +
      (Number(sale.discount_usd) > Number(sale.loyalty_discount_usd || 0) ? '<div style="display:flex;justify-content:space-between;margin-bottom:3px;color:#b91c1c"><span>Discount</span><b>−' + fmtMoney(sale.discount_usd - Number(sale.loyalty_discount_usd || 0)) + '</b></div>' : '') +
      (Number(sale.loyalty_discount_usd) > 0 ? '<div style="display:flex;justify-content:space-between;margin-bottom:3px;color:#92400e"><span>⭐ Loyalty</span><b>−' + fmtMoney(sale.loyalty_discount_usd) + '</b></div>' : '') +
      '<div style="display:flex;justify-content:space-between;margin-bottom:3px;color:var(--muted)"><span>' + (sale.tax_exempt ? 'GCT (exempt)' : 'GCT 15%') + '</span><b>' + fmtMoney(sale.tax_usd) + '</b></div>' +
      '<div style="display:flex;justify-content:space-between;padding-top:6px;border-top:1px solid var(--line);font-size:16px;margin-bottom:6px"><b>Total</b><b>' + fmtMoney(sale.total_usd) + '</b></div>' +
      pays.map(function(p){
        return '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:#374151"><span>' + methodLabel(p.method) + (p.reference ? ' · ' + esc(p.reference) : '') + '</span><b>' + fmtMoney(p.amount_usd) + '</b></div>';
      }).join('') +
      (Number(resp.change_due || sale.change_due) > 0
        ? '<div style="display:flex;justify-content:space-between;padding-top:6px;border-top:1px dashed var(--line);margin-top:4px;color:#15803d;font-size:14px"><b>Change</b><b>' + fmtMoney(resp.change_due || sale.change_due) + '</b></div>'
        : '') +
    '</div></div>' +

    // ---- Document rack. Every POS sale here is counter-pickup, paid in full
    // at the register (no delivery/fulfilment tracking, no partial-payment
    // balance-due) -- packing slip/shipping label stay honestly disabled
    // rather than pretending a shipping flow exists.
    '<div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px">' +
      '<div style="font-weight:700;color:var(--heading);font-size:11.5px;margin-bottom:9px;letter-spacing:.5px">🖨 PRINT</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px">' +
        posDocButton('receipt',  '🧾 Receipt',        'Thermal receipt for the customer', true) +
        posDocButton('invoice',  '📄 Invoice',        'Full tax invoice',                 true) +
        posDocButton('pickslip', '📋 Pick slip',      'Warehouse pull list by bin',       true) +
        posDocButton('packing',  '📦 Packing slip',   'N/A — counter pickup', false) +
        posDocButton('label',    '🏷 Shipping label', 'N/A — counter pickup', false) +
        posDocButton('gift',     '🎁 Gift receipt',   'Proof of purchase, no prices',     true) +
      '</div>' +
    '</div>';

  document.getElementById('tenderFoot').innerHTML =
    '<span style="font-size:12px;color:var(--muted)">Counter pickup — pick a format above, print it, and hand over the parts.</span>' +
    '<button id="tenderDone" type="button" style="background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 28px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14.5px">Done</button>';

  document.querySelectorAll('[data-doc]').forEach(function(b){
    if (b.disabled) return;
    b.addEventListener('click', async function(){
      var data = full;
      if (!data) {
        try { data = await api('/api/admin/pos/sales/' + resp.id); }
        catch (e) { return alert('Could not load the sale to print: ' + e.message); }
      }
      // posPrintDoc's templates read the cents-based shape posSaleToDocData()
      // produces, not the raw {sale,items,payments} this screen already has
      // -- posSaleDetail's reprint buttons go through that adapter, this one
      // didn't, so every document printed straight off "Sale Complete" came
      // out blank/zeroed even though reprinting the same sale later worked.
      posPrintDoc(this.getAttribute('data-doc'), posSaleToDocData(data, POS_SHOP));
    });
  });
  document.getElementById('tenderDone').addEventListener('click', function(){
    closeTenderModal();
    if (after) after();
  });

  // Auto-print the shop's default document (Setup → Print defaults) so the
  // common case -- ring up, hand over a receipt -- needs no click at all.
  // The document rack above stays fully available for anything else (a
  // customer who wants an invoice too, a gift receipt, a reprint).
  (async function(){
    var autoKind = POS_SHOP.default_print_template === 'invoice' ? 'invoice' : 'receipt';
    var autoBtn = document.querySelector('[data-doc="' + autoKind + '"]');
    if (!autoBtn || autoBtn.disabled) return;
    // Same {sale,items,payments} shape posSaleToDocData() needs -- `full` is
    // usually already that shape; refetch rather than falling back to the
    // raw POST response, which is flat (no .sale/.items) and would print
    // blank, same bug the manual document buttons above were fixed for.
    var data = full;
    if (!data) { try { data = await api('/api/admin/pos/sales/' + resp.id); } catch (_) { return; } }
    posPrintDoc(autoKind, posSaleToDocData(data, POS_SHOP));
  })();
}

function posDocButton(kind, label, sub, enabled){
  return '<button type="button" data-doc="' + kind + '"' + (enabled ? '' : ' disabled') +
    ' style="text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:' + (enabled ? 'var(--card)' : 'var(--card-soft2)') +
    ';cursor:' + (enabled ? 'pointer' : 'not-allowed') + ';font-family:inherit;opacity:' + (enabled ? '1' : '.55') + '">' +
    '<b style="font-size:12.5px;color:' + (enabled ? 'var(--heading)' : 'var(--muted)') + '">' + label + '</b>' +
    '<br/><small style="font-size:10.5px;color:var(--muted)">' + sub + '</small>' +
  '</button>';
}

function posMethodLabel(m){
  return ({ cash:'Cash', card:'Card', cheque:'Cheque', bank:'Bank transfer', loyalty:'Loyalty', gift_card:'Gift card', account:'On account', split:'Split', store_credit:'Store credit' })[m] || m;
}

// =============================================================================
//  COUNTER DOCUMENTS
//  Five documents come off a sale, and which ones apply depends on how the
//  goods leave:
//    receipt   — always. Thermal, for the customer.
//    invoice   — always. A4 tax invoice; the one a trade customer files.
//    pick slip — always. Bin-ordered pull list, no prices, for the warehouse.
//    packing   — only when it is being delivered or shipped. Goes in the box.
//    label     — only when it is being shipped. Address label for the parcel.
//    gift      — always. Proof of purchase with the money taken off.
//  Every document renders from the stored sale fetched back from the server,
//  so a reprint months later is identical to the original.
// =============================================================================

// Code 39: the barcode symbology a parts counter's existing scanners already
// read without configuration, and simple enough to render honestly here rather
// than pulling in a library. Each character is 9 elements (bar/space
// alternating, starting with a bar); 'w' elements are 3 units wide, 'n' are 1,
// and characters are separated by a 1-unit space.
var POS_CODE39 = {
  '0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw',
  '5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn',
  'A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn',
  'F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn',
  'K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn',
  'P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn',
  'U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn',
  'Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','*':'nwnnwnwnn'
};
function posBarcode(text, height, unit){
  var h = height || 52, u = unit || 2;
  var s = '*' + String(text || '').toUpperCase().replace(/[^0-9A-Z\-. ]/g, '-') + '*';
  var x = 0, rects = [];
  for (var i = 0; i < s.length; i++) {
    var pat = POS_CODE39[s[i]];
    if (!pat) continue;
    for (var j = 0; j < 9; j++) {
      var w = (pat[j] === 'w' ? 3 : 1) * u;
      if (j % 2 === 0) rects.push('<rect x="' + x + '" y="0" width="' + w + '" height="' + h + '"/>');
      x += w;
    }
    x += u; // inter-character gap
  }
  return '<svg viewBox="0 0 ' + x + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none" style="max-width:340px">' +
    '<g fill="#000">' + rects.join('') + '</g></svg>';
}

// Opens a print window. Kept in one place so every document shares the same
// page setup and the same "render, then print" timing -- printing before the
// document has laid out gives a blank sheet on some browsers.
function posPrintWindow(title, pageCss, bodyHtml, size){
  var w = window.open('', '_blank', size || 'width=860,height=900');
  if (!w) return alert('Your browser blocked the print window. Allow pop-ups for this site and try again.');
  w.document.write(
    '<!doctype html><html><head><meta charset="utf-8"/><title>' + esc(title) + '</title><style>' +
    '*{box-sizing:border-box}body{margin:0;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}' +
    'table{width:100%;border-collapse:collapse}' +
    '@media print{.noprint{display:none}}' +
    pageCss +
    '</style></head><body>' + bodyHtml +
    '<div class="noprint" style="text-align:center;padding:14px;font-family:system-ui,sans-serif">' +
      '<button onclick="window.print()" style="background:#0b1b2b;color:#fff;border:0;padding:10px 22px;border-radius:6px;font-weight:700;cursor:pointer">Print</button>' +
    '</div></body></html>'
  );
  w.document.close();
  w.focus();
  setTimeout(function(){ try { w.print(); } catch (_) {} }, 350);
}

function posShipToBlock(s){
  return [s.ship_name, s.ship_line1, s.ship_line2, [s.ship_city, s.ship_parish].filter(Boolean).join(', '), s.ship_country, s.ship_phone]
    .filter(Boolean).map(function(l){ return esc(l); }).join('<br/>');
}
function posShopBlock(shop){
  return esc(shop.name) + '<br/>' + esc(shop.address) + '<br/>' + esc(shop.country || '') + '<br/>' + esc(shop.phone);
}
function posWhen(s){
  return new Date(s || Date.now()).toLocaleString('en-JM', { dateStyle:'medium', timeStyle:'short' });
}

function posPrintDoc(kind, data){
  var fns = { receipt: posDocReceipt, invoice: posDocInvoice, pickslip: posDocPickSlip, packing: posDocPacking, label: posDocLabel, gift: posDocGift };
  var fn = fns[kind];
  if (!fn) return alert('Unknown document: ' + kind);
  if ((kind === 'packing' || kind === 'label') && data.sale.fulfilment === 'pickup') {
    return alert('That document does not apply to a counter pickup — there is nothing to pack or ship.');
  }
  fn(data);
}

// Logo markup shared by every A4 document (Invoice/Pick Slip/Packing Slip,
// all via this header) plus the two thermal formats below -- one place to
// gate on the "Print logo on invoice" setting so a business without a logo
// uploaded, or with it turned off, never gets a broken <img>.
function posLogoImg(shop, maxHeight){
  if (!shop || !shop.print_logo || !shop.logo_url) return '';
  return '<img src="' + esc(shop.logo_url) + '" style="max-height:' + maxHeight + 'px;max-width:100%;object-fit:contain" alt=""/>';
}
function posDocHeader(title, shop){
  var logo = posLogoImg(shop, 52);
  return '<div class="hd">' +
    (logo ? '<div style="margin-right:14px">' + logo + '</div>' : '') +
    '<div style="flex:1"><h1>' + title + '</h1></div>' +
    '<div class="shop"><b>' + esc(shop.name) + '</b><br/>' + esc(shop.address) + '<br/>' +
    esc(shop.country || '') + '<br/>Tel ' + esc(shop.phone) +
    (shop.email ? '<br/>' + esc(shop.email) : '') +
    (shop.website ? '<br/>' + esc(shop.website) : '') + '</div></div>';
}

// ---- INVOICE ---------------------------------------------------------------
function posDocInvoice(d){
  var s = d.sale, shop = d.shop;
  var paidStamp = d.is_quote
    ? '<span class="stamp" style="color:#1e40af;border-color:#1e40af">QUOTATION — NOT A TAX INVOICE</span>'
    : s.voided
      ? '<span class="stamp" style="color:#b91c1c;border-color:#b91c1c">VOIDED</span>'
      : s.balance_due_cents > 0
        ? '<span class="stamp" style="color:#b45309;border-color:#b45309">BALANCE DUE</span>'
        : '<span class="stamp" style="color:#15803d;border-color:#15803d">PAID IN FULL</span>';

  var rows = d.items.map(function(it){
    return '<tr>' +
      '<td class="c">' + it.qty + '</td>' +
      '<td><b>' + esc(it.description) + '</b>' +
        (it.product_img ? '<br/><span style="font-size:9.5px;color:#6b7280;font-family:ui-monospace,monospace">' + esc(it.sku || it.product_img) + '</span>' : '') +
        (it.discount_note ? '<br/><span style="font-size:9.5px;color:#b45309">↳ ' + esc(it.discount_note) + '</span>' : '') +
        (it.warranty_until ? '<br/><span style="font-size:9.5px;color:#0e7490">Warranty to ' + esc(it.warranty_until) + '</span>' : '') +
        (it.serial_number ? '<br/><span style="font-size:9.5px;color:#6b7280">S/N ' + esc(it.serial_number) + '</span>' : '') +
      '</td>' +
      '<td class="r">' + posCents(it.unit_price_cents) + '</td>' +
      '<td class="r">' + (it.discount_cents > 0 ? '−' + posCents(it.discount_cents) : '—') + '</td>' +
      '<td class="r"><b>' + posCents(it.total_cents) + '</b></td>' +
    '</tr>';
  }).join('');

  // Discount on the sale row is the ticket discount plus loyalty; loyalty is
  // broken out so the customer can see what their points were worth.
  var ticketDisc = (s.discount_cents || 0) - (s.loyalty_discount_cents || 0);

  posPrintWindow((d.is_quote ? 'Quote ' : 'Invoice ') + (s.invoice_number || s.receipt_number), POS_A4_CSS,
    '<div class="doc">' +
      posDocHeader(d.is_quote ? 'QUOTATION' : 'INVOICE', shop) +
      '<div class="meta">' +
        '<div class="box"><div class="lbl">Bill to</div>' +
          '<b>' + esc(s.customer_name || 'Cash sale / walk-in') + '</b>' +
          (s.customer_phone ? '<br/>' + esc(s.customer_phone) : '') +
          (s.vehicle_info ? '<br/><span style="color:#6b7280">Vehicle: ' + esc(s.vehicle_info) + '</span>' : '') +
        '</div>' +
        (s.fulfilment !== 'pickup'
          ? '<div class="box"><div class="lbl">Ship to</div>' + posShipToBlock(s) + '</div>'
          : '<div class="box"><div class="lbl">Collection</div>Counter pickup<br/><span style="color:#6b7280">' + esc(shop.address) + '</span></div>') +
        '<div class="box" style="text-align:right">' +
          '<div class="lbl">' + (d.is_quote ? 'Quote no.' : 'Invoice no.') + '</div><b style="font-size:14px">' + esc(s.invoice_number || s.receipt_number || '—') + '</b>' +
          (d.is_quote ? '' : '<div class="lbl" style="margin-top:6px">Receipt</div>' + esc(s.receipt_number || '')) +
          '<div class="lbl" style="margin-top:6px">Date</div>' + posWhen(s.created_at) +
          (s.po_number ? '<div class="lbl" style="margin-top:6px">Your PO</div>' + esc(s.po_number) : '') +
          (d.is_quote && s.valid_until ? '<div class="lbl" style="margin-top:6px">Valid until</div><b>' + esc(s.valid_until) + '</b>' : '') +
          (!d.is_quote && s.due_date ? '<div class="lbl" style="margin-top:6px">Payment due</div><b>' + esc(s.due_date) + '</b>' : '') +
        '</div>' +
      '</div>' +
      '<div style="margin-bottom:10px">' + paidStamp +
        (s.sales_rep_name ? '<span style="margin-left:14px;font-size:10.5px;color:#6b7280">Served by <b style="color:#111">' + esc(s.sales_rep_name) + '</b></span>' : '') +
        (s.cashier_user_name ? '<span style="margin-left:10px;font-size:10.5px;color:#6b7280">· Rung by ' + esc(s.cashier_user_name) + '</span>' : '') +
      '</div>' +
      '<table><thead><tr><th class="c" style="width:44px">Qty</th><th>Part / description</th>' +
        '<th class="r" style="width:80px">Unit</th><th class="r" style="width:74px">Disc.</th><th class="r" style="width:88px">Amount</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>' +
      '<div class="tot">' +
        '<div><span>Subtotal</span><span>' + posCents(s.subtotal_cents) + '</span></div>' +
        (ticketDisc > 0 ? '<div style="color:#b91c1c"><span>Ticket discount</span><span>−' + posCents(ticketDisc) + '</span></div>' : '') +
        (s.loyalty_discount_cents > 0 ? '<div style="color:#b45309"><span>Loyalty (' + s.loyalty_points_redeemed + ' pts)</span><span>−' + posCents(s.loyalty_discount_cents) + '</span></div>' : '') +
        (s.ship_fee_cents > 0 ? '<div><span>' + esc(s.ship_method || 'Shipping') + '</span><span>' + posCents(s.ship_fee_cents) + '</span></div>' : '') +
        '<div style="color:#6b7280"><span>' + (s.tax_exempt ? esc(d.tax_label || 'GCT') + ' (exempt)' : esc(d.tax_label || 'GCT (15%)')) + '</span><span>' + posCents(s.tax_cents) + '</span></div>' +
        '<div class="grand"><span>TOTAL</span><span>' + posCents(s.total_cents) + '</span></div>' +
        (d.payments || []).map(function(p){
          return '<div style="font-size:10.5px;color:#6b7280"><span>' + esc(posMethodLabel(p.method)) + (p.reference ? ' · ' + esc(p.reference) : '') + '</span><span>' + posCents(p.amount_cents) + '</span></div>';
        }).join('') +
        (s.balance_due_cents > 0
          ? '<div style="color:#b91c1c;font-weight:800;border-top:1px dashed #d1d5db;margin-top:5px;padding-top:5px"><span>BALANCE DUE</span><span>' + posCents(s.balance_due_cents) + '</span></div>'
          : '') +
      '</div>' +
      (s.notes ? '<div style="margin-top:16px;font-size:10.5px"><b>Notes:</b> ' + esc(s.notes) + '</div>' : '') +
      '<div class="foot">' +
        (d.is_quote
          ? 'This is a quotation, not a tax invoice. Prices hold until ' + esc(s.valid_until || 'the date above') +
            ' and are subject to stock being available at the time of order.'
          : (s.balance_due_cents > 0 ? '<b>Payment due ' + esc(s.due_date || 'on receipt') + '.</b> ' : '') +
            esc(shop.invoice_notice || ('Goods remain the property of ' + shop.name + ' until paid in full. Returns accepted within 14 days with this invoice, in original condition. Electrical parts are non-returnable.'))

// =============================================================================
//  A small modal used by the POS panels. Kept local so it doesn't depend on the
//  tender modal's markup, which only exists while the POS panel is open.
// =============================================================================
function posModal(title, html, width){
  posCloseModal();
  var wrap = document.createElement('div');
  wrap.id = 'mhPosModal';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(11,27,43,.6);display:flex;align-items:center;justify-content:center;z-index:9500;padding:20px';
  wrap.innerHTML = '<div style="background:var(--card);border-radius:12px;max-width:' + (width || 620) + 'px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
        '<h3 style="margin:0;color:var(--heading);font-size:17px">' + title + '</h3>' +
        '<button type="button" id="mhPosClose" style="background:none;border:0;font-size:24px;cursor:pointer;line-height:1;color:var(--muted)">&times;</button>' +
      '</div>' + html +
    '</div>';
  document.body.appendChild(wrap);
  wrap.addEventListener('click', function(e){ if (e.target === wrap) posCloseModal(); });
  document.getElementById('mhPosClose').addEventListener('click', posCloseModal);
}
function posCloseModal(){
  var prev = document.getElementById('mhPosModal');
  if (prev) prev.remove();
}
// Kept for the older call sites that used this name.
function alertPanel(title, html){ posModal(title, html); }

// Open/close a cash-drawer shift right from the POS terminal, without
// leaving for the Cash Report tab. Same endpoints and math Cash Report's
// own "open/close till" already uses (opening_float, closing_amount vs.
// expected_cash = opening_float + cash sales since opened_at, variance) --
// one shift per register regardless of which screen opened or closed it.
async function posShiftModal(session, after){
  var mechs = [];
  try { mechs = (await api('/api/admin/mechanics?active=true')).mechanics || []; } catch (_) {}
  var mechOptions = '<option value="">— (not tracked)</option>' +
    mechs.map(function(m){ return '<option value="' + m.id + '">' + esc(m.name) + '</option>'; }).join('');

  if (session) {
    posModal('🗄 Close shift',
      '<div style="font-size:13px;margin-bottom:12px">' +
        '<b>Session #' + session.id + '</b> open since ' + fmtDate(session.opened_at) +
        (session.opener_name ? ' by <b>' + esc(session.opener_name) + '</b>' : '') +

      460
    );
    document.getElementById('psOpenBtn').addEventListener('click', async function(){

      var res = document.getElementById('psOpenResult');
      btn.disabled = true;
      try {
        await api('/api/admin/cash-drawer/open', { method: 'POST', body: {
          opening_float: Number(document.getElementById('psFloat').value || 0),

}

// =============================================================================
//  POS SALES — the day's tickets: reprint any document, take a payment against
//  a charge sale, process a return, or void. This is where a counter spends its
//  time after the sale, and none of it was reachable before.
// =============================================================================
// NOTE (2026-08-18 audit fix): this tab used to call a GET /api/admin/pos/summary
// endpoint that never existed, and read fields (payment_status, balance_due_cents,
// fulfilment, invoice_number, sales_rep_name, *_cents amounts) that don't exist
// anywhere in the real pos_sales schema -- the tab 404'd on every open. Rewritten
// to use only the real GET /api/admin/pos/sales(+/:id) + POST .../void endpoints,
// with a summary computed client-side from the sales already fetched.
async function renderPOSSales(panel){
  var today = new Date().toISOString().slice(0, 10);
  var from = POS_SALES_FROM || today;
  var to = POS_SALES_TO || today;

  panel.innerHTML =
    '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:11px 14px;background:var(--card-soft);border-bottom:1px solid var(--line)">' +
      '<label class="lbl" style="margin:0">From</label><input type="date" id="psFrom" value="' + from + '" class="fld" style="width:150px"/>' +
      '<label class="lbl" style="margin:0">To</label><input type="date" id="psTo" value="' + to + '" class="fld" style="width:150px"/>' +
      '<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)"><input type="checkbox" id="psVoided"/> Show voided</label>' +
      '<button class="btn" id="psGo">Apply</button>' +
    '</div>' +
    '<div id="psSummary" style="padding:11px 14px;border-bottom:1px solid var(--line)"></div>' +
    '<div id="psList" style="padding:0"><div class="empty">Loading…</div></div>';

  async function load(){
    POS_SALES_FROM = document.getElementById('psFrom').value;
    POS_SALES_TO = document.getElementById('psTo').value;
    var qs = 'from=' + POS_SALES_FROM + '&to=' + POS_SALES_TO;
    if (document.getElementById('psVoided').checked) qs += '&include_voided=1';

    var list = document.getElementById('psList');
    list.innerHTML = '<div class="empty">Loading…</div>';
    var r;
    try {
      r = await api('/api/admin/pos/sales?' + qs);
    } catch (e) {
      list.innerHTML = '<div class="empty">Could not load sales: ' + esc(e.message) + '</div>';
      return;
    }

    var live = r.sales.filter(function(s){ return !s.voided; });
    var total = live.reduce(function(n, s){ return n + Number(s.total_usd || 0); }, 0);
    var byMethod = {};
    live.forEach(function(s){ var m = s.payment_method || 'other'; byMethod[m] = (byMethod[m] || 0) + Number(s.total_usd || 0); });
    document.getElementById('psSummary').innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        tile('sales', live.length) + tile('taken', fmtMoney(total)) +
      '</div>' +
      (Object.keys(byMethod).length
        ? '<div style="margin-top:8px;font-size:12px;color:var(--muted)">By tender: ' +
            Object.keys(byMethod).map(function(m){ return '<b style="color:var(--ink)">' + esc(posMethodLabel(m)) + '</b> ' + fmtMoney(byMethod[m]); }).join(' · ') +
          '</div>'
        : '');

    if (!r.sales.length) {
      list.innerHTML = '<div class="empty">No sales in that range.</div>';
      return;
    }
    list.innerHTML = '<table><thead><tr>' +
      '<th>Receipt</th><th>When</th><th>Customer</th><th>Cashier</th><th>Total</th><th>Method</th><th>Status</th><th></th>' +
      '</tr></thead><tbody>' +
      r.sales.map(function(s){
        return '<tr' + (s.voided ? ' style="opacity:.55"' : '') + '>' +
          '<td><b>' + esc(s.receipt_number || '') + '</b></td>' +
          '<td>' + fmtDate(s.created_at) + '</td>' +
          '<td>' + esc(s.customer_name || 'Walk-in') +
            (s.customer_phone ? '<br/><small><a href="tel:' + esc(s.customer_phone) + '">' + esc(s.customer_phone) + '</a></small>' : '') + '</td>' +
          '<td><small>' + esc(s.cashier_name || '—') + '</small></td>' +
          '<td><b>' + fmtMoney(s.total_usd) + '</b></td>' +
          '<td><small>' + esc(posMethodLabel(s.payment_method)) + '</small></td>' +
          '<td>' + (s.voided ? badge('voided', 'bad') : badge('paid', 'ok')) + '</td>' +
          '<td class="actions"><button class="btn" data-sale="' + s.id + '">Open</button></td>' +
        '</tr>';
      }).join('') + '</tbody></table>';

    list.querySelectorAll('[data-sale]').forEach(function(b){
      b.addEventListener('click', function(){ posSaleDetail(b.getAttribute('data-sale'), load); });
    });
  }

  document.getElementById('psGo').addEventListener('click', load);
  document.getElementById('psVoided').addEventListener('change', load);
  await load();
}
var POS_SALES_FROM = null, POS_SALES_TO = null;

// Adapts a real pos_sales row (dollars, no fulfilment/invoice/balance-due
// tracking -- that's Phase 3, not built) into the {sale,items,payments,shop}
// shape the counter-document renderers below (posDocReceipt/Invoice/PickSlip/
// Gift) already expect (cents, optional fulfilment/ship_* fields). This keeps
// that well-built print/barcode machinery working against real data instead
// of rewriting six document templates. fulfilment is always 'pickup' since
// POS sales here don't track delivery/shipping, which also means
// posPrintDoc's existing pickup guard correctly disables Packing/Label.
function posSaleToDocData(d, shop){
  var s = d.sale;
  var mappedSale = Object.assign({}, s, {
    subtotal_cents: Math.round(Number(s.subtotal_usd || 0) * 100),
    discount_cents: Math.round(Number(s.discount_usd || 0) * 100),
    loyalty_discount_cents: Math.round(Number(s.loyalty_discount_usd || 0) * 100),
    tax_cents: Math.round(Number(s.tax_usd || 0) * 100),
    total_cents: Math.round(Number(s.total_usd || 0) * 100),
    change_due_cents: Math.round(Number(s.change_due || 0) * 100),
    balance_due_cents: 0,
    ship_fee_cents: 0,
    fulfilment: 'pickup',
    sales_rep_name: null,
    cashier_user_name: s.cashier_name || null,
    invoice_number: null,
  });
  var mappedItems = d.items.map(function(it){
    return Object.assign({}, it, {
      unit_price_cents: Math.round(Number(it.unit_price_usd || 0) * 100),
      total_cents: Math.round(Number(it.total_usd || 0) * 100),
      discount_cents: 0,
    });
  });
  var mappedPayments = (d.payments || []).map(function(p){
    return Object.assign({}, p, {
      amount_cents: Math.round(Number(p.amount_usd || 0) * 100),
      amount_tendered_cents: p.amount_tendered != null ? Math.round(Number(p.amount_tendered) * 100) : null,
    });
  });
  return { sale: mappedSale, items: mappedItems, payments: mappedPayments, shop: shop };
}
// Adapts a saved quote (pos_quotes row) into the same {sale,items,payments,
// shop} shape posSaleToDocData produces for a real sale, so a quote can
// print through the exact same posDocReceipt/posDocInvoice instead of a
// third copy of each template. is_quote:true is what those two branch on
// to show "QUOTATION" framing (stamp, footer, valid-until) instead of
// payment/void framing -- a quote has never taken money, so payments is
// always [].
function posQuoteToDocData(q, shop){
  var items = [];
  try { items = JSON.parse(q.items_json || '[]') || []; } catch (_) {}
  var mappedSale = {
    receipt_number: q.quote_number, invoice_number: null,
    customer_name: q.customer_name, customer_phone: q.customer_phone, customer_email: q.customer_email,
    vehicle_info: q.vehicle_info, sales_rep_name: q.sales_rep_name || null, cashier_user_name: null,
    created_at: q.created_at, valid_until: q.valid_until,
    subtotal_cents: Math.round(Number(q.subtotal_usd || 0) * 100),
    discount_cents: Math.round(Number(q.discount_usd || 0) * 100),
    loyalty_discount_cents: 0,
    tax_cents: Math.round(Number(q.tax_usd || 0) * 100),
    total_cents: Math.round(Number(q.total_usd || 0) * 100),
    change_due_cents: 0, balance_due_cents: 0, ship_fee_cents: 0,
    fulfilment: 'pickup', voided: false, tax_exempt: false, notes: q.notes,
  };
  var mappedItems = items.map(function(it){
    var cents = Number(it.unit_price_cents) || 0, qty = it.qty || 1;
    return {
      description: it.description || it.product_img || '', product_img: it.product_img || null,
      sku: it.sku || null, qty: qty, unit_price_cents: cents, discount_cents: 0,
      total_cents: it.total_cents != null ? it.total_cents : cents * qty,
    };
  });
  return { sale: mappedSale, items: mappedItems, payments: [], shop: shop, is_quote: true };
}
// Hardcoded fallback values only -- overwritten in place (Object.assign, not
// reassigned) as soon as GET /api/admin/settings resolves, so anything that
// already grabbed a reference to POS_SHOP still sees the update. Used to be
// the one true copy of company info; now it's populated FROM the same
// shop_settings row every server-side print endpoint reads (see
// getShopSettings()/shopSettingsToShop() in server.js) so the two can't
// drift the way the four independent hardcoded copies used to.
var POS_SHOP = { name: 'Meltha Honda Sales & Servs Ltd', address: '127 Hagley Park Road, Kingston 11', country: 'Jamaica', phone: '(876) 758-8503',
  email: null, website: null, logo_url: null, print_logo: true, default_print_template: 'receipt',
  invoice_notice: null, receipt_notice: null, statement_notice: null };
function loadShopSettingsIntoPosShop(){

      name: s.company_name, address: s.address, country: s.country, phone: s.phone,

}

// ---- NOTE (2026-08-18, "do all improvements" pass) -------------------------
// posSettleModal (partial-payment/balance-due settlement) was removed in an
// earlier pass because POST .../payment doesn't exist anywhere in server.js
// -- still true, still not built (POS sales here are always paid in full at
// the register; "balance due" would need a whole invoice-terms model this
// build doesn't have). posReturnModal, which used to be removed alongside it
// for the same reason, is now real: POST /api/admin/pos/sales/:id/return
// exists (itemized per-line refund with prorated discount/tax, restock,
// optional store-credit gift card, proportional loyalty rollback) -- see
// ADMIN-POS-AUDIT.md.
// =============================================================================
//  POS RETURNS -- pick lines + quantities off a prior sale and refund them.
// =============================================================================
function posReturnModal(d, after){
  var s = d.sale;
  var returnable = d.items.filter(function(it){ return (it.qty - (it.returned_qty || 0)) > 0; });

  posModal('Return items — ' + esc(s.receipt_number || ''),
    '<table style="width:100%;font-size:12.5px"><thead><tr>' +
      '<th align="left">Part</th><th>Sold</th><th>Returned</th><th>Return qty</th><th align="right">Unit</th>' +
    '</tr></thead><tbody>' +
      returnable.map(function(it){
        var remaining = it.qty - (it.returned_qty || 0);
        return '<tr><td>' + esc(it.description) + '</td>' +
          '<td style="text-align:center">' + it.qty + '</td>' +
          '<td style="text-align:center">' + (it.returned_qty || 0) + '</td>' +
          '<td style="text-align:center"><input type="number" min="0" max="' + remaining + '" value="0" class="fld-mini" data-retqty="' + it.id + '" style="width:56px"/></td>' +
          '<td style="text-align:right">' + fmtMoney(it.unit_price_usd) + '</td>' +
        '</tr>';
      }).join('') +
    '</tbody></table>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">' +
      '<div><label class="lbl">Refund method</label><select id="rtMethod" class="fld">' +
        '<option value="cash">Cash</option><option value="card">Card</option><option value="cheque">Cheque</option>' +
        '<option value="bank">Bank transfer</option><option value="store_credit">Store credit (issues a gift card)</option>' +
      '</select></div>' +
      '<div><label class="lbl">Reason</label><input id="rtReason" class="fld" placeholder="e.g. wrong part, defective"/></div>' +
      '<div style="grid-column:1/-1"><label class="lbl">Notes</label><input id="rtNotes" class="fld"/></div>' +
    '</div>' +
    '<div id="rtEstimate" style="margin-top:10px;font-size:12.5px;color:var(--muted)"></div>' +
    '<div id="rtMsg" style="display:none;margin-top:10px;padding:9px 12px;border-radius:6px;font-size:12.5px"></div>' +
    '<div style="display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">' +
      '<button type="button" class="btn ok" id="rtGo">Process return</button>' +
    '</div>',
    640
  );

  function estimate(){
    var subtotal = Number(s.subtotal_usd) || 0;
    var proportion0 = 0, refundSubtotal = 0;
    document.querySelectorAll('#mhPosModal [data-retqty]').forEach(function(inp){
      var qty = parseInt(inp.value, 10) || 0;
      if (qty <= 0) return;
      var it = returnable.find(function(x){ return String(x.id) === inp.getAttribute('data-retqty'); });
      if (!it) return;
      var perUnit = Number(it.unit_price_usd) + (Number(it.core_charge_usd || 0) + Number(it.env_fee_usd || 0)) / it.qty;
      refundSubtotal += perUnit * qty;
    });
    proportion0 = subtotal > 0 ? Math.min(1, refundSubtotal / subtotal) : 0;
    var refundTotal = refundSubtotal - (Number(s.discount_usd) * proportion0) + (Number(s.tax_usd) * proportion0);
    document.getElementById('rtEstimate').textContent = refundSubtotal > 0
      ? 'Estimated refund: ' + fmtMoney(refundTotal) + ' (server computes the final figure)'
      : 'Enter a quantity above to estimate the refund.';
  }
  document.querySelectorAll('#mhPosModal [data-retqty]').forEach(function(inp){ inp.addEventListener('input', estimate); });

  document.getElementById('rtGo').addEventListener('click', async function(){
    var items = [];
    document.querySelectorAll('#mhPosModal [data-retqty]').forEach(function(inp){
      var qty = parseInt(inp.value, 10) || 0;
      if (qty > 0) items.push({ sale_item_id: parseInt(inp.getAttribute('data-retqty'), 10), qty: qty });
    });
    var msg = document.getElementById('rtMsg');
    if (!items.length) { msg.style.display = 'block'; msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = 'Enter a return quantity for at least one item.'; return; }
    msg.style.display = 'block'; msg.style.background = '#dbeafe'; msg.style.color = '#1e40af'; msg.textContent = 'Processing…';
    try {
      var r = await api('/api/admin/pos/sales/' + s.id + '/return', { method: 'POST', body: {
        items: items,
        refund_method: document.getElementById('rtMethod').value,
        reason: document.getElementById('rtReason').value.trim() || null,
        notes: document.getElementById('rtNotes').value.trim() || null,
      }});
      msg.style.background = '#dcfce7'; msg.style.color = '#166534';
      msg.textContent = '✓ ' + r.return_number + ' processed — refund ' + fmtMoney(r.refund_total_usd) +
        (r.store_credit_code ? ' as store credit ' + r.store_credit_code : '') +
        (r.loyalty_points_clawed_back || r.loyalty_points_recredited
          ? ' (loyalty: −' + r.loyalty_points_clawed_back + ' earned, +' + r.loyalty_points_recredited + ' recredited)' : '');
      setTimeout(function(){ posCloseModal(); posSaleDetail(s.id, after); if (after) after(); }, 1600);
    } catch (e) {
      msg.style.background = '#fee2e2'; msg.style.color = '#b91c1c'; msg.textContent = 'Failed: ' + e.message;
    }
  });
}

async function submitCampaign(){

// ============= DASHBOARD =============
// Wires the existing GET /api/admin/dashboard (service-center KPIs: revenue,
// open work orders, mechanic utilization, 14-day sparkline) plus a same-day
// POS sales total pulled from the existing GET /api/admin/pos/sales, since
// /api/admin/dashboard's revenue figures are work-order (service) payments
// only and don't include parts-counter POS sales — shown as a separate,
// clearly-labeled tile rather than mixed into the same numbers.
function sparkBars(days){
  var max = Math.max.apply(null, days.map(function(d){ return d.total; }).concat([1]));
  return '<div style="display:flex;align-items:flex-end;gap:4px;height:70px;padding:4px 2px">' +
    days.map(function(d){
      var h = Math.max(2, Math.round((d.total / max) * 62));
      var lbl = new Date(d.day + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
      return '<div title="' + lbl + ': ' + fmtMoney(d.total) + '" style="flex:1;background:var(--sky);border-radius:3px 3px 0 0;height:' + h + 'px;min-width:6px"></div>';
    }).join('') +
  '</div>';
}

// Wires the existing cash-drawer session endpoints (open/close a till with a
// cash count + variance) and the existing cash-report endpoint (work-order
// payments grouped by method/mechanic/day). Also pulls the same-day-range POS
// sales total from the existing pos/sales endpoint for a fuller picture, since
// the register's actual cash count needs to reconcile against BOTH streams
// (service payments AND parts-counter cash sales), not just one.
var CR_METHOD_LABEL = { cash:'Cash', card:'Card', bank_transfer:'Bank Transfer', cheque:'Cheque', mobile:'Mobile' };
async function renderCashReport(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var today = new Date().toISOString().slice(0, 10);
  var session, mechs;
  try {
    session = (await api('/api/admin/cash-drawer/open')).session;
  } catch (e) {
    panel.innerHTML = '<div class="empty">Could not load cash drawer: ' + esc(e.message) + '</div>';
    return;
  }
  try { mechs = (await api('/api/admin/mechanics?active=true')).mechanics || []; }
  catch (e) { mechs = []; }

  var mechOptions = '<option value="">— (not tracked)</option>' +
    mechs.map(function(m){ return '<option value="' + m.id + '">' + esc(m.name) + '</option>'; }).join('');

  var drawerHtml = session
    ? '<div style="padding:14px 16px">' +
        '<div style="margin-bottom:10px;font-size:13px">' +
          '<b>Session #' + session.id + '</b> open since ' + fmtDate(session.opened_at) +
          (session.opener_name ? ' by <b>' + esc(session.opener_name) + '</b>' : '') +
          '<br/>Opening float: <b>' + fmtMoney(session.opening_float) + '</b>' +
          (session.notes ? '<br/><small style="color:var(--muted)">' + esc(session.notes) + '</small>' : '') +
        '</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;align-items:end">' +
          '<div><label class="lbl">Closing cash count *</label><input id="crClosing" type="number" step="0.01" min="0" class="fld" placeholder="0.00"/></div>' +
          '<div><label class="lbl">Closed by</label><select id="crClosedBy" class="fld">' + mechOptions + '</select></div>' +
          '<div><label class="lbl">Notes</label><input id="crCloseNotes" class="fld" placeholder="optional"/></div>' +
        '</div>' +
        '<button class="btn" id="crCloseBtn" style="margin-top:10px;background:var(--red)">Close till</button>' +
        '<div id="crCloseResult" style="margin-top:10px"></div>' +
      '</div>'
    : '<div style="padding:14px 16px">' +
        '<div style="margin-bottom:8px;font-size:13px;color:var(--muted)">No cash drawer session is currently open.</div>' +
        '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;align-items:end">' +
          '<div><label class="lbl">Opening float *</label><input id="crFloat" type="number" step="0.01" min="0" class="fld" value="0.00"/></div>' +
          '<div><label class="lbl">Opened by</label><select id="crOpenedBy" class="fld">' + mechOptions + '</select></div>' +
          '<div><label class="lbl">Notes</label><input id="crOpenNotes" class="fld" placeholder="optional"/></div>' +
        '</div>' +
        '<button class="btn ok" id="crOpenBtn" style="margin-top:10px">Open till</button>' +
        '<div id="crOpenResult" style="margin-top:10px"></div>' +
      '</div>';

  panel.innerHTML =
    '<div class="panel" style="margin:16px 18px 0">' +
      '<div style="padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px">🗄 Cash Drawer</div>' +
      drawerHtml +
    '</div>' +
    '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:16px 18px 0">' +
      '<label class="lbl" style="margin:0">From</label><input type="date" id="crFrom" value="' + today + '" class="fld" style="width:150px"/>' +
      '<label class="lbl" style="margin:0">To</label><input type="date" id="crTo" value="' + today + '" class="fld" style="width:150px"/>' +
      '<button class="btn" id="crGo">Run report</button>' +
    '</div>' +
    '<div id="crReport"><div class="empty">Loading report…</div></div>';

  async function loadReport(){
    var from = document.getElementById('crFrom').value;
    var to = document.getElementById('crTo').value;
    var box = document.getElementById('crReport');
    box.innerHTML = '<div class="empty">Loading…</div>';
    var rep, pos;
    try {
      rep = await api('/api/admin/cash-report?from=' + from + '&to=' + to);
    } catch (e) {
      box.innerHTML = '<div class="empty">Could not load report: ' + esc(e.message) + '</div>';
      return;
    }
    try { pos = await api('/api/admin/pos/sales?from=' + from + '&to=' + to); }
    catch (e) { pos = { sales: [] }; }
    var posTotal = (pos.sales || []).reduce(function(s, row){ return s + Number(row.total_usd || 0); }, 0);

    box.innerHTML =
      '<div style="padding:16px 18px">' +
        '<div class="tiles" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">' +
          tile('service payments — ' + from + (to !== from ? ' to ' + to : ''), fmtMoney(rep.totals.s)) +
          tile('# payments', rep.totals.n) +
          tile('POS sales (same range)', fmtMoney(posTotal) + ' (' + (pos.sales || []).length + ')') +
          tile('combined', fmtMoney(Number(rep.totals.s) + posTotal)) +
        '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">' +
          '<div class="panel">' +
            '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">By payment method (service)</div>' +
            (rep.by_method.length
              ? '<table><thead><tr><th>Method</th><th>Count</th><th>Total</th></tr></thead><tbody>' +
                  rep.by_method.map(function(m){ return '<tr><td>' + esc(CR_METHOD_LABEL[m.method] || m.method) + '</td><td>' + m.n + '</td><td>' + fmtMoney(m.s) + '</td></tr>'; }).join('') +
                '</tbody></table>'
              : '<div class="empty">No payments in range.</div>') +
          '</div>' +
          '<div class="panel">' +
            '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">By mechanic (service)</div>' +
            (rep.by_mechanic.length
              ? '<table><thead><tr><th>Mechanic</th><th>Count</th><th>Total</th></tr></thead><tbody>' +
                  rep.by_mechanic.map(function(m){ return '<tr><td>' + esc(m.mechanic_name || '—') + '</td><td>' + m.n + '</td><td>' + fmtMoney(m.s) + '</td></tr>'; }).join('') +
                '</tbody></table>'
              : '<div class="empty">No payments in range.</div>') +
          '</div>' +
        '</div>' +
        '<div class="panel" style="margin-top:16px">' +
          '<div style="padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px">Recent service payments</div>' +
          (rep.recent.length
            ? '<table><thead><tr><th>When</th><th>WO #</th><th>Customer</th><th>Method</th><th>Received by</th><th>Amount</th></tr></thead><tbody>' +
                rep.recent.map(function(p){
                  return '<tr><td>' + fmtDate(p.received_at) + '</td><td>' + esc(p.wo_number || '') + '</td><td>' + esc(p.customer_name || '') + '</td>' +
                    '<td>' + esc(CR_METHOD_LABEL[p.method] || p.method) + '</td><td>' + esc(p.receiver_name || '—') + '</td><td>' + fmtMoney(p.amount_usd) + '</td></tr>';
                }).join('') + '</tbody></table>'
            : '<div class="empty">No payments in range.</div>') +
        '</div>' +
      '</div>';
  }

  document.getElementById('crGo').addEventListener('click', loadReport);

  var openBtn = document.getElementById('crOpenBtn');
  if (openBtn) openBtn.addEventListener('click', async function(){
    var res = document.getElementById('crOpenResult');
    openBtn.disabled = true;
    try {
      await api('/api/admin/cash-drawer/open', { method:'POST', body: {
        opening_float: Number(document.getElementById('crFloat').value || 0),
        opened_by: document.getElementById('crOpenedBy').value || null,
        notes: document.getElementById('crOpenNotes').value || null
      }});
      show('cashreport');
    } catch (e) {
      res.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">' + esc(e.message) + '</div>';
      openBtn.disabled = false;
    }
  });

  var closeBtn = document.getElementById('crCloseBtn');
  if (closeBtn) closeBtn.addEventListener('click', async function(){
    var res = document.getElementById('crCloseResult');
    var closing = document.getElementById('crClosing').value;
    if (closing === '') { res.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">Enter a closing cash count.</div>'; return; }
    closeBtn.disabled = true;
    try {
      var r = await api('/api/admin/cash-drawer/' + session.id + '/close', { method:'POST', body: {
        closing_amount: Number(closing),
        closed_by: document.getElementById('crClosedBy').value || null,
        notes: document.getElementById('crCloseNotes').value || null
      }});
      var v = r.variance;
      var vColor = v === 0 ? 'var(--ok)' : (v < 0 ? '#b91c1c' : '#92400e');
      res.innerHTML = '<div style="padding:10px 12px;background:var(--card-soft);border:1px solid var(--line);border-radius:8px;font-size:13px">' +
        'Expected: <b>' + fmtMoney(r.expected_cash) + '</b> · Counted: <b>' + fmtMoney(r.closing_amount) + '</b> · ' +
        'Variance: <b style="color:' + vColor + '">' + (v > 0 ? '+' : '') + fmtMoney(v) + '</b>' +
      '</div>';
      setTimeout(function(){ show('cashreport'); }, 1800);
    } catch (e) {
      res.innerHTML = '<div style="color:#b91c1c;font-size:12.5px">' + esc(e.message) + '</div>';

    }
  });

async function renderLowStock(panel){
  panel.innerHTML = '<div class="empty">Loading…</div>';
  var r;
  try { r = await api('/api/admin/low-stock'); }
  catch (e) { panel.innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; return; }
  if (!r.products.length) { panel.innerHTML = '<div class="empty">Nothing low on stock right now. 🎉</div>'; return; }
  panel.innerHTML =
    '<div style="padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)">' + r.count + ' product' + (r.count===1?'':'s') + ' at or below its reorder threshold.</div>' +
    '<table><thead><tr><th>Product</th><th>Vehicle</th><th>Category</th><th>On hand</th><th>Threshold</th><th>Restock to</th></tr></thead><tbody>' +
    r.products.map(function(p){
      return '<tr>' +
        '<td><b>' + esc(p.name) + '</b><br/><small style="color:var(--muted)">' + esc(p.img) + '</small></td>' +
        '<td>' + esc(p.make_model || '') + '</td>' +
        '<td>' + esc(p.category || '') + '</td>' +
        '<td>' + badge(p.stock_count, p.stock_count <= 0 ? 'bad' : 'pending') + '</td>' +
        '<td>' + p.low_threshold + '</td>' +
        '<td class="actions">' +
          '<input type="number" min="0" class="fld-mini" data-restock="' + esc(p.img) + '" placeholder="qty"/> ' +
          '<button class="btn ok" data-go="' + esc(p.img) + '">Set</button>' +
        '</td>' +
      '</tr>';
    }).join('') + '</tbody></table>';

  panel.querySelectorAll('[data-go]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      var img = btn.getAttribute('data-go');
      var input = panel.querySelector('[data-restock="' + CSS.escape(img) + '"]');
      var qty = parseInt(input.value, 10);
      if (!(qty >= 0)) { alert('Enter a quantity ≥ 0'); return; }
      btn.disabled = true;
      try {
        await api('/api/admin/stock-adjust', { method:'POST', body: { product_img: img, new_qty: qty, reason: 'Restock from Low Stock tab' } });
        show('lowstock');
      } catch (e) { alert('Failed: ' + e.message); btn.disabled = false; }
    });
  });
}

          '</tr>';
        }).join('') +

    '</div>' +

// ============= WAREHOUSE (activity log / stock counts / bin check) =============
var WH_VIEW = 'activity';
var WH_COUNT_ID = null;
async function renderWarehouse(panel){
  var toolbar =
    '<div style="padding:12px 16px;background:var(--card-soft);border-bottom:1px solid var(--line);display:flex;gap:6px">' +
      ['activity','counts','bin'].map(function(v){
        var lbl = { activity:'📜 Activity', counts:'🔢 Stock Counts', bin:'📦 Bin Check' }[v];
        return '<button class="whTab" data-v="' + v + '" style="padding:7px 14px;background:' + (WH_VIEW===v?'var(--navy)':'var(--card)') + ';color:' + (WH_VIEW===v?'#fff':'var(--ink)') + ';border:1px solid var(--line);border-radius:7px;font-weight:700;cursor:pointer;font-size:12.5px">' + lbl + '</button>';
      }).join('') +
    '</div>';
  panel.innerHTML = toolbar + '<div id="whBody"><div class="empty">Loading…</div></div>';
  panel.querySelectorAll('.whTab').forEach(function(b){
    b.addEventListener('click', function(){ WH_VIEW = b.getAttribute('data-v'); WH_COUNT_ID = null; renderWarehouse(panel); });
  });
  var body = document.getElementById('whBody');
  if (WH_VIEW === 'activity') return renderWhActivity(body);
  if (WH_VIEW === 'bin') return renderWhBin(body);
  return WH_COUNT_ID ? renderWhCountDetail(body, WH_COUNT_ID, panel) : renderWhCounts(body, panel);
}

      '<button class="btn" id="whCountBack">‹ All counts</button>' +
      '<div>' + badge(c.status, c.status === 'posted' ? 'ok' : 'pending') + (c.total_variance != null ? ' <small>variance: ' + c.total_variance + '</small>' : '') + '</div>' +
    '</div>' +
    '<table><thead><tr><th>Product</th><th>Bin</th><th>System qty</th><th>Counted</th><th>Variance</th></tr></thead><tbody>' +
      d.items.map(function(it){
        var v = it.counted_qty != null ? it.counted_qty - it.system_qty : null;
        return '<tr><td><b>' + esc(it.product_name || it.product_img || '') + '</b><br/><small style="color:var(--muted)">' + esc(it.sku || '') + '</small></td>' +
          '<td>' + esc(it.bin_location || '—') + '</td>' +
          '<td>' + it.system_qty + '</td>' +
          '<td>' + (open ? '<input type="number" min="0" class="fld-mini" data-item="' + it.id + '" value="' + (it.counted_qty != null ? it.counted_qty : '') + '"/>' : (it.counted_qty != null ? it.counted_qty : '—')) + '</td>' +
          '<td>' + (v != null ? '<span style="color:' + (v<0?'#b91c1c':(v>0?'#15803d':'var(--muted)')) + '">' + (v>0?'+':'') + v + '</span>' : '—') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table>' +
    (open ? '<div style="padding:12px 16px;display:flex;gap:8px"><button class="btn" id="whSaveCounts">Save counted quantities</button><button class="btn ok" id="whPostCount">Post count (apply to stock)</button></div>' : '');

  document.getElementById('whCountBack').addEventListener('click', function(){ WH_COUNT_ID = null; renderWarehouse(panel); });
  var saveBtn = document.getElementById('whSaveCounts');
  if (saveBtn) saveBtn.addEventListener('click', async function(){
    var inputs = box.querySelectorAll('[data-item]');
    saveBtn.disabled = true;
    try {
      for (var i = 0; i < inputs.length; i++) {
        var inp = inputs[i];
        if (inp.value === '') continue;
        await api('/api/admin/stock-count-items/' + inp.getAttribute('data-item'), { method:'PATCH', body: { counted_qty: inp.value } });
      }
      renderWarehouse(panel);
    } catch (e) { alert('Save failed: ' + e.message); saveBtn.disabled = false; }
  });
  var postBtn = document.getElementById('whPostCount');
  if (postBtn) postBtn.addEventListener('click', async function(){
    if (!confirm('Post this count? Product stock levels will be updated to match what was counted. This cannot be undone.')) return;
    postBtn.disabled = true;
    try { await api('/api/admin/stock-counts/' + id + '/post', { method:'POST' }); renderWarehouse(panel); }
    catch (e) { alert('Post failed: ' + e.message); postBtn.disabled = false; }
  });
}

async function renderVehicleHistory(panel){
  panel.innerHTML =
    '<div style="padding:14px 16px;display:flex;gap:8px;align-items:end;flex-wrap:wrap">' +
      '<div><label class="lbl">VIN</label><input id="vhVin" class="fld" style="width:200px;text-transform:uppercase"/></div>' +
