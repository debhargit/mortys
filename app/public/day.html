<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day plan · Morty's Auto Parts</title>
<style>
  :root{ --red:#d62828; --navy:#0b1b2b; --ink:#0f1720; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ok:#16a34a; --warn:#b45309; --chip:#eef2f7; --blue:#2563eb; --gold:#b7791f;
         --shift:#e2e8f0; --act:#bfdbfe; --act-done:#bbf7d0; --act-run:#fde68a; --act-skip:#e5e7eb; --dev:#fde7c2; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; --chip:#1f2b38; --warn:#f59e0b; --blue:#60a5fa; --gold:#f6ad55;
         --shift:#243142; --act:#1e3a5f; --act-done:#14532d; --act-run:#713f12; --act-skip:#2b3644; --dev:#4a3413; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0} header nav{margin-left:auto;display:flex;gap:14px;font-size:13px;flex-wrap:wrap} header a{color:#fff;opacity:.85}
  main{max-width:1350px;margin:0 auto;padding:14px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  input,select,button,textarea{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  textarea{width:100%;min-height:60px}
  button{cursor:pointer;background:var(--card)} button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600} button.sm{padding:3px 9px;font-size:12.5px}
  button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 12px} .tabs button{border-radius:999px;padding:6px 13px;font-size:13px} .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px} .grow{flex:1}
  table{width:100%;border-collapse:collapse} th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .scroll{overflow-x:auto}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
  .pill.ok{background:#16a34a22;color:var(--ok)} .pill.bad{background:#d6282822;color:var(--red)} .pill.warn{background:#f59e0b22;color:var(--warn)} .pill.info{background:#2563eb1f;color:var(--blue)}
  .modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;z-index:40} .modal .card{max-width:560px;width:100%}
  .empty{color:var(--muted);text-align:center;padding:20px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:60;max-width:90vw;white-space:pre-line}
  label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px} .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  @media (max-width:640px){ .row2,.row3{grid-template-columns:1fr} }
  /* devotion banner */
  .dev{background:linear-gradient(135deg,#fff7e6,#fdecc8);border:1px solid #f3d9a4;border-radius:14px;padding:16px 18px;margin-bottom:12px;color:#3b2a0a}
  @media (prefers-color-scheme: dark){ .dev{background:linear-gradient(135deg,#2b2111,#3a2a10);border-color:#5b4320;color:#f6e7c8} }
  .dev h2{margin:0 0 4px;font-size:18px} .dev .when{font-size:12.5px;opacity:.8} .dev blockquote{margin:10px 0;font-size:16px;font-style:italic;line-height:1.5} .dev .ref{font-weight:700;font-style:normal;font-size:13px}
  .dev p{margin:6px 0} .dev .pray{font-weight:600}
  /* timeline */
  .tl{position:relative;min-width:980px}
  .tl .hours{display:grid;margin-left:190px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
  .tl .hours div{border-left:1px solid var(--line);padding:2px 4px}
  .tl .row{display:flex;border-bottom:1px solid var(--line);min-height:60px}
  .tl .who{width:190px;flex:none;padding:6px 8px;font-size:13px;border-right:1px solid var(--line)} .tl .who small{display:block;color:var(--muted);font-size:11.5px}
  .tl .lane{position:relative;flex:1;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/var(--h) - 1px),var(--line) calc(100%/var(--h) - 1px),var(--line) calc(100%/var(--h)))}
  .tl .bar{position:absolute;border-radius:6px;font-size:11.5px;padding:2px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
  .tl .shift{top:4px;bottom:4px;background:var(--shift);cursor:default;color:var(--muted);display:flex;align-items:flex-end;justify-content:flex-end;font-size:10.5px}
  .tl .act{top:17px;height:22px;background:var(--act);border:1px solid #93c5fd;color:var(--ink)} .tl .act.done{background:var(--act-done);border-color:#86efac} .tl .act.in_progress{background:var(--act-run);border-color:#fcd34d} .tl .act.skipped{background:var(--act-skip);text-decoration:line-through;color:var(--muted)}
  .tl .devb{top:17px;height:22px;background:var(--dev);border:1px solid #f3c27a;color:#7a4b00}
  .tl .mark{position:absolute;top:0;bottom:0;width:2px} .tl .mark.in{background:var(--ok)} .tl .mark.out{background:var(--muted)} .tl .mark span{position:absolute;top:1px;left:3px;font-size:10px;white-space:nowrap}
  .tl .brk{position:absolute;bottom:1px;height:5px;background:repeating-linear-gradient(45deg,var(--warn) 0 3px,transparent 3px 6px);border-radius:3px}
  .tl .now{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3}
  .tl .sale{position:absolute;bottom:2px;font-size:10px;color:var(--ok)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px} .legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  /* my day */
  .act-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)} .act-row .t{min-width:96px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .act-row .main{flex:1} .act-row .main b{display:block} .act-row .main small{color:var(--muted)}
  .act-row.done .main b{text-decoration:line-through;opacity:.7}
  .mic{border-radius:999px;padding:8px 14px;font-weight:600} .mic.on{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px #d6282833}}
  .score{display:inline-block;min-width:44px;text-align:center;font-weight:700;border-radius:8px;padding:2px 6px}
  .s-hi{background:#16a34a22;color:var(--ok)} .s-mid{background:#f59e0b22;color:var(--warn)} .s-lo{background:#d6282822;color:var(--red)}
  .tl .wk{position:absolute;top:42px;height:9px;border-radius:2px;opacity:.9;cursor:help}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px} @media (max-width:760px){ .kpis{grid-template-columns:1fr 1fr} }
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px} .kpi b{display:block;font-size:22px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .kpi span{color:var(--muted);font-size:12.5px} .kpi small{display:block;color:var(--muted);font-size:11.5px}
  .controls button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .btnlink{display:inline-block;padding:3px 9px;font-size:12.5px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);text-decoration:none}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .duty-row{display:flex;gap:6px;margin:5px 0;flex-wrap:wrap} .duty-row .grow{min-width:160px}
  svg text{font-family:inherit}
  .cmt{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--bg)} .cmt-prayer{border-left-color:#b7791f} .cmt-praise{border-left-color:var(--ok)}
  .cmt-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .cmt-h small{color:var(--muted)} .cmt-x{margin-left:auto} .cmt-b{margin-top:4px;white-space:pre-wrap}
  .cmt-new{margin-top:10px} .cmt-new select{margin-bottom:6px}
  .tl .closed{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px);opacity:.7;pointer-events:none}
  .tl .act.fill{background:transparent;border-style:dashed;color:var(--muted)} .tl .act.fill.in_progress,.tl .act.fill.done{color:var(--ink)} .tl .act.lunch{background:var(--chip);border-color:var(--line);color:var(--muted)}
  .hours-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 14px;margin-bottom:8px} .hrow{display:flex;gap:6px;align-items:center} .hrow label{min-width:62px}
  .cov{background:#f59e0b1f;color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;margin:0 0 10px}
  .meter{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;min-width:80px} .meter i{display:block;height:100%;background:var(--ok)}
</style>

<link rel="icon" href="/favicon-32.png?v=vision2" sizes="32x32" type="image/png">

</head>
<body>
<header><h1>🗓 Day plan</h1><nav><a href="/team.html#calendar">Calendar</a><a href="/roster.html">Roster</a><a href="/my-time.html">My time</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="out"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var all = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var tm = function (t) { return t ? new Date(t).toLocaleTimeString('en-JM', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Jamaica' }) : ''; };
  var hm = function (t) { return t ? new Date(new Date(t).getTime() - 5 * 3600000).toISOString().slice(11, 16) : ''; };
  var DN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var addDays = function (d, n) { return new Date(new Date(d + 'T12:00:00Z').getTime() + n * 86400000).toISOString().slice(0, 10); };
  var nice = function (d) { var x = new Date(d + 'T12:00:00Z'); return DN[x.getUTCDay()] + ' ' + x.getUTCDate() + ' ' + MN[x.getUTCMonth()]; };
  var mins = function (m) { m = Math.round(m || 0); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60 ? (m % 60) + 'm' : '') : m + 'm'; };
  var cfg = null, tab = 'me', day = null, timer = null;
  function toast(t) { var el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.style.display = 'none'; }, 4000); }
  function api(url, method, body) {
    return fetch(url, { method: method || 'GET', credentials: 'same-origin', headers: { Accept: 'application/json', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        if (r.status === 401) { location.href = '/admin.html'; throw new Error('Sign in required'); }
        return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; });
      });
  }
  function modal(h) { $('#modal').innerHTML = '<div class="modal"><div class="card">' + h + '</div></div>'; $('.modal').addEventListener('mousedown', function (e) { if (e.target.classList.contains('modal')) close(); }); }
  function close() { $('#modal').innerHTML = ''; }
  function scoreCls(s) { return s == null ? '' : s >= 80 ? 's-hi' : s >= 55 ? 's-mid' : 's-lo'; }
  function catOpts(sel) { return Object.keys(cfg.categories).filter(function (k) { return k !== 'devotion'; }).map(function (k) { return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + esc(cfg.categories[k]) + '</option>'; }).join(''); }
  function staffOpts(sel) { return cfg.staff.map(function (s) { return '<option value="' + s.id + '"' + (s.id === sel ? ' selected' : '') + '>' + esc(s.name) + (s.department ? ' — ' + esc(s.department) : '') + '</option>'; }).join(''); }
  function dayBar(cb) {
    return '<button class="sm" id="dp">◀</button><input type="date" id="dd" value="' + esc(day) + '"><button class="sm" id="dn">▶</button>' + (day !== cfg.today ? '<button class="sm" id="dt">Today</button>' : '');
  }
  function wireDay(fn) {
    $('#dd').onchange = function () { day = this.value || cfg.today; fn(); };
    $('#dp').onclick = function () { day = addDays(day, -1); fn(); };
    $('#dn').onclick = function () { day = addDays(day, 1); fn(); };
    if ($('#dt')) $('#dt').onclick = function () { day = cfg.today; fn(); };
  }

  // ------------------------------------------------------------- voice --
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function micButton() { return '<button class="mic" id="mic" title="Say: add stock count at 2 pm for 1 hour · start stock count · done stock count">🎤 Speak</button><input id="vtxt" placeholder="…or type: add stock count at 2 pm" style="min-width:240px"><button class="sm" id="vgo">Go</button>'; }
  function wireVoice(after) {
    var send = function (text) {
      if (!text) return;
      api('/api/dayplan/voice', 'POST', { text: text, day: day }).then(function (r) {
        toast('🎤 "' + r.heard + '"\n' + (r.did === 'added' ? 'Added: ' + r.title + (r.start ? ' at ' + r.start : '') + (r.user_id !== cfg.me.id ? ' for ' + r.user_name : '') + (r.day !== day ? ' (' + nice(r.day) + ')' : '') : r.did === 'started' ? '▶ Started: ' + r.title : r.did === 'skipped' ? 'Skipped: ' + r.title : '✓ Done: ' + r.title));
        $('#vtxt').value = ''; after();
      }).catch(function (e) { toast('🎤 "' + text + '"\n' + e.message); });
    };
    $('#vgo').onclick = function () { send($('#vtxt').value.trim()); };
    $('#vtxt').onkeydown = function (e) { if (e.key === 'Enter') send(this.value.trim()); };
    var b = $('#mic');
    if (!SR) { b.disabled = true; b.title = 'Voice needs Chrome or Edge'; return; }
    b.onclick = function () {
      var r = new SR(); r.lang = 'en-JM'; r.interimResults = false; r.maxAlternatives = 1;
      b.classList.add('on'); b.textContent = '🎤 Listening…';
      r.onresult = function (e) { var t = e.results[0][0].transcript; $('#vtxt').value = t; send(t); };
      r.onerror = function (e) { toast('Voice: ' + (e.error === 'not-allowed' ? 'allow the microphone for this site' : e.error)); };
      r.onend = function () { b.classList.remove('on'); b.textContent = '🎤 Speak'; };
      try { r.start(); } catch (_) {}
    };
  }

  // ----------------------------------------------------------- devotion --
  function devotionCard(d, compact) {
    if (!d || d.mode === 'off') return compact ? '' : '<div class="card empty">No devotion on ' + esc(nice(d.day)) + '.</div>';
    var empty = d.mode === 'manual' && !d.scripture_ref && !d.reflection;
    return '<div class="dev"><div class="when">🙏 Start your day with God · ' + esc(tm(d.starts_at)) + ' – ' + esc(tm(d.ends_at)) + (d.location ? ' · ' + esc(d.location) : '') + (d.leader_name ? ' · led by ' + esc(d.leader_name) : '') + ' · ' + (d.mode === 'system' ? 'today\'s word' : 'manual') + '</div>' +
      '<h2>' + esc(d.title || 'Devotion') + '</h2>' +
      (empty ? '<p><i>The words for today have not been added yet' + (d.leader_name ? ' by ' + esc(d.leader_name) : '') + '.</i></p>' :
        (d.scripture_text ? '<blockquote>“' + esc(d.scripture_text) + '” <span class="ref">— ' + esc(d.scripture_ref || '') + '</span></blockquote>' : (d.scripture_ref ? '<p class="ref">' + esc(d.scripture_ref) + '</p>' : '')) +
        (d.reflection && !compact ? '<p>' + esc(d.reflection) + '</p>' : '') + (d.prayer && !compact ? '<p class="pray">🙏 ' + esc(d.prayer) + '</p>' : '')) +
      (compact ? '<p><a href="#devotion" data-go="devotion">Read and join ›</a></p>' : '') + '</div>';
  }
  function devotion() {
    return api('/api/dayplan/devotion?day=' + day).then(function (d) {
      var on = d.mode !== 'off', isToday = d.day === cfg.today, mine = d.joined.filter(function (j) { return j.user_id === d.me; })[0];
      var KIND = { comment: ['💬', 'Comment'], prayer: ['🙏', 'Prayer request'], praise: ['🎉', 'Praise report'] };
      var signBox = !on ? '' : mine ? '<span class="pill ok">✓ Signed in ' + esc(tm(mine.at)) + (mine.late ? ' (after it ended)' : '') + '</span>'
        : isToday ? '<input id="snote" placeholder="A word to share (optional)" style="min-width:220px"><button class="ok" id="join">✍ Sign in</button>' : '';
      var sheet = '';
      if (on && d.sheet) {
        var inN = d.sheet.filter(function (x) { return x.signed_in; }).length;
        sheet = '<div class="card"><h2>✍ Sign-in sheet <span class="pill' + (inN === d.sheet.length && inN ? ' ok' : '') + '">' + inN + ' of ' + d.sheet.length + ' signed in</span></h2><p class="sub">Everyone on the roster for ' + esc(nice(d.day)) + ' (all staff on a day the shop is closed). Staff sign themselves in from 30 minutes before the devotion' + (d.can_mark ? '; you can sign in anyone who was there' : '') + '.</p>' +
          '<div class="scroll"><table><thead><tr><th>Staff</th><th>Shift</th><th>Signed in</th><th>Note</th><th></th></tr></thead><tbody>' +
          d.sheet.map(function (x) {
            return '<tr><td><b>' + esc(x.name) + '</b>' + (x.department ? '<br><small style="color:var(--muted)">' + esc(x.department) + '</small>' : '') + '</td><td>' + esc(x.shift || '') + '</td>' +
              '<td>' + (x.signed_in ? '<span class="pill ok">✓ ' + esc(tm(x.signed_in)) + '</span>' + (x.how === 'marked' ? ' <small style="color:var(--muted)">signed in by a manager</small>' : '') + (x.late ? ' <span class="pill warn">after it ended</span>' : '') : (d.day <= cfg.today && new Date(d.ends_at) < new Date() ? '<span class="pill bad">not signed in</span>' : '<span class="pill">not yet</span>')) + '</td>' +
              '<td>' + esc(x.note || '') + '</td><td style="white-space:nowrap">' + (d.can_mark ? (x.signed_in ? '<button class="sm" data-unmark="' + x.user_id + '" title="Take off the sheet">✕</button>' : '<button class="sm" data-mark="' + x.user_id + '">✍ Sign in</button>') : '') + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
      } else if (on) {
        sheet = '<div class="card"><h2>✍ Signed in (' + d.joined.length + ')</h2>' + (d.joined.length ? '<p>' + d.joined.map(function (j) { return '<span class="pill ok">' + esc(j.name) + ' · ' + esc(tm(j.at)) + '</span>'; }).join(' ') + '</p>' : '<p class="sub">Nobody yet.</p>') + '</div>';
      }
      var comments = !on ? '' : '<div class="card"><h2>💬 Comments, prayer requests and praise</h2>' +
        (d.comments.length ? d.comments.map(function (c) {
          return '<div class="cmt cmt-' + c.kind + '"><div class="cmt-h"><b>' + KIND[c.kind][0] + ' ' + esc(c.name) + '</b> <span class="pill">' + esc(KIND[c.kind][1]) + '</span> <small>' + esc(tm(c.at)) + '</small>' + (c.can_remove ? '<button class="sm cmt-x" data-rmc="' + c.id + '" title="Remove">✕</button>' : '') + '</div><div class="cmt-b">' + esc(c.body) + '</div></div>';
        }).join('') : '<p class="sub">Nothing yet. Share what today\'s word meant to you, ask for prayer, or give God thanks for something.</p>') +
        (d.day <= cfg.today ? '<div class="cmt-new"><select id="ck"><option value="comment">💬 Comment</option><option value="prayer">🙏 Prayer request</option><option value="praise">🎉 Praise report</option></select><textarea id="cb" maxlength="1000" placeholder="Write here…"></textarea><div class="controls" style="margin:6px 0 0"><span class="sub" style="margin:0">Everyone at work can read this.</span><span class="grow"></span><button class="primary" id="cpost">Post</button></div></div>' : '') + '</div>';
      $('#out').innerHTML = '<div class="controls">' + dayBar() + '<span class="grow"></span>' + signBox + (d.can_edit ? '<button id="edev">Edit this day</button>' : '') + '</div>' +

  // --------------------------------------------------- charts (SVG) --
  function svgEl(w, h, inner) { return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="max-width:' + w + 'px;display:block" role="img">' + inner + '</svg>'; }
  // One bar per person: work by kind, stacked; the clocked-in time as an outline behind.
  function personChart(P, kinds) {
    if (!P.length) return '<div class="empty">No work logged.</div>';
    var W = 760, L = 150, R = 70, row = 26, H = P.length * row + 26;
    var max = Math.max.apply(null, P.map(function (p) { return Math.max(p.productive_min, p.clocked_min); }).concat([60]));
    var sx = function (m) { return (W - L - R) * m / max; };
    var out = '';
    var step = max > 3000 ? 600 : max > 1200 ? 240 : max > 480 ? 120 : 60;
    for (var g = 0; g <= max; g += step) out += '<line x1="' + (L + sx(g)) + '" x2="' + (L + sx(g)) + '" y1="0" y2="' + (H - 18) + '" stroke="currentColor" stroke-opacity=".12"/><text x="' + (L + sx(g)) + '" y="' + (H - 4) + '" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".6">' + (g / 60) + 'h</text>';
    P.forEach(function (p, i) {
      var y = i * row + 4;
      out += '<text x="' + (L - 8) + '" y="' + (y + 13) + '" font-size="12" text-anchor="end" fill="currentColor">' + (i === 0 && p.productive_min ? '🏆 ' : '') + esc(p.name.length > 20 ? p.name.slice(0, 19) + '…' : p.name) + '</text>';
      if (p.clocked_min) out += '<rect x="' + L + '" y="' + (y - 1) + '" width="' + sx(p.clocked_min) + '" height="18" rx="3" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="3 2"><title>Clocked in ' + esc(mins(p.clocked_min)) + '</title></rect>';
      var x = L;
      Object.keys(kinds).forEach(function (k) {
        var v = (p.by_kind || {})[k]; if (!v) return;
        out += '<rect x="' + x + '" y="' + (y + 1) + '" width="' + Math.max(0.5, sx(v)) + '" height="14" fill="' + kinds[k].color + '"><title>' + esc(p.name + ' · ' + kinds[k].label + ': ' + mins(v)) + '</title></rect>';
        x += sx(v);
      });
      out += '<text x="' + (L + sx(Math.max(p.productive_min, p.clocked_min)) + 6) + '" y="' + (y + 13) + '" font-size="11.5" font-weight="600" fill="currentColor">' + hh(p.productive_min) + 'h</text>';
    });
    return svgEl(W, H, out);
  }
  // Productive hours each day, stacked by kind; a dot for hours clocked in.
  function dayChart(D, kinds) {
    var W = 760, H = 220, L = 34, B = 34, T = 10;
    var max = Math.max.apply(null, D.map(function (d) { return Math.max(d.productive_min, d.clocked_min); }).concat([60]));
    var bw = (W - L - 8) / D.length, sy = function (m) { return (H - B - T) * m / max; };
    var out = '';
    var step = max > 6000 ? 1200 : max > 2400 ? 600 : max > 900 ? 240 : 60;
    for (var g = 0; g <= max; g += step) out += '<line x1="' + L + '" x2="' + W + '" y1="' + (H - B - sy(g)) + '" y2="' + (H - B - sy(g)) + '" stroke="currentColor" stroke-opacity=".12"/><text x="' + (L - 4) + '" y="' + (H - B - sy(g) + 3) + '" font-size="10" text-anchor="end" fill="currentColor" fill-opacity=".6">' + (g / 60) + 'h</text>';
    D.forEach(function (d, i) {
      var x = L + i * bw + bw * 0.15, w = bw * 0.7, y = H - B;
      Object.keys(kinds).forEach(function (k) { var v = (d.by_kind || {})[k]; if (!v) return; var h = sy(v); y -= h; out += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + kinds[k].color + '"><title>' + esc(nice(d.day) + ' · ' + kinds[k].label + ': ' + mins(v)) + '</title></rect>'; });
      if (d.clocked_min) out += '<circle cx="' + (x + w / 2) + '" cy="' + (H - B - sy(d.clocked_min)) + '" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"><title>Clocked in ' + esc(mins(d.clocked_min)) + '</title></circle>';
      if (D.length <= 16 || i % Math.ceil(D.length / 16) === 0) out += '<text x="' + (x + w / 2) + '" y="' + (H - B + 14) + '" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".7">' + esc(D.length > 7 ? d.day.slice(8) : nice(d.day).slice(0, 6)) + '</text>';
      if (d.productive_min && D.length <= 14) out += '<text x="' + (x + w / 2) + '" y="' + (H - B - sy(d.productive_min) - 4) + '" font-size="10" text-anchor="middle" fill="currentColor">' + hh(d.productive_min) + '</text>';
    });
    return svgEl(W, H, out);
  }
  // When in the day the work happens.

  }
  api('/api/dayplan/config').then(function (c) {
    cfg = c; day = c.today;
    try { tab = localStorage.getItem('vision.dayTab') || (c.can_see_all ? 'schedule' : 'me'); } catch (_) {}
    var h = /^#(schedule|me|devotion|perf|setup|work|duties|links)(?:=(\d{4}-\d{2}-\d{2}))?/.exec(location.hash); if (h) { tab = h[1]; if (h[2]) day = h[2]; }
    if (!c.can_see_all && (tab === 'schedule' || tab === 'perf')) tab = 'me';
    if (!c.can_manage && tab === 'duties') tab = 'me';
    drawTabs(); go();
  }).catch(function (e) { $('#out').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; });
})();
</script>
