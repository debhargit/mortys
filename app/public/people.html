<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People &amp; HR · Morty's Auto Parts</title>
<style>
  :root{ --red:#d62828; --navy:#0b1b2b; --ink:#0f1720; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ok:#16a34a; --warn:#b45309; --chip:#eef2f7; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; --chip:#1f2b38; --warn:#f59e0b; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0} header nav{margin-left:auto;display:flex;gap:14px;font-size:13px;align-items:center;flex-wrap:wrap} header a{color:#fff;opacity:.85}
  main{max-width:1250px;margin:0 auto;padding:14px 16px 60px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px} .tabs button{border-radius:999px} .tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  input,select,button,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  textarea{width:100%} button{cursor:pointer;background:var(--card)} button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600} button.sm{padding:3px 9px;font-size:12.5px}
  button.link{border:0;background:none;color:var(--red);padding:0;font-weight:600}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px} .controls label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px;margin-bottom:10px} .grid label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px} .grid input,.grid select{width:100%}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse} th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  tr.row{cursor:pointer} tr.row:hover td{background:var(--chip)}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip)} .pill.ok{background:#16a34a22;color:var(--ok)} .pill.warn{background:#f59e0b22;color:var(--warn)} .pill.bad{background:#d6282822;color:var(--red)}
  .modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:9990} .modal .card{max-width:900px;width:100%}
  .modal.top{z-index:9995} .modal.top .card{max-width:640px}
  .empty{color:var(--muted);text-align:center;padding:20px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:9999}
  .ftabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:8px 0 12px} .ftabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 10px} .ftabs button.on{border-bottom-color:var(--red);font-weight:600}
  .item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px} .item small{color:var(--muted)}
  .warn{background:#f59e0b18;border-left:3px solid var(--warn);padding:8px 10px;border-radius:8px;margin:8px 0}
  h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px} .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px} .kpi b{display:block;font-size:22px} .kpi span{color:var(--muted);font-size:12px}
  .bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:60px} .bar i{display:block;height:100%;background:var(--red)}
  .org ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line)} .org > ul{border-left:0;padding-left:0}
  .org li{margin:6px 0} .org .node{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer} .org .node:hover{border-color:var(--red)} .org .node small{color:var(--muted);display:block}
  .task{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line)} .task span{flex:1} .task.done span{color:var(--muted);text-decoration:line-through}
  .stars{display:flex;gap:4px} .stars button{padding:2px 9px;font-size:13px} .stars button.on{background:var(--red);border-color:var(--red);color:#fff}
  .centre{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start} .side{border:1px solid var(--line);border-radius:10px;padding:12px;position:sticky;top:8px;max-height:92vh;overflow:auto}
  @media (max-width:980px){ .centre{grid-template-columns:1fr} .side{position:static;max-height:none} }
  tr.row.sel td{background:#d6282814} .who{display:flex;gap:12px;align-items:center} .ava{border-radius:50%;object-fit:cover;background:var(--chip);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
  table.kv th{text-transform:none;letter-spacing:0;font-size:12.5px;width:40%;padding:3px 8px 3px 0} table.kv td{padding:3px 0}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px} .steps span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--muted)} .steps span.on{background:var(--red);color:#fff} .steps span.done{color:var(--ok)}
  @media print{ header,.tabs,.controls,button,.side{display:none!important} .card{border:0} .centre{display:block} }
</style>

<body>
<header><h1>People &amp; HR</h1><nav><a href="/attendance.html">Attendance</a><a href="/payroll.html">Payroll</a><a href="/training.html">Training</a><a href="/documents.html">Documents</a><a href="/hiring.html">Hiring</a><a href="/admin.html#tab=staff">Users &amp; Staff</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div><div id="modal2"></div>
<div class="toast" id="toast"></div>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var all = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var day = function (t) { return t ? new Date(String(t).length === 10 ? t + 'T12:00:00' : t).toLocaleDateString('en-JM') : ''; };
  var when = function (t) { return t ? new Date(t).toLocaleString('en-JM', { dateStyle: 'short', timeStyle: 'short' }) : ''; };
  var jmd = function (v) { return v == null ? '' : 'J$' + Number(v).toLocaleString('en-JM', { maximumFractionDigits: 2 }); };
  var today = function () { var d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  var CONTRACT = { permanent: 'Permanent', fixed_term: 'Fixed term', part_time: 'Part time', casual: 'Casual', contractor: 'Contractor', intern: 'Internship' };
  var STATUS = { probation: 'On probation', active: 'Active', notice: 'Working notice', left: 'Left' };
  var JOBK = { start: 'Started', promotion: 'Promotion', transfer: 'Transfer', pay_change: 'Pay change', title_change: 'New job title', confirmation: 'Confirmed in post', demotion: 'Demotion', rehire: 'Rehired', other: 'Other' };
  var CASEK = { counselling: 'Counselling', verbal_warning: 'Verbal warning', written_warning: 'Written warning', final_warning: 'Final written warning', suspension: 'Suspension', dismissal: 'Dismissal', commendation: 'Commendation' };
  var EXITK = { resignation: 'Resignation', termination: 'Termination', redundancy: 'Redundancy', end_of_contract: 'End of contract', retirement: 'Retirement', other: 'Other' };
  var EMPTYPE = { regular: 'Regular', officer: 'Officer', owner: 'Owner', statutory: 'Statutory' };
  var SIGNST = { sent: 'Waiting for signature', signed: 'Signed', declined: 'Declined', cancelled: 'Withdrawn' };
  var REVK = { probation: 'End of probation', annual: 'Yearly', midyear: 'Mid-year', other: 'Other' };
  var SALUT = ['Mr', 'Mrs', 'Ms', 'Miss', 'Dr'];
  var GENDER = { female: 'Female', male: 'Male', other: 'Other' };
  var MARITAL = { single: 'Single', married: 'Married', common_law: 'Common-law', divorced: 'Divorced', widowed: 'Widowed' };
  var TODOT = { call: 'Call', meeting: 'Meeting', email: 'Email', task: 'Task', follow_up: 'Follow up' };
  var PRIO = { low: 'Low', medium: 'Medium', high: 'High' };
  var FKIND = { text: 'Text', number: 'Number', date: 'Date', list: 'Choose from a list', yesno: 'Yes / no' };
  var LEAVEK = { vacation: 'Vacation', sick: 'Sick', unpaid: 'Unpaid', other: 'Other' };
  var PARISHES = ['Kingston', 'St. Andrew', 'St. Thomas', 'Portland', 'St. Mary', 'St. Ann', 'Trelawny', 'St. James', 'Hanover', 'Westmoreland', 'St. Elizabeth', 'Manchester', 'Clarendon', 'St. Catherine'];
  var META = { departments: [], people: [], criteria: [] };
  var tab = 'staff', CAN = false, staff = [];

  function toast(t) { var el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.style.display = 'none'; }, 3500); }
  function api(url, method, body) {
    return fetch(url, { method: method || 'GET', credentials: 'same-origin', headers: { Accept: 'application/json', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        if (r.status === 401) { location.href = '/admin.html'; throw new Error('Sign in required'); }
        return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; });
      });
  }
  function modal(h, layer) {
    var host = $(layer === 2 ? '#modal2' : '#modal');
    host.innerHTML = '<div class="modal' + (layer === 2 ? ' top' : '') + '"><div class="card">' + h + '</div></div>';
    host.firstChild.addEventListener('mousedown', function (e) { if (e.target.classList.contains('modal')) close(layer); });
    return host.firstChild;
  }
  function close(layer) { $(layer === 2 ? '#modal2' : '#modal').innerHTML = ''; if (layer !== 2 && /^#staff=/.test(location.hash)) history.replaceState(null, '', '#' + tab); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if ($('#modal2').innerHTML) close(2); else close(); } });
  var opts = function (list, cur, blank) { return (blank != null ? '<option value="">' + esc(blank) + '</option>' : '') + list.map(function (p) { var id = p.id != null ? p.id : p[0], nm = p.name != null ? p.name : p[1]; return '<option value="' + esc(id) + '"' + (String(cur) === String(id) ? ' selected' : '') + '>' + esc(nm) + '</option>'; }).join(''); };
  var pairs = function (o) { return Object.keys(o).map(function (k) { return [k, o[k]]; }); };
  var field = function (label, html) { return '<div><label>' + esc(label) + '</label>' + html + '</div>'; };
  var inp = function (id, v, type) { return '<input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(v == null ? '' : v) + '">'; };
  function statusPill(s) { return '<span class="pill' + (s === 'probation' || s === 'notice' ? ' warn' : s === 'left' ? ' bad' : ' ok') + '">' + esc(STATUS[s] || s) + '</span>'; }
  function csv(name, rows) {
    var text = rows.map(function (r) { return r.map(function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })); a.download = name + '-' + today() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------------------------------------------------------------- tabs --
  var TABS = [['staff', '🗂 Staff files'], ['org', '🌳 Org chart'], ['leave', '🏖 Leave'], ['tasks', '✅ Checklists'], ['reports', '📊 Reports'], ['audit', '📜 HR log'], ['import', '⇪ QuickBooks'], ['me', '🙂 My HR file']];
  function drawTabs() {
    $('#tabs').innerHTML = TABS.filter(function (t) { return CAN || t[0] === 'me'; }).map(function (t) { return '<button data-t="' + t[0] + '"' + (t[0] === tab ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join('');
    all('[data-t]').forEach(function (b) { b.onclick = function () { location.hash = b.getAttribute('data-t'); }; });
  }
  function show() {
    drawTabs();
    var v = $('#view'); v.innerHTML = '<div class="empty">Loading…</div>';
    var f = { staff: staffList, org: orgChart, leave: leaveView, tasks: tasksView, reports: reportsView, audit: auditView, import: importView, me: myFile }[tab];
    Promise.resolve(f(v)).catch(function (e) { v.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }

  // ---------------------------------------------------------- staff list --
  // As the QuickBooks Employee Center: Active / Inactive / Released / All, a
  // quick search, the columns you choose, Excel, CSV and print, and a panel
  // with the selected person's details and their pay.
  var STATEL = { active: 'Active', inactive: 'Inactive', released: 'Released', all: 'All' };
  var PAYT = { salary: 'Salary', hourly: 'Hourly', daily: 'Day rate', piece: 'Piece work', contract: 'Contract' };
  var FREQ = { weekly: 'Weekly', fortnightly: 'Fortnightly', monthly: 'Monthly' };
  var LIST = { state: 'active', staff: [], fields: [], counts: {}, access: {} }, sel = null;
  function serviceYears(s) {
    var from = s.adjusted_service_date || s.start_date; if (!from) return null;
    var to = s.state === 'released' && s.release_date ? s.release_date : today();
    var y = (Date.parse(to + 'T12:00:00') - Date.parse(from + 'T12:00:00')) / (365.25 * 86400000);
    return y >= 0 ? Math.floor(y * 10) / 10 : null;
  }
  function attention(s) {
    var f = [];
    if (s.state === 'released') return f;
    if (s.status === 'probation' && s.probation_end && s.probation_end <= new Date(Date.now() + 30 * 86400000).toISOString().slice(0, 10)) f.push(['warn', 'probation ends ' + day(s.probation_end)]);
    if (s.open_cases) f.push(['bad', s.open_cases + ' warning' + (s.open_cases > 1 ? 's' : '')]);
    if (s.review_due) f.push([s.review_due < today() ? 'bad' : '', 'review ' + day(s.review_due)]);
    if (s.open_tasks) f.push(['', s.open_tasks + ' to do']);
    if (s.open_todos) f.push(['', s.open_todos + ' reminder' + (s.open_todos > 1 ? 's' : '')]);
    if (!s.contacts) f.push(['warn', 'no emergency contact']);
    if (!s.has_file) f.push(['', 'file not started']);
    return f;
  }
  // [key, heading, text for Excel / CSV, html for the screen (optional), needs pay access]
  function columns() {
    var c = [
      ['name', 'Name', function (s) { return s.name; }, function (s) { return '<b>' + esc(s.name) + '</b>' + (s.preferred_name ? ' <small class="sub">“' + esc(s.preferred_name) + '”</small>' : ''); }],
      ['employee_no', 'Employee no.', function (s) { return s.employee_no; }],
      ['salutation', 'Mr / Ms', function (s) { return s.salutation; }],
      ['legal_name', 'Legal name', function (s) { return s.legal_name; }],
      ['preferred_name', 'Preferred name', function (s) { return s.preferred_name; }],
      ['job_title', 'Job', function (s) { return s.job_title; }],
      ['department', 'Department', function (s) { return s.department; }],
      ['manager', 'Supervisor', function (s) { return s.manager; }],
      ['phone', 'Work phone', function (s) { return s.phone; }],
      ['mobile', 'Mobile', function (s) { return s.mobile; }],
      ['personal_phone', 'Home phone', function (s) { return s.personal_phone; }],
      ['email', 'Work email', function (s) { return s.email; }],
      ['personal_email', 'Personal email', function (s) { return s.personal_email; }],
      ['address', 'Address', function (s) { return s.address; }],
      ['town', 'Town', function (s) { return s.town; }],
      ['parish', 'Parish', function (s) { return s.parish; }],
      ['date_of_birth', 'Date of birth', function (s) { return s.date_of_birth; }, function (s) { return esc(day(s.date_of_birth)); }],
      ['gender', 'Gender', function (s) { return GENDER[s.gender] || ''; }],
      ['marital_status', 'Marital status', function (s) { return MARITAL[s.marital_status] || ''; }],
      ['start_date', 'Hire date', function (s) { return s.start_date; }, function (s) { return esc(day(s.start_date)); }],
      ['adjusted_service_date', 'Adjusted service date', function (s) { return s.adjusted_service_date; }, function (s) { return esc(day(s.adjusted_service_date)); }],
      ['release_date', 'Release date', function (s) { return s.release_date; }, function (s) { return esc(day(s.release_date)); }],
      ['service', 'Years of service', function (s) { return serviceYears(s); }],
      ['contract_type', 'Contract', function (s) { return CONTRACT[s.contract_type] || ''; }],
      ['employee_type', 'Employee type', function (s) { return EMPTYPE[s.employee_type] || ''; }],
      ['work_location', 'Works at', function (s) { return s.work_location; }],
      ['status', 'Status', function (s) { return STATUS[s.status] || s.status; }, function (s) { return statusPill(s.status) + (s.state === 'inactive' ? ' <span class="pill">inactive</span>' : ''); }],
      ['rehire_eligible', 'Eligible for rehire', function (s) { return s.rehire_eligible == null ? '' : s.rehire_eligible ? 'Yes' : 'No'; }],
      ['trn', 'TRN', function (s) { return s.trn; }, null, true],
      ['nis_no', 'NIS no.', function (s) { return s.nis_no; }, null, true],
      ['pay_type', 'Pay type', function (s) { return PAYT[s.pay_type] || ''; }, null, true],
      ['frequency', 'Paid', function (s) { return FREQ[s.frequency] || ''; }, null, true],
      ['rate', 'Rate (J$)', function (s) { return s.pay_type === 'hourly' ? s.hourly_rate : s.pay_type === 'daily' ? s.day_rate : s.salary_annual; }, function (s) { var r = s.pay_type === 'hourly' ? s.hourly_rate : s.pay_type === 'daily' ? s.day_rate : s.salary_annual; return r == null ? '' : esc(jmd(r)) + '<small class="sub">' + (s.pay_type === 'hourly' ? '/hr' : s.pay_type === 'daily' ? '/day' : '/yr') + '</small>'; }, true],
      ['pay_active', 'Pay on', function (s) { return s.payroll_id ? (s.pay_active ? 'Yes' : 'No') : 'Not on Payroll'; }, null, true],
      ['attention', 'Needs attention', function (s) { return attention(s).map(function (x) { return x[1]; }).join('; '); }, function (s) { return attention(s).map(function (x) { return '<span class="pill' + (x[0] ? ' ' + x[0] : '') + '">' + esc(x[1]) + '</span>'; }).join(' '); }],
    ];
    LIST.fields.forEach(function (f) { c.push(['cf' + f.id, f.label, function (s) { return s.custom && s.custom[f.id] != null ? s.custom[f.id] : ''; }]); });
    return c.filter(function (x) { return !x[4] || LIST.access.view; });
  }
  var COLS_KEY = 'people.cols.v1', COLS_DEFAULT = ['name', 'job_title', 'department', 'phone', 'start_date', 'status', 'attention'];
  function chosen() {
    var keys = null;
    try { keys = JSON.parse(localStorage.getItem(COLS_KEY) || 'null'); } catch (_) { keys = null; }
    var have = columns();
    var list = (Array.isArray(keys) && keys.length ? keys : COLS_DEFAULT).map(function (k) { return have.filter(function (c) { return c[0] === k; })[0]; }).filter(Boolean);
    return list.length ? list : have.slice(0, 1);
  }
  function filtered() {
    var q = ($('#q') ? $('#q').value : '').trim().toLowerCase(), df = $('#dF') ? $('#dF').value : '';
    return LIST.staff.filter(function (s) {
      return (!q || [s.name, s.preferred_name, s.legal_name, s.job_title, s.department, s.manager, s.employee_no, s.phone, s.mobile, s.email, s.town, s.parish].join(' ').toLowerCase().indexOf(q) >= 0) && (!df || String(s.department_id) === df);
    });
  }
  function staffList(v) {
    return api('/api/people/centre?state=' + LIST.state).then(function (d) {
      LIST.staff = d.staff; LIST.fields = d.fields; LIST.counts = d.counts || {}; LIST.access = d.access || {}; staff = d.staff;
      var cnt = function (k) { return k === 'all' ? (LIST.counts.active || 0) + (LIST.counts.inactive || 0) + (LIST.counts.released || 0) : (LIST.counts[k] || 0); };
      v.innerHTML = '<div class="card"><h2>Staff files</h2><p class="sub">Everyone who works here, as in the QuickBooks Employee Center: pick someone to see their details and pay on the right; double-click (or Open file) for the whole file. Logins, roles and PINs are on <a href="/admin.html#tab=staff">Users &amp; Staff</a>; pay is kept in <a href="/payroll.html">Payroll</a>; leave days in <a href="/attendance.html#leave">Attendance › Leave</a>.</p>' +

  // ------------------------------------- make inactive, release and rehire --
  function inactiveDialog(p, after) {
    if (p.state === 'inactive') return api('/api/people/staff/' + p.id + '/inactive', 'POST', { inactive: false }).then(function () { after('Active again'); }).catch(function (e) { toast(e.message); });
    modal('<h2>Make ' + esc(p.name) + ' inactive</h2><p class="sub">Takes them off the active list without releasing them: long sick leave, maternity leave, a break. Nothing changes in Payroll; their login stays as it is. Make them active again from the Inactive list.</p>' +
      '<label class="sub">Why</label><input id="inR" style="width:100%" placeholder="e.g. Maternity leave to March">' +
      '<div class="controls" style="margin-top:10px"><button class="primary" id="inGo">Make inactive</button><button id="inX">Cancel</button></div>', 2);
    $('#inX').onclick = function () { close(2); };
    $('#inGo').onclick = function () { api('/api/people/staff/' + p.id + '/inactive', 'POST', { inactive: true, reason: $('#inR').value }).then(function () { close(2); after('Made inactive'); }).catch(function (e) { toast(e.message); }); };
  }
  function releaseDialog(p, after) {
    modal('<h2>Release ' + esc(p.name) + '</h2><p class="sub">Their last day worked. They move to the Released list; Payroll pays them up to that day and no further (the final pay is worked out on the next run). For notice, an exit interview and the leaving checklist, use the Leaving tab instead.</p>' +
      '<div class="grid">' + field('Release date (last day worked)', inp('rlD', today(), 'date')) + field('Why', '<select id="rlK">' + opts(pairs(EXITK), 'resignation') + '</select>') +
        field('Eligible for rehire', '<select id="rlRh"><option value="">Not decided</option><option value="yes">Yes</option><option value="no">No</option></select>') + '</div>' +
      '<label class="sub">Details</label><input id="rlN" style="width:100%">' +
      (p.is_archived ? '' : '<label style="display:flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="rlA"> Also archive their login now (signs them out, stops sign-in, removes the till PIN; their history stays)</label>') +
      '<div class="controls" style="margin-top:10px"><button class="primary" id="rlGo">Release</button><button id="rlX">Cancel</button></div>', 2);
    $('#rlX').onclick = function () { close(2); };
    $('#rlGo').onclick = function () {
      var on = $('#rlD').value, why = EXITK[$('#rlK').value] + ($('#rlN').value ? ' — ' + $('#rlN').value : '');
      api('/api/people/staff/' + p.id + '/release', 'POST', { release_date: on, reason: why, rehire_eligible: $('#rlRh').value === '' ? null : $('#rlRh').value === 'yes' }).then(function (r) {
        close(2);
        if (!($('#rlA') && $('#rlA').checked)) return after('Released. ' + r.payroll);
        return api('/api/admin/staff/' + p.id, 'PATCH', { archived: true, left_on: on, archive_reason: why.slice(0, 200) })
          .then(function () { after('Released and login archived. ' + r.payroll); }, function (e) { after('Released, but the login was not archived: ' + e.message); });
      }).catch(function (e) { toast(e.message); });
    };
  }

    modal('<h2>Rehire ' + esc(p.name) + '</h2>' + (p.rehire_eligible === false ? '<div class="warn">Their file says they are <b>not</b> eligible for rehire. Give the reason to go ahead.</div>' : '') +
      '<p class="sub">Back on the active list from the date below. The original hire date stays; their earlier history stays on the file.</p>' +
      '<div class="grid">' + field('Starts again on', inp('rhD', today(), 'date')) + field('Service', '<select id="rhS"><option value="restart">Counts from this date (adjusted service date)</option><option value="continue">Continues from before (a short break)</option></select>') +
        field('Job title', inp('rhT', p.job_title)) + field('Department', '<select id="rhDp">' + opts(META.departments, p.department_id, 'As before') + '</select>') +
        field('Supervisor', '<select id="rhM">' + opts(META.people.filter(function (x) { return x.id !== p.id; }), p.manager_user_id, 'As before') + '</select>') + field('Contract', '<select id="rhC">' + opts(pairs(CONTRACT), p.contract_type || 'permanent') + '</select>') +
        field('Probation (months)', inp('rhPm', 0, 'number')) + '</div>' +

      (p.is_archived ? '<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="rhL" checked> Restore their login from the archive (a manager sets the password or PIN)</label>' : '') +
      '<div class="controls" style="margin-top:10px"><button class="primary" id="rhGo">Rehire</button><button id="rhX">Cancel</button></div>', 2);
    $('#rhX').onclick = function () { close(2); };

        reason: $('#rhN').value, override_reason: $('#rhO') ? $('#rhO').value : '', onboarding: $('#rhOn').checked };
      api('/api/people/staff/' + p.id + '/rehire', 'POST', body).then(function (r) {
        close(2);
        if (!($('#rhL') && $('#rhL').checked)) return after('Rehired. ' + r.payroll);
        return api('/api/admin/staff/' + p.id, 'PATCH', { archived: false }).then(function () { after('Rehired and login restored. ' + r.payroll); }, function (e) { after('Rehired, but the login was not restored: ' + e.message); });
      }).catch(function (e) { toast(e.message); });
    };
  }

  function sendToSign(f, what) {

    modal('<h2>Send to ' + esc(u.name || '') + ' to sign</h2>' +
      (what.document_number !== undefined ? '<div class="grid">' + field('Document number in the Document centre', inp('sgDoc', what.document_number || '', 'text')) + field('Kind', '<select id="sgK">' + opts([['policy', 'Policy or handbook'], ['letter', 'Letter'], ['contract', 'Contract'], ['other', 'Other']], 'policy') + '</select>') + '</div>' : '') +

      '<div class="grid">' + field('Send the link to', inp('sgE', mail || '', 'email')) + field('Link works for (days)', inp('sgDays', 14, 'number')) + '</div>' +
      '<label style="display:flex;gap:6px;align-items:center;margin:4px 0"><input type="checkbox" id="sgCode"> Ask for an access code before it opens (you give them the code by phone, not by email)</label>' +
      '<label class="sub">Message (optional)</label><textarea id="sgM" rows="2"></textarea>' +

        .catch(function (e) { $('#sgGo').disabled = false; toast(e.message); });

    v.innerHTML = '<div class="card"><h2>Employees from QuickBooks</h2><p class="sub">In QuickBooks Desktop: Reports › List › Employee Contact List, then Excel › Create New Worksheet › save as CSV; or File › Utilities › Export › Lists to IIF Files › Employee List. In QuickBooks Online: Payroll › Employees › Export. ' +
      'You see each employee first: new, changed (with each change) or the same. Only what you tick is added or changed. New people get an HR file and a staff record with the login switched off; anyone with a release date in the past is put straight into the archive. TRN, NIS and pay go to Payroll (switched off) only if you may change pay.</p>' +
      '<div class="controls"><input type="file" id="qeF" accept=".csv,.iif,.txt"><button id="qeP">Preview</button></div><div id="qeOut"></div></div>' +
      '<div class="card"><h2>Payroll items from QuickBooks</h2><p class="sub">Lists › Payroll Item List › Reports › Payroll Item Listing, saved as CSV. Earnings, deductions and company contributions that are not here yet are added; PAYE, NIS, NHT, Education Tax and HEART are not imported, because Payroll works them out by the TAJ rules. Check the tax ticks on each new item in Payroll settings. Needs the pay permission.</p>' +
      '<div class="controls"><input type="file" id="qiF" accept=".csv,.txt"><button id="qiP">Preview</button></div><div id="qiOut"></div></div>';
    function read(input) { return new Promise(function (ok, bad) { var f = input.files[0]; if (!f) return bad(new Error('Choose the file first')); if (f.size > 5 * 1024 * 1024) return bad(new Error('The file is over 5 MB')); var r = new FileReader(); r.onload = function () { ok(String(r.result)); }; r.onerror = function () { bad(new Error('Could not read the file')); }; r.readAsText(f); }); }
    var ST = { new: ['New', ' ok'], changed: ['Changed', ' warn'], same: ['Same', ''], duplicate: ['Twice in file', ' bad'], skip: ['Not imported', ''] };
    function preview(url, input, out, cols) {
      read(input).then(function (file) {
        return api(url, 'POST', { file: file, preview: true }).then(function (d) {
          var can = d.rows.filter(function (r) { return r.status === 'new' || r.status === 'changed'; });
          out.innerHTML = '<p class="sub">' + d.rows.length + ' in the file: ' + can.length + ' to add or change.' + (d.payroll === false ? ' Pay details are left out: you may not change pay.' : '') + '</p>' +
            '<div class="scroll"><table><thead><tr><th><input type="checkbox" id="' + out.id + 'All" checked></th>' + cols.map(function (c) { return '<th>' + c[0] + '</th>'; }).join('') + '<th>Status</th><th>What changes</th></tr></thead><tbody>' + d.rows.map(function (r) {
              var on = r.status === 'new' || r.status === 'changed';
              return '<tr><td>' + (on ? '<input type="checkbox" data-qi="' + r.i + '" checked>' : '') + '</td>' + cols.map(function (c) { return '<td>' + esc(c[1](r) || '') + '</td>'; }).join('') +
                '<td><span class="pill' + ST[r.status][1] + '">' + ST[r.status][0] + '</span></td><td><small>' + esc(r.reason || (r.changes || []).map(function (x) { return x.label + ': ' + (x.from || '–') + ' → ' + x.to; }).join('; ') || (r.existing ? 'matches ' + r.existing : '')) + '</small></td></tr>';
            }).join('') + '</tbody></table></div>' + (can.length ? '<div class="controls" style="margin-top:8px"><button class="primary" id="' + out.id + 'Go">Import the ticked ones</button></div>' : '');
          if (!can.length) return;
          $('#' + out.id + 'All').onchange = function () { var c = this.checked; all('[data-qi]', out).forEach(function (x) { x.checked = c; }); };
          $('#' + out.id + 'Go').onclick = function () {
            this.disabled = true;
            api(url, 'POST', { file: file, include: all('[data-qi]', out).filter(function (x) { return x.checked; }).map(function (x) { return +x.getAttribute('data-qi'); }) })
              .then(function (r) { out.innerHTML = '<div class="warn">Done: ' + [r.added != null ? r.added + ' added' : '', r.updated != null ? r.updated + ' updated' : '', r.left ? r.left + ' archived as released' : ''].filter(Boolean).join(', ') + '.</div>'; })
              .catch(function (e) { toast(e.message); });
          };
        });
      }).catch(function (e) { toast(e.message); });
    }
    $('#qeP').onclick = function () { preview('/api/people/import/employees', $('#qeF'), $('#qeOut'), [['Name', function (r) { return r.name; }], ['Email', function (r) { return r.email; }], ['Phone', function (r) { return r.phone; }], ['Hired', function (r) { return r.hired; }], ['Released', function (r) { return r.released; }]]); };
    $('#qiP').onclick = function () { preview('/api/people/import/payroll-items', $('#qiF'), $('#qiOut'), [['Item', function (r) { return r.label; }], ['QuickBooks type', function (r) { return r.type; }], ['Becomes', function (r) { return r.kind || ''; }]]); };
  }

  // ----------------------------------------------------------- org chart --
  function orgChart(v) {
    return api('/api/people/org').then(function (d) {
      var kids = {}; d.people.forEach(function (p) { (kids[p.manager_id || 0] = kids[p.manager_id || 0] || []).push(p); });
      function tree(id, depth) {
        var list = kids[id] || [];
        if (!list.length || depth > 20) return '';
        return '<ul>' + list.map(function (p) { return '<li><span class="node" data-u="' + p.id + '"><b>' + esc(p.name) + '</b><small>' + esc([p.job_title, p.department].filter(Boolean).join(' · ') || 'job not set') + ((kids[p.id] || []).length ? ' · ' + kids[p.id].length + ' report' + (kids[p.id].length > 1 ? 's' : '') : '') + '</small></span>' + tree(p.id, depth + 1) + '</li>'; }).join('') + '</ul>';
      }
      var none = (kids[0] || []).filter(function (p) { return !(kids[p.id] || []).length; });
      kids[0] = (kids[0] || []).filter(function (p) { return (kids[p.id] || []).length; });
      v.innerHTML = '<div class="card"><h2>Org chart</h2><p class="sub">Who reports to whom, from the manager on each staff file. Click a person to open their file.</p><div class="org">' + (tree(0, 0) || '<div class="empty">No managers set yet. Set each person’s manager on their profile.</div>') + '</div>' +
        (none.length ? '<h4>Manager not set (' + none.length + ')</h4><div class="org"><ul>' + none.map(function (p) { return '<li><span class="node" data-u="' + p.id + '"><b>' + esc(p.name) + '</b><small>' + esc(p.job_title || 'job not set') + '</small></span></li>'; }).join('') + '</ul></div>' : '') + '</div>';
      all('[data-u]', v).forEach(function (n) { n.onclick = function () { openFile(n.getAttribute('data-u')); }; });
    });
  }

  // --------------------------------------------------------------- leave --
  function leaveView(v) {
    var year = ($('#lvY') && $('#lvY').value) || new Date().getFullYear();
    return api('/api/people/leave?year=' + year).then(function (d) {
      v.innerHTML = '<div class="card"><h2>Leave balances</h2><p class="sub">Allowance from Payroll plus or minus changes on each file; days taken from <a href="/attendance.html#leave">Attendance › Leave</a> (Monday to Saturday). Record time off there.</p>' +
        '<div class="controls"><div><label>Year</label><input id="lvY" type="number" value="' + d.year + '" style="width:90px"></div><button id="lvCsv">Export CSV</button><a href="/attendance.html#leave"><button>Record leave ›</button></a></div>' +
        '<div class="scroll"><table><thead><tr><th>Name</th><th>Department</th><th>Vacation: allowed</th><th>taken</th><th>left</th><th>Sick: allowed</th><th>taken</th><th>left</th><th>Unpaid / other</th></tr></thead><tbody>' + d.staff.map(function (s) {
          return '<tr class="row" data-u="' + s.id + '"><td><b>' + esc(s.name) + '</b></td><td>' + esc(s.department || '') + '</td><td>' + s.vacation_entitled + (s.adjusted_vacation ? ' <small>(' + (s.adjusted_vacation > 0 ? '+' : '') + s.adjusted_vacation + ')</small>' : '') + '</td><td>' + s.vacation_taken + '</td>' +
            '<td><b' + (s.vacation_left < 0 ? ' style="color:var(--red)"' : '') + '>' + s.vacation_left + '</b></td><td>' + s.sick_entitled + '</td><td>' + s.sick_taken + '</td><td' + (s.sick_left < 0 ? ' style="color:var(--red)"' : '') + '>' + s.sick_left + '</td><td>' + (s.unpaid_taken + s.other_taken) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
      $('#lvY').onchange = function () { leaveView(v); };
      $('#lvCsv').onclick = function () { csv('leave-' + d.year, [['Name', 'Department', 'Vacation allowed', 'Vacation taken', 'Vacation left', 'Sick allowed', 'Sick taken', 'Sick left', 'Unpaid', 'Other']].concat(d.staff.map(function (s) { return [s.name, s.department, s.vacation_entitled, s.vacation_taken, s.vacation_left, s.sick_entitled, s.sick_taken, s.sick_left, s.unpaid_taken, s.other_taken]; }))); };
      all('[data-u]', v).forEach(function (r) { r.onclick = function () { fileTab = 'leave'; openFile(r.getAttribute('data-u'), true); }; });
    });
  }

  // ---------------------------------------------------------- checklists --
  function tasksView(v) {
    return api('/api/people/tasks').then(function (d) {
      var kinds = { onboarding: 'Starting', offboarding: 'Leaving', other: 'Other' };
      v.innerHTML = '<div class="card"><h2>Checklists still open</h2><p class="sub">Starter and leaver checklists, and other HR tasks, for everyone. Tick them on the person’s file.</p>' +
        (d.tasks.length ? '<div class="scroll"><table><thead><tr><th>Person</th><th>Kind</th><th>To do</th><th>For</th><th>By</th></tr></thead><tbody>' + d.tasks.map(function (k) {
          return '<tr class="row" data-u="' + k.user_id + '"><td><b>' + esc(k.person) + '</b></td><td>' + esc(kinds[k.kind] || k.kind) + '</td><td>' + esc(k.title) + '</td><td>' + esc(k.assignee || '') + '</td><td' + (k.due_on && k.due_on < today() ? ' style="color:var(--red)"' : '') + '>' + esc(day(k.due_on)) + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty">Nothing open.</div>') + '</div>';
      all('[data-u]', v).forEach(function (r) { r.onclick = function () { fileTab = 'tasks'; openFile(r.getAttribute('data-u'), true); }; });
    });
  }

  // ------------------------------------------------------------- reports --
  function reportsView(v) {
    return api('/api/people/reports').then(function (r) {
      var mx = function (list) { return Math.max.apply(null, [1].concat(list.map(function (x) { return x.n; }))); };
      var bars = function (title, list, labels) {
        var m = mx(list);
        return '<div class="card"><h2>' + title + '</h2>' + (list.length ? '<table>' + list.map(function (x) { return '<tr><td>' + esc((labels && labels[x.label]) || x.label) + '</td><td style="width:55%"><div class="bar"><i style="width:' + Math.round(100 * x.n / m) + '%"></i></div></td><td><b>' + x.n + '</b></td></tr>'; }).join('') + '</table>' : '<div class="empty">None</div>') + '</div>';
      };
      var people = function (title, list, cols, note) {
        return '<div class="card"><h2>' + title + ' <span class="pill' + (list.length ? ' warn' : ' ok') + '">' + list.length + '</span></h2>' + (note ? '<p class="sub">' + note + '</p>' : '') + (list.length ? '<table>' + list.map(function (x) { return '<tr class="row" data-u="' + x.id + '"><td><b>' + esc(x.name) + '</b></td>' + cols.map(function (c) { return '<td>' + esc(c(x)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>' : '<p class="sub">Nothing.</p>') + '</div>';
      };
      var mm = Math.max.apply(null, [1].concat(r.moves.map(function (m) { return Math.max(m.starters, m.leavers); })));
      v.innerHTML = listsCard() + '<div class="kpis"><div class="kpi"><b>' + r.headcount + '</b><span>staff now</span></div><div class="kpi"><b>' + r.starters12 + '</b><span>started in the last 12 months</span></div>' +
        '<div class="kpi"><b>' + r.leavers12 + '</b><span>left in the last 12 months</span></div><div class="kpi"><b>' + r.turnover_pct + '%</b><span>turnover (leavers ÷ average staff)</span></div>' +
        '<div class="kpi"><b>' + (r.hiring.in_progress || 0) + '</b><span>applicants in progress · ' + (r.hiring.posts_open || 0) + ' jobs open</span></div><div class="kpi"><b>' + (r.hiring.days_to_hire != null ? r.hiring.days_to_hire : '–') + '</b><span>average days from applying to hired</span></div></div>' +
        '<div class="controls"><button id="rpPrint">Print</button></div>' +
        '<div class="card"><h2>Starters and leavers by month</h2><table>' + r.moves.map(function (m) { return '<tr><td style="width:90px">' + esc(m.ym) + '</td><td><div class="bar"><i style="width:' + Math.round(100 * m.starters / mm) + '%;background:var(--ok)"></i></div><div class="bar" style="margin-top:2px"><i style="width:' + Math.round(100 * m.leavers / mm) + '%"></i></div></td><td><small>+' + m.starters + ' / −' + m.leavers + '</small></td></tr>'; }).join('') + '</table><p class="sub">Green: started. Red: left.</p></div>' +
        bars('Staff by department', r.by_department) + bars('Staff by contract', r.by_contract, CONTRACT) + bars('Staff by status', r.by_status, STATUS) + bars('Length of service', r.service) + bars('Why people left (last 12 months)', r.exits, EXITK) +
        people('Probation ending within 30 days', r.probation_due, [function (x) { return day(x.due); }], 'Hold the end-of-probation review before this date.') +
        people('Contracts ending within 60 days', r.contracts_ending, [function (x) { return CONTRACT[x.contract_type] || ''; }, function (x) { return day(x.due); }]) +
        people('Warnings still on file', r.warnings, [function (x) { return CASEK[x.kind]; }, function (x) { return x.summary; }, function (x) { return x.expires_on ? 'until ' + day(x.expires_on) : ''; }]) +
        people('Reviews overdue', r.reviews_overdue, [function (x) { return REVK[x.kind]; }, function (x) { return 'due ' + day(x.due); }]) +
        people('No emergency contact', r.no_contact, []) +
        people('Start date or job title missing', r.missing, [function (x) { return [x.no_start ? 'start date' : '', x.no_title ? 'job title' : ''].filter(Boolean).join(', '); }]) +
        people('Birthdays this month', r.birthdays, [function (x) { return x.day; }]);
      $('#rpPrint').onclick = function () { window.print(); };
      listsWire(v);
      all('[data-u]', v).forEach(function (n) { n.onclick = function () { openFile(n.getAttribute('data-u')); }; });
    });
  }
  function auditView(v) {
    return api('/api/people/audit').then(function (d) {
      v.innerHTML = '<div class="card"><h2>HR log</h2><p class="sub">Every change to a staff file and every hiring decision: who, when and what. Nothing here can be edited.</p>' +
        (d.log.length ? '<div class="scroll"><table><thead><tr><th>When</th><th>Who</th><th>About</th><th>What</th></tr></thead><tbody>' + d.log.map(function (x) {
          return '<tr><td><small>' + esc(when(x.at)) + '</small></td><td>' + esc(x.by_name || '') + '</td><td>' + (x.user_id ? '<button class="link" data-u="' + x.user_id + '">' + esc(x.person || '#' + x.user_id) + '</button>' : x.application_id ? '<a href="/hiring.html#app=' + x.application_id + '">applicant #' + x.application_id + '</a>' : esc(x.entity)) + '</td><td>' + esc(x.action) + (x.detail ? '<br><small class="sub">' + esc(x.detail) + '</small>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty">Nothing yet.</div>') + '</div>';
      all('[data-u]', v).forEach(function (n) { n.onclick = function () { fileTab = 'log'; openFile(n.getAttribute('data-u'), true); }; });
    });
  }

  // --------------------------------------------------------- my HR file --
  function myFile(v) {
    return api('/api/people/me').then(function (f) {
      var p = f.profile || {}, l = f.leave || {};
      var waiting = f.reviews.filter(function (r) { return r.status === 'done'; }), letters = f.cases.filter(function (c) { return !c.acknowledged_at; });
      v.innerHTML = '<div class="card"><h2>My HR file</h2><p class="sub">' + esc([p.job_title, p.department, p.manager ? 'reports to ' + p.manager : '', p.start_date ? 'started ' + day(p.start_date) : ''].filter(Boolean).join(' · ')) + '</p>' +
        (waiting.length || letters.length ? '<div class="warn">Waiting for you: ' + [waiting.length ? waiting.length + ' review(s) to read and sign' : '', letters.length ? letters.length + ' letter(s) to read' : ''].filter(Boolean).join(', ') + '.</div>' : '') +
        '<div class="kpis"><div class="kpi"><b>' + (l.vacation_left != null ? l.vacation_left : '–') + '</b><span>vacation days left this year</span></div><div class="kpi"><b>' + (l.sick_left != null ? l.sick_left : '–') + '</b><span>sick days left</span></div>' +
        '<div class="kpi"><b>' + (STATUS[p.status] || 'Active') + '</b><span>' + (p.status === 'probation' && p.probation_end ? 'until ' + esc(day(p.probation_end)) : 'status') + '</span></div></div>' +
        '<p class="sub">To book time off, ask your manager or use the leave form in the <a href="/documents.html">Document centre</a>. Your payslips are in <a href="/my-time.html">My time</a> and Payroll.</p></div>' +
        '<div class="card"><h2>My contact details</h2><div class="grid">' + field('Personal phone', inp('mPh', p.personal_phone, 'tel')) + field('Personal email', inp('mEm', p.personal_email, 'email')) + field('Mobile', inp('mMo', p.mobile, 'tel')) + field('Parish', inp('mPa', p.parish)) + '</div>' +
        '<label class="sub">Home address</label><textarea id="mA" rows="2">' + esc(p.address || '') + '</textarea><div class="controls" style="margin-top:8px"><button class="primary" id="mSave">Save</button></div></div>' +
        '<div class="card" id="mSignCard"><h2>Documents to sign</h2><div id="mSign"><div class="empty">Loading…</div></div></div>' +
        '<div class="card"><h2>My emergency contacts</h2><div id="mC"></div></div>' +
        (f.my_tasks.length ? '<div class="card"><h2>HR tasks for me</h2>' + f.my_tasks.map(function (k) { return '<div class="task"><input type="checkbox" data-mt="' + k.id + '"><span>' + esc(k.title) + (k.link ? ' <a href="' + esc(k.link) + '">open ›</a>' : '') + (k.due_on ? '<br><small class="sub">by ' + esc(day(k.due_on)) + '</small>' : '') + '</span></div>'; }).join('') + '</div>' : '') +
        '<div class="card"><h2>My reviews and goals</h2>' + (f.reviews.length ? f.reviews.map(function (r) {
          return '<div class="item"><b>' + esc(REVK[r.kind]) + ' review</b> · ' + esc(r.reviewer || '') + ' · ' + esc(day(r.completed_at)) + (r.overall ? ' · <b>' + r.overall + '/5</b>' : '') + '<br>' +
            (r.ratings || []).filter(function (x) { return x.score; }).map(function (x) { return esc(x.label) + ': ' + x.score + (x.comment ? ' (' + esc(x.comment) + ')' : ''); }).join('<br>') +
            (r.strengths ? '<br><small>Well done: ' + esc(r.strengths) + '</small>' : '') + (r.improve ? '<br><small>To improve: ' + esc(r.improve) + '</small>' : '') + (r.comments ? '<br><small>' + esc(r.comments) + '</small>' : '') +
            (r.status === 'done' ? '<textarea id="mrc' + r.id + '" rows="2" placeholder="Your comments (optional)" style="margin-top:6px"></textarea><button class="sm primary" data-mr="' + r.id + '">I have read this review</button>' : '<br><small>Signed by you ' + esc(day(r.acknowledged_at)) + (r.employee_comments ? ': “' + esc(r.employee_comments) + '”' : '') + '</small>') + '</div>';
        }).join('') : '<p class="sub">No reviews yet.</p>') +
        (f.goals.length ? '<h4>Goals</h4>' + f.goals.map(function (g) { return '<div class="item"><b>' + esc(g.title) + '</b>' + (g.due_on ? ' · by ' + esc(day(g.due_on)) : '') + ' <span class="pill">' + esc(g.status) + ' ' + g.progress + '%</span>' + (g.measure ? '<br><small>' + esc(g.measure) + '</small>' : '') + '</div>'; }).join('') : '') + '</div>' +
        '<div class="card"><h2>Letters</h2>' + (f.cases.length ? f.cases.map(function (c) {
          return '<div class="item"><b>' + esc(CASEK[c.kind]) + '</b> · ' + esc(day(c.incident_date || c.created_at)) + '<br>' + esc(c.summary) + (c.details ? '<br><small>' + esc(c.details) + '</small>' : '') + (c.action ? '<br><small>Next: ' + esc(c.action) + '</small>' : '') + (c.expires_on ? '<br><small>On file until ' + esc(day(c.expires_on)) + '</small>' : '') +
            (c.acknowledged_at ? '<br><small>Received ' + esc(day(c.acknowledged_at)) + (c.employee_response ? '. Your reply: “' + esc(c.employee_response) + '”' : '') + '</small>' :
              '<textarea id="mcr' + c.id + '" rows="2" placeholder="Your reply (optional)" style="margin-top:6px"></textarea><button class="sm primary" data-mc="' + c.id + '">I have received this letter</button>') + '</div>';
        }).join('') : '<p class="sub">None.</p>') + '</div>';
      $('#mSave').onclick = function () { api('/api/people/me/details', 'PUT', { personal_phone: $('#mPh').value, personal_email: $('#mEm').value, mobile: $('#mMo').value, parish: $('#mPa').value, address: $('#mA').value }).then(function () { toast('Saved'); }).catch(function (e) { toast(e.message); }); };
      contactsPane($('#mC'), f.contacts, '/api/people/me/contacts', function (m) { toast(m); myFile(v); });
      mySignatures($('#mSign'), function () { myFile(v); });
      all('[data-mr]', v).forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-mr'); api('/api/people/me/reviews/' + id + '/ack', 'POST', { comments: $('#mrc' + id).value }).then(function () { toast('Thank you'); myFile(v); }).catch(function (e) { toast(e.message); }); }; });
      all('[data-mc]', v).forEach(function (b) { b.onclick = function () { var id = b.getAttribute('data-mc'); api('/api/people/me/cases/' + id + '/ack', 'POST', { response: $('#mcr' + id).value }).then(function () { toast('Recorded'); myFile(v); }).catch(function (e) { toast(e.message); }); }; });
      all('[data-mt]', v).forEach(function (c) { c.onchange = function () { api('/api/people/me/tasks/' + c.getAttribute('data-mt'), 'PATCH', { done: c.checked }).then(function () { toast('Done'); myFile(v); }).catch(function (e) { toast(e.message); }); }; });
    });
  }

  // ---------------------------------------------------------------- start --
  // #staff=12 opens a file over the staff list; #org, #leave... pick a tab.
  var drawn = false;
  function route() {
    var h = location.hash.slice(1), m = /^staff=(\d+)$/.exec(h);
    var want = !CAN ? 'me' : m ? 'staff' : TABS.some(function (t) { return t[0] === h; }) ? h : 'staff';
    if (want !== tab || !drawn) { tab = want; drawn = true; show(); }
    if (m && CAN) openFile(m[1]);
  }
  window.addEventListener('hashchange', route);
  api('/api/people/meta').then(function (m) { META = m; CAN = true; }, function () { CAN = false; }).then(route);
})();
</script>
