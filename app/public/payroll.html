<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payroll · Vision Auto Solutions</title>
<link rel="stylesheet" href="/assets/books.css">
<style>
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px}
  .grid label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px} .grid input,.grid select,.grid textarea{width:100%}
  .chk{display:flex;gap:6px;align-items:center;font-size:13px} .chk input{width:auto}
  fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:10px 12px} legend{font-size:12.5px;font-weight:700;padding:0 6px}
  .warnlist{margin:4px 0 0;padding-left:18px;font-size:12.5px;color:var(--warn)}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<header><h1>Payroll</h1><nav><a href="/attendance.html">Attendance</a><a href="/banking.html">Banking</a><a href="/accounting.html">Ledger</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="out"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script src="/assets/books-common.js?v=20261019"></script>
<script>
(function () {
  'use strict';
  var B = window.Books, $ = B.$, all = B.all, esc = B.esc, J = B.J, api = B.api, toast = B.toast, modal = B.modal, close = B.close;
  var me = {}, tab = '', items = [], FREQ = { weekly: 'Weekly', fortnightly: 'Fortnightly', monthly: 'Monthly' };
  var STATUS = { draft: '', approved: 'warn', paid: 'ok', void: 'bad' };
  var val = function (id) { var el = $('#' + id); return el ? (el.type === 'checkbox' ? el.checked : el.value) : undefined; };
  var num = function (v) { return Number(v || 0); };
  function fail(e) { toast(e.message || String(e)); }

  // ------------------------------------------------------------- start --
  function start() {
    api('/api/payroll/module').then(function (m) {
      me = m;
      if (!m.on) return off();
      var t = [];
      if (m.can_view) t = [['home', 'Overview'], ['emp', 'Employees'], ['runs', 'Pay runs'], ['work', 'Work & invoices'], ['returns', 'Returns & deductions'], ['rates', 'Rates & pay items'], ['set', 'Settings']];
      if (m.self_service) t.push(['mine', 'My payslips']);
      if (!t.length) { $('#out').innerHTML = '<div class="card empty">You are not on payroll, and your account cannot see payroll.</div>'; return; }
      $('#tabs').innerHTML = t.map(function (x) { return '<button data-t="' + x[0] + '">' + x[1] + '</button>'; }).join('');
      all('#tabs button').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); show(); }; });
      tab = (location.hash || '').slice(1) || t[0][0];
      if (!t.some(function (x) { return x[0] === tab; })) tab = t[0][0];
      if (m.can_view) B.loadAccounts().catch(function () {});
      show();
    }).catch(fail);
  }
  function mark() { all('#tabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tab); }); history.replaceState(null, '', '#' + tab); }
  function show() {
    mark();
    $('#out').innerHTML = '<div class="empty">Loading…</div>';
    ({ home: home, emp: employees, runs: runs, work: workTab, returns: returns, rates: rates, set: settings, mine: mine }[tab] || home)();
  }
  function off() {
    $('#tabs').innerHTML = '';
    $('#out').innerHTML = '<div class="card"><h2>Payroll is switched off</h2><p>Payroll is a separate module. While it is off, nothing in it runs or posts to the books, and the time clock, commission and accounting work as before.</p>' +
      '<p class="sub">Once it is on you choose which parts to use: pay from the time clock, commission through payroll, posting to the ledger, staff seeing their own payslips, and a second person to approve. Only the people you add are paid by it.</p>' +
      (me.can_run ? '<button class="primary" id="on">Switch payroll on</button>' : '<p class="sub">A manager with the payroll permission can switch it on.</p>') + '</div>';
    if ($('#on')) $('#on').onclick = function () { api('/api/payroll/module', 'POST', { on: true }).then(function () { toast('Payroll is on'); start(); }).catch(fail); };
  }

  // ------------------------------------------------------------ overview --
  function home() {
    api('/api/payroll/summary').then(function (d) {
      var s = d.settings, todo = [];
      if (!s.payroll_employer_trn) todo.push('Enter the company TRN and NIS employer number under Settings (they go on the S01 / S02 and payslips).');
      if (!d.employees.active) todo.push('Add your employees under Employees (you can bring in staff from the system in one go).');
      if (d.employees.missing_ids) todo.push(d.employees.missing_ids + ' active employee(s) have no TRN or NIS number.');
      $('#out').innerHTML = '<div class="tiles"><div class="tile"><span class="k">On payroll</span><b>' + d.employees.active + '</b></div>' +
        '<div class="tile' + (d.runs.draft ? ' click" data-go="runs' : '') + '"><span class="k">Draft runs</span><b>' + (d.runs.draft || 0) + '</b></div>' +
        '<div class="tile' + (d.net_unpaid.n ? ' bad' : '') + '"><span class="k">Approved, wages not paid</span><b>' + J(d.net_unpaid.v) + '</b></div>' +
        '<div class="tile' + (d.s01_owing.some(function (x) { return x.late; }) ? ' bad' : '') + '"><span class="k">Owing to TAJ</span><b>' + J(d.s01_owing.reduce(function (t, x) { return t + x.owing; }, 0)) + '</b></div></div>' +
        (todo.length ? '<div class="card"><h2>To set up</h2>' + todo.map(function (t) { return '<div class="note warn">' + esc(t) + '</div>'; }).join('') + '</div>' : '') +
        '<div class="card"><h2>Statutory payments (S01)</h2><p class="sub">PAYE, NIS, NHT, Education Tax and HEART deducted in a month are paid to TAJ by the 14th of the next month.</p>' +
        (d.s01_owing.length ? '<table><thead><tr><th>Month</th><th>Due</th><th class="n">Owing</th><th></th></tr></thead><tbody>' + d.s01_owing.map(function (x) { return '<tr><td>' + esc(x.month) + '</td><td>' + esc(x.due_date) + (x.late ? ' <span class="pill bad">late</span>' : '') + '</td><td class="n">' + J(x.owing) + '</td><td><button class="sm" data-m="' + esc(x.month) + '">Open</button></td></tr>'; }).join('') + '</tbody></table>' : '<div class="empty">Nothing owing.</div>') + '</div>' +
        (d.last ? '<div class="card"><h2>Last pay run</h2><p>' + esc(d.last.number) + ' · paid ' + esc(d.last.pay_date) + ' · <span class="pill ' + STATUS[d.last.status] + '">' + esc(d.last.status) + '</span> · ' + d.last.totals.people + ' people · gross ' + J(d.last.totals.gross) + ' · net ' + J(d.last.totals.net) + ' <button class="sm" id="lr">Open</button></p></div>' : '');
      all('[data-go]').forEach(function (t) { t.onclick = function () { tab = t.getAttribute('data-go'); show(); }; });
      all('[data-m]').forEach(function (b) { b.onclick = function () { returns.month = b.getAttribute('data-m'); tab = 'returns'; show(); }; });
      if ($('#lr')) $('#lr').onclick = function () { tab = 'runs'; mark(); runView(d.last.id); };
    }).catch(fail);
  }

  // ----------------------------------------------------------- employees --
  var WTYPE = { employee: 'Employee', day_worker: 'Day worker', contractor: 'Contractor' };
  function payText(e) {
    return { hourly: J(e.hourly_rate) + '/h', daily: J(e.day_rate) + '/day', piece: 'by the job', contract: 'by invoice' + (num(e.fee_per_period) ? ' + ' + J(e.fee_per_period) + ' fee' : '') }[e.pay_type] || J(e.salary_annual) + '/yr';
  }
  function employees() {
    api('/api/payroll/employees?all=1').then(function (d) {
      $('#out').innerHTML = '<div class="card"><h2>Employees</h2><p class="sub">Only the people listed here are paid by payroll. Link someone to their staff login to pay them from the time clock and commission, and to let them see their own payslips.</p>' +
        (me.can_run ? '<div class="controls"><button class="primary" id="add">Add an employee</button><button id="imp">Add staff from the system</button></div>' : '') +
        '<div class="scroll"><table><thead><tr><th>Name</th><th>Job</th><th>Pay</th><th>Paid</th><th>TRN</th><th>NIS</th><th>Linked login</th><th></th></tr></thead><tbody>' +
        (d.employees.length ? d.employees.map(function (e) {
          return '<tr class="' + (me.can_run ? 'click' : '') + '" data-e="' + e.id + '" style="' + (e.is_active ? '' : 'opacity:.55') + '"><td><b>' + esc(e.name) + '</b>' + (e.employee_no ? ' <small>#' + esc(e.employee_no) + '</small>' : '') + (e.worker_type !== 'employee' ? ' <span class="pill' + (e.worker_type === 'contractor' ? ' warn' : '') + '">' + WTYPE[e.worker_type] + '</span>' : '') + (e.business_name ? '<br><small>' + esc(e.business_name) + '</small>' : '') + '</td><td>' + esc(e.job_title || '') + '</td><td>' + payText(e) + '<br><small>' + FREQ[e.frequency] + (e.pay_type === 'hourly' && e.use_timeclock && e.user_id ? ', time clock' : '') + '</small></td>' +
            '<td>' + esc(e.pay_method) + (e.pay_method === 'bank' ? '<br><small>' + esc(e.bank_masked || 'no account') + '</small>' : '') + '</td><td>' + (e.trn ? esc(e.trn) : '<span class="pill warn">missing</span>') + '</td><td>' + (e.nis_no ? esc(e.nis_no) : '<span class="pill warn">missing</span>') + '</td><td>' + esc(e.user_name || '') + '</td>' +
            '<td>' + (e.is_active ? '' : '<span class="pill">not active</span>') + (e.termination_date ? ' <span class="pill bad">left ' + esc(e.termination_date) + '</span>' : '') + '</td></tr>';
        }).join('') : '<tr><td colspan="8" class="empty">Nobody yet.</td></tr>') + '</tbody></table></div></div>';
      if ($('#add')) $('#add').onclick = function () { empForm(null); };
      if ($('#imp')) $('#imp').onclick = importStaff;
      if (me.can_run) all('[data-e]').forEach(function (r) { r.onclick = function () { empForm(+r.getAttribute('data-e')); }; });
    }).catch(fail);
  }
  function importStaff() {
    api('/api/payroll/staff-not-on-payroll').then(function (d) {
      modal('<h2>Add staff from the system</h2><p class="sub">Staff with an hourly rate on the time clock come in as hourly, fortnightly and active. Everyone else comes in as salaried, monthly and not active, until you enter their salary.</p>' +
        (d.staff.length ? '<table><tbody>' + d.staff.map(function (s) { return '<tr><td><input type="checkbox" data-u="' + s.id + '" checked></td><td>' + esc(s.name) + '</td><td>' + esc(s.email || '') + '</td><td class="n">' + (s.hourly_rate ? J(s.hourly_rate) + '/h' : '') + '</td></tr>'; }).join('') + '</tbody></table>' : '<div class="empty">Every staff member is already on payroll.</div>') +
        '<div class="controls" style="margin-top:10px">' + (d.staff.length ? '<button class="primary" id="go">Add the ticked people</button>' : '') + '<button id="x">Close</button></div>');
      $('#x').onclick = close;
      if ($('#go')) $('#go').onclick = function () {
        var ids = all('[data-u]').filter(function (c) { return c.checked; }).map(function (c) { return +c.getAttribute('data-u'); });
        api('/api/payroll/employees/import-staff', 'POST', { user_ids: ids }).then(function (r) { close(); toast(r.added + ' added. ' + r.note); employees(); }).catch(fail);
      };
    }).catch(fail);
  }
  function field(id, label, value, type, extra) { return '<div><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(value == null ? '' : value) + '"' + (extra || '') + '></div>'; }
  function check(id, label, on) { return '<label class="chk"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '> ' + label + '</label>'; }
  function sel(id, label, opts, value) { return '<div><label for="' + id + '">' + label + '</label><select id="' + id + '">' + opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(value == null ? '' : value) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select></div>'; }
  function empForm(id) {
    Promise.all([id ? api('/api/payroll/employees/' + id) : Promise.resolve({ employee: { worker_type: 'employee', pay_type: 'salary', frequency: 'monthly', pay_method: 'bank', ot_rate: 1.5, hours_per_day: 8, use_timeclock: true, is_active: true, pension_ee_pct: 0, pension_er_pct: 0, extra_threshold: 0 }, items: [], slips: [], work: [], contracts: [], loans: [] }),
      api('/api/payroll/staff-not-on-payroll'), loadItems(), B.loadAccounts()]).then(function (r) {
      var d = r[0], e = d.employee, staff = r[1].staff, ctr = e.worker_type === 'contractor';
      var users = [['', '(not linked)']].concat(e.user_id ? [[e.user_id, e.user_name || 'Linked']] : []).concat(staff.map(function (s) { return [s.id, s.name]; }));
      var openContracts = (d.contracts || []).filter(function (c) { return c.status === 'open'; });
      $('#out').innerHTML = '<div class="controls"><button id="bk">◀ Employees</button></div><div class="card"><h2>' + (id ? esc(e.name) + ' <span class="pill">' + WTYPE[e.worker_type] + '</span>' : 'New employee or contractor') + '</h2>' +
        '<fieldset><legend>Person</legend><div class="grid">' + sel('worker_type', 'Works as', [['employee', 'Employee'], ['day_worker', 'Day worker (casual, paid by the day)'], ['contractor', 'Contractor (self-employed)']], e.worker_type) +
          field('name', 'Name', e.name) + field('employee_no', 'Employee / supplier no.', e.employee_no) + sel('user_id', 'Staff login (time clock, commission, own payslips)', users, e.user_id) +
          field('job_title', 'Job title / trade', e.job_title) + field('department', 'Department', e.department) + field('email', 'Email (payslips)', e.email) + field('phone', 'Phone', e.phone) + field('address', 'Address', e.address) +
          field('date_of_birth', 'Date of birth', e.date_of_birth, 'date') + field('hire_date', 'Started', e.hire_date, 'date') + field('termination_date', 'Left on', e.termination_date, 'date') + field('termination_reason', 'Reason for leaving', e.termination_reason) + '</div></fieldset>' +
        '<fieldset id="ctrbox"' + (ctr ? '' : ' hidden') + '><legend>Contractor</legend><p class="sub">A contractor is self-employed: no PAYE, NIS, NHT, Education Tax or HEART is deducted. The business deducts the contractor levy (2%) on construction, haulage and tillage work, and withholding tax (3%) on specified services if it is a withholding agent (Settings).</p><div class="grid">' +
          field('business_name', 'Business name', e.business_name) + field('tcc_no', 'Tax compliance certificate no.', e.tcc_no) + field('tcc_expiry', 'TCC expires', e.tcc_expiry, 'date') +
          field('fee_per_period', 'Fixed fee each pay (retainer, optional)', e.fee_per_period, 'number', ' step="0.01"') +
          '<div>' + check('levy_applies', 'Construction, haulage or tillage work (contractor levy)', e.levy_applies) + check('wht_applies', 'A specified service (withholding tax)', e.wht_applies) + '</div></div></fieldset>' +
        '<fieldset><legend>Pay</legend><div class="grid">' + sel('pay_type', 'Paid', [['salary', 'Salary'], ['hourly', 'By the hour'], ['daily', 'By the day'], ['piece', 'By the job / piece (work entered)'], ['contract', 'By invoice / contract']], e.pay_type) +
          sel('frequency', 'How often', [['weekly', 'Weekly'], ['fortnightly', 'Fortnightly'], ['monthly', 'Monthly']], e.frequency) +
          field('salary_annual', 'Salary a year (J$)', e.salary_annual, 'number', ' step="0.01"') + field('hourly_rate', 'Hourly rate (J$)', e.hourly_rate, 'number', ' step="0.01"') + field('day_rate', 'Day rate (J$)', e.day_rate, 'number', ' step="0.01"') + field('ot_rate', 'Overtime rate (x)', e.ot_rate, 'number', ' step="0.05"') +
          field('hours_per_period', 'Usual hours a pay (not on the clock)', e.hours_per_period, 'number', ' step="0.25"') + field('hours_per_day', 'Hours in a day (leave, holidays)', e.hours_per_day, 'number', ' step="0.25"') +
          '<div>' + check('use_timeclock', 'Hours / days from the time clock', e.use_timeclock) + check('is_active', 'Active (paid by payroll)', e.is_active) + '</div></div></fieldset>' +
        '<fieldset id="statbox"' + (ctr ? ' hidden' : '') + '><legend>Tax and statutory</legend><div class="grid">' + field('nis_no', 'NIS number', e.nis_no) + field('extra_threshold', 'Extra tax-free amount a year (e.g. pensioner)', e.extra_threshold, 'number', ' step="0.01"') +
          '<div>' + check('paye_exempt', 'No income tax (PAYE)', e.paye_exempt) + check('nis_exempt', 'No NIS', e.nis_exempt) + check('nht_exempt', 'No NHT', e.nht_exempt) + check('ed_exempt', 'No Education Tax', e.ed_exempt) + '</div></div></fieldset>' +
        '<fieldset><legend>TRN</legend><div class="grid">' + field('trn', 'TRN', e.trn) + '</div></fieldset>' +
        '<fieldset id="penbox"' + (ctr ? ' hidden' : '') + '><legend>Approved pension</legend><div class="grid">' + field('pension_scheme', 'Scheme', e.pension_scheme) + field('pension_ee_pct', 'Employee % of pay', e.pension_ee_pct, 'number', ' step="0.1"') + field('pension_er_pct', 'Employer % of pay', e.pension_er_pct, 'number', ' step="0.1"') + '</div></fieldset>' +
        '<fieldset><legend>Payment</legend><div class="grid">' + sel('pay_method', 'Paid by', [['bank', 'Bank transfer'], ['cheque', 'Cheque'], ['cash', 'Cash']], e.pay_method) + field('bank_name', 'Bank', e.bank_name) + field('bank_branch', 'Branch / transit', e.bank_branch) + field('bank_account', 'Account number', e.bank_account) + sel('bank_account_type', 'Account type', [['', ''], ['savings', 'Savings'], ['chequing', 'Chequing']], e.bank_account_type) + '</div></fieldset>' +
        '<fieldset id="leavebox"' + (ctr ? ' hidden' : '') + '><legend>Leave a year (blank: the shop setting)</legend><div class="grid">' + field('vacation_days', 'Vacation days', e.vacation_days, 'number') + field('sick_days', 'Sick days', e.sick_days, 'number') + '</div></fieldset>' +
        '<div><label for="notes">Notes</label><textarea id="notes" rows="2" style="width:100%">' + esc(e.notes || '') + '</textarea></div>' +
        '<div class="controls" style="margin-top:8px"><button class="primary" id="sv">Save</button>' + (id && e.termination_date && !ctr ? '<button id="p45">Print P45</button>' : '') + '</div></div>' +
        (id ? workCard(d, openContracts) + contractCard(d) + loanCard(d) +
          '<div class="card"><h2>Every pay: earnings, deductions and employer contributions</h2><p class="sub">Deductions: medical, life insurance, pension, union, credit union, child maintenance, NHT mortgage, student loan, staff purchases and agreed salary deductions. Employer contributions: health, life and dental insurance and extra pension the business pays for the person (not cash: they appear on the payslip and, if ticked as taxable under Rates &amp; pay items, are taxed as a benefit). Any item can be a fixed amount or a percentage of pay. Say who each is paid to: they are listed under Returns &gt; Deductions to pay over. Loans and advances are set up below the work, and stop by themselves when repaid.</p><table><thead><tr><th>Item</th><th class="n">Each pay</th><th class="n">Still owed</th><th>Paid to / reference</th><th>Until</th><th></th></tr></thead><tbody>' +
          (d.items.length ? d.items.map(function (x) { return '<tr style="' + (x.is_active ? '' : 'opacity:.5') + '"><td>' + esc(x.label) + ' <small>(' + x.kind + ')</small>' + (x.note ? '<br><small>' + esc(x.note) + '</small>' : '') + '</td><td class="n">' + (num(x.pct) ? num(x.pct) + '% of pay' : J(x.amount)) + '</td><td class="n">' + (x.balance == null ? '' : J(x.balance)) + '</td><td>' + esc(x.payee || '') + (x.reference ? ' · ' + esc(x.reference) : '') + '</td><td>' + esc(x.end_date ? String(x.end_date).slice(0, 10) : '') + '</td><td>' + (x.is_active ? '<button class="sm" data-stop="' + x.id + '">Stop</button>' : '<button class="sm" data-go="' + x.id + '">Restart</button>') + '</td></tr>'; }).join('') : '<tr><td colspan="6" class="empty">None.</td></tr>') +
          '</tbody></table><div class="controls" style="margin-top:8px"><div><label>Add</label><select id="ic">' + items.filter(function (i) { return i.is_active && !i.is_system && i.code !== 'loan' && i.code !== 'advance'; }).map(function (i) { return '<option value="' + esc(i.code) + '">' + esc(i.label) + ' (' + (i.kind === 'employer' ? 'paid by the business' : i.kind) + ')</option>'; }).join('') + '</select></div>' +
          '<div><label>Amount each pay</label><input id="ia" type="number" step="0.01" style="width:120px"></div><div><label>or % of pay</label><input id="ipct" type="number" step="0.01" style="width:80px"></div><div><label>Total owed (stops when paid)</label><input id="ib" type="number" step="0.01" style="width:120px"></div><div><label>Paid to</label><input id="ip" placeholder="e.g. Resident Magistrate\'s Court"></div><div><label>Reference</label><input id="ir" style="width:120px"></div><div><label>Until</label><input id="ie" type="date"></div><div><label>Note</label><input id="in"></div><button id="iadd">Add</button></div></div>' +
          (ctr ? '' : '<div class="card"><h2>This year</h2>' + leaveHtml(d.leave) + ytdHtml(d.ytd) + '</div>') +
          '<div class="card"><h2>Payslips</h2><table><tbody>' + (d.slips.length ? d.slips.map(function (s) { return '<tr><td>' + esc(s.pay_date) + '</td><td>' + esc(s.number) + ' <span class="pill ' + STATUS[s.status] + '">' + s.status + '</span></td><td class="n">gross ' + J(s.gross) + '</td><td class="n">net ' + J(s.net) + '</td><td><button class="sm" data-ps="' + s.id + '">Payslip</button></td></tr>'; }).join('') : '<tr><td class="empty">None yet.</td></tr>') + '</tbody></table></div>' : '');
      $('#bk').onclick = employees;
      $('#worker_type').onchange = function () { var c = this.value === 'contractor'; ['ctrbox'].forEach(function (b) { $('#' + b).hidden = !c; }); ['statbox', 'penbox', 'leavebox'].forEach(function (b) { $('#' + b).hidden = c; });
        if (c && $('#pay_type').value === 'salary') $('#pay_type').value = 'contract'; if (this.value === 'day_worker') $('#pay_type').value = 'daily'; };
      $('#sv').onclick = function () {
        var b = {};
        ['worker_type', 'name', 'employee_no', 'user_id', 'job_title', 'department', 'email', 'phone', 'address', 'date_of_birth', 'hire_date', 'termination_date', 'termination_reason', 'pay_type', 'frequency', 'salary_annual', 'hourly_rate', 'day_rate', 'ot_rate', 'hours_per_period', 'hours_per_day',
          'use_timeclock', 'is_active', 'trn', 'nis_no', 'extra_threshold', 'paye_exempt', 'nis_exempt', 'nht_exempt', 'ed_exempt', 'pension_scheme', 'pension_ee_pct', 'pension_er_pct', 'pay_method', 'bank_name', 'bank_branch', 'bank_account', 'bank_account_type', 'vacation_days', 'sick_days', 'notes',
          'business_name', 'tcc_no', 'tcc_expiry', 'fee_per_period', 'levy_applies', 'wht_applies'].forEach(function (k) { b[k] = val(k); });

          return '<tr data-it="' + esc(i.code) + '"><td><input data-k="label" value="' + esc(i.label) + '"' + (me.can_run ? '' : ' disabled') + '></td><td>' + (i.kind === 'employer' ? 'paid by the business' : i.kind) + (i.is_system ? ' <small>(worked out)</small>' : '') + '</td><td>' + ck('paye') + '</td><td>' + ck('nis') + '</td><td>' + ck('nht') + '</td><td>' + ck('ed') + '</td><td>' + ck('heart') + '</td><td>' + (i.kind === 'deduction' ? '<input type="checkbox" data-k="pension_relief"' + (i.pension_relief ? ' checked' : '') + (me.can_run ? '' : ' disabled') + '>' : '') + '</td>' +
            '<td><select data-k="gl_account_id"' + (me.can_run ? '' : ' disabled') + '><option value="">(default)</option>' + B.accounts().map(function (a) { return '<option value="' + a.id + '"' + (String(a.id) === String(i.gl_account_id) ? ' selected' : '') + '>' + esc(a.code + ' ' + a.name) + '</option>'; }).join('') + '</select></td>' +
            '<td><input type="checkbox" data-k="is_active"' + (i.is_active ? ' checked' : '') + (i.is_system || !me.can_run ? ' disabled' : '') + '></td><td>' + (me.can_run ? '<button class="sm" data-save="' + esc(i.code) + '">Save</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>' +
        (me.can_run ? '<div class="controls" style="margin-top:8px"><div><label>New item</label><input id="nl" placeholder="e.g. Uniform allowance"></div><div><label>Type</label><select id="nk"><option value="earning">Earning</option><option value="deduction">Deduction</option><option value="employer">Employer contribution</option></select></div><button id="nadd">Add</button></div>' : '') + '</div>';
      if ($('#rsv')) $('#rsv').onclick = function () { var b = { effective_from: val('ef'), note: val('rnote') }; RATE_FIELDS.forEach(function (f) { b[f[0]] = val('r_' + f[0]); }); api('/api/payroll/rates', 'POST', b).then(function () { toast('Rates saved'); rates(); }).catch(fail); };
      all('[data-save]').forEach(function (b) { b.onclick = function () {
        var tr = b.closest('tr'), body = {};
        all('[data-k]', tr).forEach(function (el) { var k = el.getAttribute('data-k'); body[k] = el.type === 'checkbox' ? el.checked : el.value; });
        api('/api/payroll/items/' + encodeURIComponent(tr.getAttribute('data-it')), 'PUT', body).then(function () { toast('Saved'); }).catch(fail);
      }; });
      if ($('#nadd')) $('#nadd').onclick = function () { api('/api/payroll/items', 'POST', { label: val('nl'), kind: val('nk') }).then(function () { rates(); }).catch(fail); };
    }).catch(fail);
  }

  // ------------------------------------------------------------ settings --
  function settings() {
    api('/api/payroll/settings').then(function (d) {
      var s = d.settings, t = function (k, label, help) { return '<label class="chk" style="margin:6px 0"><input type="checkbox" id="' + k + '"' + (s[k] === 'on' ? ' checked' : '') + (me.can_run ? '' : ' disabled') + '> <span><b>' + label + '</b><br><small class="sub">' + help + '</small></span></label>'; };
      $('#out').innerHTML = '<div class="card"><h2>Which parts of payroll to use</h2>' +
        t('payroll_use_timeclock', 'Pay hourly staff from the time clock', 'Hours come from approved weeks on the time clock (unapproved weeks are flagged). Off: hourly staff are paid their usual hours, changed by hand.') +
        t('payroll_include_commission', 'Pay commission through payroll', 'Approved commission statements go on the next payslip, taxed with the wages, and are marked paid. Off: commission is paid from the Commission screen as before.') +
        t('payroll_post_ledger', 'Post to the ledger', 'Approved runs, wage payments and TAJ payments post to the general ledger (once it is started). Off: keep the books elsewhere and use payroll for payslips and returns.') +
        t('payroll_self_service', 'Staff see their own payslips', 'Staff linked to a login see their approved payslips, year-to-date and leave here.') +
        t('payroll_two_person', 'Two people for every run', 'The person who prepared a run, or whose own pay is on it, cannot approve it.') +
        t('payroll_heart', 'The business pays HEART/NSTA', 'The 3% employer contribution (switch off only if the business is exempt).') +
        t('payroll_wht_agent', 'The business is a withholding agent', 'Deduct withholding tax (3%) from contractors giving specified services (consultancy, IT, repairs, security, cleaning, transport and the others TAJ lists). Only businesses TAJ has named as agents do this.') +
        '<h2 style="margin-top:12px">Company</h2><div class="grid">' + field('payroll_employer_trn', 'Company TRN', s.payroll_employer_trn) + field('payroll_employer_nis', 'NIS employer number', s.payroll_employer_nis) +
          field('payroll_vacation_days', 'Vacation days a year (usual)', s.payroll_vacation_days, 'number') + field('payroll_sick_days', 'Sick days a year (usual)', s.payroll_sick_days, 'number') + '</div>' +
        (me.can_run ? '<div class="controls" style="margin-top:10px"><button class="primary" id="sv">Save</button><span style="margin-left:auto"></span><button id="offb">Switch payroll off</button></div>' : '') + '</div>';
      if (!$('#sv')) return;
      $('#sv').onclick = function () {
        var b = {};
        ['payroll_use_timeclock', 'payroll_include_commission', 'payroll_post_ledger', 'payroll_self_service', 'payroll_two_person', 'payroll_heart', 'payroll_wht_agent'].forEach(function (k) { b[k] = val(k) ? 'on' : 'off'; });
        ['payroll_employer_trn', 'payroll_employer_nis', 'payroll_vacation_days', 'payroll_sick_days'].forEach(function (k) { b[k] = val(k); });
        api('/api/payroll/settings', 'PUT', b).then(function () { toast('Saved'); }).catch(fail);
      };
      $('#offb').onclick = function () { confirmBox('Switch payroll off? Nothing is deleted: employees, runs and payslips stay, and it can be switched on again. Staff stop seeing payslips while it is off.', function () { api('/api/payroll/module', 'POST', { on: false }).then(start).catch(fail); }); };
    }).catch(fail);
  }

  // ---------------------------------------------------------- my payslips --
  function mine() {
    api('/api/payroll/me').then(function (d) {
      if (!d.employee) { $('#out').innerHTML = '<div class="card empty">You are not on payroll.</div>'; return; }
      $('#out').innerHTML = '<div class="card"><h2>' + esc(d.employee.name) + ' · this year</h2>' + leaveHtml(d.leave) + ytdHtml(d.ytd) + '</div>' +
        '<div class="card"><h2>My payslips</h2><table><tbody>' + (d.slips.length ? d.slips.map(function (s) { return '<tr><td>' + esc(s.pay_date) + '</td><td>' + esc(s.period_start) + ' – ' + esc(s.period_end) + '</td><td class="n">gross ' + J(s.gross) + '</td><td class="n"><b>net ' + J(s.net) + '</b></td><td><button class="sm" data-ps="' + s.id + '">View / print</button></td></tr>'; }).join('') : '<tr><td class="empty">No payslips yet.</td></tr>') + '</tbody></table></div>';
      all('[data-ps]').forEach(function (b) { b.onclick = function () { printSlips([+b.getAttribute('data-ps')]); }; });
    }).catch(fail);
  }

  start();
})();
</script>
