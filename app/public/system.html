<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System management · Morty's Auto Parts</title>
<link rel="stylesheet" href="/assets/books.css">
<style>
  header{background:#111827}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px}
  .grid label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px} .grid input,.grid select,.grid textarea{width:100%}
  .check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
  .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:0 0 12px}
  .dot.pass{background:var(--ok)} .dot.warn{background:#f59e0b} .dot.fail{background:var(--red)}
  .score{font-size:46px;font-weight:800;line-height:1}
  .note{white-space:pre-wrap}
  .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
  details summary{cursor:pointer}
  .rhsteps{padding-left:22px} .rhsteps li{margin:8px 0;line-height:1.5}
  /* network map */
  #nmSvg{width:100%;height:auto;display:block;background:radial-gradient(circle at 50% 52%,rgba(37,99,235,.07),transparent 60%);border-radius:12px}
  .nml{fill:none;stroke-width:2.2} .nml.up{stroke:#16a34a;opacity:.55} .nml.down{stroke:#dc2626;stroke-dasharray:7 6} .nml.unknown{stroke:#f59e0b;opacity:.7} .nml.idle{stroke:#94a3b8;stroke-dasharray:3 6;opacity:.7}
  .nmp{fill:#16a34a}
  .nmn{cursor:pointer;outline:none} .nmn .nmc{stroke-width:3;fill:var(--card)} .nmn.up .nmc{stroke:#16a34a} .nmn.down .nmc{stroke:#dc2626;fill:#fee2e2} .nmn.unknown .nmc{stroke:#f59e0b;fill:#fef3c7} .nmn.idle .nmc{stroke:#94a3b8;stroke-dasharray:4 3}
  .nmn:hover .nmc,.nmn:focus .nmc{stroke-width:5} .nmn.sel .nmc{stroke-width:6;filter:drop-shadow(0 0 6px rgba(37,99,235,.6))}
  .nmpulse{fill:none;stroke:#dc2626;stroke-width:3}
  .nmi{text-anchor:middle;pointer-events:none} .nmt{text-anchor:middle;font-size:12.5px;font-weight:600;fill:var(--ink)} .nms{text-anchor:middle;font-size:11px;fill:var(--muted);font-family:ui-monospace,Consolas,monospace}
  .nmt,.nms{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
  .nmwrap{overflow-x:auto} @media (max-width:760px){ #nmSvg{min-width:720px} }
  .nmfoot{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-top:6px} .nmd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .nmd.up{background:#16a34a} .nmd.down{background:#dc2626} .nmd.unknown{background:#f59e0b} .nmd.idle{background:#94a3b8}
  @media (prefers-color-scheme: dark){ .nmn.down .nmc{fill:#450a0a} .nmn.unknown .nmc{fill:#422006} }
</style>
<link rel="icon" href="/favicon.svg?v=vision2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=vision2" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico?v=vision2" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=vision2">
<script src="/assets/vas-ui.js?v=20261110b" data-chrome="page"></script>
</head>
<body>
<header><h1>🛡 System management</h1><nav><a href="/security.html">Sign-in security</a><a href="/terminal.html">Terminals</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="out"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script src="/assets/books-common.js?v=20261103"></script>
<script src="/assets/doc-attach.js"></script>
<script src="/assets/shared-resources-ui.js?v=20261106"></script>
<script src="/assets/device-access-ui.js?v=20261106"></script>
<script src="/assets/remote-help.js?v=20261105"></script>
<script src="/assets/sys-net.js?v=20261113c"></script>
<script>
(function () {
  'use strict';
  var B = window.Books, $ = B.$, all = B.all, esc = B.esc, J = B.J, api = B.api, toast = B.toast, modal = B.modal, close = B.close, dt = B.dt;
  var me = {}, tab = '', staff = [];
  var val = function (id) { var el = $('#' + id); return el ? (el.type === 'checkbox' ? el.checked : el.value) : undefined; };
  var PILL = { pass: 'ok', warn: 'warn', fail: 'bad', low: '', normal: '', medium: 'warn', high: 'bad', urgent: 'bad', critical: 'bad', new: 'warn', assigned: '', in_progress: '', waiting: '', resolved: 'ok', closed: 'ok', open: 'warn', investigating: 'warn', contained: '', planned: '', approved: 'warn', done: 'ok', rolled_back: 'bad', cancelled: '', in_use: 'ok', spare: '', repair: 'warn', retired: '', lost: 'bad', keep: 'ok', change: 'warn', disable: 'bad' };
  var pill = function (v) { return '<span class="pill ' + (PILL[v] || '') + '">' + esc(String(v || '').replace(/_/g, ' ')) + '</span>'; };
  function fail(e) { toast(e.message || String(e)); }
  function field(id, label, value, type, extra) { return '<div><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(value == null ? '' : value) + '"' + (extra || '') + '></div>'; }
  function sel(id, label, opts, value) { return '<div><label for="' + id + '">' + label + '</label><select id="' + id + '">' + opts.map(function (o) { o = Array.isArray(o) ? o : [o, o.replace(/_/g, ' ')]; return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(value == null ? '' : value) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select></div>'; }
  function area(id, label, value, rows) { return '<div style="grid-column:1/-1"><label for="' + id + '">' + label + '</label><textarea id="' + id + '" rows="' + (rows || 3) + '">' + esc(value || '') + '</textarea></div>'; }
  // Both are the program's shared windows (assets/vas-ui.js).
  function confirmBox(text, yes) { vasConfirm(text, { ok: 'Yes' }).then(function (ok) { if (ok) { close(); yes(); } }); }
  function reasonBox(title, text, done) {
    vasPrompt(text, '', { title: title, ok: 'Go ahead', placeholder: 'Reason' }).then(function (w) {
      if (w == null) return;
      w = w.trim(); if (!w) { toast('Give a reason'); return reasonBox(title, text, done); }
      close(); done(w);
    });
  }
  var staffOpts = function (sel1) { return '<option value="">—</option>' + staff.map(function (s) { return '<option value="' + s.id + '"' + (String(s.id) === String(sel1) ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join(''); };
  var nameOf = function (id) { var s = staff.find(function (x) { return x.id === id; }); return s ? s.name : ''; };

  function start() {
    api('/api/sys/me').then(function (m) {
      me = m;
      var t = [];
      if (m.audit || m.security || m.support) t.push(['home', 'Overview']);
      if (m.raise || m.support) t.push(['help', m.support ? 'Help desk' : 'IT help'], ['remote', 'Remote help']);
      if (m.support) t.push(['shared', 'Shared resources']);
      if (m.support) t.push(['assets', 'Equipment'], ['changes', 'Change log'], ['health', 'System health']);
      if (m.security) t.push(['devices', 'Device access'], ['threats', 'Threats'], ['security', 'Security'], ['incidents', 'Incidents'], ['risks', 'Risks']);
      if (m.network) t.push(['network', 'Network']);
      if (m.support || m.network || m.security) t.push(['terminals', 'Terminals']);
      if (m.security || m.audit) t.push(['website', 'Website']);
      if (m.audit) t.push(['audit', 'Audit trail'], ['exceptions', 'Audit exceptions'], ['access', 'Access reviews']);
      if (!t.length) { $('#out').innerHTML = '<div class="card empty">Your account has no system-management or IT-help access.</div>'; return; }
      $('#tabs').innerHTML = t.map(function (x) { return '<button data-t="' + x[0] + '">' + x[1] + '</button>'; }).join('');
      all('#tabs button').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); show(); }; });
      tab = (location.hash || '').slice(1); if (!t.some(function (x) { return x[0] === tab; })) tab = t[0][0];
      (m.security ? api('/api/sys/staff').then(function (d) { staff = d.staff.filter(function (s) { return !s.disabled; }); }).catch(function () {}) : Promise.resolve()).then(show);
    }).catch(fail);
  }
  function mark() { all('#tabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tab); }); history.replaceState(null, '', '#' + tab); }
  function show() {
    mark(); if (window.SharedRes) SharedRes.stop(); if (window.RemoteHelp) RemoteHelp.stop(); if (window.SysNet) SysNet.stop(); $('#out').innerHTML = '<div class="empty">Loading…</div>';
    ({ home: home, help: help, assets: assets, changes: changes, health: health, security: security, incidents: incidents, audit: auditTrail, exceptions: exceptionsTab, access: access, threats: threats, risks: risks, network: network, devices: function () { DeviceAccess.show($('#out')); }, remote: function () { RemoteHelp.show($('#out'), { ticketId: show.ticketId }); show.ticketId = undefined; }, shared: function () { SharedRes.show($('#out'), { hash: 'shared' }); }, terminals: function () { SysNet.terminals($('#out')); }, website: function () { SysNet.website($('#out')); } }[tab] || home)();
  }

  // ------------------------------------------------------------ overview --
  function home() {
    api('/api/sys/overview').then(function (d) {
      var tiles = [];
      if (d.security && d.threats) tiles.push('<div class="tile click' + (d.threats.serious ? ' bad' : '') + '" data-go="threats"><span class="k">New threats (serious)</span><b>' + d.threats.new + ' (' + d.threats.serious + ')</b></div>', '<div class="tile click" data-go="threats"><span class="k">Addresses blocked</span><b>' + d.blocked + '</b></div>');
      if (d.security) tiles.push('<div class="tile click' + (d.score < 70 ? ' bad' : '') + '" data-go="security"><span class="k">Security score</span><b>' + d.score + '%</b></div>',
        '<div class="tile click' + (d.incidents_open ? ' bad' : '') + '" data-go="incidents"><span class="k">Open incidents</span><b>' + d.incidents_open + '</b></div>',
        '<div class="tile click" data-go="security"><span class="k">Signed in now</span><b>' + d.online + '</b></div>');
      if (d.support) tiles.push('<div class="tile click' + (d.tickets.overdue ? ' bad' : '') + '" data-go="help"><span class="k">Open tickets (overdue)</span><b>' + d.tickets.open + ' (' + d.tickets.overdue + ')</b></div>',
        '<div class="tile click" data-go="help"><span class="k">Waiting for a technician</span><b>' + d.tickets.unassigned + '</b></div>',
        '<div class="tile"><span class="k">Average fix time (30 d)</span><b>' + (d.tickets.avg_fix_h == null ? '—' : d.tickets.avg_fix_h + ' h') + '</b></div>',
        '<div class="tile click' + (d.warranty_soon ? ' bad' : '') + '" data-go="assets"><span class="k">Warranties ending in 60 d</span><b>' + d.warranty_soon + '</b></div>');
      if (d.remote && (d.remote.waiting || d.remote.connected)) tiles.push('<div class="tile click' + (d.remote.waiting ? ' bad' : '') + '" data-go="remote"><span class="k">Remote help waiting (connected)</span><b>' + d.remote.waiting + ' (' + d.remote.connected + ')</b></div>');
      if (d.sharing && (d.sharing.failed || d.sharing.offline)) tiles.push('<div class="tile click bad" data-go="shared"><span class="k">Shared resources: failed jobs (24 h) / PCs offline</span><b>' + d.sharing.failed + ' / ' + d.sharing.offline + '</b></div>');
      if (d.audit) tiles.push('<div class="tile click' + (d.chain_ok ? '' : ' bad') + '" data-go="audit"><span class="k">Audit log</span><b>' + (d.chain_ok ? 'Intact' : 'TAMPERED') + '</b></div>',
        '<div class="tile click" data-go="exceptions"><span class="k">Last audit review</span><b>' + esc(d.last_audit_review || 'never') + '</b></div>',
        '<div class="tile click" data-go="access"><span class="k">Last access review</span><b>' + esc(d.last_access_review || 'never') + '</b></div>');
      $('#out').innerHTML = '<div class="tiles">' + tiles.join('') + '</div>' +
        (d.security && d.failing.length ? '<div class="card"><h2>Security problems to fix</h2>' + d.failing.map(function (f) { return '<div class="note bad">' + esc(f) + '</div>'; }).join('') + '</div>' : '') +
        (d.audit ? '<div class="card"><h2>Audit exceptions, last 7 days</h2>' + (d.exceptions_7d.length ? '<table><tbody>' + d.exceptions_7d.map(function (x) { return '<tr><td>' + esc(x.label) + '</td><td>' + pill(x.severity) + '</td><td class="n"><b>' + x.count + '</b></td></tr>'; }).join('') + '</tbody></table>' : '<div class="empty">None.</div>') + '</div>' : '');
      all('[data-go]').forEach(function (t) { t.onclick = function () { tab = t.getAttribute('data-go'); show(); }; });
    }).catch(fail);
  }

  // ------------------------------------------------------------- help desk --
  var CATS = ['hardware', 'software', 'till', 'printer', 'network', 'account', 'website', 'email', 'other'];
  function help() {
    var st = help.status || 'open';
    Promise.all([api('/api/sys/tickets?status=' + st + (help.mine ? '&mine=1' : '')), api('/api/sys/assets').catch(function () { return { assets: [] }; })]).then(function (r) {
      var d = r[0], assetsList = r[1].assets;
      help.assets = assetsList;
      $('#out').innerHTML = '<div class="card"><h2>Ask IT for help</h2><p class="sub">Say what is wrong, where, and what you were doing. Urgent means a till or the whole shop cannot work.</p><div class="grid">' +
          field('tt', 'What is the problem? (short)', '') + sel('tc', 'Kind', CATS, 'other') + sel('tp', 'How urgent', [['low', 'Low — when there is time'], ['normal', 'Normal'], ['high', 'High — slowing work down'], ['urgent', 'Urgent — cannot work']], 'normal') +
          '<div><label for="ta">Which device (if known)</label><select id="ta"><option value="">—</option>' + assetsList.filter(function (a) { return a.status !== 'retired'; }).map(function (a) { return '<option value="' + a.id + '">' + esc(a.tag + ' ' + a.name) + '</option>'; }).join('') + '</select></div>' +
          field('tl', 'Where', '') + area('td', 'Details', '', 3) + '</div><div class="controls" style="margin-top:8px"><button class="primary" id="traise">Send to IT</button></div></div>' +
        '<div class="card"><h2>' + (d.support && !help.mine ? 'All tickets' : 'My tickets') + '</h2><div class="controls">' + sel('tst', 'Show', [['open', 'Open'], ['done', 'Fixed / closed'], ['all', 'All']], st) + (d.support ? '<label class="chk"><input type="checkbox" id="tmine"' + (help.mine ? ' checked' : '') + '> Only mine</label>' : '') + '</div>' +
        '<div class="scroll"><table><thead><tr><th>Ticket</th><th>Problem</th><th>Kind</th><th>Priority</th><th>Status</th><th>Raised by</th><th>Technician</th><th>Due</th></tr></thead><tbody>' +
        (d.tickets.length ? d.tickets.map(function (t) { return '<tr class="click" data-tk="' + t.id + '"><td><b>' + esc(t.number) + '</b></td><td>' + esc(t.title) + (t.asset_tag ? ' <small>' + esc(t.asset_tag) + '</small>' : '') + '</td><td>' + esc(t.category) + '</td><td>' + pill(t.priority) + '</td><td>' + pill(t.status) + '</td><td>' + esc(t.requester_name || '') + '</td><td>' + esc(t.assignee_name || '') + '</td><td>' + (t.overdue ? '<span class="pill bad">overdue</span> ' : '') + '<small>' + dt(t.due_at) + '</small></td></tr>'; }).join('') : '<tr><td colspan="8" class="empty">No tickets.</td></tr>') + '</tbody></table></div></div>';
      $('#traise').onclick = function () {
        api('/api/sys/tickets', 'POST', { title: val('tt'), category: val('tc'), priority: val('tp'), asset_id: val('ta'), location: val('tl'), description: val('td') }).then(function (x) { toast(x.number + ' sent to IT'); help(); }).catch(fail);
      };
      $('#tst').onchange = function () { help.status = this.value; help(); };
      if ($('#tmine')) $('#tmine').onchange = function () { help.mine = this.checked; help(); };
      all('[data-tk]').forEach(function (r) { r.onclick = function () { ticket(+r.getAttribute('data-tk')); }; });
    }).catch(fail);
  }
  function ticket(id) {
    api('/api/sys/tickets/' + id).then(function (d) {
      var t = d.ticket, mine = !d.support;
      $('#out').innerHTML = '<div class="controls"><button id="bk">◀ Tickets</button></div><div class="card"><h2>' + esc(t.number) + ' · ' + esc(t.title) + ' ' + pill(t.status) + ' ' + pill(t.priority) + '</h2>' +
        '<p class="sub">' + esc(t.category) + ' · raised by ' + esc(t.requester_name || '') + ' ' + dt(t.created_at) + (t.location ? ' · ' + esc(t.location) : '') + (t.asset_name ? ' · device ' + esc(t.asset_tag + ' ' + t.asset_name) : '') + ' · due ' + dt(t.due_at) + (t.overdue ? ' <span class="pill bad">overdue</span>' : '') + '</p>' +
        (t.description ? '<p class="note">' + esc(t.description) + '</p>' : '') + (t.resolution ? '<div class="note info"><b>Fix:</b> ' + esc(t.resolution) + '</div>' : '') +
        (d.support ? '<div class="grid" style="margin-top:8px">' + sel('us', 'Status', ['new', 'assigned', 'in_progress', 'waiting', 'resolved', 'closed'], t.status) + sel('up', 'Priority', ['low', 'normal', 'high', 'urgent'], t.priority) +
            '<div><label for="ua">Technician</label><select id="ua">' + staffOpts(t.assignee_id) + '</select></div>' + sel('uc', 'Kind', CATS, t.category) +
            '<div><label for="uas">Device</label><select id="uas"><option value="">—</option>' + (help.assets || []).map(function (a) { return '<option value="' + a.id + '"' + (a.id === t.asset_id ? ' selected' : '') + '>' + esc(a.tag + ' ' + a.name) + '</option>'; }).join('') + '</select></div>' +
            area('ur', 'How it was fixed (needed to resolve)', t.resolution, 2) + '</div><div class="controls" style="margin-top:8px"><button class="primary" id="usv">Save</button>' + (t.asset_id ? '<button id="umt">Log a repair on the device</button>' : '') + '</div>' : '') +
        (mine && t.status === 'resolved' ? '<div class="note warn" style="margin-top:8px">IT says this is fixed. Is it? <select id="rate"><option value="">Rate the help…</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select> <button class="sm primary" id="yes">Yes, fixed</button> <button class="sm" id="no">No, still broken</button></div>' : '') + '</div>' +
        '<div class="card"><h2>Conversation</h2>' + (d.notes.length ? d.notes.map(function (x) { return '<div class="note ' + (x.internal ? 'warn' : 'info') + '"><b>' + esc(x.user_name || '') + '</b> <small>' + dt(x.created_at) + (x.internal ? ' · IT only' : '') + '</small><br>' + esc(x.body) + '</div>'; }).join('') : '<div class="empty">No messages yet.</div>') +
        '<textarea id="nb" rows="3" style="width:100%" placeholder="Write a message"></textarea><div class="controls" style="margin-top:6px"><button id="nadd">Send</button>' + (d.support && ['resolved', 'closed'].indexOf(t.status) < 0 ? '<button id="rreq">Ask to connect remotely</button>' : '') + (['resolved', 'closed'].indexOf(t.status) < 0 && t.requester_id === me.user_id ? '<button id="rshare">Share my screen with IT</button>' : '') + (d.support ? '<label class="chk"><input type="checkbox" id="nint"> IT-only note</label>' : '') + '</div></div>';
      $('#bk').onclick = help;
      if ($('#rreq')) $('#rreq').onclick = function () { api('/api/sys/tickets/' + id + '/remote-request', 'POST', {}).then(function () { toast('Asked them to share their screen'); ticket(id); }).catch(fail); };
      if ($('#rshare')) $('#rshare').onclick = function () { tab = 'remote'; show.ticketId = id; show(); };
      $('#nadd').onclick = function () { api('/api/sys/tickets/' + id + '/notes', 'POST', { body: val('nb'), internal: val('nint') }).then(function () { ticket(id); }).catch(fail); };
      if ($('#usv')) $('#usv').onclick = function () { api('/api/sys/tickets/' + id, 'PUT', { status: val('us'), priority: val('up'), assignee_id: val('ua'), category: val('uc'), asset_id: val('uas'), resolution: val('ur') }).then(function () { toast('Saved'); ticket(id); }).catch(fail); };
      if ($('#umt')) $('#umt').onclick = function () { maintenanceBox(t.asset_id, id, function () { ticket(id); }); };
      if ($('#yes')) $('#yes').onclick = function () { api('/api/sys/tickets/' + id + '/confirm', 'POST', { fixed: true, rating: val('rate') }).then(function () { toast('Thanks — closed'); ticket(id); }).catch(fail); };
      if ($('#no')) $('#no').onclick = function () { reasonBox('Still broken', 'What is still wrong?', function (w) { api('/api/sys/tickets/' + id + '/confirm', 'POST', { fixed: false, note: w }).then(function () { ticket(id); }).catch(fail); }); };
    }).catch(fail);
  }

  // ------------------------------------------------------------- equipment --
  var KINDS = ['pc', 'till', 'server', 'printer', 'receipt_printer', 'label_printer', 'scanner', 'cash_drawer', 'phone', 'tablet', 'router', 'switch', 'ups', 'camera', 'other'];
  function assets() {
    api('/api/sys/assets').then(function (d) {
      var soon = new Date(Date.now() + 60 * 86400000).toISOString().slice(0, 10), now = B.today();
      $('#out').innerHTML = '<div class="card"><h2>Equipment</h2><div class="controls"><button class="primary" id="anew">Add a device</button><button id="aimp">Add the registered computers</button></div>' +
        '<div class="scroll"><table><thead><tr><th>Tag</th><th>Device</th><th>Kind</th><th>Where / who</th><th>Serial</th><th>Warranty</th><th>Status</th><th class="n">Open tickets</th></tr></thead><tbody>' +
        (d.assets.length ? d.assets.map(function (a) { var w = a.warranty_until; return '<tr class="click" data-a="' + a.id + '"><td><b>' + esc(a.tag) + '</b></td><td>' + esc(a.name) + (a.make ? '<br><small>' + esc((a.make || '') + ' ' + (a.model || '')) + '</small>' : '') + '</td><td>' + esc(String(a.kind).replace(/_/g, ' ')) + '</td><td>' + esc(a.location || '') + (a.assigned_name ? '<br><small>' + esc(a.assigned_name) + '</small>' : '') + (a.terminal_name ? '<br><small>terminal ' + esc(a.terminal_name) + '</small>' : '') + '</td><td class="mono">' + esc(a.serial || '') + '</td><td>' + (w ? (w < now ? '<span class="pill">ended ' + esc(w) + '</span>' : w <= soon ? '<span class="pill warn">ends ' + esc(w) + '</span>' : esc(w)) : '') + '</td><td>' + pill(a.status) + '</td><td class="n">' + (a.open_tickets || '') + '</td></tr>'; }).join('') : '<tr><td colspan="8" class="empty">Nothing registered yet.</td></tr>') + '</tbody></table></div></div>';
      $('#anew').onclick = function () { assetForm(null); };
      $('#aimp').onclick = function () { api('/api/sys/assets/import-terminals', 'POST', {}).then(function (x) { toast(x.added + ' computer(s) added'); assets(); }).catch(fail); };
      all('[data-a]').forEach(function (r) { r.onclick = function () { assetForm(+r.getAttribute('data-a')); }; });
    }).catch(fail);
  }
  function assetForm(id) {
    (id ? api('/api/sys/assets/' + id) : Promise.resolve({ asset: { kind: 'pc', status: 'in_use' }, maintenance: [], tickets: [] })).then(function (d) {
      var a = d.asset;

          '<div class="scroll"><table><thead><tr><th>Watching</th><th>How</th><th>Now</th><th class="n">Response</th><th class="n">Up 24 h</th><th class="n">Up 7 days</th><th></th></tr></thead><tbody>' +
          (d.targets.length ? d.targets.map(function (t) { return '<tr style="' + (t.enabled ? '' : 'opacity:.5') + '"><td><b>' + esc(t.name) + '</b>' + (t.critical ? ' <span class="pill bad">critical</span>' : '') + (t.asset_tag ? ' <small>' + esc(t.asset_tag) + '</small>' : '') + '</td><td class="mono">' + esc(t.kind === 'http' ? t.url : t.kind === 'tcp' ? t.host + ':' + t.port : 'ping ' + t.host) + '</td><td>' + (t.last_ok == null ? '<span class="pill">not checked</span>' : t.last_ok ? '<span class="pill ok">up</span>' : '<span class="pill bad">DOWN</span> <small>' + esc(t.last_error || '') + (t.down_since ? ' since ' + dt(t.down_since) : '') + '</small>') + '</td><td class="n">' + (t.last_ms != null ? t.last_ms + ' ms' : '') + '</td><td class="n">' + (t.uptime_24h != null ? t.uptime_24h + '%' : '') + '</td><td class="n">' + (t.uptime_7d != null ? t.uptime_7d + '%' : '') + '</td><td style="white-space:nowrap"><button class="sm" data-chk="' + t.id + '">Check now</button> <button class="sm" data-tog="' + t.id + '" data-on="' + (t.enabled ? '0' : '1') + '">' + (t.enabled ? 'Pause' : 'Resume') + '</button> <button class="sm" data-del="' + t.id + '">Remove</button></td></tr>'; }).join('') : '<tr><td colspan="7" class="empty">Nothing watched yet. Start with the router and the internet.</td></tr>') + '</tbody></table></div>' +
          '<div class="controls" style="margin-top:8px"><div><label>Name</label><input id="nt_n" placeholder="Router / Internet / Till 2"></div>' + sel('nt_k', 'Check by', [['ping', 'Ping'], ['tcp', 'Port open'], ['http', 'Web page']], 'ping') + '<div><label>Address / web page</label><input id="nt_h" placeholder="192.168.12.1 or https://…"></div><div><label>Port</label><input id="nt_p" type="number" style="width:80px"></div><label class="chk"><input type="checkbox" id="nt_c"> critical</label><button id="ntadd">Watch</button></div>' +
          '<p class="sub">Suggestions: the router (' + esc((d.interfaces[0] || {}).address ? d.interfaces[0].address.replace(/\.\d+$/, '.1') : '192.168.x.1') + '), the internet (ping 1.1.1.1), the website (https://mortsautoparts.com/api/health), each till and printer.</p></div>' +
        '<div class="card" id="lanCard"><h2>Devices on the shop network</h2><p class="sub">What this computer can see on the local network, matched to the equipment register. Anything unknown deserves a look.</p><button id="lanScan">Scan the network</button><div id="lanOut"></div></div>' +
        '<div class="card"><h2>This server</h2><p>' + esc(d.hostname) + ' · ' + d.interfaces.map(function (i) { return '<span class="mono">' + esc(i.address) + '</span> <small>(' + esc(i.name) + ')</small>'; }).join(' · ') + '</p>' +
          (d.firewall ? '<p>Windows Firewall: ' + Object.keys(d.firewall).map(function (k) { return k + ' ' + (d.firewall[k] ? '<span class="pill ok">on</span>' : '<span class="pill bad">OFF</span>'); }).join(' ') + '</p>' : '') +
          '<h2 style="margin-top:10px">Listening ports</h2><div class="scroll"><table><thead><tr><th class="n">Port</th><th>What</th><th>Reachable from</th><th>Advice</th></tr></thead><tbody>' + d.ports.map(function (p) { return '<tr><td class="n mono">' + p.port + '</td><td>' + esc(p.name || 'unknown') + '</td><td>' + (p.exposed ? '<span class="pill warn">the network</span>' : '<span class="pill ok">this computer only</span>') + '</td><td><small>' + esc(p.risk || '') + '</small></td></tr>'; }).join('') + '</tbody></table></div></div>' +
        '<div class="card"><h2>Networks and Wi-Fi</h2><p class="sub">Keep the tills on their own network, guests on a separate Wi-Fi, use WPA2/WPA3, and change Wi-Fi passwords every year and when someone leaves.</p>' +
          '<table><thead><tr><th>Name</th><th>For</th><th>SSID / subnet / VLAN</th><th>Security</th><th>Apart from the tills</th><th>Password changed</th><th></th></tr></thead><tbody>' + (d.networks.length ? d.networks.map(function (w) { return '<tr><td><b>' + esc(w.name) + '</b></td><td>' + esc(w.purpose) + '</td><td><small>' + esc([w.ssid, w.subnet, w.vlan ? 'VLAN ' + w.vlan : ''].filter(Boolean).join(' · ')) + '</small></td><td>' + (['open', 'wep', 'wpa'].indexOf(w.security) >= 0 ? '<span class="pill bad">' + esc(w.security) + '</span>' : esc(w.security)) + '</td><td>' + (w.isolated_from_pos ? 'yes' : (w.purpose === 'guest' ? '<span class="pill bad">no</span>' : 'no')) + '</td><td>' + esc(w.password_changed_at || '') + '</td><td><button class="sm" data-nwe="' + w.id + '">Edit</button></td></tr>'; }).join('') : '<tr><td colspan="7" class="empty">None recorded.</td></tr>') + '</tbody></table>' +
          '<div class="controls" style="margin-top:8px"><button id="nwadd">Add a network</button></div></div>';
      $('#ntadd').onclick = function () { var k = val('nt_k'); api('/api/sys/net-targets', 'POST', { name: val('nt_n'), kind: k, host: k === 'http' ? '' : val('nt_h'), url: k === 'http' ? val('nt_h') : '', port: val('nt_p'), critical: val('nt_c') }).then(function () { toast('Watching'); network(); }).catch(fail); };
      all('[data-chk]').forEach(function (b) { b.onclick = function () { b.disabled = true; api('/api/sys/net-targets/' + b.getAttribute('data-chk') + '/check', 'POST', {}).then(function (x) { toast(x.result.ok ? 'Up · ' + x.result.ms + ' ms' : 'DOWN · ' + (x.result.error || '')); network(); }).catch(fail); }; });
      all('[data-tog]').forEach(function (b) { b.onclick = function () { api('/api/sys/net-targets/' + b.getAttribute('data-tog'), 'PUT', { enabled: b.getAttribute('data-on') === '1' }).then(network).catch(fail); }; });
      all('[data-del]').forEach(function (b) { b.onclick = function () { confirmBox('Stop watching this and remove its history?', function () { api('/api/sys/net-targets/' + b.getAttribute('data-del'), 'DELETE').then(network).catch(fail); }); }; });
      var scan = function () { $('#lanOut').innerHTML = '<div class="empty">Scanning…</div>'; api('/api/sys/lan-devices').then(function (x) {
        $('#lanCount').textContent = x.devices.length + (x.unknown ? ' (' + x.unknown + ' unknown)' : '');
        $('#lanOut').innerHTML = '<table style="margin-top:8px"><thead><tr><th>Address</th><th>Hardware (MAC)</th><th>Known as</th><th></th></tr></thead><tbody>' + x.devices.map(function (v, i) { return '<tr><td class="mono">' + esc(v.ip) + '</td><td class="mono">' + esc(v.mac) + '</td><td>' + (v.asset ? '<span class="pill ok">' + esc(v.asset.tag) + '</span> ' + esc(v.asset.name) : '<span class="pill warn">unknown</span>') + '</td><td>' + (v.asset ? '' : '<button class="sm" data-reg="' + i + '">Register</button>') + '</td></tr>'; }).join('') + '</tbody></table>';
        all('[data-reg]').forEach(function (b) { b.onclick = function () { var v = x.devices[+b.getAttribute('data-reg')];
          modal('<h2>Register ' + esc(v.ip) + '</h2><div class="grid">' + field('rg_n', 'What is it?', '') + sel('rg_k', 'Kind', ['pc', 'till', 'printer', 'receipt_printer', 'label_printer', 'scanner', 'phone', 'tablet', 'router', 'switch', 'camera', 'other'], 'other') + field('rg_l', 'Where', '') + '</div><div class="controls" style="margin-top:8px"><button class="primary" id="y">Register</button><button id="x">Cancel</button></div>');
          $('#x').onclick = close; $('#y').onclick = function () { api('/api/sys/lan-devices/register', 'POST', { name: val('rg_n'), kind: val('rg_k'), location: val('rg_l'), ip: v.ip, mac: v.mac }).then(function (r2) { close(); toast('Registered as ' + r2.tag); scan(); }).catch(fail); }; }; });
      }).catch(fail); };
      $('#lanScan').onclick = scan; $('#lanTile').onclick = function () { $('#lanCard').scrollIntoView(); scan(); };
      var nwForm = function (w) {
        w = w || { purpose: 'staff', security: 'wpa2' };
        modal('<h2>' + (w.id ? 'Edit network' : 'Add a network') + '</h2><div class="grid">' + field('nw_n', 'Name', w.name) + sel('nw_p', 'For', ['staff', 'pos', 'guest', 'cameras', 'management', 'other'], w.purpose) + field('nw_s', 'Wi-Fi name (SSID)', w.ssid) + field('nw_sub', 'Subnet', w.subnet) + field('nw_v', 'VLAN', w.vlan) + sel('nw_sec', 'Security', ['wpa3', 'wpa2', 'wpa', 'wep', 'open', 'wired'], w.security) + field('nw_pw', 'Password last changed', w.password_changed_at, 'date') + '<label class="chk"><input type="checkbox" id="nw_iso"' + (w.isolated_from_pos ? ' checked' : '') + '> Kept apart from the tills</label>' + area('nw_no', 'Notes', w.notes, 2) + '</div><div class="controls" style="margin-top:8px"><button class="primary" id="y">Save</button><button id="x">Cancel</button></div>');
        $('#x').onclick = close;
        $('#y').onclick = function () { var b = { name: val('nw_n'), purpose: val('nw_p'), ssid: val('nw_s'), subnet: val('nw_sub'), vlan: val('nw_v'), security: val('nw_sec'), password_changed_at: val('nw_pw'), isolated_from_pos: val('nw_iso'), notes: val('nw_no') };
          (w.id ? api('/api/sys/networks/' + w.id, 'PUT', b) : api('/api/sys/networks', 'POST', b)).then(function () { close(); toast('Saved'); network(); }).catch(fail); };
      };
      $('#nwadd').onclick = function () { nwForm(null); };
      all('[data-nwe]').forEach(function (b) { b.onclick = function () { nwForm(d.networks.find(function (w) { return String(w.id) === b.getAttribute('data-nwe'); })); }; });
      netMap();
    }).catch(fail);
  }

  // ------------------------------------------------------------ network map --
  // Hub and spoke: the internet at the top, the router in the middle, every
  // device on an oval around it. Redrawn every 15 s while the map is on screen.
  var mapTimer = null, mapPaused = false, mapSel = null, mapData = null;
  var NM_ICON = { router: '📶', server: '🖥️', pc: '💻', till: '🧾', printer: '🖨️', receipt_printer: '🖨️', label_printer: '🏷️', scanner: '📠', phone: '📱', tablet: '📱', switch: '🔀', ups: '🔋', camera: '📷', website: '🌐', internet: '☁️', other: '🔌' };
  var NM_LABEL = { up: 'answering', down: 'NOT ANSWERING', unknown: 'unregistered device', idle: 'not heard from lately' };
  function netMap() {
    clearInterval(mapTimer);
    var load = function () {
      if (!$('#nmap')) { clearInterval(mapTimer); return; }
      if (mapPaused || document.hidden) return;
      api('/api/sys/network/map').then(function (d) { mapData = d; drawMap(); }).catch(function (e) { if ($('#nmap')) $('#nmap').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
    };
    load(); mapTimer = setInterval(load, 15000);
  }
  function drawMap() {
    var d = mapData, host = $('#nmap'); if (!host || !d) return;
    var W = 1000, cx = 500, cy = 300, devs = d.devices.filter(function (n) { return !n.router; });
    var router = d.devices.filter(function (n) { return n.router; })[0] || { id: 'router', kind: 'router', name: 'Router', ip: '', status: 'idle' };
    var srv = { id: 'server', kind: 'server', name: d.server.name + ' (this server)', ip: d.server.ips.join(', '), status: 'up' };
    var ring = [srv].concat(devs), n = ring.length, pos = {};
    // Up to 18 on one oval; more go on a second, inner one, alternately.
    var two = n > 18;
    ring.forEach(function (x, i) {
      var k = two ? Math.floor(i / 2) : i, m = two ? Math.ceil(n / 2) : n, inner = two && i % 2;
      var a = (-15 + 210 * (m > 1 ? k / (m - 1) : 0.5)) * Math.PI / 180, rx = inner ? 250 : 410, ry = inner ? 130 : 215;
      pos[x.id] = [cx - rx * Math.cos(a), cy + ry * Math.sin(a)];
    });
    pos[router.id] = [cx, cy]; pos.internet = [cx, 64];
    d.cloud.forEach(function (c, i) { pos[c.id] = [cx + 190 + i * 150, 64]; });
    var H = 600, still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var link = function (a, b, st, key) {
      var p = pos[a], q = pos[b], cls = 'nml ' + st, path = 'M' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ' L' + q[0].toFixed(1) + ' ' + q[1].toFixed(1);
      return '<path class="' + cls + '" d="' + path + '"/>' + (st === 'up' && !still ? '<circle r="3.2" class="nmp"><animateMotion dur="' + (2 + (key % 7) * 0.35).toFixed(2) + 's" repeatCount="indefinite" path="' + path + '"/></circle>' : '');
    };
    var nodeSvg = function (x, big) {
      var p = pos[x.id], r = big ? 30 : 23, st = x.status;
      return '<g class="nmn ' + st + (mapSel === x.id ? ' sel' : '') + '" data-nm="' + esc(x.id) + '" transform="translate(' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ')" tabindex="0">' +
        '<title>' + esc((x.name || x.ip) + ' · ' + (NM_LABEL[st] || st)) + '</title>' +
        (st === 'down' && !still ? '<circle class="nmpulse" r="' + r + '"><animate attributeName="r" values="' + r + ';' + (r + 16) + '" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".55;0" dur="1.6s" repeatCount="indefinite"/></circle>' : '') +
        '<circle class="nmc" r="' + r + '"/><text class="nmi" y="' + (big ? 9 : 7) + '" font-size="' + (big ? 26 : 19) + '">' + (NM_ICON[x.kind] || NM_ICON.other) + '</text>' +
        '<text class="nmt" y="' + (r + 15) + '">' + esc(String(x.name || (st === 'unknown' ? 'Unknown device' : x.ip)).slice(0, 26)) + '</text>' +
        (x.ip && x.kind !== 'internet' ? '<text class="nms" y="' + (r + 28) + '">' + esc(String(x.ip).slice(0, 30)) + (x.target && x.target.ms != null && st === 'up' ? ' · ' + x.target.ms + ' ms' : '') + '</text>' : '') + '</g>';
    };
    var inet = { id: 'internet', kind: 'internet', name: 'Internet', ip: '', status: d.internet.status, target: d.internet.target };
    var h = '<div class="nmwrap"><svg id="nmSvg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Network map">' +
      link('internet', router.id, d.internet.status === 'down' || router.status === 'down' ? 'down' : router.status === 'idle' && d.internet.status === 'idle' ? 'idle' : 'up', 1) +
      d.cloud.map(function (c, i) { return link(c.id, 'internet', c.status, i + 2); }).join('') +
      ring.map(function (x, i) { return link(x.id, router.id, x.status, i + 9); }).join('') +
      nodeSvg(inet, true) + d.cloud.map(function (c) { return nodeSvg(c); }).join('') + nodeSvg(router, true) + ring.map(function (x) { return nodeSvg(x, x.id === 'server'); }).join('') + '</svg></div>';
    var count = function (s) { return ring.filter(function (x) { return x.status === s; }).length; };
    h += '<div class="nmfoot"><span><i class="nmd up"></i>Answering ' + count('up') + '</span><span><i class="nmd down"></i>Not answering ' + count('down') + '</span><span><i class="nmd unknown"></i>Unregistered ' + count('unknown') + '</span><span><i class="nmd idle"></i>Not heard lately ' + count('idle') + '</span>' +
      '<span style="margin-left:auto">Updated ' + esc(new Date(d.at).toLocaleTimeString('en-JM', { timeZone: 'America/Jamaica' })) + (d.monitoring ? '' : ' · test copy: monitoring checks only run with Check now') + '</span><button class="sm" id="nmPause">' + (mapPaused ? '▶ Resume' : '⏸ Pause') + '</button><button class="sm" id="nmNow">↻ Refresh</button></div><div id="nmDet"></div>';
    host.innerHTML = h;
    $('#nmLive').textContent = mapPaused ? 'paused' : 'live'; $('#nmLive').className = 'pill ' + (mapPaused ? '' : 'ok');
    $('#nmPause').onclick = function () { mapPaused = !mapPaused; if (mapPaused) drawMap(); else netMap(); };
    $('#nmNow').onclick = function () { mapPaused = false; netMap(); };
    var everything = [inet, router].concat(d.cloud, ring);
    all('[data-nm]', host).forEach(function (g) {
      var pick = function () { mapSel = mapSel === g.getAttribute('data-nm') ? null : g.getAttribute('data-nm'); drawMap(); };
      g.onclick = pick; g.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
    });
    var x = everything.filter(function (y) { return y.id === mapSel; })[0];
    if (x) mapDetails(x);
  }
  function mapDetails(x) {
    var t = x.target, row = function (k, v) { return v == null || v === '' ? '' : '<tr><th style="width:170px">' + k + '</th><td>' + v + '</td></tr>'; };
    $('#nmDet').innerHTML = '<div class="card" style="margin:10px 0 0"><h2>' + (NM_ICON[x.kind] || NM_ICON.other) + ' ' + esc(x.name || x.ip || 'Device') + ' <span class="pill ' + ({ up: 'ok', down: 'bad', unknown: 'warn' }[x.status] || '') + '">' + esc(NM_LABEL[x.status] || x.status) + '</span></h2><table>' +
      row('Kind', esc(String(x.kind).replace(/_/g, ' '))) + row('Address', x.ip ? '<span class="mono">' + esc(x.ip) + '</span>' : '') + row('Hardware (MAC)', x.mac ? '<span class="mono">' + esc(x.mac) + '</span>' : '') +
      row('Equipment register', x.asset ? '<span class="pill ok">' + esc(x.asset.tag) + '</span> ' + esc(x.asset.name) + (x.asset.location ? ' · ' + esc(x.asset.location) : '') : (x.mac ? '<span class="pill warn">not registered</span>' : '')) +
      row('Till', x.till ? esc(x.till.name || '') + ' · ' + (x.till.online ? 'checked in within 3 minutes' : 'last checked in ' + esc(dt(x.till.last_seen))) : '') +
      row('Seen on the network', x.seen ? 'yes, in this computer\'s address table' : (x.kind === 'internet' || x.kind === 'website' || x.id === 'server' ? '' : 'not lately')) +
      (t ? row('Monitoring', esc(t.how) + (t.critical ? ' <span class="pill bad">critical</span>' : '') + (t.enabled ? '' : ' (paused)')) + row('Last check', t.checked ? esc(dt(t.checked)) + (t.ok ? ' · ' + t.ms + ' ms' : t.ok === false ? ' · <b style="color:var(--red)">' + esc(t.error || 'no answer') + '</b>' : '') : 'not checked yet') +
        row('Down since', t.down_since ? esc(dt(t.down_since)) : '') + row('Up in the last 24 h', t.uptime_24h != null ? t.uptime_24h + '%' : '') : '') + '</table>' +
      '<div class="controls" style="margin-top:8px">' + (t ? '<button class="sm" id="nmChk">Check now</button>' : '') + (x.mac && !x.asset ? '<button class="sm primary" id="nmReg">Register this device</button>' : '') + (!t && x.ip && x.id !== 'server' && x.kind !== 'internet' ? '<button class="sm" id="nmWatch">Watch it (ping every minute)</button>' : '') + '</div></div>';
    if ($('#nmChk')) $('#nmChk').onclick = function () { this.disabled = true; api('/api/sys/net-targets/' + t.id + '/check', 'POST', {}).then(function (r) { toast(r.result.ok ? 'Up · ' + r.result.ms + ' ms' : 'DOWN · ' + (r.result.error || '')); netMap(); }).catch(fail); };
    if ($('#nmWatch')) $('#nmWatch').onclick = function () { api('/api/sys/net-targets', 'POST', { name: x.name || x.ip, kind: 'ping', host: x.ip, critical: x.kind === 'router' }).then(function () { toast('Watching ' + (x.name || x.ip)); network(); }).catch(fail); };
    if ($('#nmReg')) $('#nmReg').onclick = function () {
      modal('<h2>Register ' + esc(x.ip) + '</h2><div class="grid">' + field('rg_n', 'What is it?', '') + sel('rg_k', 'Kind', ['pc', 'till', 'printer', 'receipt_printer', 'label_printer', 'scanner', 'phone', 'tablet', 'router', 'switch', 'camera', 'other'], 'other') + field('rg_l', 'Where', '') + '</div><div class="controls" style="margin-top:8px"><button class="primary" id="y">Register</button><button id="x">Cancel</button></div>');
      $('#x').onclick = close; $('#y').onclick = function () { api('/api/sys/lan-devices/register', 'POST', { name: val('rg_n'), kind: val('rg_k'), location: val('rg_l'), ip: x.ip, mac: x.mac }).then(function (r2) { close(); toast('Registered as ' + r2.tag); netMap(); }).catch(fail); };
    };
  }

  start();
})();
</script>
