<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receivables · Morty's Auto Parts</title>
<link rel="stylesheet" href="/assets/books.css">
<link rel="icon" href="/favicon.svg?v=vision2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=vision2" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico?v=vision2" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=vision2">
<script src="/assets/vas-ui.js?v=20261110b" data-chrome="page"></script>
</head>
<body>
<header><h1>Customers &amp; receivables</h1><nav><a href="/payables.html">Payables</a><a href="/banking.html">Banking</a><a href="/accounting.html">Ledger</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"><button data-t="cust" class="on">Customer centre</button><button data-t="coll">Collections</button><button data-t="aging">A/R aging</button><button data-t="rec">Recurring invoices</button></div>
  <div id="out"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script src="/assets/books-common.js?v=20261103"></script>
<script src="/assets/list-tools.js?v=20261109"></script>
<script src="/assets/billing-ui.js?v=20261104"></script>
<script src="/assets/doc-attach.js"></script>
<script src="/assets/invoice-scan.js?v=20261028"></script>
<script>
(function () {
  'use strict';
  var B = window.Books, $ = B.$, all = B.all, esc = B.esc, J = B.J, api = B.api, toast = B.toast, modal = B.modal, close = B.close, BU = window.BillingUI;
  var tab = 'cust', state = { q: '', filter: '' }, accounts = [];

  // ------------------------------------------------------------ customer centre --
  function cust() {
    return api('/api/ar/customers?all=1&filter=' + state.filter).then(function (d) {
      var status = function (c) { return c.credit_hold ? 'On hold' : c.credit_limit != null && c.balance > c.credit_limit ? 'Over limit' : c.overdue > 0.005 ? 'Overdue' : c.balance > 0.005 ? 'Owes' : c.balance < -0.005 ? 'Has credit' : 'Paid up'; };
      $('#out').innerHTML = '<div class="tiles"><div class="tile"><span class="k">Open invoices</span><b>' + J(d.totals.open) + '</b></div><div class="tile bad"><span class="k">Overdue</span><b>' + J(d.totals.overdue) + '</b></div><div class="tile"><span class="k">Unapplied credits</span><b>' + J(d.totals.credit) + '</b></div></div>' +
        '<div class="card"><div class="controls"><div><label>Show</label><select id="f"><option value="">Everyone who owes or has credit</option><option value="all">All customers</option><option value="overdue">Overdue</option><option value="over_limit">Over credit limit</option><option value="hold">On credit hold</option><option value="credit">With unapplied credit</option></select></div>' +
        (d.capped ? '<div class="note warn" style="margin:0">Only the first ' + d.customers.length.toLocaleString() + ' customers are loaded. Pick a narrower "Show".</div>' : '') + '</div>' +
        '<div id="clist"></div></div>';
      $('#f').value = state.filter;
      $('#f').onchange = function () { state.filter = this.value; cust(); };
      window.ListTools.mount($('#clist'), {
        key: 'ar-customers', rows: d.customers, csv: 'customers', placeholder: 'Find a customer: name, account no., phone, email, amount…',
        empty: 'Nobody here.', emptyFiltered: 'No customer matches.', totals: ['open', 'overdue', 'credit', 'balance'],
        search: function (c) { return String(c.phone || '').replace(/\D/g, ''); },
        rowAttr: function (c) { return 'data-c="' + c.id + '" class="click"'; },
        cols: [
          { k: 'name', label: 'Customer', cell: function (c) { return '<b>' + esc(c.name) + '</b>'; } },
          { k: 'account_number', label: 'Account no.', nowrap: true },
          { k: 'phone', label: 'Phone', nowrap: true },
          { k: 'email', label: 'Email', val: function (c) { return c.email && !/\.local$/.test(c.email) ? c.email : ''; } },
          { k: 'open', label: 'Open', type: 'money' },
          { k: 'overdue', label: 'Overdue', type: 'money', cell: function (c) { return c.overdue ? '<span class="pill bad">' + J(c.overdue) + '</span>' : ''; } },
          { k: 'oldest_days', label: 'Oldest (days)', type: 'num', cell: function (c) { return c.oldest_days ? c.oldest_days + ' d' : ''; } },
          { k: 'credit', label: 'Credit', type: 'money', cell: function (c) { return c.credit ? J(c.credit) : ''; } },
          { k: 'balance', label: 'Balance', type: 'money', cell: function (c) { return '<b>' + J(c.balance) + '</b>'; } },
          { k: 'credit_limit', label: 'Limit', type: 'money' },
          { k: 'payment_terms_days', label: 'Terms (days)', type: 'num' },
          { k: 'status', label: 'Status', type: 'list', val: status, cell: function (c) { return (c.credit_hold ? '<span class="pill bad">hold</span>' : '') + (c.credit_limit != null && c.balance > c.credit_limit ? ' <span class="pill warn">over limit</span>' : ''); } },
          { k: 'last_note', label: 'Last note', type: 'date', nowrap: true, val: function (c) { return c.last_note ? String(c.last_note).slice(0, 10) : ''; } }
        ],
        after: function (tb) { all('[data-c]', tb).forEach(function (r) { r.onclick = function () { detail(+r.getAttribute('data-c')); }; }); }
      });
    });
  }

  function detail(id) {
    return api('/api/ar/customers/' + id).then(function (d) {
      var c = d.customer, a = d.aging;
      $('#out').innerHTML = '<div class="controls"><button id="bk">◀ All customers</button><button id="er" title="Contact, addresses, tax and the rest of the customer record">Edit customer record ›</button></div>' +
        '<div class="card"><h2>' + esc(c.name) + (c.credit_hold ? ' <span class="pill bad">on credit hold</span>' : '') + '</h2><p class="sub">' + esc([c.account_number, c.phone, c.email && !/\.local$/.test(c.email) ? c.email : null].filter(Boolean).join(' · ')) + '</p>' +
        (c.credit_hold ? '<div class="note bad">Hold: ' + esc(c.credit_hold_reason || '') + '. The till will not charge sales to this account.</div>' : '') +
        '<div class="tiles"><div class="tile"><span class="k">Balance</span><b>' + J(d.balance) + '</b></div><div class="tile"><span class="k">Current</span><b>' + J(a.current) + '</b></div><div class="tile"><span class="k">1-30</span><b>' + J(a.d30) + '</b></div><div class="tile"><span class="k">31-60</span><b>' + J(a.d60) + '</b></div><div class="tile"><span class="k">61-90</span><b>' + J(a.d90) + '</b></div><div class="tile bad"><span class="k">Over 90</span><b>' + J(a.over90) + '</b></div><div class="tile"><span class="k">Unapplied credit</span><b>' + J(d.credit) + '</b></div></div>' +
        '<div class="controls"><button class="primary" id="rp">Receive payment</button><button id="ni">New invoice</button><button id="st">Statement</button><button id="rm">Email a reminder</button><button id="bs">Reminders &amp; late fees</button><button id="hd">' + (c.credit_hold ? 'Lift credit hold' : 'Put on credit hold') + '</button>' + (d.invoices.length ? '<button id="wo" title="The customer will never pay: write the balance off as a bad debt">Write off bad debt</button>' : '') +
        '<span style="margin-left:auto"></span><div><label>Terms (days)</label><input id="tm" type="number" value="' + (c.payment_terms_days == null ? '' : c.payment_terms_days) + '" style="width:80px"></div><div><label>Credit limit (J$)</label><input id="cl" type="number" value="' + (c.credit_limit == null ? '' : c.credit_limit) + '" style="width:120px"></div><button id="sv">Save terms</button></div>' +
        '<div class="controls"><span class="sub">Accounting defaults for new invoice lines:</span><div><label>Category</label><select id="dca"><option value="">Rental Income (standard)</option>' + accounts.filter(function (a) { return ['income', 'other_income'].indexOf(a.type) >= 0; }).map(function (a) { return '<option value="' + a.id + '"' + (String(c.default_income_account_id) === String(a.id) ? ' selected' : '') + '>' + esc(a.code + ' ' + a.name) + '</option>'; }).join('') + '</select></div>' +
        '<div><label>Class</label><select id="dcl">' + B.classOptions(c.default_class_id) + '</select></div><button id="dsv">Save defaults</button></div></div>' +
        '<div class="card"><h2>Open invoices</h2><div class="scroll"><table><thead><tr><th>Invoice</th><th>Date</th><th>Due</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Open</th><th class="n">Overdue</th></tr></thead><tbody>' +
        (d.invoices.length ? d.invoices.map(function (i) { return '<tr><td>' + esc(i.receipt_number) + (i.invoice_kind === 'late_fee' ? ' <span class="pill warn">late fee</span>' : '') + (i.doc === 'invoice' && i.invoice_kind !== 'late_fee' ? ' <button class="sm" data-sg="' + i.id + '" title="Get the customer\'s signature: here on the screen, or by a link">✍ Sign</button>' : '') + (i.doc === 'invoice' && !i.paid ? ' <button class="sm" data-vi="' + i.id + '" data-fee="' + (i.invoice_kind === 'late_fee' ? 1 : 0) + '">' + (i.invoice_kind === 'late_fee' ? 'Waive' : 'Void') + '</button>' : '') + '</td><td>' + esc(i.day) + '</td><td>' + esc(i.due || i.day) + '</td><td class="n">' + J(i.total) + '</td><td class="n">' + J(i.paid) + '</td><td class="n"><b>' + J(i.open) + '</b></td><td class="n">' + (i.days_overdue ? '<span class="pill ' + (i.days_overdue > 45 ? 'bad' : 'warn') + '">' + i.days_overdue + ' d</span>' : '') + '</td></tr>'; }).join('') : '<tr><td colspan="7" class="empty">Nothing open.</td></tr>') + '</tbody></table></div></div>' +
        '<div class="card"><h2>Recurring invoices <button class="sm" id="np">New recurring invoice</button></h2><div id="cplans"></div></div>' +
        '<div class="card"><h2>Payments received</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Method</th><th>Ref</th><th class="n">Amount</th><th>Applied to</th><th class="n">Unapplied</th><th>Deposited to</th><th></th></tr></thead><tbody>' +
        (d.payments.length ? d.payments.map(function (p) {
          return '<tr style="' + (p.voided_at ? 'opacity:.5' : '') + '"><td>' + esc(p.day) + '</td><td>' + (p.method === 'writeoff' ? '<span class="pill warn" title="' + esc(p.notes || '') + '">bad debt written off</span>' : p.method === 'credit_note' ? '<span class="pill" title="' + esc(p.notes || '') + '">credit note (return)</span>' : esc(p.method)) + '</td><td>' + esc(p.reference || '') + '</td><td class="n">' + J(p.amount) + '</td><td><small>' + (p.applied_to || []).map(function (x) { return esc(x.receipt) + ' ' + J(x.amount); }).join('<br>') + '</small></td>' +
            '<td class="n">' + (p.voided_at ? '<span class="pill bad">void</span>' : p.unapplied ? '<b>' + J(p.unapplied) + '</b>' : '') + '</td><td><small>' + esc(p.deposit_to || '') + '</small></td>' +
            '<td style="white-space:nowrap">' + (!p.voided_at && p.unapplied > 0.005 && d.invoices.length ? '<button class="sm" data-ap="' + p.id + '" data-u="' + p.unapplied + '">Apply credit</button> ' : '') + (p.voided_at ? '<small>' + esc(p.void_reason || '') + '</small>' : p.method === 'credit_note' ? (p.unapplied > 0.005 && p.return_id ? '<button class="sm" data-po="' + p.return_id + '" data-u="' + p.unapplied + '">Pay out</button>' : '') : '<button class="sm" data-vd="' + p.id + '" data-wo="' + (p.method === 'writeoff' ? 1 : '') + '">' + (p.method === 'writeoff' ? 'Undo write-off' : 'Void') + '</button>') + '</td></tr>';
        }).join('') : '<tr><td colspan="8" class="empty">No payments.</td></tr>') + '</tbody></table></div></div>' +
        '<div class="card"><h2>Invoices &amp; documents</h2><p class="sub">Signed invoices, signed delivery slips, statements and anything else for this customer, kept in the document centre.</p><div id="cdocs"></div></div>' +
        '<div class="card"><h2>Collections notes</h2><div class="controls"><div><label>Kind</label><select id="nk"><option value="call">Phone call</option><option value="note">Note</option><option value="email">Email</option><option value="promise">Promise to pay</option></select></div>' +
        '<div style="flex:1"><label>What happened</label><input id="nt" style="width:100%"></div><div id="pp" style="display:none"><label>Pay by</label><input id="pd" type="date"> <input id="pa" type="number" placeholder="J$" style="width:110px"></div><button id="na">Add</button></div>' +
        (d.notes.length ? '<table><tbody>' + d.notes.map(function (x) { return '<tr><td style="white-space:nowrap">' + esc(B.dt(x.created_at)) + '</td><td><span class="pill">' + esc(x.kind) + '</span></td><td>' + esc(x.note) + (x.promise_day ? ' <b>(promised ' + esc(x.promise_day) + (x.promise_amount ? ', ' + J(x.promise_amount) : '') + ')</b>' : '') + '</td><td><small>' + esc(x.by_name || '') + '</small></td></tr>'; }).join('') + '</tbody></table>' : '<p class="sub">No notes yet.</p>') + '</div>';
      $('#bk').onclick = show;
      if (window.VADocs) window.VADocs.mount($('#cdocs'), 'customer', id, { category: 'receivables' });
      all('[data-sg]').forEach(function (b) { b.onclick = function () { signing(+b.getAttribute('data-sg'), c, function () { detail(id); }); }; });
      $('#er').onclick = function () { location.href = '/admin.html#tab=customers&id=' + id; };
      $('#rp').onclick = function () { receive(c, d.invoices); };
      var again = function () { detail(id); };
      $('#ni').onclick = function () { BU.newInvoice(c, again); };
      $('#bs').onclick = function () { BU.billingSettings(c, again); };
      $('#np').onclick = function () { BU.planEditor('ar', null, c, again); };
      BU.planList($('#cplans'), { side: 'ar', customer_id: id });
      all('[data-vi]').forEach(function (b) { b.onclick = function () { BU.voidInvoice(+b.getAttribute('data-vi'), b.getAttribute('data-fee') === '1', again); }; });
      $('#st').onclick = function () { statement(c); };
      $('#rm').onclick = function () { api('/api/ar/customers/' + id + '/reminder', 'POST').then(function (r) { toast('Reminder sent: ' + r.invoices + ' invoice(s), ' + J(r.total)); detail(id); }).catch(function (e) { toast(e.message); }); };
      $('#hd').onclick = async function () { var reason = c.credit_hold ? ((await vasPrompt('Why is the hold lifted? (optional)', '')) || '') : (await vasPrompt('Why put the account on hold?', 'Overdue over 45 days')); if (reason === null) return; api('/api/ar/customers/' + id + '/hold', 'POST', { hold: !c.credit_hold, reason: reason }).then(function () { detail(id); }).catch(function (e) { toast(e.message); }); };
      $('#dsv').onclick = function () { api('/api/ar/customers/' + id + '/defaults', 'PUT', { default_income_account_id: $('#dca').value, default_class_id: $('#dcl').value }).then(function () { toast('Defaults saved'); detail(id); }).catch(function (e) { toast(e.message); }); };
      $('#sv').onclick = function () { api('/api/ar/customers/' + id + '/terms', 'PUT', { payment_terms_days: $('#tm').value, credit_limit: $('#cl').value }).then(function () { toast('Saved'); }).catch(function (e) { toast(e.message); }); };
      $('#nk').onchange = function () { $('#pp').style.display = this.value === 'promise' ? '' : 'none'; };
      $('#na').onclick = function () { api('/api/ar/customers/' + id + '/notes', 'POST', { kind: $('#nk').value, note: $('#nt').value, promise_date: $('#pd').value, promise_amount: $('#pa').value }).then(function () { detail(id); }).catch(function (e) { toast(e.message); }); };
      if ($('#wo')) $('#wo').onclick = function () { writeOff(c, d.invoices); };
      all('[data-po]').forEach(function (b) { b.onclick = async function () {
        var left = Number(b.getAttribute('data-u'));
        var amt = await vasPrompt('Pay out unused credit from this credit note. How much? (up to ' + J(left) + ')', left.toFixed(2)); if (!amt) return;
        var how = ((await vasPrompt('Paid out by: cash, cheque, card or bank?', 'cash')) || '').trim().toLowerCase(); if (!how) return;
        api('/api/admin/pos/returns/' + b.getAttribute('data-po') + '/refund-credit', 'POST', { amount: amt, method: how }).then(function () { toast('Credit paid out'); detail(c.id); }).catch(function (e) { toast(e.message); });
      }; });
      all('[data-vd]').forEach(function (b) { b.onclick = async function () { var r = await vasPrompt(b.getAttribute('data-wo') ? 'Undo this write-off? The amount is owed again and the bad debt expense is reversed. Why? (e.g. customer is paying after all)' : 'Why is this payment voided? (e.g. cheque returned)'); if (!r) return; api('/api/ar/payments/' + b.getAttribute('data-vd') + '/void', 'POST', { reason: r }).then(function () { toast('Voided'); detail(id); }).catch(function (e) { toast(e.message); }); }; });
      all('[data-ap]').forEach(function (b) { b.onclick = function () { applyCredit(c, d.invoices, +b.getAttribute('data-ap'), +b.getAttribute('data-u')); }; });
    }).catch(function (e) { toast(e.message); });
  }

  // ------------------------------------------------------------ signatures --
  // A customer's signature on an invoice: here on the screen (in person), or from a
  // one-time link. Each signature is sealed against the invoice's contents; the
  // signed copy is filed in the document centre (invoice-docs.js).
  function signing(invId, c, after) {
    api('/api/ar/invoices/' + invId + '/signing').then(function (d) {
      var i = d.invoice, open = d.requests.filter(function (r) { return r.open; });
      modal('<h2>Signature · invoice ' + esc(i.number) + ' · ' + esc(c.name) + '</h2><p class="sub">' + esc(i.day) + (i.due ? ' · due ' + esc(i.due) : '') + ' · ' + J(i.total) + (i.voided_at ? ' · <span class="pill bad">void</span>' : '') + '</p>' +
        '<table><tbody>' + d.lines.map(function (l) { return '<tr><td>' + esc(l.description || '') + '</td><td class="n">' + J(l.amount) + '</td></tr>'; }).join('') + (i.gct ? '<tr><td>GCT</td><td class="n">' + J(i.gct) + '</td></tr>' : '') + '<tr><td><b>Total</b></td><td class="n"><b>' + J(i.total) + '</b></td></tr></tbody></table>' +
        (d.signatures.length ? '<h3 style="margin-top:12px">Signed</h3>' + d.signatures.map(function (s) {
          var ok = s.unchanged && s.sealed;
          return '<div class="note ' + (ok ? 'info' : 'bad') + '" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><img src="' + s.image + '" alt="signature" style="height:54px;background:#fff;border-radius:4px">' +
            '<div><b>' + esc(s.signer_name) + '</b> · ' + esc(B.dt(s.signed_at)) + '<br><small>' + (s.method === 'in_person' ? 'In person' + (s.witness ? ', witnessed by ' + esc(s.witness) : '') : 'From a link' + (s.signer_email ? ' sent to ' + esc(s.signer_email) : '') + (s.ip ? ', from ' + esc(s.ip) : '')) + '</small><br>' +
            (ok ? '<small>✔ Seal intact: the invoice is unchanged since it was signed.</small>' : '<b>⚠ ' + (!s.unchanged ? 'The invoice has changed since it was signed.' : 'The signature record has been altered.') + '</b>') + '</div>' +
            (s.document_id ? '<a class="pill" style="margin-left:auto" href="/api/docs/' + s.document_id + '/file" target="_blank" rel="noopener">Signed copy ' + esc(s.document_number || '') + ' ↗</a>' : '') + '</div>';
        }).join('') : '') +
        (i.voided_at ? '' :
          '<h3 style="margin-top:12px">Sign here now</h3><p class="sub">Hand the screen to the customer. They sign with a finger, pen or mouse; you are the witness.</p>' +
          '<div id="sgpad"></div><div class="controls" style="margin-top:6px"><div style="flex:1"><label>Name of the person signing</label><input id="sgname" style="width:100%" value="' + esc(c.name) + '"></div><button class="sm" id="sgclr">Clear</button><button class="primary" id="sggo">Save signature</button></div>' +
          '<h3 style="margin-top:12px">Or send it to sign on their phone</h3><div class="controls"><div style="flex:1"><label>Email (blank: just make the link, to send by WhatsApp or text)</label><input id="sgmail" type="email" style="width:100%" value="' + esc(c.email && !/\.local$/.test(c.email) ? c.email : '') + '"></div>' +
          '<div><label>Link lasts (days)</label><input id="sgdays" type="number" min="1" max="60" value="14" style="width:80px"></div><button id="sgsend">Send for signature</button></div><div id="sglink"></div>') +
        (open.length ? '<p class="sub">Links waiting: ' + open.map(function (r) { return esc(r.sent_to || 'link only') + ' (until ' + esc(String(r.expires_at).slice(0, 10)) + ') <a href="#" data-cx="' + r.id + '">cancel</a>'; }).join(' · ') + '</p>' : '') +
        '<div id="sgdocs"></div><p class="sub" style="word-break:break-all">Invoice fingerprint (SHA-256): ' + esc(d.fingerprint) + '</p><div class="controls"><button id="sgx">Close</button></div>');
      var again = function () { signing(invId, c, after); };
      $('#sgx').onclick = function () { close(); if (after) after(); };
      if (window.VADocs) window.VADocs.mount($('#sgdocs'), 'invoice', invId, { category: 'receivables' });
      all('[data-cx]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); api('/api/ar/sign-requests/' + a.getAttribute('data-cx') + '/cancel', 'POST').then(again).catch(function (er) { toast(er.message); }); }; });
      if (i.voided_at) return;
      var pad = window.VAScan.pad($('#sgpad'));
      $('#sgclr').onclick = pad.clear;
      $('#sggo').onclick = function () {
        if (pad.empty()) return toast('Sign in the box first');
        $('#sggo').disabled = true;
        api('/api/ar/invoices/' + invId + '/sign', 'POST', { name: $('#sgname').value, image: pad.png() })
          .then(function (r) { toast('Signed' + (r.document ? ': filed as ' + r.document.number : '')); again(); })
          .catch(function (e) { $('#sggo').disabled = false; toast(e.message); });
      };
      $('#sgsend').onclick = function () {
        $('#sgsend').disabled = true;
        api('/api/ar/invoices/' + invId + '/sign-request', 'POST', { email: $('#sgmail').value.trim(), days: $('#sgdays').value }).then(function (r) {
          var wa = 'https://wa.me/?text=' + encodeURIComponent('Please sign invoice ' + i.number + ' (' + J(i.total) + ') from ' + B.shopName() + ': ' + r.link);
          $('#sglink').innerHTML = '<div class="note info">' + (r.emailed ? 'Emailed. ' : '') + 'This link works once, for ' + r.expires_in_days + ' days, and is shown only now:<br><input id="sgl" readonly style="width:100%;margin:6px 0" value="' + esc(r.link) + '">' +
            '<button class="sm" id="sgcopy">Copy link</button> <a class="pill" href="' + esc(wa) + '" target="_blank" rel="noopener">Send by WhatsApp ↗</a></div>';
          $('#sgcopy').onclick = function () { $('#sgl').select(); (navigator.clipboard ? navigator.clipboard.writeText(r.link) : Promise.reject()).then(function () { toast('Copied'); }, function () { document.execCommand('copy'); toast('Copied'); }); };
          $('#sgsend').disabled = false;
        }).catch(function (e) { $('#sgsend').disabled = false; toast(e.message); });
      };
    }).catch(function (e) { toast(e.message); });
  }

  // Invoice list with amounts to apply; "oldest first" fills them in order.
  function invoiceRows(invoices) {
    return '<table><thead><tr><th></th><th>Invoice</th><th>Due</th><th class="n">Open</th><th class="n">Apply</th></tr></thead><tbody>' +
      invoices.map(function (i) { var k = i.doc + ':' + i.id; return '<tr><td><input type="checkbox" data-ck="' + k + '"></td><td>' + esc(i.receipt_number) + '<br><small>' + esc(i.day) + '</small></td><td>' + esc(i.due || i.day) + '</td><td class="n">' + J(i.open) + '</td><td class="n"><input type="number" step="0.01" data-amt="' + k + '" data-open="' + i.open + '" style="width:120px"></td></tr>'; }).join('') + '</tbody></table>';
  }
  function wireApply(get) {
    var sum = function () { return all('[data-amt]').reduce(function (t, x) { return t + (+x.value || 0); }, 0); };
    var upd = function () { var avail = get(), used = Math.round(sum() * 100) / 100; $('#used').textContent = J(used); $('#left').textContent = J(Math.round((avail - used) * 100) / 100); $('#left').parentNode.className = avail - used < -0.005 ? 'bad' : ''; };
    all('[data-ck]').forEach(function (cb) { cb.onchange = function () { var inp = $('[data-amt="' + cb.getAttribute('data-ck') + '"]'); if (cb.checked) { var left = get() - sum(); inp.value = Math.max(0, Math.min(+inp.getAttribute('data-open'), Math.round(left * 100) / 100)).toFixed(2); } else inp.value = ''; upd(); }; });
    all('[data-amt]').forEach(function (x) { x.oninput = function () { $('[data-ck="' + x.getAttribute('data-amt') + '"]').checked = +x.value > 0; upd(); }; });
    $('#auto').onclick = function () { var left = get(); all('[data-amt]').forEach(function (x) { var v = Math.max(0, Math.min(+x.getAttribute('data-open'), Math.round(left * 100) / 100)); x.value = v ? v.toFixed(2) : ''; left -= v; $('[data-ck="' + x.getAttribute('data-amt') + '"]').checked = v > 0; }); upd(); };
    upd();
    return function () { return all('[data-amt]').filter(function (x) { return +x.value > 0; }).map(function (x) { var k = x.getAttribute('data-amt').split(':'); return k[0] === 'invoice' ? { invoice_id: +k[1], amount: +x.value } : { sale_id: +k[1], amount: +x.value }; }); };
  }
  var DEPOSIT_FOR = { cash: 'cash_safe', cheque: 'cheques', card: 'card_clearing', bank: 'bank' };
  function receive(c, invoices) {
    var banks = accounts.filter(function (a) { return a.bank && a.system_key !== 'cash_drawers'; });
    modal('<h2>Receive payment · ' + esc(c.name) + '</h2><div class="controls"><div><label>Amount received (J$)</label><input id="ra" type="number" step="0.01" style="width:140px"></div><div><label>Date</label><input id="rd" type="date" value="' + B.today() + '"></div>' +
      '<div><label>Method</label><select id="rmth"><option value="cheque">Cheque</option><option value="cash">Cash</option><option value="bank">Bank transfer</option><option value="card">Card</option></select></div><div><label>Cheque / reference no.</label><input id="rr" style="width:130px"></div>' +
      '<div><label>Deposit to</label><select id="rdep">' + banks.map(function (a) { return '<option value="' + a.id + '" data-k="' + esc(a.system_key || '') + '">' + esc(a.code + ' ' + a.name) + '</option>'; }).join('') + '</select></div></div>' +
      '<input id="rmemo" placeholder="Memo" style="width:100%;margin-bottom:8px">' +
      (invoices.length ? '<div class="controls"><button class="sm" id="auto">Apply oldest first</button><span class="sub">Applied <b id="used"></b> · left as credit <span><b id="left"></b></span></span></div><div class="scroll" style="max-height:40vh">' + invoiceRows(invoices) + '</div>' : '<p class="sub">No open invoices: the whole payment stays as a credit on the account.</p><span id="used" hidden></span><span hidden><b id="left"></b></span><button id="auto" hidden></button>') +
      '<div class="controls" style="margin-top:10px"><button class="primary" id="rgo">Save payment</button><button id="rx">Cancel</button></div>');
    var setDep = function () { var want = DEPOSIT_FOR[$('#rmth').value]; var o = all('#rdep option').find(function (x) { return x.getAttribute('data-k') === want; }); if (o) $('#rdep').value = o.value; };
    $('#rmth').onchange = setDep; setDep();
    var apps = wireApply(function () { return +$('#ra').value || 0; });
    $('#ra').oninput = function () { $('#auto').onclick && all('[data-amt]').length && $('#auto').onclick(); };
    $('#rx').onclick = close;
    $('#rgo').onclick = function () {
      api('/api/ar/payments', 'POST', { customer_id: c.id, amount: $('#ra').value, paid_on: $('#rd').value, method: $('#rmth').value, reference: $('#rr').value, deposit_account_id: $('#rdep').value, memo: $('#rmemo').value, applications: apps() })
        .then(function (r) { close(); toast('Payment saved' + (r.credit > 0 ? '; ' + J(r.credit) + ' left as credit' : '')); detail(c.id); }).catch(function (e) { toast(e.message); });
    };
  }
  // Bad debt: the customer will never pay. Pick what to write off; the ledger posts
  // Dr Bad Debts, Cr Accounts Receivable and the balance leaves Receivables.
  // If they pay after all: Undo write-off on the payment line, then Receive payment.
  function writeOff(c, invoices) {
    var owed = Math.round(invoices.reduce(function (t, i) { return t + i.open; }, 0) * 100) / 100;
    modal('<h2>Write off bad debt · ' + esc(c.name) + '</h2><p class="sub">For money this customer will never pay. Tick the invoices and till charges to write off (or type part of one). The amount comes off what they owe and goes to the Bad Debts expense account; your sales stay as they were. If they pay later, use <b>Undo write-off</b> on the payment line, then Receive payment.</p>' +
      '<div class="controls"><div><label>Date</label><input id="wd" type="date" value="' + B.today() + '"></div><div style="flex:1"><label>Why? (kept on the account)</label><input id="wr" style="width:100%" placeholder="e.g. business closed, cannot be traced, debt over 1 year"></div></div>' +
      '<div class="controls"><button class="sm" id="auto">Tick everything</button><span class="sub">Writing off <b id="used"></b> · still owed <span><b id="left"></b></span></span></div>' +
      '<div class="scroll" style="max-height:40vh">' + invoiceRows(invoices) + '</div>' +
      '<div class="controls" style="margin-top:10px"><button class="primary" id="wgo">Write off</button><button id="wx">Cancel</button></div>');
    var apps = wireApply(function () { return owed; });
    $('#wx').onclick = close;
    $('#wgo').onclick = async function () {
      var list = apps(), tot = Math.round(list.reduce(function (t, a) { return t + a.amount; }, 0) * 100) / 100;
      if (!tot) return toast('Tick what to write off');
      if (!$('#wr').value.trim()) return toast('Say why it is being written off');
      if (!(await vasConfirm('Write off ' + J(tot) + ' owed by ' + c.name + ' as a bad debt?'))) return;
      api('/api/ar/writeoffs', 'POST', { customer_id: c.id, written_off_on: $('#wd').value, reason: $('#wr').value, applications: list })
        .then(function (r) { close(); toast(J(r.amount) + ' written off'); detail(c.id); }).catch(function (e) { toast(e.message); });
    };
  }
  function applyCredit(c, invoices, pid, unapplied) {
    modal('<h2>Apply credit · ' + esc(c.name) + '</h2><p class="sub">' + J(unapplied) + ' of this payment is not used on any invoice yet.</p><div class="controls"><button class="sm" id="auto">Apply oldest first</button><span class="sub">Applied <b id="used"></b> · still credit <span><b id="left"></b></span></span></div>' +
      '<div class="scroll" style="max-height:45vh">' + invoiceRows(invoices) + '</div><div class="controls" style="margin-top:10px"><button class="primary" id="go">Apply</button><button id="x">Cancel</button></div>');
    var apps = wireApply(function () { return unapplied; });
    $('#x').onclick = close;
    $('#go').onclick = function () { api('/api/ar/payments/' + pid + '/apply', 'POST', { applications: apps() }).then(function () { close(); toast('Applied'); detail(c.id); }).catch(function (e) { toast(e.message); }); };
  }
  // The customer's statement, laid out like a QuickBooks statement and built by
  // the server, so the printed copy and the emailed copy are the same page.
  function statement(c) {
    var from = statement.from || '', st = null;
    modal('<h2>Statement · ' + esc(c.name) + '</h2>' +
      '<div class="controls"><div><label>Activity from</label><input id="stmFrom" type="date"></div><span class="sub">The statement is dated today. Charges and payments before this date are carried in as the balance forward.</span></div>' +
      '<div id="stmView" class="scroll" style="max-height:55vh;border:1px solid #ccc;background:#fff;color:#000"></div>' +
      '<div class="controls" style="margin-top:10px"><button class="primary" id="stmPrint">Print / PDF</button><button id="stmEmail">Email</button><button id="stmSms">SMS</button><button id="stmWa">WhatsApp</button><button id="stmClose">Close</button></div>' +
      '<p class="sub" id="stmTo"></p>');
    var load = function () {
      return api('/api/ar/customers/' + c.id + '/statement' + (from ? '?from=' + encodeURIComponent(from) : '')).then(function (d) {
        st = d; from = d.from; $('#stmFrom').value = d.from;
        // The statement's own page, shown as it prints (its styles are all inline).
        $('#stmView').innerHTML = new DOMParser().parseFromString(d.html, 'text/html').body.innerHTML;
        $('#stmTo').textContent = 'Amount due ' + J(d.due) + '. Email goes to ' + (d.email || 'nobody: there is no email on the customer record') + '; SMS and WhatsApp send a short summary to ' + (d.customer.phone || 'nobody: there is no phone on the record') + '. Each one is noted in the collections notes.';
      }).catch(function (e) { toast(e.message); });
    };
    $('#stmFrom').onchange = function () { if (this.value) { from = this.value; statement.from = from; load(); } };
    $('#stmClose').onclick = close;
    $('#stmPrint').onclick = function () {
      if (!st) return;
      var w = window.open('', '_blank');
      if (!w) return toast('Allow pop-ups to print the statement');
      w.document.write(st.html); w.document.close();
      setTimeout(function () { w.focus(); w.print(); }, 300);
    };
    var send = function (channel) {
      if (!st) return;
      api('/api/ar/customers/' + c.id + '/statement/send', 'POST', { channel: channel, from: from }).then(function (r) {
        if (r.wa_link) { window.open(r.wa_link, '_blank'); toast('WhatsApp opened for ' + r.to + ': press send there'); }
        else toast(r.ok ? (r.status === 'stubbed' ? 'Logged only (' + r.reason + ')' : r.status === 'queued' ? 'Queued for ' + r.to : 'Statement sent to ' + r.to) : 'Not sent: ' + (r.reason || r.status));
      }).catch(function (e) { toast(e.message); });
    };
    $('#stmEmail').onclick = function () { send('email'); };
    $('#stmSms').onclick = function () { send('sms'); };
    $('#stmWa').onclick = function () { send('whatsapp'); };
    load();
  }

  // ------------------------------------------------------------ collections --
  function coll() {
    return api('/api/ar/collections').then(function (d) {
      var STEP = { remind: ['Email a reminder', ''], call: ['Phone them', 'warn'], hold: ['Put on credit hold', 'bad'], promised: ['Promised to pay', 'ok'] };
      var KINDS = { call: 'Phone call', note: 'Note', email: 'Email', promise: 'Promise to pay' };
      $('#out').innerHTML = '<div class="card"><h2>Collections worklist</h2><p class="sub">Following the credit procedure: a reminder from the first day overdue, a phone call from day 15, credit hold at day 45. A promise to pay (logged as a note) holds the account until its date.</p><div id="klist"></div></div>';
      window.ListTools.mount($('#klist'), {
        key: 'ar-collections', rows: d.rows, csv: 'collections', placeholder: 'Find a customer, phone, email or note…',
        empty: 'Nothing overdue.', emptyFiltered: 'No customer matches.', totals: ['overdue'],
        search: function (r) { return String(r.phone || '').replace(/\D/g, ''); },
        rowAttr: function (r) { return 'data-c="' + r.id + '" class="click"'; },
        cols: [
          { k: 'name', label: 'Customer', cell: function (r) { return '<b>' + esc(r.name) + '</b>'; } },
          { k: 'account_number', label: 'Account no.', nowrap: true },
          { k: 'phone', label: 'Phone', nowrap: true },
          { k: 'email', label: 'Email', val: function (r) { return r.email && !/\.local$/.test(r.email) ? r.email : ''; } },
          { k: 'overdue', label: 'Overdue', type: 'money' },
          { k: 'oldest_days', label: 'Oldest (days)', type: 'num', cell: function (r) { return r.oldest_days + ' d'; } },
          { k: 'step', label: 'Next step', type: 'list', val: function (r) { return STEP[r.step][0]; }, cell: function (r) { var s = STEP[r.step]; return '<span class="pill ' + s[1] + '">' + s[0] + '</span>'; } },
          { k: 'hold', label: 'On hold', type: 'list', val: function (r) { return r.credit_hold ? 'Yes' : 'No'; }, cell: function (r) { return r.credit_hold ? '<span class="pill bad">on hold</span>' : ''; } },
          { k: 'last_kind', label: 'Last contact', type: 'list', val: function (r) { return r.last ? KINDS[r.last.kind] || r.last.kind : ''; } },
          { k: 'last_day', label: 'Last date', type: 'date', nowrap: true, val: function (r) { return r.last && r.last.created_at ? String(r.last.created_at).slice(0, 10) : ''; } },
          { k: 'last_note', label: 'Last note', val: function (r) { return r.last ? r.last.note || '' : ''; }, cell: function (r) { return r.last ? '<small>' + esc(String(r.last.note || '').slice(0, 90)) + (r.last.promise_day ? ' <b>(promised ' + esc(r.last.promise_day) + ')</b>' : '') + '</small>' : ''; } }
        ],
        after: function (tb) { all('[data-c]', tb).forEach(function (r) { r.onclick = function () { tab = 'cust'; mark(); detail(+r.getAttribute('data-c')); }; }); }
      });
    });
  }
  function aging() {
    return api('/api/ar/aging').then(function (d) {
      var t = d.totals;
      $('#out').innerHTML = '<div class="tiles"><div class="tile"><span class="k">Current</span><b>' + J(t.current) + '</b></div><div class="tile"><span class="k">1-30</span><b>' + J(t.d30) + '</b></div><div class="tile"><span class="k">31-60</span><b>' + J(t.d60) + '</b></div><div class="tile"><span class="k">61-90</span><b>' + J(t.d90) + '</b></div><div class="tile bad"><span class="k">Over 90</span><b>' + J(t.over90) + '</b></div><div class="tile"><span class="k">Total owed to us</span><b>' + J(t.total) + '</b></div></div>' +
        '<div class="card"><h2>A/R aging summary · ' + esc(d.as_of) + '</h2><p class="sub">Aged from each invoice\'s due date (or its date when it has no terms). The total row adds up whatever the search and filters are showing; Download CSV saves the same.</p>' +
        '<div class="controls"><div><label>Quick view</label><select id="aview"><option value="">Everyone who owes</option><option value="late">Anything overdue</option><option value="d30">Over 30 days</option><option value="d60">Over 60 days</option><option value="d90">Over 90 days</option><option value="walkin">Not on an account (name only)</option></select></div></div><div id="alist"></div></div>';
      var VIEW = { late: function (r) { return r.d30 + r.d60 + r.d90 + r.over90 > 0.005; }, d30: function (r) { return r.d60 + r.d90 + r.over90 > 0.005; }, d60: function (r) { return r.d90 + r.over90 > 0.005; }, d90: function (r) { return r.over90 > 0.005; }, walkin: function (r) { return !r.customer_id; } };
      var rowsNow = function () { var f = VIEW[aging.view]; return f ? d.rows.filter(f) : d.rows; };
      var m = function (k, label) { return { k: k, label: label, type: 'money', cell: function (r) { return r[k] ? J(r[k]) : ''; } }; };
      var lt = window.ListTools.mount($('#alist'), {
        key: 'ar-aging', rows: rowsNow(), csv: 'ar-aging-' + d.as_of, placeholder: 'Find a customer, account no., phone or amount…',
        empty: 'Nobody owes us.', emptyFiltered: 'No customer matches.', totals: ['current', 'd30', 'd60', 'd90', 'over90', 'total'],
        search: function (r) { return String(r.phone || '').replace(/\D/g, ''); },
        rowAttr: function (r) { return 'data-c="' + (r.customer_id || '') + '"' + (r.customer_id ? ' class="click"' : ''); },
        cols: [{ k: 'name', label: 'Customer', cell: function (r) { return esc(r.name || '') + (r.customer_id ? '' : ' <small class="sub">(no account)</small>'); } },
          { k: 'account_number', label: 'Account no.' }, { k: 'phone', label: 'Phone', nowrap: true },
          m('current', 'Current'), m('d30', '1-30'), m('d60', '31-60'), m('d90', '61-90'), m('over90', 'Over 90'),
          { k: 'total', label: 'Total', type: 'money', cell: function (r) { return '<b>' + J(r.total) + '</b>'; } }],
        after: function (tb) { all('[data-c]', tb).forEach(function (r) { if (r.getAttribute('data-c')) r.onclick = function () { tab = 'cust'; mark(); detail(+r.getAttribute('data-c')); }; }); }
      });
      $('#aview').value = aging.view || '';
      $('#aview').onchange = function () { aging.view = this.value; lt.refresh(rowsNow()); };
    });
  }

  // ------------------------------------------------------------ recurring --
  function rec() {
    $('#out').innerHTML = '<div class="card"><h2>Recurring invoices</h2><p class="sub">Rent and other regular charges. Each period&#39;s invoice is raised on its date and goes on the customer&#39;s account. To set one up, open the customer and choose New recurring invoice.</p><div id="plans"></div></div>' +
      '<div class="card"><h2>Coming up (30 days)</h2><div id="up"></div></div>';
    BU.upcoming($('#up'), ['ar']);
    return BU.planList($('#plans'), { side: 'ar' });
  }

  function mark() { all('#tabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tab); }); }
  function show() { mark(); ({ cust: cust, coll: coll, aging: aging, rec: rec }[tab])().catch(function (e) { $('#out').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; }); }
  all('#tabs button').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); show(); }; });
  B.loadAccounts().then(function (a) { accounts = a; show(); }).catch(function (e) { $('#out').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; });
})();
</script>
