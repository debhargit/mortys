<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franchise · Vision Auto Solutions</title>
<style>
  :root{ --red:#d62828; --navy:#0b1b2b; --ink:#0f1720; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ok:#16a34a; --warn:#b45309; --chip:#eef2f7; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; --chip:#1f2b38; --warn:#f59e0b; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0} header nav{margin-left:auto;display:flex;gap:14px;font-size:13px;align-items:center;flex-wrap:wrap} header a{color:#fff;opacity:.85}
  main{max-width:1250px;margin:0 auto;padding:14px 16px 60px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px} .tabs button{border-radius:999px} .tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  input,select,button,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  textarea{width:100%} button{cursor:pointer;background:var(--card)} button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600} button.sm{padding:3px 9px;font-size:12.5px}
  button:disabled{opacity:.5;cursor:default} button.link{border:0;background:none;color:var(--red);padding:0;font-weight:600}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px} .controls label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px;margin-bottom:10px} .grid label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px} .grid input,.grid select,.grid textarea{width:100%}
  .grid .wide{grid-column:1/-1}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse} th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} td.n,th.n{text-align:right;white-space:nowrap}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  tr.row{cursor:pointer} tr.row:hover td{background:var(--chip)}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip)} .pill.ok{background:#16a34a22;color:var(--ok)} .pill.warn{background:#f59e0b22;color:var(--warn)} .pill.bad{background:#d6282822;color:var(--red)}
  .modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:9990} .modal .card{max-width:980px;width:100%}
  .modal.top{z-index:9995} .modal.top .card{max-width:720px}
  .empty{color:var(--muted);text-align:center;padding:20px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:9999;max-width:90vw}
  .ftabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:8px 0 12px} .ftabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 10px} .ftabs button.on{border-bottom-color:var(--red);font-weight:600}
  .item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px} .item small{color:var(--muted)}
  .warn{background:#f59e0b18;border-left:3px solid var(--warn);padding:8px 10px;border-radius:8px;margin:8px 0}
  h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px} .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px} .kpi b{display:block;font-size:22px} .kpi span{color:var(--muted);font-size:12px}
  .bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:60px} .bar i{display:block;height:100%;background:var(--red)}
  .task{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line)} .task span{flex:1} .task.done span{color:var(--muted);text-decoration:line-through}
  .funnel{display:flex;gap:6px;flex-wrap:wrap} .funnel div{flex:1;min-width:110px;background:var(--chip);border-radius:8px;padding:8px;text-align:center} .funnel b{display:block;font-size:20px}
  iframe.doc{width:100%;height:60vh;border:1px solid var(--line);border-radius:8px;background:#fff}
  .padbox canvas{width:100%;height:160px;border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none}
  .score button{padding:2px 9px;font-size:12.5px} .score button.on{background:var(--red);border-color:var(--red);color:#fff}
  @media print{ header,.tabs,.controls,button{display:none!important} .card{border:0} }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<header><h1>Franchise</h1><nav><a href="/receivables.html">Receivables</a><a href="/documents.html">Documents</a><a href="/training.html">Training</a><a href="/franchisee.html" target="_blank" rel="noopener">Enquiry form</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div><div id="modal2"></div>
<div class="toast" id="toast"></div>
<script src="/assets/invoice-scan.js?v=20261028"></script>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var all = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var day = function (t) { return t ? new Date(String(t).length === 10 ? t + 'T12:00:00' : t).toLocaleDateString('en-JM') : ''; };
  var when = function (t) { return t ? new Date(t).toLocaleString('en-JM', { dateStyle: 'short', timeStyle: 'short' }) : ''; };
  var jmd = function (v) { return v == null ? '' : 'J$' + Number(v).toLocaleString('en-JM', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var today = function () { var d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  var lastMonth = function () { var d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  var monthName = function (p) { return p ? new Date(p.slice(0, 7) + '-15T12:00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : ''; };
  var META = null, tab = 'dash';
  var STATUS = { onboarding: 'Setting up', open: 'Open', suspended: 'Suspended', terminated: 'Terminated', expired: 'Expired', transferred: 'Transferred' };
  var DOCSTATUS = { draft: 'Draft', sent: 'Sent for signing', signed: 'Signed', countersigned: 'Signed by both', declined: 'Declined', cancelled: 'Cancelled', filed: 'Filed' };
  var ACTK = { renewal: 'Renewal', transfer: 'Transfer', 'default': 'Notice of default', suspension: 'Suspension', termination: 'Termination' };
  var AUDK = { pre_opening: 'Pre-opening', routine: 'Routine visit', mystery_shop: 'Mystery shop', follow_up: 'Follow-up' };

  function toast(t) { var el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.style.display = 'none'; }, 4000); }
  function api(url, method, body) {
    return fetch(url, { method: method || 'GET', credentials: 'same-origin', headers: { Accept: 'application/json', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        if (r.status === 401) { location.href = '/admin.html'; throw new Error('Sign in required'); }
        return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; });
      });
  }
  function modal(h, layer) {
    var host = $(layer === 2 ? '#modal2' : '#modal');
    host.innerHTML = '<div class="modal' + (layer === 2 ? ' top' : '') + '"><div class="card">' + h + '</div></div>';
    host.firstChild.addEventListener('mousedown', function (e) { if (e.target.classList.contains('modal')) close(layer); });
    return host.firstChild;
  }
  function close(layer) { $(layer === 2 ? '#modal2' : '#modal').innerHTML = ''; if (layer !== 2 && /^#(lead|fr)=/.test(location.hash)) history.replaceState(null, '', '#' + tab); }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if ($('#modal2').innerHTML) close(2); else close(); } });
  var opts = function (list, cur, blank) { return (blank != null ? '<option value="">' + esc(blank) + '</option>' : '') + list.map(function (p) { var id = p.id != null ? p.id : p[0], nm = p.name != null ? p.name : p[1]; return '<option value="' + esc(id) + '"' + (String(cur) === String(id) ? ' selected' : '') + '>' + esc(nm) + '</option>'; }).join(''); };
  var field = function (label, html, wide) { return '<div' + (wide ? ' class="wide"' : '') + '><label>' + esc(label) + '</label>' + html + '</div>'; };
  var inp = function (id, v, type, ph) { return '<input id="' + id + '" type="' + (type || 'text') + '" value="' + esc(v == null ? '' : v) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '>'; };
  var area = function (id, v, rows) { return '<textarea id="' + id + '" rows="' + (rows || 3) + '">' + esc(v || '') + '</textarea>'; };
  var val = function (id, root) { var el = $('#' + id, root); return el ? el.value : undefined; };
  var terrOpts = function (cur) { return opts((META.territories || []).map(function (t) { return [t.id, t.code + ' ' + t.name + (t.status !== 'open' ? ' (' + t.status + ')' : '')]; }), cur, '-'); };
  function frPill(s) { return '<span class="pill' + (s === 'open' ? ' ok' : s === 'onboarding' || s === 'suspended' ? ' warn' : ' bad') + '">' + esc(STATUS[s] || s) + '</span>'; }
  function docPill(s) { return '<span class="pill' + (s === 'signed' || s === 'countersigned' || s === 'filed' ? ' ok' : s === 'sent' ? ' warn' : s === 'draft' ? '' : ' bad') + '">' + esc(DOCSTATUS[s] || s) + '</span>'; }
  function stageLabel(k) { var s = (META.stages || []).find(function (x) { return x.key === k; }); return s ? s.label : k; }
  // Disables the button while the call runs; on an error, says why and stops there (the .then after it never runs).
  function guard(btn, p) { if (btn) btn.disabled = true; return p.finally(function () { if (btn) btn.disabled = false; }).catch(function (e) { toast(e.message); return new Promise(function () {}); }); }
  function csv(name, rows) {
    var text = rows.map(function (r) { return r.map(function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(','); }).join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })); a.download = name + '-' + today() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------------------------------------------------------------- tabs --
  var TABS = [['dash', '📊 Overview'], ['leads', '📥 Enquiries & leads'], ['franchisees', '🏪 Franchisees'], ['territories', '🗺 Territories'], ['billing', '🧾 Royalties & fees'],
    ['performance', '📈 Performance'], ['audits', '✅ Audits'], ['templates', '📄 Templates & manual'], ['settings', '⚙ Settings']];
  function drawTabs() {
    $('#tabs').innerHTML = TABS.map(function (t) { return '<button data-t="' + t[0] + '"' + (t[0] === tab ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join('');
    all('[data-t]').forEach(function (b) { b.onclick = function () { location.hash = b.getAttribute('data-t'); }; });
  }
  function show() {
    var h = location.hash.replace(/^#/, '');
    var m = /^(lead|fr)=(\d+)/.exec(h);
    if (m) { if (!$('#view').getAttribute('data-shown')) { tab = m[1] === 'lead' ? 'leads' : 'franchisees'; drawTabs(); VIEWS[tab](); } if (m[1] === 'lead') openLead(+m[2]); else openFr(+m[2]); return; }
    tab = VIEWS[h] ? h : 'dash'; drawTabs(); $('#view').setAttribute('data-shown', '1'); VIEWS[tab]();
  }
  window.addEventListener('hashchange', show);
  function reloadMeta() { return api('/api/franchise/meta').then(function (m) { META = m; }); }

  // ------------------------------------------------------------ overview --
  function dash() {
    $('#view').innerHTML = '<div class="empty">Loading…</div>';
    api('/api/franchise/dashboard').then(function (d) {
      var st = d.stages || {}, fs = d.statuses || {};
      var active = ['enquiry', 'qualified', 'nda', 'disclosed', 'application', 'approved', 'agreement'];
      var h = '<div class="kpis">' +
        kpi(active.reduce(function (x, k) { return x + (st[k] || 0); }, 0), 'Leads in the pipeline') + kpi(fs.open || 0, 'Open franchises') + kpi(fs.onboarding || 0, 'Being set up') +
        kpi(jmd(d.owed.owed), 'Owed by franchisees') + kpi(jmd(d.owed.overdue), 'Of which overdue') + kpi(d.tasks.overdue + ' / ' + d.tasks.open, 'Checklist items overdue / open') +
        kpi(d.signatures.out, 'Documents out for signing') + kpi(d.signatures.countersign, 'Waiting for our signature') + '</div>';
      h += '<div class="card"><h2>Pipeline</h2><div class="funnel">' + active.concat(['signed']).map(function (k) { return '<div><b>' + (st[k] || 0) + '</b>' + esc(stageLabel(k)) + '</div>'; }).join('') + '</div>' +
        '<p class="sub" style="margin-top:8px">Declined ' + (st.declined || 0) + ' · withdrawn ' + (st.withdrawn || 0) + '. Industry order: enquiry → qualify → NDA → disclosure document → application → approve → agreement (no sooner than ' + META.settings.wait_days + ' days after the disclosure document) → opening.</p></div>';
      h += '<div class="card"><h2>Needs attention</h2>';
      var items = [];
      d.missing_reports.forEach(function (r) { items.push('📄 <b>' + esc(r.name) + '</b> has not sent the sales report for ' + esc(monthName(d.last_period)) + ' <button class="sm" data-fr="' + r.id + '">Open</button>'); });
      d.unbilled.forEach(function (r) { items.push('🧾 <b>' + esc(r.name) + '</b>: ' + esc(monthName(r.period)) + ' reported (' + jmd(r.net_sales) + ' net) but not invoiced <button class="sm" data-bill="' + r.franchisee_id + '" data-period="' + esc(r.period.slice(0, 7)) + '">Invoice now</button>'); });
      d.renewals_due.forEach(function (r) { items.push('🔁 <b>' + esc(r.name) + '</b>: term ends ' + esc(day(r.term_end)) + ' <button class="sm" data-fr="' + r.id + '">Open</button>'); });
      d.open_actions.forEach(function (a) { items.push('⚠ ' + esc(ACTK[a.kind]) + ': <b>' + esc(a.name) + '</b>' + (a.cure_by ? ', put right by ' + esc(day(a.cure_by)) : a.effective_date ? ', from ' + esc(day(a.effective_date)) : '') + ' <button class="sm" data-fr="' + a.franchisee_id + '">Open</button>'); });
      d.audits_due.forEach(function (r) { items.push('✅ <b>' + esc(r.name) + '</b>: no audit in 100 days' + (r.last_audit ? ' (last ' + esc(day(r.last_audit)) + ')' : ' (never audited)') + ' <button class="sm" data-audit="' + r.id + '">Start audit</button>'); });
      h += items.length ? items.map(function (x) { return '<div class="item">' + x + '</div>'; }).join('') : '<div class="empty">Nothing waiting.</div>';
      h += '</div><div class="card"><h2>Recent activity</h2><table><tbody>' + (d.recent.map(function (l) { return '<tr><td>' + esc(when(l.at)) + '</td><td>' + esc(l.action) + (l.detail ? ' · ' + esc(l.detail) : '') + '</td><td>' + esc(l.by_name || '') + '</td></tr>'; }).join('') || '<tr><td class="empty">No activity yet.</td></tr>') + '</tbody></table></div>';
      $('#view').innerHTML = h;
      all('[data-fr]').forEach(function (b) { b.onclick = function () { location.hash = 'fr=' + b.getAttribute('data-fr'); }; });
      all('[data-bill]').forEach(function (b) { b.onclick = function () { guard(b, api('/api/franchise/franchisees/' + b.getAttribute('data-bill') + '/bill', 'POST', { period: b.getAttribute('data-period') })).then(function (r) { toast('Invoice ' + r.invoice.number + ' for ' + jmd(r.invoice.total)); dash(); }); }; });
      all('[data-audit]').forEach(function (b) { b.onclick = function () { auditForm(+b.getAttribute('data-audit')); }; });
    }).catch(function (e) { $('#view').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; });
  }
  function kpi(v, l) { return '<div class="kpi"><b>' + esc(v) + '</b><span>' + esc(l) + '</span></div>'; }

  // --------------------------------------------------------------- leads --
  function leads() {
    $('#view').innerHTML = '<div class="card"><div class="controls"><div><label>Stage</label><select id="lStage"><option value="active">Still in progress</option><option value="">All</option>' + opts(META.stages.map(function (s) { return [s.key, s.label]; })) + '</select></div>' +
      '<div><label>Find</label><input id="lQ" placeholder="Name, phone, email, area"></div><button class="primary" id="lNew">+ New enquiry</button><button id="lCsv">Export</button></div><div class="scroll" id="lList"><div class="empty">Loading…</div></div></div>';
    var rows = [];
    var load = function () {
      api('/api/franchise/leads?stage=' + encodeURIComponent(val('lStage')) + '&q=' + encodeURIComponent(val('lQ'))).then(function (d) {
        rows = d.leads;
        $('#lList').innerHTML = rows.length ? '<table><thead><tr><th>Received</th><th>Name</th><th>Area</th><th>Source</th><th class="n">Cash to invest</th><th>Score</th><th>Stage</th></tr></thead><tbody>' + rows.map(function (l) {
          return '<tr class="row" data-l="' + l.id + '"><td>' + esc(day(l.created_day)) + '</td><td><b>' + esc(l.name) + '</b>' + (l.company ? '<br><small>' + esc(l.company) + '</small>' : '') + '<br><small>' + esc([l.phone, l.email].filter(Boolean).join(' · ')) + '</small></td><td>' + esc(l.territory_name || l.area_wanted || l.parish || '') + '</td><td>' + esc(l.source || '') + '</td><td class="n">' + (l.capital != null ? jmd(l.capital) : '') + '</td><td>' + (l.score != null ? l.score + '/100' : '') + '</td><td><span class="pill">' + esc(stageLabel(l.stage)) + '</span></td></tr>';
        }).join('') + '</tbody></table>' : '<div class="empty">No leads here. Enquiries from the website form (franchisee.html) arrive here too.</div>';
        all('[data-l]').forEach(function (tr) { tr.onclick = function () { location.hash = 'lead=' + tr.getAttribute('data-l'); }; });
      }).catch(function (e) { toast(e.message); });
    };
    $('#lStage').onchange = load; $('#lQ').oninput = function () { clearTimeout(load.h); load.h = setTimeout(load, 300); };
    $('#lNew').onclick = function () { leadForm(null); };
    $('#lCsv').onclick = function () { csv('franchise-leads', [['Received', 'Name', 'Company', 'Phone', 'Email', 'Area', 'Source', 'Cash', 'Score', 'Stage']].concat(rows.map(function (l) { return [l.created_day, l.name, l.company, l.phone, l.email, l.territory_name || l.area_wanted, l.source, l.capital, l.score, stageLabel(l.stage)]; }))); };
    load();
  }
  function leadFields(l) {
    l = l || {};
    return '<div class="grid">' + field('Name', inp('fName', l.name)) + field('Company (if any)', inp('fCompany', l.company)) + field('Phone', inp('fPhone', l.phone)) + field('Email', inp('fEmail', l.email, 'email')) +
      field('Address', inp('fAddress', l.address)) + field('Parish', inp('fParish', l.parish)) + field('Area wanted', inp('fArea', l.area_wanted)) + field('Territory', '<select id="fTerr">' + terrOpts(l.territory_id) + '</select>') +
      field('Where they heard of us', inp('fSource', l.source, 'text', 'walk-in, referral, expo, website…')) + field('Cash to invest (J$)', inp('fCapital', l.capital)) + field('Net worth (J$)', inp('fNet', l.net_worth)) +
      field('When they want to open', inp('fTimeline', l.timeline)) + field('Handled by', '<select id="fOwner">' + opts(META.staff, l.owner_id, '-') + '</select>') +
      field('Experience', area('fExp', l.experience, 2), true) + field('Their message', area('fMsg', l.message, 2), true) + field('Notes', area('fNotes', l.notes, 2), true) + '</div>';
  }
  function leadBody(root) {
    return { name: val('fName', root), company: val('fCompany', root), phone: val('fPhone', root), email: val('fEmail', root), address: val('fAddress', root), parish: val('fParish', root), area_wanted: val('fArea', root),
      territory_id: val('fTerr', root), source: val('fSource', root), capital: val('fCapital', root), net_worth: val('fNet', root), timeline: val('fTimeline', root), owner_id: val('fOwner', root),
      experience: val('fExp', root), message: val('fMsg', root), notes: val('fNotes', root) };
  }
  function leadForm() {
    var m = modal('<h2>New franchise enquiry</h2>' + leadFields(null) + '<div class="controls"><button class="primary" id="fSave">Save</button><button id="fX">Cancel</button></div>');
    $('#fX', m).onclick = function () { close(); };
    $('#fSave', m).onclick = function () { guard(this, api('/api/franchise/leads', 'POST', leadBody(m))).then(function (r) { close(); location.hash = 'lead=' + r.id; }); };
  }
  function openLead(id) {
    api('/api/franchise/leads/' + id).then(function (d) {
      var l = d.lead, sub = openLead.sub || 'details';
      var closed = l.stage === 'declined' || l.stage === 'withdrawn';

    $('#pCsv').onclick = function () { if (data) csv('franchise-performance', [['Franchisee', 'Territory', 'Net sales', 'Growth %', 'Share %', 'Reports', 'Late reports', 'Royalty', 'Brand fund', 'Owed', 'Overdue', 'Last audit %', 'Open defaults']].concat(data.franchisees.map(function (r) { return [r.name, r.territory_name, r.net_sales, r.growth_pct, r.share_pct, r.reports, r.late_reports, r.royalty, r.fund, r.balance, r.overdue, r.last_audit, r.open_defaults]; }))); };
    load();
  }

  // -------------------------------------------------------------- audits --
  function auditTable(list, withName) {
    return list.length ? '<table><thead><tr><th>Date</th>' + (withName ? '<th>Franchisee</th>' : '') + '<th>Kind</th><th class="n">Score</th><th>Result</th><th>Follow-up</th><th></th></tr></thead><tbody>' + list.map(function (a) {
      return '<tr><td>' + esc(day(a.audit_date)) + '</td>' + (withName ? '<td><a href="#fr=' + a.franchisee_id + '">' + esc(a.name) + '</a></td>' : '') + '<td>' + esc(AUDK[a.kind] || a.kind) + '</td><td class="n">' + a.score_pct + '%</td><td><span class="pill' + (a.result === 'pass' ? ' ok' : a.result === 'fail' ? ' bad' : ' warn') + '">' + esc(a.result) + '</span></td><td>' +
        (a.closed_at ? 'closed' : a.follow_up_on ? esc(day(a.follow_up_on)) : '') + '</td><td><button class="sm" data-av="' + a.id + '">Open</button>' + (!a.closed_at && a.result !== 'pass' ? ' <button class="sm" data-ac="' + a.id + '">Close actions</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table>' : '<div class="empty">No audits yet.</div>';
  }
  function wireAudits(root, again) {
    all('[data-av]', root).forEach(function (b) { b.onclick = function () { api('/api/franchise/audits/' + b.getAttribute('data-av')).then(function (r) { var a = r.audit;
      var m = modal('<h2>' + esc(a.name) + ' · ' + esc(day(a.audit_date)) + ' · ' + a.score_pct + '% ' + esc(a.result) + '<button class="sm" style="margin-left:auto" id="avP">Print</button><button class="sm" id="avX">Close</button></h2><p class="sub">' + esc(AUDK[a.kind]) + ' by ' + esc(a.auditor || '') + '</p><table><tbody>' +
        a.items.map(function (i) { return '<tr><td>' + esc(i.section) + '</td><td>' + esc(i.item) + (i.note ? '<br><small>' + esc(i.note) + '</small>' : '') + '</td><td class="n">' + (i.score == null ? 'N/A' : i.score + '/2') + '</td></tr>'; }).join('') + '</tbody></table>' +
        (a.findings ? '<h4>Findings</h4><p>' + esc(a.findings) + '</p>' : '') + (a.actions ? '<h4>Actions</h4><p>' + esc(a.actions) + '</p>' : ''), 2);
      $('#avX', m).onclick = function () { close(2); }; $('#avP', m).onclick = function () { window.print(); }; }).catch(function (e) { toast(e.message); }); }; });
    all('[data-ac]', root).forEach(function (b) { b.onclick = function () { var note = prompt('How were the actions closed?', ''); if (note === null) return; guard(b, api('/api/franchise/audits/' + b.getAttribute('data-ac') + '/close', 'POST', { note: note })).then(again); }; });
  }
  function auditForm(frId, done) {
    var sections = {};
    META.audit_items.forEach(function (x, i) { (sections[x[0]] = sections[x[0]] || []).push([i, x[1]]); });
    var m = modal('<h2>Field audit</h2><div class="grid">' + field('Kind', '<select id="auK">' + opts(META.audit_kinds.map(function (k) { return [k, AUDK[k]]; }), 'routine') + '</select>') + field('Date', inp('auD', today(), 'date')) +
      field('Auditor', '<select id="auA">' + opts(META.staff, '', '(me)') + '</select>') + '</div><p class="sub">2 = meets the standard, 1 = partly, 0 = does not, N/A = does not apply. Pass ' + META.settings.pass_pct + '%+, conditional ' + META.settings.conditional_pct + '%+.</p>' +
      Object.keys(sections).map(function (s) { return '<h4>' + esc(s) + '</h4>' + sections[s].map(function (it) { return '<div class="task"><span>' + esc(it[1]) + '<br><input data-note="' + it[0] + '" placeholder="Note" style="width:100%;margin-top:3px"></span><div class="score" data-i="' + it[0] + '">' +
        ['2', '1', '0', 'N/A'].map(function (v) { return '<button type="button" data-v="' + v + '"' + (v === '2' ? ' class="on"' : '') + '>' + v + '</button>'; }).join(' ') + '</div></div>'; }).join(''); }).join('') +
      '<div class="grid" style="margin-top:10px">' + field('Findings', area('auF', '', 3), true) + field('Actions agreed', area('auAc', '', 3), true) + field('Follow-up visit', inp('auFu', '', 'date')) + '</div>' +
      '<div class="controls"><button class="primary" id="auGo">Save audit</button><button id="auX">Cancel</button></div>', 2);
    all('.score', m).forEach(function (g) { all('button', g).forEach(function (b) { b.onclick = function () { all('button', g).forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); }; }); });
    $('#auX', m).onclick = function () { close(2); };
    $('#auGo', m).onclick = function () {
      var items = META.audit_items.map(function (x, i) { var on = $('.score[data-i="' + i + '"] button.on', m); var v = on ? on.getAttribute('data-v') : 'N/A'; return { section: x[0], item: x[1], score: v === 'N/A' ? null : +v, note: $('[data-note="' + i + '"]', m).value }; });
      guard(this, api('/api/franchise/audits', 'POST', { franchisee_id: frId, kind: val('auK', m), audit_date: val('auD', m), auditor_id: val('auA', m), items: items, findings: val('auF', m), actions: val('auAc', m), follow_up_on: val('auFu', m) })).then(function (r) {
        close(2); toast('Audit saved: ' + r.score_pct + '% (' + r.result + ')' + (r.fails_12m >= 2 ? '. Two failed audits in 12 months: a ground for termination.' : ''));
        if (done) done(); else if (tab === 'audits') audits(); else dash();
      });
    };
  }
  function audits() {
    $('#view').innerHTML = '<div class="card"><h2>Audits and inspections</h2><div class="controls"><div><label>Franchisee</label><select id="auFr"></select></div><button class="primary" id="auNew">+ New audit</button><button id="auPrint">Blank audit form</button></div><div id="auList"><div class="empty">Loading…</div></div></div>';
    api('/api/franchise/franchisees').then(function (d) {
      $('#auFr').innerHTML = opts(d.franchisees.filter(function (f) { return ['open', 'onboarding', 'suspended'].indexOf(f.status) >= 0; }).map(function (f) { return [f.id, f.trading_name || f.legal_name]; }), '', 'Choose…');
    });
    $('#auNew').onclick = function () { var id = +val('auFr'); if (!id) return toast('Choose the franchisee'); auditForm(id); };
    $('#auPrint').onclick = function () { window.open('/api/franchise/templates/audit/preview', '_blank'); };
    api('/api/franchise/audits').then(function (d) { $('#auList').innerHTML = auditTable(d.audits, true); wireAudits($('#auList'), audits); }).catch(function (e) { toast(e.message); });
  }

  // ----------------------------------------------------------- templates --
  function templates() {
    $('#view').innerHTML = '<div class="card"><h2>Franchise documents</h2><div class="warn"><b>These are starting points, not legal advice.</b> They follow common franchise practice (the 23-item disclosure document, the usual agreement terms, a standard operations manual) set to Jamaican terms. Jamaica has no franchise law of its own, so contract, competition, trade-mark, data-protection and tax law all apply. Have a Jamaican attorney review each one before use, then record the review here; until then every copy keeps the notice.</div>' +
      (META.templates_in_docs ? '<p class="sub">Each template is kept in the Document centre (Templates), where a document manager can change the wording. {{words}} in double braces are filled in from the records.</p>' : '<p class="sub">The templates are added to the Document centre the first time it is opened; until then the built-in wording is used.</p>') +
      '<table><thead><tr><th>Template</th><th>Signed by</th><th>Document centre</th><th>Attorney review</th><th></th></tr></thead><tbody>' + META.templates.map(function (t) {
        return '<tr><td><b>' + esc(t.title) + '</b></td><td>' + (t.sign ? (t.countersign ? 'Both sides' : 'The franchisee') : 'Not signed (filed)') + '</td><td>' + (t.document_id ? '<a href="/documents.html#templates" target="_blank" rel="noopener">' + esc(t.doc_number || 'Edit') + ' ›</a>' : '') + '</td><td>' +
          (t.reviewed_at ? '<span class="pill ok">reviewed</span> ' + esc(t.reviewer) + ', ' + esc(day(t.reviewed_at)) : '<span class="pill warn">not yet</span>') + '</td><td><button class="sm" data-pv="' + t.key + '">Preview</button> ' +
          (t.reviewed_at ? '<button class="sm" data-un="' + t.key + '">Withdraw review</button>' : '<button class="sm" data-rv="' + t.key + '">Record review</button>') + '</td></tr>'; }).join('') + '</tbody></table>' +
      '<p class="sub">The operations manual is issued to each franchisee as a numbered copy they sign for (Franchisee > Agreement & documents > Franchise operations manual), and they can read it from their franchisee link.</p></div>';
    all('[data-pv]').forEach(function (b) { b.onclick = function () { window.open('/api/franchise/templates/' + b.getAttribute('data-pv') + '/preview', '_blank'); }; });
    all('[data-rv]').forEach(function (b) { b.onclick = function () { var who = prompt('Which attorney or firm reviewed it?', ''); if (!who) return; guard(b, api('/api/franchise/templates/' + b.getAttribute('data-rv') + '/review', 'POST', { reviewer: who })).then(function () { reloadMeta().then(templates); }); }; });
    all('[data-un]').forEach(function (b) { b.onclick = function () { guard(b, api('/api/franchise/templates/' + b.getAttribute('data-un') + '/review', 'POST', { reviewed: false })).then(function () { reloadMeta().then(templates); }); }; });
  }

  // ------------------------------------------------------------- settings --
  function settingsView() {
    var s = META.settings;
    var F = [['initial_fee', 'Initial franchise fee (J$)'], ['royalty_pct', 'Royalty (% of net sales)'], ['marketing_pct', 'Brand marketing fund (%)'], ['tech_fee', 'Technology fee a month (J$)'], ['min_royalty', 'Minimum royalty a month (J$)'],
      ['renewal_fee', 'Renewal fee (J$)'], ['transfer_fee', 'Transfer fee (J$)'], ['term_years', 'Term (years)'], ['local_marketing_pct', 'Local marketing spend (% of net sales)'], ['gct_rate', 'GCT rate (%)'],
      ['wait_days', 'Days between disclosure and signing'], ['report_day', 'Sales report due (day of month)'], ['royalty_due_day', 'Payment due (day of month)'], ['opening_months', 'Months to open after signing'],
      ['min_capital', 'Minimum cash to invest (J$)'], ['min_net_worth', 'Minimum net worth (J$)'], ['qualify_score', 'Score to qualify (of 100)'], ['renewal_notice_months', 'Warn of renewals (months ahead)'],
      ['pass_pct', 'Audit pass mark (%)'], ['conditional_pct', 'Audit conditional mark (%)'], ['link_days', 'Signing links last (days)']];
    $('#view').innerHTML = '<div class="card"><h2>Franchise settings</h2><p class="sub">The defaults for new franchisees and new documents. Each franchisee can have their own fees (their Details & terms). The starting figures are placeholders: set your own with your accountant and attorney.</p><div class="grid">' +
      F.map(function (x) { return field(x[1], inp('s_' + x[0], s[x[0]])); }).join('') + '</div><div class="controls"><button class="primary" id="sGo">Save</button></div></div>';
    $('#sGo').onclick = function () { var b = {}; F.forEach(function (x) { b[x[0]] = val('s_' + x[0]); }); guard(this, api('/api/franchise/settings', 'PUT', b)).then(function () { toast('Saved'); reloadMeta(); }); };
  }

  var VIEWS = { dash: dash, leads: leads, franchisees: franchisees, territories: territories, billing: billing, performance: performance, audits: audits, templates: templates, settings: settingsView };
  reloadMeta().then(show).catch(function (e) { $('#view').innerHTML = '<div class="card empty">' + esc(/permission|403|not allowed/i.test(e.message) ? 'You need the Franchise permission (Users & Staff > Roles & Permissions).' : e.message) + '</div>'; });
})();
</script>
</body>
</html>
