<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect width="860" height="360" rx="18" fill="#ffffff"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#0b1b2b">Example: sending a contract for a staff member to sign</text>
  <text x="30" y="70" font-size="15" fill="#6b7280">The shop's own e-signing: the page is fingerprinted when it is sent, so it cannot be changed afterwards.</text>
  <g font-size="14" text-anchor="middle"><rect x="30" y="110" width="170" height="62" rx="12" fill="#0b1b2b"/><text x="115" y="137.5" fill="#fff" font-weight="700">Send to sign</text><text x="115" y="154.5" fill="#cbd5e1" font-size="12">fingerprint taken</text><line x1="204" y1="141" x2="236" y2="141" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="240" y="110" width="190" height="62" rx="12" fill="#eef2f7"/><text x="335" y="137.5" fill="#0b1b2b" font-weight="700">They read and sign</text><text x="335" y="154.5" fill="#6b7280" font-size="12">My HR file, or private link</text><line x1="434" y1="141" x2="466" y2="141" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="470" y="110" width="190" height="62" rx="12" fill="#eef2f7"/><text x="565" y="137.5" fill="#0b1b2b" font-weight="700">Signed copy filed</text><text x="565" y="154.5" fill="#6b7280" font-size="12">certificate + seal, restricted</text><line x1="664" y1="141" x2="696" y2="141" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="700" y="110" width="170" height="62" rx="12" fill="#dcfce7" stroke="#15803d"/><text x="785" y="137.5" fill="#0b1b2b" font-weight="700">Seal checks out</text><text x="785" y="154.5" fill="#6b7280" font-size="12">nothing changed since</text></g>
<text x="30" y="222" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">SENSITIVE PAPERS: ASK FOR AN ACCESS CODE</text><text x="30" y="248" font-size="13" fill="#6b7280">• You see the 6-digit code once, when it is sent. Give it by phone or in person, never in the same email.</text><text x="30" y="272" font-size="13" fill="#6b7280">• Five wrong codes lock the link. "New link" makes a fresh link and code; the old ones stop working.</text><text x="30" y="312" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">IF THEY WILL NOT SIGN</text><text x="30" y="338" font-size="13" fill="#6b7280">"I will not sign" asks them why; HR is told and the reason is kept on the To sign tab.</text>
</svg>
