<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect width="860" height="420" rx="18" fill="#ffffff"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#0b1b2b">Example: from first enquiry to an open franchise store</text>
  <text x="30" y="70" font-size="15" fill="#6b7280">The till keeps the order: nothing confidential before the NDA, no agreement before the waiting period ends.</text>
<text x="30" y="108" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">BEFORE THE AGREEMENT</text>  <g font-size="14" text-anchor="middle"><rect x="30" y="120" width="120" height="62" rx="12" fill="#0b1b2b"/><text x="90" y="147.5" fill="#fff" font-weight="700">Enquiry</text><text x="90" y="164.5" fill="#cbd5e1" font-size="12">enquiry form</text><line x1="154" y1="151" x2="176" y2="151" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="180" y="120" width="120" height="62" rx="12" fill="#eef2f7"/><text x="240" y="147.5" fill="#0b1b2b" font-weight="700">Qualify</text><text x="240" y="164.5" fill="#6b7280" font-size="12">score out of 100</text><line x1="304" y1="151" x2="326" y2="151" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="330" y="120" width="120" height="62" rx="12" fill="#eef2f7" stroke="#0b1b2b"/><text x="390" y="156" fill="#0b1b2b" font-weight="700">NDA signed</text><line x1="454" y1="151" x2="476" y2="151" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="480" y="120" width="160" height="62" rx="12" fill="#eef2f7"/><text x="560" y="147.5" fill="#0b1b2b" font-weight="700">Disclosure doc</text><text x="560" y="164.5" fill="#6b7280" font-size="12">they sign for receipt</text><line x1="644" y1="151" x2="666" y2="151" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="670" y="120" width="150" height="62" rx="12" fill="#fef3c7" stroke="#b45309"/><text x="745" y="147.5" fill="#0b1b2b" font-weight="700">14-day wait</text><text x="745" y="164.5" fill="#6b7280" font-size="12">set in Settings</text></g>
<text x="30" y="226" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">SIGNING AND OPENING</text>  <g font-size="14" text-anchor="middle"><rect x="30" y="238" width="130" height="62" rx="12" fill="#eef2f7"/><text x="95" y="265.5" fill="#0b1b2b" font-weight="700">Application</text><text x="95" y="282.5" fill="#6b7280" font-size="12">approve / decline</text><line x1="164" y1="269" x2="186" y2="269" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="190" y="238" width="150" height="62" rx="12" fill="#eef2f7"/><text x="265" y="265.5" fill="#0b1b2b" font-weight="700">Franchisee record</text><text x="265" y="282.5" fill="#6b7280" font-size="12">A/R account + checklist</text><line x1="344" y1="269" x2="366" y2="269" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="370" y="238" width="150" height="62" rx="12" fill="#eef2f7" stroke="#0b1b2b"/><text x="445" y="265.5" fill="#0b1b2b" font-weight="700">Agreement</text><text x="445" y="282.5" fill="#6b7280" font-size="12">they sign, then us</text><line x1="524" y1="269" x2="546" y2="269" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="550" y="238" width="150" height="62" rx="12" fill="#eef2f7"/><text x="625" y="274" fill="#0b1b2b" font-weight="700">Opening checklist</text><line x1="704" y1="269" x2="726" y2="269" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="730" y="238" width="110" height="62" rx="12" fill="#d62828"/><text x="785" y="274" fill="#fff" font-weight="700">OPEN</text></g>
<text x="30" y="340" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">EVERY MONTH AFTER OPENING</text><text x="30" y="366" font-size="13" fill="#6b7280">Sales report → royalty and brand fund invoiced on net sales (gross less refunds and GCT) → paid in Receivables.</text><text x="30" y="390" font-size="13" fill="#6b7280">Audits, renewal, transfer and exit all have their own documents and checklists.</text>
</svg>
