<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track your order · Vision Auto Solutions</title>
<style>
  :root{ --red:#d62828; --ink:#0f1720; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ok:#16a34a; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--red);color:#fff;padding:14px 16px;font-weight:700}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  h1{font-size:22px;margin:0}
  .muted{color:var(--muted)}
  .steps{list-style:none;padding:0;margin:18px 0 0}
  .steps li{position:relative;padding:0 0 18px 30px;border-left:2px solid var(--line);margin-left:9px}
  .steps li:last-child{border-left-color:transparent}
  .steps li::before{content:"";position:absolute;left:-9px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--line)}
  .steps li.done::before{background:var(--ok)}
  .steps b{display:block}
  .big{font-size:18px;font-weight:700;margin-top:10px}
</style>
<link rel="icon" href="/favicon.svg?v=vision2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=vision2" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico?v=vision2" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=vision2">
</head>
<body>
<header>Vision Auto Solutions</header>
<main><div class="card" id="c"><p class="muted">Loading your order…</p></div></main>
<script>
(function () {
  'use strict';
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var t = new URLSearchParams(location.search).get('t') || '';
  var LABEL = { created: 'Order received', pick_start: 'Being picked from the shelves', picked: 'Picked', ready: 'Ready', dispatched: 'On its way', delivered: 'Delivered', collected: 'Collected', cancelled: 'Cancelled' };
  var HEAD = { new: 'We have your order', picking: 'We are getting your parts', picked: 'Your parts are being packed', packed: 'Packed', ready: 'Ready', dispatched: 'On its way', delivered: 'Delivered', collected: 'Collected', cancelled: 'Cancelled', delayed: 'Slight delay: we will contact you' };
  function load() {
    fetch('/api/public/track/' + encodeURIComponent(t)).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (d) {
      var head = HEAD[d.status] || d.status;
      if (d.status === 'ready' && d.method === 'pickup') head = 'Ready for pickup at 112C Waltham Park Road';
      document.getElementById('c').innerHTML = '<h1>Order ' + esc(d.number) + '</h1><div class="muted">' + esc(d.name) + '</div>' +
        '<div class="big">' + esc(head) + '</div>' + (d.tracking_number ? '<div class="muted">' + esc(d.carrier || 'Courier') + ' tracking: ' + esc(d.tracking_number) + '</div>' : '') +
        '<ul class="steps">' + d.timeline.map(function (e) { return '<li class="done"><b>' + esc(LABEL[e.kind] || e.kind) + '</b><span class="muted">' + esc(new Date(e.at).toLocaleString()) + (e.kind === 'collected' || e.kind === 'delivered' ? '' : '') + '</span></li>'; }).join('') + '</ul>' +
        (d.status === 'ready' && d.method === 'pickup' ? '<p>Bring the pickup code we sent you. Open Mon–Fri 8:00–5:30, Sat 8:30–5:30.</p>' : '');
    }).catch(function () { document.getElementById('c').innerHTML = '<h1>Order not found</h1><p class="muted">Check the link in your text message, or call 876-728-4735.</p>'; });
  }
  load(); setInterval(load, 30000);
})();
</script>
</body>
</html>
