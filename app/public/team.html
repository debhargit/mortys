<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team chat and calendar · Vision Auto Solutions</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{ --red:#d62828; --navy:#0b1b2b; --ink:#0f1720; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ok:#16a34a; --warn:#b45309; --chip:#eef2f7; --g:#128c7e; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; --chip:#1f2b38; --warn:#f59e0b; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%}
  body{display:flex;flex-direction:column}
  header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none}
  header h1{font-size:17px;margin:0}
  header nav{margin-left:auto;display:flex;gap:14px;font-size:13px}
  header a{color:#fff;opacity:.85}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px 0;flex:none;max-width:1400px;width:100%;margin:0 auto}
  .tabs button{border-radius:999px;padding:6px 14px;font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  main{flex:1;min-height:0;max-width:1400px;width:100%;margin:0 auto;padding:10px 16px 16px;display:flex;flex-direction:column}
  section{display:none;flex:1;min-height:0;flex-direction:column}
  section.on{display:flex}
  #chatHost{flex:1;min-height:420px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  input,select,button,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  textarea{width:100%;resize:vertical}
  button{cursor:pointer;background:var(--card)}
  button.primary{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
  button.danger{background:var(--red);border-color:var(--red);color:#fff}
  button.sm{padding:3px 9px;font-size:12.5px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  .scroll{overflow:auto}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
  .pill.g{background:#16a34a22;color:var(--ok)} .pill.r{background:#d6282822;color:var(--red)} .pill.y{background:#f59e0b22;color:var(--warn)}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12.5px;min-width:110px}
  .kpi b{font-size:20px;display:block}
  /* calendar */
  .cal-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .cal-bar h2{margin:0 8px;font-size:18px;min-width:180px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:6px 12px}
  .seg button.on{background:var(--navy);color:#fff}
  .filters{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .filters label{display:flex;gap:4px;align-items:center}
  .month{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);flex:1;min-height:520px;grid-auto-rows:1fr}
  .month .dow{padding:6px;font-size:11.5px;text-transform:uppercase;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);background:var(--chip)}
  .day{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;min-height:92px;cursor:pointer;overflow:hidden;min-width:0}
  .day:nth-child(7n){border-right:0}
  .day .n{font-size:12.5px;font-weight:600;display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%}
  .day.out{background:var(--bg)} .day.out .n{color:var(--muted)}
  .day.today .n{background:var(--red);color:#fff}
  .ev{display:block;font-size:12px;border-radius:5px;padding:1px 6px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;cursor:pointer;border:0;width:100%;text-align:left}
  .ev.timed{background:none!important;color:var(--ink);padding-left:4px}
  .ev.timed::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:4px}
  .ev.pending{opacity:.75;font-style:italic}
  .more{font-size:12px;color:var(--muted);padding:0 4px}
  .week{display:grid;grid-template-columns:52px repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--card);flex:1;min-height:520px;align-content:start}
  .week .hd{position:sticky;top:0;background:var(--chip);z-index:2;padding:6px;text-align:center;font-size:12.5px;border-bottom:1px solid var(--line)}
  .week .hd.today{color:var(--red);font-weight:700}
  .week .ad{border-bottom:2px solid var(--line);padding:2px;min-height:26px;border-left:1px solid var(--line)}
  .week .hrs{position:relative}
  .week .hr{height:44px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);text-align:right;padding:0 4px}
  .week .col{position:relative;border-left:1px solid var(--line)}
  .week .slot{height:44px;border-bottom:1px solid var(--line);cursor:pointer}
  .week .slot:hover{background:var(--chip)}
  .week .tev{position:absolute;border-radius:6px;color:#fff;font-size:12px;padding:2px 5px;overflow:hidden;cursor:pointer;border:1px solid #fff4;box-shadow:0 1px 2px #0003}
  .week .now{position:absolute;left:0;right:0;border-top:2px solid var(--red);z-index:1}
  .agenda .d{font-weight:700;margin:14px 0 6px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .agenda .it{display:flex;gap:12px;align-items:center;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
  .agenda .it .bar{width:5px;align-self:stretch;border-radius:3px}
  .agenda .it .tm{width:120px;font-size:12.5px;color:var(--muted);flex:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9990;padding:16px}
  .modal>div{background:var(--card);border-radius:14px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .modal h3{margin:0 0 10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .grid2 label,.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
  .grid2 input,.grid2 select,.fld input,.fld select,.fld textarea{color:var(--ink)}
  .full{grid-column:1/-1}
  .pick{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .pick label{display:flex;flex-direction:row;gap:8px;align-items:center;padding:5px 9px;border-bottom:1px solid var(--line);color:var(--ink);font-size:13.5px}
  .att{display:flex;gap:6px;flex-wrap:wrap}
  @media (max-width:640px){ .grid2{grid-template-columns:1fr} .day{min-height:64px} .ev{font-size:10.5px} .agenda .it .tm{width:80px} }
  /* management */
  .mtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
  .mtabs button{border-radius:999px;padding:4px 12px;font-size:13px}
  .mtabs button.on{background:var(--g);border-color:var(--g);color:#fff}
  .tx{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:62vh;overflow:auto}
  .tx .m{padding:6px 8px;border-bottom:1px solid var(--line)}
  .tx .m.del{background:#d6282812}
  .tx .m .h{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
  .tx .m .b{white-space:pre-wrap}
  .split{display:grid;grid-template-columns:minmax(300px,1fr) 1.4fr;gap:12px}
  @media (max-width:900px){ .split{grid-template-columns:1fr} }
  tr.click{cursor:pointer} tr.click:hover{background:var(--chip)} tr.sel{background:var(--chip)}
</style>
</head>
<body>
<header>
  <h1>💬 Team chat and calendar</h1>
  <nav><a href="/admin.html">Back office</a><a href="/training.html#manual" target="_blank" rel="noopener">Help</a></nav>
</header>
<div class="tabs" id="tabs">
  <button data-t="chat" class="on">💬 Chats<span id="cntChat"></span></button>
  <button data-t="calendar">📅 Calendar</button>
  <button data-t="manage" id="tabManage" hidden>🛡 Manage correspondence</button>
</div>
<main>
  <section id="s-chat" class="on"><div id="chatHost" data-team-full><p class="muted" style="padding:20px">Loading the chat…</p></div></section>

  <section id="s-calendar">
    <div class="cal-bar">
      <button id="calPrev" title="Previous">‹</button><button id="calToday">Today</button><button id="calNext" title="Next">›</button>
      <h2 id="calTitle"></h2>
      <span class="seg" id="calView"><button data-v="month">Month</button><button data-v="week">Week</button><button data-v="list">List</button></span>
      <button class="primary" id="calNew" style="margin-left:auto">+ New event</button>
    </div>
    <div class="filters" id="calFilters">
      <label><input type="checkbox" data-f="events" checked> Events</label>
      <label><input type="checkbox" data-f="leave" checked> Who is off</label>
      <label><input type="checkbox" data-f="holiday" checked> Public holidays</label>
      <label><input type="checkbox" data-f="shifts"> My shifts</label>
      <label id="fInterviews" hidden><input type="checkbox" data-f="interview" checked> Interviews</label>
      <span id="calNote"></span>
    </div>
    <div id="calBody" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
  </section>

  <section id="s-manage" style="overflow:auto">
    <div class="kpis" id="mKpis"></div>
    <div class="mtabs" id="mTabs">
      <button data-m="convs" class="on">Conversations</button><button data-m="search">Search messages</button><button data-m="memos">Memos and announcements</button>
      <button data-m="online">Who is online</button><button data-m="calls">Call log</button><button data-m="sos">Emergencies</button><button data-m="audit">Management access log</button><button data-m="settings">Settings</button>
    </div>
    <div id="mBody"></div>
  </section>
</main>

<script src="/assets/team-chat.js?v=3"></script>
<script>
(function(){
  'use strict';
  var T = null, CFG = null;
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function $(s, r){ return (r || document).querySelector(s); }
  function api(m, u, b){ return T.api(m, u, b); }
  function toast(t, b){ T.toast(t, b); }
  function dt(x){ return new Date(x); }
  function pad(n){ return ('0' + n).slice(-2); }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hhmm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function tm(d){ return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function when(x){ var d = dt(x); return d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' ' + tm(d); }
  function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function startOfDay(d){ var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function sameDay(a, b){ return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function modal(html, wire){
    var m = document.createElement('div'); m.className = 'modal'; m.innerHTML = '<div>' + html + '</div>';
    document.body.appendChild(m);
    m.addEventListener('click', function(e){ if (e.target === m || e.target.closest('[data-close]')) m.remove(); });
    m.addEventListener('keydown', function(e){ if (e.key === 'Escape') m.remove(); });
    if (wire) wire(m.firstElementChild, function(){ m.remove(); });
    return m;
  }

  // ---------------------------------------------------------------- tabs --
  var tab = 'chat';
  function show(t){
    if (t === 'manage' && !(CFG && CFG.caps.oversee)) t = 'chat';
    tab = t;
    document.querySelectorAll('#tabs [data-t]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-t') === t); });
    document.querySelectorAll('main section').forEach(function(s){ s.classList.toggle('on', s.id === 's-' + t); });
    if (T) T.setVisible(t === 'chat');
    if (t === 'calendar') Cal.load();
    if (t === 'manage') Mg.load();
  }
  document.querySelectorAll('#tabs [data-t]').forEach(function(b){ b.onclick = function(){ var t = b.getAttribute('data-t'); history.replaceState(null, '', t === 'chat' ? location.pathname : '#' + t); show(t); }; });

  function boot(){
    T = window.VisionTeam;
    T.ready.then(function(cfg){
      CFG = cfg;
      $('#tabManage').hidden = !cfg.caps.oversee;
      $('#fInterviews').hidden = !cfg.caps.hr;
      T.on('badges', function(b){ $('#cntChat').textContent = b.chats ? ' (' + b.chats + ')' : ''; });
      T.on('event', function(){ if (tab === 'calendar') Cal.load(); });
      T.mount($('#chatHost'));
      var h = location.hash;
      if (/^#calendar/.test(h)) { show('calendar'); var m = /calendar=(\d+)/.exec(h); if (m) Cal.detail(Number(m[1])); }
      else if (/^#manage/.test(h)) { show('manage'); var mm = /manage=(\w+)/.exec(h); if (mm) Mg.go(mm[1]); }
      else show('chat');
    }).catch(function(e){
      $('#chatHost').innerHTML = '<div class="card" style="margin:20px">' + (e.status === 401 ? 'Please <a href="/admin.html">sign in to the back office</a> first, then come back to this page.' : esc(e.message)) + '</div>';
    });
  }
  window.addEventListener('hashchange', function(){ var m = /calendar=(\d+)/.exec(location.hash); if (m) { show('calendar'); Cal.detail(Number(m[1])); } });

  // ------------------------------------------------------------ calendar --
  var COLORS = { meeting:'#2563eb', training:'#7c3aed', shift:'#475569', deadline:'#dc2626', leave:'#d97706', holiday:'#16a34a', social:'#db2777', other:'#6b7280', interview:'#0d9488' };
  var KIND_LABEL = { meeting:'Meeting', training:'Training', shift:'Shift / roster', deadline:'Deadline', leave:'Time off', holiday:'Holiday / closure', social:'Staff social', other:'Other' };
  var Cal = (function(){
    var view = (function(){ try { return localStorage.getItem('vtc-cal-view') || 'month'; } catch(_) { return 'month'; } })();
    var cursor = startOfDay(new Date()), items = [], filters = { events: true, leave: true, holiday: true, shifts: false, interview: true }, loading = 0;
    function range(){
      if (view === 'month') { var f = new Date(cursor.getFullYear(), cursor.getMonth(), 1); f = addDays(f, -f.getDay()); return [f, addDays(f, 42)]; }
      if (view === 'week') { var w = addDays(cursor, -cursor.getDay()); return [w, addDays(w, 7)]; }
      return [startOfDay(cursor), addDays(startOfDay(cursor), 60)];
    }
    function title(){
      if (view === 'month') return cursor.toLocaleDateString([], { month: 'long', year: 'numeric' });
      var r = range(), e = addDays(r[1], -1);
      return r[0].toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' – ' + e.toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
    }
    function load(){
      var r = range(), n = ++loading;
      $('#calTitle').textContent = title();
      document.querySelectorAll('#calView [data-v]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-v') === view); });
      return api('GET', '/api/team/events?from=' + encodeURIComponent(r[0].toISOString()) + '&to=' + encodeURIComponent(r[1].toISOString())).then(function(res){
        if (n !== loading) return;
        items = [];
        res.events.forEach(function(e){
          var s = dt(e.start), en = dt(e.end);
          items.push({ key: 'e' + e.id + '-' + e.start, id: e.id, title: e.title, start: s, end: en, allDay: e.all_day || (en - s >= 86400000 * 0.99 && s.getHours() === 0), kind: e.kind, color: COLORS[e.kind] || COLORS.other, src: 'events', ev: e, pending: e.my_response === 'pending' });
        });
        res.extra.forEach(function(x){
          if (x.source === 'shifts') {
            for (var d = new Date(r[0]); d < r[1]; d = addDays(d, 1)) x.pattern.forEach(function(p){
              if (p.weekday !== d.getDay()) return;
              var s = new Date(ymd(d) + 'T' + p.s), e = new Date(ymd(d) + 'T' + p.e);
              items.push({ key: 'sh' + ymd(d), title: 'My shift', start: s, end: e, allDay: false, kind: 'shift', color: COLORS.shift, src: 'shifts' });
            });
            return;
          }
          var s2 = x.all_day ? new Date(x.start + 'T00:00') : dt(x.start), e2 = x.all_day ? new Date(x.end + 'T23:59') : dt(x.end);
          items.push({ key: x.id, title: x.title, start: s2, end: e2, allDay: !!x.all_day, kind: x.kind, color: COLORS[x.source] || COLORS[x.kind], src: x.source, link: x.link });
        });
        items.sort(function(a, b){ return (b.allDay - a.allDay) || (a.start - b.start); });
        draw();
      }).catch(function(e){ $('#calBody').innerHTML = '<div class="card">' + esc(e.message) + '</div>'; });
    }
    function shown(){ return items.filter(function(i){ return filters[i.src] !== false; }); }
    function onDay(d){ var a = startOfDay(d), b = addDays(a, 1); return shown().filter(function(i){ return i.start < b && i.end > a || (sameDay(i.start, a)); }); }
    function chip(i){
      var t = i.allDay ? '' : tm(i.start) + ' ';
      return '<button class="ev' + (i.allDay ? '' : ' timed') + (i.pending ? ' pending' : '') + '" style="background:' + i.color + ';--c:' + i.color + '" data-k="' + esc(i.key) + '" title="' + esc(t + i.title + (i.pending ? ' (you have not replied)' : '')) + '">' + esc(t + i.title) + '</button>';
    }
    function draw(){
      var host = $('#calBody'), r = range(), today = new Date();
      if (view === 'month') {
        var html = '<div class="month">' + ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(x){ return '<div class="dow">' + x + '</div>'; }).join('');
        for (var d = new Date(r[0]); d < r[1]; d = addDays(d, 1)) {
          var list = onDay(d), max = 3;
          html += '<div class="day' + (d.getMonth() !== cursor.getMonth() ? ' out' : '') + (sameDay(d, today) ? ' today' : '') + '" data-day="' + ymd(d) + '"><span class="n">' + d.getDate() + '</span>' +
            list.slice(0, max).map(chip).join('') + (list.length > max ? '<div class="more">+' + (list.length - max) + ' more</div>' : '') + '</div>';
        }
        host.innerHTML = html + '</div>';
      } else if (view === 'week') {
        var H0 = 6, H1 = 22, PX = 44;
        var w = '<div class="week"><div class="hd"></div>';
        for (var i = 0; i < 7; i++) { var dd = addDays(r[0], i); w += '<div class="hd' + (sameDay(dd, today) ? ' today' : '') + '">' + dd.toLocaleDateString([], { weekday: 'short', day: 'numeric' }) + '</div>'; }
        w += '<div class="ad" style="border-left:0;font-size:11px;color:var(--muted);text-align:right;padding-right:4px">all day</div>';
        for (i = 0; i < 7; i++) w += '<div class="ad" data-day="' + ymd(addDays(r[0], i)) + '">' + onDay(addDays(r[0], i)).filter(function(x){ return x.allDay; }).map(chip).join('') + '</div>';
        w += '<div class="hrs">'; for (var h = H0; h < H1; h++) w += '<div class="hr">' + (h % 12 || 12) + (h < 12 ? 'am' : 'pm') + '</div>'; w += '</div>';
        for (i = 0; i < 7; i++) {
          var day = addDays(r[0], i), col = '<div class="col">';
          for (h = H0; h < H1; h++) col += '<div class="slot" data-slot="' + ymd(day) + 'T' + pad(h) + ':00"></div>';
          var timed = onDay(day).filter(function(x){ return !x.allDay; }), lanes = [];
          timed.forEach(function(x){ var l = 0; while (lanes[l] && lanes[l] > x.start) l++; lanes[l] = x.end; x.lane = l; });
          var nl = Math.max(1, lanes.length);
          timed.forEach(function(x){
            var a = Math.max(H0 * 60, x.start.getHours() * 60 + x.start.getMinutes() + (sameDay(x.start, day) ? 0 : -1440)), b = Math.min(H1 * 60, sameDay(x.end, day) ? x.end.getHours() * 60 + x.end.getMinutes() : H1 * 60);
            if (b <= a) b = a + 30;
            col += '<div class="tev" data-k="' + esc(x.key) + '" style="background:' + x.color + ';top:' + ((a - H0 * 60) / 60 * PX) + 'px;height:' + Math.max(20, (b - a) / 60 * PX - 2) + 'px;left:' + (x.lane / nl * 100) + '%;width:calc(' + (100 / nl) + '% - 3px)' + (x.pending ? ';opacity:.75' : '') + '"><b>' + esc(tm(x.start)) + '</b> ' + esc(x.title) + '</div>';
          });
          if (sameDay(day, today)) { var nm = today.getHours() * 60 + today.getMinutes(); if (nm >= H0 * 60 && nm < H1 * 60) col += '<div class="now" style="top:' + ((nm - H0 * 60) / 60 * PX) + 'px"></div>'; }
          w += col + '</div>';
        }

        var op = v.querySelector('[data-open]'); if (op) op.onclick = function(){ show('chat'); history.replaceState(null, '', location.pathname); T.openChat(id); };
        v.querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(){ var why = prompt('Delete this message for everyone? Reason (kept in the access log):'); if (why === null) return; api('DELETE', '/api/team/messages/' + b.getAttribute('data-del'), { reason: why }).then(function(){ transcript(id); }).catch(function(e){ toast('Not deleted', e.message); }); }; });
        v.querySelectorAll('[data-restore]').forEach(function(b){ b.onclick = function(){ api('POST', '/api/team/messages/' + b.getAttribute('data-restore') + '/restore').then(function(){ transcript(id); }).catch(function(e){ toast('Not restored', e.message); }); }; });
      }).catch(function(e){ v.innerHTML = esc(e.message); });
    }
    function search(host){
      var ppl = T.state.people;
      host.innerHTML = '<div class="card"><div class="row"><input type="search" id="sQ" placeholder="Words to find (also finds edited and deleted wording)" style="flex:1;min-width:220px"><select id="sU"><option value="">Anyone</option>' + ppl.map(function(p){ return '<option value="' + p.id + '">' + esc(p.name) + '</option>'; }).join('') + '</select>' +
        '<input type="date" id="sF" title="From"><input type="date" id="sT" title="To"><button class="primary" id="sGo">Search</button></div><div id="sOut" style="margin-top:10px"></div></div>';
      var go2 = function(){
        api('GET', '/api/team/admin/search?q=' + encodeURIComponent($('#sQ').value) + '&user=' + $('#sU').value + '&from=' + $('#sF').value + '&to=' + $('#sT').value).then(function(r){
          $('#sOut').innerHTML = r.results.length ? '<div class="scroll"><table><tr><th>When</th><th>From</th><th>Conversation</th><th>Message</th></tr>' + r.results.map(function(m){
            return '<tr class="click" data-c="' + m.conversation_id + '"><td class="small">' + esc(when(m.created_at)) + '</td><td>' + esc(m.sender_name || '') + '</td><td>' + esc(m.conv_title || '') + '</td><td>' + (m.subject ? '<b>' + esc(m.subject) + '</b> ' : '') + esc(m.body || '') + (m.file_name ? ' 📎 ' + esc(m.file_name) : '') +
              (m.edited && m.original_body ? '<div class="small muted">First written: ' + esc(m.original_body) + '</div>' : '') + (m.deleted ? ' <span class="pill r">deleted</span>' : '') + '</td></tr>';
          }).join('') + '</table></div>' : '<p class="muted">Nothing found.</p>';
          $('#sOut').querySelectorAll('[data-c]').forEach(function(tr){ tr.onclick = function(){ sel = Number(tr.getAttribute('data-c')); go('convs'); }; });
        }).catch(function(e){ $('#sOut').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; });
      };
      $('#sGo').onclick = go2; $('#sQ').onkeydown = function(e){ if (e.key === 'Enter') go2(); };
    }
    function memos(host){
      api('GET', '/api/team/admin/memos').then(function(r){
        host.innerHTML = '<div class="card"><div class="row" style="margin-bottom:8px"><b style="flex:1">Memos and announcements</b>' + (CFG.caps.announce ? '<button class="primary" id="mAnn">📢 New announcement to all staff</button>' : '') + '</div>' +
          (r.memos.length ? '<div class="scroll"><table><tr><th>Sent</th><th>Subject</th><th>To</th><th>Seen</th><th>Acknowledged</th><th>Still to acknowledge</th><th></th></tr>' + r.memos.map(function(m){
            return '<tr><td class="small">' + esc(when(m.created_at)) + '<div class="muted">' + esc(m.sender_name || '') + '</div></td><td><b>' + esc(m.subject) + '</b></td><td>' + esc(m.conv_title || 'one-to-one') + '</td><td>' + m.seen + ' / ' + m.recipients + '</td>' +
              '<td>' + (m.require_ack ? '<span class="pill ' + (m.acks >= m.recipients ? 'g' : 'y') + '">' + m.acks + ' / ' + m.recipients + '</span>' : '<span class="muted small">not asked</span>') + '</td><td class="small">' + (m.require_ack ? esc(m.waiting || '—') : '') + '</td>' +
              '<td>' + (m.require_ack && m.acks < m.recipients ? '<button class="sm" data-nudge="' + m.id + '">Remind them</button>' : '') + '</td></tr>';
          }).join('') + '</table></div>' : '<p class="muted">No memos yet. Send one from the 📢 button in the chat.</p>') + '</div>';
        var a = $('#mAnn'); if (a) a.onclick = function(){ T.announce(); };
        host.querySelectorAll('[data-nudge]').forEach(function(b){ b.onclick = function(){ api('POST', '/api/team/admin/memos/' + b.getAttribute('data-nudge') + '/nudge').then(function(x){ toast('Reminder sent', 'To ' + x.reminded + ' staff'); }).catch(function(e){ toast('Not sent', e.message); }); }; });
      }).catch(function(e){ host.innerHTML = esc(e.message); });
    }
    function online(host){
      api('GET', '/api/team/people').then(function(r){
        var ppl = r.people.slice().sort(function(a, b){ return (b.online - a.online) || a.name.localeCompare(b.name); });
        host.innerHTML = '<div class="card"><p class="sub">' + ppl.filter(function(p){ return p.online; }).length + ' of ' + ppl.length + ' staff have the chat open right now.</p><div class="scroll"><table><tr><th>Staff</th><th>Role</th><th>Chat</th><th>Status</th><th>Today</th><th>Last seen</th><th></th></tr>' + ppl.map(function(p){
          return '<tr><td>' + T.avatar(p.id, p.name, { small: true, dot: p.online ? 'on' : 'off' }) + ' <b>' + esc(p.name) + '</b></td><td>' + esc(p.role || '') + '</td><td>' + (p.online ? '<span class="pill g">online</span>' : '<span class="pill">offline</span>') + '</td>' +
            '<td>' + esc({ available: 'Available', busy: 'Busy', away: 'Away', dnd: 'Do not disturb' }[p.status] || '') + (p.status_text ? ' · ' + esc(p.status_text) : '') + '</td><td>' + (p.on_leave ? '<span class="pill y">on leave</span>' : p.clocked_in ? '<span class="pill g">clocked in' + (p.clocked_in === 'remote' ? ' (remote)' : '') + '</span>' : '') + '</td>' +
            '<td class="small">' + esc(p.last_seen ? when(p.last_seen) : '—') + '</td><td>' + (p.id !== CFG.me.id ? '<button class="sm" data-dm="' + p.id + '">💬</button>' : '') + '</td></tr>';
        }).join('') + '</table></div></div>';
        host.querySelectorAll('[data-dm]').forEach(function(b){ b.onclick = function(){ show('chat'); history.replaceState(null, '', location.pathname); T.startDirect(Number(b.getAttribute('data-dm'))); }; });
      }).catch(function(e){ host.innerHTML = esc(e.message); });
    }
    function calls(host){
      api('GET', '/api/team/admin/calls').then(function(r){
        host.innerHTML = '<div class="card"><p class="sub">Calls go directly between the staff browsers. Nothing is recorded; this is only who called whom and for how long.</p>' + (r.calls.length ? '<div class="scroll"><table><tr><th>When</th><th>Type</th><th>Conversation</th><th>Started by</th><th>Joined</th><th>Length</th></tr>' + r.calls.map(function(c){
          return '<tr><td class="small">' + esc(when(c.started_at)) + '</td><td>' + (c.media === 'video' ? '🎥 video' : '📞 voice') + '</td><td>' + esc(c.conv_title || '') + '</td><td>' + esc(c.started_by_name || '') + '</td><td class="small">' + esc(c.joined_names) + '</td><td>' + (c.live ? '<span class="pill g">live</span>' : c.answered ? (c.seconds < 60 ? c.seconds + ' s' : Math.round(c.seconds / 60) + ' min') : '<span class="pill r">missed</span>') + '</td></tr>';
        }).join('') + '</table></div>' : '<p class="muted">No calls yet.</p>') + '</div>';
      }).catch(function(e){ host.innerHTML = esc(e.message); });
    }
    function sos(host){
      api('GET', '/api/team/admin/emergencies').then(function(r){
        host.innerHTML = '<div class="card"><div class="row" style="margin-bottom:8px"><p class="sub" style="flex:1;margin:0">Every emergency alarm raised from the 🚨 button in the chat, who answered and how it ended.</p><button class="primary" id="sosNew">🚨 Raise an emergency</button></div>' + (r.emergencies.length ? '<div class="scroll"><table><tr><th>Raised</th><th>What</th><th>Where</th><th>Answers</th><th>Ended</th></tr>' + r.emergencies.map(function(e){
          return '<tr><td class="small">' + esc(when(e.raised_at)) + '<div class="muted">' + esc(e.raised_by_name || '') + (e.raised_ip ? ' · ' + esc(e.raised_ip) : '') + '</div></td><td><b>' + esc(e.label) + '</b>' + (e.silent ? ' <span class="pill">silent</span>' : '') + (e.details ? '<div class="small">' + esc(e.details) + '</div>' : '') + '</td><td>' + esc(e.location || '') + '</td>' +
            '<td><span class="pill g">' + e.safe + ' safe</span> ' + (e.responding ? '<span class="pill">' + e.responding + ' on the way</span> ' : '') + (e.help ? '<span class="pill r">' + e.help + ' needed help</span>' : '') + (e.replies ? '<div class="small muted">' + esc(e.replies) + '</div>' : '') + '</td>' +
            '<td>' + (e.ended_at ? '<span class="pill ' + (e.outcome === 'false_alarm' ? 'y' : 'g') + '">' + (e.outcome === 'false_alarm' ? 'false alarm' : 'all clear') + '</span><div class="small muted">' + esc(when(e.ended_at)) + ' · ' + esc(e.ended_by_name || '') + (e.end_note ? '<br>' + esc(e.end_note) : '') + '</div>' : '<span class="pill r">still on</span>') + '</td></tr>';
        }).join('') + '</table></div>' : '<p class="muted">No emergencies raised yet.</p>') + '</div>';
        $('#sosNew').onclick = function(){ T.emergency(); };
      }).catch(function(e){ host.innerHTML = esc(e.message); });
    }
    function audit(host){
      api('GET', '/api/team/admin/audit').then(function(r){
        host.innerHTML = '<div class="card"><p class="sub">Every time management reads a conversation they are not in, searches, deletes or restores a message, or exports a chat.</p>' + (r.entries.length ? '<div class="scroll"><table><tr><th>When</th><th>Manager</th><th>Did</th><th>Conversation</th><th>Detail</th></tr>' + r.entries.map(function(a){
          return '<tr><td class="small">' + esc(when(a.at)) + '</td><td>' + esc(a.name || '') + '</td><td>' + esc(a.action) + '</td><td>' + esc(a.conv_title || '') + '</td><td class="small">' + esc(a.detail || '') + '</td></tr>';
        }).join('') + '</table></div>' : '<p class="muted">Nothing yet.</p>') + '</div>';
      }).catch(function(e){ host.innerHTML = esc(e.message); });
    }
    function settings(host){
      api('GET', '/api/team/settings').then(function(r){
        host.innerHTML = '<div class="card"><h3 style="margin-top:0">Calls across the internet</h3><p class="sub">Calls on the shop network work as they are. For staff calling in from outside (phones on mobile data, home), the browsers find each other through a STUN server, and a few networks also need a TURN relay. Leave blank for the default (Google’s public STUN server).</p>' +
          '<textarea id="ice" rows="6" style="font-family:ui-monospace,monospace;font-size:12.5px" placeholder=\'[{"urls":"stun:stun.l.google.com:19302"},{"urls":"turn:turn.example.com:3478","username":"…","credential":"…"}]\'>' + esc(r.custom ? JSON.stringify(r.ice_servers, null, 1) : '') + '</textarea>' +
          '<h3>Keep messages</h3><p class="sub">Delete chat messages and files older than this many days (memos are kept). 0 keeps everything.</p><input type="number" id="ret" min="0" max="3650" value="' + r.retention_days + '" style="width:120px"> days' +
          '<div class="row" style="margin-top:12px"><button class="primary" id="sv">Save</button></div></div>';
        $('#sv').onclick = function(){
          var raw = $('#ice').value.trim(), list = null;
          if (raw) { try { list = JSON.parse(raw); } catch(_) { return toast('The server list is not valid JSON'); } }
          api('PUT', '/api/team/settings', { ice_servers: list, retention_days: Number($('#ret').value) || 0 }).then(function(){ toast('Saved'); }).catch(function(e){ toast('Not saved', e.message); });
        };
      }).catch(function(e){ host.innerHTML = esc(e.message); });
    }
    document.querySelectorAll('#mTabs [data-m]').forEach(function(b){ b.onclick = function(){ go(b.getAttribute('data-m')); }; });
    return { load: load, go: go };
  })();

  boot();
})();
</script>
<script src="/assets/staff-assist.js?v=20261030" defer></script>
</body>
</html>
