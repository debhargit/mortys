<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Careers · Vision Auto Solutions</title>
<meta name="description" content="Work with Vision Auto Solutions, Kingston: open jobs and how to apply.">
<style>
  :root{ --red:#d62828; --navy:#0b1b2b; --ink:#0f1720; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ok:#16a34a; --warn:#b45309; --chip:#eef2f7; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; --chip:#1f2b38; --warn:#f59e0b; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--navy);color:#fff;padding:22px 16px} header .in{max-width:820px;margin:0 auto} header h1{margin:0 0 4px;font-size:26px} header p{margin:0;opacity:.85} header a{color:#fff}
  main{max-width:820px;margin:0 auto;padding:16px 16px 50px}
  .job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .job h2{margin:0;font-size:19px} .meta{color:var(--muted);font-size:14px;margin:2px 0 8px}
  .job details summary{cursor:pointer;color:var(--red);font-weight:600}
  .job.hit{outline:2px solid var(--red)}
  .pre{white-space:pre-wrap}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px} .filters input{flex:1;min-width:180px} .filters select{width:auto}
  label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
  input[type=file]{padding:8px}
  button{font:inherit;padding:11px 18px;border-radius:9px;border:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
  button.sm{padding:6px 12px;font-size:14px}
  button:disabled{opacity:.6}
  .check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:14px} .check input{width:auto;margin-top:4px}
  .yn{display:flex;gap:16px} .yn label{display:flex;gap:6px;align-items:center;color:var(--ink);margin:0} .yn input{width:auto}
  .ok{background:#16a34a18;border-left:3px solid var(--ok);padding:12px 14px;border-radius:8px}
  .warn{background:#f59e0b18;border-left:3px solid var(--warn);padding:10px 12px;border-radius:8px}
  .err{color:var(--red);font-size:14px;min-height:1em}
  .hp{position:absolute;left:-9999px}
  .empty{color:var(--muted);text-align:center;padding:30px}
  .tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:middle}
  .share{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:10px} .share a{color:var(--red)}
  .docs{list-style:none;padding:0;margin:6px 0} .docs li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:15px} .docs small{color:var(--muted)}
  h3{margin:18px 0 6px;font-size:16px}
</style>
<link rel="icon" href="/favicon.svg?v=vision2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=vision2" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico?v=vision2" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=vision2">
<script src="/assets/vas-ui.js?v=20261110b"></script>
</head>
<body>
<header><div class="in"><h1 id="h1">Work with us</h1><p>Vision Auto Solutions · Kingston, Jamaica · <a href="/">Back to the shop</a></p></div></header>
<main id="m"><div class="empty">Loading open jobs…</div></main>
<script>
(function () {
  'use strict';
  var m = document.getElementById('m');
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var KIND = { full_time: 'Full time', part_time: 'Part time', contract: 'Contract', freelance_rep: 'Freelance sales rep (commission)' };
  var GKIND = { full_time: 'FULL_TIME', part_time: 'PART_TIME', contract: 'CONTRACTOR', freelance_rep: 'CONTRACTOR' };
  var ACCEPT_DOC = '.pdf,.doc,.docx,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png';
  var MAX = 5 * 1024 * 1024;
  var params = new URLSearchParams(location.search);
  var day = function (t) { return t ? new Date(t).toLocaleDateString('en-JM', { day: 'numeric', month: 'long', year: 'numeric' }) : ''; };
  function getJson(url, opts) {
    return fetch(url, opts).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; }); });
  }

  // ---------------------------------------------------- the applicant's page --
  if (params.get('app')) return statusPage(params.get('app'));
  if (params.get('offer')) return offerPage(params.get('offer'));

  function statusPage(token) {
    document.getElementById('h1').textContent = 'Your application';
    document.title = 'Your application · Vision Auto Solutions';
    var base = '/api/public/applications/' + encodeURIComponent(token);
    function draw(v, flash) {
      m.innerHTML = '<div class="job">' + (flash ? '<div class="ok" style="margin-bottom:12px">' + esc(flash) + '</div>' : '') +
        '<h2>' + esc(v.job || 'Application') + '</h2><div class="meta">Reference ' + esc(v.ref) + ' · applied ' + esc(day(v.applied)) + '</div>' +
        '<p><b>Where it is:</b> ' + esc(v.stage) + '</p>' +
        '<h3>What we have</h3><ul class="docs">' + (v.cv ? '<li><span>CV</span><small>' + esc(v.cv) + '</small></li>' : '') +
          v.documents.map(function (d) { return '<li><span>' + esc(d.label) + '</span><small>' + esc(d.orig_name || '') + ' · ' + esc(day(d.uploaded_at)) + '</small></li>'; }).join('') +
          (!v.cv && !v.documents.length ? '<li><small>No files yet.</small></li>' : '') + '</ul>' +
        (v.missing.length ? '<div class="warn"><b>We still need:</b> ' + esc(v.missing.map(function (d) { return d.label; }).join(', ')) + '</div>' : '') +
        (v.can_add
          ? '<form id="up"><h3>Add a document</h3><label>Which document</label><select name="which">' +
              v.asked_for.map(function (d) { return '<option value="' + esc(d.key) + '">' + esc(d.label) + (d.required ? ' (needed)' : '') + '</option>'; }).join('') +
              '<option value="other">Something else</option></select>' +
              '<label>File (PDF, Word, JPG or PNG, up to 5 MB; a clear phone photo is fine)</label><input type="file" name="file" accept="' + ACCEPT_DOC + '">' +
              '<p class="err" role="alert"></p><button type="submit">Upload</button></form>'
          : '<p class="meta">This application is closed, so documents can no longer be added.</p>') +
        '<h3>Withdraw</h3><p class="meta">Withdrawing deletes your details, CV and documents now. We otherwise keep them until ' + esc(day(v.retain_until)) + '.</p>' +
        '<button class="ghost sm" id="wd">Withdraw and delete my application</button></div>';
      var f = document.getElementById('up');
      if (f) f.addEventListener('submit', function (e) {
        e.preventDefault();
        var err = f.querySelector('.err'), btn = f.querySelector('button'), file = f.file.files[0];
        err.textContent = '';
        if (!file) { err.textContent = 'Choose a file first.'; return; }
        if (file.size > MAX) { err.textContent = 'The file must be 5 MB or smaller.'; return; }
        var fd = new FormData(); fd.append('doc_' + f.which.value, file);
        btn.disabled = true; btn.textContent = 'Uploading…';
        getJson(base + '/documents', { method: 'POST', body: fd })
          .then(function (r) { draw(r.view, 'Thank you. We have it.'); })
          .catch(function (er) { err.textContent = er.message; btn.disabled = false; btn.textContent = 'Upload'; });
      });
      document.getElementById('wd').addEventListener('click', async function () {
        if (!(await vasConfirm('Withdraw your application and delete your details, CV and documents? This cannot be undone.'))) return;
        getJson(base, { method: 'DELETE' })
          .then(function () { m.innerHTML = '<div class="job"><div class="ok">Your application has been withdrawn and your details deleted. Thank you for your interest.</div></div>'; })
          .catch(async function (er) { await vasAlert(er.message); });
      });
    }
    getJson(base).then(function (v) { draw(v); })
      .catch(function (e) { m.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }

  // ------------------------------------------------------------ the jobs --
  getJson('/api/public/jobs').then(function (d) {
    var jobs = d.jobs || [];
    if (!jobs.length) { m.innerHTML = '<div class="empty">No openings right now. Please check back soon.</div>'; return; }
    jsonLd(jobs);
    var depts = jobs.map(function (j) { return j.department; }).filter(function (x, i, a) { return x && a.indexOf(x) === i; });
    m.innerHTML = (jobs.length > 3
        ? '<div class="filters"><input id="fq" type="search" placeholder="Search jobs"><select id="fk"><option value="">Any type</option>' +
            Object.keys(KIND).filter(function (k) { return jobs.some(function (j) { return j.kind === k; }); }).map(function (k) { return '<option value="' + k + '">' + KIND[k] + '</option>'; }).join('') + '</select>' +
            (depts.length > 1 ? '<select id="fd"><option value="">Any department</option>' + depts.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '</select>' : '') + '</div>'
        : '') +
      jobs.map(jobHtml).join('') + '<div class="empty" id="none" hidden>No jobs match.</div>';
    jobs.forEach(function (j) { wireForm(j, d.consent); });
    ['fq', 'fk', 'fd'].forEach(function (id) { var el = document.getElementById(id); if (el) el.addEventListener('input', filter); });
    function filter() {
      var q = (document.getElementById('fq').value || '').toLowerCase(), k = document.getElementById('fk').value, dd = document.getElementById('fd') ? document.getElementById('fd').value : '';
      var n = 0;
      jobs.forEach(function (j) {
        var ok = (!q || [j.title, j.summary, j.department, j.location].join(' ').toLowerCase().indexOf(q) >= 0) && (!k || j.kind === k) && (!dd || j.department === dd);
        document.getElementById('job' + j.id).hidden = !ok; if (ok) n++;
      });
      document.getElementById('none').hidden = n > 0;
    }
    // A shared link (?job=12) opens that job.
    var want = parseInt(params.get('job'), 10);
    var el = want && document.getElementById('job' + want);
    if (el) { el.classList.add('hit'); el.querySelector('details').open = true; el.scrollIntoView({ block: 'start' }); }
  }).catch(function () { m.innerHTML = '<div class="empty">Could not load the jobs. Please try again later.</div>'; });

  function jobHtml(j) {
    var docs = Array.isArray(j.documents) ? j.documents : [], qs = Array.isArray(j.questions) ? j.questions : [];
    var link = location.origin + '/careers.html?job=' + j.id;
    return '<div class="job" id="job' + j.id + '"><h2>' + esc(j.title) + (j.openings > 1 ? '<span class="tag">' + j.openings + ' openings</span>' : '') + '</h2>' +
      '<div class="meta">' + esc([KIND[j.kind] || j.kind, j.department, j.location, j.pay].filter(Boolean).join(' · ')) + (j.closes_on ? ' · apply by ' + esc(day(j.closes_on)) : '') + '</div>' +
      (j.summary ? '<p>' + esc(j.summary) + '</p>' : '') +
      '<details><summary>Details and apply</summary>' +
      (j.description ? '<h3>The job</h3><div class="pre">' + esc(j.description) + '</div>' : '') +
      (j.requirements ? '<h3>What you need</h3><div class="pre">' + esc(j.requirements) + '</div>' : '') +
      (docs.length ? '<h3>Documents we ask for</h3><ul class="docs">' + docs.map(function (x) { return '<li><span>' + esc(x.label) + '</span><small>' + (x.required ? 'needed' : 'if you have it') + '</small></li>'; }).join('') + '</ul>' : '') +
      '<div class="share">Share: <a href="https://wa.me/?text=' + encodeURIComponent(j.title + ' at Vision Auto Solutions: ' + link) + '" target="_blank" rel="noopener">WhatsApp</a>' +
        '<a href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(link) + '" target="_blank" rel="noopener">Facebook</a>' +
        '<a href="https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(link) + '" target="_blank" rel="noopener">LinkedIn</a>' +
        '<a href="mailto:?subject=' + encodeURIComponent('Job: ' + j.title) + '&body=' + encodeURIComponent(link) + '">Email</a></div>' +
      '<form data-job="' + j.id + '" novalidate><h3>Apply</h3>' +
        '<label>Full name</label><input name="name" autocomplete="name" required><label>Email</label><input name="email" type="email" autocomplete="email" required><label>Phone</label><input name="phone" type="tel" autocomplete="tel" required>' +
        '<label>Parish</label><input name="parish">' +
        qs.map(function (q) {
          return '<label>' + esc(q.q) + (q.required ? '' : ' (optional)') + '</label>' + (q.kind === 'yesno'
            ? '<div class="yn"><label><input type="radio" name="q_' + esc(q.key) + '" value="yes"> Yes</label><label><input type="radio" name="q_' + esc(q.key) + '" value="no"> No</label></div>'
            : '<textarea name="q_' + esc(q.key) + '" rows="2"></textarea>');
        }).join('') +
        '<label>Why you, in a few lines (optional)</label><textarea name="cover" rows="4"></textarea>' +
        '<label>CV (PDF or Word, up to 5 MB' + (j.cv_required ? '' : ', optional') + ')</label><input name="cv" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">' +
        docs.map(function (x) {
          return '<label>' + esc(x.label) + ' <small>(PDF, Word or a photo' + (x.required ? '; needed, but you can send it later' : ', optional') + ')</small></label><input name="doc_' + esc(x.key) + '" type="file" accept="' + ACCEPT_DOC + '">';
        }).join('') +
        '<label>Anything else, such as certificates or references (optional)</label><input name="doc_other" type="file" accept="' + ACCEPT_DOC + '">' +
        '<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">' +
        '<label class="check"><input type="checkbox" name="consent" value="yes"> <span class="consent"></span></label>' +
        '<p class="err" role="alert"></p><button type="submit">Send application</button></form></details></div>';
  }
  function wireForm(j, consent) {
    var f = document.querySelector('form[data-job="' + j.id + '"]');
    f.querySelector('.consent').textContent = consent;
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var errEl = f.querySelector('.err'), btn = f.querySelector('button[type=submit]');
      errEl.textContent = '';
      var bad = function (t) { errEl.textContent = t; };
      var el = f.elements;   // f.name is the form's own name, not the field
      if (!el.name.value.trim() || !el.email.value.trim() || !el.phone.value.trim()) return bad('Your name, email and phone, please.');
      var missingQ = (j.questions || []).filter(function (q) {
        if (!q.required) return false;
        var v = new FormData(f).get('q_' + q.key);
        return !v || !String(v).trim();
      })[0];
      if (missingQ) return bad('Please answer: ' + missingQ.q);
      if (j.cv_required && !f.cv.files[0]) return bad('Please attach your CV.');
      var big = Array.prototype.filter.call(f.querySelectorAll('input[type=file]'), function (i) { return i.files[0] && i.files[0].size > MAX; })[0];
      if (big) return bad('Each file must be 5 MB or smaller.');
      if (!f.consent.checked) return bad('Please tick the box to agree to us keeping your application.');
      btn.disabled = true; btn.textContent = 'Sending…';
      getJson('/api/public/jobs/' + j.id + '/apply', { method: 'POST', body: new FormData(f) })
        .then(function (r) {
          f.outerHTML = '<div class="ok"><b>Application sent.</b> ' + esc(r.message) +
            (r.missing && r.missing.length ? '<p style="margin:8px 0 0">Still to send: ' + esc(r.missing.join(', ')) + '.</p>' : '') +
            (r.status_url ? '<p style="margin:8px 0 0"><a href="' + esc(r.status_url) + '">See your application and add documents</a> (keep this link; it is also in your email).</p>' : '') + '</div>';
        })
        .catch(function (er) { bad(er.message); btn.disabled = false; btn.textContent = 'Send application'; });
    });
  }
  // The job offer, reached by the private link in the offer email: read the
  // letter, then accept by typing your name, or decline.
  function offerPage(token) {
    document.getElementById('h1').textContent = 'Your job offer';
    var url = '/api/public/offers/' + encodeURIComponent(token);
    getJson(url).then(function (o) {
      var answered = o.status !== 'sent';
      m.innerHTML = '<div class="job">' + o.letter + '</div>' +
        (answered
          ? '<div class="ok">' + (o.status === 'accepted' ? 'You accepted this offer on ' + esc(day(o.responded_at)) + '. We will contact you about your first day.' : 'You declined this offer on ' + esc(day(o.responded_at)) + '.') + '</div>'
          : '<div class="job"><h2>Your answer</h2>' + (o.respond_by ? '<p class="meta">Please answer by ' + esc(day(o.respond_by)) + '.</p>' : '') +
            '<label for="ofName">To accept, type your full name</label><input id="ofName" autocomplete="name" placeholder="' + esc(o.name || '') + '">' +
            '<label for="ofNote">Anything you want to tell us (optional)</label><textarea id="ofNote" rows="3"></textarea>' +
            '<p class="err" id="ofErr"></p><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="ofYes">I accept this offer</button><button class="ghost" id="ofNo">Decline</button></div></div>');
      if (answered) return;
      async function send(decision) {
        if (decision === 'decline' && !(await vasConfirm('Decline this job offer?'))) return;
        document.getElementById('ofYes').disabled = document.getElementById('ofNo').disabled = true;
        getJson(url + '/respond', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ decision: decision, name: document.getElementById('ofName').value, note: document.getElementById('ofNote').value }) })
          .then(function (r) { m.innerHTML = '<div class="ok">' + esc(r.message) + '</div>'; })
          .catch(function (e) { document.getElementById('ofErr').textContent = e.message; document.getElementById('ofYes').disabled = document.getElementById('ofNo').disabled = false; });
      }
      document.getElementById('ofYes').onclick = async function () { await send('accept'); };
      document.getElementById('ofNo').onclick = async function () { await send('decline'); };
    }).catch(function (e) { m.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }
  // So the postings can show in Google's job search.
  function jsonLd(jobs) {
    var s = document.createElement('script');
    s.type = 'application/ld+json';
    s.textContent = JSON.stringify(jobs.map(function (j) {
      var o = { '@context': 'https://schema.org/', '@type': 'JobPosting', title: j.title, description: [j.summary, j.description, j.requirements].filter(Boolean).join('\n\n') || j.title,
        datePosted: String(j.created_at || '').slice(0, 10), employmentType: GKIND[j.kind] || 'FULL_TIME',
        hiringOrganization: { '@type': 'Organization', name: 'Vision Auto Solutions', sameAs: location.origin },
        jobLocation: { '@type': 'Place', address: { '@type': 'PostalAddress', streetAddress: '112C Waltham Park Road', addressLocality: j.location || 'Kingston', addressCountry: 'JM' } },
        url: location.origin + '/careers.html?job=' + j.id };
      if (j.closes_on) o.validThrough = String(j.closes_on).slice(0, 10);
      return o;
    })).replace(/</g, '\\u003c');
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
