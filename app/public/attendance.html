<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance · Vision Auto Solutions</title>
<style>
  :root{ --red:#d62828; --navy:#0b1b2b; --ink:#0f1720; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ok:#16a34a; --warn:#b45309; --chip:#eef2f7; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; --chip:#1f2b38; --warn:#f59e0b; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0} header nav{margin-left:auto;display:flex;gap:14px;font-size:13px} header a{color:#fff;opacity:.85}
  main{max-width:1250px;margin:0 auto;padding:14px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  input,select,button,textarea{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  button{cursor:pointer;background:var(--card)} button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600} button.sm{padding:3px 9px;font-size:12.5px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 12px} .tabs button{border-radius:999px;padding:6px 13px;font-size:13px} .tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px} .controls label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  table{width:100%;border-collapse:collapse} th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .scroll{overflow-x:auto}
  .pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
  .pill.ok{background:#16a34a22;color:var(--ok)} .pill.bad{background:#d6282822;color:var(--red)} .pill.warn{background:#f59e0b22;color:var(--warn)}
  .note{padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:8px} .note.warn{background:#f59e0b18;border-left:3px solid var(--warn)} .note.info{background:var(--chip)}
  .modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;z-index:40} .modal .card{max-width:820px;width:100%}
  .empty{color:var(--muted);text-align:center;padding:20px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;display:none;z-index:60;max-width:90vw}
  .badge-card{width:320px;border:2px solid #0b1b2b;border-radius:12px;padding:14px;text-align:center;background:#fff;color:#0b1b2b}
  @media print{ body *{visibility:hidden} .badge-card, .badge-card *{visibility:visible} .badge-card{position:absolute;left:0;top:0} }
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<header><h1>Attendance</h1><nav><a href="/clock.html" target="_blank" rel="noopener">Time clock ↗</a><a href="/my-time.html">My time</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"><button data-t="now" class="on">Who's in</button><button data-t="today">Today</button><button data-t="late">Lateness</button><button data-t="log">Clock-in log</button><button data-t="req">Requests</button><button data-t="ts">Timesheets</button><button data-t="staff">Staff &amp; shifts</button><button data-t="leave">Leave &amp; holidays</button><button data-t="sph">Sales per hour</button><button data-t="set">Settings</button></div>
  <div id="out"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script src="/assets/vendor/jsbarcode.min.js"></script>
<script src="/assets/vendor/qrcode-generator.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var all = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var J = function (v) { return v == null ? '–' : 'J$' + Number(v).toLocaleString('en-JM', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var tm = function (t) { return t ? new Date(t).toLocaleTimeString('en-JM', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Jamaica' }) : ''; };
  var dt = function (t) { return t ? new Date(t).toLocaleString('en-JM', { dateStyle: 'short', timeStyle: 'short', timeZone: 'America/Jamaica' }) : ''; };
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var KIND = { extension: 'More time', overtime: 'Overtime', correction: 'Time correction', extra: 'Extra time after the shift' };
  var ACTION = { in: 'Clock in', out: 'Clock out', break_start: 'Break', lunch_start: 'Lunch', break_end: 'Back from break', auto_out: 'Clocked out automatically', extra_time: 'Logged extra time', toggle: 'Badge scan', extra: 'Logged extra time' };
  var tab = 'now', week = null, staffCache = null, lateMonth = null;
  try { tab = localStorage.getItem('vision.attTab') || 'now'; } catch (_) {}
  var hashTab = /^#(now|today|late|log|req|ts|staff|leave|sph|set)$/.exec(location.hash);
  if (hashTab) tab = hashTab[1];
  function toast(t) { var el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function () { el.style.display = 'none'; }, 3200); }
  function api(url, method, body) {
    return fetch(url, { method: method || 'GET', credentials: 'same-origin', headers: { Accept: 'application/json', 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) {
        if (r.status === 401) { location.href = '/admin.html'; throw new Error('Sign in required'); }
        return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; });
      });
  }
  function modal(h) { $('#modal').innerHTML = '<div class="modal"><div class="card">' + h + '</div></div>'; $('.modal').addEventListener('mousedown', function (e) { if (e.target.classList.contains('modal')) close(); }); }
  function close() { $('#modal').innerHTML = ''; }

  function now() {
    return api('/api/clock/now').then(function (d) {
      $('#out').innerHTML = '<div class="card"><h2>Clocked in now (' + d.in.length + ')</h2>' + (d.in.length ? '<table><thead><tr><th>Name</th><th>Since</th><th>Until</th><th>Where</th><th>Status</th></tr></thead><tbody>' + d.in.map(function (r) {
        return '<tr><td><b>' + esc(r.name) + '</b></td><td>' + esc(tm(r.clock_in_at)) + '</td><td>' + esc(tm(r.ends_at)) + (r.ext_until ? ' <span class="pill ok">extended</span>' : '') + '</td><td>' + (r.mode === 'remote' ? '<span class="pill warn">remote</span>' : 'shop') + '</td>' +
          '<td>' + (r.on_break ? '<span class="pill">on ' + esc(r.on_break) + '</span> ' : '') + (r.outside_shift ? '<span class="pill ' + (r.ot_status === 'approved' ? 'ok' : 'warn') + '">overtime ' + esc(r.ot_status) + '</span> ' : '') + (r.closed_note ? '<span class="pill bad">' + esc(r.closed_note) + '</span>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>' : '<div class="empty">Nobody is clocked in.</div>') + '</div>';
    });
  }
  function today() {
    return api('/api/clock/today').then(function (d) {
      var col = { in: 'ok', gone: '', absent: 'bad', 'not in yet': 'warn', off: '' };
      $('#out').innerHTML = '<div class="card"><h2>Today, ' + esc(d.day) + '</h2><table><thead><tr><th>Name</th><th>Shift</th><th>Status</th><th>In</th><th>Out</th><th>Notes</th></tr></thead><tbody>' + (d.staff.length ? d.staff.map(function (r) {
        return '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.shift || '') + '</td><td><span class="pill ' + (col[r.status] || '') + '">' + esc(r.status) + '</span></td><td>' + esc(tm(r.first_in)) + '</td><td>' + esc(tm(r.last_out)) + '</td><td>' + esc(r.note || '') + '</td></tr>';
      }).join('') : '<tr><td colspan="6" class="empty">No one scheduled. Set shifts under Staff &amp; shifts.</td></tr>') + '</tbody></table></div>';
    });
  }
  function reqs() {
    return api('/api/clock/requests').then(function (d) {
      $('#out').innerHTML = '<div class="card"><h2>Requests</h2><p class="sub">Overtime, extra time and corrections. Approvers also get each one by email with a one-use link.</p><div class="scroll"><table><thead><tr><th>Asked</th><th>Who</th><th>What</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>' +
        (d.requests.length ? d.requests.map(function (r) {
          var what = r.kind === 'extension' ? r.minutes + ' more minutes' : r.kind === 'overtime' ? 'Clocked in ' + dt(r.clock_in_at) + ' outside the shift'
            : r.kind === 'extra' ? 'Worked until ' + esc(dt(r.wanted && r.wanted.clock_out_at)) + ' (' + r.minutes + ' min)<br><small>was clocked out ' + esc(dt(r.original && r.original.clock_out_at)) + '</small>' : 'In ' + dt(r.wanted && r.wanted.clock_in_at) + ', out ' + dt(r.wanted && r.wanted.clock_out_at) + (r.original ? '<br><small>was ' + esc(dt(r.original.clock_in_at)) + ' – ' + esc(dt(r.original.clock_out_at)) + '</small>' : '<br><small>missed day</small>');
          return '<tr><td>' + esc(dt(r.created_at)) + '</td><td>' + esc(r.name) + '</td><td><b>' + esc(KIND[r.kind]) + '</b><br>' + what + '</td><td>' + esc(r.reason) + '</td>' +
            '<td><span class="pill ' + (r.status === 'approved' ? 'ok' : r.status === 'pending' ? 'warn' : 'bad') + '">' + esc(r.status) + '</span>' + (r.decided_by_name ? '<br><small>' + esc(r.decided_by_name) + ' (' + esc(r.decided_via) + ')</small>' : '') + '</td>' +
            '<td style="white-space:nowrap">' + (r.status === 'pending' ? '<button class="sm primary" data-ap="' + r.id + '">Approve</button> <button class="sm" data-rj="' + r.id + '">Reject</button>' : '') + '</td></tr>';
        }).join('') : '<tr><td colspan="6" class="empty">No requests.</td></tr>') + '</tbody></table></div></div>';
      var go = function (id, d) { var note = d === 'reject' ? prompt('Note to them (optional)') : ''; if (note === null) return; api('/api/clock/requests/' + id + '/decide', 'POST', { decision: d, note: note }).then(function (r) { toast(r.status); reqs(); }).catch(function (e) { toast(e.message); }); };
      all('[data-ap]').forEach(function (b) { b.onclick = function () { go(b.getAttribute('data-ap'), 'approve'); }; });
      all('[data-rj]').forEach(function (b) { b.onclick = function () { go(b.getAttribute('data-rj'), 'reject'); }; });
    });
  }

  function ts() {
    return api('/api/clock/timesheet' + (week ? '?week=' + week : '')).then(function (d) {
      week = d.week_start;
      var prev = new Date(new Date(week + 'T12:00:00Z').getTime() - 7 * 86400000).toISOString().slice(0, 10), next = new Date(new Date(week + 'T12:00:00Z').getTime() + 7 * 86400000).toISOString().slice(0, 10);
      $('#out').innerHTML = '<div class="card"><h2>Week of ' + esc(week) + ' <button class="sm" id="wp">◀</button><button class="sm" id="wn">▶</button> <a class="sm" href="/api/clock/payroll.csv?week=' + week + '">Payroll CSV</a></h2>' +
        '<p class="sub">Hours less unpaid breaks; overtime by each person\'s daily and weekly limits. Overtime that is still waiting for approval, or was rejected, is not paid. Approve a week to freeze it for payroll.</p><div class="scroll"><table><thead><tr><th>Name</th><th class="n">Regular h</th><th class="n">Overtime h</th><th class="n">OT waiting h</th><th class="n">Late</th><th class="n">Early</th><th class="n">Absent</th><th class="n">Pay</th><th class="n">Commission</th><th class="n">Gross</th><th>Approved</th><th></th></tr></thead><tbody>' +
        (d.staff.length ? d.staff.map(function (s) {
          var t = s.approved ? s.approved.totals : s.totals;
          return '<tr><td><a href="#" data-user="' + s.user_id + '">' + esc(s.name) + '</a></td><td class="n">' + t.regular_h + '</td><td class="n">' + t.overtime_h + '</td><td class="n">' + (t.ot_pending_h ? '<span class="pill warn">' + t.ot_pending_h + '</span>' : '0') + '</td>' +
            '<td class="n">' + t.late + '</td><td class="n">' + t.early + '</td><td class="n">' + t.absent + '</td><td class="n">' + J(t.pay_regular + t.pay_overtime) + '</td><td class="n">' + J(t.commission) + '</td><td class="n"><b>' + J(t.gross) + '</b></td>' +
            '<td>' + (s.approved ? '<span class="pill ok">' + esc(s.approved.approved_by || '') + '</span>' : '<span class="pill">no</span>') + '</td><td><button class="sm" data-apw="' + s.user_id + '">' + (s.approved ? 'Re-approve' : 'Approve') + '</button></td></tr>';
        }).join('') : '<tr><td colspan="12" class="empty">No time this week.</td></tr>') + '</tbody></table></div></div>';
      $('#wp').onclick = function () { week = prev; ts(); }; $('#wn').onclick = function () { week = next; ts(); };
      all('[data-apw]').forEach(function (b) { b.onclick = function () { api('/api/clock/timesheet/approve', 'POST', { user_id: b.getAttribute('data-apw'), week_start: week }).then(function () { toast('Approved'); ts(); }).catch(function (e) { toast(e.message); }); }; });
      all('[data-user]').forEach(function (a) {
        a.onclick = function (e) {
          e.preventDefault();
          api('/api/clock/timesheet?week=' + week + '&user=' + a.getAttribute('data-user')).then(function (r) {
            var s = r.staff[0];
            modal('<h2>' + esc(s.name) + ' · week of ' + esc(week) + '</h2><table><thead><tr><th>Day</th><th>Shift</th><th>Times</th><th class="n">Hours</th><th class="n">Day OT</th><th>Notes</th></tr></thead><tbody>' + s.days.map(function (dd) {
              return '<tr><td>' + esc(dd.day) + '</td><td>' + esc(dd.shift) + '</td><td>' + dd.entries.map(function (e2) { return esc(tm(e2.in)) + '–' + esc(e2.out ? tm(e2.out) : 'now') + (e2.mode === 'remote' ? ' (remote)' : '') + (e2.outside ? ' <span class="pill ' + (e2.ot === 'approved' ? 'ok' : 'warn') + '">OT ' + esc(e2.ot) + '</span>' : '') + (e2.auto ? ' <small>auto out</small>' : '') + (e2.edited ? ' <small>corrected</small>' : '') + (e2.late ? ' <span class="pill ' + (e2.late_excused ? '' : 'bad') + '">late ' + e2.late + (e2.late_excused ? ', excused' : '') + '</span>' : '') +
                  ((e2.ip_in || e2.loc_in) ? '<br><small>in: ' + esc(e2.ip_in || '') + (e2.loc_in ? ' · ' + mapLink(e2.loc_in.lat, e2.loc_in.lng, e2.loc_in.acc) + (e2.loc_in.dist != null ? ' ' + e2.loc_in.dist + ' m from the shop' : '') : '') + (e2.ip_out ? ' · out: ' + esc(e2.ip_out) : '') + (e2.loc_out ? ' ' + mapLink(e2.loc_out.lat, e2.loc_out.lng, e2.loc_out.acc) : '') + '</small>' : '') + (e2.photo_in ? ' <a target="_blank" href="/api/clock/photo/' + esc(e2.photo_in) + '">photo in</a>' : '') + (e2.photo_out ? ' <a target="_blank" href="/api/clock/photo/' + esc(e2.photo_out) + '">photo out</a>' : ''); }).join('<br>') + '</td>' +
                '<td class="n">' + dd.hours + '</td><td class="n">' + (dd.day_ot || '') + '</td><td>' + [dd.late ? 'late' : '', dd.early ? 'left early' : '', dd.absent ? '<b>absent</b>' : '', dd.auto_break_min ? dd.auto_break_min + ' min break taken off' : '', dd.ot_pending_h ? dd.ot_pending_h + 'h OT waiting' : '', dd.ot_rejected_h ? dd.ot_rejected_h + 'h OT rejected' : ''].filter(Boolean).join(', ') + '</td></tr>';
            }).join('') + '</tbody></table><p><b>Regular ' + s.totals.regular_h + ' h · Overtime ' + s.totals.overtime_h + ' h</b> (rate ' + J(s.totals.rate) + '/h, overtime ×' + s.totals.ot_rate + ', after ' + s.totals.ot_daily + ' h a day or ' + s.totals.ot_weekly + ' h a week) · Gross ' + J(s.totals.gross) + '</p><button id="cx">Close</button>');
            $('#cx').onclick = close;
          }).catch(function (e2) { toast(e2.message); });
        };
      });
    });
  }

  function staffTab() {
    return api('/api/clock/staff').then(function (d) {
      staffCache = d;
      $('#out').innerHTML = '<div class="card"><h2>Staff and shifts</h2><p class="sub">Click a person to set how they clock in, their weekly shifts, pay and overtime rules, their badge and their fingerprint / face.</p><div class="scroll"><table><thead><tr><th>Name</th><th>Clock in with</th><th>Shifts</th><th class="n">Rate</th><th>Overtime</th><th>Badge</th><th>Fingerprint / face</th></tr></thead><tbody>' +
        d.staff.map(function (s, i) {
          return '<tr><td><a href="#" data-s="' + i + '"><b>' + esc(s.name) + '</b></a><br><small>' + esc(s.admin_role) + '</small></td><td>' + esc((s.methods || ['pin', 'password', 'badge', 'biometric']).join(', ')) + (s.require_biometric ? ' <span class="pill warn">fingerprint only</span>' : '') + (s.remote_allowed ? ' <span class="pill">remote ok</span>' : '') + (s.has_pin ? '' : ' <span class="pill bad">no PIN</span>') + '</td>' +
            '<td><small>' + (s.shifts.length ? s.shifts.map(function (x) { return DAYS[x.weekday] + ' ' + x.start + '–' + x.end; }).join('<br>') : 'none') + '</small></td><td class="n">' + (s.hourly_rate != null ? J(s.hourly_rate) : '–') + '</td>' +
            '<td><small>' + (s.ot_daily_hours || 8) + 'h/day, ' + (s.ot_weekly_hours || 40) + 'h/wk ×' + (s.ot_rate || 1.5) + '</small></td><td>' + (s.badge_issued_at ? '<span class="pill ok">issued</span>' : '–') + '</td><td>' + (s.passkeys ? '<span class="pill ok">' + s.passkeys + '</span>' : '–') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
      all('[data-s]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); person(d.staff[+a.getAttribute('data-s')], d.managers); }; });
    });
  }
  function person(s, managers) {
    var methods = s.methods || ['pin', 'password', 'badge', 'biometric'];
    var byDay = {}; s.shifts.forEach(function (x) { byDay[x.weekday] = x; });
    modal('<h2>' + esc(s.name) + '</h2>' +
      '<p class="sub">Clock in with</p><div class="controls">' + ['pin', 'password', 'badge', 'biometric'].map(function (m) { return '<label style="display:flex;gap:5px;align-items:center;color:inherit;font-size:13px"><input type="checkbox" data-m="' + m + '"' + (methods.indexOf(m) >= 0 ? ' checked' : '') + '> ' + ({ pin: 'PIN', password: 'Email + password', badge: 'Badge', biometric: 'Fingerprint / face' })[m] + '</label>'; }).join('') +
      '<label style="display:flex;gap:5px;align-items:center;color:inherit;font-size:13px"><input type="checkbox" id="pBio"' + (s.require_biometric ? ' checked' : '') + '> Only fingerprint / face</label><label style="display:flex;gap:5px;align-items:center;color:inherit;font-size:13px"><input type="checkbox" id="pRem"' + (s.remote_allowed ? ' checked' : '') + '> May clock in remotely (no money)</label></div>' +
      '<div class="controls"><div><label>Hourly rate J$</label><input id="pRate" type="number" step="0.01" value="' + (s.hourly_rate == null ? '' : s.hourly_rate) + '" style="width:110px"></div><div><label>Overtime after (h/day)</label><input id="pD" type="number" step="0.5" value="' + (s.ot_daily_hours || 8) + '" style="width:90px"></div>' +
      '<div><label>or (h/week)</label><input id="pW" type="number" step="0.5" value="' + (s.ot_weekly_hours || 40) + '" style="width:90px"></div><div><label>Overtime rate ×</label><input id="pR" type="number" step="0.1" value="' + (s.ot_rate || 1.5) + '" style="width:80px"></div>' +
      '<div><label>Also approves their requests</label><select id="pAp"><option value="">(owners and department manager)</option>' + managers.map(function (m) { return '<option value="' + m.id + '"' + (s.approver_user_id === m.id ? ' selected' : '') + '>' + esc(m.name) + '</option>'; }).join('') + '</select></div></div>' +
      '<p class="sub">Weekly shifts (leave a day empty for a day off)</p><table><tbody>' + [1, 2, 3, 4, 5, 6, 0].map(function (wd) { var x = byDay[wd] || {}; return '<tr><td>' + DAYS[wd] + '</td><td><input type="time" data-st="' + wd + '" value="' + (x.start || '') + '"> to <input type="time" data-en="' + wd + '" value="' + (x.end || '') + '"></td><td>break <input type="number" data-br="' + wd + '" value="' + (x.break != null ? x.break : 60) + '" style="width:70px"> min</td></tr>'; }).join('') + '</tbody></table>' +
      '<div class="controls" style="margin-top:10px"><button class="primary" id="pSave">Save</button><button id="pBadge">Print a new badge</button><button id="pKey">Enrol fingerprint / face on this device</button><button id="pX">Close</button></div><div id="pKeys"></div>' +
      '<div class="note info">Fingerprint / face uses the device\'s own reader (Windows Hello, a phone). On a shared shop PC, everyone enrolled in Windows Hello on that PC can unlock each other\'s key, so on shared PCs prefer badge + PIN, and enrol fingerprints on each person\'s own phone (they clock in from the shop Wi-Fi).</div>');

        '<div><label>Result</label><select id="gR"><option value="">All</option><option value="ok"' + (logF.result === 'ok' ? ' selected' : '') + '>Done</option><option value="refused"' + (logF.result === 'refused' ? ' selected' : '') + '>Refused</option></select></div>' +
        '<div><label>Device id or IP</label><input id="gQ" value="' + esc(logF.q) + '" style="width:170px"></div><button class="primary" id="gGo">Show</button><a id="gCsv" class="sm" href="#">Download CSV</a></div><div id="gOut" class="scroll"><div class="empty">Loading…</div></div></div>';
      var qs = function () { return 'from=' + logF.from + '&to=' + logF.to + (logF.user ? '&user=' + logF.user : '') + (logF.action ? '&action=' + logF.action : '') + (logF.result ? '&result=' + logF.result : '') + (logF.q ? '&q=' + encodeURIComponent(logF.q) : ''); };
      var read = function () { logF = { from: $('#gF').value, to: $('#gT').value, user: $('#gU').value, action: $('#gA').value, result: $('#gR').value, q: $('#gQ').value.trim() }; };
      $('#gGo').onclick = function () { read(); run(); };
      $('#gCsv').onclick = function (e) { e.preventDefault(); read(); location.href = '/api/clock/events?format=csv&' + qs(); };
      function run() {
        return api('/api/clock/events?' + qs()).then(function (d) {
          $('#gOut').innerHTML = '<table><thead><tr><th>When</th><th>Who</th><th>What</th><th>How</th><th>Where</th><th>Device</th><th>Location</th></tr></thead><tbody>' + (d.events.length ? d.events.map(function (e) {
            var skew = e.client_time ? Math.round((new Date(e.client_time) - new Date(e.at)) / 60000) : null;
            var loc = e.lat != null ? mapLink(e.lat, e.lng, e.accuracy_m) + (e.distance_m != null ? '<br><span class="pill ' + (e.distance_m > d.radius ? 'bad' : 'ok') + '">' + (e.distance_m >= 1000 ? (e.distance_m / 1000).toFixed(1) + ' km' : e.distance_m + ' m') + ' from the shop</span>' : '')
              : e.location_status ? '<small>' + esc({ denied: 'refused by the device', unavailable: 'not available', off: 'not asked' }[e.location_status] || e.location_status) + '</small>' : '';
            return '<tr><td style="white-space:nowrap">' + esc(dt(e.at)) + (skew != null && Math.abs(skew) >= 3 ? '<br><span class="pill warn">device clock ' + (skew > 0 ? '+' : '') + skew + ' min</span>' : '') + '</td>' +
              '<td>' + (e.name ? esc(e.name) : '<small>not recognised</small>') + '</td>' +
              '<td>' + (e.result === 'refused' ? '<span class="pill bad">refused</span> ' : '') + '<b>' + esc(ACTION[e.action] || e.action) + '</b>' + (e.late_minutes ? ' <span class="pill bad">late ' + e.late_minutes + ' min</span>' : '') + (e.message ? '<br><small>' + esc(e.message) + '</small>' : '') + (e.photo ? ' <a target="_blank" href="/api/clock/photo/' + esc(e.photo) + '">photo</a>' : '') + '</td>' +
              '<td>' + esc(e.method || '') + '</td>' +
              '<td>' + (e.on_site === true ? '<span class="pill ok">shop</span> ' : e.on_site === false ? '<span class="pill warn">off site</span> ' : '') + (e.station ? esc(e.station) + '<br>' : '') + (e.ip ? '<a href="#" data-q="' + esc(e.ip) + '">' + esc(e.ip) + '</a>' : '') + '</td>' +
              '<td>' + (e.device_id ? '<a href="#" data-q="' + esc(e.device_id) + '">' + esc(e.device_name || e.device_id.slice(0, 8)) + '</a><br>' : '') + '<small>' + esc(e.platform || '') + '</small></td>' +
              '<td>' + loc + '</td></tr>';
          }).join('') : '<tr><td colspan="7" class="empty">Nothing in these dates.</td></tr>') + '</tbody></table>' + (d.more ? '<p class="sub">Showing the latest 1,000. Narrow the dates or download the CSV for all of them.</p>' : '');
          all('[data-q]', $('#gOut')).forEach(function (a) { a.onclick = function (ev) { ev.preventDefault(); $('#gQ').value = a.getAttribute('data-q'); read(); run(); }; });
        }).catch(function (e) { $('#gOut').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
      }
      return run();
    });
  }

  function show() {
    all('#tabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tab); });
    try { localStorage.setItem('vision.attTab', tab); } catch (_) {}
    ({ now: now, today: today, late: late, log: log, req: reqs, ts: ts, staff: staffTab, leave: leave, sph: sph, set: settingsTab }[tab] || now)().catch(function (e) { $('#out').innerHTML = '<div class="card empty">' + esc(e.message) + '</div>'; });
  }
  all('#tabs button').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); show(); }; });
  window.addEventListener('hashchange', function () { var m = /^#(now|today|late|log|req|ts|staff|leave|sph|set)$/.exec(location.hash); if (m && m[1] !== tab) { tab = m[1]; show(); } });
  show();
})();
</script>
</body>
</html>
