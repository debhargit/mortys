<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Track Your Service · Meltha Honda Sales &amp; Servs</title>
<meta name="description" content="Check the status of your service work order at Meltha Honda Sales &amp; Servs, Kingston Jamaica." />
<style>
  :root {
    --red:#d62828; --red-dark:#9d2020; --navy:#0b1b2b; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --ok:#16a34a; --bg:#f6f7f9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  header.top{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
  header.top h1{margin:0;font-size:18px;font-weight:800}
  header.top a{color:#cbd5e1;text-decoration:none;font-size:13px}
  .wrap{max-width:680px;margin:30px auto;padding:0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 6px 20px rgba(15,23,42,.06)}
  h2{margin:0 0 6px;font-size:22px}
  .lead{color:var(--muted);margin:0 0 18px;font-size:14px;line-height:1.5}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin:14px 0 4px}
  input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit}
  input:focus{outline:2px solid var(--red);border-color:transparent}
  button{width:100%;background:var(--red);color:#fff;border:0;border-radius:8px;padding:13px;font-weight:800;cursor:pointer;font-size:15px;font-family:inherit;margin-top:18px}
  button:hover{background:var(--red-dark)}
  .err{background:#fee2e2;color:#991b1b;padding:11px 13px;border-radius:7px;font-size:13.5px;margin-top:14px;display:none}
  .err.show{display:block}
  .hint{font-size:12.5px;color:var(--muted);margin-top:14px;text-align:center}
  .hint a{color:var(--red)}
  /* RESULT */
  .result{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-top:20px;box-shadow:0 6px 20px rgba(15,23,42,.06)}
  .result.show{display:block}
  .result .wo-num{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
  .result h3{margin:0 0 4px;font-size:24px}
  .result .veh{color:var(--muted);font-size:14px;margin-bottom:18px}
  .result .status-card{border-radius:10px;padding:18px;margin-bottom:18px;color:#fff;text-align:center}
  .result .status-card.open,.result .status-card.in_progress{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
  .result .status-card.awaiting_parts{background:linear-gradient(135deg,#f59e0b,#b45309)}
  .result .status-card.completed,.result .status-card.billed{background:linear-gradient(135deg,#10b981,#047857)}
  .result .status-card.paid{background:linear-gradient(135deg,#16a34a,#15803d)}
  .result .status-card.cancelled{background:linear-gradient(135deg,#6b7280,#374151)}
  .result .status-card .label{font-size:11px;text-transform:uppercase;letter-spacing:2px;opacity:.85;font-weight:600;margin-bottom:6px}
  .result .status-card .val{font-size:24px;font-weight:800}
  .result .status-card small{display:block;margin-top:8px;font-size:12.5px;opacity:.9}
  .timeline{margin:18px 0}
  .timeline .step{display:flex;gap:12px;padding:8px 0;align-items:center}
  .timeline .dot{width:22px;height:22px;border-radius:50%;background:#e5e7eb;border:3px solid var(--bg);flex-shrink:0;position:relative;z-index:1}
  .timeline .dot.done{background:var(--ok)}
  .timeline .dot.current{background:var(--red);box-shadow:0 0 0 4px rgba(214,40,40,.2)}
  .timeline .step:not(:last-child){position:relative}
  .timeline .step:not(:last-child)::before{content:"";position:absolute;left:11px;top:30px;bottom:-8px;width:1px;background:#e5e7eb}
  .timeline .step.done::before{background:var(--ok)}
  .timeline .lbl{font-weight:600;font-size:13.5px}
  .timeline .lbl small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:1px}
  .totals{background:#0f1720;color:#fff;padding:16px 18px;border-radius:10px;display:grid;grid-template-columns:1fr auto;gap:8px;font-size:14px;margin-top:18px}
  .totals .grand{border-top:1px solid rgba(255,255,255,.2);padding-top:10px;margin-top:6px;font-weight:800;font-size:18px;color:#ffb703}
  .complaint{background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:18px;font-size:13.5px;line-height:1.5}
  .complaint b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .actions{display:flex;gap:8px;margin-top:18px}
  .actions a{flex:1;text-align:center;padding:11px;border-radius:7px;text-decoration:none;font-weight:700;font-size:13.5px}
  .actions .call{background:var(--red);color:#fff}
  .actions .chat{background:#16a34a;color:#fff}
</style>
</head>
<body>

<header class="top">
  <h1>Meltha Honda — Track Your Service</h1>
  <a href="/">← Back to site</a>
</header>

<div class="wrap">
  <div class="card" id="lookupCard">
    <h2>Check your work order status</h2>
    <p class="lead">Enter the work order number we gave you at intake (e.g. <b>WO-2026-0001</b>) and the phone number you provided. We'll show you where your repair stands.</p>
    <form onsubmit="event.preventDefault();doLookup();">
      <label>Work order number</label>
      <input id="woNum" required placeholder="WO-2026-0001" autocomplete="off" />
      <label>Your phone number</label>
      <input id="woPhone" required type="tel" placeholder="876-000-0000" autocomplete="tel" />
      <button type="submit" id="lookupBtn">Look up my work order</button>
    </form>
    <div class="err" id="errMsg"></div>
    <div class="hint">Don't have your WO number? Call us at <a href="tel:+18767588503">(876) 758-8503</a>.</div>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
async function doLookup(){
  var btn = document.getElementById('lookupBtn');
  var err = document.getElementById('errMsg');
  err.classList.remove('show');
  btn.textContent = 'Looking up…';
  btn.disabled = true;
  var body = {
    wo_number: document.getElementById('woNum').value.trim().toUpperCase(),
    phone: document.getElementById('woPhone').value.trim(),
  };
  try {
    var res = await fetch('/api/work-order-lookup', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    var data = await res.json();
    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    renderResult(data.work_order);
  } catch (e){
    err.textContent = e.message || 'Lookup failed.';
    err.classList.add('show');
  } finally {
    btn.textContent = 'Look up my work order';
    btn.disabled = false;
  }
}

function fmtMoney(n){ return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(s){ if (!s) return ''; return new Date(s).toLocaleString('en-US',{ month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function renderResult(w){
  var veh = [w.vehicle_year, w.vehicle_make, w.vehicle_model].filter(Boolean).join(' ');
  var statusLabel = {
    open: 'Received — opening soon',
    in_progress: 'Work in progress',
    awaiting_parts: 'Waiting on parts',
    completed: 'Repair complete — ready for pickup!',
    billed: 'Ready for pickup — invoice prepared',
    paid: 'Paid · Picked up',
    cancelled: 'Cancelled',
  }[w.status] || w.status;
  var sub = w.status === 'awaiting_parts' ? 'We\'re sourcing the parts. We\'ll text you when work resumes.' :
            w.status === 'completed' || w.status === 'billed' ? 'Your vehicle is ready. Come by during business hours.' :
            w.status === 'paid' ? 'Thanks for your business!' :
            w.status === 'in_progress' ? 'Our team is actively working on your car.' :
            'We\'ve received your vehicle and will start shortly.';
  var steps = [
    { key:'received', label:'Received at shop', ts: w.intake_date },
    { key:'started', label:'Work started', ts: w.status !== 'open' ? w.intake_date : null },
    { key:'completed', label:'Repair complete', ts: w.completed_at },
    { key:'paid', label:'Paid & collected', ts: w.paid_at },
  ];
  var stepIdx = 0;
  if (w.status === 'in_progress' || w.status === 'awaiting_parts') stepIdx = 1;
  else if (w.status === 'completed' || w.status === 'billed') stepIdx = 2;
  else if (w.status === 'paid') stepIdx = 3;

  var timelineHTML = steps.map(function(s, i){
    var done = (i < stepIdx) || s.ts;
    var current = (i === stepIdx);
    var cls = current ? 'current' : (done ? 'done' : '');
    return '<div class="step ' + (done?'done':'') + '">' +
      '<div class="dot ' + cls + '"></div>' +
      '<div class="lbl">' + esc(s.label) + (s.ts ? '<small>' + fmtDate(s.ts) + '</small>' : '') + '</div>' +
    '</div>';
  }).join('');

  var totalsHTML = (w.total_usd > 0) ? '<div class="totals">' +
    '<span>Labor</span><b>' + fmtMoney(w.labor_total_usd) + '</b>' +
    '<span>Parts</span><b>' + fmtMoney(w.parts_total_usd) + '</b>' +
    (Number(w.tax_usd) > 0 ? '<span>Tax</span><b>' + fmtMoney(w.tax_usd) + '</b>' : '') +
    '<span class="grand">Estimated total</span><b class="grand">' + fmtMoney(w.total_usd) + '</b>' +
    '</div>' : '';

  document.getElementById('result').classList.add('show');
  document.getElementById('result').innerHTML =
    '<div class="wo-num">' + esc(w.wo_number) + '</div>' +
    '<h3>' + esc(w.customer_name) + '</h3>' +
    '<div class="veh">' + esc(veh) + '</div>' +
    '<div class="status-card ' + esc(w.status) + '"><div class="label">Current status</div><div class="val">' + esc(statusLabel) + '</div><small>' + esc(sub) + '</small></div>' +
    '<div class="timeline">' + timelineHTML + '</div>' +
    (w.complaint ? '<div class="complaint"><b>Reported issue</b>' + esc(w.complaint) + '</div>' : '') +
    (w.work_performed ? '<div class="complaint"><b>Work performed</b>' + esc(w.work_performed) + '</div>' : '') +
    totalsHTML +
    '<div class="actions">' +
      '<a class="call" href="tel:+18767588503">📞 Call shop</a>' +
      '<a class="chat" href="https://wa.me/18767588503?text=' + encodeURIComponent('Hi, checking on work order ' + w.wo_number) + '" target="_blank" rel="noopener">💬 WhatsApp</a>' +
    '</div>';
  document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
}

// Pre-fill from URL query (?wo=WO-2026-0001&phone=...) for SMS deep links
(function(){
  var p = new URLSearchParams(location.search);
  if (p.get('wo')) document.getElementById('woNum').value = p.get('wo');
  if (p.get('phone')) document.getElementById('woPhone').value = p.get('phone');
  if (p.get('wo') && p.get('phone')) doLookup();
})();
</script>

</body>
</html>
