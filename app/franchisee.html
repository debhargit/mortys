<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Own a Vision Auto Solutions franchise</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --red:#d62828; --navy:#0b1b2b; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --ok:#16a34a; --bg:#f6f7f9; --card:#fff; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; } }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header.top{background:var(--navy);color:#fff;padding:14px 16px}
  header.top h1{margin:0;font-size:18px;font-weight:800} header.top small{color:#cbd5e1}
  main{max-width:820px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{margin:0 0 6px;font-size:17px} h3{font-size:14px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  table{width:100%;border-collapse:collapse} td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} td.n,th.n{text-align:right;white-space:nowrap}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=email],input[type=tel],input[type=month],input[type=number],textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px} @media (max-width:560px){ .two{grid-template-columns:1fr} }
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  button{font:inherit;padding:11px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  button.go{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;flex:1}
  button:disabled{opacity:.5}
  .msg{padding:12px;border-radius:8px;background:#fee2e2;color:#991b1b}
  .ok{padding:14px;border-radius:8px;background:#dcfce7;color:#14532d;font-weight:600}
  .muted{color:var(--muted);font-size:13px}
  iframe.doc{width:100%;height:65vh;border:1px solid var(--line);border-radius:8px;background:#fff}
  #pad canvas{width:100%;height:170px;border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none}
  .hp{position:absolute;left:-9999px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px} .tabs button{padding:7px 14px;border-radius:999px} .tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
</style>
</head>
<body>
<header class="top"><h1 id="shop">Vision Auto Solutions</h1><small id="sub">Franchise</small></header>
<main id="out"><div class="card muted">Loading…</div></main>
<script src="/assets/invoice-scan.js?v=20261028"></script>
<script>
(function () {
  'use strict';
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var J = function (v) { return 'J$' + Number(v || 0).toLocaleString('en-JM', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var day = function (t) { return t ? new Date(String(t).length === 10 ? t + 'T12:00:00' : t).toLocaleDateString('en-JM') : ''; };
  var monthName = function (p) { return p ? new Date(p.slice(0, 7) + '-15T12:00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : ''; };
  var q = new URLSearchParams(location.search);
  var out = document.getElementById('out');
  var $ = function (id) { return document.getElementById(id); };
  var stop = function (m) { out.innerHTML = '<div class="card"><div class="msg">' + esc(m) + '</div></div>'; };
  function call(url, body) {
    return fetch(url, body ? { method: 'POST', credentials: 'omit', referrerPolicy: 'no-referrer', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : { credentials: 'omit', referrerPolicy: 'no-referrer' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; }); });
  }

  // ---------------------------------------------------------- signing --
  if (q.get('s')) {
    var token = q.get('s');
    var url = '/api/public/franchise-sign/' + encodeURIComponent(token);
    $('sub').textContent = 'Read and sign';
    call(url).then(function (d) {
      if (d.company && d.company.company) $('shop').textContent = d.company.company;
      out.innerHTML = '<div class="card"><h2>' + esc(d.title) + ' <small class="muted">' + esc(d.number) + '</small></h2><p class="muted">Read the whole document. You may take advice from your own attorney before you sign.</p>' +
        '<iframe class="doc" id="doc" sandbox="allow-same-origin"></iframe></div>' +
        (d.not_yet ? '<div class="card"><div class="msg">' + esc(d.not_yet) + '</div></div>' :
        '<div class="card"><label for="nm">Your full name</label><input type="text" id="nm" autocomplete="name">' +
        '<label>Sign below with your finger or mouse</label><div id="pad"></div>' +
        '<label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px;margin-top:12px"><input type="checkbox" id="ag" style="margin-top:3px"> I have read this document and I sign it as my own.</label>' +
        '<div class="row"><button id="clr">Clear</button><button class="go" id="go">Sign</button></div><div id="m" style="margin-top:10px"></div>' +
        '<p class="muted">Your signature, the time and your internet address are kept with a fingerprint of the document, so neither can be changed later.' + (d.company && d.company.company_phone ? ' Questions? Call ' + esc(d.company.company_phone) + '.' : '') + '</p>' +
        '<details><summary class="muted">I do not want to sign</summary><label for="why">Tell us why (optional)</label><textarea id="why" rows="2"></textarea><div class="row"><button id="no">Decline to sign</button></div></details></div>');
      $('doc').srcdoc = d.html;
      if (d.not_yet) return;
      var pad = window.VAScan.pad($('pad'));
      $('clr').onclick = pad.clear;
      $('go').onclick = function () {
        var m = $('m'), name = $('nm').value.trim();
        if (name.length < 2) { m.innerHTML = '<div class="msg">Type your name.</div>'; return; }
        if (pad.empty()) { m.innerHTML = '<div class="msg">Sign in the box.</div>'; return; }
        if (!$('ag').checked) { m.innerHTML = '<div class="msg">Tick the box to confirm.</div>'; return; }
        this.disabled = true;
        call(url, { name: name, image: pad.png(), agree: true }).then(function () { out.innerHTML = '<div class="card"><div class="ok">Thank you, ' + esc(name) + '. ' + esc(d.title) + ' is signed.</div><p class="muted">We will send you a copy. You can close this page.</p></div>'; })
          .catch(function (e) { $('go').disabled = false; m.innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; });
      };
      $('no').onclick = function () { if (!confirm('Decline to sign this document?')) return; call(url, { decline: true, reason: $('why').value }).then(function () { out.innerHTML = '<div class="card"><div class="ok">We have noted that you declined. We will be in touch.</div></div>'; }).catch(function (e) { stop(e.message); }); };
    }).catch(function (e) { stop(e.message); });
    try { history.replaceState(null, '', location.pathname + '?s=' + encodeURIComponent(token)); } catch (_) {}
    return;
  }

  // ---------------------------------------------- the franchisee's page --
  if (q.get('p')) {
    var purl = '/api/public/franchisee/' + encodeURIComponent(q.get('p'));
    var tab = 'report';
    var draw = function () {
      call(purl).then(function (d) {
        var f = d.franchisee, t = d.terms;
        $('shop').textContent = f.trading_name || f.legal_name; $('sub').textContent = 'Franchisee ' + f.number + (f.territory ? ' · ' + f.territory : '');
        var tabs = [['report', 'Monthly sales report'], ['statement', 'Statement'], ['audits', 'Audits'], ['manual', 'Operations manual']].concat(d.tasks.length ? [['open', 'Opening checklist']] : []);
        var h = '<div class="tabs">' + tabs.map(function (x) { return '<button data-t="' + x[0] + '"' + (x[0] === tab ? ' class="on"' : '') + '>' + x[1] + '</button>'; }).join('') + '</div><div class="card">';
        if (tab === 'report') {
          var lm = new Date(); lm.setDate(1); lm.setMonth(lm.getMonth() - 1);
          h += '<h2>Send the month\'s sales</h2><p class="muted">Due by day ' + t.report_day + ' of the next month, from the till\'s sales summary. Royalty ' + t.royalty_pct + '%, brand fund ' + t.marketing_pct + '% of net sales, and the technology fee ' + J(t.tech_fee) + ', plus GCT, are invoiced from it and due by day ' + t.royalty_due_day + '.</p>' +
            '<div class="two"><div><label>Month</label><input type="month" id="rP" value="' + lm.getFullYear() + '-' + String(lm.getMonth() + 1).padStart(2, '0') + '"></div><div><label>Gross sales, including GCT (J$)</label><input type="text" inputmode="decimal" id="rG"></div>' +
            '<div><label>Refunds (J$)</label><input type="text" inputmode="decimal" id="rR"></div><div><label>GCT collected (J$)</label><input type="text" inputmode="decimal" id="rT"></div>' +
            '<div><label>Number of sales</label><input type="number" id="rN"></div><div><label>Local marketing spent (J$)</label><input type="text" inputmode="decimal" id="rL"></div></div><label>Notes</label><textarea id="rNo" rows="2"></textarea>' +
            '<div class="row"><button class="go" id="rGo">Send report</button></div><div id="rM" style="margin-top:10px"></div>' +
            '<h3>Sent</h3><table><tbody>' + (d.reports.map(function (r) { return '<tr><td>' + esc(monthName(r.period)) + '</td><td class="n">' + J(r.net_sales) + ' net</td><td>' + (r.billed ? 'invoiced' : 'received') + '</td></tr>'; }).join('') || '<tr><td class="muted">None yet.</td></tr>') + '</tbody></table>';
        } else if (tab === 'statement') {
          var s = d.statement;
          h += '<h2>Your account</h2><p>Billed ' + J(s.billed) + ' · paid ' + J(s.paid) + ' · <b>owed ' + J(s.balance) + '</b>' + (s.overdue ? ' · <b style="color:var(--red)">overdue ' + J(s.overdue) + '</b>' : '') + '</p><table><thead><tr><th>Invoice</th><th>Due</th><th>For</th><th class="n">Total</th><th class="n">Owed</th></tr></thead><tbody>' +
            (s.invoices.map(function (i) { return '<tr><td>' + esc(i.number) + '<br><small class="muted">' + esc(day(i.invoice_date)) + '</small></td><td>' + esc(day(i.due_date)) + '</td><td>' + esc(i.memo || '') + '</td><td class="n">' + J(i.total) + '</td><td class="n">' + J(i.balance) + '</td></tr>'; }).join('') || '<tr><td colspan="5" class="muted">No invoices yet.</td></tr>') + '</tbody></table>' +
            '<p class="muted">To pay or ask about an invoice, call ' + esc(d.company.company_phone) + '.</p>';
        } else if (tab === 'audits') {
          h += '<h2>Audits</h2>' + (d.audits.map(function (a) { return '<p><b>' + esc(day(a.audit_date)) + '</b>: ' + a.score_pct + '% (' + esc(a.result) + ')' + (a.findings ? '<br>' + esc(a.findings) : '') + (a.actions ? '<br><i>To do:</i> ' + esc(a.actions) : '') + (a.follow_up_on ? '<br>Follow-up visit ' + esc(day(a.follow_up_on)) : '') + '</p>'; }).join('') || '<p class="muted">No audits yet.</p>');
        } else if (tab === 'manual') {
          h += d.manual ? '<iframe class="doc" id="man" sandbox="allow-same-origin"></iframe><p class="muted">Confidential. Do not copy or share it outside the shop.</p>' : '<p class="muted">Your copy of the operations manual has not been issued yet.</p>';
        } else {
          h += '<h2>Opening checklist</h2>' + d.tasks.map(function (k) { return '<div>' + (k.done_at ? '✅' : '⬜') + ' ' + esc(k.title) + (k.due_on && !k.done_at ? ' <small class="muted">due ' + esc(day(k.due_on)) + '</small>' : '') + '</div>'; }).join('');
        }
        out.innerHTML = h + '</div>';
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); draw(); }; });
        if ($('man')) $('man').srcdoc = d.manual;
        if ($('rGo')) $('rGo').onclick = function () {
          var b = this; b.disabled = true;
          call(purl + '/report', { period: $('rP').value, gross_sales: $('rG').value, refunds: $('rR').value, gct_collected: $('rT').value, transactions: $('rN').value, local_marketing: $('rL').value, notes: $('rNo').value })
            .then(function (r) { $('rM').innerHTML = '<div class="ok">Thank you. ' + esc(monthName(r.period)) + ' received: net sales ' + J(r.net_sales) + '.</div>'; setTimeout(draw, 1500); })
            .catch(function (e) { b.disabled = false; $('rM').innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; });
        };
      }).catch(function (e) { stop(e.message); });
    };
    draw();
    return;
  }

  // ---------------------------------------------------- the enquiry form --
  $('sub').textContent = 'Own a Vision Auto Solutions franchise';
  out.innerHTML = '<div class="card"><h2>Bring Vision Auto Solutions to your area</h2><p>We are looking for people who want to run their own auto-parts shop with our name, our till and online ordering system, our suppliers and our training. Tell us about yourself and we will call you.</p>' +
    '<p class="muted">Nothing here commits you. Before you decide, you will sign a confidentiality agreement, receive our franchise disclosure document, and have time to take advice from your own attorney and accountant.</p></div>' +
    '<div class="card"><div class="two"><div><label>Your name *</label><input type="text" id="eN" autocomplete="name"></div><div><label>Company (if any)</label><input type="text" id="eC"></div>' +
    '<div><label>Phone *</label><input type="tel" id="eP" autocomplete="tel"></div><div><label>Email</label><input type="email" id="eE" autocomplete="email"></div>' +
    '<div><label>Parish</label><select id="ePa"><option value=""></option>' + ['Kingston', 'St Andrew', 'St Catherine', 'Clarendon', 'Manchester', 'St Elizabeth', 'Westmoreland', 'Hanover', 'St James', 'Trelawny', 'St Ann', 'St Mary', 'Portland', 'St Thomas'].map(function (p) { return '<option>' + p + '</option>'; }).join('') + '</select></div>' +
    '<div><label>Town or area you want</label><input type="text" id="eA"></div>' +
    '<div><label>Cash you could invest (J$)</label><input type="text" inputmode="decimal" id="eCap"></div><div><label>When you would like to open</label><select id="eT"><option></option><option>Within 6 months</option><option>6 to 12 months</option><option>More than a year</option><option>Just looking</option></select></div></div>' +
    '<label>Your business or motor-trade experience</label><textarea id="eX" rows="2"></textarea><label>Anything else</label><textarea id="eM" rows="2"></textarea>' +
    '<input class="hp" type="text" id="eW" tabindex="-1" autocomplete="off" aria-hidden="true">' +
    '<label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px;margin-top:12px"><input type="checkbox" id="eOk" style="margin-top:3px"> Vision Auto Solutions may contact me about this enquiry and keep these details for it, as the Data Protection Act, 2020 allows.</label>' +
    '<div class="row"><button class="go" id="eGo">Send my enquiry</button></div><div id="eMsg" style="margin-top:10px"></div></div>';
  $('eGo').onclick = function () {
    var b = this, m = $('eMsg');
    if ($('eN').value.trim().length < 2 || $('eP').value.trim().length < 7) { m.innerHTML = '<div class="msg">Your name and phone number, please.</div>'; return; }
    if (!$('eOk').checked) { m.innerHTML = '<div class="msg">Tick the box so we may contact you.</div>'; return; }
    b.disabled = true;
    call('/api/public/franchise-enquiry', { name: $('eN').value, company: $('eC').value, phone: $('eP').value, email: $('eE').value, parish: $('ePa').value, area_wanted: $('eA').value, capital: $('eCap').value, timeline: $('eT').value,
      experience: $('eX').value, message: $('eM').value, website: $('eW').value, consent: true })
      .then(function () { out.innerHTML = '<div class="card"><div class="ok">Thank you. We have your enquiry and will be in touch within two working days.</div></div>'; })
      .catch(function (e) { b.disabled = false; m.innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; });
  };
})();
</script>
</body>
</html>
