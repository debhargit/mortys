<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit cards · Vision Auto Solutions</title>
<link rel="stylesheet" href="/assets/books.css">
<link rel="icon" href="/favicon.svg?v=vision2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=vision2" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico?v=vision2" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=vision2">
<style>
  .cc{position:relative;border-radius:14px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#0b1b2b,#24486b);min-height:150px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
  .cc.on{border-color:var(--red)} .cc.closed{filter:grayscale(1);opacity:.7}
  .cc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:12.5px;opacity:.9}
  .cc .nm{font-weight:600;font-size:15px} .cc .num{font-family:ui-monospace,Consolas,monospace;letter-spacing:2px;opacity:.85;font-size:13px}
  .cc .owed{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums} .cc small{opacity:.85}
  .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden} .bar > i{display:block;height:100%;background:#4ade80}
  .bar > i.warn{background:#fbbf24} .bar > i.bad{background:#f87171}
  .ccgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:12px}
  .cc .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto} .cc .pill{background:rgba(255,255,255,.18);color:#fff}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .hbar{display:flex;align-items:center;gap:8px} .hbar span.b{flex:1;height:9px;background:var(--chip);border-radius:99px;overflow:hidden} .hbar span.b i{display:block;height:100%;background:var(--navy)}
  @media (prefers-color-scheme: dark){ .hbar span.b i{background:#60a5fa} }
  .kind{font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--chip);white-space:nowrap}
  .kind.payment,.kind.refund,.kind.reward{background:#16a34a22;color:var(--ok)} .kind.fee,.kind.interest{background:#d6282822;color:var(--red)}
  .form2{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px} .form2 label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px} .form2 input,.form2 select{width:100%}
  .chart{width:100%;height:auto;display:block}
  @media (max-width:600px){ .tabs{overflow-x:auto;flex-wrap:nowrap} .tabs button{flex:0 0 auto} }
</style>
<script src="/assets/vas-ui.js?v=20261110b" data-chrome="page"></script>
</head>
<body>
<header><h1>💳 Credit cards</h1><nav><a href="/banking.html">Banking</a><a href="/payables.html">Payables</a><a href="/accounting.html">Ledger</a><a href="/admin.html">Admin</a></nav></header>
<main>
  <div class="tabs" id="tabs"><button data-t="home" class="on">Cards</button><button data-t="reg">Register</button><button data-t="charge">Add charge</button><button data-t="pay">Pay card</button><button data-t="stmt">Statements</button><button data-t="feed">Statement lines</button><button data-t="rec">Reconcile</button><button data-t="rew">Rewards</button><button data-t="rep">Reports</button><button data-t="setup">Setup</button></div>
  <div id="out"><div class="empty">Loading…</div></div>
</main>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script src="/assets/books-common.js?v=20261109cc"></script>
<script>
(function () {
  'use strict';
  var B = window.Books, $ = B.$, all = B.all, esc = B.esc, J = B.J, api = B.api, toast = B.toast, modal = B.modal, close = B.close;
  var tab = 'home', card = null, cards = [], over = null;
  try { card = +localStorage.getItem('vision.ccAcct') || null; } catch (_) {}
  var KIND = { purchase: 'Purchase', refund: 'Refund / credit', fee: 'Fee', interest: 'Interest', cash_advance: 'Cash advance', payment: 'Payment', reward: 'Reward credit', moved: 'Moved to card', journal: 'Journal', bill: 'Supplier bill paid', po: 'Purchase order paid', other: 'Other' };
  var PAY = { paid: ['ok', 'Paid in full'], minimum_paid: ['warn', 'Minimum paid'], due: ['', 'Due'], overdue: ['bad', 'Overdue'] };
  var MONTHS = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function pick(id) { card = id; try { localStorage.setItem('vision.ccAcct', id); } catch (_) {} }
  function cur() { return cards.find(function (c) { return c.id === card; }) || {}; }
  function label(c) { return (c.name || '') + (c.last4 ? ' ••' + c.last4 : ''); }
  function cardSelect(id) { return '<select id="' + id + '">' + cards.map(function (c) { return '<option value="' + c.id + '"' + (c.id === card ? ' selected' : '') + '>' + esc(label(c)) + '</option>'; }).join('') + '</select>'; }
  function wireCardSelect(id, then) { if ($('#' + id)) $('#' + id).onchange = function () { pick(+this.value); then(); }; }
  function payPill(s) { var p = PAY[s]; return p ? '<span class="pill ' + p[0] + '">' + p[1] + '</span>' : ''; }
  function bankOptions(sel) { return B.accounts().filter(function (a) { return a.bank && a.system_key !== 'cash_drawers'; }).map(function (a) { return '<option value="' + a.id + '"' + (String(sel) === String(a.id) ? ' selected' : '') + '>' + esc(a.code + ' ' + a.name) + '</option>'; }).join(''); }
  function holderOptions(sel) { return '<option value="">—</option>' + (cur().holders || []).filter(function (h) { return h.is_active || String(h.id) === String(sel); }).map(function (h) { return '<option value="' + h.id + '"' + (String(sel) === String(h.id) ? ' selected' : '') + '>' + esc(h.name + (h.last4 ? ' ••' + h.last4 : '')) + '</option>'; }).join(''); }
  function needCard() { if (cards.length) return false; $('#out').innerHTML = '<div class="card"><div class="empty">No credit cards yet. Add one on the <b>Setup</b> tab.</div></div>'; return true; }
  function bars(rows, money) {
    var max = rows.reduce(function (m, r) { return Math.max(m, Math.abs(r.amount)); }, 0) || 1;
    return rows.length ? '<table><tbody>' + rows.map(function (r) { return '<tr><td>' + esc(r.label) + '<div class="hbar" style="margin-top:4px"><span class="b"><i style="width:' + Math.max(1, Math.round(Math.abs(r.amount) / max * 100)) + '%"></i></span></div></td><td class="n">' + (money === false ? r.amount : J(r.amount)) + '<br><small>' + r.count + ' item' + (r.count === 1 ? '' : 's') + '</small></td></tr>'; }).join('') + '</tbody></table>' : '<div class="empty">Nothing in this period.</div>';
  }
  function loadCards() { return api('/api/cards').then(function (d) { over = d; cards = d.cards; if (!card || !cards.some(function (c) { return c.id === card; })) pick((cards[0] || {}).id || null); return d; }); }

  // ------------------------------------------------------------ cards (overview) --
  function home() {
    return loadCards().then(function (d) {
      var t = d.totals;
      $('#out').innerHTML = (d.ledger_started ? '' : '<div class="note warn">The general ledger has not been started (Accounting page). Card registers and reconciliation read the ledger, so start it first.</div>') +
        '<div class="tiles"><div class="tile"><span class="k">Owed on all cards</span><b>' + J(t.owed) + '</b></div><div class="tile"><span class="k">Total limits</span><b>' + J(t.limit) + '</b></div><div class="tile"><span class="k">Available</span><b>' + J(t.available) + '</b></div>' +
        '<div class="tile' + (t.utilization >= 80 ? ' bad' : '') + '"><span class="k">Used</span><b>' + (t.utilization == null ? '—' : t.utilization + '%') + '</b></div><div class="tile"><span class="k">Rewards value</span><b>' + J(t.rewards_value) + '</b></div></div>' +
        (d.alerts.length ? '<div class="card"><h2>Needs attention</h2>' + d.alerts.map(function (a) { return '<div class="note ' + (a.level === 'bad' ? 'bad' : a.level === 'warn' ? 'warn' : 'info') + '"' + (a.card ? ' data-go="' + a.card + '" style="cursor:pointer"' : '') + '>' + esc(a.text) + '</div>'; }).join('') + '</div>' : '') +
        '<div class="ccgrid">' + d.cards.map(function (c) {
          var u = c.utilization, cls = u >= 100 ? 'bad' : u >= 80 ? 'warn' : '';
          var ls = c.last_statement;
          return '<div class="cc' + (c.id === card ? ' on' : '') + (c.status === 'closed' ? ' closed' : '') + '" data-c="' + c.id + '"><div class="top"><div><div class="nm">' + esc(c.name) + '</div>' + esc([c.issuer, c.network].filter(Boolean).join(' · ')) + '</div><div style="text-align:right">' + (c.status !== 'active' ? '<span class="pill">' + esc(c.status) + '</span>' : '') + '</div></div>' +
            '<div class="num">•••• •••• •••• ' + esc(c.last4 || '····') + '</div>' +
            '<div><small>Owed</small><div class="owed">' + J(c.owed) + '</div></div>' +
            (c.credit_limit ? '<div class="bar"><i class="' + cls + '" style="width:' + Math.min(100, Math.max(0, u || 0)) + '%"></i></div><small>' + (u || 0) + '% of ' + J(c.credit_limit) + ' · ' + J(c.available) + ' available</small>' : '<small>No limit entered</small>') +
            '<div class="pills">' + (ls ? '<span class="pill">Statement ' + esc(ls.closing_date) + ': ' + J(ls.new_balance) + '</span>' + (c.pay_status !== 'paid' && ls.due_date ? '<span class="pill">Due ' + esc(ls.due_date) + '</span>' : '') + '<span class="pill">' + PAY[c.pay_status][1] + '</span>' : '<span class="pill">No statement yet</span>') +
            (c.rewards.kind !== 'none' ? '<span class="pill">' + esc(fmtPts(c.rewards.balance, c.rewards.kind)) + '</span>' : '') + (c.to_review ? '<span class="pill">' + c.to_review + ' to review</span>' : '') + '</div></div>';
        }).join('') + '</div>' +
        (d.cards.length ? '<div class="card"><h2>Card by card</h2><div class="scroll"><table><thead><tr><th>Card</th><th class="n">Owed</th><th class="n">Limit</th><th class="n">Used</th><th>Last statement</th><th class="n">Still to pay</th><th class="n">Minimum left</th><th>Due</th><th>Status</th><th>Next statement</th><th class="n">Rewards</th></tr></thead><tbody>' +
          d.cards.map(function (c) { var ls = c.last_statement; return '<tr class="click" data-c="' + c.id + '"><td>' + esc(label(c)) + '</td><td class="n">' + J(c.owed) + '</td><td class="n">' + (c.credit_limit ? J(c.credit_limit) : '—') + '</td><td class="n">' + (c.utilization == null ? '—' : c.utilization + '%') + '</td><td>' + (ls ? esc(ls.closing_date) + ' · ' + J(ls.new_balance) : '—') + '</td><td class="n">' + (ls ? J(c.statement_left) : '') + '</td><td class="n">' + (ls ? J(c.minimum_left) : '') + '</td><td>' + esc(c.next_due || '') + '</td><td>' + (ls ? payPill(c.pay_status) : '') + '</td><td>' + esc(c.next_statement || '') + '</td><td class="n">' + (c.rewards.kind !== 'none' ? J(c.rewards.value) : '—') + '</td></tr>'; }).join('') + '</tbody></table></div></div>' : '<div class="card"><div class="empty">No credit cards yet. Add one on the <b>Setup</b> tab.</div></div>') +
        (d.off_card ? '<div class="card" id="offbox"><h2>Paid by card elsewhere</h2><p class="sub">Loading…</p></div>' : '');
      all('[data-c]').forEach(function (x) { x.onclick = function () { pick(+x.getAttribute('data-c')); tab = 'reg'; show(); }; });
      all('[data-go]').forEach(function (x) { x.onclick = function () { pick(+x.getAttribute('data-go')); tab = 'reg'; show(); }; });
      if (d.off_card) offCard();
    });
  }
  function fmtPts(v, kind) { return kind === 'cashback' ? J(v) + ' cashback' : Math.round(v).toLocaleString() + ' ' + (kind === 'miles' ? 'miles' : 'points'); }
  function offCard() {
    api('/api/cards/off-card').then(function (d) {
      $('#offbox').innerHTML = '<h2>Paid by card elsewhere</h2><p class="sub">Supplier bill payments (Payables) and purchase-order payments marked <b>card</b> that went to a bank or clearing account instead of a credit card. "Move to card" puts the money back on the account it went to and charges the card, so both are right.</p>' +
        '<div class="scroll"><table><thead><tr><th>Date</th><th>From</th><th>Paid to</th><th>Booked to</th><th class="n">Amount</th><th>Card</th><th></th></tr></thead><tbody>' + d.items.map(function (i, k) {
          return '<tr><td>' + esc(i.day) + '</td><td>' + (i.source_kind === 'ap_payment' ? 'Payables' : 'Purchase order') + '</td><td>' + esc(i.party || '') + '<br><small>' + esc(i.reference || '') + '</small></td><td>' + esc(i.booked_to || 'not posted yet') + '</td><td class="n">' + J(i.amount) + '</td><td>' + cardSelect('mv' + k) + '</td><td><button class="sm" data-mv="' + k + '"' + (i.gl_line_id ? '' : ' disabled') + '>Move to card</button></td></tr>';
        }).join('') + '</tbody></table></div>';
      all('[data-mv]').forEach(function (b) { b.onclick = function () { var i = d.items[+b.getAttribute('data-mv')]; api('/api/cards/' + $('#mv' + b.getAttribute('data-mv')).value + '/move-in', 'POST', { source_kind: i.source_kind, id: i.id }).then(function () { toast('Moved to the card'); home(); }).catch(function (e) { toast(e.message); }); }; });
    }).catch(function (e) { $('#offbox').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>'; });
  }

  // ------------------------------------------------------------ register --
  function reg() {
    if (needCard()) return;
    var p = reg.p = reg.p || { from: '', to: '', q: '', kind: '', holder: '' };
    return api('/api/cards/' + card + '/register?from=' + p.from + '&to=' + p.to + '&kind=' + p.kind + '&holder=' + p.holder + '&q=' + encodeURIComponent(p.q)).then(function (d) {
      var c = cur();
      $('#out').innerHTML = '<div class="card"><div class="controls"><div><label>Card</label>' + cardSelect('ra') + '</div><div><label>From</label><input type="date" id="rf" value="' + esc(p.from) + '"></div><div><label>To</label><input type="date" id="rt" value="' + esc(p.to) + '"></div>' +
        '<div><label>Kind</label><select id="rk"><option value="">All</option>' + Object.keys(KIND).map(function (k) { return '<option value="' + k + '"' + (p.kind === k ? ' selected' : '') + '>' + KIND[k] + '</option>'; }).join('') + '</select></div>' +
        '<div><label>Cardholder</label><select id="rh">' + holderOptions(p.holder).replace('>—<', '>All<') + '</select></div><div><label>Find</label><input id="rq" value="' + esc(p.q) + '" placeholder="payee, ref, amount"></div><button id="rgo">Show</button><button id="rcsv">CSV</button></div>' +
        '<div class="tiles"><div class="tile"><span class="k">Owed now</span><b>' + J(c.owed) + '</b></div><div class="tile"><span class="k">Available</span><b>' + (c.available == null ? '—' : J(c.available)) + '</b></div><div class="tile"><span class="k">Reconciled</span><b>' + J(c.reconciled) + '</b></div><div class="tile"><span class="k">Not yet cleared</span><b>' + (c.uncleared || 0) + '</b></div></div>' +
        (d.pending.length ? '<div class="note warn">' + d.pending.length + ' transaction(s) saved but not in the ledger yet (they post within a minute, or once the ledger is started): ' + d.pending.map(function (x) { return esc(x.day + ' ' + (KIND[x.kind] || x.kind) + ' ' + J(x.amount)); }).join(', ') + '</div>' : '') +
        '<p class="sub">Every ledger line on this card, newest first, from whichever module made it. Owed goes up with charges, down with payments and credits. C = ticked in the open reconciliation, R = reconciled.' + (d.more ? ' Showing the latest 1,000.' : '') + '</p>' +
        '<div class="scroll"><table><thead><tr><th>Date</th><th>Kind</th><th>Payee / memo</th><th>Category</th><th>Holder</th><th>From</th><th class="n">Charge</th><th class="n">Payment / credit</th><th>✓</th><th class="n">Owed</th><th></th></tr></thead><tbody>' +
        (d.lines.length ? d.lines.map(function (l) {
          var voidable = !l.voided && l.cleared !== 'R' && (l.source_kind === 'bank_txn' || l.source_kind === 'ap_payment');
          return '<tr style="' + (l.voided ? 'opacity:.55' : '') + '"><td style="white-space:nowrap">' + esc(l.day) + '<br><small>' + esc(l.number) + '</small></td><td><span class="kind ' + esc(l.kind) + '">' + esc(l.kind_label) + '</span></td><td>' + esc(l.party || '') + '<br><small>' + esc([l.memo, l.ref].filter(Boolean).join(' · ')) + '</small></td><td><small>' + esc(l.category || '') + '</small></td><td><small>' + esc(l.holder || '') + '</small></td><td><small>' + esc(l.from) + '</small></td>' +
            '<td class="n">' + (l.amount > 0 ? J(l.amount) : '') + '</td><td class="n">' + (l.amount < 0 ? J(-l.amount) : '') + '</td><td>' + esc(l.cleared) + '</td><td class="n">' + (l.balance != null ? J(l.balance) : '') + '</td>' +
            '<td style="white-space:nowrap">' + (l.source_kind === 'bank_txn' ? '<button class="sm" data-tv="' + l.source_id + '">Open</button> ' : '') + (voidable ? '<button class="sm" data-void="' + l.source_kind + ':' + l.source_id + '">Void</button>' : '') + '</td></tr>';
        }).join('') : '<tr><td colspan="11" class="empty">Nothing on this card' + (p.from || p.q || p.kind ? ' for these filters' : ' yet') + '.</td></tr>') + '</tbody></table></div></div>';
      wireCardSelect('ra', reg);
      $('#rgo').onclick = function () { p.from = $('#rf').value; p.to = $('#rt').value; p.q = $('#rq').value.trim(); p.kind = $('#rk').value; p.holder = $('#rh').value; reg(); };
      $('#rcsv').onclick = function () { B.csv('card-' + d.account.code + '.csv', [['date', 'entry', 'kind', 'payee', 'memo', 'ref', 'category', 'holder', 'from', 'charge', 'payment_credit', 'cleared', 'owed']].concat(d.lines.map(function (l) { return [l.day, l.number, l.kind_label, l.party, l.memo, l.ref, l.category, l.holder, l.from, l.amount > 0 ? l.amount : '', l.amount < 0 ? -l.amount : '', l.cleared, l.balance]; }))); };
      all('[data-tv]').forEach(function (b) { b.onclick = function () { viewTxn(+b.getAttribute('data-tv')); }; });
      all('[data-void]').forEach(function (b) {
        b.onclick = async function () {
          var k = b.getAttribute('data-void').split(':'), r = await vasPrompt('Why is it voided? (e.g. entered twice, wrong card)'); if (!r) return;
          api(k[0] === 'bank_txn' ? '/api/cards/txns/' + k[1] + '/void' : '/api/ap/payments/' + k[1] + '/void', 'POST', { reason: r }).then(function () { toast('Voided: a reversing entry is posted'); setTimeout(function () { loadCards().then(reg); }, 600); }).catch(function (e) { toast(e.message); });
        };
      });
    });
  }
  function viewTxn(id) {
    api('/api/cards/txns/' + id).then(function (d) {
      var t = d.txn;
      modal('<h2>' + esc(t.kind_label || '') + ' · ' + esc(t.card || t.account) + (t.voided_at ? ' <span class="pill bad">void</span>' : '') + '</h2><p class="sub">' + esc(t.day) + (t.payee ? ' · ' + esc(t.payee) : '') + (t.holder ? ' · ' + esc(t.holder) : '') + (t.reference ? ' · ref ' + esc(t.reference) : '') + (t.memo ? ' · ' + esc(t.memo) : '') + (t.void_reason ? ' · void: ' + esc(t.void_reason) : '') + '</p>' +
        '<table><tbody>' + d.lines.map(function (l) { return '<tr><td>' + esc(l.code + ' ' + l.account) + '</td><td>' + esc(l.memo || '') + '</td><td class="n">' + J(l.amount) + '</td></tr>'; }).join('') + '<tr><td><b>Total</b></td><td></td><td class="n"><b>' + J(t.amount) + '</b></td></tr></tbody></table>' +
        '<div class="controls" style="margin-top:10px">' + (t.receipt_name ? '<a href="/api/cards/txns/' + t.id + '/receipt" target="_blank" rel="noopener"><button>Receipt: ' + esc(t.receipt_name) + '</button></a>' : '') + '<button id="x">Close</button></div>');
      $('#x').onclick = close;
    }).catch(function (e) { toast(e.message); });
  }

  // ------------------------------------------------------------ add a charge --
  function charge() {
    if (needCard()) return;
    var k = charge.k = charge.k || 'purchase';
    var multi = k === 'purchase' || k === 'refund';
    $('#out').innerHTML = '<div class="card"><h2>Add to a card</h2><div class="tabs" id="ck">' + [['purchase', 'Purchase'], ['refund', 'Refund / credit'], ['fee', 'Fee'], ['interest', 'Interest'], ['cash_advance', 'Cash advance']].map(function (x) { return '<button data-k="' + x[0] + '" class="' + (x[0] === k ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</div>' +
      '<p class="sub">' + ({ purchase: 'Something bought on the card that is not a supplier bill. A supplier\'s bill is paid in Payables → Pay bills with this card as "Pay from", so the supplier balance stays right.', refund: 'Money put back on the card by a shop (a return or a credit): the expense goes back down.', fee: 'Annual fee, late fee, over-limit fee and the like: Credit Card Interest and Fees.', interest: 'Interest charged on the statement: Credit Card Interest and Fees.', cash_advance: 'Cash taken out with the card: it goes into the bank or cash account it was put in.' })[k] + '</p>' +
      '<div class="controls"><div><label>Card</label>' + cardSelect('ta') + '</div>' + (multi ? '<div style="flex:1;min-width:180px"><label>' + (k === 'refund' ? 'From (shop)' : 'Paid to (shop)') + '</label><input id="tp" style="width:100%"></div>' : '') +
      '<div><label>Cardholder</label><select id="th">' + holderOptions() + '</select></div><div><label>Date</label><input type="date" id="td" value="' + B.today() + '"></div><div><label>Reference</label><input id="tr" style="width:120px"></div></div>' +
      (multi ? '<table class="lines"><thead><tr><th style="width:30%">Category (account)</th><th style="width:13%">Class</th><th style="width:15%">Asset</th><th>Memo</th><th class="n" style="width:150px">Amount</th><th style="width:40px"></th></tr></thead><tbody id="tl"></tbody></table><div class="controls" style="margin-top:6px"><button class="sm" id="add">Add a line</button></div>'
        : '<div class="controls"><div><label>Amount (J$)</label><input id="ta1" type="number" step="0.01" style="width:150px"></div>' + (k === 'cash_advance' ? '<div><label>Cash went into</label><select id="tto">' + bankOptions() + '</select></div>' : '') + '</div>') +
      '<div class="controls"><div style="flex:1"><label>Memo</label><input id="tm" style="width:100%"></div><div><label>Receipt (photo or PDF, optional)</label><input type="file" id="tf" accept="image/*,application/pdf"></div></div>' +
      '<h3 id="tt" style="text-align:right"></h3><div class="controls"><button class="primary" id="tgo">Save</button></div></div>';
    all('#ck [data-k]').forEach(function (b) { b.onclick = function () { charge.k = b.getAttribute('data-k'); charge(); }; });
    wireCardSelect('ta', charge);

  function monthChart(rows) {
    if (!rows.length) return '<div class="empty">Nothing in this period.</div>';
    var W = 760, H = 220, pad = 46, max = rows.reduce(function (m, r) { return Math.max(m, r.charges + r.fees_interest, r.payments); }, 0) || 1;
    var bw = (W - pad - 10) / rows.length, y = function (v) { return H - 24 - (v / max) * (H - 40); };
    var g = '';
    rows.forEach(function (r, i) {
      var x = pad + i * bw + 4, w = Math.max(4, bw / 2 - 5);
      g += '<rect x="' + x + '" y="' + y(r.charges) + '" width="' + w + '" height="' + (H - 24 - y(r.charges)) + '" fill="#d62828" opacity=".85"><title>' + r.month + ' charges ' + J(r.charges) + '</title></rect>';
      if (r.fees_interest) g += '<rect x="' + x + '" y="' + y(r.charges + r.fees_interest) + '" width="' + w + '" height="' + (y(r.charges) - y(r.charges + r.fees_interest)) + '" fill="#f59e0b"><title>' + r.month + ' interest and fees ' + J(r.fees_interest) + '</title></rect>';
      g += '<rect x="' + (x + w + 2) + '" y="' + y(r.payments) + '" width="' + w + '" height="' + (H - 24 - y(r.payments)) + '" fill="#16a34a" opacity=".85"><title>' + r.month + ' payments ' + J(r.payments) + '</title></rect>';
      g += '<text x="' + (x + w) + '" y="' + (H - 8) + '" font-size="11" text-anchor="middle" fill="currentColor">' + MONTHS[+r.month.slice(5)] + '</text>';
    });
    g += '<text x="4" y="' + (y(max) + 4) + '" font-size="11" fill="currentColor">' + Math.round(max).toLocaleString() + '</text><line x1="' + pad + '" x2="' + W + '" y1="' + (H - 24) + '" y2="' + (H - 24) + '" stroke="currentColor" opacity=".2"/>';
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Charges and payments by month">' + g + '</svg><p class="sub"><span style="color:#d62828">■</span> charges <span style="color:#f59e0b">■</span> interest and fees <span style="color:#16a34a">■</span> payments</p>';
  }

      wireCardSelect('ea', setup);
      $('#esave').onclick = function () {
        var b = {}; ['name', 'issuer', 'network', 'last4', 'holder_name', 'expires', 'credit_limit', 'cash_limit', 'apr', 'cash_apr', 'statement_day', 'due_day', 'min_pct', 'min_floor', 'annual_fee', 'fee_month', 'pay_from_account_id', 'autopay', 'status', 'rewards_kind', 'rewards_name', 'earn_rate', 'point_value', 'rewards_mode', 'rewards_start', 'notes'].forEach(function (k) { b[k] = $('#e_' + k).value; });
        api('/api/cards/' + card, 'PUT', b).then(function () { toast('Saved'); return loadCards(); }).then(setup).catch(function (e) { toast(e.message); });
      };
      all('[data-hs]').forEach(function (b) { b.onclick = function () { var i = b.getAttribute('data-hs'), h = det.holders[+i]; api('/api/cards/' + card + '/holders', 'POST', { id: h.id, name: $('[data-hn="' + i + '"]').value, last4: $('[data-h4="' + i + '"]').value, user_id: $('[data-hu="' + i + '"]').value, monthly_limit: $('[data-hl="' + i + '"]').value, is_active: $('[data-ha="' + i + '"]').checked }).then(function () { toast('Saved'); return loadCards(); }).then(setup).catch(function (e) { toast(e.message); }); }; });
      $('#hadd').onclick = function () { api('/api/cards/' + card + '/holders', 'POST', { name: $('#hn').value, last4: $('#h4').value, user_id: $('#hu').value, monthly_limit: $('#hl').value }).then(function () { toast('Added'); return loadCards(); }).then(setup).catch(function (e) { toast(e.message); }); };
      var wireRule = function () { all('[data-rx]').forEach(function (x) { x.onclick = function () { x.closest('tr').remove(); }; }); };
      $('#radd').onclick = function () { var t = document.createElement('tbody'); t.innerHTML = ruleRow('', 2); $('#rr').appendChild(t.firstChild); wireRule(); };
      wireRule();
      $('#rsave').onclick = function () { api('/api/cards/' + card + '/reward-rules', 'PUT', { rules: all('#rr tr').map(function (tr) { return { gl_account_id: tr.querySelector('[data-ra]').value, multiplier: tr.querySelector('[data-rm]').value }; }) }).then(function () { toast('Saved'); }).catch(function (e) { toast(e.message); }); };
      wireAdd();
    };
    function wireAdd() { $('#na').onclick = function () { api('/api/cards', 'POST', { code: $('#nc').value, name: $('#nn').value, issuer: $('#ni').value, last4: $('#n4').value, credit_limit: $('#nl').value }).then(function (r) { toast('Added'); pick(r.id); return B.loadAccounts(); }).then(loadCards).then(setup).catch(function (e) { toast(e.message); }); }; }
    function fld(k, l, v, type) { return '<div><label>' + l + '</label><input id="e_' + k + '" type="' + (type || 'text') + '"' + (type === 'number' ? ' step="any"' : '') + ' value="' + esc(v == null ? '' : v) + '"></div>'; }
    function sel(k, l, v, opts, lab) { return '<div><label>' + l + '</label><select id="e_' + k + '">' + opts.map(function (o) { return '<option value="' + o + '"' + (String(v == null ? '' : v) === String(o) ? ' selected' : '') + '>' + esc(lab ? lab(o) : (o || '—')) + '</option>'; }).join('') + '</select></div>'; }
    function staffOpts(sel2) { return '<option value="">—</option>' + (setup.staff || []).map(function (s) { return '<option value="' + s.id + '"' + (String(sel2) === String(s.id) ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join(''); }
    function ruleRow(acct, m) { return '<tr><td><select data-ra>' + B.accountOptions('line', acct) + '</select></td><td style="width:110px"><input data-rm type="number" step="0.5" value="' + m + '" style="width:80px">×</td><td style="width:40px"><button class="sm" data-rx>✕</button></td></tr>'; }
    var staffP = setup.staff ? Promise.resolve() : api('/api/cards/staff').then(function (d) { setup.staff = d.staff; }).catch(function () { setup.staff = []; });
    return staffP.then(function () { return cards.length ? api('/api/cards/' + card).then(go) : go(null); });
  }

  // ------------------------------------------------------------ tabs --
  var VIEWS = { home: home, reg: reg, charge: charge, pay: pay, stmt: stmt, feed: feed, rec: rec, rew: rew, rep: rep, setup: setup };
  function show() {
    all('#tabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tab); });
    try { history.replaceState(null, '', '#' + tab); } catch (_) {}
    var p = VIEWS[tab]();
    if (p && p.catch) p.catch(function (e) { $('#out').innerHTML = '<div class="card"><div class="note bad">' + esc(e.message) + '</div></div>'; });
  }
  all('#tabs button').forEach(function (b) { b.onclick = function () { tab = b.getAttribute('data-t'); show(); }; });
  var h = (location.hash || '').slice(1); if (VIEWS[h]) tab = h;
  B.loadAccounts().then(loadCards).then(show).catch(function (e) { $('#out').innerHTML = '<div class="card"><div class="note bad">' + esc(e.message) + '</div></div>'; });
})();
</script>
</body>
</html>
