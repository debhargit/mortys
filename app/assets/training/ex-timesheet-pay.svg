<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect width="860" height="330" rx="18" fill="#ffffff"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#0b1b2b">Example: from the time clock to a payslip</text>
  <text x="30" y="70" font-size="15" fill="#6b7280">Pay is worked out from approved hours; the till keeps the tax rates by date.</text>
  <g font-size="14" text-anchor="middle"><rect x="30" y="110" width="140" height="62" rx="12" fill="#0b1b2b"/><text x="100" y="137.5" fill="#fff" font-weight="700">Clock-ins</text><text x="100" y="154.5" fill="#cbd5e1" font-size="12">PIN, badge, face</text><line x1="174" y1="141" x2="196" y2="141" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="200" y="110" width="150" height="62" rx="12" fill="#eef2f7"/><text x="275" y="137.5" fill="#0b1b2b" font-weight="700">Timesheets</text><text x="275" y="154.5" fill="#6b7280" font-size="12">corrections approved</text><line x1="354" y1="141" x2="376" y2="141" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="380" y="110" width="150" height="62" rx="12" fill="#eef2f7" stroke="#0b1b2b"/><text x="455" y="137.5" fill="#0b1b2b" font-weight="700">Approve week</text><text x="455" y="154.5" fill="#6b7280" font-size="12">hours are frozen</text><line x1="534" y1="141" x2="556" y2="141" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="560" y="110" width="150" height="62" rx="12" fill="#eef2f7"/><text x="635" y="137.5" fill="#0b1b2b" font-weight="700">Pay run</text><text x="635" y="154.5" fill="#6b7280" font-size="12">gross, then deductions</text><line x1="714" y1="141" x2="736" y2="141" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="740" y="110" width="110" height="62" rx="12" fill="#d62828"/><text x="795" y="146" fill="#fff" font-weight="700">Payslips</text></g>
<text x="30" y="222" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">WORKED OUT BY PAYROLL</text><text x="30" y="248" font-size="13" fill="#6b7280">Employee: NIS, NHT, Education Tax and PAYE.  Employer: its share of NIS, NHT and Education Tax, and HEART.</text><text x="30" y="272" font-size="13" fill="#6b7280">Loans, advances and other deductions come off as set on the employee.</text><text x="30" y="304" font-size="13" fill="#d62828">Statutory deductions are paid to TAJ by the 14th of the next month (S01).</text>
</svg>
