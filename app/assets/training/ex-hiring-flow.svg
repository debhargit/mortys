<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect width="860" height="400" rx="18" fill="#ffffff"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#0b1b2b">Example: hiring one counter assistant, start to finish</text>
  <text x="30" y="70" font-size="15" fill="#6b7280">Every step is kept with who decided, when and why (📜 Decisions).</text>
<text x="30" y="108" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">FIND THE PEOPLE</text>  <g font-size="14" text-anchor="middle"><rect x="30" y="120" width="140" height="62" rx="12" fill="#0b1b2b"/><text x="100" y="147.5" fill="#fff" font-weight="700">Requisition</text><text x="100" y="164.5" fill="#cbd5e1" font-size="12">approved by a manager</text><line x1="174" y1="151" x2="196" y2="151" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="200" y="120" width="120" height="62" rx="12" fill="#eef2f7"/><text x="260" y="147.5" fill="#0b1b2b" font-weight="700">Posting</text><text x="260" y="164.5" fill="#6b7280" font-size="12">careers page</text><line x1="324" y1="151" x2="346" y2="151" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="350" y="120" width="130" height="62" rx="12" fill="#eef2f7"/><text x="415" y="147.5" fill="#0b1b2b" font-weight="700">Applications</text><text x="415" y="164.5" fill="#6b7280" font-size="12">auto reply + ref no.</text><line x1="484" y1="151" x2="506" y2="151" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="510" y="120" width="110" height="62" rx="12" fill="#eef2f7"/><text x="565" y="147.5" fill="#0b1b2b" font-weight="700">Screen</text><text x="565" y="164.5" fill="#6b7280" font-size="12">pass / maybe / fail</text><line x1="624" y1="151" x2="646" y2="151" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="650" y="120" width="130" height="62" rx="12" fill="#eef2f7"/><text x="715" y="156" fill="#0b1b2b" font-weight="700">Shortlist</text></g>
<text x="30" y="226" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">CHOOSE AND HIRE</text>  <g font-size="14" text-anchor="middle"><rect x="30" y="238" width="140" height="62" rx="12" fill="#eef2f7"/><text x="100" y="265.5" fill="#0b1b2b" font-weight="700">Interviews</text><text x="100" y="282.5" fill="#6b7280" font-size="12">panel scorecards 1-5</text><line x1="174" y1="269" x2="196" y2="269" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="200" y="238" width="120" height="62" rx="12" fill="#eef2f7"/><text x="260" y="265.5" fill="#0b1b2b" font-weight="700">Compare</text><text x="260" y="282.5" fill="#6b7280" font-size="12">best score first</text><line x1="324" y1="269" x2="346" y2="269" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="350" y="238" width="120" height="62" rx="12" fill="#eef2f7"/><text x="410" y="274" fill="#0b1b2b" font-weight="700">References</text><line x1="474" y1="269" x2="496" y2="269" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="500" y="238" width="150" height="62" rx="12" fill="#eef2f7" stroke="#0b1b2b"/><text x="575" y="265.5" fill="#0b1b2b" font-weight="700">Offer</text><text x="575" y="282.5" fill="#6b7280" font-size="12">approved, then accepted</text><line x1="654" y1="269" x2="676" y2="269" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="680" y="238" width="120" height="62" rx="12" fill="#d62828"/><text x="740" y="274" fill="#fff" font-weight="700">HIRE</text></g>
<text x="30" y="340" font-size="13" fill="#6b7280">Hire makes: the staff login (switched off until a manager sets role, password and PIN), the HR file,</text><text x="30" y="360" font-size="13" fill="#6b7280">a Payroll record (switched off) with the offered pay, the new-starter checklist, and files the offer letter.</text><text x="30" y="384" font-size="13" fill="#d62828">Rejected? The reason stays on file and is never sent to the applicant.</text>
</svg>
