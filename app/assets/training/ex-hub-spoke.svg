<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect width="860" height="400" rx="18" fill="#ffffff"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#0b1b2b">Example: "Can we get it?" for a part a store does not have</text>
  <text x="30" y="70" font-size="15" fill="#6b7280">Look in this order before telling a customer no.</text>
  <g font-size="14" text-anchor="middle"><rect x="30" y="112" width="150" height="62" rx="12" fill="#0b1b2b"/><text x="105" y="139.5" fill="#fff" font-weight="700">This store</text><text x="105" y="156.5" fill="#cbd5e1" font-size="12">on the shelf now</text><line x1="184" y1="143" x2="216" y2="143" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="220" y="112" width="170" height="62" rx="12" fill="#eef2f7"/><text x="305" y="139.5" fill="#0b1b2b" font-weight="700">Its hub</text><text x="305" y="156.5" fill="#6b7280" font-size="12">hot shot, about 2 hours</text><line x1="394" y1="143" x2="426" y2="143" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="430" y="112" width="210" height="62" rx="12" fill="#eef2f7"/><text x="535" y="139.5" fill="#0b1b2b" font-weight="700">Its distribution centre</text><text x="535" y="156.5" fill="#6b7280" font-size="12">today if before cut-off</text><line x1="644" y1="143" x2="676" y2="143" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/><rect x="680" y="112" width="190" height="62" rx="12" fill="#eef2f7" stroke="#0b1b2b"/><text x="775" y="139.5" fill="#0b1b2b" font-weight="700">Rest of the network</text><text x="775" y="156.5" fill="#6b7280" font-size="12">transfer</text></g>
  <g font-size="13" text-anchor="middle">
    <circle cx="430" cy="290" r="44" fill="#0b1b2b"/><text x="430" y="287" fill="#fff" font-weight="700">DC</text><text x="430" y="304" fill="#cbd5e1" font-size="11">cut-off + runs</text>
    <line x1="388" y1="296" x2="262" y2="300" stroke="#94a3b8" stroke-width="2"/><line x1="472" y1="296" x2="598" y2="300" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="225" cy="300" r="36" fill="#d62828"/><text x="225" y="297" fill="#fff" font-weight="700">Hub</text><text x="225" y="313" fill="#fff" font-size="11">3× stock</text>
    <circle cx="635" cy="300" r="36" fill="#d62828"/><text x="635" y="297" fill="#fff" font-weight="700">Hub</text><text x="635" y="313" fill="#fff" font-size="11">3× stock</text>
    <line x1="190" y1="290" x2="104" y2="262" stroke="#94a3b8" stroke-width="2"/><line x1="192" y1="314" x2="104" y2="350" stroke="#94a3b8" stroke-width="2"/>
    <line x1="670" y1="290" x2="756" y2="262" stroke="#94a3b8" stroke-width="2"/><line x1="668" y1="314" x2="756" y2="350" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="82" cy="256" r="24" fill="#eef2f7" stroke="#0b1b2b"/><text x="82" y="260" fill="#0b1b2b" font-size="11">spoke</text>
    <circle cx="82" cy="356" r="24" fill="#eef2f7" stroke="#0b1b2b"/><text x="82" y="360" fill="#0b1b2b" font-size="11">spoke</text>
    <circle cx="778" cy="256" r="24" fill="#eef2f7" stroke="#0b1b2b"/><text x="778" y="260" fill="#0b1b2b" font-size="11">spoke</text>
    <circle cx="778" cy="356" r="24" fill="#eef2f7" stroke="#0b1b2b"/><text x="778" y="360" fill="#0b1b2b" font-size="11">spoke</text>
  </g>
<text x="300" y="372" font-size="13" fill="#6b7280">A hub that fills a spoke is paid back at dealer cost.</text>
</svg>
