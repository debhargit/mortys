<style>

  .bar{position:relative;height:14px;border-radius:7px;background:var(--chip);overflow:hidden;margin:8px 0 4px}

  table.t{width:100%;border-collapse:collapse;font-size:14px}

  .r{text-align:right} .nowrap{white-space:nowrap}
  .tablewrap{overflow-x:auto}
  @media (max-width:760px){
    table.t.stack thead{display:none}
    table.t.stack tr{display:block;padding:8px 0;border-bottom:1px solid var(--line)}

    table.t.stack td::before{content:attr(data-h);color:var(--muted);font-size:12px}
  }
  .lines .ln{display:grid;grid-template-columns:52px 1fr auto;gap:4px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer;background:var(--card);align-items:center}
  .lines .ln:hover{border-color:var(--navy)} .lines .ln.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
  .lines .ln .s{font-size:12.5px;color:var(--muted)}
  .covtag{font-weight:800;font-size:13px;text-align:right;white-space:nowrap}
  .steps .st{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;margin-top:6px;align-items:end}
  .prev{display:flex;gap:4px;align-items:flex-end;height:110px;margin-top:8px}
  .prev div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:var(--muted)}
  .prev i{display:block;width:100%;border-radius:4px 4px 0 0;background:#16a34a}
  .prev i.p{background:#d97706} .prev i.x{background:#dc2626}
  .plan{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 10px}
  .plan:first-child{border-top:0}
  dialog{border:0;border-radius:14px;padding:0;max-width:640px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  dialog .dh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800}
  dialog .db{padding:14px 18px;max-height:70vh;overflow:auto} dialog .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;display:none;max-width:90vw;font-size:14px}
  .toast.bad{background:#b91c1c}
  #camWrap{display:none;margin:8px 0} #camWrap.on{display:block} #cam{max-width:420px;border-radius:10px;overflow:hidden}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
  .viewer.on{display:flex} .viewer img{max-width:100%;max-height:100%;border-radius:8px}
  .print-only{display:none}
  .terms{white-space:pre-wrap;font:14px/1.55 Georgia,"Times New Roman",serif;max-height:300px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
  .pad{position:relative;border:2px dashed #94a3b8;border-radius:12px;background:#fff;height:180px;touch-action:none}
  .pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .pad .hint{position:absolute;left:14px;bottom:8px;color:#94a3b8;font-size:12.5px;pointer-events:none}
  .pad .xl{position:absolute;left:14px;right:14px;bottom:30px;border-bottom:1px solid #cbd5e1;pointer-events:none}
  .sigimg{max-width:280px;max-height:110px;background:#fff;border:1px solid var(--line);border-radius:8px;display:block;margin:6px 0}
  .pill.waiting{background:#fef3c7;color:#92400e} .pill.signed{background:#dcfce7;color:#166534} .pill.uploaded{background:#dbeafe;color:#1e3a8a} .pill.void{background:#e5e7eb;color:#374151}
  .qr{background:#fff;padding:8px;border-radius:10px;display:inline-block;border:1px solid var(--line)} .qr svg,.qr img{display:block;width:200px;height:200px}
  dialog.wide{max-width:780px}
  @media print{
    @page{margin:12mm}
    body{background:#fff;color:#000;font-size:12.5px}
    header,.listpane,.actions,.noprint,.toast,dialog,.addph{display:none!important}
    .wrap{display:block;padding:0}
    .mainpane{display:block!important}
    .paper{border:1px solid #999;border-radius:0}
    .ph{background:#fff!important;color:#000!important;border-bottom:2px solid #000}
    .print-only{display:block}
    .sec{padding:8px 12px}
    .photos img{height:150px}
  }
</style>

<body>
<header>
  <div class="top">
    <a class="back noprint" id="backLink" href="/admin.html" title="Back office">‹</a>
    <h1>🛡 Warranty</h1>
    <span class="who" id="who"></span>
    <button class="primary" id="newBtn">+ New claim</button>
    <button class="ghost" id="popBtn" style="color:#fff;display:none" title="Open in its own window">↗ Own window</button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#claims" data-v="claims">Claims<b id="openCount" style="display:none"></b></a>
    <a href="#register" data-v="register">Sold under warranty</a>
    <a href="#rules" data-v="rules">Warranty rules</a>
  </nav>
</header>
<div class="wrap" id="wrap"></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"><div class="dh" id="dlgTitle"></div><div class="db" id="dlgBody"></div><div class="df" id="dlgFoot"></div></form></dialog>
<div class="toast" id="toast"></div>
<div class="viewer" id="viewer"><img id="viewerImg" alt=""></div>

<script src="/assets/vendor/html5-qrcode.min.js"></script>
<script src="/assets/vendor/qrcode-generator.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function api(url, opts){
    opts = opts || {}; opts.credentials = 'same-origin';
    if (opts.json !== undefined) { opts.method = opts.method || 'POST'; opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(opts.json); delete opts.json; }
    return fetch(url, opts).then(function(r){
      return r.text().then(function(t){ var j = {}; try { j = t ? JSON.parse(t) : {}; } catch (e) { j = { error: t }; }
        if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; });
    });
  }
  function money(n){ if (n == null || n === '') return '—'; return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fdate(d){ if (!d) return '—'; var x = new Date(String(d).length === 10 ? d + 'T12:00:00' : d); return isNaN(x) ? d : x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function wcNo(id){ return 'WC-' + String(id).padStart(5, '0'); }
  var T; function toast(m, bad){ var t = $('toast'); t.textContent = m; t.className = 'toast' + (bad ? ' bad' : ''); t.style.display = 'block'; clearTimeout(T); T = setTimeout(function(){ t.style.display = 'none'; }, 4200); }
  var STATUS = { open: 'Open', repair: 'Repair', replace: 'Replaced', refund: 'Refunded', denied: 'Turned down', closed: 'Closed' };
  var ID_TYPES = ['National ID', "Driver's licence", 'Passport', 'TRN', 'Other'];
  var DISPOSITIONS = ['back to supplier', 'back to maker', 'scrap', 'keep for testing', 'returned to customer'];
  var MAKER = { to_send: 'To send to maker', sent: 'Sent to maker', approved: 'Maker approved', rejected: 'Maker turned down', credited: 'Maker credited us' };
  function opts(list, sel, blank){ return (blank != null ? '<option value="">' + blank + '</option>' : '') + list.map(function(x){ var v = Array.isArray(x) ? x[0] : x, l = Array.isArray(x) ? x[1] : x; return '<option value="' + esc(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join(''); }
  // What a plan asks for before a claim is settled, in words.
  function needsText(t){ if (!t) return ''; var a = [];
    if (t.needs_id) a.push('customer ID'); if (t.needs_serial) a.push('serial no.'); if (t.needs_model) a.push('model no.'); if (t.needs_photo) a.push('photo'); if (t.return_old) a.push('old part back'); if (t.needs_signature) a.push('signed agreement');
    return a.join(', '); }
  var embedded = window.top !== window;
  if (embedded) { $('backLink').style.display = 'none'; $('popBtn').style.display = ''; }
  $('popBtn').onclick = function(){ window.open('/warranty.html' + location.hash, '_blank', 'noopener'); };

  // ---- the rule maths, the same as warranty.js on the server ----------------
  var DAY = 86400000;
  function ymd(d){ return d ? new Date(d).toISOString().slice(0, 10) : null; }
  function cleanTiers(t){
    return (Array.isArray(t) ? t : []).map(function(x){ return { upto_pct: Math.max(0, Math.min(100, Number(x.upto_pct))), pays_pct: Math.max(0, Math.min(100, Number(x.pays_pct))) }; })
      .filter(function(x){ return isFinite(x.upto_pct) && isFinite(x.pays_pct) && x.upto_pct > 0; }).sort(function(a, b){ return a.upto_pct - b.upto_pct; });
  }
  function payAt(terms, usedPct, usedDays){
    if (usedPct > 100) return 100;
    if (terms.method === 'prorated') return usedDays <= (Number(terms.free_days) || 0) ? 0 : Math.min(100, Math.round(usedPct));
    if (terms.method === 'tiered') { var t = cleanTiers(terms.tiers).find(function(x){ return usedPct <= x.upto_pct; }); return t ? t.pays_pct : 100; }
    return 0;
  }
  function coverText(c){
    if (!c || !c.known) return c && c.none ? 'No warranty on this part' : 'Cover not known';
    if (c.expired) return 'Warranty ended ' + fdate(c.until);
    if (c.pays_pct === 0) return 'Free replacement';
    if (c.pays_pct >= 100) return 'Not covered';
    return (100 - c.pays_pct) + '% off a replacement';
  }
  function coverClass(c){ return !c || !c.known ? 'info' : c.expired || c.pays_pct >= 100 ? 'bad' : c.pays_pct > 0 ? 'warn' : 'ok'; }
  function coverColor(c){ var k = coverClass(c); return k === 'ok' ? 'var(--ok)' : k === 'warn' ? 'var(--warn)' : k === 'bad' ? 'var(--bad)' : 'var(--muted)'; }
  // The period as a bar: green where it is free, amber where the customer pays part, a marker at today.
  function periodBar(terms, c){
    if (!c || !c.known) return '';
    var segs = [], prev = 0, steps = [];
    if (terms.method === 'tiered') steps = cleanTiers(terms.tiers);
    else if (terms.method === 'prorated') { var f = Math.round((Number(terms.free_days) || 0) / c.period_days * 100); steps = [{ upto_pct: Math.min(100, f), pays_pct: 0 }, { upto_pct: 100, pays_pct: 50 }]; }
    else steps = [{ upto_pct: 100, pays_pct: 0 }];
    steps.forEach(function(s){ if (s.upto_pct > prev) { segs.push('<span class="seg" style="left:' + prev + '%;width:' + (s.upto_pct - prev) + '%;background:' + (s.pays_pct === 0 ? '#16a34a' : s.pays_pct >= 100 ? '#dc2626' : '#d97706') + ';opacity:.55"></span>'); prev = s.upto_pct; } });
    if (prev < 100) segs.push('<span class="seg" style="left:' + prev + '%;width:' + (100 - prev) + '%;background:#dc2626;opacity:.55"></span>');
    return '<div class="bar">' + segs.join('') + '<span class="now" style="left:calc(' + Math.min(100, c.used_pct) + '% - 1px)"></span></div>' +
      '<div class="barlab"><span>Sold ' + fdate(c.sold_on) + '</span><span>Day ' + c.used_days + ' of ' + c.period_days + ' (' + c.used_pct + '%)</span><span>Ends ' + fdate(c.until) + '</span></div>';
  }

  // ---- state + routing ---------------------------------------------------------
  var meta = { plans: [], categories: [], counts: [] };
  var st = { view: 'claims', status: 'open', mine: false, q: '', claimId: null, claims: [], regFilter: 'active', regQ: '' };
  function route(){
    var h = (location.hash || '#claims').slice(1), parts = h.split('/');
    st.view = parts[0] || 'claims';
    [].forEach.call(document.querySelectorAll('#tabs a'), function(a){ a.classList.toggle('on', a.dataset.v === (st.view === 'claim' || st.view === 'new' ? 'claims' : st.view)); });
    if (st.view === 'claim') { st.claimId = parseInt(parts[1], 10); return showClaims(); }
    if (st.view === 'new') return showNew(parts[1] ? parseInt(parts[1], 10) : null);
    if (st.view === 'register') return showRegister();
    if (st.view === 'rules') return showRules();
    st.claimId = null; showClaims();
  }
  window.addEventListener('hashchange', route);
  $('newBtn').onclick = function(){ location.hash = '#new'; };
  function loadMeta(){
    return api('/api/admin/warranty/meta').then(function(m){
      meta = m;
      var open = (m.counts.find(function(x){ return x.status === 'open'; }) || {}).n || 0;
      $('openCount').textContent = open; $('openCount').style.display = open ? '' : 'none';
    });
  }

  // ================================================================== claims ==
  function showClaims(){
    var w = $('wrap'); w.className = 'wrap two' + (st.claimId ? ' detail' : '');
    if (!$('clist')) {
      w.innerHTML = '<div class="listpane"><div class="card"><div class="chips" id="chips"></div>' +
        '<div class="search"><input id="cq" placeholder="Search claim no., part, serial, customer, receipt"></div><div id="clist"><div class="empty">Loading…</div></div></div></div>' +
        '<div class="mainpane" id="main"></div>';
      $('cq').value = st.q;

  function wirePhotoAdder(onFiles){
    [].forEach.call(document.querySelectorAll('.addph input[type=file]'), function(inp){
      inp.onchange = function(){
        var files = [].slice.call(inp.files || []); inp.value = '';
        if (!files.length) return;
        var m = $('phMsg'); if (m) m.textContent = 'Uploading ' + files.length + '…';
        Promise.resolve(onFiles(files, inp.dataset.kind)).then(function(){ if (m) m.textContent = ''; }).catch(function(e){ if (m) m.textContent = ''; toast(e.message, true); });
      };

  // Phone pictures are big: shrink to 1600px JPEG before sending (scans keep more detail).
  function shrink(file, kind){
    return new Promise(function(resolve){
      if (!/^image\/(jpe?g|png|webp)$/i.test(file.type) || file.size < 400000) return resolve(file);
      var max = kind === 'scan' ? 2400 : 1600, img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){
        var s = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
        cv.toBlob(function(b){ resolve(b ? new File([b], (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }) : file); }, 'image/jpeg', 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }
  function uploadPhotos(claimId, files, kind){
    return Promise.all(files.map(function(f){ return shrink(f, kind); })).then(function(fs){
      var fd = new FormData(); fd.append('kind', kind || 'photo');
      fs.forEach(function(f){ fd.append('photos', f, f.name || 'photo.jpg'); });
      return api('/api/admin/warranty/claims/' + claimId + '/photos', { method: 'POST', body: fd });
    });
  }

          .then(function(){ $('dlg').close(); editPlan(meta.plans.find(function(x){ return x.id === p.id; })); }).catch(function(e){ toast(e.message, true); }); };
      if ($('plDocDel')) $('plDocDel').onclick = async function(){ if (!(await vasConfirm('Take the document off this plan? Agreements already made keep their copy.'))) return;
        api('/api/admin/warranty/plans/' + p.id + '/agreement-file', { method: 'DELETE' }).then(function(){ return loadMeta(); })
          .then(function(){ $('dlg').close(); editPlan(meta.plans.find(function(x){ return x.id === p.id; })); }).catch(function(e){ toast(e.message, true); }); };
    }
    function read(){
      return { name: $('plName').value.trim(), method: (document.querySelector('[name=plM]:checked') || {}).value || 'full', period_days: $('plDays').value, free_days: $('plFree').value,
        tiers: tiers, price_basis: $('plBasis').value, remedy: $('plRemedy').value, max_claims: $('plMax').value, labour_covered: $('plLab').checked, needs_photo: $('plPhoto').checked,
        notes: $('plNotes').value.trim(), is_default: $('plDef').checked, active: $('plOn').checked,
        needs_id: $('plNeedId').checked, needs_serial: $('plNeedSerial').checked, needs_model: $('plNeedModel').checked, return_old: $('plRetOld').checked,
        maker_warranty: $('plMaker').checked, maker_name: $('plMakerName').value.trim(), assign_to: $('plAsg').value || null,
        needs_signature: $('plSign').checked, agreement_text: $('plAgText').value.trim() };
    }
    function steps(){
      var m = read().method;
      $('plFreeBox').style.visibility = m === 'prorated' ? '' : 'hidden';
      $('plSteps').style.display = m === 'tiered' ? '' : 'none';
      $('plSteps').innerHTML = '<label class="l">Steps</label>' + tiers.map(function(t, i){
        return '<div class="st"><div><span class="note">Up to (% of period)</span><input type="number" min="1" max="100" value="' + t.upto_pct + '" data-tu="' + i + '"></div>' +
          '<div><span class="note">Customer pays (% of replacement)</span><input type="number" min="0" max="100" value="' + t.pays_pct + '" data-tp="' + i + '"></div>' +
          '<button type="button" class="sm ghost" data-trm="' + i + '" title="Remove">✕</button></div>';
      }).join('') + '<button type="button" class="sm" id="plAdd" style="margin-top:6px">+ Add a step</button>';
      [].forEach.call($('plSteps').querySelectorAll('[data-tu]'), function(x){ x.oninput = function(){ tiers[+x.dataset.tu].upto_pct = +x.value; preview(); }; });
      [].forEach.call($('plSteps').querySelectorAll('[data-tp]'), function(x){ x.oninput = function(){ tiers[+x.dataset.tp].pays_pct = +x.value; preview(); }; });
      [].forEach.call($('plSteps').querySelectorAll('[data-trm]'), function(x){ x.onclick = function(){ tiers.splice(+x.dataset.trm, 1); steps(); }; });
      $('plAdd').onclick = function(){ var last = tiers.length ? tiers[tiers.length - 1].upto_pct : 0; tiers.push({ upto_pct: Math.min(100, last + 25), pays_pct: 50 }); steps(); };
      preview();
    }
    function preview(){
      var b = read(), days = parseInt(b.period_days, 10) || 365;
      var pts = [5, 15, 25, 35, 45, 55, 65, 75, 85, 95, 100];
      $('plPrev').innerHTML = pts.map(function(pct){
        var pays = payAt(b, pct, Math.round(days * pct / 100));
        var cls = pays === 0 ? '' : pays >= 100 ? 'x' : 'p';
        return '<div title="' + pct + '% through: customer pays ' + pays + '%"><span>' + pays + '%</span><i class="' + cls + '" style="height:' + Math.max(3, 100 - pays) * 0.8 + 'px"></i><span>' + pct + '%</span></div>';
      }).join('');
      api('/api/admin/warranty/preview', { json: Object.assign({}, b, { period_days: days }) }).then(function(r){ $('plRule').textContent = r.rule + '. Bars: how much the shop covers; the number on top is what the customer pays.'; }).catch(function(){});
    }
    [].forEach.call(document.querySelectorAll('[name=plM]'), function(x){ x.onchange = steps; });
    $('plDays').oninput = preview; $('plFree').oninput = preview;
    steps();
  }

  // ============================================================ agreements ==
  // WARRANTY-AGREE: the agreement for a sold part (or a claim): sign on this
  // screen, on the customer's phone (QR code / email link), or upload the
  // signed paper copy.
  var AGS = { waiting: 'Not signed', signed: 'Signed', uploaded: 'Paper copy', void: 'Cancelled' };
  function agreementHtml(c){
    var list = (c.agreements || []).filter(function(a){ return a.status !== 'void'; });
    var a = list[0];
    var need = c.terms && c.terms.needs_signature;
    return '<div class="sec"><h3>Warranty agreement' + (need ? ' · the plan needs it signed' : '') + '</h3><div class="actions">' +
      (a ? '<span class="pill ' + a.status + '">' + AGS[a.status] + '</span>' + (a.signed_name ? ' <span>' + esc(a.signed_name) + (a.signed_at ? ', ' + fdate(a.signed_at) + (a.signed_via === 'link' ? ' on their phone' : ' at the counter') : '') + '</span>' : '')
        : '<span class="note">' + (need ? '⚠ Not made yet. The claim cannot be settled until it is signed.' : 'None yet.') + '</span>') +
      '<span style="flex:1"></span><button type="button" class="sm navy noprint" id="agBtn">📝 ' + (a ? 'Open the agreement' : 'Make and sign') + '</button></div></div>';
  }
  function sigPad(canvas){
    var ctx = canvas.getContext('2d'), down = false, has = false, last = null;
    function size(){ var r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1; canvas.width = Math.round(r.width * d); canvas.height = Math.round(r.height * d);
      ctx.setTransform(d, 0, 0, d, 0, 0); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0b1b2b'; ctx.fillStyle = '#0b1b2b'; has = false; }
    size();
    function pt(e){ var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    canvas.addEventListener('pointerdown', function(e){ down = true; last = pt(e); try { canvas.setPointerCapture(e.pointerId); } catch (x) {} ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, 7); ctx.fill(); has = true; e.preventDefault(); });
    canvas.addEventListener('pointermove', function(e){ if (!down) return; var p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; has = true; e.preventDefault(); });
    ['pointerup', 'pointercancel'].forEach(function(n){ canvas.addEventListener(n, function(){ down = false; }); });
    return { clear: size, empty: function(){ return !has; }, png: function(){ return canvas.toDataURL('image/png'); } };
  }
  function qrSvg(text){
    if (typeof qrcode !== 'function') return '';
    try { var q = qrcode(0, 'M'); q.addData(text); q.make(); return '<div class="qr">' + q.createSvgTag(5, 2) + '</div>'; } catch (e) { return ''; }
  }
  // Make (or fetch) the agreement for a sold part / claim, then show it.
  function openAgreement(src, after){
    api('/api/admin/warranty/agreements', { json: src }).then(function(r){ agView(r.agreement.id, after); }).catch(function(e){ toast(e.message, true); });
  }
  function agView(id, after){
    api('/api/admin/warranty/agreements/' + id).then(function(r){
      var a = r.agreement, base = r.base, signed = a.status === 'signed';
      var who = signed ? '<div class="box" style="margin-top:10px"><b>Signed by ' + esc(a.signed_name) + '</b> · ' + esc(a.signed_local || '') + ' · ' + (a.signed_via === 'link' ? 'on their own phone' : 'at the counter' + (a.witness_name ? ', with ' + esc(a.witness_name) : '')) +
          '<img class="sigimg" src="' + esc(a.signature_url) + '" alt="signature"><div class="note" style="word-break:break-all">Fingerprint: ' + esc(a.doc_hash) + '</div></div>' : '';
      var paper = a.file_url ? '<div class="box" style="margin-top:10px">📎 Signed paper copy: <a href="' + esc(a.file_url) + '" target="_blank" rel="noopener">' + esc(a.file_name || 'open') + '</a>' + (a.file_by_name ? ' <span class="note">added by ' + esc(a.file_by_name) + '</span>' : '') + '</div>' : '';
      var hist = (a.history || []).slice().reverse().map(function(h){ return '<div class="note">' + esc(new Date(h.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) + ' · ' + esc(h.what) + (h.to ? ' (' + esc(h.to) + ')' : '') + '</div>'; }).join('');
      var body = '<div class="actions" style="margin-bottom:8px"><span class="pill ' + a.status + '">' + AGS[a.status] + '</span><b>WA-' + String(a.id).padStart(5, '0') + '</b><span class="note">' + esc(a.customer_name || '') + (a.customer_email ? ' · ' + esc(a.customer_email) : '') + '</span></div>' +
        '<div class="terms">' + esc(a.body) + '</div>' +
        (a.doc_url ? '<div style="margin-top:8px"><a href="' + esc(a.doc_url) + '" target="_blank" rel="noopener">📄 ' + esc(a.doc_name || 'The plan\'s document') + '</a></div>' : '') +
        who + paper +
        (a.status === 'void' ? '<div class="banner info" style="margin-top:10px">Cancelled: ' + esc(a.void_reason || '') + '</div>' : '') +
        (hist ? '<details style="margin-top:10px"><summary class="note">History</summary>' + hist + '</details>' : '');
      var b = [{ label: '🖨 Print', go: function(){ window.open('/api/admin/warranty/agreements/' + a.id + '/copy', '_blank', 'noopener'); return false; } }];
      if (a.status !== 'void') {
        if (!signed) {
          b.push({ label: '📎 Upload signed copy', go: function(){ agUpload(a, after); return false; } });
          b.push({ label: '📱 Sign on their phone', cls: 'navy', go: function(){ agLink(a, base, after); return false; } });
          b.push({ label: '✍ Sign here', cls: 'go', go: function(){ agSign(a, after); return false; } });
        } else {
          b.push({ label: '✉ Email them a copy', go: async function(){ return api('/api/admin/warranty/agreements/' + a.id + '/email-copy', { json: { email: a.customer_email || (await vasPrompt('Customer email')) || '' } })
            .then(function(x){ toast(x.email.outcome === 'sent' ? 'Copy emailed.' : 'Not sent: ' + (x.email.error || x.email.outcome), x.email.outcome !== 'sent'); return false; }); } });
          if (!a.file_url) b.push({ label: '📎 Add paper copy', go: function(){ agUpload(a, after); return false; } });
        }
        b.unshift({ label: 'Cancel it', cls: 'ghost', go: async function(){ var why = await vasPrompt('Why is this agreement being cancelled? (wrong customer, wrong part…)'); if (!why) return false;
          return api('/api/admin/warranty/agreements/' + a.id + '/void', { json: { reason: why } }).then(function(){ toast('Agreement cancelled.'); if (after) after(); }); } });
      }
      dialog('Warranty agreement · ' + (a.title || '').replace(/^Warranty agreement · /, ''), body, b, true);
    }).catch(function(e){ toast(e.message, true); });
  }
  function agSign(a, after){
    dialog('Sign: ' + (a.customer_name || 'customer'),
      '<div class="note" style="margin-bottom:6px">Hand the screen to the customer. They read the terms, type their name and sign.</div>' +
      '<div class="terms" style="max-height:200px">' + esc(a.body) + '</div>' +
      '<label class="l" style="margin-top:10px">Customer\'s full name</label><input id="sgName" value="' + esc(a.customer_name || '') + '" autocomplete="off">' +
      '<label class="l" style="margin-top:10px">Signature</label><div class="pad"><canvas id="sgPad"></canvas><div class="xl"></div><div class="hint">✍ Sign above the line</div></div>' +
      '<div class="actions" style="margin-top:6px"><label style="flex:1"><input type="checkbox" id="sgOk"> I have read the warranty terms and I accept them.</label><button type="button" class="sm ghost" id="sgClr">Clear</button></div>' +
      (a.customer_email ? '<label class="note"><input type="checkbox" id="sgMail" checked> Email a signed copy to ' + esc(a.customer_email) + '</label>' : ''),
      [{ label: '‹ Back', cls: 'ghost', go: function(){ agView(a.id, after); return false; } },
       { label: '✓ Sign the agreement', cls: 'go', go: function(){
        if ($('sgName').value.trim().length < 2) { toast('Type the customer\'s full name', true); return false; }
        if (pad.empty()) { toast('Sign in the box first', true); return false; }
        if (!$('sgOk').checked) { toast('Tick the box to say the terms were read and accepted', true); return false; }
        return api('/api/admin/warranty/agreements/' + a.id + '/sign', { json: { name: $('sgName').value.trim(), signature: pad.png(), agree: true, email_copy: $('sgMail') ? $('sgMail').checked : false } })
          .then(function(){ toast('Signed.'); if (after) after(); agView(a.id, after); return false; });
      } }], true);
    var pad = sigPad($('sgPad'));
    $('sgClr').onclick = pad.clear;
  }
  function agLink(a, base, after){
    api('/api/admin/warranty/agreements/' + a.id + '/link', { json: {} }).then(function(r){
      var lan = /^http:\/\/(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|[a-z0-9\-]+(:\d+)?$)/i.test(base);
      dialog('Sign on their own phone',
        '<div class="grid2" style="align-items:start"><div style="text-align:center">' + qrSvg(r.url) + '<div class="note" style="margin-top:6px">The customer scans this with their phone camera.</div></div>' +
        '<div><label class="l">Or send the link by email</label><input id="lkMail" type="email" value="' + esc(a.customer_email || '') + '" placeholder="name@example.com">' +
          '<button type="button" class="sm navy" id="lkSend" style="margin-top:6px">✉ Email the link</button>' +
          '<label class="l" style="margin-top:12px">The link</label><input id="lkUrl" value="' + esc(r.url) + '" readonly><button type="button" class="sm" id="lkCopy" style="margin-top:6px">Copy</button>' +
          '<div class="note" style="margin-top:8px">Works for ' + r.expires_days + ' days, once. Making a new link stops this one.</div>' +
          (lan ? '<div class="banner warn" style="margin-top:8px;margin-bottom:0;font-size:13px">This link uses the shop\'s own network address, so it only opens on a phone on the shop Wi-Fi. A manager can set the public web address in Warranty rules › Warranty agreement.</div>' : '') +
        '</div></div>',
        [{ label: '‹ Back', cls: 'ghost', go: function(){ agView(a.id, after); return false; } },
         { label: 'Check if signed', go: function(){ return api('/api/admin/warranty/agreements/' + a.id).then(function(x){ if (x.agreement.status === 'signed') { toast('Signed by ' + x.agreement.signed_name + '.'); if (after) after(); agView(a.id, after); } else toast('Not signed yet.'); return false; }); } }], true);
      $('lkCopy').onclick = function(){ $('lkUrl').select(); try { navigator.clipboard.writeText(r.url); } catch (e) { document.execCommand('copy'); } toast('Link copied.'); };
      $('lkSend').onclick = function(){ var em = $('lkMail').value.trim(); if (!em) return toast('Type the customer\'s email', true);
        api('/api/admin/warranty/agreements/' + a.id + '/link', { json: { send_email: true, email: em } }).then(function(x){
          $('lkUrl').value = x.url; var q = document.querySelector('#dlgBody .qr'); if (q) q.outerHTML = qrSvg(x.url);
          toast(x.email && x.email.outcome === 'sent' ? 'Link emailed to ' + em + '.' : 'Not emailed: ' + ((x.email && x.email.error) || 'email not set up') + '. Show them the QR code instead.', !(x.email && x.email.outcome === 'sent'));
        }).catch(function(e){ toast(e.message, true); }); };
    }).catch(function(e){ toast(e.message, true); });
  }
  function agUpload(a, after){
    dialog('Upload the signed paper copy',
      '<div class="note">Print the agreement (🖨 Print), have the customer sign it, then scan it or take a photo of each page. A PDF works too.</div>' +
      '<label class="l" style="margin-top:10px">Signed by</label><input id="upName" value="' + esc(a.signed_name || a.customer_name || '') + '">' +
      '<div class="addph"><label class="btn">📷 Take a photo<input type="file" id="upCam" accept="image/*" capture="environment"></label><label class="btn">📄 Pick a file (PDF / picture)<input type="file" id="upFile" accept="application/pdf,image/*"></label></div>',
      [{ label: '‹ Back', cls: 'ghost', go: function(){ agView(a.id, after); return false; } }], true);
    var send = function(f){ if (!f) return; var fd = new FormData(); fd.append('file', f); fd.append('signed_name', $('upName').value.trim());
      api('/api/admin/warranty/agreements/' + a.id + '/file', { method: 'POST', body: fd }).then(function(){ toast('Signed copy saved.'); if (after) after(); agView(a.id, after); }).catch(function(e){ toast(e.message, true); }); };
    $('upCam').onchange = function(){ send(this.files[0]); };
    $('upFile').onchange = function(){ send(this.files[0]); };
  }
  // ---- the standard wording + the address links use (Warranty rules) ------------
  function loadAgreeSettings(){
    var can = meta.can_rules;
    api('/api/admin/warranty/agreement-settings').then(function(r){
      var s = r.settings, dis = can ? '' : ' disabled';
      $('agCard').innerHTML = '<div style="padding:12px 14px;border-bottom:1px solid var(--line)"><b>Warranty agreement</b> <span class="note">the standard wording customers sign; a plan can have its own</span></div>' +
        '<div style="padding:12px 14px"><textarea id="agText" rows="14" style="font:13.5px/1.5 Georgia,serif"' + dis + '>' + esc(s.text || r.default_text) + '</textarea>' +
        '<div class="note" style="margin-top:4px">Fill-ins: ' + r.placeholders.map(function(x){ return '{' + x + '}'; }).join(' ') + '. A line whose fill-ins are all empty (say no serial number) is left out.</div>' +
        '<div class="grid2" style="margin-top:10px"><div><label class="l">Web address for signing links</label><input id="agBase" value="' + esc(s.public_base || '') + '" placeholder="e.g. https://till.visionautosolutions.com"' + dis + '>' +
          '<div class="note">Blank: the address this screen is open on. Use the public address so links open on the customer\'s own phone data.</div></div>' +
        '<div class="note" style="align-self:end">Already-made agreements keep the wording they were made with.</div></div></div>' +
        (can ? '<div style="padding:0 14px 12px" class="actions"><button type="button" class="primary sm" id="agSave">Save the wording</button><button type="button" class="sm ghost" id="agReset">Back to the standard wording</button></div>' : '');
      if (!can) return;
      $('agSave').onclick = function(){ api('/api/admin/warranty/agreement-settings', { method: 'PUT', json: { text: $('agText').value, public_base: $('agBase').value.trim() } }).then(function(){ toast('Saved.'); }).catch(function(e){ toast(e.message, true); }); };
      $('agReset').onclick = function(){ $('agText').value = r.default_text; };
    }).catch(function(e){ $('agCard').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }

  // ---- start ----------------------------------------------------------------------
  api('/api/me').then(function(d){ var u = d && (d.user || d); if (u && u.name) $('who').textContent = u.name; }).catch(function(){});
  loadMeta().then(route).catch(function(e){ $('wrap').innerHTML = '<div class="card empty" style="grid-column:1/-1">' + esc(e.message) + (/sign in/i.test(e.message) ? ' <a href="/admin.html">Sign in</a>' : '') + '</div>'; });
})();
</script>
