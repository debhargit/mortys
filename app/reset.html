<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password · Vision Auto Solutions</title>
<link rel="icon" href="/favicon.svg?v=vision2" type="image/svg+xml">
<style>
  :root{--red:#d61f2b;--ink:#111827;--muted:#6b7280;--line:#e5e7eb}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0c;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
  .card{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  h1{font-size:20px;margin:0 0 4px} p.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input{width:100%;font-size:16px;padding:12px;border:1px solid #d1d5db;border-radius:10px}
  button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--red);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6} .err{color:var(--red);font-size:14px;margin-top:10px;min-height:1.2em}
  .ok{color:#16a34a;font-size:14px;margin-top:10px} a{color:var(--red)}
  .logo{width:48px;height:48px;margin-bottom:10px}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/favicon.svg" alt="">
  <h1>Reset your password</h1>
  <p class="sub" id="sub">Checking your link…</p>
  <div id="form" style="display:none">
    <label for="p1">New password</label>
    <input id="p1" type="password" autocomplete="new-password" placeholder="At least 8 characters">
    <label for="p2">Repeat new password</label>
    <input id="p2" type="password" autocomplete="new-password">
    <button id="go">Set my new password</button>
  </div>
  <div class="err" id="err"></div>
  <p style="margin-top:16px;font-size:13px"><a href="/account.html">◀ Back to sign in</a></p>
</div>
<script>
'use strict';
var $ = function (s) { return document.querySelector(s); };
var token = new URLSearchParams(location.search).get('token') || '';
function api(url, method, body) {
  return fetch(url, { method: method || 'GET', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; }); });
}
if (!token) { $('#sub').textContent = 'This link is missing its code. Ask for a new reset email.'; }
else api('/api/auth/reset-check?token=' + encodeURIComponent(token)).then(function (r) {
  $('#sub').textContent = 'Set a new password for ' + r.email + '.';
  $('#form').style.display = 'block'; $('#p1').focus();
}).catch(function (e) { $('#sub').textContent = e.message; });
$('#go').onclick = function () {
  var p1 = $('#p1').value, p2 = $('#p2').value, err = $('#err'); err.textContent = '';
  if (p1.length < 8) { err.textContent = 'Use at least 8 characters.'; return; }
  if (p1 !== p2) { err.textContent = 'The two passwords do not match.'; return; }
  $('#go').disabled = true;
  api('/api/auth/reset', 'POST', { token: token, password: p1 }).then(function () {
    err.className = 'ok'; err.textContent = 'Done! Signing you in…';
    setTimeout(function () { location.href = '/account.html'; }, 1200);
  }).catch(function (e) { err.textContent = e.message; $('#go').disabled = false; });
};
</script>
</body>
</html>
