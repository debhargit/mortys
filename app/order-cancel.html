<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Cancelled · Morty's Auto Parts</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f6f7f9;color:#0f1720;line-height:1.55;min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:#fff;max-width:480px;width:100%;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.08);overflow:hidden;text-align:center}
  .head{background:linear-gradient(135deg,#6b7280,#374151);color:#fff;padding:32px 24px}
  .head .ring{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;margin:0 auto 14px;font-size:36px}
  .head h1{margin:0;font-size:22px;font-weight:800}
  .head p{margin:6px 0 0;opacity:.92;font-size:14px}
  .body{padding:24px;text-align:left}
  .body p{margin:0 0 12px;font-size:14px;color:#374151}
  .order-num{background:#fef3c7;color:#92400e;padding:12px 14px;border-radius:8px;font-size:13px;text-align:center;margin:14px 0 18px}
  .cta{display:block;width:100%;background:#d62828;color:#fff;text-align:center;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;margin-top:6px}
  .cta:hover{background:#a31f1f}
  .ghost{display:block;text-align:center;color:#6b7280;font-size:13px;margin-top:10px;text-decoration:none}
  .ghost:hover{color:#0b1b2b}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="ring">×</div>
      <h1>Payment cancelled</h1>
      <p>No charge was made.</p>
    </div>
    <div class="body">
      <div class="order-num" id="orderNum">Your order is on hold — no payment received.</div>
      <p>You can try again, or pay by cash at pickup or by bank transfer. Call us at <b>(876) 758-5590</b> if you'd like help.</p>
      <a href="/" class="cta">Back to shop</a>
      <a href="https://wa.me/18767585590?text=Hi%2C%20I%27d%20like%20help%20completing%20my%20order." target="_blank" rel="noopener" class="ghost">Or message us on WhatsApp →</a>
    </div>
  </div>
  <script>
    var m = location.search.match(/order=(\d+)/);
    if (m) document.getElementById('orderNum').textContent = 'Order #' + m[1] + ' is on hold — no payment received.';
  </script>
</body>
</html>
