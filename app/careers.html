<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Careers · Vision Auto Solutions</title>
<meta name="description" content="Work with Vision Auto Solutions, Kingston: open jobs and how to apply.">
<style>
  :root{ --red:#d62828; --navy:#0b1b2b; --ink:#0f1720; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ok:#16a34a; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--navy);color:#fff;padding:22px 16px} header .in{max-width:820px;margin:0 auto} header h1{margin:0 0 4px;font-size:26px} header p{margin:0;opacity:.85} header a{color:#fff}
  main{max-width:820px;margin:0 auto;padding:16px 16px 50px}
  .job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .job h2{margin:0;font-size:19px} .meta{color:var(--muted);font-size:14px;margin:2px 0 8px}
  .job details summary{cursor:pointer;color:var(--red);font-weight:600}
  .pre{white-space:pre-wrap}
  label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
  button{font:inherit;padding:11px 18px;border-radius:9px;border:0;background:var(--red);color:#fff;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6}
  .check{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:14px} .check input{width:auto;margin-top:4px}
  .ok{background:#16a34a18;border-left:3px solid var(--ok);padding:10px 12px;border-radius:8px}
  .err{color:var(--red);font-size:14px;min-height:1em}
  .hp{position:absolute;left:-9999px}
  .empty{color:var(--muted);text-align:center;padding:30px}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<header><div class="in"><h1>Work with us</h1><p>Vision Auto Solutions · Kingston, Jamaica · <a href="/">Back to the shop</a></p></div></header>
<main id="m"><div class="empty">Loading open jobs…</div></main>
<script>
(function () {
  'use strict';
  var m = document.getElementById('m');
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var KIND = { full_time: 'Full time', part_time: 'Part time', contract: 'Contract', freelance_rep: 'Freelance sales rep (commission)' };
  fetch('/api/public/jobs').then(function (r) { return r.json(); }).then(function (d) {
    if (!d.jobs || !d.jobs.length) { m.innerHTML = '<div class="empty">No openings right now. Please check back soon.</div>'; return; }
    m.innerHTML = d.jobs.map(function (j) {
      return '<div class="job"><h2>' + esc(j.title) + '</h2><div class="meta">' + esc([KIND[j.kind] || j.kind, j.department, j.location, j.pay].filter(Boolean).join(' · ')) + (j.closes_on ? ' · apply by ' + esc(new Date(j.closes_on).toLocaleDateString('en-JM')) : '') + '</div>' +
        (j.summary ? '<p>' + esc(j.summary) + '</p>' : '') +
        '<details><summary>Details and apply</summary>' + (j.description ? '<h3>The job</h3><div class="pre">' + esc(j.description) + '</div>' : '') + (j.requirements ? '<h3>What you need</h3><div class="pre">' + esc(j.requirements) + '</div>' : '') +
        '<form data-job="' + j.id + '" novalidate><h3>Apply</h3>' +
        '<label>Full name</label><input name="name" autocomplete="name" required><label>Email</label><input name="email" type="email" autocomplete="email" required><label>Phone</label><input name="phone" type="tel" autocomplete="tel" required>' +
        '<label>Parish</label><input name="parish"><label>Why you, in a few lines (optional)</label><textarea name="cover" rows="4"></textarea>' +
        '<label>CV (PDF or Word, up to 5 MB, optional)</label><input name="cv" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">' +
        '<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">' +
        '<label class="check"><input type="checkbox" name="consent" value="yes"> <span>' + esc(d.consent) + '</span></label>' +
        '<p class="err" role="alert"></p><button type="submit">Send application</button></form></details></div>';
    }).join('');
    Array.prototype.forEach.call(m.querySelectorAll('form[data-job]'), function (f) {
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var errEl = f.querySelector('.err'), btn = f.querySelector('button');
        errEl.textContent = '';
        if (!f.consent.checked) { errEl.textContent = 'Please tick the box to agree to us keeping your application.'; return; }
        var file = f.cv.files[0];
        if (file && file.size > 5 * 1024 * 1024) { errEl.textContent = 'The CV must be 5 MB or smaller.'; return; }
        btn.disabled = true; btn.textContent = 'Sending…';
        fetch('/api/public/jobs/' + f.getAttribute('data-job') + '/apply', { method: 'POST', body: new FormData(f) })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Could not send'); return j; }); })
          .then(function (r) { f.outerHTML = '<div class="ok">' + esc(r.message) + '</div>'; })
          .catch(function (er) { errEl.textContent = er.message; btn.disabled = false; btn.textContent = 'Send application'; });
      });
    });
  }).catch(function () { m.innerHTML = '<div class="empty">Could not load the jobs. Please try again later.</div>'; });
})();
</script>
</body>
</html>
