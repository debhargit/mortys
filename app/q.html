<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your quote · Vision Auto Solutions</title>
<meta name="robots" content="noindex">
<style>
  :root{ --red:#d62828; --navy:#0b1b2b; --ink:#0f1720; --muted:#6b7280; --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ok:#16a34a; }
  @media (prefers-color-scheme: dark){ :root{ --ink:#e5e7eb; --muted:#9ca3af; --bg:#0e141b; --card:#16202b; --line:#253241; } }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--navy);color:#fff;padding:14px 16px} header h1{font-size:17px;margin:0}
  main{max-width:640px;margin:0 auto;padding:14px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  table{width:100%;border-collapse:collapse} td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top} td.n{text-align:right;white-space:nowrap}
  tr.t td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
  .sub{color:var(--muted);font-size:14px}
  button{font:inherit;width:100%;padding:13px;border-radius:10px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:17px;cursor:pointer}
  button:disabled{opacity:.6}
  .ok{color:var(--ok);font-weight:700}
</style>
<link rel="icon" href="/favicon.svg?v=vision2" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v=vision2" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico?v=vision2" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=vision2">
<script src="/assets/vas-ui.js?v=20261110b"></script>
</head>
<body>
<header><h1 id="shop">Vision Auto Solutions</h1></header>
<main id="m"><div class="card sub">Loading your quote…</div></main>
<script>
(function () {
  'use strict';
  var m = document.getElementById('m');
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var J = function (v) { return 'J$' + Number(v || 0).toLocaleString('en-JM', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var t = new URLSearchParams(location.search).get('t') || '';
  function err(msg) { m.innerHTML = '<div class="card"><p>' + esc(msg) + '</p></div>'; }
  fetch('/api/public/q/' + encodeURIComponent(t)).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Not found'); return j; }); }).then(function (q) {
    document.getElementById('shop').textContent = q.shop;
    var done = q.accepted || q.status !== 'open';
    m.innerHTML = '<div class="card"><p>' + (q.name ? 'Hi ' + esc(q.name) + ', here' : 'Here') + ' is quote <b>' + esc(q.number) + '</b>' + (q.rep ? ' from ' + esc(q.rep) : '') + '.</p>' +
      '<table>' + q.items.map(function (i) { return '<tr><td>' + esc(i.description) + '<br><span class="sub">' + i.qty + ' × ' + J(i.unit_price) + '</span></td><td class="n">' + J(i.total) + '</td></tr>'; }).join('') +
      (q.discount ? '<tr><td>Discount</td><td class="n">−' + J(q.discount) + '</td></tr>' : '') + '<tr><td>GCT</td><td class="n">' + J(q.tax) + '</td></tr><tr class="t"><td>Total</td><td class="n">' + J(q.total) + '</td></tr></table>' +
      (q.valid_until ? '<p class="sub">Valid until ' + esc(new Date(q.valid_until).toLocaleDateString('en-JM')) + '.</p>' : '') + '</div>' +
      '<div class="card" id="act">' + (done ? '<p class="ok">This quote has been accepted. Thank you.</p>' :
        '<p>Tap <b>Accept</b> and the shop will get your parts ready. You pay when you collect' + (q.phone ? ' (questions? call ' + esc(q.phone) + ')' : '') + '.</p><button id="acc">Accept this quote</button>') + '</div>';
    var b = document.getElementById('acc');
    if (b) b.onclick = function () {
      b.disabled = true;
      fetch('/api/public/q/' + encodeURIComponent(t) + '/accept', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Could not accept'); return j; }); })
        .then(function (r) { document.getElementById('act').innerHTML = '<p class="ok">Accepted. Your order is ' + esc(r.order) + '.</p><p>The shop will get it ready. Pay ' + J(r.total) + ' when you collect, within ' + r.days + ' days.</p>'; })
        .catch(async function (e) { b.disabled = false; await vasAlert(e.message); });
    };
  }).catch(function (e) { err(e.message); });
})();
</script>
</body>
</html>
